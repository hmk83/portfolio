<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>컬러 드라이브 - 레이싱 모드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 귀여운 폰트 추가 -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* [Core Reset & Safe Area] */
        :root {
            --gnb-height: 60px;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #222;
            font-family: 'Jua', sans-serif;
            user-select: none;
            touch-action: none;
            height: 100vh;
            width: 100vw;
        }

        /* [GNB Styles] */
        #gnb {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--gnb-height);
            background-color: #FEE500;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* [Game Area Layout] */
        #game-wrapper {
            position: absolute;
            top: var(--gnb-height);
            left: 0;
            width: 100vw;
            height: calc(100vh - var(--gnb-height));
            overflow: hidden;
            position: relative;
        }

        canvas {
            display: block;
        }

        /* UI 레이어 */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        /* 상단 점수판 */
        #score-bar-container {
            width: 70%;
            height: 28px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            border: 3px solid white;
            margin-top: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            pointer-events: auto;
            backdrop-filter: blur(4px);
        }

        .score-segment {
            height: 100%;
            transition: width 0.3s linear;
        }

        #info-panel {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-top: 8px;
        }

        .hud-badge {
            background: rgba(255, 255, 255, 0.9);
            padding: 5px 18px;
            border-radius: 25px;
            color: #333;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.1);
            border: 2px solid #fff;
        }

        #timer {
            color: #FF4136;
            min-width: 90px;
            text-align: center;
        }

        /* 미니맵 */
        #minimap-container {
            position: absolute;
            top: 80px;
            right: 20px;
            width: 120px;
            height: 120px;
            background: rgba(0, 0, 0, 0.5);
            border: 3px solid white;
            border-radius: 20px;
            z-index: 10;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        #minimap {
            width: 100%;
            height: 100%;
        }

        /* --- 새로운 컨트롤 스타일 --- */
        .control-group {
            position: absolute;
            bottom: 30px;
            display: flex;
            gap: 15px;
            z-index: 50;
            pointer-events: auto;
        }

        #ctrl-left {
            left: 30px;
            align-items: flex-end;
        }

        #ctrl-right {
            right: 30px;
            align-items: flex-end;
        }

        .d-btn {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 32px;
            touch-action: none;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.2);
            transition: transform 0.1s;
        }

        .d-btn:active,
        .d-btn.active {
            background: rgba(255, 255, 255, 0.6);
            color: #333;
            transform: scale(0.95);
            box-shadow: none;
        }

        /* 페달 스타일 특화 */
        .pedal-btn {
            border-radius: 20px;
            width: 80px;
            height: 80px;
            font-size: 24px;
            font-weight: bold;
        }

        .btn-gas {
            background: rgba(46, 204, 64, 0.5);
            border-color: #2ECC40;
            height: 90px;
        }

        .btn-gas:active,
        .btn-gas.active {
            background: #2ECC40;
        }

        .btn-reverse {
            background: rgba(255, 65, 54, 0.4);
            border-color: #FF4136;
            font-size: 20px;
            height: 70px;
        }

        .btn-reverse:active,
        .btn-reverse.active {
            background: #FF4136;
        }


        /* 모달 (스타트, 결과, 도움말, 종료) */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 50;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            backdrop-filter: blur(3px);
            pointer-events: auto;
            transition: opacity 0.3s;
        }

        #help-modal,
        #game-over-modal {
            z-index: 70;
            background: rgba(0, 0, 0, 0.85);
        }

        #modal-exit {
            z-index: 80;
        }

        .hidden {
            display: none !important;
        }

        .rank-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 12px 24px;
            margin: 6px;
            border-radius: 15px;
            width: 320px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-size: 20px;
        }

        /* 스타트 버튼 스타일 */
        #start-btn,
        #restart-btn {
            padding: 15px 60px;
            font-size: 28px;
            font-family: 'Jua', sans-serif;
            background: #FF4136;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 0 #c0392b;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        #start-btn:active,
        #restart-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #c0392b;
        }

        #start-btn:hover,
        #restart-btn:hover {
            background: #ff5e55;
        }

        /* 충돌 메시지 */
        #collision-msg {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 60px;
            font-weight: 900;
            color: #FFF;
            text-shadow: 3px 3px 0px #FF4136, 6px 6px 0px rgba(0, 0, 0, 0.2);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.1s;
            z-index: 30;
            font-family: 'Jua', sans-serif;
        }

        /* 타이틀 스타일 */
        .title-text {
            font-size: 80px;
            color: white;
            text-shadow: 4px 4px 0 #FF4136, 8px 8px 0 #FF851B, 12px 12px 0 rgba(0, 0, 0, 0.2);
            animation: bounce 2s infinite;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .subtitle-text {
            font-size: 24px;
            color: #FFDC00;
            margin-top: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            background: rgba(0, 0, 0, 0.4);
            padding: 5px 15px;
            border-radius: 20px;
        }

        /* Common Animation */
        .btn-press {
            transition: transform 0.1s;
        }

        .btn-press:active {
            transform: scale(0.95);
        }

        .modal-enter {
            animation: modalFadeIn 0.3s forwards;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* TTS Interactive Style */
        .tts-clickable {
            cursor: pointer;
            transition: all 0.2s;
        }

        .tts-clickable:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            transform: scale(1.02);
        }

        .tts-clickable:active {
            transform: scale(0.98);
        }
    </style>
</head>

<body>

    <!-- [1. GNB] -->
    <nav id="gnb">
        <div class="flex items-center gap-2">
            <h1
                class="text-xl md:text-2xl font-bold text-gray-800 whitespace-nowrap overflow-hidden text-ellipsis max-w-[50vw]">
                🎨 <span>컬러 드라이브</span>
            </h1>
        </div>
        <div class="flex gap-2">
            <!-- Toggle Controls (Moved to GNB) -->
            <button id="btn-toggle-ctrl"
                class="bg-white border-2 border-gray-200 text-gray-600 rounded-full px-4 py-1 text-sm font-bold shadow-sm hover:bg-gray-50 btn-press">
                컨트롤 켜짐
            </button>
            <!-- Restart (Moved to GNB) -->
            <button id="btn-restart"
                class="bg-green-500 text-white rounded-full px-4 py-1 text-sm font-bold shadow-sm hover:bg-green-600 btn-press">
                다시하기
            </button>
            <!-- Exit -->
            <button id="btn-exit"
                class="bg-gray-600 text-white rounded-full px-4 py-1 text-sm font-bold shadow-sm hover:bg-gray-700 btn-press">
                종료
            </button>
        </div>
    </nav>

    <!-- [2. Game Wrapper] -->
    <div id="game-wrapper">
        <!-- UI 레이어 -->
        <div id="ui-layer">
            <div id="score-bar-container">
                <div id="bar-p1" class="score-segment"></div>
                <div id="bar-ai1" class="score-segment"></div>
                <div id="bar-ai2" class="score-segment"></div>
                <div id="bar-ai3" class="score-segment"></div>
            </div>
            <div id="info-panel">
                <div class="hud-badge" id="timer">⏱ 100</div>
                <div class="hud-badge" id="score-text">0.0%</div>
            </div>
        </div>

        <!-- 좌측 컨트롤 (핸들) -->
        <div id="ctrl-left" class="control-group">
            <div class="d-btn" id="btn-left" data-key="ArrowLeft">◀</div>
            <div class="d-btn" id="btn-right" data-key="ArrowRight">▶</div>
        </div>

        <!-- 우측 컨트롤 (페달) -->
        <div id="ctrl-right" class="control-group">
            <div class="d-btn pedal-btn btn-reverse" id="btn-down" data-key="ArrowDown">후진</div>
            <div class="d-btn pedal-btn btn-gas" id="btn-up" data-key="ArrowUp">엑셀</div>
        </div>

        <div id="collision-msg">쾅!!</div>

        <div id="minimap-container">
            <canvas id="minimap"></canvas>
        </div>

        <!-- 1. 스타트 화면 -->
        <div id="start-modal" class="modal-overlay">
            <h1 class="title-text">컬러 드라이브</h1>
            <p class="subtitle-text">주은쌤과 함께 도시를 색칠해보세요! 🚗💨</p>
            <div class="flex gap-4 items-center mt-8">
                <button id="start-btn">운전 시작!</button>
                <button id="btn-help"
                    class="w-16 h-16 rounded-full bg-yellow-400 border-4 border-white text-white text-3xl font-bold shadow-lg btn-press flex items-center justify-center transform transition hover:scale-110"
                    title="게임 방법">
                    ?
                </button>
            </div>
        </div>

        <!-- 2. 도움말 모달 -->
        <div id="help-modal" class="modal-overlay hidden">
            <div class="bg-white p-8 rounded-3xl border-4 border-yellow-400 text-center max-w-md shadow-2xl">
                <h2 class="text-4xl font-bold text-gray-800 mb-6 flex items-center justify-center gap-2">
                    게임 방법 <i data-lucide="volume-2" class="w-8 h-8 text-blue-500"></i>
                </h2>
                <!-- TTS Clickable Area -->
                <ul class="text-left text-gray-700 space-y-4 mb-8 text-xl tts-clickable p-4 rounded-xl border border-transparent hover:border-gray-200"
                    onclick="speak('게임 방법. 왼손으로 방향을 조절하고, 오른손으로 엑셀과 후진을 해요. 운전하며 땅을 예쁘게 칠하는 게 목표예요. 친구 차를 쿵! 박으면 공격할 수 있어요. 100초 동안 신나게 달려봐요!')">
                    <li>🎮 <b>왼손:</b> 방향 조절 (◀ / ▶)</li>
                    <li>🦶 <b>오른손:</b> 엑셀 / 후진</li>
                    <li>🎨 <b>목표:</b> 운전하며 땅을 예쁘게 칠해요!</li>
                    <li>💥 <b>공격:</b> 친구 차를 쿵! 박으면 펑~</li>
                    <li>⏱ <b>시간:</b> 100초 동안 신나게!</li>
                </ul>
                <button onclick="closeHelp()"
                    class="px-8 py-3 bg-blue-500 text-white rounded-full font-bold text-xl hover:bg-blue-600 shadow-lg">알겠어요!</button>
            </div>
        </div>

        <!-- 3. 결과 화면 -->
        <div id="game-over-modal" class="modal-overlay hidden">
            <h1 id="game-result-title" class="text-5xl font-black text-white mb-8 text-center px-4"
                style="text-shadow: 0 4px 0 #FF4136; line-height: 1.4;">GAME OVER</h1>
            <div id="rank-list" class="flex flex-col mb-8"></div>
            <button id="restart-btn">한 번 더!</button>
        </div>

        <!-- 4. 종료 확인 모달 -->
        <div id="modal-exit" class="hidden fixed inset-0 bg-black/50 z-[20000] flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl p-8 w-[80%] max-w-lg shadow-2xl relative modal-enter text-center">
                <h3 class="text-3xl font-bold text-gray-800 mb-4">정말 종료할까요?</h3>
                <p class="text-xl text-gray-500 mb-8">진행 상황이 저장되지 않아요.</p>
                <div class="flex justify-center gap-4">
                    <button id="btn-cancel-exit"
                        class="bg-gray-200 text-gray-700 text-xl px-6 py-3 rounded-full hover:bg-gray-300">아니요</button>
                    <button id="btn-confirm-exit"
                        class="bg-red-500 text-white text-xl px-6 py-3 rounded-full hover:bg-red-600">네, 종료해요</button>
                </div>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        /** 사운드 매니저 **/
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        // --- TTS System ---
        const GOOGLE_API_KEY = "AIzaSyAE0nnpOYZRfLkfM09O3NQjpWnN1kUqR3E";
        let ttsAudio = null;
        let googleTTSAvailable = true;
        let availableVoices = [];

        function loadVoices() {
            availableVoices = window.speechSynthesis.getVoices();
        }
        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices();

        function stopTTS() {
            if (ttsAudio) {
                ttsAudio.pause();
                ttsAudio.currentTime = 0;
                ttsAudio = null;
            }
            window.speechSynthesis.cancel();
        }

        async function speak(text) {
            stopTTS();
            if (!text) return;

            // Audio Context Resume required for browser autoplay policies
            if (audioCtx.state === 'suspended') audioCtx.resume();

            if (!googleTTSAvailable) {
                fallbackSpeak(text);
                return;
            }

            const langCode = 'ko-KR';
            const voiceName = 'ko-KR-Standard-A';

            try {
                const response = await fetch(`https://texttospeech.googleapis.com/v1/text:synthesize?key=${GOOGLE_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        input: { text: text },
                        voice: { languageCode: langCode, name: voiceName },
                        audioConfig: { audioEncoding: 'MP3' }
                    })
                });

                if (!response.ok) throw new Error(`API Error: ${response.status}`);

                const data = await response.json();
                if (data.audioContent) {
                    const audioBlob = await fetch(`data:audio/mp3;base64,${data.audioContent}`).then(res => res.blob());
                    const audioUrl = URL.createObjectURL(audioBlob);
                    ttsAudio = new Audio(audioUrl);
                    ttsAudio.play().catch(e => console.error("Audio Playback Error:", e));
                } else {
                    fallbackSpeak(text);
                }
            } catch (e) {
                console.warn("Google TTS failed:", e);
                googleTTSAvailable = false;
                fallbackSpeak(text);
            }
        }

        function fallbackSpeak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ko-KR';
            utterance.rate = 0.9;

            if (availableVoices.length === 0) availableVoices = window.speechSynthesis.getVoices();

            const koVoice = availableVoices.find(v => v.name.includes('Google 한국어') || v.lang === 'ko-KR');
            if (koVoice) utterance.voice = koVoice;

            window.speechSynthesis.speak(utterance);
        }

        // --- Game Sound ---
        const Sound = {
            playTone: (freq, type, duration, vol = 0.1) => {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            },
            playCrash: () => {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const bufferSize = audioCtx.sampleRate * 0.5;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const gain = audioCtx.createGain();
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass'; filter.frequency.value = 800;
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
                noise.start();
            },
            playStart: () => {
                Sound.playTone(523.25, 'sine', 0.1, 0.2); // 도
                setTimeout(() => Sound.playTone(659.25, 'sine', 0.1, 0.2), 100); // 미
                setTimeout(() => Sound.playTone(783.99, 'sine', 0.3, 0.2), 200); // 솔
            },
            engineOsc: null,
            engineGain: null,
            startEngine: () => {
                if (Sound.engineOsc) return;
                Sound.engineOsc = audioCtx.createOscillator();
                Sound.engineGain = audioCtx.createGain();
                Sound.engineOsc.type = 'sawtooth';
                Sound.engineOsc.frequency.value = 50;
                Sound.engineGain.gain.value = 0.05;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass'; filter.frequency.value = 200;
                Sound.engineOsc.connect(filter); filter.connect(Sound.engineGain);
                Sound.engineGain.connect(audioCtx.destination);
                Sound.engineOsc.start();
            },
            updateEngine: (speed) => {
                if (Sound.engineOsc) {
                    const baseFreq = 60;
                    const speedFactor = Math.abs(speed) * 15;
                    Sound.engineOsc.frequency.setTargetAtTime(baseFreq + speedFactor, audioCtx.currentTime, 0.1);
                    Sound.engineGain.gain.setTargetAtTime(0.02 + (Math.abs(speed) * 0.005), audioCtx.currentTime, 0.1);
                }
            }
        };

        /** 설정 **/
        const TILE_SIZE = 40;
        const MAP_WIDTH_TILES = 40;
        const MAP_HEIGHT_TILES = 40;
        const WORLD_WIDTH = MAP_WIDTH_TILES * TILE_SIZE;
        const WORLD_HEIGHT = MAP_HEIGHT_TILES * TILE_SIZE;
        const GAME_DURATION = 100;

        const COLORS = [
            { id: 0, name: '빨강 (나)', hex: '#FF4136', tail: 'rgba(255, 65, 54, 0.6)' },
            { id: 1, name: '파랑', hex: '#0074D9', tail: 'rgba(0, 116, 217, 0.6)' },
            { id: 2, name: '초록', hex: '#2ECC40', tail: 'rgba(46, 204, 64, 0.6)' },
            { id: 3, name: '노랑', hex: '#FFDC00', tail: 'rgba(255, 220, 0, 0.6)' }
        ];

        let mapGrid = [];
        let buildings = [];
        let particles = [];
        let cars = [];
        let player;
        let keys = {};

        let totalTiles = 0;
        let scores = [0, 0, 0, 0];
        let timeLeft = GAME_DURATION;
        let isGameActive = false;
        let isDemoMode = true; // 인트로 데모 모드
        let cameraShake = 0;
        let timerInterval = null;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const minimapCanvas = document.getElementById('minimap');
        const minimapCtx = minimapCanvas.getContext('2d');
        const collisionMsg = document.getElementById('collision-msg');

        /** 파티클 시스템 **/
        class Particle {
            constructor(x, y, color, speed, angle, life, size = null) {
                this.x = x; this.y = y; this.color = color;
                this.life = life; this.maxLife = life;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.size = size ? size : Math.random() * 3 + 2;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                this.life--; this.size *= 0.95;
            }
            draw(ctx) {
                ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        /** 자동차 클래스 (귀여운 디자인 적용) **/
        class Car {
            constructor(id, x, y, isPlayer = false) {
                this.id = id; this.x = x; this.y = y;
                this.angle = Math.random() * Math.PI * 2;
                this.speed = 0;
                this.maxSpeed = isPlayer ? 7 : 6;
                this.acceleration = 0.2; this.friction = 0.96;
                this.turnSpeed = 0.08; this.radius = 14; // 조금 더 통통하게
                this.isPlayer = isPlayer; this.color = COLORS[id];
                this.turnTimer = 0; this.targetAngle = this.angle;
                this.collisionCooldown = 0;
            }

            update() {
                // 게임 중이 아니면 데모 모드일 때만 업데이트
                if (!isGameActive && !isDemoMode) return;

                if (this.collisionCooldown > 0) this.collisionCooldown--;

                if (this.isPlayer && isGameActive) {
                    this.handlePlayerInput();
                    Sound.updateEngine(this.speed);
                } else {
                    // 데모 모드거나 AI
                    this.handleAI();
                }

                this.speed *= this.friction;
                const vx = Math.cos(this.angle) * this.speed;
                const vy = Math.sin(this.angle) * this.speed;

                this.moveWithCollision(vx, vy);

                this.x = Math.max(this.radius, Math.min(WORLD_WIDTH - this.radius, this.x));
                this.y = Math.max(this.radius, Math.min(WORLD_HEIGHT - this.radius, this.y));

                this.paint(this.x, this.y, 1);

                if (Math.abs(this.speed) > 2 && Math.random() < 0.3) {
                    particles.push(new Particle(this.x, this.y, 'rgba(255,255,255,0.6)', Math.random(), this.angle + Math.PI + (Math.random() - 0.5), 20));
                }
            }

            handlePlayerInput() {
                if (keys['ArrowUp'] || keys['w']) this.speed += this.acceleration;
                if (keys['ArrowDown'] || keys['s']) this.speed -= this.acceleration;

                if (Math.abs(this.speed) > 0.1) {
                    const direction = this.speed > 0 ? 1 : -1;
                    if (keys['ArrowLeft'] || keys['a']) this.angle -= this.turnSpeed * direction;
                    if (keys['ArrowRight'] || keys['d']) this.angle += this.turnSpeed * direction;
                }
            }

            handleAI() {
                this.speed += this.acceleration;
                if (this.speed > this.maxSpeed) this.speed = this.maxSpeed;

                this.turnTimer--;
                if (this.turnTimer <= 0) {
                    this.targetAngle += (Math.random() - 0.5) * 3;
                    this.turnTimer = 20 + Math.random() * 40;
                }

                const lookAheadDist = 80;
                const nextX = this.x + Math.cos(this.angle) * lookAheadDist;
                const nextY = this.y + Math.sin(this.angle) * lookAheadDist;

                if (nextX < 0 || nextX > WORLD_WIDTH || nextY < 0 || nextY > WORLD_HEIGHT || this.checkBuildingHit(nextX, nextY)) {
                    this.angle += 0.3;
                } else {
                    const diff = this.targetAngle - this.angle;
                    this.angle += diff * 0.1;
                }
            }

            checkBuildingHit(x, y) {
                for (let b of buildings) {
                    if (x > b.x && x < b.x + b.w && y > b.y && y < b.y + b.h) return true;
                }
                return false;
            }

            moveWithCollision(vx, vy) {
                let nextX = this.x + vx;
                let nextY = this.y + vy;
                let hitX = false, hitY = false;

                for (let b of buildings) {
                    if (this.rectCircleColliding(b, nextX, this.y, this.radius)) { hitX = true; this.onWallCollision(); break; }
                }
                if (!hitX) this.x = nextX;

                for (let b of buildings) {
                    if (this.rectCircleColliding(b, this.x, nextY, this.radius)) { hitY = true; if (!hitX) this.onWallCollision(); break; }
                }
                if (!hitY) this.y = nextY;
                if (hitX || hitY) this.speed *= 0.5;
            }

            onWallCollision() {
                // 데모 모드나 AI는 그냥 회전
                if (!this.isPlayer || isDemoMode) {
                    this.angle += Math.PI; this.targetAngle += Math.PI;
                } else {
                    cameraShake = 5;
                    Sound.playTone(100, 'sawtooth', 0.1, 0.1);
                    for (let i = 0; i < 5; i++) particles.push(new Particle(this.x, this.y, '#FFF', Math.random() * 2, Math.random() * Math.PI * 2, 15));
                }
            }

            rectCircleColliding(rect, circleX, circleY, radius) {
                let distX = Math.abs(circleX - rect.x - rect.w / 2);
                let distY = Math.abs(circleY - rect.y - rect.h / 2);
                if (distX > (rect.w / 2 + radius)) return false;
                if (distY > (rect.h / 2 + radius)) return false;
                if (distX <= (rect.w / 2)) return true;
                if (distY <= (rect.h / 2)) return true;
                let dx = distX - rect.w / 2;
                let dy = distY - rect.h / 2;
                return (dx * dx + dy * dy <= (radius * radius));
            }

            paint(cx, cy, range) {
                const tx = Math.floor(cx / TILE_SIZE);
                const ty = Math.floor(cy / TILE_SIZE);
                for (let dy = -range; dy <= range; dy++) {
                    for (let dx = -range; dx <= range; dx++) {
                        if (dx * dx + dy * dy > range * range) continue;
                        const targetX = tx + dx;
                        const targetY = ty + dy;
                        if (targetX >= 0 && targetX < MAP_WIDTH_TILES && targetY >= 0 && targetY < MAP_HEIGHT_TILES) {
                            if (mapGrid[targetY][targetX] !== 9) mapGrid[targetY][targetX] = this.id;
                        }
                    }
                }
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // 그림자 (둥글게)
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.beginPath();
                ctx.ellipse(0, 0, 18, 12, 0, 0, Math.PI * 2);
                ctx.fill();

                // 차체 (귀여운 둥근 모양)
                ctx.fillStyle = this.color.hex;
                ctx.beginPath();
                ctx.roundRect(-16, -12, 32, 24, 10);
                ctx.fill();

                // 지붕 (조금 더 밝게)
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.beginPath();
                ctx.roundRect(-8, -10, 16, 20, 5);
                ctx.fill();

                // 앞 유리
                ctx.fillStyle = '#C4E5F2';
                ctx.beginPath();
                ctx.roundRect(4, -8, 6, 16, 2);
                ctx.fill();

                // 눈 (헤드라이트) - 귀여움 포인트
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(14, -6, 3.5, 0, Math.PI * 2); // 왼쪽 눈
                ctx.arc(14, 6, 3.5, 0, Math.PI * 2);  // 오른쪽 눈
                ctx.fill();

                // 눈동자
                ctx.fillStyle = '#333';
                ctx.beginPath();
                ctx.arc(15, -6, 1.5, 0, Math.PI * 2);
                ctx.arc(15, 6, 1.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();

                if (this.isPlayer && isGameActive) {
                    ctx.fillStyle = 'white'; ctx.beginPath();
                    ctx.moveTo(this.x, this.y - 35); ctx.lineTo(this.x - 8, this.y - 45); ctx.lineTo(this.x + 8, this.y - 45); ctx.fill();
                    ctx.fillStyle = 'white'; ctx.font = 'bold 16px Jua'; ctx.textAlign = 'center';
                    ctx.shadowColor = "black"; ctx.shadowBlur = 4;
                    ctx.fillText("나!", this.x, this.y - 50);
                    ctx.shadowBlur = 0;
                }
            }
        }

        /** 메인 시스템 **/
        function init() {
            lucide.createIcons(); // 아이콘 생성
            setupExitModal(); // 종료 모달 셋업

            window.addEventListener('resize', resize);
            resize();

            // 키보드 입력
            window.addEventListener('keydown', e => keys[e.key] = true);
            window.addEventListener('keyup', e => keys[e.key] = false);

            // UI 버튼 이벤트
            document.getElementById('start-btn').addEventListener('click', startGame);
            document.getElementById('restart-btn').addEventListener('click', () => location.reload());
            document.getElementById('btn-restart').addEventListener('click', () => location.reload());
            document.getElementById('btn-help').addEventListener('click', () => {
                document.getElementById('help-modal').classList.remove('hidden');
                stopTTS(); // 모달 열 때 기존 음성 정지
                speak('게임 방법. 왼손으로 방향을 조절하고, 오른손으로 엑셀과 후진을 해요. 운전하며 땅을 예쁘게 칠하는 게 목표예요. 친구 차를 쿵! 박으면 공격할 수 있어요. 100초 동안 신나게 달려봐요!');
            });

            // 컨트롤 토글
            const ctrlBtn = document.getElementById('btn-toggle-ctrl');
            const leftCtrl = document.getElementById('ctrl-left');
            const rightCtrl = document.getElementById('ctrl-right');

            let showCtrl = true;
            if (!/Mobi|Android/i.test(navigator.userAgent)) {
                showCtrl = false;
                leftCtrl.style.display = 'none';
                rightCtrl.style.display = 'none';
                ctrlBtn.style.opacity = '0.7';
                ctrlBtn.innerText = "컨트롤 꺼짐";
            } else {
                leftCtrl.style.display = 'flex';
                rightCtrl.style.display = 'flex';
                ctrlBtn.innerText = "컨트롤 켜짐";
            }

            ctrlBtn.addEventListener('click', () => {
                showCtrl = !showCtrl;
                const display = showCtrl ? 'flex' : 'none';
                leftCtrl.style.display = display;
                rightCtrl.style.display = display;
                ctrlBtn.style.opacity = showCtrl ? '1' : '0.7';
                ctrlBtn.innerText = showCtrl ? "컨트롤 켜짐" : "컨트롤 꺼짐";
            });

            // 터치 컨트롤 로직
            const touchBtns = document.querySelectorAll('.d-btn');
            touchBtns.forEach(btn => {
                const key = btn.dataset.key;
                if (!key) return;
                const press = (e) => { e.preventDefault(); keys[key] = true; btn.classList.add('active'); };
                const release = (e) => { e.preventDefault(); keys[key] = false; btn.classList.remove('active'); };
                btn.addEventListener('mousedown', press); btn.addEventListener('mouseup', release);
                btn.addEventListener('mouseleave', release); btn.addEventListener('touchstart', press); btn.addEventListener('touchend', release);
            });

            initMap();
            // 데모 모드 시작 (배경에서 차들이 돌아다님)
            isDemoMode = true;
            spawnCars(true); // AI만 생성
            requestAnimationFrame(gameLoop);
        }

        function setupExitModal() {
            const exitModal = document.getElementById('modal-exit');
            const btnExit = document.getElementById('btn-exit');
            const btnCancel = document.getElementById('btn-cancel-exit');
            const btnConfirm = document.getElementById('btn-confirm-exit');

            btnExit.onclick = () => {
                exitModal.classList.remove('hidden');
                Sound.playTone(800, 'triangle', 0.1);
            };

            btnCancel.onclick = () => {
                exitModal.classList.add('hidden');
                Sound.playTone(800, 'triangle', 0.1);
            };

            btnConfirm.onclick = () => {
                if (window.history.length > 1) {
                    window.history.back();
                } else {
                    window.close();
                }
            };
        }

        function closeHelp() {
            document.getElementById('help-modal').classList.add('hidden');
            stopTTS();
        }

        function startGame() {
            document.getElementById('start-modal').classList.add('hidden');
            stopTTS();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            Sound.playStart();
            Sound.startEngine();

            isDemoMode = false;
            // 게임 초기화
            initMap();
            spawnCars(false); // 플레이어 + AI 생성
            startTimer();
            isGameActive = true;
        }

        function initMap() {
            mapGrid = []; buildings = []; totalTiles = 0;
            for (let y = 0; y < MAP_HEIGHT_TILES; y++) {
                let row = [];
                for (let x = 0; x < MAP_WIDTH_TILES; x++) row.push(-1);
                mapGrid.push(row);
            }
            const buildingCount = 20;
            for (let i = 0; i < buildingCount; i++) {
                let w = (Math.floor(Math.random() * 4) + 2) * TILE_SIZE;
                let h = (Math.floor(Math.random() * 4) + 2) * TILE_SIZE;
                let x = Math.floor(Math.random() * (MAP_WIDTH_TILES - w / TILE_SIZE)) * TILE_SIZE;
                let y = Math.floor(Math.random() * (MAP_HEIGHT_TILES - h / TILE_SIZE)) * TILE_SIZE;
                let height = Math.random() * 30 + 20;
                let colorBase = Math.random() > 0.5 ? '#95a5a6' : '#bdc3c7'; // 밝은 회색톤
                buildings.push({ x, y, w, h, height, colorBase });
                let tx = x / TILE_SIZE, ty = y / TILE_SIZE, tw = w / TILE_SIZE, th = h / TILE_SIZE;
                for (let by = ty; by < ty + th; by++) for (let bx = tx; bx < tx + tw; bx++) mapGrid[by][bx] = 9;
            }
            for (let y = 0; y < MAP_HEIGHT_TILES; y++) for (let x = 0; x < MAP_WIDTH_TILES; x++) if (mapGrid[y][x] !== 9) totalTiles++;
        }

        function spawnCars(onlyAI = false) {
            cars = [];
            function getSafeSpawn() {
                let safe = false, x, y;
                while (!safe) {
                    x = Math.random() * (WORLD_WIDTH - 200) + 100;
                    y = Math.random() * (WORLD_HEIGHT - 200) + 100;
                    safe = true;
                    for (let b of buildings) if (x > b.x - 30 && x < b.x + b.w + 30 && y > b.y - 30 && y < b.y + b.h + 30) safe = false;
                    for (let c of cars) if (Math.sqrt((x - c.x) ** 2 + (y - c.y) ** 2) < 50) safe = false;
                }
                return { x, y };
            }

            if (onlyAI) {
                // 데모 모드용: 5대 정도의 AI가 맵을 돌아다님
                for (let i = 0; i < 5; i++) {
                    let pos = getSafeSpawn();
                    // 랜덤 색상 AI
                    let randomId = Math.floor(Math.random() * 4);
                    cars.push(new Car(randomId, pos.x, pos.y, false));
                }
            } else {
                // 실제 게임: 플레이어 1 + AI 3
                let pPos = getSafeSpawn();
                player = new Car(0, pPos.x, pPos.y, true);
                cars.push(player);
                for (let i = 1; i < 4; i++) {
                    let pos = getSafeSpawn();
                    cars.push(new Car(i, pos.x, pos.y, false));
                }
            }
        }

        function startTimer() {
            const timerEl = document.getElementById('timer');
            timeLeft = GAME_DURATION;
            timerEl.innerText = `⏱ ${timeLeft}`;

            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!isGameActive) return;
                timeLeft--;
                timerEl.innerText = `⏱ ${timeLeft}`;
                if (timeLeft <= 0) endGame();
            }, 1000);
        }

        function endGame() {
            isGameActive = false;
            clearInterval(timerInterval);
            if (Sound.engineOsc) Sound.engineOsc.stop();

            let results = COLORS.map((c, i) => {
                let percentage = (scores[i] / totalTiles) * 100;
                return { ...c, percent: percentage };
            });
            results.sort((a, b) => b.percent - a.percent);

            const playerRank = results.findIndex(r => r.id === 0);
            const titleEl = document.getElementById('game-result-title');

            if (playerRank === 0) titleEl.innerText = "운전 실력이 최고예요! 🏆";
            else if (playerRank === 3) titleEl.innerText = "조금 아쉽지만 잘했어요! 💪";
            else titleEl.innerText = "멋진 승부였어요! 🚗";

            const modal = document.getElementById('game-over-modal');
            const list = document.getElementById('rank-list');
            list.innerHTML = '';
            results.forEach((r, idx) => {
                const isMe = r.id === 0;
                const div = document.createElement('div');
                div.className = `rank-card ${isMe ? 'border-4 border-white' : ''}`;
                div.style.background = isMe ? 'rgba(255, 65, 54, 0.6)' : 'rgba(255,255,255,0.2)';
                div.innerHTML = `
                    <div class="flex items-center">
                        <span class="text-3xl font-bold mr-4 text-yellow-300 w-8">${idx + 1}</span>
                        <div class="w-6 h-6 rounded-full mr-3 border-2 border-white" style="background:${r.hex}"></div>
                        <span class="font-bold">${r.name}</span>
                    </div>
                    <span class="font-bold text-2xl">${r.percent.toFixed(1)}%</span>
                `;
                list.appendChild(div);
            });
            modal.classList.remove('hidden');
        }

        function resize() {
            const wrapper = document.getElementById('game-wrapper');
            if (wrapper) {
                canvas.width = wrapper.clientWidth;
                canvas.height = wrapper.clientHeight;
            } else {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            minimapCanvas.width = MAP_WIDTH_TILES;
            minimapCanvas.height = MAP_HEIGHT_TILES;
        }

        function gameLoop() {
            update();
            draw();
            drawUI();
            requestAnimationFrame(gameLoop);
        }

        function update() {
            // 데모모드거나 게임중이면 업데이트
            if (isGameActive || isDemoMode) {
                cars.forEach(car => car.update());
                checkCarCollisions();
                for (let i = particles.length - 1; i >= 0; i--) {
                    particles[i].update();
                    if (particles[i].life <= 0) particles.splice(i, 1);
                }
                if (cameraShake > 0) cameraShake *= 0.9;
                if (cameraShake < 0.5) cameraShake = 0;
                calculateScores();
            }
        }

        function checkCarCollisions() {
            for (let i = 0; i < cars.length; i++) {
                for (let j = i + 1; j < cars.length; j++) {
                    const c1 = cars[i];
                    const c2 = cars[j];
                    const dx = c2.x - c1.x;
                    const dy = c2.y - c1.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    const minDist = c1.radius + c2.radius + 5;

                    if (distance < minDist) {
                        if (c1.collisionCooldown <= 0 && c2.collisionCooldown <= 0) {
                            if (isGameActive) Sound.playCrash(); // 게임 중에만 소리
                            let winner = (Math.abs(c1.speed) > Math.abs(c2.speed)) ? c1 : c2;
                            if (Math.abs(c1.speed - c2.speed) < 1.0) {
                                paintExplosion(c1.x, c1.y, c1.color.id, 5);
                                paintExplosion(c2.x, c2.y, c2.color.id, 5);
                            } else {
                                paintExplosion(c2.x, c2.y, winner.color.id, 7);
                            }
                            spawnExplosionParticles(c1.x + dx / 2, c1.y + dy / 2, winner.color.hex);
                            c1.collisionCooldown = 20; c2.collisionCooldown = 20;
                            if (isGameActive && (c1.isPlayer || c2.isPlayer)) {
                                cameraShake = 15;
                                showCrashText();
                            }
                        }
                        const angle = Math.atan2(dy, dx);
                        const overlap = minDist - distance;
                        const ax = (dx / distance) * overlap * 0.5;
                        const ay = (dy / distance) * overlap * 0.5;
                        c1.x -= ax; c1.y -= ay; c2.x += ax; c2.y += ay;
                        c1.speed *= -0.8; c2.speed *= -0.8;
                        c1.angle += (Math.random() - 0.5); c2.angle += (Math.random() - 0.5);
                    }
                }
            }
        }

        function paintExplosion(x, y, colorId, radius) {
            const tx = Math.floor(x / TILE_SIZE);
            const ty = Math.floor(y / TILE_SIZE);
            for (let dy = -radius; dy <= radius; dy++) {
                for (let dx = -radius; dx <= radius; dx++) {
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > radius) continue;
                    if (dist > radius - 1 && Math.random() > 0.5) continue;
                    const targetX = tx + dx;
                    const targetY = ty + dy;
                    if (targetX >= 0 && targetX < MAP_WIDTH_TILES && targetY >= 0 && targetY < MAP_HEIGHT_TILES) {
                        if (mapGrid[targetY][targetX] !== 9) mapGrid[targetY][targetX] = colorId;
                    }
                }
            }
        }

        function spawnExplosionParticles(x, y, color) {
            for (let i = 0; i < 10; i++) {
                particles.push(new Particle(x, y, color, Math.random() * 4 + 2, Math.random() * Math.PI * 2, 20, Math.random() * 4 + 2));
            }
        }

        let collisionMsgTimer = 0;
        function showCrashText() {
            collisionMsg.style.opacity = '1';
            collisionMsg.style.transform = 'translate(-50%, -50%) scale(1.3) rotate(-10deg)';
            clearTimeout(collisionMsgTimer);
            collisionMsgTimer = setTimeout(() => {
                collisionMsg.style.opacity = '0';
                collisionMsg.style.transform = 'translate(-50%, -50%) scale(1)';
            }, 600);
        }

        let scoreFrame = 0;
        function calculateScores() {
            scoreFrame++;
            if (scoreFrame % 10 !== 0) return;
            let counts = [0, 0, 0, 0];
            for (let y = 0; y < MAP_HEIGHT_TILES; y++) for (let x = 0; x < MAP_WIDTH_TILES; x++) if (mapGrid[y][x] >= 0 && mapGrid[y][x] < 4) counts[mapGrid[y][x]]++;
            scores = counts;
            updateHUD();
        }

        function updateHUD() {
            const percents = scores.map(s => (s / totalTiles) * 100);
            document.getElementById('bar-p1').style.width = `${percents[0]}%`;
            document.getElementById('bar-p1').style.backgroundColor = COLORS[0].hex;
            document.getElementById('bar-ai1').style.width = `${percents[1]}%`;
            document.getElementById('bar-ai1').style.backgroundColor = COLORS[1].hex;
            document.getElementById('bar-ai2').style.width = `${percents[2]}%`;
            document.getElementById('bar-ai2').style.backgroundColor = COLORS[2].hex;
            document.getElementById('bar-ai3').style.width = `${percents[3]}%`;
            document.getElementById('bar-ai3').style.backgroundColor = COLORS[3].hex;
            document.getElementById('score-text').innerHTML = `<span style="color:${COLORS[0].hex}">${percents[0].toFixed(1)}%</span>`;
        }

        function draw() {
            // 데모 모드일때 배경을 조금 더 밝게
            ctx.fillStyle = isDemoMode ? '#34495e' : '#2c3e50';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.save();

            let camX, camY;

            if (isDemoMode) {
                // 데모 모드일 땐 맵 중앙을 천천히 돔
                const time = Date.now() * 0.0002;
                camX = canvas.width / 2 - (WORLD_WIDTH / 2) + Math.cos(time) * 400;
                camY = canvas.height / 2 - (WORLD_HEIGHT / 2) + Math.sin(time) * 400;
            } else {
                camX = canvas.width / 2 - player.x;
                camY = canvas.height / 2 - player.y;
            }

            if (cameraShake > 0) { camX += (Math.random() - 0.5) * cameraShake; camY += (Math.random() - 0.5) * cameraShake; }
            ctx.translate(camX, camY);

            const startCol = Math.floor(-camX / TILE_SIZE);
            const endCol = startCol + (canvas.width / TILE_SIZE) + 1;
            const startRow = Math.floor(-camY / TILE_SIZE);
            const endRow = startRow + (canvas.height / TILE_SIZE) + 1;

            // 바닥
            for (let y = Math.max(0, startRow); y < Math.min(MAP_HEIGHT_TILES, endRow); y++) {
                for (let x = Math.max(0, startCol); x < Math.min(MAP_WIDTH_TILES, endCol); x++) {
                    const owner = mapGrid[y][x];
                    const px = x * TILE_SIZE;
                    const py = y * TILE_SIZE;
                    if (owner >= 0 && owner !== 9) {
                        ctx.fillStyle = COLORS[owner].tail; ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
                        // 약간의 둥근 느낌의 타일
                        ctx.beginPath();
                        ctx.strokeStyle = COLORS[owner].hex; ctx.lineWidth = 1;
                        ctx.roundRect(px + 2, py + 2, TILE_SIZE - 4, TILE_SIZE - 4, 4);
                        ctx.stroke();
                    } else if (owner !== 9) {
                        ctx.strokeStyle = '#455a64'; ctx.lineWidth = 1; ctx.strokeRect(px, py, TILE_SIZE, TILE_SIZE);
                    }
                }
            }
            // 맵 경계
            ctx.strokeStyle = 'white'; ctx.lineWidth = 6; ctx.strokeRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

            particles.forEach(p => p.draw(ctx));
            cars.forEach(car => car.draw(ctx));

            // 건물 렌더링
            const camCenterX = isDemoMode ? WORLD_WIDTH / 2 : player.x;
            const camCenterY = isDemoMode ? WORLD_HEIGHT / 2 : player.y;

            buildings.forEach(b => {
                if (b.x + b.w < -camX || b.x > -camX + canvas.width || b.y + b.h < -camY || b.y > -camY + canvas.height) return;
                const offsetX = (b.x + b.w / 2 - camCenterX) * 0.15;
                const offsetY = (b.y + b.h / 2 - camCenterY) * 0.15;
                const roofX = b.x + offsetX; const roofY = b.y + offsetY - b.height;

                // 그림자
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath(); ctx.roundRect(b.x + 10, b.y + 10, b.w, b.h, 4); ctx.fill();

                // 벽
                ctx.fillStyle = '#7f8c8d'; ctx.beginPath();
                ctx.moveTo(b.x, b.y); ctx.lineTo(roofX, roofY); ctx.lineTo(roofX + b.w, roofY); ctx.lineTo(b.x + b.w, b.y);
                ctx.lineTo(b.x + b.w, b.y + b.h); ctx.lineTo(roofX + b.w, roofY + b.h); ctx.lineTo(roofX, roofY + b.h); ctx.lineTo(b.x, b.y + b.h);
                ctx.closePath(); ctx.fill();

                // 옥상
                ctx.fillStyle = b.colorBase;
                ctx.beginPath(); ctx.roundRect(roofX, roofY, b.w, b.h, 4); ctx.fill();

                // 옥상 테두리
                ctx.strokeStyle = 'white'; ctx.lineWidth = 3; ctx.stroke();

                // 옥상 창문/장식
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.beginPath(); ctx.roundRect(roofX + 10, roofY + 10, b.w - 20, b.h - 20, 2); ctx.fill();
            });
            ctx.restore();
        }

        function drawUI() {
            minimapCtx.fillStyle = '#333'; minimapCtx.fillRect(0, 0, minimapCanvas.width, minimapCanvas.height);
            const imgData = minimapCtx.createImageData(MAP_WIDTH_TILES, MAP_HEIGHT_TILES);
            const data = imgData.data;
            for (let y = 0; y < MAP_HEIGHT_TILES; y++) {
                for (let x = 0; x < MAP_WIDTH_TILES; x++) {
                    const owner = mapGrid[y][x];
                    const index = (y * MAP_WIDTH_TILES + x) * 4;
                    if (owner === 9) { data[index] = 150; data[index + 1] = 150; data[index + 2] = 150; data[index + 3] = 255; }
                    else if (owner >= 0) {
                        const c = hexToRgb(COLORS[owner].hex);
                        data[index] = c.r; data[index + 1] = c.g; data[index + 2] = c.b; data[index + 3] = 255;
                    } else { data[index] = 50; data[index + 1] = 50; data[index + 2] = 50; data[index + 3] = 255; }
                }
            }
            minimapCtx.putImageData(imgData, 0, 0);

            if (isGameActive && Math.floor(Date.now() / 400) % 2 === 0) {
                minimapCtx.fillStyle = 'white'; minimapCtx.beginPath();
                let mx = (player.x / WORLD_WIDTH) * minimapCanvas.width;
                let my = (player.y / WORLD_HEIGHT) * minimapCanvas.height;
                minimapCtx.arc(mx, my, 4, 0, Math.PI * 2); minimapCtx.fill();
            }
        }
        function hexToRgb(hex) {
            var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 0, g: 0, b: 0 };
        }

        init();
    </script>
