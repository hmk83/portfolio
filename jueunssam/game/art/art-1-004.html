<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>무지개 물감 실험실</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* [Core Reset & Safe Area] */
        :root {
            --gnb-height: 60px;
            --app-bg: #fdf4ff;
            /* Light Pink Background */
        }

        body {
            font-family: 'Jua', sans-serif;
            background-color: var(--app-bg);
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            height: 100vh;
            width: 100vw;
        }

        /* [GNB Styles] */
        #gnb {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--gnb-height);
            background-color: #FEE500;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* [Game Container & Scaling] */
        #game-container {
            position: absolute;
            top: var(--gnb-height);
            left: 0;
            width: 100%;
            height: calc(100vh - var(--gnb-height));
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: var(--app-bg);
        }

        #scalable-wrapper {
            width: 1280px;
            height: 720px;
            position: relative;
            transform-origin: center center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* [Animations] */
        .bounce {
            animation: bounce 2s infinite;
        }

        @keyframes bounce {

            0%,
            20%,
            50%,
            80%,
            100% {
                transform: translateY(0);
            }

            40% {
                transform: translateY(-1.5vmin);
            }

            60% {
                transform: translateY(-0.75vmin);
            }
        }

        .btn-press {
            transition: transform 0.1s;
        }

        .btn-press:active {
            transform: scale(0.95);
        }

        .modal-enter {
            animation: modalFadeIn 0.3s forwards;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* [Lab Specific Styles] */
        .color-drop-btn {
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            box-shadow: inset 0 -4px 4px rgba(0, 0, 0, 0.1), 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .color-drop-btn:active {
            transform: scale(0.9);
        }

        .mixing-beaker {
            /* Reduced size from 400px to 320px to fit screen better */
            width: 320px;
            height: 320px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.4s ease;
            box-shadow: inset 0 -20px 30px rgba(0, 0, 0, 0.1), 0 10px 40px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
            background-color: #ffffff;
            border: 8px solid #f1f5f9;
        }

        .beaker-liquid {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.95;
            transition: background-color 0.5s ease;
        }

        .drop-animation {
            animation: ripple 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        @keyframes ripple {
            0% {
                transform: scale(1);
            }

            30% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }

        .magic-shine {
            animation: shine 0.6s ease-out;
        }

        @keyframes shine {
            0% {
                filter: brightness(1);
            }

            50% {
                filter: brightness(1.4);
            }

            100% {
                filter: brightness(1);
            }
        }

        .slot-pill {
            transition: all 0.3s ease;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from {
                transform: scale(0);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        #effect-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>

<body>

    <!-- [1. GNB] -->
    <nav id="gnb">
        <div class="flex items-center gap-2">
            <h1
                class="text-xl md:text-2xl font-bold text-gray-800 whitespace-nowrap overflow-hidden text-ellipsis max-w-[50vw]">
                🎨 <span data-i18n="appTitle">무지개 물감 실험실</span>
            </h1>
        </div>
        <div class="flex gap-2">
            <button id="btn-lang"
                class="bg-white border-2 border-gray-200 rounded-full px-4 py-1 text-sm font-bold shadow-sm hover:bg-gray-50 btn-press"
                data-i18n="langBtn">English</button>
            <button id="btn-restart"
                class="hidden bg-pink-500 text-white rounded-full px-4 py-1 text-sm font-bold shadow-sm hover:bg-pink-600 btn-press"
                data-i18n="restart">다시하기</button>
            <button id="btn-exit"
                class="bg-gray-600 text-white rounded-full px-4 py-1 text-sm font-bold shadow-sm hover:bg-gray-700 btn-press"
                data-i18n="exit">종료</button>
        </div>
    </nav>

    <!-- [2. Game Container] -->
    <div id="game-container">
        <div id="scalable-wrapper">
            <canvas id="effect-canvas"></canvas>

            <!-- A. Intro Screen -->
            <div id="intro-screen" class="w-full h-full flex flex-col items-center justify-center z-20">
                <i data-lucide="flask-conical" class="w-32 h-32 text-pink-500 mb-6 bounce"></i>
                <h1 class="text-7xl font-bold text-pink-500 drop-shadow-lg mb-4" data-i18n="appTitle">무지개 물감 실험실</h1>
                <p class="text-2xl text-gray-500 mb-12" data-i18n="introDesc">색깔을 섞어 새로운 색을 만들어요!</p>
                <div class="flex gap-4">
                    <button id="btn-howto"
                        class="bg-yellow-400 hover:bg-yellow-500 text-white text-3xl px-8 py-4 rounded-3xl shadow-lg btn-press flex items-center gap-2">
                        <i data-lucide="help-circle" class="w-8 h-8"></i>
                        <span data-i18n="howToPlay">설명 보기</span>
                    </button>
                    <button id="btn-start"
                        class="bg-pink-500 hover:bg-pink-600 text-white text-3xl px-12 py-4 rounded-3xl shadow-lg btn-press flex items-center gap-2">
                        <i data-lucide="play" class="w-8 h-8"></i>
                        <span data-i18n="start">시작하기</span>
                    </button>
                </div>
            </div>

            <!-- B. Main Game Content -->
            <!-- Height increased to 95% to utilize more vertical space -->
            <main id="app-content"
                class="hidden w-[90%] h-[95%] bg-white rounded-3xl shadow-2xl p-6 flex flex-col relative border-b-8 border-pink-50">

                <!-- Header Area inside Main -->
                <div class="text-center mb-1 shrink-0 h-14 flex items-center justify-center">
                    <h2 class="text-4xl text-gray-600 font-bold transition-all duration-300"
                        data-i18n="mainInstruction">
                        물감을 톡톡! 모든 색을 섞어보세요.</h2>
                </div>

                <div class="flex-grow flex flex-col items-center justify-center relative z-10">
                    <!-- Beaker -->
                    <div id="beaker" class="mixing-beaker">
                        <div id="beaker-liquid" class="beaker-liquid" style="background-color: #ffffff;"></div>
                        <i id="beaker-icon" data-lucide="sparkles" class="relative z-10 text-gray-200 w-20 h-20"></i>
                    </div>

                    <!-- Mixed colors list / Instruction -->
                    <div id="ingredient-display"
                        class="mt-4 flex flex-wrap gap-2 min-h-[50px] items-center justify-center w-full">
                        <!-- Dynamic content -->
                    </div>
                </div>

                <!-- Palette Area -->
                <div class="w-full border-t-2 border-gray-100 pt-4 flex flex-col gap-3 mt-auto shrink-0 pb-2">
                    <div id="palette" class="flex flex-nowrap justify-center gap-3 items-center overflow-visible">
                        <!-- 8 Colors injected -->
                    </div>
                    <div class="text-center text-gray-400 text-xl font-bold" data-i18n="footerText">
                        모든 색을 섞어 나만의 무지개 색깔을 만들어봐요!
                    </div>
                </div>

            </main>

        </div>
    </div>

    <!-- [3. Modals] -->

    <!-- Info Modal -->
    <div id="modal-info" class="hidden fixed inset-0 bg-black/50 z-[20000] flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 w-[80%] max-w-md shadow-2xl relative modal-enter border-4 border-pink-100">
            <button class="btn-close-modal absolute top-4 right-4 text-gray-400 hover:text-gray-600">
                <i data-lucide="x-circle" class="w-8 h-8"></i>
            </button>
            <h3 class="text-2xl font-bold text-pink-500 mb-4 flex items-center gap-2">
                <i data-lucide="info" class="w-6 h-6"></i> <span data-i18n="howToPlay">설명 보기</span>
            </h3>
            <ul class="space-y-4 text-lg text-gray-700">
                <li class="flex items-start gap-3">
                    <span class="bg-pink-100 p-2 rounded-full text-pink-500"><i data-lucide="droplets"
                            class="w-6 h-6"></i></span>
                    <div><strong data-i18n="guide1Title">물감 넣기</strong><br>
                        <span class="text-base text-gray-500" data-i18n="guide1Desc">물감을 누르면 물방울이 떨어져요.</span>
                    </div>
                </li>
                <li class="flex items-start gap-3">
                    <span class="bg-blue-100 p-2 rounded-full text-blue-500"><i data-lucide="layers"
                            class="w-6 h-6"></i></span>
                    <div><strong data-i18n="guide2Title">색깔 섞기</strong><br>
                        <span class="text-base text-gray-500" data-i18n="guide2Desc">여러 색을 섞어 새로운 색을 만드세요.</span>
                    </div>
                </li>
            </ul>
            <div class="mt-8 text-center">
                <button
                    class="btn-close-modal bg-pink-500 hover:bg-pink-600 text-white text-lg px-8 py-3 rounded-full shadow-md transition"
                    data-i18n="ok">
                    알겠어요!
                </button>
            </div>
        </div>
    </div>

    <!-- Exit Confirm Modal -->
    <div id="modal-exit" class="hidden fixed inset-0 bg-black/50 z-[20000] flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 w-[80%] max-w-lg shadow-2xl relative modal-enter text-center">
            <h3 class="text-3xl font-bold text-gray-800 mb-4" data-i18n="exitConfirm">정말 종료할까요?</h3>
            <p class="text-xl text-gray-500 mb-8" data-i18n="exitDesc">진행 상황이 저장되지 않아요.</p>
            <div class="flex justify-center gap-4">
                <button id="btn-cancel-exit"
                    class="bg-gray-200 text-gray-700 text-xl px-6 py-3 rounded-full hover:bg-gray-300"
                    data-i18n="cancel">아니요</button>
                <button id="btn-confirm-exit"
                    class="bg-red-500 text-white text-xl px-6 py-3 rounded-full hover:bg-red-600" data-i18n="yes">네,
                    종료해요</button>
            </div>
        </div>
    </div>

    <!-- Restart Confirm Modal -->
    <div id="modal-restart" class="hidden fixed inset-0 bg-black/50 z-[20000] flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 w-[80%] max-w-lg shadow-2xl relative modal-enter text-center">
            <h3 class="text-3xl font-bold text-gray-800 mb-4" data-i18n="restartConfirm">다시 시작할까요?</h3>
            <p class="text-xl text-gray-500 mb-8" data-i18n="restartDesc">처음부터 다시 시작합니다.</p>
            <div class="flex justify-center gap-4">
                <button id="btn-cancel-restart"
                    class="bg-gray-200 text-gray-700 text-xl px-6 py-3 rounded-full hover:bg-gray-300"
                    data-i18n="cancel">아니요</button>
                <button id="btn-confirm-restart"
                    class="bg-pink-500 text-white text-xl px-6 py-3 rounded-full hover:bg-pink-600"
                    data-i18n="yesRestart">네, 다시 시작해요</button>
            </div>
        </div>
    </div>

    <script>
        // --- [1. Configuration & Data] ---
        const GOOGLE_API_KEY = "AIzaSyAE0nnpOYZRfLkfM09O3NQjpWnN1kUqR3E";

        const I18N_DATA = {
            ko: {
                langBtn: "English",
                appTitle: "무지개 물감 실험실",
                introDesc: "색깔을 섞어 새로운 색을 만들어요!",
                howToPlay: "설명 보기",
                start: "시작하기",
                restart: "다시하기",
                exit: "종료",
                guideText: "물감을 톡톡 눌러서 비커에 넣어보세요. 색깔이 섞이면 어떻게 변할까요?",
                guide1Title: "물감 넣기",
                guide1Desc: "물감을 누르면 물방울이 떨어져요.",
                guide2Title: "색깔 섞기",
                guide2Desc: "여러 색을 섞어 새로운 색을 만드세요.",
                ok: "알겠어요!",
                exitConfirm: "정말 종료할까요?",
                exitDesc: "진행 상황이 저장되지 않아요.",
                restartConfirm: "다시 시작할까요?",
                restartDesc: "처음부터 다시 시작합니다.",
                yes: "네, 종료해요",
                yesRestart: "네, 다시 시작해요",
                cancel: "아니요",
                mainInstruction: "물감을 톡톡! 모든 색을 섞어보세요.",
                footerText: "모든 색을 섞어 나만의 무지개 색깔을 만들어봐요!",
                colors: {
                    red: "빨강", yellow: "노랑", blue: "파랑", orange: "주황",
                    green: "초록", purple: "보라", white: "하양", black: "까망"
                }
            },
            en: {
                langBtn: "한국어",
                appTitle: "Rainbow Paint Lab",
                introDesc: "Mix colors to make new ones!",
                howToPlay: "How to Play",
                start: "Start",
                restart: "Restart",
                exit: "Exit",
                guideText: "Tap paints to drop them into the beaker. See how colors change when mixed!",
                guide1Title: "Add Paint",
                guide1Desc: "Tap to drop paint colors.",
                guide2Title: "Mix Colors",
                guide2Desc: "Mix various colors together.",
                ok: "Got it!",
                exitConfirm: "Really Exit?",
                exitDesc: "Progress will not be saved.",
                restartConfirm: "Restart?",
                restartDesc: "Start from the beginning.",
                yes: "Yes, Exit",
                yesRestart: "Yes, Restart",
                cancel: "No",
                mainInstruction: "Tap paints! Mix them all together.",
                footerText: "Mix colors to create your own rainbow!",
                colors: {
                    red: "Red", yellow: "Yellow", blue: "Blue", orange: "Orange",
                    green: "Green", purple: "Purple", white: "White", black: "Black"
                }
            }
        };

        const BASE_COLORS = [
            { id: 'red', hex: '#FF0000' },
            { id: 'yellow', hex: '#FFFF00' },
            { id: 'blue', hex: '#0000FF' },
            { id: 'orange', hex: '#FF8000' },
            { id: 'green', hex: '#00FF00' },
            { id: 'purple', hex: '#8000FF' },
            { id: 'white', hex: '#FFFFFF' },
            { id: 'black', hex: '#000000' }
        ];

        // --- [2. Global State] ---
        let currentLang = 'ko';
        let ttsAudio = null;
        let googleTTSAvailable = true;
        let mixedColors = [];

        // --- [Voice Loader] ---
        let availableVoices = [];
        function loadVoices() {
            availableVoices = window.speechSynthesis.getVoices();
        }
        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices();

        // --- [3. System Functions (TTS)] ---
        function stopTTS() {
            if (ttsAudio) {
                ttsAudio.pause();
                ttsAudio.currentTime = 0;
                ttsAudio = null;
            }
            window.speechSynthesis.cancel();
        }

        async function speak(keyOrText, isRaw = false) {
            stopTTS();
            const text = isRaw ? keyOrText : (I18N_DATA[currentLang][keyOrText] || keyOrText);
            if (!text) return;

            if (!googleTTSAvailable) {
                fallbackSpeak(text);
                return;
            }

            const langCode = currentLang === 'ko' ? 'ko-KR' : 'en-US';
            const voiceName = currentLang === 'ko' ? 'ko-KR-Standard-A' : 'en-US-Standard-E';

            try {
                const response = await fetch(`https://texttospeech.googleapis.com/v1/text:synthesize?key=${GOOGLE_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        input: { text: text },
                        voice: { languageCode: langCode, name: voiceName },
                        audioConfig: { audioEncoding: 'MP3' }
                    })
                });

                if (!response.ok) throw new Error(`API Error: ${response.status}`);

                const data = await response.json();
                if (data.audioContent) {
                    const audioBlob = await fetch(`data:audio/mp3;base64,${data.audioContent}`).then(res => res.blob());
                    const audioUrl = URL.createObjectURL(audioBlob);
                    ttsAudio = new Audio(audioUrl);
                    ttsAudio.play().catch(e => console.error("Audio Playback Error:", e));
                } else {
                    fallbackSpeak(text);
                }
            } catch (e) {
                console.warn("Google TTS failed:", e);
                googleTTSAvailable = false;
                fallbackSpeak(text);
            }
        }

        function fallbackSpeak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            const isEnglish = currentLang !== 'ko';
            utterance.lang = isEnglish ? 'en-US' : 'ko-KR';
            utterance.rate = 0.9;

            if (availableVoices.length === 0) availableVoices = window.speechSynthesis.getVoices();

            if (isEnglish) {
                const targetVoices = ["Google US English", "Samantha", "Microsoft Zira"];
                let selectedVoice = availableVoices.find(v => targetVoices.some(target => v.name.includes(target)));
                if (!selectedVoice) selectedVoice = availableVoices.find(v => v.lang === 'en-US');
                if (selectedVoice) utterance.voice = selectedVoice;
            } else {
                const koVoice = availableVoices.find(v => v.name.includes('Google 한국어') || v.lang === 'ko-KR');
                if (koVoice) utterance.voice = koVoice;
            }
            window.speechSynthesis.speak(utterance);
        }

        // --- [4. Game Logic] ---
        function renderPalette() {
            const paletteEl = document.getElementById('palette');
            paletteEl.innerHTML = '';
            BASE_COLORS.forEach(color => {
                const btn = document.createElement('div');
                // Reduced size to fit better (w-16 h-16 = 64px)
                btn.className = 'color-drop-btn w-16 h-16 rounded-full border-4 border-white shadow-md flex-shrink-0';
                btn.style.backgroundColor = color.hex;
                btn.onclick = (e) => addDrop(color, e);
                paletteEl.appendChild(btn);
            });
        }

        function addDrop(color, event) {
            const existing = mixedColors.find(c => c.id === color.id);
            if (existing) {
                existing.count++;
                playDropSound();
                fireSplash(color.hex);
            } else {
                mixedColors.push({ ...color, count: 1 });
                playDropSound();
                fireSplash(color.hex);
            }

            // Speak color name
            const colorName = I18N_DATA[currentLang].colors[color.id];
            speak(colorName, true);

            updateBeakerUI();
        }

        function changeCount(id, delta) {
            const index = mixedColors.findIndex(c => c.id === id);
            if (index !== -1) {
                mixedColors[index].count += delta;
                if (mixedColors[index].count <= 0) {
                    mixedColors.splice(index, 1);
                    playPopSound();
                } else {
                    playTickSound();
                }
                updateBeakerUI();
            }
        }

        function updateBeakerUI() {
            const display = document.getElementById('ingredient-display');
            const liquid = document.getElementById('beaker-liquid');
            const beakerIcon = document.getElementById('beaker-icon');

            display.innerHTML = '';

            if (mixedColors.length === 0) {
                liquid.style.backgroundColor = '#ffffff';
                if (beakerIcon) beakerIcon.classList.remove('hidden');
            } else {
                if (beakerIcon) beakerIcon.classList.add('hidden');

                mixedColors.forEach(color => {
                    const pill = document.createElement('div');
                    pill.className = 'slot-pill bg-white px-4 py-2 rounded-full shadow border-2 flex items-center gap-2';
                    pill.style.borderColor = color.hex;
                    pill.innerHTML = `
                        <div class="w-6 h-6 rounded-full" style="background-color: ${color.hex}"></div>
                        <span class="text-xl font-bold text-gray-700">${color.count}</span>
                        <div class="flex gap-1">
                            <button onclick="changeCount('${color.id}', 1)" class="bg-gray-50 rounded-full w-8 h-8 flex items-center justify-center border border-gray-100 active:bg-gray-200"><i data-lucide="plus" class="w-4 h-4"></i></button>
                            <button onclick="changeCount('${color.id}', -1)" class="bg-gray-50 rounded-full w-8 h-8 flex items-center justify-center border border-gray-100 active:bg-gray-200"><i data-lucide="minus" class="w-4 h-4"></i></button>
                        </div>
                    `;
                    display.appendChild(pill);
                });

                const prevColor = liquid.style.backgroundColor;
                const nextColor = calculateMixedColor();

                if (prevColor !== nextColor) {
                    liquid.style.backgroundColor = nextColor;
                    playMagicSound();
                    triggerBeakerMagic();
                }
            }
            lucide.createIcons();
        }

        function triggerBeakerMagic() {
            const beaker = document.getElementById('beaker');
            beaker.classList.remove('magic-shine', 'drop-animation');
            void beaker.offsetWidth;
            beaker.classList.add('magic-shine', 'drop-animation');
        }

        function calculateMixedColor() {
            let rTotal = 0, gTotal = 0, bTotal = 0, totalDrops = 0;
            mixedColors.forEach(color => {
                const rgb = hexToRgb(color.hex);
                rTotal += rgb.r * color.count;
                gTotal += rgb.g * color.count;
                bTotal += rgb.b * color.count;
                totalDrops += color.count;
            });
            if (totalDrops === 0) return '#ffffff';
            return `rgb(${Math.round(rTotal / totalDrops)}, ${Math.round(gTotal / totalDrops)}, ${Math.round(bTotal / totalDrops)})`;
        }

        function hexToRgb(hex) {
            const bigint = parseInt(hex.slice(1), 16);
            return { r: (bigint >> 16) & 255, g: (bigint >> 8) & 255, b: bigint & 255 };
        }

        function resetGame() {
            stopTTS();
            mixedColors = [];
            updateBeakerUI();

            // UI Transition
            document.getElementById('intro-screen').classList.remove('hidden');
            document.getElementById('app-content').classList.add('hidden');
            document.getElementById('btn-restart').classList.add('hidden');

            playPopSound();
        }

        // --- [5. UI & Event Listeners] ---
        function updateTexts() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (I18N_DATA[currentLang][key]) {
                    el.innerText = I18N_DATA[currentLang][key];
                }
            });
        }

        function resizeGame() {
            const container = document.getElementById('game-container');
            const wrapper = document.getElementById('scalable-wrapper');
            const cw = container.clientWidth;
            const ch = container.clientHeight;
            const baseW = 1280;
            const baseH = 720;
            const scale = Math.min(cw / baseW, ch / baseH);
            wrapper.style.transform = `scale(${scale})`;
        }
        window.addEventListener('resize', resizeGame);

        document.getElementById('btn-lang').onclick = () => {
            currentLang = currentLang === 'ko' ? 'en' : 'ko';
            updateTexts();
            speak(currentLang === 'ko' ? '한국어' : 'English', true);
        };

        document.getElementById('btn-start').onclick = () => {
            stopTTS();
            document.getElementById('intro-screen').classList.add('hidden');
            document.getElementById('app-content').classList.remove('hidden');
            document.getElementById('btn-restart').classList.remove('hidden');
            renderPalette();
            speak('mainInstruction');
        };

        const infoModal = document.getElementById('modal-info');
        const exitModal = document.getElementById('modal-exit');
        const restartModal = document.getElementById('modal-restart');

        document.getElementById('btn-howto').onclick = () => {
            stopTTS();
            infoModal.classList.remove('hidden');
            speak('guideText');
        };

        document.querySelectorAll('.btn-close-modal').forEach(btn => {
            btn.onclick = () => {
                stopTTS();
                infoModal.classList.add('hidden');
            };
        });

        document.getElementById('btn-exit').onclick = () => {
            stopTTS();
            exitModal.classList.remove('hidden');
            speak('exitConfirm');
        };

        document.getElementById('btn-cancel-exit').onclick = () => {
            stopTTS();
            exitModal.classList.add('hidden');
        };

        document.getElementById('btn-confirm-exit').onclick = () => {
            stopTTS();
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.close();
            }
        };

        document.getElementById('btn-restart').onclick = () => {
            stopTTS();
            restartModal.classList.remove('hidden');
            speak('restartConfirm');
        };

        document.getElementById('btn-cancel-restart').onclick = () => {
            stopTTS();
            restartModal.classList.add('hidden');
        };

        document.getElementById('btn-confirm-restart').onclick = () => {
            stopTTS();
            restartModal.classList.add('hidden');
            resetGame();
        };

        // --- [6. Audio Engine (Web Audio) for SFX] ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        document.body.addEventListener('click', () => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }, { once: true });

        function playDropSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(500, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.04);
            osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
            osc.start(); osc.stop(audioCtx.currentTime + 0.15);
        }

        function playMagicSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const notes = [1046, 1318, 1567, 2093];
            const now = audioCtx.currentTime;
            notes.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'triangle';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0, now + i * 0.04);
                gain.gain.linearRampToValueAtTime(0.04, now + i * 0.04 + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.04 + 0.4);
                osc.start(now + i * 0.04);
                osc.stop(now + i * 0.04 + 0.4);
            });
        }

        function playTickSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'square';
            osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.015, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            osc.start(); osc.stop(audioCtx.currentTime + 0.05);
        }

        function playPopSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(500, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        // --- [7. Effect Engine (Splash)] ---
        const canvas = document.getElementById("effect-canvas");
        const ctx = canvas.getContext("2d");
        let particles = [];

        function resizeCanvas() {
            canvas.width = 1280;
            canvas.height = 720;
        }

        function fireSplash(color) {
            const centerX = 1280 / 2;
            const centerY = 720 / 2 - 50;

            for (let i = 0; i < 25; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 15 + 5;
                particles.push({
                    x: centerX, y: centerY,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 5,
                    size: Math.random() * 12 + 4,
                    color: color,
                    life: 1.0,
                    decay: Math.random() * 0.05 + 0.02,
                    gravity: 0.6
                });
            }
        }

        function updateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy; p.vy += p.gravity; p.life -= p.decay;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;
            requestAnimationFrame(updateParticles);
        }

        // --- [8. Init] ---
        resizeCanvas();
        resizeGame();
        lucide.createIcons();
        updateParticles();
    </script>
