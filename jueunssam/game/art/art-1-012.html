<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>주은쌤 스케치북</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Jua Font -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        /* 기본 설정 */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Jua', sans-serif;
            background-color: #f5f5f5;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
        }

        /* Kakao Style Header */
        .kakao-header {
            background-color: #FEE500;
            color: #3b1e1e;
            width: 100%;
            height: 8vmin;
            min-height: 50px;
            max-height: 65px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 3vmin;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            z-index: 10001;
            flex-shrink: 0;
        }

        .icon-scale-header {
            width: 4vmin;
            height: 4vmin;
            min-width: 20px;
            min-height: 20px;
        }

        /* 메인 콘텐츠 영역 */
        .main-content-area {
            flex-grow: 1;
            width: 100%;
            height: calc(100vh - 8vmin);
            position: relative;
            overflow: hidden;
        }

        /* 스크롤바 숨김 */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 커서 스타일 */
        #cursor-follower {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 9999;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: opacity 0.15s;
            display: none;
        }

        /* 캔버스 래퍼 변환 애니메이션 */
        #canvas-transform-wrapper {
            transform-origin: center;
            transition: transform 0.05s linear;
            will-change: transform;
        }

        /* 레인지 슬라이더 커스텀 */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #3A1D1D;
            margin-top: -6px;
            cursor: pointer;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #ddd;
            border-radius: 2px;
        }
    </style>
</head>

<body>

    <!-- 1. GNB 헤더 -->
    <header class="kakao-header">
        <div class="flex items-center gap-[1vmin]">
            <i data-lucide="palette" class="icon-scale-header text-[#3b1e1e]"></i>
            <h1 class="text-[clamp(18px,3.5vmin,28px)] font-bold tracking-tight text-[#3b1e1e]">주은쌤 스케치북</h1>
        </div>

        <div class="flex gap-[1vmin]">
            <button onclick="clearCanvas()"
                class="bg-white text-[#3b1e1e] border border-[#3b1e1e] px-[2vmin] py-[0.8vmin] rounded-[1vmin] text-[clamp(12px,2vmin,16px)] hover:bg-gray-100 transition font-bold shadow-sm flex items-center gap-[0.5vmin]">
                다시 시작 <i data-lucide="rotate-ccw" class="w-[2vmin] h-[2vmin] min-w-[12px] min-h-[12px]"></i>
            </button>
            <button onclick="history.back()"
                class="bg-[#3b1e1e] text-[#FEE500] px-[2vmin] py-[0.8vmin] rounded-[1vmin] text-[clamp(12px,2vmin,16px)] hover:opacity-90 transition font-bold shadow-sm flex items-center gap-[0.5vmin]">
                학습 종료 <i data-lucide="log-out" class="w-[2vmin] h-[2vmin] min-w-[12px] min-h-[12px]"></i>
            </button>
        </div>
    </header>

    <!-- 2. 메인 콘텐츠 영역 -->
    <div class="main-content-area" id="main-area">

        <!-- 상단 우측 툴바 -->
        <div class="absolute top-4 right-4 flex gap-2 z-50">
            <div class="flex bg-white/90 backdrop-blur shadow-lg rounded-2xl p-1.5 items-center border border-white">
                <button onclick="handleZoom(-0.1)"
                    class="p-2 hover:bg-[#FEE500] rounded-xl text-[#3A1D1D] transition-colors"><i data-lucide="zoom-out"
                        width="18"></i></button>
                <span id="zoom-level" class="text-xs font-bold text-[#3A1D1D] w-12 text-center">100%</span>
                <button onclick="handleZoom(0.1)"
                    class="p-2 hover:bg-[#FEE500] rounded-xl text-[#3A1D1D] transition-colors"><i data-lucide="zoom-in"
                        width="18"></i></button>
                <div class="w-px h-4 bg-neutral-200 mx-1"></div>
                <button onclick="handleRotate(-15)"
                    class="p-2 hover:bg-[#FEE500] rounded-xl text-[#3A1D1D] transition-colors"><i
                        data-lucide="rotate-ccw" width="18"></i></button>
                <button onclick="handleRotate(15)"
                    class="p-2 hover:bg-[#FEE500] rounded-xl text-[#3A1D1D] transition-colors"><i
                        data-lucide="rotate-cw" width="18"></i></button>
                <div class="w-px h-4 bg-neutral-200 mx-1"></div>
                <button onclick="resetView()" class="p-2 hover:bg-[#FEE500] rounded-xl text-[#3A1D1D] transition-colors"
                    title="뷰 초기화"><i data-lucide="maximize" width="18"></i></button>
            </div>
            <div class="flex bg-white/90 backdrop-blur shadow-lg rounded-2xl p-1.5 gap-1 border border-white">
                <button id="btn-undo" onclick="handleUndo()"
                    class="p-2 hover:bg-[#FEE500] rounded-xl text-[#3A1D1D] disabled:opacity-30 transition-colors"
                    disabled><i data-lucide="rotate-ccw" width="18"></i></button>
                <button id="btn-redo" onclick="handleRedo()"
                    class="p-2 hover:bg-[#FEE500] rounded-xl text-[#3A1D1D] disabled:opacity-30 transition-colors"
                    disabled><i data-lucide="rotate-cw" width="18"></i></button>
                <button onclick="clearCanvas()"
                    class="p-2 hover:bg-red-100 text-red-500 rounded-xl transition-colors"><i data-lucide="trash-2"
                        width="18"></i></button>
                <button onclick="downloadImage()"
                    class="p-2 hover:bg-blue-100 text-blue-500 rounded-xl transition-colors"><i data-lucide="download"
                        width="18"></i></button>
            </div>
        </div>

        <!-- 좌측 중앙 팔레트 -->
        <div
            class="absolute left-0 top-1/2 transform -translate-y-1/2 bg-white/95 backdrop-blur border border-neutral-200 rounded-r-3xl shadow-xl flex flex-col items-center py-5 z-50 max-h-[80vh] overflow-hidden">
            <div
                class="mb-2 text-[10px] font-extrabold text-[#3A1D1D] tracking-wider bg-[#FEE500] px-2 py-0.5 rounded-full">
                COLORS</div>
            <div class="overflow-y-auto px-4 scrollbar-hide w-32 pt-6">
                <div class="grid grid-cols-2 gap-3 justify-items-center pb-4" id="color-grid"></div>
            </div>
        </div>

        <!-- 캔버스 영역 -->
        <div id="canvas-container"
            class="w-full h-full relative overflow-hidden bg-neutral-100 cursor-crosshair touch-none">
            <div id="canvas-transform-wrapper" class="absolute w-full h-full flex items-center justify-center">
                <div id="paper-area" class="relative shadow-2xl bg-white transition-colors duration-300"
                    style="width: 100%; height: 100%;"></div>
            </div>
            <div id="cursor-follower"></div>
        </div>

        <!-- 팝업 메뉴들 -->
        <div id="menu-background"
            class="hidden absolute bottom-40 left-1/2 transform -translate-x-1/2 bg-white/95 backdrop-blur-md border border-white shadow-2xl rounded-2xl p-4 w-72 z-50">
            <div class="flex justify-between items-center mb-3">
                <span class="text-xs font-bold text-[#3A1D1D]">배경 선택</span>
                <button onclick="toggleMenu('background')"><i data-lucide="x" width="16"
                        class="text-neutral-400"></i></button>
            </div>
            <div class="grid grid-cols-4 gap-2 max-h-60 overflow-y-auto pr-1 scrollbar-hide" id="background-grid"></div>
        </div>

        <div id="menu-layers"
            class="hidden absolute bottom-40 right-4 bg-white/95 backdrop-blur-md border border-white shadow-2xl rounded-2xl p-4 w-72 z-50">
            <div class="flex justify-between items-center mb-3 pb-2 border-b border-neutral-100">
                <span class="text-xs font-bold text-[#3A1D1D]">레이어 (<span id="layer-count">1</span>)</span>
                <button onclick="addLayer()"
                    class="p-1.5 bg-[#FEE500] text-[#3A1D1D] rounded-md hover:bg-[#ebd500] transition-colors"><i
                        data-lucide="plus" width="16"></i></button>
            </div>
            <div class="flex flex-col gap-2 max-h-64 overflow-y-auto pr-1 scrollbar-hide" id="layer-list"></div>
        </div>

        <!-- 하단 툴바 -->
        <div
            class="absolute bottom-6 left-1/2 transform -translate-x-1/2 max-w-[95%] w-auto flex flex-col items-center gap-3 z-50">
            <div class="bg-white/90 backdrop-blur-md border border-white shadow-xl rounded-2xl px-3 py-3 flex items-center gap-2 overflow-x-auto w-full max-w-full scrollbar-hide"
                id="tool-list"></div>

            <div
                class="bg-white/90 backdrop-blur-md border border-white shadow-xl rounded-2xl px-5 py-3 flex items-center gap-4 w-full justify-between">
                <button onclick="toggleMenu('background')"
                    class="px-3 py-2 rounded-xl text-xs font-bold transition-colors bg-neutral-100 text-neutral-500 hover:bg-neutral-50"
                    id="btn-bg-menu">배경</button>
                <button onclick="toggleMenu('layers')"
                    class="p-2 rounded-xl relative transition-colors text-neutral-400 hover:text-black bg-neutral-100"
                    id="btn-layer-menu">
                    <i data-lucide="layers" width="20"></i>
                    <span id="layer-indicator"
                        class="absolute top-1 right-1 w-2 h-2 bg-[#3A1D1D] rounded-full hidden"></span>
                </button>

                <div class="h-8 w-px bg-neutral-200 mx-2"></div>

                <div class="flex items-center gap-3 flex-1 min-w-[150px]" id="brush-size-container">
                    <button onclick="changeBrushSize(-2)" class="text-neutral-400 hover:text-[#3A1D1D]"><i
                            data-lucide="minus" width="18"></i></button>
                    <div
                        class="flex-1 h-2 bg-neutral-100 rounded-full overflow-hidden relative group border border-neutral-200">
                        <div id="size-bar" class="absolute top-0 left-0 h-full bg-[#FEE500]" style="width: 20%;"></div>
                        <input type="range" min="1" max="50" value="10" id="brush-size-input"
                            class="absolute top-0 left-0 w-full h-full opacity-0 cursor-pointer">
                    </div>
                    <button onclick="changeBrushSize(2)" class="text-neutral-400 hover:text-[#3A1D1D]"><i
                            data-lucide="plus" width="18"></i></button>
                </div>
            </div>
        </div>

    </div>

    <script>
        const TOOLS = {
            pen: { id: 'pen', label: '잉크 펜', engine: 'vector', icon: 'pen', alpha: 1.0, widthMod: 1.0, pressureType: 'size', pressureFactor: 0.8, composite: 'source-over', cap: 'round', join: 'round' },
            pencil: { id: 'pencil', label: '4B 연필', engine: 'texture', textureType: 'noise', spacing: 0.25, icon: 'pencil', alpha: 0.9, widthMod: 1.2, pressureType: 'opacity', pressureFactor: 0.8, composite: 'source-over' },
            marker: { id: 'marker', label: '마커', engine: 'texture', textureType: 'square', spacing: 0.05, icon: 'highlighter', alpha: 0.5, widthMod: 3.0, pressureType: 'none', pressureFactor: 0.0, composite: 'multiply' },
            crayon: { id: 'crayon', label: '크레파스', engine: 'texture', textureType: 'grunge', spacing: 0.4, icon: 'palette', alpha: 1.0, widthMod: 4.0, pressureType: 'opacity', pressureFactor: 0.5, composite: 'source-over', rotationJitter: 1.0 },
            watercolor: { id: 'watercolor', label: '수채화', engine: 'texture', textureType: 'soft', spacing: 0.15, icon: 'brush', alpha: 0.3, widthMod: 5.0, pressureType: 'size', pressureFactor: 1.0, composite: 'multiply' },
            spray: { id: 'spray', label: '스프레이', engine: 'texture', textureType: 'scatter', spacing: 0.2, icon: 'spray-can', alpha: 0.8, widthMod: 8.0, pressureType: 'opacity', pressureFactor: 0.8, composite: 'source-over' },
            fill: { id: 'fill', label: '채우기', engine: 'fill', icon: 'paint-bucket', alpha: 1.0, widthMod: 0, pressureType: 'none', composite: 'source-over' },
            eraser: { id: 'eraser', label: '지우개', engine: 'vector', icon: 'eraser', alpha: 1.0, widthMod: 2.0, pressureType: 'size', pressureFactor: 0.5, composite: 'destination-out', cap: 'round', join: 'round' },
            hand: { id: 'hand', label: '손 도구', engine: 'view', icon: 'hand' }
        };

        const BACKGROUNDS = [
            { id: 'white', name: '흰 종이', style: { background: '#ffffff' } },
            { id: 'paper', name: '재생지', style: { background: '#f5f5dc' } },
            { id: 'dark', name: '칠판', style: { background: '#2c2c2c' } },
            { id: 'grid', name: '모눈종이', style: { backgroundColor: '#ffffff', backgroundImage: 'linear-gradient(#e5e7eb 1px, transparent 1px), linear-gradient(90deg, #e5e7eb 1px, transparent 1px)', backgroundSize: '20px 20px' } },
            { id: 'line', name: '노트', style: { backgroundColor: '#ffffff', backgroundImage: 'linear-gradient(#e5e7eb 1px, transparent 1px)', backgroundSize: '100% 24px' } },
            { id: 'dot', name: '도트', style: { backgroundColor: '#ffffff', backgroundImage: 'radial-gradient(#d1d5db 1px, transparent 1px)', backgroundSize: '20px 20px' } },
            { id: 'blueprint', name: '청사진', style: { backgroundColor: '#1e40af', backgroundImage: 'linear-gradient(rgba(255,255,255,0.2) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.2) 1px, transparent 1px)', backgroundSize: '40px 40px' } },
        ];

        const PRESET_COLORS = [
            '#000000', '#4B5563', '#9CA3AF', '#D1D5DB', '#FFFFFF',
            '#DC2626', '#EA580C', '#F59E0B', '#FCD34D', '#FEF08A',
            '#059669', '#10B981', '#34D399', '#0284C7', '#3B82F6',
            '#4F46E5', '#7C3AED', '#8B5CF6', '#DB2777', '#EC4899',
            '#78350F', '#172554', '#0F766E'
        ];

        const state = {
            color: '#000000',
            tool: 'pen',
            brushSize: 10,
            layers: [{ id: 'layer-1', name: '레이어 1', visible: true, opacity: 1.0 }],
            activeLayerId: 'layer-1',
            currentBg: BACKGROUNDS[0],
            transform: { x: 0, y: 0, scale: 1, rotate: 0 },
            history: [],
            historyStep: -1,
            isDrawing: false,
            isPanning: false,
            isGesture: false,
            activeMenu: null
        };

        let brushTipCanvas = null;
        const pointsBuffer = [];
        const pointers = new Map();
        let gestureStart = null;
        let startPan = { x: 0, y: 0 };
        let isSpacePressed = false;
        let els = {};

        function init() {
            els = {
                paper: document.getElementById('paper-area'),
                transformWrapper: document.getElementById('canvas-transform-wrapper'),
                cursor: document.getElementById('cursor-follower'),
                layerList: document.getElementById('layer-list'),
                bgGrid: document.getElementById('background-grid'),
                toolList: document.getElementById('tool-list'),
                colorGrid: document.getElementById('color-grid'),
                zoomLevel: document.getElementById('zoom-level'),
                brushSizeInput: document.getElementById('brush-size-input'),
                sizeBar: document.getElementById('size-bar'),
                undoBtn: document.getElementById('btn-undo'),
                redoBtn: document.getElementById('btn-redo'),
                bgMenuBtn: document.getElementById('btn-bg-menu'),
                layerMenuBtn: document.getElementById('btn-layer-menu'),
                layerCount: document.getElementById('layer-count'),
                layerIndicator: document.getElementById('layer-indicator'),
                menuBg: document.getElementById('menu-background'),
                menuLayers: document.getElementById('menu-layers')
            };

            lucide.createIcons();
            renderTools();
            renderColors();
            renderBackgrounds();
            renderLayers();
            updateUI();
            createBrushTip();

            window.addEventListener('resize', handleResize);
            window.addEventListener('keydown', handleKeyDown);
            window.addEventListener('keyup', handleKeyUp);

            // 중요 수정: 이벤트 타겟을 canvas-container로 변경하여 전체 영역에서 이벤트 감지
            const target = document.getElementById('canvas-container');

            target.addEventListener('pointerdown', startAction);
            target.addEventListener('pointermove', moveAction);
            target.addEventListener('pointerup', stopAction);
            target.addEventListener('pointerleave', stopAction);
            target.addEventListener('pointercancel', stopAction);

            els.brushSizeInput.addEventListener('input', (e) => {
                state.brushSize = parseInt(e.target.value);
                updateUI();
                createBrushTip();
            });

            initLayerCanvas('layer-1');
        }

        // ... (render functions similar to previous, simple DOM updates) ...
        function renderTools() {
            els.toolList.innerHTML = Object.values(TOOLS).map(tool => {
                const activeClass = state.tool === tool.id ? 'bg-[#FEE500] text-[#3A1D1D] shadow-md scale-105 font-bold' : '';
                return `
        <button onclick="setTool('${tool.id}')" 
            class="flex flex-col items-center justify-center p-2.5 rounded-xl transition-all min-w-[60px] text-neutral-400 hover:bg-neutral-50 hover:text-neutral-600 ${activeClass}" 
            id="tool-btn-${tool.id}">
            <i data-lucide="${tool.icon}" width="20"></i>
            <span class="text-[10px] whitespace-nowrap">${tool.label}</span>
        </button>
    `}).join('');
            lucide.createIcons();
        }

        function renderColors() {
            const html = PRESET_COLORS.map(c => {
                const activeClass = state.color === c ? 'ring-4 ring-[#3A1D1D] z-10 scale-110' : '';
                const checkIcon = state.color === c ? '<i data-lucide="check" width="16" class="absolute inset-0 m-auto text-white drop-shadow-md stroke-[3]"></i>' : '';
                return `
        <button onclick="setColor('${c}')" 
            class="w-9 h-9 rounded-full shadow-sm border-2 border-white hover:scale-110 transition-all relative shrink-0 ${activeClass}" 
            style="background-color: ${c}">
            ${checkIcon}
        </button>
    `}).join('');

            els.colorGrid.innerHTML = `
        <label class="relative cursor-pointer w-9 h-9 rounded-full bg-gradient-to-br from-red-500 via-green-500 to-blue-500 shadow-md ring-2 ring-white hover:scale-110 transition-transform">
            <input type="color" id="custom-color-input-inner" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full" value="${state.color}">
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none text-white drop-shadow-md">
                <i data-lucide="plus" width="16"></i>
            </div>
        </label>
        ${html}
    `;
            lucide.createIcons();
            document.getElementById('custom-color-input-inner').addEventListener('input', (e) => setColor(e.target.value));
        }

        function renderBackgrounds() {
            els.bgGrid.innerHTML = BACKGROUNDS.map(bg => {
                const activeClass = state.currentBg.id === bg.id ? 'border-[#FEE500] ring-2 ring-[#FEE500]/30' : 'border-neutral-100 hover:border-neutral-300';
                return `
        <button onclick="setBackground('${bg.id}')" 
            class="aspect-square rounded-lg border-2 relative overflow-hidden transition-all ${activeClass}">
            <div class="absolute inset-0 w-full h-full" style="${objToStyle(bg.style)}"></div>
        </button>
    `}).join('');
        }

        function renderLayers() {
            els.layerCount.innerText = state.layers.length;
            if (state.layers.length > 1) els.layerIndicator.classList.remove('hidden');
            else els.layerIndicator.classList.add('hidden');

            els.layerList.innerHTML = [...state.layers].reverse().map(layer => {
                const activeClass = state.activeLayerId === layer.id ? 'bg-[#FFFDE7] border-[#FEE500]' : 'bg-white border-transparent hover:bg-neutral-50';
                const deleteBtn = state.layers.length > 1 ? `<button onclick="deleteLayer('${layer.id}'); event.stopPropagation();" class="opacity-0 group-hover:opacity-100 text-red-400 hover:text-red-600"><i data-lucide="trash-2" width="14"></i></button>` : '';

                return `
        <div onclick="setActiveLayer('${layer.id}')" 
            class="group flex items-center gap-2 p-2 rounded-xl border-2 cursor-pointer transition-all ${activeClass}">
            <div class="w-8 h-8 rounded bg-neutral-100 flex items-center justify-center text-neutral-400"><i data-lucide="image" width="16"></i></div>
            <div class="flex-1 min-w-0">
                <div class="flex justify-between">
                    <span class="text-xs font-bold ${state.activeLayerId === layer.id ? 'text-[#3A1D1D]' : 'text-neutral-500'}">${layer.name}</span>
                    ${deleteBtn}
                </div>
                <input type="range" min="0" max="1" step="0.1" value="${layer.opacity}" 
                    oninput="updateLayerOpacity('${layer.id}', this.value); event.stopPropagation();" 
                    class="w-full h-1.5 bg-neutral-200 rounded-lg appearance-none cursor-pointer mt-1 accent-[#FEE500]">
            </div>
            <button onclick="toggleLayerVisibility('${layer.id}'); event.stopPropagation();" class="text-neutral-400 hover:text-[#3A1D1D]">
                <i data-lucide="${layer.visible ? 'eye' : 'eye-off'}" width="16"></i>
            </button>
        </div>
    `}).join('');
            lucide.createIcons();
            syncCanvasDOM();
        }

        function syncCanvasDOM() {
            const existingCanvases = Array.from(els.paper.querySelectorAll('canvas'));
            const layerIds = state.layers.map(l => l.id);
            existingCanvases.forEach(c => { if (!layerIds.includes(c.id)) c.remove(); });
            state.layers.forEach((layer, index) => {
                let canvas = document.getElementById(layer.id);
                if (!canvas) {
                    canvas = document.createElement('canvas');
                    canvas.id = layer.id;
                    canvas.className = "absolute top-0 left-0 w-full h-full pointer-events-none";
                    els.paper.appendChild(canvas);
                    initLayerCanvas(layer.id);
                }
                canvas.style.zIndex = state.layers.length - index;
                canvas.style.opacity = layer.visible ? layer.opacity : 0;
            });
        }

        function updateUI() {
            els.zoomLevel.innerText = Math.round(state.transform.scale * 100) + '%';
            els.transformWrapper.style.transform = `translate(${state.transform.x}px, ${state.transform.y}px) scale(${state.transform.scale}) rotate(${state.transform.rotate}deg)`;
            els.brushSizeInput.value = state.brushSize;
            els.sizeBar.style.width = (state.brushSize / 50 * 100) + '%';
            els.undoBtn.disabled = state.historyStep <= 0;
            els.redoBtn.disabled = state.historyStep >= state.history.length - 1;
            els.undoBtn.style.opacity = els.undoBtn.disabled ? 0.3 : 1;
            els.redoBtn.style.opacity = els.redoBtn.disabled ? 0.3 : 1;

        }

        // 중요 수정: getCoordinates 로직 변경 (전체 컨테이너 기준 좌표 계산)
        function getCoordinates(e) {
            const container = document.getElementById('canvas-container'); // Container 기준
            const rect = container.getBoundingClientRect();

            // 컨테이너 중심점 계산
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;

            let dx = e.clientX - cx;
            let dy = e.clientY - cy;

            dx -= state.transform.x;
            dy -= state.transform.y;

            const angleRad = (-state.transform.rotate * Math.PI) / 180;
            const rx = dx * Math.cos(angleRad) - dy * Math.sin(angleRad);
            const ry = dx * Math.sin(angleRad) + dy * Math.cos(angleRad);

            const sx = rx / state.transform.scale;
            const sy = ry / state.transform.scale;

            // els.paper의 초기 크기는 w-full h-full이므로, container 크기와 같음 (초기)
            const baseW = container.offsetWidth;
            const baseH = container.offsetHeight;

            const finalX = sx + baseW / 2;
            const finalY = sy + baseH / 2;

            let pressure = 1.0;
            if (e.pointerType === 'pen') pressure = e.pressure > 0 ? e.pressure : 0.001;
            else pressure = e.pressure > 0 ? 1.0 : 0.5;

            return { x: finalX, y: finalY, pressure };
        }

        // ... (나머지 로직 함수들은 그대로 유지) ...
        function updateCursor() {
            const cursor = els.cursor;
            const tool = TOOLS[state.tool];

                cursor.style.display = 'block';
                cursor.style.width = '20px'; cursor.style.height = '20px';
                cursor.style.backgroundColor = state.color;
                cursor.style.border = '2px solid white';
                cursor.style.borderRadius = '50% 50% 0 50%';
                cursor.style.transform = 'translate(-50%, -50%) rotate(45deg)';
                return;

            cursor.style.height = `${size}px`;
            cursor.style.borderRadius = '50%';
            cursor.style.transform = 'translate(-50%, -50%)';
            if (state.tool === 'eraser') {

            } else {

        function startAction(e) {

            e.target.setPointerCapture(e.pointerId);

        }

        function moveAction(e) {
            e.preventDefault();

            els.cursor.style.left = e.clientX + 'px';
            els.cursor.style.top = e.clientY + 'px';

            if (state.isGesture && pointers.size === 2) {

                const start = gestureStart;
                const dist = Math.hypot(p1.clientX - p2.clientX, p1.clientY - p2.clientY);
                const angle = Math.atan2(p2.clientY - p1.clientY, p2.clientX - p1.clientX) * 180 / Math.PI;

                const scale = Math.max(0.1, Math.min(5, start.transform.scale * (dist / start.dist)));

                const dx = center.x - start.center.x;
                const dy = center.y - start.center.y;

                return;
            }

                state.transform.y = e.clientY - startPan.y;
                updateUI();
                return;
            }
            if (!state.isDrawing || state.tool === 'fill') return;
            const ctx = getContext();
            if (!ctx) return;
            const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
            events.forEach(evt => {
                const c = getCoordinates(evt);
                const last = pointsBuffer[pointsBuffer.length - 1];
                if (last && Math.hypot(last.x - c.x, last.y - c.y) < (TOOLS[state.tool].engine === 'texture' ? 2 : 1)) return;

        function stopAction(e) {
            pointers.delete(e.pointerId);
            e.target.releasePointerCapture(e.pointerId);

            if (state.isPanning && pointers.size === 0) { state.isPanning = false; updateCursor(); return; }
            if (!state.isDrawing) return;
            state.isDrawing = false;
            pointsBuffer.length = 0;
            if (state.tool !== 'fill') saveHistory();
        }

        // ... (Other functions: handleDrawProcess, drawVectorStroke, drawTextureStroke, getBrushSize, createBrushTip, initLayerCanvas, setTool, setColor, setBackground, setActiveLayer, addLayer, deleteLayer, toggleLayerVisibility, updateLayerOpacity, toggleMenu, handleZoom, handleRotate, resetView, changeBrushSize, saveHistory, handleUndo, handleRedo, restoreState, clearCanvas, downloadImage, performFloodFill, objToStyle, handleResize, handleKeyDown, handleKeyUp, getContext) ...
        // (Reusing existing implementations for brevity as they were not problematic)

        function handleDrawProcess(ctx, points) {
            const tool = TOOLS[state.tool];
            if (tool.engine === 'fill') return;
            if (tool.engine === 'texture') {
                if (points.length >= 2) drawTextureStroke(ctx, points[points.length - 2], points[points.length - 1], tool);
            } else {
                if (points.length > 2) drawVectorStroke(ctx, points.slice(-3), state.brushSize, state.color, tool);
            }
        }
        function drawVectorStroke(ctx, points, baseSize, color, tool) {
            const p1 = points[0], p2 = points[1];
            const dynamicSize = getBrushSize(tool.id, baseSize, p1.pressure);
            ctx.beginPath(); ctx.lineWidth = dynamicSize; ctx.lineCap = tool.cap; ctx.lineJoin = tool.join;
            ctx.strokeStyle = tool.id === 'eraser' ? '#ffffff' : color;
            ctx.globalCompositeOperation = tool.composite;
            let alpha = tool.alpha; if (tool.pressureType === 'opacity') alpha *= (0.2 + p1.pressure * 0.8);
            ctx.globalAlpha = alpha;
            const mid = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };

            ctx.stroke(); ctx.globalAlpha = 1.0; ctx.globalCompositeOperation = 'source-over';
        }
        function drawTextureStroke(ctx, p1, p2, tool) {
            if (!brushTipCanvas) return;
            const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
            const size = getBrushSize(tool.id, state.brushSize, p1.pressure);
            const spacing = Math.max(0.5, size * tool.spacing);
            const steps = Math.ceil(dist / spacing);
            ctx.globalCompositeOperation = tool.composite;
            for (let i = 0; i < steps; i++) {
                const t = i / steps;
                const x = p1.x + (p2.x - p1.x) * t;
                const y = p1.y + (p2.y - p1.y) * t;
                const jitter = (tool.id === 'crayon' || tool.id === 'spray') ? (Math.random() - 0.5) * size * 0.3 : 0;
                ctx.save(); ctx.translate(x + jitter, y + jitter);
                let alpha = tool.alpha; if (tool.pressureType === 'opacity') alpha *= Math.max(0.1, p1.pressure);
                ctx.globalAlpha = alpha;
                if (tool.rotationJitter) ctx.rotate(Math.random() * Math.PI * 2);
                ctx.drawImage(brushTipCanvas, -size / 2, -size / 2, size, size);
                ctx.restore();
            }
        }
        function getBrushSize(toolId, baseSize, pressure) {
            const config = TOOLS[toolId]; if (config.engine === 'fill' || config.engine === 'view') return 0;
            let size = baseSize * config.widthMod;
            if (config.pressureType === 'size') { const minSizeRatio = 1 - config.pressureFactor; size = size * (minSizeRatio + (pressure * config.pressureFactor)); }
            return Math.max(1, size);
        }
        function createBrushTip() {
            const tool = TOOLS[state.tool]; if (!tool || tool.engine !== 'texture') { brushTipCanvas = null; return; }
            const size = Math.max(64, state.brushSize * tool.widthMod * 2);
            const cvs = document.createElement('canvas'); cvs.width = size; cvs.height = size;
            const ctx = cvs.getContext('2d'); const center = size / 2; const radius = size / 2;
            ctx.fillStyle = state.color;
            if (tool.textureType === 'soft') {
                const grad = ctx.createRadialGradient(center, center, 0, center, center, radius);
                grad.addColorStop(0, state.color); grad.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.globalAlpha = tool.alpha; ctx.fillStyle = grad; ctx.fillRect(0, 0, size, size);
            } else if (tool.textureType === 'noise' || tool.textureType === 'scatter') {
                ctx.globalAlpha = tool.alpha;
                for (let i = 0; i < (tool.textureType === 'noise' ? 40 : 25); i++) {
                    const r = Math.random() * radius; const a = Math.random() * Math.PI * 2;
                    const x = center + r * Math.cos(a); const y = center + r * Math.sin(a);
                    ctx.beginPath(); ctx.arc(x, y, 0.5 + Math.random(), 0, Math.PI * 2); ctx.fill();
                }
            } else if (tool.textureType === 'grunge') {
                ctx.globalAlpha = tool.alpha;
                for (let i = 0; i < 60; i++) {
                    const r = (Math.random() ** 0.5) * radius; const a = Math.random() * Math.PI * 2;
                    const x = center + r * Math.cos(a); const y = center + r * Math.sin(a);
                    ctx.fillRect(x, y, (Math.random() * radius) / 4, (Math.random() * radius) / 4);
                }
            } else if (tool.textureType === 'square') {
                ctx.globalAlpha = tool.alpha; ctx.translate(center, center); ctx.rotate(-Math.PI / 4);
                ctx.fillRect(-radius * 0.9, -radius * 0.3, radius * 1.8, radius * 0.6);
            }
            brushTipCanvas = cvs;
        }
        function initLayerCanvas(id) {
            const canvas = document.getElementById(id); if (!canvas) return;
            const dpr = window.devicePixelRatio || 1;
            const rect = document.getElementById('paper-area').getBoundingClientRect();
            if (canvas.width === 0 || canvas.width === 300) {
                canvas.width = window.innerWidth * dpr; canvas.height = window.innerHeight * dpr;
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                ctx.scale(dpr, dpr); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            }
        }
        function setTool(id) { state.tool = id; renderTools(); updateUI(); createBrushTip(); }
        function setColor(hex) { state.color = hex; renderColors(); updateUI(); createBrushTip(); }
        function setBackground(id) { state.currentBg = BACKGROUNDS.find(b => b.id === id); renderBackgrounds(); updateUI(); state.activeMenu = null; updateUI(); }
        function setActiveLayer(id) { state.activeLayerId = id; renderLayers(); }
        function addLayer() { const id = `layer-${Date.now()}`; state.layers.unshift({ id, name: `레이어 ${state.layers.length + 1}`, visible: true, opacity: 1.0 }); state.activeLayerId = id; renderLayers(); }
        function deleteLayer(id) { if (state.layers.length <= 1) return; state.layers = state.layers.filter(l => l.id !== id); if (state.activeLayerId === id) state.activeLayerId = state.layers[0].id; renderLayers(); }
        function toggleLayerVisibility(id) { const l = state.layers.find(l => l.id === id); if (l) l.visible = !l.visible; renderLayers(); }
        function updateLayerOpacity(id, val) { const l = state.layers.find(l => l.id === id); if (l) { l.opacity = parseFloat(val); const canvas = document.getElementById(id); if (canvas) canvas.style.opacity = l.visible ? l.opacity : 0; } }
        function toggleMenu(menu) { state.activeMenu = state.activeMenu === menu ? null : menu; updateUI(); }
        function handleZoom(delta) { state.transform.scale = Math.max(0.1, Math.min(5, state.transform.scale + delta)); updateUI(); }
        function handleRotate(deg) { state.transform.rotate += deg; updateUI(); }
        function resetView() { state.transform = { x: 0, y: 0, scale: 1, rotate: 0 }; updateUI(); }
        function changeBrushSize(delta) { state.brushSize = Math.max(1, Math.min(50, state.brushSize + delta)); updateUI(); createBrushTip(); }
        function saveHistory() {
            const canvas = document.getElementById(state.activeLayerId); if (!canvas) return;
            const data = canvas.toDataURL();
            state.history = state.history.slice(0, state.historyStep + 1); state.history.push({ layerId: state.activeLayerId, data });
            if (state.history.length > 20) state.history.shift(); else state.historyStep++;
            updateUI();
        }
        function handleUndo() { if (state.historyStep < 0) return; state.historyStep--; restoreState(); updateUI(); }
        function handleRedo() { if (state.historyStep >= state.history.length - 1) return; state.historyStep++; restoreState(); updateUI(); }
        function restoreState() {
            if (state.historyStep < 0) { clearCanvas(); return; }
            const entry = state.history[state.historyStep]; const canvas = document.getElementById(entry.layerId); const ctx = canvas.getContext('2d');
            const img = new Image(); img.src = entry.data;
            img.onload = () => { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.drawImage(img, 0, 0, canvas.width / window.devicePixelRatio, canvas.height / window.devicePixelRatio); ctx.restore(); }
        }
        function clearCanvas() { const ctx = getContext(); if (ctx) { ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height); saveHistory(); } }
        function downloadImage() {
            const tempCanvas = document.createElement('canvas'); const w = els.paper.offsetWidth * window.devicePixelRatio; const h = els.paper.offsetHeight * window.devicePixelRatio;
            tempCanvas.width = w; tempCanvas.height = h; const tCtx = tempCanvas.getContext('2d');
            tCtx.fillStyle = state.currentBg.style.background || state.currentBg.style.backgroundColor; tCtx.fillRect(0, 0, w, h);
            [...state.layers].reverse().forEach(l => { if (!l.visible) return; const lc = document.getElementById(l.id); if (lc) { tCtx.globalAlpha = l.opacity; tCtx.drawImage(lc, 0, 0); } });
            const link = document.createElement('a'); link.download = `jueunssam-sketch-${Date.now()}.png`; link.href = tempCanvas.toDataURL(); link.click();
        }
        function performFloodFill(startX, startY, hexColor) {
            const ctx = getContext(); if (!ctx) return;
            const dpr = window.devicePixelRatio || 1; const x = Math.floor(startX * dpr); const y = Math.floor(startY * dpr); const w = ctx.canvas.width; const h = ctx.canvas.height;
            const imgData = ctx.getImageData(0, 0, w, h); const data = imgData.data; const startPos = (y * w + x) * 4;
            const [sr, sg, sb, sa] = [data[startPos], data[startPos + 1], data[startPos + 2], data[startPos + 3]];
            const r = parseInt(hexColor.slice(1, 3), 16); const g = parseInt(hexColor.slice(3, 5), 16); const b = parseInt(hexColor.slice(5, 7), 16);
            if (sr === r && sg === g && sb === b && sa === 255) return;
            const stack = [[x, y]]; const match = (pos) => { const dr = Math.abs(data[pos] - sr); const dg = Math.abs(data[pos + 1] - sg); const db = Math.abs(data[pos + 2] - sb); const da = Math.abs(data[pos + 3] - sa); return (dr < 50 && dg < 50 && db < 50 && da < 50); };
            while (stack.length) {
                const [cx, cy] = stack.pop(); const pos = (cy * w + cx) * 4;
                if (match(pos)) {
                    data[pos] = r; data[pos + 1] = g; data[pos + 2] = b; data[pos + 3] = 255;
                    if (cx > 0) stack.push([cx - 1, cy]); if (cx < w - 1) stack.push([cx + 1, cy]); if (cy > 0) stack.push([cx, cy - 1]); if (cy < h - 1) stack.push([cx, cy + 1]);
                }
            }
            ctx.putImageData(imgData, 0, 0); saveHistory();
        }
        function objToStyle(styleObj) { return Object.entries(styleObj).map(([k, v]) => `${k.replace(/[A-Z]/g, m => "-" + m.toLowerCase())}:${v}`).join(';'); }
        function handleResize() { state.layers.forEach(l => initLayerCanvas(l.id)); }
        function handleKeyDown(e) { if (e.code === 'Space') isSpacePressed = true; updateCursor(); }
        function handleKeyUp(e) { if (e.code === 'Space') isSpacePressed = false; updateCursor(); }
        function getContext() { const c = document.getElementById(state.activeLayerId); return c ? c.getContext('2d') : null; }

        // 시작
        init();

    </script>
