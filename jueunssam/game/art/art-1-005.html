<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>알록달록 색칠 미술관</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* [Core Reset & Safe Area] */
        :root {
            --gnb-height: 60px;
            --app-bg: #fdf4ff;
            /* Light Pink Background */
        }

        body {
            font-family: 'Jua', sans-serif;
            background-color: var(--app-bg);
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            height: 100vh;
            width: 100vw;
        }

        /* [GNB Styles] */
        #gnb {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--gnb-height);
            background-color: #FEE500;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* [Game Container] */
        #game-container {
            position: absolute;
            top: var(--gnb-height);
            left: 0;
            width: 100%;
            height: calc(100vh - var(--gnb-height));
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: var(--app-bg);
        }

        /* [Animations] */
        .btn-press {
            transition: transform 0.1s;
        }

        .btn-press:active {
            transform: scale(0.95);
        }

        .btn-bounce {
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-bounce:active {
            transform: scale(0.9);
        }

        .modal-enter {
            animation: modalFadeIn 0.3s forwards;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* [Coloring App Styles] */
        .tool-btn {
            transition: all 0.2s;
            border: 0.4vmin solid transparent;
        }

        .tool-btn.active {
            background-color: #fce7f3;
            border-color: #f472b6;
            transform: translateY(-0.5vmin);
            box-shadow: 0 0.5vmin 1vmin rgba(0, 0, 0, 0.1);
        }

        .color-btn {
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            box-shadow: inset 0 -0.5vmin 0.5vmin rgba(0, 0, 0, 0.1), 0 0.4vmin 0.8vmin rgba(0, 0, 0, 0.15);
            border: 0.5vmin solid white;
            flex: 1;
            max-width: 7.5vmin;
            aspect-ratio: 1/1;
        }

        .color-btn.active {
            transform: scale(1.15) translateY(-1vmin);
            box-shadow: 0 1vmin 2vmin rgba(0, 0, 0, 0.2);
            border-color: #fff;
            z-index: 10;
        }

        .canvas-container {
            position: relative;
            background-color: white;
            box-shadow: 0 1vmin 3vmin rgba(0, 0, 0, 0.1);
            overflow: hidden;
            touch-action: none;
            transform-origin: center center;
            transition: transform 0.3s ease-out;
            margin: auto;
        }

        #drawing-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #template-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            mix-blend-mode: multiply;
            object-fit: fill;
        }

        #screen-selection {
            display: flex;
            flex-wrap: wrap;
            align-content: center;
            justify-content: center;
            gap: 3vmin;
            height: 100%;
            overflow: hidden;
        }

        .selection-card {
            background: white;
            border-radius: 3vmin;
            overflow: hidden;
            box-shadow: 0 1vmin 2vmin rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
            border: 0.6vmin solid transparent;
            cursor: pointer;
            width: 42%;
            height: 42%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .selection-card:hover {
            transform: translateY(-1vmin);
            box-shadow: 0 2vmin 3vmin rgba(0, 0, 0, 0.1);
            border-color: #f472b6;
        }

        .selection-card:active {
            transform: scale(0.95);
        }

        #effect-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        #zoom-viewport {
            overflow: auto;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            -ms-overflow-style: none;
            scrollbar-width: none;
            position: relative;
        }

        #zoom-viewport::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

<body>

    <canvas id="effect-canvas"></canvas>

    <!-- [1. GNB] -->
    <nav id="gnb">
        <div class="flex items-center gap-2">
            <h1
                class="text-xl md:text-2xl font-bold text-gray-800 whitespace-nowrap overflow-hidden text-ellipsis max-w-[50vw]">
                🎨 <span>알록달록 색칠 미술관</span>
            </h1>
        </div>
        <div class="flex gap-2">
            <button id="btn-exit"
                class="bg-gray-600 text-white rounded-full px-4 py-1 text-sm font-bold shadow-sm hover:bg-gray-700 btn-press">
                종료
            </button>
        </div>
    </nav>

    <!-- [2. Game Container] -->
    <div id="game-container">
        <!-- Main App Wrapper (Modified to fit within container) -->
        <!-- Using aspect-ratio to maintain square-ish shape similar to vmin logic but contained -->
        <div id="app-wrapper" class="h-[95%] aspect-square flex flex-col relative max-w-[98vw]">

            <!-- Internal Header (Back, Save, Zoom) -->
            <header class="w-full flex justify-between items-center mb-[1.5vmin] shrink-0 z-50 px-[1vmin]">
                <h1 class="text-[4.5vmin] text-pink-500 flex items-center gap-[1.5vmin] drop-shadow-sm font-bold">
                    <i data-lucide="palette" class="w-[6vmin] h-[6vmin]"></i>
                    <span id="header-title">그림 선택하기</span>
                </h1>
                <div class="flex gap-[1.5vmin] items-center">
                    <button id="btn-back" onclick="goBack()"
                        class="hidden bg-white p-[1.2vmin] rounded-full shadow border border-gray-100 btn-bounce text-pink-400">
                        <i data-lucide="home" class="w-[4.5vmin] h-[4.5vmin]"></i>
                    </button>

                    <button id="btn-save" onclick="saveDrawing()"
                        class="hidden bg-white p-[1.2vmin] rounded-full shadow border border-gray-100 btn-bounce text-blue-400">
                        <i data-lucide="camera" class="w-[4.5vmin] h-[4.5vmin]"></i>
                    </button>

                    <div id="zoom-controls"
                        class="hidden flex gap-[1vmin] bg-white p-[0.8vmin] rounded-full shadow border border-gray-100 items-center">
                        <button onclick="zoomCanvas(-0.1)"
                            class="p-[1vmin] rounded-full hover:bg-gray-50 active:bg-gray-100 text-gray-500">
                            <i data-lucide="zoom-out" class="w-[3.5vmin] h-[3.5vmin]"></i>
                        </button>
                        <span id="zoom-display"
                            class="flex items-center text-[2.2vmin] text-gray-500 w-[7vmin] justify-center font-bold">100%</span>
                        <button onclick="zoomCanvas(0.1)"
                            class="p-[1vmin] rounded-full hover:bg-gray-50 active:bg-gray-100 text-pink-500">
                            <i data-lucide="zoom-in" class="w-[3.5vmin] h-[3.5vmin]"></i>
                        </button>
                    </div>
                </div>
            </header>

            <!-- Main Content Area -->
            <main
                class="w-full bg-white rounded-[4vmin] shadow-xl p-[2vmin] flex flex-col relative flex-grow overflow-hidden border-[0.6vmin] border-pink-50">

                <!-- Screen 1: Selection Grid -->
                <div id="screen-selection">
                    <!-- Cards injected by JS -->
                </div>

                <!-- Screen 2: Coloring Workspace (Hidden) -->
                <div id="screen-workspace" class="hidden w-full h-full flex flex-col">

                    <!-- Canvas Viewport -->
                    <div id="canvas-wrapper"
                        class="flex-grow relative bg-gray-50 rounded-[3vmin] border-[0.4vmin] border-gray-100 overflow-hidden cursor-crosshair">
                        <div id="zoom-viewport">
                            <div id="canvas-container" class="canvas-container">
                                <canvas id="drawing-canvas"></canvas>
                                <img id="template-image" src="" alt="sketch" draggable="false">
                            </div>
                        </div>
                    </div>

                    <!-- Tools & Palette -->
                    <div class="mt-[1.5vmin] flex flex-col gap-[1.5vmin] shrink-0">

                        <!-- Brush Tools -->
                        <div class="flex justify-between items-center px-[1vmin]">
                            <div class="flex gap-[2vmin] items-center">
                                <span class="text-[2.2vmin] text-gray-400">붓 크기:</span>
                                <div class="flex gap-[1vmin] bg-gray-100 rounded-full p-[0.5vmin]">
                                    <button onclick="setBrushSize(5)"
                                        class="brush-size-btn w-[4.5vmin] h-[4.5vmin] rounded-full bg-white border border-gray-200 flex items-center justify-center active:scale-90 transition-transform shadow-sm"
                                        data-size="5">
                                        <div class="w-[0.8vmin] h-[0.8vmin] bg-gray-600 rounded-full"></div>
                                    </button>
                                    <button onclick="setBrushSize(15)"
                                        class="brush-size-btn w-[4.5vmin] h-[4.5vmin] rounded-full bg-white border border-gray-200 flex items-center justify-center active:scale-90 transition-transform shadow-sm ring-2 ring-pink-300"
                                        data-size="15">
                                        <div class="w-[1.8vmin] h-[1.8vmin] bg-gray-600 rounded-full"></div>
                                    </button>
                                    <button onclick="setBrushSize(30)"
                                        class="brush-size-btn w-[4.5vmin] h-[4.5vmin] rounded-full bg-white border border-gray-200 flex items-center justify-center active:scale-90 transition-transform shadow-sm"
                                        data-size="30">
                                        <div class="w-[3vmin] h-[3vmin] bg-gray-600 rounded-full"></div>
                                    </button>
                                </div>
                            </div>

                            <!-- Eraser Toggle -->
                            <button id="btn-eraser" onclick="toggleEraser()"
                                class="tool-btn flex items-center gap-[0.8vmin] px-[2vmin] py-[0.8vmin] bg-gray-50 text-gray-500 rounded-full text-[2.2vmin] font-bold hover:bg-gray-100">
                                <i data-lucide="eraser" class="w-[2.5vmin] h-[2.5vmin]"></i> 지우개
                            </button>
                        </div>

                        <!-- Colors -->
                        <div id="palette-wrapper" class="w-full">
                            <div id="palette"
                                class="flex flex-nowrap justify-between gap-[1vmin] w-full px-[0.5vmin] overflow-visible">
                                <!-- Colors injected here -->
                            </div>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <!-- [3. Exit Confirm Modal] -->
    <div id="modal-exit" class="hidden fixed inset-0 bg-black/50 z-[20000] flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 w-[80%] max-w-lg shadow-2xl relative modal-enter text-center">
            <h3 class="text-3xl font-bold text-gray-800 mb-4">정말 종료할까요?</h3>
            <p class="text-xl text-gray-500 mb-8">진행 상황이 저장되지 않아요.</p>
            <div class="flex justify-center gap-4">
                <button id="btn-cancel-exit"
                    class="bg-gray-200 text-gray-700 text-xl px-6 py-3 rounded-full hover:bg-gray-300">아니요</button>
                <button id="btn-confirm-exit"
                    class="bg-red-500 text-white text-xl px-6 py-3 rounded-full hover:bg-red-600">네, 종료해요</button>
            </div>
        </div>
    </div>

    <script>
        // --- Data & Config ---
        const images = [
            "https://jueunssam.com/wp-content/uploads/ssam/game/art-svg/005.svg",
            "https://jueunssam.com/wp-content/uploads/ssam/game/art-svg/006.svg",
            "https://jueunssam.com/wp-content/uploads/ssam/game/art-svg/007.svg",
            "https://jueunssam.com/wp-content/uploads/ssam/game/art-svg/008.svg"
        ];

        const colors = [
            { hex: '#FF3B30', name: '빨강' },
            { hex: '#FF9500', name: '주황' },
            { hex: '#FFCC00', name: '노랑' },
            { hex: '#A4E062', name: '연두' },
            { hex: '#34C759', name: '초록' },
            { hex: '#32ADE6', name: '하늘' },
            { hex: '#007AFF', name: '파랑' },
            { hex: '#5856D6', name: '남색' },
            { hex: '#AF52DE', name: '보라' },
            { hex: '#FF2D55', name: '분홍' },
            { hex: '#A2845E', name: '갈색' },
            { hex: '#000000', name: '검정' },
        ];

        let state = {
            currentImage: null,
            currentColor: colors[0].hex,
            brushSize: 15,
            isDrawing: false,
            isEraser: false,
            zoomLevel: 1.0,
            lastX: 0,
            lastY: 0
        };

        const canvas = document.getElementById('drawing-canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        const templateImg = document.getElementById('template-image');

        function init() {
            renderSelectionScreen();
            renderPalette();
            lucide.createIcons();
            setupCanvasInteraction();
            updateBrushUI();
            setupExitModal();

            document.body.addEventListener('click', () => {
                if (audioCtx.state === 'suspended') audioCtx.resume();
            }, { once: true });
        }

        function setupExitModal() {
            const exitModal = document.getElementById('modal-exit');
            const btnExit = document.getElementById('btn-exit');
            const btnCancel = document.getElementById('btn-cancel-exit');
            const btnConfirm = document.getElementById('btn-confirm-exit');

            btnExit.onclick = () => {
                exitModal.classList.remove('hidden');
                playPopSound();
            };

            btnCancel.onclick = () => {
                exitModal.classList.add('hidden');
                playTickSound();
            };

            btnConfirm.onclick = () => {
                if (window.history.length > 1) {
                    window.history.back();
                } else {
                    window.close();
                }
            };
        }

        function renderSelectionScreen() {
            const grid = document.getElementById('screen-selection');
            grid.innerHTML = '';

            images.forEach((url, idx) => {
                const card = document.createElement('div');
                card.className = 'selection-card group';
                card.onclick = () => selectImage(url);

                const img = document.createElement('img');
                img.src = url;
                img.className = 'w-[65%] h-[65%] object-contain group-hover:scale-110 transition-transform duration-300';
                img.draggable = false;

                const label = document.createElement('div');
                label.className = 'absolute bottom-[1vmin] w-full text-center text-pink-400 text-[2vmin] font-bold opacity-0 group-hover:opacity-100 transition-opacity';
                label.innerText = `그림 ${idx + 1}`;

                card.appendChild(img);
                card.appendChild(label);
                grid.appendChild(card);
            });
        }

        function renderPalette() {
            const pal = document.getElementById('palette');
            pal.innerHTML = '';

            colors.forEach((c, idx) => {
                const btn = document.createElement('div');
                btn.className = `color-btn rounded-full ${idx === 0 ? 'active' : ''}`;
                btn.style.backgroundColor = c.hex;
                btn.onclick = () => setColor(c.hex, btn);
                pal.appendChild(btn);
            });
        }

        function selectImage(url) {
            playPopSound();

            document.getElementById('screen-selection').classList.add('hidden');
            document.getElementById('screen-workspace').classList.remove('hidden');
            document.getElementById('header-title').innerText = "알록달록 색칠하기";
            document.getElementById('btn-back').classList.remove('hidden');
            document.getElementById('btn-save').classList.remove('hidden');
            document.getElementById('zoom-controls').classList.remove('hidden');

            state.currentImage = url;
            state.zoomLevel = 1.0;
            state.isEraser = false;
            updateEraserUI();
            updateZoomUI();

            container.style.width = '0px';
            container.style.height = '0px';

            templateImg.src = url;
            templateImg.onload = () => {
                const aspect = templateImg.naturalWidth / templateImg.naturalHeight;
                // Adjusted dimensions to fit within the new flex container structure
                const maxW = 90;
                const maxH = 65;

                let finalW, finalH;
                if (aspect > (maxW / maxH)) {
                    finalW = maxW;
                    finalH = maxW / aspect;
                } else {
                    finalH = maxH;
                    finalW = maxH * aspect;
                }

                container.style.width = `${finalW}vmin`;
                container.style.height = `${finalH}vmin`;
                container.style.margin = 'auto';

                const baseRes = 1500;
                if (aspect > 1) {
                    canvas.width = baseRes;
                    canvas.height = baseRes / aspect;
                } else {
                    canvas.width = baseRes * aspect;
                    canvas.height = baseRes;
                }

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
            };
        }

        function goBack() {
            playPopSound();
            document.getElementById('screen-selection').classList.remove('hidden');
            document.getElementById('screen-workspace').classList.add('hidden');
            document.getElementById('header-title').innerText = "그림 선택하기";
            document.getElementById('btn-back').classList.add('hidden');
            document.getElementById('btn-save').classList.add('hidden');
            document.getElementById('zoom-controls').classList.add('hidden');
        }

        function saveDrawing() {
            playTickSound();

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            const tCtx = tempCanvas.getContext('2d');

            const triggerDownload = () => {
                try {
                    const link = document.createElement('a');
                    link.download = '나만의_작품.png';
                    link.href = tempCanvas.toDataURL();
                    link.click();
                    playMagicSound();
                } catch (e) {
                    alert("저장에 실패했습니다.");
                }
            };

            tCtx.fillStyle = '#ffffff';
            tCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
            tCtx.drawImage(canvas, 0, 0);

            const saveImg = new Image();
            saveImg.crossOrigin = "anonymous";
            saveImg.src = state.currentImage + "?t=" + new Date().getTime();

            saveImg.onload = () => {
                tCtx.globalCompositeOperation = 'multiply';
                tCtx.drawImage(saveImg, 0, 0, tempCanvas.width, tempCanvas.height);
                triggerDownload();
            };

            saveImg.onerror = () => {
                console.warn("CORS blocked outline image.");
                alert("보안 설정으로 인해 밑그림 저장이 제한되었습니다. 색칠한 그림만 저장합니다.");
                triggerDownload();
            };
        }

        function toggleEraser() {
            state.isEraser = !state.isEraser;
            playTickSound();
            updateEraserUI();
        }

        function updateEraserUI() {
            const btn = document.getElementById('btn-eraser');
            if (state.isEraser) {
                btn.classList.add('active', 'text-pink-500', 'bg-pink-100');
                btn.classList.remove('text-gray-500', 'bg-gray-50');
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
            } else {
                btn.classList.remove('active', 'text-pink-500', 'bg-pink-100');
                btn.classList.add('text-gray-500', 'bg-gray-50');
                updateColorUI();
            }
        }

        function setColor(hex, btnElement) {
            state.currentColor = hex;
            if (state.isEraser) {
                state.isEraser = false;
                updateEraserUI();
            }
            playTickSound();
            updateColorUI();
            fireSplash(hex);
        }

        function updateColorUI() {
            document.querySelectorAll('.color-btn').forEach(b => {
                b.classList.remove('active');
            });
            const buttons = document.querySelectorAll('.color-btn');
            const colorIndex = colors.findIndex(c => c.hex === state.currentColor);
            if (colorIndex >= 0 && buttons[colorIndex]) {
                buttons[colorIndex].classList.add('active');
            }
        }

        function setBrushSize(size) {
            state.brushSize = size;
            playTickSound();
            updateBrushUI();
        }

        function updateBrushUI() {
            document.querySelectorAll('.brush-size-btn').forEach(btn => {
                if (parseInt(btn.dataset.size) === state.brushSize) {
                    btn.classList.add('ring-2', 'ring-pink-300');
                } else {
                    btn.classList.remove('ring-2', 'ring-pink-300');
                }
            });
        }

        function zoomCanvas(delta) {
            let newZoom = state.zoomLevel + delta;
            if (newZoom < 0.5) newZoom = 0.5;
            if (newZoom > 3.0) newZoom = 3.0;
            state.zoomLevel = newZoom;
            updateZoomUI();
            playTickSound();
        }

        function updateZoomUI() {
            document.getElementById('zoom-display').innerText = Math.round(state.zoomLevel * 100) + '%';
            container.style.transform = `scale(${state.zoomLevel})`;
            if (state.zoomLevel > 1) {
                const marginVal = (state.zoomLevel - 1) * 25;
                container.style.margin = `${marginVal}vmin auto`;
            } else {
                container.style.margin = 'auto';
            }
        }

        // --- Drawing Logic ---
        function setupCanvasInteraction() {
            container.addEventListener('mousedown', startPaint);
            container.addEventListener('mousemove', paint);
            container.addEventListener('mouseup', stopPaint);
            container.addEventListener('mouseleave', stopPaint);

            container.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                startPaint(touch);
            }, { passive: false });
            container.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                paint(touch);
            }, { passive: false });
            container.addEventListener('touchend', stopPaint);
        }

        function getCoordinates(event) {
            const rect = container.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return { x: x * scaleX, y: y * scaleY };
        }

        function startPaint(e) {
            state.isDrawing = true;
            const coords = getCoordinates(e);
            state.lastX = coords.x;
            state.lastY = coords.y;
            drawPoint(coords.x, coords.y);
        }

        function paint(e) {
            if (!state.isDrawing) return;
            const coords = getCoordinates(e);

            ctx.beginPath();
            if (state.isEraser) {
                ctx.strokeStyle = '#ffffff';
            } else {
                ctx.strokeStyle = state.currentColor;
            }

            const scaleFactor = canvas.width / 800;
            ctx.lineWidth = state.brushSize * scaleFactor * 2;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.moveTo(state.lastX, state.lastY);
            ctx.lineTo(coords.x, coords.y);
            ctx.stroke();

            state.lastX = coords.x;
            state.lastY = coords.y;
        }

        function stopPaint() {
            state.isDrawing = false;
        }

        function drawPoint(x, y) {
            const scaleFactor = canvas.width / 800;
            ctx.beginPath();
            if (state.isEraser) {
                ctx.fillStyle = '#ffffff';
            } else {
                ctx.fillStyle = state.currentColor;
            }
            ctx.arc(x, y, (state.brushSize * scaleFactor), 0, Math.PI * 2);
            ctx.fill();
        }

        // --- Audio & Effects ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playTickSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            osc.start(); osc.stop(audioCtx.currentTime + 0.05);
        }

        function playPopSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
            osc.start(); osc.stop(audioCtx.currentTime + 0.15);
        }

        function playMagicSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const notes = [1046, 1318, 1567, 2093];
            notes.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0, audioCtx.currentTime + i * 0.1);
                gain.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + i * 0.1 + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.1 + 0.3);
                osc.start(audioCtx.currentTime + i * 0.1);
                osc.stop(audioCtx.currentTime + i * 0.1 + 0.3);
            });
        }

        const effectCanvas = document.getElementById("effect-canvas");
        const effectCtx = effectCanvas.getContext("2d");
        let particles = [];

        function resizeEffectCanvas() {
            effectCanvas.width = window.innerWidth;
            effectCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeEffectCanvas);
        resizeEffectCanvas();

        function fireSplash(color) {
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight * 0.8;
            for (let i = 0; i < 15; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 10 + 2;
                particles.push({
                    x: centerX, y: centerY,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 5,
                    size: Math.random() * 8 + 3,
                    color: color,
                    life: 1.0,
                    decay: Math.random() * 0.04 + 0.02,
                    gravity: 0.4
                });
            }
        }

        function updateParticles() {
            effectCtx.clearRect(0, 0, effectCanvas.width, effectCanvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy; p.vy += p.gravity; p.life -= p.decay;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                effectCtx.beginPath();
                effectCtx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                effectCtx.fillStyle = p.color;
                effectCtx.globalAlpha = p.life;
                effectCtx.fill();
            }
            effectCtx.globalAlpha = 1.0;
            requestAnimationFrame(updateParticles);
        }
        updateParticles();

        window.onload = init;
    </script>
