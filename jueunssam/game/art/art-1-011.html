<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>꼬마 화가의 도형 놀이</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* [Core Reset & Safe Area] */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        :root {
            --gnb-height: 60px;
            --app-bg: #ecfdf5;
        }

        body {
            font-family: 'Jua', sans-serif;
            background-color: var(--app-bg);
            background-image:
                radial-gradient(#6ee7b7 15%, transparent 16%),
                radial-gradient(#6ee7b7 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            height: 100vh;
            width: 100vw;
        }

        /* [GNB Styles] */
        #gnb {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--gnb-height);
            background-color: #FEE500;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* [Game Container & Scaling] */
        #game-container {
            position: absolute;
            top: var(--gnb-height);
            left: 0;
            width: 100%;
            height: calc(100vh - var(--gnb-height));
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #scalable-wrapper {
            width: 100%;
            height: 100%;
            max-width: 1000px;
            max-height: 800px;
            padding: 2vmin;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }

        /* [Game Elements] */
        .canvas-area {
            background-color: #ffffff;
            border-radius: 2rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            position: relative;
            overflow: hidden;
            width: 90%;
            height: 90%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            border: 6px solid #d1fae5;
        }

        .draggable-shape {
            position: absolute;
            cursor: grab;
            filter: drop-shadow(2px 4px 6px rgba(0, 0, 0, 0.15));
            touch-action: none;
            z-index: 10;
            transition: transform 0.1s;
        }

        .draggable-shape:active {
            cursor: grabbing;
            transform: scale(1.1);
            z-index: 50;
        }

        .returning {
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 20;
        }

        .snapping {
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 20;
        }

        .target-zone {
            position: absolute;
            background-color: transparent;
            transform: translate(-50%, -50%);
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        .target-hover {
            transform: translate(-50%, -50%) scale(1.1);
        }

        .target-hover path,
        .target-hover circle,
        .target-hover rect,
        .target-hover polygon {
            stroke: #10B981 !important;
            fill: #D1FAE5 !important;
            fill-opacity: 0.3;
        }

        .pop-in {
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes popIn {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0;
            }

            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        /* [Animations] */
        .bounce {
            animation: bounce 2s infinite;
        }

        @keyframes bounce {

            0%,
            20%,
            50%,
            80%,
            100% {
                transform: translateY(0);
            }

            40% {
                transform: translateY(-1.5vmin);
            }

            60% {
                transform: translateY(-0.75vmin);
            }
        }

        .btn-press {
            transition: transform 0.1s;
        }

        .btn-press:active {
            transform: scale(0.95);
        }

        .modal-enter {
            animation: modalFadeIn 0.3s forwards;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .intro-shape {
            position: absolute;
            opacity: 0.2;
            animation: spin 20s linear infinite;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        #confetti {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 100;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

                ttsAudio = null;
            }
            window.speechSynthesis.cancel();
        }

        async function speak(keyOrText, isRaw = false) {
            stopTTS();
            const text = isRaw ? keyOrText : (I18N_DATA[currentLang][keyOrText] || keyOrText);
            if (!text) return;

            if (!googleTTSAvailable) {
                fallbackSpeak(text);
                return;
            }

            const langCode = currentLang === 'ko' ? 'ko-KR' : 'en-US';
            const voiceName = currentLang === 'ko' ? 'ko-KR-Standard-A' : 'en-US-Standard-E';

            try {
                const response = await fetch(`https://texttospeech.googleapis.com/v1/text:synthesize?key=${GOOGLE_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        input: { text: text },
                        voice: { languageCode: langCode, name: voiceName },
                        audioConfig: { audioEncoding: 'MP3' }
                    })
                });

                if (!response.ok) throw new Error(`API Error: ${response.status}`);

                const data = await response.json();
                if (data.audioContent) {
                    const audioBlob = await fetch(`data:audio/mp3;base64,${data.audioContent}`).then(res => res.blob());
                    const audioUrl = URL.createObjectURL(audioBlob);
                    ttsAudio = new Audio(audioUrl);
                    ttsAudio.play().catch(e => console.error("Audio Playback Error:", e));
                } else {
                    fallbackSpeak(text);
                }
            } catch (e) {
                console.warn("Google TTS failed:", e);
                googleTTSAvailable = false;
                fallbackSpeak(text);
            }
        }

        function fallbackSpeak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            const isEnglish = currentLang !== 'ko';
            utterance.lang = isEnglish ? 'en-US' : 'ko-KR';
            utterance.rate = 0.9;

            if (availableVoices.length === 0) availableVoices = window.speechSynthesis.getVoices();

            if (isEnglish) {
                const targetVoices = ["Google US English", "Samantha", "Microsoft Zira"];
                let selectedVoice = availableVoices.find(v => targetVoices.some(target => v.name.includes(target)));
                if (!selectedVoice) selectedVoice = availableVoices.find(v => v.lang === 'en-US');
                if (selectedVoice) utterance.voice = selectedVoice;
            } else {
                const koVoice = availableVoices.find(v => v.name.includes('Google 한국어') || v.lang === 'ko-KR');
                if (koVoice) utterance.voice = koVoice;
            }
            window.speechSynthesis.speak(utterance);
        }

        // --- [4. Game Logic] ---
        function startGame() {
            stopTTS();
            document.getElementById('intro-screen').classList.add('hidden');
            document.getElementById('app-content').classList.remove('hidden');
            document.getElementById('btn-restart').classList.remove('hidden');
            currentLevelIdx = 0;
            loadLevel(currentLevelIdx);
        }

        function resetGame(fullReset = false) {
            stopTTS();
            if (fullReset) {
                document.getElementById('intro-screen').classList.remove('hidden');
                document.getElementById('app-content').classList.add('hidden');
                document.getElementById('btn-restart').classList.add('hidden');
                document.getElementById('all-clear-overlay').classList.add('hidden');
            } else {
                document.getElementById('all-clear-overlay').classList.add('hidden');
                currentLevelIdx = 0;
                loadLevel(0);
            }
        }

        function loadLevel(idx) {
            if (idx >= levels.length) {
                showAllClear();
                return;
            }

            const canvas = document.getElementById('play-canvas');
            canvas.innerHTML = '';

            // Add Background Zones
            // Top Zone (Targets) - 65%
            const topZone = document.createElement('div');
            topZone.className = "absolute top-0 left-0 w-full h-[65%] pointer-events-none";
            canvas.appendChild(topZone);

            // Bottom Zone (Tray) - 35% with dashed border
            const trayZone = document.createElement('div');
            trayZone.className = "absolute bottom-0 left-0 w-full h-[35%] bg-gray-50 border-t-[0.5vmin] border-gray-200 border-dashed pointer-events-none";
            canvas.appendChild(trayZone);

            document.getElementById('next-overlay').classList.add('hidden');
            document.getElementById('next-overlay').classList.remove('flex');
            document.getElementById('score').innerText = `${idx + 1} / ${levels.length}`;

            const level = levels[idx];
            filledTargets = 0;

            const hint = currentLang === 'ko' ? level.hintKo : level.hintEn;
            document.getElementById('instruction-text').innerText = hint;
            speak(hint, true);

            // 1. Create Target Zones
            level.targets.forEach((t) => {
                const tData = shapes.find(s => s.id === t.id);
                const zone = document.createElement('div');
                zone.className = 'target-zone pop-in';
                zone.dataset.targetId = t.id;
                zone.dataset.filled = "false";

                // Relative to Play Canvas (which contains both Top and Bottom visually, but logical play area is top 65%)
                // We use percentages relative to the whole #play-canvas.
                // The provided levels data uses ~40% Y which falls in the top section (0-65%).
                zone.style.left = `${t.pos.x}%`;
                zone.style.top = `${t.pos.y}%`;
                zone.style.width = '16vmin';
                zone.style.height = '16vmin';

                let outlineSvg = tData.svg.replace(/fill="[^"]*"/g, 'fill="none" stroke="#cbd5e1" stroke-width="5" stroke-dasharray="10,10"');

                zone.innerHTML = `
                    <svg viewBox="0 0 100 100" class="w-full h-full absolute inset-0">${outlineSvg}</svg>
                    <i data-lucide="plus" style="width:5vmin; height:5vmin; opacity:0.5; z-index:2;"></i>
                `;
                canvas.appendChild(zone);
            });
            lucide.createIcons();

            // 2. Create Draggable Shapes
            const requiredIds = level.targets.map(t => t.id);
            let deck = shapes.filter(s => requiredIds.includes(s.id));

            // Add Distractors (fill up to 5 items)
            const neededDistractors = 5 - deck.length;
            const potentialDistractors = shapes.filter(s => !requiredIds.includes(s.id));
            const distractors = potentialDistractors.sort(() => 0.5 - Math.random()).slice(0, neededDistractors);

            deck = [...deck, ...distractors].sort(() => 0.5 - Math.random());

            const trayTop = 65; // Matches the divider split
            const trayHeight = 35;
            const totalShapes = deck.length;
            const gap = 100 / (totalShapes + 1);

            deck.forEach((shapeData, i) => {
                const el = document.createElement('div');
                el.className = 'draggable-shape';
                el.dataset.id = shapeData.id;
                el.style.width = '14vmin';
                el.style.height = '14vmin';

                const posX = (i + 1) * gap;
                const posY = trayTop + trayHeight / 2;

                el.dataset.orgX = posX;
                el.dataset.orgY = posY;

                el.style.left = `${posX}%`;
                el.style.top = `${posY}%`;
                el.style.transform = 'translate(-50%, -50%)';

                el.innerHTML = `<svg viewBox="0 0 100 100" class="w-full h-full">${shapeData.svg}</svg>`;

                addDragEvents(el);
                canvas.appendChild(el);
            });
        }

        // --- Drag & Drop Logic ---
        function addDragEvents(el) {
            el.addEventListener('mousedown', handleStart);
            el.addEventListener('touchstart', handleStart, { passive: false });
        }

        function handleStart(e) {
            if (isProcessing) return;
            e.preventDefault();

            activeShape = e.currentTarget;
            activeShape.classList.remove('returning');

            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;

            const rect = activeShape.getBoundingClientRect();
            dragOffsetX = clientX - (rect.left + rect.width / 2);
            dragOffsetY = clientY - (rect.top + rect.height / 2);

            document.addEventListener('mousemove', handleMove);
            document.addEventListener('mouseup', handleEnd);
            document.addEventListener('touchmove', handleMove, { passive: false });
            document.addEventListener('touchend', handleEnd);

            playSound('pop');
            activeShape.style.zIndex = 100;
        }

        function handleMove(e) {
            if (!activeShape) return;
            e.preventDefault();

            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;

            const canvas = document.getElementById('play-canvas');
            const canvasRect = canvas.getBoundingClientRect();

            let x = clientX - canvasRect.left - dragOffsetX;
            let y = clientY - canvasRect.top - dragOffsetY;

            activeShape.style.left = `${x}px`;
            activeShape.style.top = `${y}px`;
            activeShape.style.transform = 'translate(-50%, -50%) scale(1.1)';

            checkHover(activeShape);
        }

        function checkHover(shape) {
            const targets = document.querySelectorAll('.target-zone');
            targets.forEach(t => {
                if (t.dataset.filled === "true") return;
                const dist = getDistance(shape, t);
                const threshold = t.offsetWidth * 0.7;
                if (dist < threshold && t.dataset.targetId === shape.dataset.id) {
                    t.classList.add('target-hover');
                } else {
                    t.classList.remove('target-hover');
                }
            });
        }

        function handleEnd(e) {
            if (!activeShape) return;

            const shapeId = activeShape.dataset.id;
            const targets = document.querySelectorAll('.target-zone');
            let matchedTarget = null;

            targets.forEach(t => {
                if (t.dataset.filled === "true") return;
                t.classList.remove('target-hover');
                const dist = getDistance(activeShape, t);
                const threshold = t.offsetWidth * 0.7;
                if (dist < threshold && t.dataset.targetId === shapeId) {
                    matchedTarget = t;
                }
            });

            if (matchedTarget) {
                snapToTarget(activeShape, matchedTarget);
            } else {
                returnToOrigin(activeShape);
            }

            document.removeEventListener('mousemove', handleMove);
            document.removeEventListener('mouseup', handleEnd);
            document.removeEventListener('touchmove', handleMove);
            document.removeEventListener('touchend', handleEnd);
            activeShape = null;
        }

        function getDistance(el1, el2) {
            const r1 = el1.getBoundingClientRect();
            const r2 = el2.getBoundingClientRect();
            return Math.hypot(
                (r1.left + r1.width / 2) - (r2.left + r2.width / 2),
                (r1.top + r1.height / 2) - (r2.top + r2.height / 2)
            );
        }

        function snapToTarget(shape, target) {
            playSound('magic');
            fireConfetti();

            target.dataset.filled = "true";
            target.innerHTML = '';
            target.style.borderColor = 'transparent';
            target.style.backgroundColor = 'transparent';

            shape.classList.add('snapping');
            shape.style.left = target.style.left;
            shape.style.top = target.style.top;
            shape.style.transform = 'translate(-50%, -50%) scale(1)';
            shape.style.zIndex = 20;

            const newShape = shape.cloneNode(true);
            shape.parentNode.replaceChild(newShape, shape);

            filledTargets++;
            const totalTargets = levels[currentLevelIdx].targets.length;

            if (filledTargets >= totalTargets) {
                setTimeout(() => {
                    document.getElementById('next-overlay').classList.remove('hidden');
                    document.getElementById('next-overlay').classList.add('flex');
                    speak('greatJob');
                    setTimeout(() => {
                        currentLevelIdx++;
                        loadLevel(currentLevelIdx);
                    }, 1500);
                }, 800);
            }
        }

        function returnToOrigin(shape) {
            playSound('tick');
            shape.classList.add('returning');
            shape.style.left = `${shape.dataset.orgX}%`;
            shape.style.top = `${shape.dataset.orgY}%`;
            shape.style.transform = 'translate(-50%, -50%) scale(1)';

            setTimeout(() => {
                shape.classList.remove('returning');
                shape.style.zIndex = 10;
            }, 500);
        }

        function showAllClear() {
            document.getElementById('play-canvas').innerHTML = '';
            document.getElementById('all-clear-overlay').classList.remove('hidden');
            document.getElementById('all-clear-overlay').classList.add('flex');
            playSound('magic');
            fireConfetti();
            speak('allClearDesc');
        }

        // --- [5. UI & Event Listeners] ---
        function updateTexts() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (I18N_DATA[currentLang][key]) {
                    el.innerText = I18N_DATA[currentLang][key];
                }
            });
            // Update current level hint if game is active
            if (!document.getElementById('app-content').classList.contains('hidden') && currentLevelIdx < levels.length) {
                const hint = currentLang === 'ko' ? levels[currentLevelIdx].hintKo : levels[currentLevelIdx].hintEn;
                document.getElementById('instruction-text').innerText = hint;
                speak(hint, true);
            }
        }

        document.getElementById('btn-lang').onclick = () => {
            currentLang = currentLang === 'ko' ? 'en' : 'ko';
            updateTexts();
            speak(currentLang === 'ko' ? '한국어' : 'English', true);
        };

        document.getElementById('btn-start').onclick = startGame;

        document.getElementById('btn-restart').onclick = () => {
            stopTTS();
            document.getElementById('modal-restart').classList.remove('hidden');
            speak('restartConfirm');
        };

        document.getElementById('btn-howto').onclick = () => {
            stopTTS();
            document.getElementById('modal-info').classList.remove('hidden');
            speak('guideText');
        };

        const infoModal = document.getElementById('modal-info');
        const exitModal = document.getElementById('modal-exit');
        const restartModal = document.getElementById('modal-restart');

        document.querySelectorAll('.btn-close-modal').forEach(btn => {
            btn.onclick = () => {
                stopTTS();
                infoModal.classList.add('hidden');
            };
        });

        document.getElementById('btn-exit').onclick = () => {
            stopTTS();
            exitModal.classList.remove('hidden');
            speak('exitConfirm');
        };

        document.getElementById('btn-cancel-exit').onclick = () => {
            stopTTS();
            exitModal.classList.add('hidden');
        };

        document.getElementById('btn-confirm-exit').onclick = () => {
            stopTTS();
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.close();
            }
        };

        document.getElementById('btn-cancel-restart').onclick = () => {
            stopTTS();
            restartModal.classList.add('hidden');
        };

        document.getElementById('btn-confirm-restart').onclick = () => {
            stopTTS();
            restartModal.classList.add('hidden');
            resetGame(true);
        };

        // --- Audio & Confetti ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'pop') {
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(500, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'tick') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, now);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
            } else if (type === 'magic') {
                const notes = [523, 659, 783, 1046];
                notes.forEach((f, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.type = 'triangle';
                    o.frequency.value = f;
                    g.gain.setValueAtTime(0, now + i * 0.05);
                    g.gain.linearRampToValueAtTime(0.1, now + i * 0.05 + 0.05);
                    g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.3);
                    o.connect(g); g.connect(audioCtx.destination);
                    o.start(now + i * 0.05); o.stop(now + i * 0.05 + 0.3);
                });
            }
        }

        const effectCanvas = document.getElementById("confetti");
        const effectCtx = effectCanvas.getContext("2d");
        let particles = [];

        function resizeConfetti() {
            effectCanvas.width = window.innerWidth;
            effectCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeConfetti);
        resizeConfetti();

        function fireConfetti() {
            const colors = ['#EF4444', '#F59E0B', '#10B981', '#3B82F6', '#8B5CF6'];
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            for (let i = 0; i < 40; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 10 + 5;
                particles.push({
                    x: cx, y: cy,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    life: 1.0,
                    decay: Math.random() * 0.03 + 0.01
                });
            }
        }

        function updateParticles() {
            effectCtx.clearRect(0, 0, effectCanvas.width, effectCanvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.vy += 0.2; // Gravity
                p.life -= p.decay;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                effectCtx.globalAlpha = p.life;
                effectCtx.fillStyle = p.color;
                effectCtx.fillRect(p.x, p.y, 8, 8);
            }
            effectCtx.globalAlpha = 1.0;
            requestAnimationFrame(updateParticles);
        }
        updateParticles();

        function init() {
            lucide.createIcons();
            resizeConfetti();
            // Pre-load voices if possible
            if ('speechSynthesis' in window) {
                window.speechSynthesis.getVoices();
            }
        }

        window.onload = init;
    </script>
