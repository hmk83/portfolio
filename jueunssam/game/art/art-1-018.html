<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>손으로 뿌리는 페인트 스플래시</title>

    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { corePlugins: { preflight: false } }</script>
    <script src="https://unpkg.com/lucide@latest" onerror="console.warn('Lucide icons failed to load');"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --header-height: 60px;
            --kakao-yellow: #FEE500;
            --ink: #24140f;
            --selected-color: #ff3b6b;
            --shake-power: 0%;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            position: fixed;
            inset: 0;
            font-family: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at 18% 16%, rgba(255, 230, 0, 0.5), transparent 24%),
                radial-gradient(circle at 88% 22%, rgba(59, 130, 246, 0.34), transparent 28%),
                linear-gradient(135deg, #fff7ed 0%, #fff1f2 46%, #e0f2fe 100%);
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .app-header {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 80;
            width: 100%;
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 0 18px;
            color: #3b1e1e;
            background: linear-gradient(135deg, #FEE500 0%, #FBC02D 100%);
            border-bottom: 2px solid rgba(123, 87, 0, 0.22);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.2);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            font-size: clamp(16px, 3vw, 23px);
            font-weight: 900;
            white-space: nowrap;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 36px;
            padding: 7px 14px;
            font-family: inherit;
            font-size: clamp(12px, 2.2vw, 14px);
            font-weight: 900;
            color: #3b1e1e;
            background: rgba(255, 255, 255, 0.54);
            border: 2px solid rgba(255, 255, 255, 0.78);
            border-radius: 999px;
            cursor: pointer;
        }

        #app {
            position: fixed;
            inset: var(--header-height) 0 0 0;
            overflow: hidden;
        }

        #camera-layer,
        #paint-canvas,
        #fx-canvas,
        #hand-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        #camera-layer {
            z-index: 1;
            overflow: hidden;
            background: #fff8ef;
        }

        #input-video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.16;
            transform: scaleX(-1);
            filter: saturate(1.15) contrast(1.04);
        }

        .paper-texture {
            position: absolute;
            inset: clamp(14px, 2.5vw, 34px);
            z-index: 2;
            border: clamp(8px, 1.5vw, 18px) solid rgba(255, 255, 255, 0.82);
            border-radius: clamp(24px, 4vw, 48px);
            background:
                radial-gradient(circle at 20% 18%, rgba(255, 255, 255, 0.74), transparent 28%),
                repeating-linear-gradient(0deg, rgba(15, 23, 42, 0.025) 0 1px, transparent 1px 7px),
                #fffdf7;
            box-shadow: inset 0 0 42px rgba(148, 163, 184, 0.16), 0 28px 80px rgba(15, 23, 42, 0.18);
        }

        #paint-canvas {
            z-index: 5;
        }

        #fx-canvas {
            z-index: 12;
            pointer-events: none;
        }

        #hand-canvas {
            z-index: 18;
            pointer-events: none;
        }

        .top-panel {
            position: absolute;
            top: clamp(14px, 3vh, 26px);
            left: 50%;
            z-index: 30;
            width: min(92vw, 940px);
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
        }

        .title-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 22px;
            color: #111827;
            font-size: clamp(23px, 4.6vw, 50px);
            line-height: 1.05;
            background: rgba(255, 255, 255, 0.8);
            border: 4px solid rgba(255, 255, 255, 0.94);
            border-radius: 999px;
            box-shadow: 0 16px 42px rgba(244, 63, 94, 0.18);
            backdrop-filter: blur(10px);
        }

        .hint-row {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
        }

        .hint-pill {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 8px 14px;
            color: #7f1d1d;
            font-size: clamp(13px, 2vw, 18px);
            background: rgba(255, 255, 255, 0.76);
            border: 2px solid rgba(244, 63, 94, 0.22);
            border-radius: 999px;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.1);
        }

        .palette {
            position: absolute;
            left: clamp(12px, 2vw, 24px);
            top: clamp(76px, 12vh, 110px);
            z-index: 32;
            display: flex;
            flex-direction: column;
            gap: clamp(6px, 1.3vh, 10px);
            max-height: calc(100% - 132px);
            padding: clamp(8px, 1.6vw, 12px);
            overflow-y: auto;
            overscroll-behavior: contain;
            background: rgba(255, 255, 255, 0.72);
            border: 4px solid rgba(255, 255, 255, 0.88);
            border-radius: 999px;
            box-shadow: 0 18px 42px rgba(15, 23, 42, 0.18);
            backdrop-filter: blur(10px);
        }

        .palette::-webkit-scrollbar {
            display: none;
        }

        .color-btn {
            flex: 0 0 auto;
            width: clamp(30px, 6.5vh, 52px);
            height: clamp(30px, 6.5vh, 52px);
            border: clamp(2px, 0.7vh, 4px) solid rgba(255, 255, 255, 0.86);
            border-radius: 50%;
            background: var(--color);
            box-shadow: inset -7px -7px 14px rgba(0, 0, 0, 0.18), 0 9px 18px rgba(15, 23, 42, 0.18);
            cursor: pointer;
            transition: transform 0.14s ease, box-shadow 0.14s ease;
        }

        .color-btn[data-color="#ffffff"] {
            background:
                linear-gradient(135deg, #ffffff 0%, #f8fafc 55%, #e2e8f0 100%);
            border-color: #cbd5e1;
        }

        .color-btn.active {
            transform: scale(1.1);
            box-shadow: inset -7px -7px 14px rgba(0, 0, 0, 0.18), 0 0 0 4px #111827, 0 0 22px var(--color);
        }

        .power-card {
            position: absolute;
            right: clamp(12px, 2vw, 24px);
            top: 50%;
            z-index: 32;
            width: clamp(86px, 11vw, 132px);
            padding: 14px 12px;
            transform: translateY(-50%);
            color: #111827;
            text-align: center;
            background: rgba(255, 255, 255, 0.76);
            border: 4px solid rgba(255, 255, 255, 0.9);
            border-radius: 28px;
            box-shadow: 0 18px 42px rgba(15, 23, 42, 0.18);
            backdrop-filter: blur(10px);
        }

        .power-label {
            font-size: clamp(13px, 2vw, 17px);
            color: #64748b;
        }

        .power-meter {
            position: relative;
            width: 100%;
            height: clamp(130px, 26vh, 260px);
            margin-top: 10px;
            overflow: hidden;
            background: #e2e8f0;
            border: 3px solid #fff;
            border-radius: 999px;
            box-shadow: inset 0 6px 12px rgba(15, 23, 42, 0.14);
        }

        .power-fill {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: var(--shake-power);
            background: linear-gradient(0deg, #38bdf8, #facc15 52%, #fb7185);
            border-radius: 999px;
            transition: height 0.12s ease;
        }

        .toast {
            position: absolute;
            z-index: 44;
            left: 50%;
            bottom: 24px;
            padding: 10px 18px;
            color: #111827;
            font-size: clamp(14px, 2.5vw, 20px);
            background: var(--kakao-yellow);
            border: 3px solid #fff;
            border-radius: 999px;
            box-shadow: 0 14px 24px rgba(15, 23, 42, 0.24);
            transform: translate(-50%, 80px);
            opacity: 0;
            transition: transform 0.22s ease, opacity 0.22s ease;
            pointer-events: none;
            white-space: nowrap;
        }

        .toast.show {
            transform: translate(-50%, 0);
            opacity: 1;
        }

        .intro-overlay {
            position: absolute;
            inset: 0;
            z-index: 70;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 22px;
            background:
                radial-gradient(circle at 50% 24%, rgba(254, 229, 0, 0.32), transparent 32%),
                rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(8px);
        }

        .intro-overlay.hidden {
            display: none;
        }

        .intro-card {
            width: min(92vw, 620px);
            padding: clamp(22px, 4vw, 38px);
            color: #111827;
            text-align: center;
            background: rgba(255, 255, 255, 0.94);
            border: 6px solid var(--kakao-yellow);
            border-radius: 34px;
            box-shadow: 0 28px 80px rgba(15, 23, 42, 0.35);
        }

        .intro-card h2 {
            margin-bottom: 16px;
            font-size: clamp(28px, 6vw, 52px);
            line-height: 1.05;
        }

        .intro-list {
            display: grid;
            gap: 10px;
            margin: 0 auto 22px;
            max-width: 500px;
            text-align: left;
            font-size: clamp(16px, 3vw, 22px);
            line-height: 1.35;
        }

        .intro-list span {
            display: block;
            padding: 10px 14px;
            background: #fff7ed;
            border: 3px solid #fed7aa;
            border-radius: 18px;
        }

        .intro-start {
            min-width: 180px;
            min-height: 56px;
            padding: 12px 28px;
            color: #3b1e1e;
            font-family: inherit;
            font-size: clamp(20px, 4vw, 28px);
            font-weight: 900;
            background: linear-gradient(135deg, #FEE500, #facc15);
            border: 0;
            border-radius: 999px;
            box-shadow: 0 10px 0 #d8a700, 0 18px 30px rgba(250, 204, 21, 0.3);
            cursor: pointer;
        }

        @media (max-width: 760px) {
            .header-btn .label {
                display: none;
            }

            .palette {
                top: auto;
                bottom: 16px;
                left: 50%;
                flex-direction: row;
                max-width: calc(100% - 24px);
                max-height: none;
                transform: translateX(-50%);
                overflow-x: auto;
                overflow-y: hidden;
                border-radius: 999px;
            }

            .power-card {
                top: 14px;
                right: 12px;
                width: 92px;
                transform: none;
            }

            .power-meter {
                height: 86px;
            }

            .hint-row {
                display: none;
            }
        }

        @media (max-height: 620px) {
            .top-panel {
                top: 8px;
            }

            .title-badge {
                padding: 7px 16px;
                font-size: clamp(20px, 4vw, 34px);
            }

            .hint-row {
                display: none;
            }
        }
    </style>
</head>

<body>
    <header class="app-header">
        <div class="header-title">
            <i data-lucide="paintbrush" class="w-6 h-6"></i>
            <span>손으로 뿌리는 페인트 스플래시</span>
        </div>
        <div class="header-actions">
            <button class="header-btn" id="btn-clear" type="button">
                <i data-lucide="eraser" class="w-4 h-4"></i>
                <span class="label">지우기</span>
            </button>
            <button class="header-btn" id="btn-save" type="button">
                <i data-lucide="download" class="w-4 h-4"></i>
                <span class="label">저장</span>
            </button>
            <button class="header-btn" id="btn-exit" type="button">
                <i data-lucide="log-out" class="w-4 h-4"></i>
                <span class="label">나가기</span>
            </button>
        </div>
    </header>

    <main id="app">
        <section id="camera-layer" aria-label="손 인식 페인트 영역">
            <video id="input-video" playsinline muted></video>
            <div class="paper-texture"></div>
        </section>
        <canvas id="paint-canvas"></canvas>
        <canvas id="fx-canvas"></canvas>
        <canvas id="hand-canvas"></canvas>

        <section class="top-panel">
            <h1 class="title-badge"><i data-lucide="sparkles"></i> Paint Splash Studio</h1>
            <div class="hint-row">
                <span class="hint-pill" id="camera-status"><i data-lucide="camera"></i> 카메라 준비 중...</span>
                <span class="hint-pill">손을 크게 흔들수록 물감이 더 많이 뿌려져요</span>
            </div>
        </section>

        <section class="palette" aria-label="색상 선택">
            <button class="color-btn active" type="button" data-color="#ff3b6b" style="--color:#ff3b6b" aria-label="분홍"></button>
            <button class="color-btn" type="button" data-color="#ef4444" style="--color:#ef4444" aria-label="빨강"></button>
            <button class="color-btn" type="button" data-color="#ff9f1c" style="--color:#ff9f1c" aria-label="주황"></button>
            <button class="color-btn" type="button" data-color="#fee440" style="--color:#fee440" aria-label="노랑"></button>
            <button class="color-btn" type="button" data-color="#84cc16" style="--color:#84cc16" aria-label="연두"></button>
            <button class="color-btn" type="button" data-color="#22c55e" style="--color:#22c55e" aria-label="초록"></button>
            <button class="color-btn" type="button" data-color="#38bdf8" style="--color:#38bdf8" aria-label="하늘"></button>
            <button class="color-btn" type="button" data-color="#2563eb" style="--color:#2563eb" aria-label="파랑"></button>
            <button class="color-btn" type="button" data-color="#7c3aed" style="--color:#7c3aed" aria-label="보라"></button>
            <button class="color-btn" type="button" data-color="#111827" style="--color:#111827" aria-label="검정"></button>
            <button class="color-btn" type="button" data-color="#ffffff" style="--color:#ffffff" aria-label="흰색"></button>
        </section>

        <aside class="power-card" aria-label="흔들기 세기">
            <div class="power-label">흔들기</div>
            <div class="power-meter">
                <div class="power-fill"></div>
            </div>
        </aside>

        <section class="intro-overlay" id="intro-overlay" aria-label="학습 안내">
            <div class="intro-card">
                <h2>페인트를 손으로 뿌려요!</h2>
                <div class="intro-list">
                    <span>손을 좌우로 흔들면 물감이 뿌려져요.</span>
                    <span>세게 흔들수록 더 많이, 더 멀리 튀어요.</span>
                    <span>주먹을 쥐었다가 펴면 색상이 순서대로 바뀌어요.</span>
                    <span>물감이 튈 때 손 움직임에 맞춰 음악도 만들어져요.</span>
                </div>
                <button class="intro-start" id="intro-start" type="button">시작하기</button>
            </div>
        </section>

        <div class="toast" id="toast">카메라 권한을 허용하고 손을 흔들어 보세요.</div>
    </main>

    <script>
        const HAND_POINTS = [0, 5, 9, 13, 17];
        const SHAKE_START = 520;
        const SHAKE_FULL = 1800;
        const COLORS = ['#ff3b6b', '#ef4444', '#ff9f1c', '#fee440', '#84cc16', '#22c55e', '#38bdf8', '#2563eb', '#7c3aed', '#111827', '#ffffff'];
        const COLOR_SCALES = [
            [261.63, 329.63, 392.00, 523.25],
            [246.94, 311.13, 392.00, 493.88],
            [293.66, 369.99, 440.00, 587.33],
            [329.63, 415.30, 493.88, 659.25],
            [349.23, 440.00, 554.37, 698.46],
            [349.23, 440.00, 523.25, 698.46],
            [392.00, 493.88, 587.33, 783.99],
            [415.30, 523.25, 622.25, 830.61],
            [440.00, 554.37, 659.25, 880.00],
            [196.00, 246.94, 293.66, 392.00],
            [523.25, 659.25, 783.99, 1046.50]
        ];

        let audioCtx = null;
        let musicGain = null;
        let hands = null;
        let camera = null;
        let selectedColor = COLORS[0];
        let previousHands = new Map();
        let particles = [];
        let hideToastTimer = null;
        let lastNoHandToastAt = 0;
        let lastPower = 0;
        let colorIndex = 0;
        let fistStates = new Map();
        let lastGestureColorChangeAt = 0;
        let lastPaintSoundAt = 0;

        const app = document.getElementById('app');
        const video = document.getElementById('input-video');
        const paintCanvas = document.getElementById('paint-canvas');
        const paintCtx = paintCanvas.getContext('2d', { willReadFrequently: true });
        const fxCanvas = document.getElementById('fx-canvas');
        const fxCtx = fxCanvas.getContext('2d');
        const handCanvas = document.getElementById('hand-canvas');
        const handCtx = handCanvas.getContext('2d');
        const toast = document.getElementById('toast');
        const cameraStatus = document.getElementById('camera-status');

        function resizeCanvases() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            [paintCanvas, fxCanvas, handCanvas].forEach((canvas) => {
                canvas.width = Math.floor(app.clientWidth * dpr);
                canvas.height = Math.floor(app.clientHeight * dpr);
                canvas.style.width = `${app.clientWidth}px`;
                canvas.style.height = `${app.clientHeight}px`;
                const ctx = canvas.getContext('2d');
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            });
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(hideToastTimer);
            hideToastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
        }

        function setCameraStatus(text) {
            cameraStatus.innerHTML = `<i data-lucide="camera"></i> ${text}`;
            if (window.lucide) lucide.createIcons();
        }

        function initMusic() {
            if (audioCtx) {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                return;
            }
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            musicGain = audioCtx.createGain();
            musicGain.gain.value = 0.42;
            musicGain.connect(audioCtx.destination);
        }

        function setPower(power) {
            lastPower = lastPower * 0.72 + power * 0.28;
            document.documentElement.style.setProperty('--shake-power', `${Math.round(lastPower * 100)}%`);
        }

        function randomBetween(min, max) {
            return min + Math.random() * (max - min);
        }

        function splatPaint(x, y, speed, angle) {
            const power = Math.max(0, Math.min(1, (speed - SHAKE_START) / (SHAKE_FULL - SHAKE_START)));
            const amount = Math.floor(6 + power * 72);
            const reach = 18 + power * 112;
            const baseRadius = 3 + power * 12;
            const isWhitePaint = selectedColor.toLowerCase() === '#ffffff';

            paintCtx.save();
            paintCtx.globalCompositeOperation = isWhitePaint ? 'source-over' : 'multiply';
            for (let i = 0; i < amount; i++) {
                const spreadAngle = angle + randomBetween(-1.25, 1.25);
                const distance = Math.pow(Math.random(), 0.62) * reach;
                const px = x + Math.cos(spreadAngle) * distance + randomBetween(-18, 18) * power;
                const py = y + Math.sin(spreadAngle) * distance + randomBetween(-18, 18) * power;
                const radius = randomBetween(1.8, baseRadius) * randomBetween(0.7, 1.6);
                paintCtx.beginPath();
                paintCtx.fillStyle = isWhitePaint ? '#fffdf7' : selectedColor;
                paintCtx.globalAlpha = isWhitePaint ? randomBetween(0.82, 1) : randomBetween(0.44, 0.88);
                paintCtx.arc(px, py, radius, 0, Math.PI * 2);
                paintCtx.fill();

                if (Math.random() < 0.28 + power * 0.34) {
                    drawDrip(px, py, radius, power, isWhitePaint);
                }
            }
            paintCtx.restore();

            spawnFxParticles(x, y, angle, amount, power);
            playPaintMusic(x, y, power, angle);
            setPower(power);
        }

        function playPaintMusic(x, y, power, angle) {
            const nowMs = performance.now();
            const interval = 150 - power * 112;
            if (nowMs - lastPaintSoundAt < interval) return;
            lastPaintSoundAt = nowMs;
            initMusic();

            const now = audioCtx.currentTime;
            const scale = COLOR_SCALES[colorIndex] || COLOR_SCALES[0];
            const heightRatio = 1 - Math.max(0, Math.min(1, y / app.clientHeight));
            const noteIndex = Math.min(scale.length - 1, Math.floor(heightRatio * scale.length));
            const directionBend = Math.sin(angle) * 18;
            const frequency = scale[noteIndex] + directionBend + power * 65;
            const duration = 0.1 + power * 0.22;
            const volume = 0.05 + power * 0.2;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();
            osc.type = power > 0.72 ? 'sawtooth' : 'triangle';
            osc.frequency.setValueAtTime(frequency, now);
            osc.frequency.exponentialRampToValueAtTime(Math.max(80, frequency * (0.92 + power * 0.08)), now + duration);
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(900 + power * 3600, now);
            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.exponentialRampToValueAtTime(volume, now + 0.012);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
            osc.connect(filter);
            filter.connect(gain);
            gain.connect(musicGain);
            osc.start(now);
            osc.stop(now + duration + 0.03);

            if (power > 0.58) playPercussion(now, power);
        }

        function playPercussion(now, power) {
            const bufferSize = Math.floor(audioCtx.sampleRate * 0.08);
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
            }
            const noise = audioCtx.createBufferSource();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();
            noise.buffer = buffer;
            filter.type = 'highpass';
            filter.frequency.setValueAtTime(900 + power * 1600, now);
            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.exponentialRampToValueAtTime(0.04 + power * 0.12, now + 0.008);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.09);
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(musicGain);
            noise.start(now);
            noise.stop(now + 0.1);
        }

        function drawDrip(x, y, radius, power, isWhitePaint = false) {
            const length = randomBetween(10, 52 + power * 70);
            paintCtx.save();
            paintCtx.globalCompositeOperation = 'source-over';
            paintCtx.strokeStyle = isWhitePaint ? '#fffdf7' : selectedColor;
            paintCtx.globalAlpha = isWhitePaint ? randomBetween(0.72, 0.95) : randomBetween(0.22, 0.5);
            paintCtx.lineWidth = Math.max(1, radius * randomBetween(0.28, 0.7));
            paintCtx.lineCap = 'round';
            paintCtx.beginPath();
            paintCtx.moveTo(x, y);
            paintCtx.bezierCurveTo(x + randomBetween(-8, 8), y + length * 0.35, x + randomBetween(-10, 10), y + length * 0.7, x + randomBetween(-6, 6), y + length);
            paintCtx.stroke();
            paintCtx.restore();
        }

        function spawnFxParticles(x, y, angle, amount, power) {
            const count = Math.min(90, Math.floor(amount * 0.72));
            for (let i = 0; i < count; i++) {
                const a = angle + randomBetween(-1.4, 1.4);
                const velocity = randomBetween(2.2, 8.5 + power * 9);
                particles.push({
                    x,
                    y,
                    vx: Math.cos(a) * velocity + randomBetween(-1.5, 1.5),
                    vy: Math.sin(a) * velocity + randomBetween(-1.5, 1.5),
                    r: randomBetween(2, 7 + power * 7),
                    life: randomBetween(24, 46),
                    maxLife: 46,
                    color: selectedColor
                });
            }
            if (particles.length > 900) particles.splice(0, particles.length - 900);
        }

        function animateParticles() {
            fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
            particles = particles.filter((p) => p.life > 0);
            particles.forEach((p) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vx *= 0.93;
                p.vy = p.vy * 0.93 + 0.12;
                p.life -= 1;
                fxCtx.save();
                fxCtx.globalAlpha = Math.max(0, p.life / p.maxLife) * 0.8;
                fxCtx.fillStyle = p.color;
                fxCtx.beginPath();
                fxCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                fxCtx.fill();
                fxCtx.restore();
            });
            setPower(lastPower * 0.94);
            requestAnimationFrame(animateParticles);
        }

        function getHandCenter(landmarks, width, height) {
            const points = HAND_POINTS.map((index) => landmarks[index]).filter(Boolean);
            const sum = points.reduce((acc, point) => {
                acc.x += 1 - point.x;
                acc.y += point.y;
                return acc;
            }, { x: 0, y: 0 });
            return {
                x: (sum.x / points.length) * width,
                y: (sum.y / points.length) * height
            };
        }

        function selectColor(index, announce = false) {
            colorIndex = ((index % COLORS.length) + COLORS.length) % COLORS.length;
            selectedColor = COLORS[colorIndex];
            document.documentElement.style.setProperty('--selected-color', selectedColor);
            document.querySelectorAll('.color-btn').forEach((button, buttonIndex) => {
                button.classList.toggle('active', buttonIndex === colorIndex);
            });
            if (announce) showToast('색상이 바뀌었어요!');
        }

        function isFist(landmarks) {
            const wrist = landmarks[0];
            const middleBase = landmarks[9];
            if (!wrist || !middleBase) return false;
            const palmSize = Math.hypot(middleBase.x - wrist.x, middleBase.y - wrist.y) || 0.1;
            const foldedTips = [
                [8, 6],
                [12, 10],
                [16, 14],
                [20, 18]
            ].filter(([tipIndex, pipIndex]) => {
                const tip = landmarks[tipIndex];
                const pip = landmarks[pipIndex];
                if (!tip || !pip) return false;
                const tipDistance = Math.hypot(tip.x - wrist.x, tip.y - wrist.y);
                const pipDistance = Math.hypot(pip.x - wrist.x, pip.y - wrist.y);
                return tipDistance < pipDistance * 1.04 && tipDistance < palmSize * 1.58;
            }).length;
            const thumbTip = landmarks[4];
            const indexBase = landmarks[5];
            const thumbFolded = thumbTip && indexBase
                ? Math.hypot(thumbTip.x - indexBase.x, thumbTip.y - indexBase.y) < palmSize * 0.9
                : false;
            return foldedTips >= 4 && thumbFolded;
        }

        function isOpenHand(landmarks) {
            const wrist = landmarks[0];
            const middleBase = landmarks[9];
            if (!wrist || !middleBase) return false;
            const palmSize = Math.hypot(middleBase.x - wrist.x, middleBase.y - wrist.y) || 0.1;
            const openTips = [
                [8, 6],
                [12, 10],
                [16, 14],
                [20, 18]
            ].filter(([tipIndex, pipIndex]) => {
                const tip = landmarks[tipIndex];
                const pip = landmarks[pipIndex];
                if (!tip || !pip) return false;
                const tipDistance = Math.hypot(tip.x - wrist.x, tip.y - wrist.y);
                const pipDistance = Math.hypot(pip.x - wrist.x, pip.y - wrist.y);
                return tipDistance > pipDistance * 1.16 && tipDistance > palmSize * 1.55;
            }).length;
            return openTips >= 3;
        }

        function handleFistGesture(handIndex, landmarks, now) {
            const fist = isFist(landmarks);
            const open = isOpenHand(landmarks);
            const previous = fistStates.get(handIndex) || { fistFrames: 0, armed: false };
            const fistFrames = fist ? previous.fistFrames + 1 : 0;
            const armed = previous.armed || fistFrames >= 5;
            if (armed && open && now - lastGestureColorChangeAt > 900) {
                selectColor(colorIndex + 1, true);
                lastGestureColorChangeAt = now;
                fistStates.set(handIndex, { fistFrames: 0, armed: false });
                return;
            }
            fistStates.set(handIndex, { fistFrames, armed, t: now });
        }

        function drawHands(results) {
            handCtx.clearRect(0, 0, handCanvas.width, handCanvas.height);
            const width = app.clientWidth;
            const height = app.clientHeight;
            const now = performance.now();

            if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
                previousHands.clear();
                fistStates.clear();
                if (now - lastNoHandToastAt > 3300) {
                    showToast('손이 보이지 않아요. 카메라 앞에서 손을 흔들어 주세요.');
                    lastNoHandToastAt = now;
                }
                return;
            }

            results.multiHandLandmarks.forEach((landmarks, handIndex) => {
                if (typeof drawConnectors === 'function' && typeof HAND_CONNECTIONS !== 'undefined') {
                    const mirrored = landmarks.map((point) => ({ ...point, x: 1 - point.x }));
                    drawConnectors(handCtx, mirrored, HAND_CONNECTIONS, { color: 'rgba(255, 255, 255, 0.7)', lineWidth: 4 });
                    drawLandmarks(handCtx, mirrored, { color: selectedColor, lineWidth: 1, radius: 4 });
                }

                const center = getHandCenter(landmarks, width, height);
                handleFistGesture(handIndex, landmarks, now);
                const previous = previousHands.get(handIndex);
                if (previous) {
                    const dt = Math.max((now - previous.t) / 1000, 0.016);
                    const dx = center.x - previous.x;
                    const dy = center.y - previous.y;
                    const speed = Math.hypot(dx, dy) / dt;
                    if (speed > SHAKE_START) {
                        splatPaint(center.x, center.y, speed, Math.atan2(dy, dx));
                    } else {
                        setPower(Math.max(0, (speed - 160) / SHAKE_START) * 0.42);
                    }
                }
                previousHands.set(handIndex, { ...center, t: now });
            });
        }

        async function startCamera() {
            setCameraStatus('카메라 준비 중...');
            showToast('카메라 권한을 허용해주세요.');

            if (typeof Hands === 'undefined' || typeof Camera === 'undefined') {
                setCameraStatus('터치 모드');
                showToast('손 인식 스크립트를 불러오지 못했어요. 마우스로도 뿌릴 수 있어요.');
                return;
            }

            try {
                hands = new Hands({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
                });
                hands.setOptions({
                    maxNumHands: 2,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.62,
                    minTrackingConfidence: 0.58
                });
                hands.onResults(drawHands);

                camera = new Camera(video, {
                    onFrame: async () => {
                        await hands.send({ image: video });
                    },
                    width: 1280,
                    height: 720
                });

                await camera.start();
                setCameraStatus('손 인식 중');
                showToast('손을 세게 흔들수록 페인트가 많이 뿌려져요!');
            } catch (error) {
                console.error(error);
                setCameraStatus('터치 모드');
                showToast('카메라를 사용할 수 없어 마우스/터치 모드로 전환했어요.');
            }
        }

        let pointerPainting = false;
        let lastPointer = null;

        function pointerPoint(event) {
            const rect = app.getBoundingClientRect();
            return {
                x: event.clientX - rect.left,
                y: event.clientY - rect.top,
                t: performance.now()
            };
        }

        function handlePointerMove(event) {
            if (!pointerPainting) return;
            const point = pointerPoint(event);
            if (lastPointer) {
                const dt = Math.max((point.t - lastPointer.t) / 1000, 0.016);
                const dx = point.x - lastPointer.x;
                const dy = point.y - lastPointer.y;
                const speed = Math.hypot(dx, dy) / dt;
                splatPaint(point.x, point.y, Math.max(speed, 650), Math.atan2(dy, dx));
            }
            lastPointer = point;
        }

        function clearCanvas() {
            paintCtx.clearRect(0, 0, paintCanvas.width, paintCanvas.height);
            particles = [];
            showToast('도화지를 깨끗하게 지웠어요.');
        }

        function saveArtwork() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const exportCanvas = document.createElement('canvas');
            const exportCtx = exportCanvas.getContext('2d');
            exportCanvas.width = paintCanvas.width;
            exportCanvas.height = paintCanvas.height;

            exportCtx.save();
            exportCtx.fillStyle = '#fffdf7';
            exportCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
            exportCtx.globalAlpha = 0.2;
            exportCtx.strokeStyle = '#e2e8f0';
            exportCtx.lineWidth = Math.max(1, 1 * dpr);
            for (let y = 0; y < exportCanvas.height; y += 7 * dpr) {
                exportCtx.beginPath();
                exportCtx.moveTo(0, y);
                exportCtx.lineTo(exportCanvas.width, y);
                exportCtx.stroke();
            }
            exportCtx.restore();

            exportCtx.drawImage(paintCanvas, 0, 0);
            const link = document.createElement('a');
            link.download = `paint-splash-${Date.now()}.png`;
            link.href = exportCanvas.toDataURL('image/png');
            link.click();
            showToast('이미지를 저장했어요.');
        }

        function exitPage() {
            if (camera && typeof camera.stop === 'function') {
                try { camera.stop(); } catch (e) { }
            }
            if (window.history.length > 1) window.history.back();
            else window.location.href = 'https://jueunssam.com/web-study/';
        }

        document.querySelectorAll('.color-btn').forEach((button) => {
            button.addEventListener('click', () => {
                const nextIndex = COLORS.indexOf(button.dataset.color);
                if (nextIndex >= 0) selectColor(nextIndex);
            });
        });

        app.addEventListener('pointerdown', (event) => {
            pointerPainting = true;
            lastPointer = pointerPoint(event);
        });
        app.addEventListener('pointermove', handlePointerMove);
        ['pointerup', 'pointercancel', 'pointerleave'].forEach((eventName) => {
            app.addEventListener(eventName, () => {
                pointerPainting = false;
                lastPointer = null;
            });
        });

        document.getElementById('btn-clear').addEventListener('click', clearCanvas);
        document.getElementById('btn-save').addEventListener('click', saveArtwork);
        document.getElementById('btn-exit').addEventListener('click', exitPage);
        document.getElementById('intro-start').addEventListener('click', () => {
            document.getElementById('intro-overlay').classList.add('hidden');
            showToast('손을 흔들어 페인트를 뿌려보세요!');
        });
        window.addEventListener('resize', resizeCanvases);

        resizeCanvases();
        animateParticles();
        if (window.lucide) lucide.createIcons();
        startCamera();
    </script>
