<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>별을 색칠하는 구슬</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* [Core Reset & Safe Area] */
        :root {
            --gnb-height: 60px;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Jua', sans-serif;
            background-color: #1a1a2e;
            /* 우주 배경색 */
            touch-action: none;
            /* 모바일 터치 스크롤 방지 */
            user-select: none;
            -webkit-user-select: none;
            height: 100vh;
            width: 100vw;
        }

        /* [GNB Styles] */
        #gnb {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--gnb-height);
            background-color: #FEE500;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* [Game Area Layout] */
        #game-wrapper {
            position: absolute;
            top: var(--gnb-height);
            left: 0;
            width: 100vw;
            height: calc(100vh - var(--gnb-height));
            overflow: hidden;
            position: relative;
        }

        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* UI 레이어 */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 상단 정보 */
        .top-bar {
            padding: 2vmin;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .btn-group {
            display: flex;
            gap: 1.5vmin;
        }

        .info-badge {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 1vmin 2vmin;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border: 3px solid #fce7f3;
            /* pink-100 */
            color: #ec4899;
            /* pink-500 */
            font-size: 2.5vmin;
            display: flex;
            align-items: center;
            gap: 1vmin;
            pointer-events: auto;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }

        .info-badge:active {
            transform: scale(0.95);
        }

        .info-badge.disabled {
            background: rgba(200, 200, 200, 0.8);
            color: #666;
            border-color: #bbb;
        }

        /* 물감 게이지 */
        .ink-meter-container {
            position: relative;
            width: 20vmin;
            height: 2.5vmin;
            background: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid white;
        }

        .ink-fill {
            height: 100%;
            background: linear-gradient(90deg, #f472b6, #db2777);
            width: 100%;
            transition: width 0.2s, background-color 0.2s;
        }

        /* 중앙 경고 메시지 */
        #center-alert {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 20;
        }

        .alert-text {
            display: inline-block;
            background: rgba(0, 0, 0, 0.8);
            color: #ff4444;
            padding: 4vmin 6vmin;
            border-radius: 3vmin;
            font-size: 6vmin;
            font-weight: bold;
            border: 0.8vmin solid #ff4444;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.5);
            text-shadow: 2px 2px 0px #000;
        }

        /* 하단 컨트롤 */
        .bottom-bar {
            padding: 2vmin;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.3));
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5vmin;
            margin-bottom: 0vmin;
        }

        /* 색상 팔레트 */
        .palette {
            display: flex;
            gap: 1.5vmin;
            background: rgba(255, 255, 255, 0.8);
            padding: 1vmin;
            border-radius: 50px;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            margin-bottom: 2vmin;
        }

        .color-btn {
            width: 6vmin;
            height: 6vmin;
            border-radius: 50%;
            border: 3px solid white;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s, opacity 0.2s;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2vmin;
            color: rgba(255, 255, 255, 0.8);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
            font-weight: bold;
        }

        .color-btn:hover {
            transform: scale(1.1);
        }

        .color-btn.active {
            transform: scale(1.2) translateY(-0.5vmin);
            border-color: #3b82f6;
            z-index: 5;
            color: white;
        }

        .color-btn.no-ink {
            opacity: 0.4;
            filter: grayscale(0.8);
            transform: scale(0.9);
            border-color: #555;
            cursor: not-allowed;
        }

        .color-btn.no-ink::after {
            content: 'X';
            position: absolute;
            color: red;
            font-size: 4vmin;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
        }

        /* 작은 알림 메시지 */
        #message-area {
            position: absolute;
            top: 20%;
            width: 100%;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .pop-msg {
            display: inline-block;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 1vmin 3vmin;
            border-radius: 50px;
            font-size: 3vmin;
        }

        .hint-text {
            font-size: 1.8vmin;
            color: white;
            text-shadow: 1px 1px 2px black;
            opacity: 0.8;
        }

        /* --- Touch Controls --- */
        #touch-controls {
            position: absolute;
            bottom: 3vmin;
            left: 0;
            width: 100%;
            height: 35vmin;
            pointer-events: none;
            z-index: 30;
            display: flex;
            justify-content: space-between;
            padding: 0 4vmin;
            transition: opacity 0.3s;
        }

        #touch-controls.hidden-controls {
            opacity: 0;
            pointer-events: none !important;
        }

        /* D-Pad Area */
        .d-pad {
            position: relative;
            width: 28vmin;
            height: 28vmin;
            pointer-events: auto;
        }

        .d-btn {
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 2vmin;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            pointer-events: none;
            transition: background 0.1s, transform 0.1s;
        }

        .d-btn.active {
            background: rgba(255, 255, 255, 0.6);
            transform: scale(0.95);
            border-color: white;
        }

        .d-btn i {
            width: 4vmin;
            height: 4vmin;
        }

        .d-up {
            top: 0;
            left: 35%;
            width: 30%;
            height: 35%;
        }

        .d-down {
            bottom: 0;
            left: 35%;
            width: 30%;
            height: 35%;
        }

        .d-left {
            top: 35%;
            left: 0;
            width: 35%;
            height: 30%;
        }

        .d-right {
            top: 35%;
            right: 0;
            width: 35%;
            height: 30%;
        }

        /* Jump Button Area */
        .action-area {
            position: relative;
            width: 25vmin;
            height: 25vmin;
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-jump {
            width: 18vmin;
            height: 18vmin;
            border-radius: 50%;
            background: rgba(255, 200, 200, 0.4);
            border: 3px solid rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(4px);
            color: white;
            font-size: 3.5vmin;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            cursor: pointer;
        }

        .btn-jump:active,
        .btn-jump.active {
            background: rgba(255, 200, 200, 0.7);
            transform: scale(0.9);
        }

        #loading {
            position: fixed;
            top: 60px;
            /* GNB height */
            left: 0;
            width: 100%;
            height: calc(100% - 60px);
            background: #fdf4ff;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ec4899;
            font-size: 4vmin;
            transition: opacity 0.5s;
        }

        /* [Common Button Animations] */
        .btn-press {
            transition: transform 0.1s;
        }

        .btn-press:active {
            transform: scale(0.95);
        }

        /* [Modal Styles] */
        .modal-enter {
            animation: modalFadeIn 0.3s forwards;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    <!-- [1. GNB] -->
    <nav id="gnb">
        <div class="flex items-center gap-2">
            <h1
                class="text-xl md:text-2xl font-bold text-gray-800 whitespace-nowrap overflow-hidden text-ellipsis max-w-[50vw]">
                🎨 <span>별을 색칠하는 구슬</span>
            </h1>
        </div>
        <div class="flex gap-2">
            <button id="btn-exit"
                class="bg-gray-600 text-white rounded-full px-4 py-1 text-sm font-bold shadow-sm hover:bg-gray-700 btn-press">
                종료
            </button>
        </div>
    </nav>

    <!-- [2. Game Wrapper] -->
    <div id="game-wrapper">
        <div id="loading">
            <div>🎨 별을 만드는 중...</div>
        </div>

        <!-- UI Overlay -->
        <div id="ui-layer">
            <div class="top-bar">
                <!-- Left Group: Paint Meter -->
                <div class="info-badge cursor-default">
                    <span>💧 물감:</span>
                    <div class="ink-meter-container">
                        <div id="ink-bar" class="ink-fill"></div>
                    </div>
                </div>

                <!-- Right Group: Buttons -->
                <div class="btn-group">
                    <!-- Toggle Controls Button -->
                    <div id="btn-controls" class="info-badge" onclick="toggleControls()">
                        <i id="icon-controls" data-lucide="gamepad-2" style="width: 2.5vmin; height: 2.5vmin;"></i>
                        <span id="text-controls" class="hidden md:inline ml-1">컨트롤 켜짐</span>
                    </div>

                    <div class="info-badge" onclick="resetCamera()">
                        <i data-lucide="camera" style="width: 2.5vmin; height: 2.5vmin;"></i>
                        <span class="hidden md:inline ml-1">시점 복귀</span>
                    </div>
                    <div class="info-badge" onclick="resetGame()" style="border-color: #fca5a5; color: #ef4444;">
                        <i data-lucide="rotate-ccw" style="width: 2.5vmin; height: 2.5vmin;"></i>
                        <span class="hidden md:inline ml-1">다시 시작</span>
                    </div>
                </div>
            </div>

            <div id="center-alert">
                <div class="alert-text">물감이 다 떨어졌어요! 😭<br><span style="font-size: 0.5em; color: white;">물방울 아이템을
                        찾아보세요!</span>
                </div>
            </div>

            <div id="message-area">
                <div id="msg-text" class="pop-msg">메시지</div>
            </div>

            <div class="bottom-bar">
                <div class="hint-text hidden md:block">
                    숫자키 1-9: 색상변경 | 방향키: 이동 | 스페이스바: 점프
                </div>
                <div class="palette" id="palette-container">
                    <!-- Colors injected here -->
                </div>
            </div>
        </div>

        <!-- Touch Controls Layer -->
        <div id="touch-controls">
            <div class="d-pad">
                <div class="d-btn d-up"><i data-lucide="chevron-up"></i></div>
                <div class="d-btn d-left"><i data-lucide="chevron-left"></i></div>
                <div class="d-btn d-right"><i data-lucide="chevron-right"></i></div>
                <div class="d-btn d-down"><i data-lucide="chevron-down"></i></div>
            </div>
            <div class="action-area">
                <div class="btn-jump" data-key=" ">JUMP</div>
            </div>
        </div>

        <div id="game-container"></div>
    </div>

    <!-- [3. Exit Confirm Modal] -->
    <div id="modal-exit" class="hidden fixed inset-0 bg-black/50 z-[20000] flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 w-[80%] max-w-lg shadow-2xl relative modal-enter text-center">
            <h3 class="text-3xl font-bold text-gray-800 mb-4">정말 종료할까요?</h3>
            <p class="text-xl text-gray-500 mb-8">진행 상황이 저장되지 않아요.</p>
            <div class="flex justify-center gap-4">
                <button id="btn-cancel-exit"
                    class="bg-gray-200 text-gray-700 text-xl px-6 py-3 rounded-full hover:bg-gray-300">아니요</button>
                <button id="btn-confirm-exit"
                    class="bg-red-500 text-white text-xl px-6 py-3 rounded-full hover:bg-red-600">네, 종료해요</button>
            </div>
        </div>
    </div>

    <script>
        // --- Game Configuration ---
        const config = {
            worldRadius: 35,
            playerRadius: 3.5, // 2D Sprite size
            gravity: 0.8,
            moveSpeed: 0.4,
            jumpForce: 1.2,
            maxJumpTime: 15,
            // Colors with Korean names
            paletteData: [
                { hex: '#FF3B30', name: '빨강' },
                { hex: '#FF9500', name: '주황' },
                { hex: '#FFCC00', name: '노랑' },
                { hex: '#4CD964', name: '초록' },
                { hex: '#5AC8FA', name: '하늘' },
                { hex: '#007AFF', name: '파랑' },
                { hex: '#5856D6', name: '남색' },
                { hex: '#FF2D55', name: '분홍' },
                { hex: '#000000', name: '검정' }
            ],
            inkDepletionRate: 0.25,
            maxInk: 100
        };

        let state = {
            inkLevels: {}, // { '#HEX': 100, ... }
            currentColorObj: config.paletteData[0],
            isJumping: false,
            jumpFrame: 0,
            onGround: false,
            cameraMode: 'follow',
            items: [],
            playerHeight: 0,
            controlsVisible: true,
            rollAngle: 0, // Rolling effect rotation accumulator
            isCrying: false // Current mood state
        };

        // --- Three.js Globals ---
        let scene, camera, renderer;
        let world, player;
        let paintingCanvas, paintingCtx, texture;
        let heightRaycaster = new THREE.Raycaster();

        // Rain System
        let rainSystem = {
            active: false,
            cloudGroup: null,
            particles: null,
            timer: 0,
            nextSpawnTime: 0,
            targetPos: new THREE.Vector3(),
            raycaster: new THREE.Raycaster()
        };

        // Input
        const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, " ": false };
        let isMouseDown = false;
        let mouseX = 0, mouseY = 0;
        let camLat = 0, camLon = 0;

        // --- Initialization ---
        function init() {
            lucide.createIcons();
            setupTouchControls();
            setupExitModal();

            // Initialize Ink Levels
            config.paletteData.forEach(c => state.inkLevels[c.hex] = 100);

            const container = document.getElementById('game-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color('#1a1a2e');
            scene.fog = new THREE.FogExp2('#1a1a2e', 0.008);

            const wrapper = document.getElementById('game-wrapper');
            const width = wrapper.clientWidth;
            const height = wrapper.clientHeight;

            camera = new THREE.PerspectiveCamera(50, width / height, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(width, height);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(50, 100, 50);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            createWorld();
            createPlayer();
            createRainSystem(); // Init rain system

            for (let i = 0; i < 20; i++) spawnItem();

            createStars();

            window.addEventListener('resize', onWindowResize);

            // Keyboard Listener for Movement & Numbers
            document.addEventListener('keydown', (e) => {
                if (keys.hasOwnProperty(e.key)) keys[e.key] = true;

                // Color shortcut 1-9
                if (e.key >= '1' && e.key <= '9') {
                    const idx = parseInt(e.key) - 1;
                    if (idx < config.paletteData.length) {
                        selectColorByIndex(idx);
                    }
                }
            });
            document.addEventListener('keyup', (e) => { if (keys.hasOwnProperty(e.key)) keys[e.key] = false; });

            // Mouse/Touch events for camera orbit
            document.addEventListener('mousedown', onPointerDown);
            document.addEventListener('mousemove', onPointerMove);
            document.addEventListener('mouseup', onPointerUp);
            container.addEventListener('touchstart', onPointerDown, { passive: false });
            container.addEventListener('touchmove', onPointerMove, { passive: false });
            container.addEventListener('touchend', onPointerUp);

            initUI();

            document.getElementById('loading').style.opacity = 0;
            setTimeout(() => document.getElementById('loading').remove(), 500);

            // First rain spawn time
            rainSystem.nextSpawnTime = Date.now() + 10000 + Math.random() * 10000;

            animate();
        }

        function setupExitModal() {
            const exitModal = document.getElementById('modal-exit');
            const btnExit = document.getElementById('btn-exit');
            const btnCancel = document.getElementById('btn-cancel-exit');
            const btnConfirm = document.getElementById('btn-confirm-exit');

            btnExit.onclick = () => {
                exitModal.classList.remove('hidden');
                playSound('pop');
            };

            btnCancel.onclick = () => {
                exitModal.classList.add('hidden');
                playSound('pop');
            };

            btnConfirm.onclick = () => {
                if (window.history.length > 1) {
                    window.history.back();
                } else {
                    window.close();
                }
            };
        }

        function createWorld() {
            paintingCanvas = document.createElement('canvas');
            paintingCanvas.width = 1024;
            paintingCanvas.height = 512;
            paintingCtx = paintingCanvas.getContext('2d');
            paintingCtx.fillStyle = '#ffffff';
            paintingCtx.fillRect(0, 0, 1024, 512);

            texture = new THREE.CanvasTexture(paintingCanvas);
            const mat = new THREE.MeshStandardMaterial({
                map: texture,
                roughness: 0.9,
                metalness: 0.1,
                flatShading: true
            });

            const geo = new THREE.IcosahedronGeometry(config.worldRadius, 4);
            const pos = geo.attributes.position;
            const vector = new THREE.Vector3();
            for (let i = 0; i < pos.count; i++) {
                vector.fromBufferAttribute(pos, i);
                const noise = Math.sin(vector.x * 0.2) * Math.cos(vector.y * 0.2) * Math.sin(vector.z * 0.2);
                const scale = 1 + (noise * 0.08);
                vector.multiplyScalar(scale);
                pos.setXYZ(i, vector.x, vector.y, vector.z);
            }
            geo.computeVertexNormals();

            world = new THREE.Mesh(geo, mat);
            world.receiveShadow = true;
            world.castShadow = true;
            scene.add(world);
        }

        function createPlayer() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;

            const spriteMap = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: spriteMap });

            player = new THREE.Sprite(spriteMat);
            player.scale.set(config.playerRadius * 2, config.playerRadius * 2, 1);
            player.position.set(0, config.worldRadius + 2, 0);

            player.userData = {
                // Modified drawFace to support 'crying' expression
                drawFace: function (color, saturation = 1.0, isCrying = false) {
                    const ctx = canvas.getContext('2d');
                    ctx.clearRect(0, 0, 256, 256);

                    // Body Shadow
                    ctx.beginPath();
                    ctx.arc(128, 138, 100, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(0,0,0,0.2)';
                    ctx.fill();

                    // Body
                    ctx.beginPath();
                    ctx.arc(128, 128, 100, 0, Math.PI * 2);

                    if (saturation <= 0.05) {
                        ctx.fillStyle = '#cccccc';
                    } else {
                        ctx.fillStyle = color;
                    }
                    ctx.fill();

                    // Desaturation Overlay
                    if (saturation < 0.9 && saturation > 0.05) {
                        ctx.beginPath();
                        ctx.arc(128, 128, 100, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(200, 200, 200, ${1 - saturation})`;
                        ctx.fill();
                    }

                    // Highlight
                    ctx.beginPath();
                    ctx.arc(160, 90, 25, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255,255,255,0.4)';
                    ctx.fill();

                    if (isCrying) {
                        // Crying Eyes (T_T style or streaming)
                        ctx.strokeStyle = '#111';
                        ctx.lineWidth = 6;

                        // Left Eye (> < style for crying pain, or just T T)
                        // Let's do simple inverted arcs for sad eyes
                        ctx.beginPath();
                        ctx.arc(90, 130, 15, Math.PI, 0); // Frown eye
                        ctx.stroke();

                        ctx.beginPath();
                        ctx.arc(166, 130, 15, Math.PI, 0); // Frown eye
                        ctx.stroke();

                        // Tears
                        ctx.fillStyle = '#60a5fa'; // Light blue
                        ctx.beginPath(); ctx.arc(80, 150, 8, 0, Math.PI * 2); ctx.fill();
                        ctx.beginPath(); ctx.arc(176, 150, 8, 0, Math.PI * 2); ctx.fill();
                        ctx.beginPath(); ctx.arc(85, 170, 6, 0, Math.PI * 2); ctx.fill();
                        ctx.beginPath(); ctx.arc(170, 170, 6, 0, Math.PI * 2); ctx.fill();

                        // Sad Mouth
                        ctx.beginPath();
                        ctx.arc(128, 180, 15, Math.PI, 0); // Frown mouth
                        ctx.stroke();

                    } else {
                        // Normal Eyes
                        ctx.fillStyle = '#111';
                        ctx.beginPath(); ctx.arc(90, 120, 12, 0, Math.PI * 2); ctx.fill();
                        ctx.beginPath(); ctx.arc(166, 120, 12, 0, Math.PI * 2); ctx.fill();

                        // Blush
                        if (saturation > 0.2) {
                            ctx.fillStyle = 'rgba(255, 100, 100, 0.4)';
                            ctx.beginPath(); ctx.arc(80, 140, 15, 0, Math.PI * 2); ctx.fill();
                            ctx.beginPath(); ctx.arc(176, 140, 15, 0, Math.PI * 2); ctx.fill();
                        }

                        // Smile Mouth
                        ctx.strokeStyle = '#111';
                        ctx.lineWidth = 6;
                        ctx.beginPath();
                        ctx.arc(128, 135, 20, 0.1, Math.PI - 0.1);
                        ctx.stroke();
                    }

                    spriteMap.needsUpdate = true;
                },
                canvas: canvas,
                texture: spriteMap,
                verticalVelocity: 0
            };

            // Initial draw
            player.userData.drawFace(config.paletteData[0].hex, 1.0, false);
            scene.add(player);
        }

        function createRainSystem() {
            // 1. Cloud Group
            const group = new THREE.Group();
            // 먹구름 색상으로 변경 (어두운 회색)
            const cloudMat = new THREE.MeshLambertMaterial({ color: 0x333333, transparent: true, opacity: 0.95 });
            const sphereGeo = new THREE.SphereGeometry(3, 8, 8);

            // Create a puffy cloud using multiple spheres
            const p1 = new THREE.Mesh(sphereGeo, cloudMat);
            const p2 = new THREE.Mesh(sphereGeo, cloudMat);
            const p3 = new THREE.Mesh(sphereGeo, cloudMat);
            const p4 = new THREE.Mesh(sphereGeo, cloudMat);

            p1.position.set(0, 0, 0);
            p2.position.set(2, 1, 0);
            p3.position.set(-2, 1, 1);
            p4.position.set(0, 2, -1);

            group.add(p1, p2, p3, p4);
            group.position.set(0, config.worldRadius + 200, 0); // Hide initially
            scene.add(group);

            // 2. Rain Particles
            const rainGeo = new THREE.BufferGeometry();
            const rainCount = 300; // 비 입자 수 증가 (더 잘 보이게)
            const rainPos = new Float32Array(rainCount * 3);

            for (let i = 0; i < rainCount; i++) {
                rainPos[i * 3] = 0;
                rainPos[i * 3 + 1] = 0;
                rainPos[i * 3 + 2] = 0;
            }
            rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));

            const rainMat = new THREE.PointsMaterial({
                color: 0x88ccff, // 비 색상
                size: 0.6,
                transparent: true,
                opacity: 0.8
            });

            const particles = new THREE.Points(rainGeo, rainMat);
            scene.add(particles);
            particles.visible = false;

            rainSystem.cloudGroup = group;
            rainSystem.particles = particles;
            rainSystem.rainPositions = rainPos;
            rainSystem.rainCount = rainCount;
        }

        function updateRainSystem() {
            const now = Date.now();

            // Spawn Logic
            if (!rainSystem.active && now > rainSystem.nextSpawnTime) {
                spawnRainCloud();
            }

            if (rainSystem.active) {
                // Check if time is up
                if (now > rainSystem.endTime) {
                    endRainCloud();
                    return;
                }

                // Move Cloud towards target
                const cloud = rainSystem.cloudGroup;
                const dist = cloud.position.distanceTo(rainSystem.targetPos);

                // If cloud is far, move it closer
                if (dist > 1.0) {
                    const dir = rainSystem.targetPos.clone().sub(cloud.position).normalize();
                    cloud.position.add(dir.multiplyScalar(0.2));
                    cloud.lookAt(0, 0, 0);
                } else {
                    // Cloud arrived, raining effect
                    rainSystem.particles.visible = true;

                    // Rain animation
                    const positions = rainSystem.particles.geometry.attributes.position.array;
                    const center = new THREE.Vector3(0, 0, 0);

                    // Raycast for erasing paint
                    rainSystem.raycaster.set(cloud.position, center.clone().sub(cloud.position).normalize());
                    const intersects = rainSystem.raycaster.intersectObject(world);

                    if (intersects.length > 0) {
                        // Erase paint! (Paint with white)
                        paintAtIntersection(intersects[0], '#ffffff', 25); // Larger radius for rain
                    }

                    // Update particles
                    for (let i = 0; i < rainSystem.rainCount; i++) {
                        // Current particle pos
                        const ix = i * 3;
                        const pPos = new THREE.Vector3(positions[ix], positions[ix + 1], positions[ix + 2]);

                        // If particle is at (0,0,0) or below ground, reset to cloud
                        const distToCenter = pPos.length();

                        if (distToCenter < config.worldRadius || distToCenter > config.worldRadius + 20) {
                            // Reset to cloud area random
                            const offset = new THREE.Vector3(
                                (Math.random() - 0.5) * 8, // 범위 넓힘
                                (Math.random() - 0.5) * 5,
                                (Math.random() - 0.5) * 8
                            );
                            const start = cloud.position.clone().add(offset);
                            positions[ix] = start.x;
                            positions[ix + 1] = start.y;
                            positions[ix + 2] = start.z;
                        } else {
                            // Fall down faster
                            const fallDir = center.clone().sub(pPos).normalize();
                            pPos.add(fallDir.multiplyScalar(1.5)); // Rain speed increased
                            positions[ix] = pPos.x;
                            positions[ix + 1] = pPos.y;
                            positions[ix + 2] = pPos.z;
                        }
                    }
                    rainSystem.particles.geometry.attributes.position.needsUpdate = true;
                }
            }
        }

        function spawnRainCloud() {
            rainSystem.active = true;
            // Pick random position
            const phi = Math.random() * Math.PI * 2;
            const theta = Math.acos(2 * Math.random() - 1);
            const r = config.worldRadius + 15; // Height of cloud

            const x = r * Math.sin(theta) * Math.cos(phi);
            const y = r * Math.sin(theta) * Math.sin(phi);
            const z = r * Math.cos(theta);

            rainSystem.targetPos.set(x, y, z);

            // Start cloud far away but in same direction to slide in? Or just teleport?
            // Let's teleport to a high point and move down/around
            rainSystem.cloudGroup.position.copy(rainSystem.targetPos.clone().multiplyScalar(1.5));
            rainSystem.cloudGroup.lookAt(0, 0, 0);

            rainSystem.endTime = Date.now() + 8000; // Rain for 8 seconds
            showMessage("🌩️ 먹구름이 몰려와요! 비가 내려요!");
        }

        function endRainCloud() {
            rainSystem.active = false;
            rainSystem.cloudGroup.position.set(0, config.worldRadius + 200, 0); // Hide
            rainSystem.particles.visible = false;
            rainSystem.nextSpawnTime = Date.now() + 15000 + Math.random() * 20000; // Next rain in 15-35s
        }

        function setupTouchControls() {
            // Jump Button
            const jumpBtn = document.querySelector('.btn-jump');
            const jumpKey = jumpBtn.dataset.key;
            const pressJump = (e) => { e.preventDefault(); keys[jumpKey] = true; jumpBtn.classList.add('active'); };
            const releaseJump = (e) => { e.preventDefault(); keys[jumpKey] = false; jumpBtn.classList.remove('active'); };

            jumpBtn.addEventListener('mousedown', pressJump);
            jumpBtn.addEventListener('touchstart', pressJump, { passive: false });
            jumpBtn.addEventListener('mouseup', releaseJump);
            jumpBtn.addEventListener('touchend', releaseJump);
            jumpBtn.addEventListener('mouseleave', releaseJump);

            // D-Pad (Diagonal Support)
            const dPad = document.querySelector('.d-pad');
            const upBtn = document.querySelector('.d-up');
            const downBtn = document.querySelector('.d-down');
            const leftBtn = document.querySelector('.d-left');
            const rightBtn = document.querySelector('.d-right');

            const handleDPad = (e) => {
                e.preventDefault();
                const rect = dPad.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                // Handle both mouse and touch
                let clientX, clientY;
                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }

                const dx = clientX - centerX;
                const dy = clientY - centerY;

                // Reset keys first
                keys.ArrowUp = false;
                keys.ArrowDown = false;
                keys.ArrowLeft = false;
                keys.ArrowRight = false;

                // Visual reset
                upBtn.classList.remove('active');
                downBtn.classList.remove('active');
                leftBtn.classList.remove('active');
                rightBtn.classList.remove('active');

                // Simple threshold for center deadzone (10% of width)
                const deadzone = rect.width * 0.1;

                if (Math.abs(dy) > deadzone) {
                    if (dy < 0) { keys.ArrowUp = true; upBtn.classList.add('active'); }
                    else { keys.ArrowDown = true; downBtn.classList.add('active'); }
                }

                if (Math.abs(dx) > deadzone) {
                    if (dx < 0) { keys.ArrowLeft = true; leftBtn.classList.add('active'); }
                    else { keys.ArrowRight = true; rightBtn.classList.add('active'); }
                }
            };

            const resetDPad = (e) => {
                if (e) e.preventDefault();
                keys.ArrowUp = false;
                keys.ArrowDown = false;
                keys.ArrowLeft = false;
                keys.ArrowRight = false;
                upBtn.classList.remove('active');
                downBtn.classList.remove('active');
                leftBtn.classList.remove('active');
                rightBtn.classList.remove('active');
            };

            dPad.addEventListener('touchstart', handleDPad, { passive: false });
            dPad.addEventListener('touchmove', handleDPad, { passive: false });
            dPad.addEventListener('touchend', resetDPad);
            dPad.addEventListener('touchcancel', resetDPad);

            // Mouse support for testing on desktop
            dPad.addEventListener('mousedown', (e) => { isMouseDown = true; handleDPad(e); });
            dPad.addEventListener('mousemove', (e) => {
                // Only if this specific element initiated the press? 
                // Simplest is just binding to dpad
                if (e.buttons === 1) handleDPad(e);
            });
            dPad.addEventListener('mouseup', resetDPad);
            dPad.addEventListener('mouseleave', resetDPad);
        }

        // --- Core Loop ---
        function animate() {

        function updatePlayer() {
            const currentPos = player.position.clone();
            const center = new THREE.Vector3(0, 0, 0);

            // 1. Basis Vectors
            const up = currentPos.clone().normalize();
            let camDir = new THREE.Vector3();
            camera.getWorldDirection(camDir);
            const forward = camDir.clone().sub(up.clone().multiplyScalar(camDir.dot(up))).normalize();
            const side = new THREE.Vector3().crossVectors(forward, up).normalize();

            // 2. Input
            let moveDir = new THREE.Vector3();
            let isMoving = false;

            // Combine inputs
            const moveUp = keys.ArrowUp;
            const moveDown = keys.ArrowDown;
            const moveLeft = keys.ArrowLeft;
            const moveRight = keys.ArrowRight;

            if (state.cameraMode === 'follow') {
                if (moveUp) { moveDir.add(forward); isMoving = true; }
                if (moveDown) { moveDir.sub(forward); isMoving = true; }
                if (moveLeft) { moveDir.sub(side); isMoving = true; }
                if (moveRight) { moveDir.add(side); isMoving = true; }
            } else {
                if (moveUp || moveDown || moveLeft || moveRight) {
                    state.cameraMode = 'follow';
                }
            }

            if (moveDir.lengthSq() > 0) moveDir.normalize();

            // 3. Movement
            const speed = config.moveSpeed;
            const nextPosDir = currentPos.clone().add(moveDir.multiplyScalar(speed)).normalize();

            // --- Rolling Effect Calculation ---
            if (isMoving && state.onGround) {
                // Approximate rolling: Angle = distance / radius
                // distance moved is approx 'speed'
                const rollInc = speed / (config.playerRadius * 0.4); // 0.4 factor to make it spin faster visually
                state.rollAngle += rollInc;
            }

            // 4. Ground Check
            const rayOrigin = nextPosDir.clone().multiplyScalar(config.worldRadius + 20);
            const rayDir = center.clone().sub(rayOrigin).normalize();

            heightRaycaster.set(rayOrigin, rayDir);
            const intersects = heightRaycaster.intersectObject(world);

            let groundHeight = config.worldRadius;
            if (intersects.length > 0) {
                groundHeight = intersects[0].point.distanceTo(center);
            }

            // 5. Jump
            if (keys[" "] && state.onGround) {
                state.isJumping = true;
                state.jumpFrame++;
                player.userData.verticalVelocity = config.jumpForce;
                state.onGround = false;
                playSound('jump');
            } else if (keys[" "] && state.isJumping && state.jumpFrame < config.maxJumpTime) {
                state.jumpFrame++;
                player.userData.verticalVelocity += 0.05;
            } else {
                state.isJumping = false;
                state.jumpFrame = 0;
            }

            player.userData.verticalVelocity -= (config.gravity * 0.1);

            let currentHeightFromCenter = currentPos.length();
            let nextDist = currentHeightFromCenter + player.userData.verticalVelocity;
            const floorLevel = groundHeight + (config.playerRadius * 0.8);

            if (nextDist <= floorLevel) {
                nextDist = floorLevel;
                player.userData.verticalVelocity = 0;
                state.onGround = true;

                const curHex = state.currentColorObj.hex;
                const currentInk = state.inkLevels[curHex];

                // Painting Logic
                if (isMoving && currentInk > 0) {
                    paintAtIntersection(intersects[0], curHex, 15);

                    // Reduce ink
                    state.inkLevels[curHex] = Math.max(0, currentInk - config.inkDepletionRate);
                    const ratio = state.inkLevels[curHex] / 100;

                    // Face update checks (if needed to optimize, could debounce)
                    player.userData.drawFace(curHex, ratio, false);
                    if (state.isCrying) {
                        state.isCrying = false; // Recovered from 0? (Actually this path only runs if ink > 0)
                    }

                } else if (isMoving && currentInk <= 0) {
                    // Out of ink
                    document.getElementById('center-alert').style.opacity = 1;
                    if (!state.isCrying) {
                        state.isCrying = true;
                        player.userData.drawFace(curHex, 0, true); // Trigger crying face
                    }
                } else {
                    document.getElementById('center-alert').style.opacity = 0;
                }
            } else {
                state.onGround = false;
            }

            const finalPos = nextPosDir.multiplyScalar(nextDist);
            player.position.copy(finalPos);

            // --- Sprite Rotation Logic ---
            const camUp = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
            const camRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
            const playerUp = finalPos.clone().normalize();

            const dotY = playerUp.dot(camUp);
            const dotX = playerUp.dot(camRight);
            const angle = Math.atan2(dotX, dotY);

            // Apply camera alignment angle MINUS rolling angle
            // This makes the sprite face the camera but spin around its center
            player.material.rotation = -angle - state.rollAngle;
        }

        // Updated helper to accept color and radius
        function paintAtIntersection(intersection, colorHex, radius) {
            if (!intersection || !intersection.uv) return;

            const uv = intersection.uv;
            const cx = uv.x * paintingCanvas.width;
            const cy = (1 - uv.y) * paintingCanvas.height;
            // radius is passed or default

            paintingCtx.beginPath();
            paintingCtx.arc(cx, cy, radius, 0, Math.PI * 2);
            paintingCtx.fillStyle = colorHex;
            paintingCtx.fill();

            // Wrap-around painting
            if (cx < radius) {
                paintingCtx.beginPath(); paintingCtx.arc(cx + paintingCanvas.width, cy, radius, 0, Math.PI * 2); paintingCtx.fill();
            }
            if (cx > paintingCanvas.width - radius) {
                paintingCtx.beginPath(); paintingCtx.arc(cx - paintingCanvas.width, cy, radius, 0, Math.PI * 2); paintingCtx.fill();
            }

            texture.needsUpdate = true;
        }

        function updateCamera() {
            const playerPos = player.position;
            const up = playerPos.clone().normalize();

            if (state.cameraMode === 'follow') {
                const idealDist = 22;
                const idealHeight = 14;

                const camPos = camera.position.clone();
                const toCam = camPos.clone().sub(playerPos);
                const toCamTangent = toCam.clone().sub(up.clone().multiplyScalar(toCam.dot(up))).normalize();

                if (toCamTangent.lengthSq() < 0.1) toCamTangent.set(1, 0, 0);

                const targetCamPos = playerPos.clone()
                    .add(toCamTangent.multiplyScalar(idealDist))
                    .add(up.clone().multiplyScalar(idealHeight));

                camera.position.lerp(targetCamPos, 0.1);
                camera.lookAt(playerPos);
            } else if (state.cameraMode === 'orbit') {
                const radius = 80;
                const phi = THREE.Math.degToRad(90 - camLat);
                const theta = THREE.Math.degToRad(camLon);
                const x = radius * Math.sin(phi) * Math.cos(theta);
                const y = radius * Math.cos(phi);
                const z = radius * Math.sin(phi) * Math.sin(theta);
                camera.position.lerp(new THREE.Vector3(x, y, z), 0.1);
                camera.lookAt(0, 0, 0);
            }
        }

        function updateItems() {
            state.items.forEach(item => {
                if (!item.userData.active) return;
                const time = Date.now() * 0.002 + item.userData.offset;
                const floatH = Math.sin(time) * 0.5;
                const dir = item.position.clone().normalize();
                const baseH = config.worldRadius + 4;
                item.position.copy(dir.multiplyScalar(baseH + floatH));
                item.rotation.z += 0.02;

                if (player.position.distanceTo(item.position) < config.playerRadius + 2.0) {
                    collectItem(item);
                }
            });
        }

        function collectItem(item) {
            item.userData.active = false;
            item.visible = false;
            const hex = item.userData.colorHex;
            const name = item.userData.colorName;
            if (state.inkLevels[hex] !== undefined) {
                state.inkLevels[hex] = Math.min(100, state.inkLevels[hex] + 40);
            }
            if (state.currentColorObj.hex === hex) {
                // If we collected ink for current color, update face (stop crying if we were)
                state.isCrying = false;
                player.userData.drawFace(hex, state.inkLevels[hex] / 100, false);
            }
            showMessage(`${name} 물감 획득!`);
            playSound('pop');
            setTimeout(() => {
                const phi = Math.random() * Math.PI * 2;
                const theta = Math.acos(2 * Math.random() - 1);
                const r = config.worldRadius + 5;
                const x = r * Math.sin(theta) * Math.cos(phi);
                const y = r * Math.sin(theta) * Math.sin(phi);
                const z = r * Math.cos(theta);
                item.position.set(x, y, z);
                item.lookAt(0, 0, 0);
                item.rotateX(Math.PI);
                item.userData.active = true;
                item.visible = true;
            }, 5000);
        }

        function updateInkUI() {
            const bar = document.getElementById('ink-bar');
            const hex = state.currentColorObj.hex;
            const currentLevel = state.inkLevels[hex] || 0;
            bar.style.width = `${currentLevel}%`;
            if (currentLevel < 20) bar.style.backgroundColor = '#ef4444';
            else bar.style.backgroundColor = hex;

            // Update all buttons for empty state
            const btns = document.querySelectorAll('.color-btn');
            btns.forEach(btn => {
                const btnHex = btn.dataset.hex;
                if (btnHex && state.inkLevels[btnHex] <= 0) {
                    btn.classList.add('no-ink');
                } else {
                    btn.classList.remove('no-ink');
                }
            });
        }

        function onPointerDown(e) {
            if (e.target.closest('.color-btn') ||
                e.target.closest('.info-badge') ||
                e.target.closest('.d-btn') || // This should be covered by .d-pad now but d-btn is pointer-events:none
                e.target.closest('.d-pad') || // ADDED: Ignore orbit drag when on D-Pad
                e.target.closest('.btn-jump')) return;
            isMouseDown = true;
            mouseX = e.clientX || e.touches[0].clientX;
            mouseY = e.clientY || e.touches[0].clientY;
        }

        function onPointerMove(e) {
            if (!isMouseDown) return;
            const x = e.clientX || e.touches[0].clientX;
            const y = e.clientY || e.touches[0].clientY;
            const dx = x - mouseX;
            const dy = y - mouseY;
            if (state.cameraMode !== 'orbit' && (Math.abs(dx) > 2 || Math.abs(dy) > 2)) {
                state.cameraMode = 'orbit';
            }
            if (state.cameraMode === 'orbit') {
                camLon -= dx * 0.5;
                camLat += dy * 0.5;
                camLat = Math.max(-85, Math.min(85, camLat));
            }
            mouseX = x;
            mouseY = y;
        }

        function onPointerUp() { isMouseDown = false; }
        function onWindowResize() {
            const wrapper = document.getElementById('game-wrapper');
            const width = wrapper.clientWidth;
            const height = wrapper.clientHeight;

            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const t = audioCtx.currentTime;
            if (type === 'jump') {
                osc.frequency.setValueAtTime(300, t);
                osc.frequency.linearRampToValueAtTime(600, t + 0.1);
                gain.gain.setValueAtTime(0.1, t);
                gain.gain.linearRampToValueAtTime(0, t + 0.1);
                osc.start(t); osc.stop(t + 0.1);
            } else if (type === 'pop') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(800, t);
                osc.frequency.exponentialRampToValueAtTime(1200, t + 0.1);
                gain.gain.setValueAtTime(0.1, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
                osc.start(t); osc.stop(t + 0.1);
            }
        }

        window.onload = init;
    </script>
