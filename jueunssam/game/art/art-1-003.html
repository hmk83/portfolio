<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>신나는 색깔 섞기 놀이</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --gnb-height: 60px;
        }

        body {
            font-family: 'Jua', sans-serif;
            background-color: #fdf4ff;
            user-select: none;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            margin: 0;
            padding: 0;
        }

        #gnb {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--gnb-height);
            background-color: #FEE500;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        #game-container {
            position: absolute;
            top: var(--gnb-height);
            left: 0;
            width: 100%;
            height: calc(100vh - var(--gnb-height));
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }


        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        #game-container {
            position: absolute;
            top: var(--gnb-height);
            left: 0;
            width: 100vw;
            height: calc(100vh - var(--gnb-height));
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #fdf4ff;
        }

        /* [Tablet Horizontal Optimization & Flex/Grid] */
        @media (min-width: 1024px) {
            #main-wrapper {
                width: 70vw !important;
                height: 85vh !important;
                max-width: 1200px !important;
                max-height: 900px !important;
            }

            #main-container {
                flex-direction: column !important;
                padding: 4vmin !important;
            }

            #equation-section {
                position: relative !important;
                flex: 1 1 auto;
                height: auto !important;
                top: auto;
                left: auto;
                width: auto;
            }

            #palette-section {
                position: relative !important;
                flex: 0 0 auto;
                height: auto !important;
                border-top: 0.5vmin solid #f1f5f9 !important;
                border-left: none !important;
                padding-top: 4vmin !important;
                padding-left: 0;
                top: auto;
                left: auto;
                width: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            #palette {
                display: flex !important;
                flex-wrap: wrap;
                gap: 2vmin 2vmin;
                width: 100%;
                height: auto;
                padding: 0;
                justify-content: center;
                align-content: center;
            }

            .palette-item {
                position: relative !important;
                width: 10vmin !important;
                height: 10vmin !important;
                max-width: 120px;
                max-height: 120px;
                transform: none !important;
                top: auto !important;
                left: auto !important;
                margin: 0;
            }

            .palette-item:active {
                transform: scale(0.9) !important;
            }

            .mixing-slot {
                width: 16vmin !important;
                height: 16vmin !important;
                max-width: 180px;
                max-height: 180px;
            }

            .result-circle {
                width: 24vmin !important;
                height: 24vmin !important;
                max-width: 280px;
                max-height: 280px;
            }

            .equation-icon {
                width: 6vmin !important;
                height: 6vmin !important;
                max-width: 80px;
                max-height: 80px;
            }

            .equation-text {
                font-size: 6vmin !important;
            }
        }


        .btn-press {
            transition: transform 0.1s;
        }

        .btn-press:active {
            transform: scale(0.95);
        }

        .modal-enter {
            animation: modalFadeIn 0.3s forwards;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .color-circle {
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            box-shadow: inset 0 -1vmin 1vmin rgba(0, 0, 0, 0.1), 0 0.5vmin 1.5vmin rgba(0, 0, 0, 0.1);
        }

        .color-circle:active {
            transform: scale(0.9);
        }

        .mixing-slot {
            width: 18vmin;
            height: 18vmin;
            border: 0.5vmin dashed #e2e8f0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8fafc;
        }

        .mixing-slot.active {
            border-style: solid;
            border-color: #cbd5e1;
        }

        .result-circle {
            width: 25vmin;
            height: 25vmin;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.5s ease;
            box-shadow: inset 0 -1.5vmin 2vmin rgba(0, 0, 0, 0.15), 0 1vmin 3vmin rgba(0, 0, 0, 0.1);
        }

        .pop-in {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        #confetti {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>

<body>
    <nav id="gnb">
        <div class="flex items-center gap-2">
            <h1 class="text-xl font-bold text-gray-800"><span data-i18n="appTitle">🎨 색깔 섞기 놀이</span></h1>
        </div>
        <div class="flex gap-2">
            <button id="btn-lang"
                class="bg-white border-2 border-gray-200 rounded-full px-4 py-1 text-sm font-bold shadow-sm hover:bg-gray-50 btn-press"
                data-i18n="langBtn">English</button>
            <button id="btn-restart"
                class="hidden bg-indigo-500 text-white rounded-full px-4 py-1 text-sm font-bold shadow-sm hover:bg-indigo-600 btn-press"
                data-i18n="restart">다시하기</button>
            <button id="btn-exit"
                class="bg-gray-600 text-white rounded-full px-4 py-1 text-sm font-bold shadow-sm hover:bg-gray-700 btn-press"
                data-i18n="exit">종료</button>
        </div>
    </nav>

    <div id="game-container">
        <canvas id="confetti"></canvas>

        <!-- Intro Screen -->
        <div id="intro-screen" class="absolute inset-0 flex flex-col items-center justify-center z-20">
            <i data-lucide="droplet" class="w-32 h-32 text-pink-500 mb-6"></i>
            <h1 class="text-7xl font-bold text-pink-600 drop-shadow-lg mb-4" data-i18n="appTitle">색깔 섞기 놀이</h1>
            <p class="text-2xl text-gray-500 mb-12" data-i18n="introDesc">두 가지 색을 섞어봐요!</p>
            <div class="flex gap-4">
                <button id="btn-howto"
                    class="bg-yellow-400 hover:bg-yellow-500 text-white text-3xl px-8 py-4 rounded-3xl shadow-lg btn-press flex items-center gap-2">
                    <i data-lucide="help-circle" class="w-8 h-8"></i><span data-i18n="howToPlay">설명 보기</span>
                </button>
                <button id="btn-start"
                    class="bg-pink-500 hover:bg-pink-600 text-white text-3xl px-12 py-4 rounded-3xl shadow-lg btn-press flex items-center gap-2">
                    <i data-lucide="play" class="w-8 h-8"></i><span data-i18n="start">시작하기</span>
                </button>
            </div>
        </div>

        <!-- Main Game -->
        <div id="main-wrapper" class="hidden w-[95vw] h-[85vh] max-w-[800px] flex flex-col relative">
            <main id="main-container"
                class="w-full h-full bg-white rounded-[4vmin] shadow-xl p-[4vmin] flex flex-col relative overflow-hidden border-[0.8vmin] border-pink-50">
                <div id="equation-section" class="flex flex-col items-center justify-around flex-grow">
                    <div class="flex items-center gap-[4vmin]">
                        <div id="slot-0" onclick="clearSlot(0)" class="mixing-slot cursor-pointer">
                            <i data-lucide="plus" class="equation-icon text-gray-300 w-[6vmin] h-[6vmin]"></i>
                        </div>
                        <i data-lucide="plus" class="equation-icon text-gray-400 w-[5vmin] h-[5vmin]"></i>
                        <div id="slot-1" onclick="clearSlot(1)" class="mixing-slot cursor-pointer">
                            <i data-lucide="plus" class="equation-icon text-gray-300 w-[6vmin] h-[6vmin]"></i>
                        </div>
                        <div class="equation-text text-5xl text-gray-400 font-bold mx-[1vmin]">=</div>
                        <div id="result-display" onclick="speakResult()"
                            class="result-circle bg-gray-100 cursor-pointer">
                            <i data-lucide="sparkles" class="text-gray-300 w-[10vmin] h-[10vmin]"></i>
                        </div>
                    </div>
                    <div class="h-[12vmin] flex flex-col items-center justify-center">
                        <p id="instruction" class="text-3xl text-gray-400" data-i18n="instruction">아래 물감을 눌러서 색을 섞어봐요!
                        </p>
                        <div id="result-name-box" class="hidden flex flex-col items-center gap-[1.5vmin] pop-in">
                            <h2 id="result-name" onclick="speakResult()"
                                class="text-6xl font-bold text-gray-800 cursor-pointer underline decoration-dotted decoration-pink-200 underline-offset-8">
                                결과</h2>
                            <span class="text-xl text-blue-400 animate-pulse" data-i18n="clickToHear">글자를 누르면
                                읽어줘요!</span>
                        </div>
                    </div>
                </div>
                <div id="palette-section" class="w-full border-t-[0.3vmin] border-gray-100 pt-[4vmin]">
                    <div id="palette" class="flex justify-center gap-[2.5vmin] items-center"></div>
                </div>
            </main>
        </div>
    </div>

    <!-- Modals -->
    <div id="modal-info" class="hidden fixed inset-0 bg-black/50 z-[20000] flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 w-[80%] max-w-md shadow-2xl relative modal-enter border-4 border-pink-100">
            <button class="btn-close-modal absolute top-4 right-4 text-gray-400 hover:text-gray-600">
                <i data-lucide="x-circle" class="w-8 h-8"></i>
            </button>
            <h3 class="text-2xl font-bold text-pink-500 mb-4 flex items-center gap-2">
                <i data-lucide="palette" class="w-6 h-6"></i> <span data-i18n="howToPlay">설명 보기</span>
            </h3>
            <p class="text-lg text-gray-700 mb-4" data-i18n="guide">아래 물감 버튼을 두 번 눌러서 색을 섞어보세요. 두 가지 색이 만나면 새로운 색이 나타나요!
            </p>
            <div class="mt-6 text-center">
                <button
                    class="btn-close-modal bg-pink-500 hover:bg-pink-600 text-white text-lg px-6 py-2 rounded-full shadow-md transition"
                    data-i18n="ok">알겠어요!</button>
            </div>
        </div>
    </div>

    <div id="modal-exit" class="hidden fixed inset-0 bg-black/50 z-[20000] flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 w-[80%] max-w-lg shadow-2xl relative modal-enter text-center">
            <h3 class="text-3xl font-bold text-gray-800 mb-4" data-i18n="exitConfirm">정말 종료할까요?</h3>
            <p class="text-xl text-gray-500 mb-8" data-i18n="exitDesc">진행 상황이 저장되지 않아요.</p>
            <div class="flex justify-center gap-4">
                <button id="btn-cancel-exit"
                    class="bg-gray-200 text-gray-700 text-xl px-6 py-3 rounded-full hover:bg-gray-300"
                    data-i18n="cancel">아니요</button>
                <button id="btn-confirm-exit"
                    class="bg-red-500 text-white text-xl px-6 py-3 rounded-full hover:bg-red-600" data-i18n="yes">네,
                    종료해요</button>
            </div>
        </div>
    </div>

    <div id="modal-restart" class="hidden fixed inset-0 bg-black/50 z-[20000] flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 w-[80%] max-w-lg shadow-2xl relative modal-enter text-center">
            <h3 class="text-3xl font-bold text-gray-800 mb-4" data-i18n="restartConfirm">다시 시작할까요?</h3>
            <p class="text-xl text-gray-500 mb-8" data-i18n="restartDesc">처음부터 다시 시작합니다.</p>
            <div class="flex justify-center gap-4">
                <button id="btn-cancel-restart"
                    class="bg-gray-200 text-gray-700 text-xl px-6 py-3 rounded-full hover:bg-gray-300"
                    data-i18n="cancel">아니요</button>
                <button id="btn-confirm-restart"
                    class="bg-pink-500 text-white text-xl px-6 py-3 rounded-full hover:bg-pink-600"
                    data-i18n="yesRestart">네, 다시 시작해요</button>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_API_KEY = "AIzaSyAE0nnpOYZRfLkfM09O3NQjpWnN1kUqR3E";
        const I18N_DATA = {
            ko: {
                langBtn: "English", appTitle: "색깔 섞기 놀이", introDesc: "두 가지 색을 섞어봐요!", howToPlay: "설명 보기",
                start: "시작하기", restart: "다시하기", exit: "종료", instruction: "아래 물감을 눌러서 색을 섞어봐요!",
                clickToHear: "글자를 누르면 읽어줘요!", guide: "아래 물감 버튼을 두 번 눌러서 색을 섞어보세요. 두 가지 색이 만나면 새로운 색이 나타나요!",
                ok: "알겠어요!", exitConfirm: "정말 종료할까요?", exitDesc: "진행 상황이 저장되지 않아요.",
                restartConfirm: "다시 시작할까요?", restartDesc: "처음부터 다시 시작합니다.", yes: "네, 종료해요",
                yesRestart: "네, 다시 시작해요", cancel: "아니요"
            },
            en: {
                langBtn: "한국어", appTitle: "Color Mixing Play", introDesc: "Mix two colors!", howToPlay: "How to Play",
                start: "Start", restart: "Restart", exit: "Exit", instruction: "Tap colors below to mix!",
                clickToHear: "Tap to hear!", guide: "Tap two paint buttons to mix colors. Two colors will create a new color!",
                ok: "Got it!", exitConfirm: "Really Exit?", exitDesc: "Progress will not be saved.",
                restartConfirm: "Restart?", restartDesc: "Start from the beginning.", yes: "Yes, Exit",
                yesRestart: "Yes, Restart", cancel: "No"
            }
        };

        const baseColors = [
            { id: 'red', name: '빨강', eng: 'Red', hex: '#FF3D3D' },
            { id: 'yellow', name: '노랑', eng: 'Yellow', hex: '#FFD700' },
            { id: 'blue', name: '파랑', eng: 'Blue', hex: '#3B82F6' },
            { id: 'white', name: '하양', eng: 'White', hex: '#FFFFFF' },
            { id: 'black', name: '까망', eng: 'Black', hex: '#2D2D2D' }
        ];

        const mixingRules = {
            'red+yellow': { name: '주황', eng: 'Orange', hex: '#FF8C00' },
            'yellow+red': { name: '주황', eng: 'Orange', hex: '#FF8C00' },
            'red+blue': { name: '보라', eng: 'Purple', hex: '#9333EA' },
            'blue+red': { name: '보라', eng: 'Purple', hex: '#9333EA' },
            'yellow+blue': { name: '초록', eng: 'Green', hex: '#22C55E' },
            'blue+yellow': { name: '초록', eng: 'Green', hex: '#22C55E' },
            'red+white': { name: '분홍', eng: 'Pink', hex: '#FFB6C1' },
            'white+red': { name: '분홍', eng: 'Pink', hex: '#FFB6C1' },
            'blue+white': { name: '하늘', eng: 'Sky', hex: '#87CEEB' },
            'white+blue': { name: '하늘', eng: 'Sky', hex: '#87CEEB' },
            'yellow+white': { name: '연노랑', eng: 'Light Yellow', hex: '#FFFACD' },
            'white+yellow': { name: '연노랑', eng: 'Light Yellow', hex: '#FFFACD' },
            'black+white': { name: '회색', eng: 'Gray', hex: '#808080' },
            'white+black': { name: '회색', eng: 'Gray', hex: '#808080' },
            'red+black': { name: '진빨강', eng: 'Dark Red', hex: '#8B0000' },
            'black+red': { name: '진빨강', eng: 'Dark Red', hex: '#8B0000' },
            'blue+black': { name: '남색', eng: 'Navy', hex: '#000080' },
            'black+blue': { name: '남색', eng: 'Navy', hex: '#000080' },
            'yellow+black': { name: '올리브', eng: 'Olive', hex: '#556B2F' },
            'black+yellow': { name: '올리브', eng: 'Olive', hex: '#556B2F' }
        };

        let currentLang = 'ko';
        let selectedSlots = [null, null];
        let currentResult = null;
        let ttsAudio = null;
        let googleTTSAvailable = true;
        let availableVoices = [];

        function loadVoices() { availableVoices = window.speechSynthesis.getVoices(); }
        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices();

        function stopTTS() {
            if (ttsAudio) { ttsAudio.pause(); ttsAudio.currentTime = 0; ttsAudio = null; }
            window.speechSynthesis.cancel();
        }

        async function speak(text) {
            stopTTS();
            if (!text) return;

            if (!googleTTSAvailable) { fallbackSpeak(text); return; }

            const langCode = currentLang === 'ko' ? 'ko-KR' : 'en-US';
            const voiceName = currentLang === 'ko' ? 'ko-KR-Standard-A' : 'en-US-Standard-E';

            try {
                const response = await fetch(`https://texttospeech.googleapis.com/v1/text:synthesize?key=${GOOGLE_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        input: { text: text },
                        voice: { languageCode: langCode, name: voiceName },
                        audioConfig: { audioEncoding: 'MP3' }
                    })
                });

                if (!response.ok) throw new Error(`API Error: ${response.status}`);
                const data = await response.json();
                if (data.audioContent) {
                    const audioBlob = await fetch(`data:audio/mp3;base64,${data.audioContent}`).then(res => res.blob());
                    const audioUrl = URL.createObjectURL(audioBlob);
                    ttsAudio = new Audio(audioUrl);
                    ttsAudio.play().catch(e => console.error("Audio Error:", e));
                } else { fallbackSpeak(text); }
            } catch (e) {
                console.warn("Google TTS failed:", e);
                googleTTSAvailable = false;
                fallbackSpeak(text);
            }
        }

        function fallbackSpeak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = currentLang === 'ko' ? 'ko-KR' : 'en-US';
            utterance.rate = 0.9;
            if (availableVoices.length === 0) availableVoices = window.speechSynthesis.getVoices();
            const voice = availableVoices.find(v => v.lang.startsWith(currentLang === 'ko' ? 'ko' : 'en'));
            if (voice) utterance.voice = voice;
            window.speechSynthesis.speak(utterance);
        }

        function updateTexts() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (I18N_DATA[currentLang][key]) el.innerText = I18N_DATA[currentLang][key];
            });
        }

        function renderPalette() {
            const paletteEl = document.getElementById('palette');
            paletteEl.innerHTML = '';
            baseColors.forEach(color => {
                const btn = document.createElement('div');
                btn.className = 'color-circle palette-item w-[15vmin] h-[15vmin] md:w-[13vmin] md:h-[13vmin] rounded-full border-[0.5vmin] border-white';
                btn.style.backgroundColor = color.hex;
                btn.onclick = () => selectColor(color);
                paletteEl.appendChild(btn);
            });
            const eraserBtn = document.createElement('div');
            eraserBtn.className = 'palette-item w-[15vmin] h-[15vmin] md:w-[13vmin] md:h-[13vmin] rounded-full bg-gray-100 border-[0.5vmin] border-gray-200 flex items-center justify-center cursor-pointer hover:bg-gray-200 shadow-sm';
            eraserBtn.innerHTML = `<i data-lucide="eraser" class="text-gray-500 w-[6vmin] h-[6vmin]"></i>`;
            eraserBtn.onclick = () => { resetGame(); speak(currentLang === 'ko' ? '싹싹 지워요' : 'Erasing'); };
            paletteEl.appendChild(eraserBtn);
            lucide.createIcons();
        }

        function selectColor(color) {
            const emptyIndex = selectedSlots.indexOf(null);
            if (emptyIndex !== -1) {
                selectedSlots[emptyIndex] = color;
                updateSlots();
                speak(currentLang === 'ko' ? color.name : color.eng);
            }
        }

        function clearSlot(index) {
            selectedSlots[index] = null;
            updateSlots();
        }

        function updateSlots() {
            selectedSlots.forEach((color, i) => {
                const slot = document.getElementById(`slot-${i}`);
                if (color) {
                    slot.innerHTML = `<div class="w-full h-full rounded-full pop-in" style="background-color: ${color.hex}"></div>`;
                    slot.classList.add('active');
                } else {
                    slot.innerHTML = `<i data-lucide="plus" class="equation-icon text-gray-300 w-[6vmin] h-[6vmin]"></i>`;
                    slot.classList.remove('active');
                }
            });
            lucide.createIcons();
            calculateResult();
        }

        function calculateResult() {
            const resultDisplay = document.getElementById('result-display');
            const resultNameBox = document.getElementById('result-name-box');
            const resultName = document.getElementById('result-name');
            const instruction = document.getElementById('instruction');

            if (selectedSlots[0] && selectedSlots[1]) {
                const key1 = `${selectedSlots[0].id}+${selectedSlots[1].id}`;
                let result = null;
                if (selectedSlots[0].id === selectedSlots[1].id) {
                    result = { name: selectedSlots[0].name, eng: selectedSlots[0].eng, hex: selectedSlots[0].hex };
                } else {
                    result = mixingRules[key1] || { name: '신기한 색', eng: 'Mixed', hex: '#999999' };
                }

                currentResult = result;
                resultDisplay.style.backgroundColor = result.hex;
                resultDisplay.innerHTML = '';
                resultDisplay.classList.add('pop-in');

                resultName.innerText = currentLang === 'ko' ? result.name : result.eng;
                resultName.style.color = result.hex === '#FFFFFF' ? '#CCCCCC' : result.hex;

                resultNameBox.classList.remove('hidden');
                instruction.classList.add('hidden');

                fireConfetti();
                setTimeout(() => speakResult(), 500);
            } else {
                currentResult = null;
                resultDisplay.style.backgroundColor = '#f1f5f9';
                resultDisplay.innerHTML = `<i data-lucide="sparkles" class="text-gray-300 w-[10vmin] h-[10vmin]"></i>`;
                resultNameBox.classList.add('hidden');
                instruction.classList.remove('hidden');
                lucide.createIcons();
            }
        }

        function speakResult() {
            if (currentResult) {
                speak(currentLang === 'ko' ? currentResult.name : currentResult.eng);
            }
        }

        function resetGame() {
            selectedSlots = [null, null];
            updateSlots();
        }

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        const canvas = document.getElementById("confetti");
        const ctx = canvas.getContext("2d");
        let particles = [];

        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function fireConfetti() {
            const colors = ['#FF4D4D', '#FFD700', '#3B82F6', '#22C55E', '#9333EA', '#FFA500'];
            for (let i = 0; i < 30; i++) {
                particles.push({
                    x: window.innerWidth / 2 + (Math.random() - 0.5) * 100,
                    y: window.innerHeight / 2,
                    w: Math.random() * 8 + 4, h: Math.random() * 8 + 4,
                    dx: (Math.random() - 0.5) * 15, dy: (Math.random() - 0.5) * 15 - 5,
                    color: colors[Math.floor(Math.random() * colors.length)], life: 80
                });
            }
        }

        function updateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.x += p.dx; p.y += p.dy; p.dy += 0.4; p.life--;
                ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.w, p.h);
                if (p.life <= 0) particles.splice(index, 1);
            });
            requestAnimationFrame(updateConfetti);
        }
        updateConfetti();

        document.getElementById('btn-start').onclick = () => {
            stopTTS();
            document.getElementById('intro-screen').classList.add('hidden');
            document.getElementById('main-wrapper').classList.remove('hidden');
            document.getElementById('btn-restart').classList.remove('hidden');
            renderPalette();
            speak(I18N_DATA[currentLang].instruction);
        };

        document.getElementById('btn-lang').onclick = () => {
            currentLang = currentLang === 'ko' ? 'en' : 'ko';
            updateTexts();
            speak(currentLang === 'ko' ? '한국어' : 'English');
        };

        document.getElementById('btn-restart').onclick = () => {
            stopTTS();
            document.getElementById('modal-restart').classList.remove('hidden');
            speak(I18N_DATA[currentLang].restartConfirm);
        };

        document.getElementById('btn-howto').onclick = () => {
            stopTTS();
            document.getElementById('modal-info').classList.remove('hidden');
            speak(I18N_DATA[currentLang].guide);
        };

        document.querySelectorAll('.btn-close-modal').forEach(btn => {
            btn.onclick = () => {
                stopTTS();
                document.getElementById('modal-info').classList.add('hidden');
            };
        });

        document.getElementById('btn-exit').onclick = () => {
            stopTTS();
            document.getElementById('modal-exit').classList.remove('hidden');
            speak(I18N_DATA[currentLang].exitConfirm);
        };

        document.getElementById('btn-cancel-exit').onclick = () => {
            stopTTS();
            document.getElementById('modal-exit').classList.add('hidden');
        };

        document.getElementById('btn-confirm-exit').onclick = () => {
            stopTTS();
            if (window.history.length > 1) window.history.back();
            else window.close();
        };

        document.getElementById('btn-cancel-restart').onclick = () => {
            stopTTS();
            document.getElementById('modal-restart').classList.add('hidden');
        };

        document.getElementById('btn-confirm-restart').onclick = () => {
            stopTTS();
            document.getElementById('modal-restart').classList.add('hidden');
            document.getElementById('intro-screen').classList.remove('hidden');
            document.getElementById('main-wrapper').classList.add('hidden');
            document.getElementById('btn-restart').classList.add('hidden');
            resetGame();
        };

        lucide.createIcons();
    </script>
    <script src="../../js/web-learning-game-shell.js" defer></script>

    <script src="../../js/web-learning-play-tracker.js?v=20260616-03" defer></script>
    <script src="../../js/web-learning-ranking.js?v=20260618-03" defer></script>
</body>
