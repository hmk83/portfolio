<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>컬러 슬라임 땅따먹기</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { corePlugins: { preflight: false } };</script>
    <script src="https://unpkg.com/lucide@latest" onerror="console.warn('Lucide icons failed to load');"></script>
    <script src="./color-slime-core.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --header-height: 48px;
            --mint: #59d8a4;
            --pink: #ff70a6;
            --yellow: #ffd166;
            --blue: #4cc9f0;
            --ink: #273043;
            --panel: rgba(255, 255, 255, 0.88);
            --shadow: 0 18px 48px rgba(39, 48, 67, 0.18);
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            font-family: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at 12% 18%, rgba(255, 209, 102, 0.52), transparent 24%),
                radial-gradient(circle at 88% 16%, rgba(76, 201, 240, 0.42), transparent 25%),
                radial-gradient(circle at 50% 92%, rgba(255, 112, 166, 0.35), transparent 26%),
                linear-gradient(145deg, #f7fff7 0%, #e9fbff 48%, #fff3f8 100%);
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        button {
            font-family: inherit;
        }

        button {
            transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease, filter 0.16s ease;
        }

        .screen {
            position: fixed;
            inset: var(--header-height) 0 0 0;
            display: none;
        }

        .screen.active {
            display: flex;
        }

        .soft-panel {
            background: var(--panel);
            border: 3px solid rgba(255, 255, 255, 0.78);
            box-shadow: var(--shadow);
            backdrop-filter: blur(14px);
        }

        .kakao-header {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
            width: 100%;
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 0 16px;
            color: #3b1e1e;
            background: #FEE500;
            border-bottom: 2px solid #FBC02D;
            box-shadow: 0 4px 10px rgba(39, 48, 67, 0.14);
        }

        .kakao-title {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            font-size: clamp(18px, 3.5vmin, 26px);
            font-weight: 900;
            white-space: nowrap;
        }

        .kakao-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .kakao-btn {
            min-height: 36px;
            border: 1px solid #3b1e1e;
            border-radius: 10px;
            padding: 7px 12px;
            background: #fff;
            color: #3b1e1e;
            font: inherit;
            font-size: clamp(12px, 2vmin, 15px);
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(39, 48, 67, 0.1);
        }

        .kakao-btn.exit {
            background: #3b1e1e;
            color: #FEE500;
            border-color: #3b1e1e;
        }

        #intro-screen {
            position: fixed;
            inset: var(--header-height) 0 0 0;
            z-index: 90;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(circle at 18% 20%, rgba(255, 209, 102, 0.42), transparent 25%),
                radial-gradient(circle at 82% 18%, rgba(76, 201, 240, 0.36), transparent 24%),
                linear-gradient(145deg, #f7fff7 0%, #e9fbff 56%, #fff3f8 100%);
        }

        #intro-screen.hidden {
            display: none;
        }

        .intro-card {
            width: min(92vw, 720px);
            padding: clamp(24px, 5vw, 42px);
            border-radius: 34px;
            text-align: center;
        }

        .intro-slimes {
            display: flex;
            align-items: end;
            justify-content: center;
            gap: 22px;
            margin-bottom: 16px;
        }

        .intro-slime {
            width: clamp(70px, 15vw, 112px);
            height: clamp(70px, 15vw, 112px);
        }

        .intro-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 28px;
        }

        .intro-btn {
            min-width: 170px;
            min-height: 58px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            border: 0;
            border-radius: 22px;
            padding: 14px 22px;
            color: #fff;
            font-size: clamp(20px, 3vw, 27px);
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 12px 22px rgba(39, 48, 67, 0.18);
        }

        .intro-btn.story {
            background: #1888b8;
        }

        .intro-btn.duel {
            background: #d64072;
        }

        .intro-btn.howto {
            color: #273043;
            background: #ffd166;
        }

        .howto-modal {
            position: fixed;
            inset: 0;
            z-index: 20000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background: rgba(39, 48, 67, 0.48);
        }

        .howto-modal.hidden {
            display: none;
        }

        .howto-panel {
            width: min(90vw, 520px);
            position: relative;
            border-radius: 28px;
            padding: 26px;
            background: #fff;
            border: 4px solid #dff8ff;
            box-shadow: 0 22px 54px rgba(39, 48, 67, 0.24);
            animation: pop 0.18s ease-out;
        }

        .howto-close-icon {
            position: absolute;
            top: 14px;
            right: 14px;
            border: 0;
            background: transparent;
            color: #8a94a6;
            cursor: pointer;
        }

        .howto-list {
            display: grid;
            gap: 14px;
            margin: 18px 0 22px;
            padding: 0;
            list-style: none;
        }

        .howto-list li {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            color: #52606d;
            font-size: clamp(17px, 2.4vw, 20px);
            line-height: 1.45;
        }

        .howto-list strong {
            display: block;
            color: #273043;
            margin-bottom: 2px;
        }

        .howto-icon {
            display: grid;
            place-items: center;
            width: 38px;
            height: 38px;
            flex: 0 0 38px;
            border-radius: 50%;
            background: #dff8ff;
            color: #1888b8;
        }

        .howto-ok {
            min-height: 46px;
            border: 0;
            border-radius: 999px;
            padding: 10px 24px;
            color: #fff;
            background: #1888b8;
            font: inherit;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(24, 136, 184, 0.2);
        }

        .confirm-actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 22px;
        }

        .confirm-btn {
            min-width: 108px;
            min-height: 46px;
            border: 0;
            border-radius: 999px;
            padding: 10px 20px;
            font: inherit;
            font-size: 20px;
            cursor: pointer;
        }

        .confirm-btn.cancel {
            color: #52606d;
            background: #eef3f7;
        }

        .confirm-btn.ok {
            color: #fff;
            background: #1888b8;
            box-shadow: 0 10px 20px rgba(24, 136, 184, 0.2);
        }

        .mode-card {
            border: 3px solid rgba(39, 48, 67, 0.08);
            transition: transform 0.14s ease, box-shadow 0.14s ease, border-color 0.14s ease;
        }

        .mode-card:hover {
            transform: translateY(-4px);
            border-color: rgba(39, 48, 67, 0.18);
            box-shadow: 0 16px 32px rgba(39, 48, 67, 0.14);
        }

        #game-board {
            display: grid;
            grid-template-columns: repeat(var(--board-cols, 7), minmax(0, 1fr));
            grid-auto-rows: auto;
            align-items: start;
            gap: clamp(5px, 1.1vw, 10px);
            width: min(92vw, calc(78vh * var(--board-ratio, 1.4)), 820px);
            height: auto;
            padding: clamp(8px, 1.5vw, 14px);
            border-radius: 22px;
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.42), rgba(255, 255, 255, 0.12)),
                #79d7c5;
            border: 4px solid rgba(255, 255, 255, 0.8);
            box-shadow: inset 0 0 26px rgba(39, 48, 67, 0.12), var(--shadow);
        }

        .cell {
            position: relative;
            display: grid;
            place-items: center;
            aspect-ratio: 1 / 1;
            width: 100%;
            min-width: 0;
            min-height: 0;
            padding: 0;
            border: 0;
            border-radius: 12px;
            background:
                radial-gradient(circle at 30% 24%, rgba(255, 255, 255, 0.62), transparent 34%),
                #dff8d7;
            box-shadow: inset 0 -5px 0 rgba(53, 119, 91, 0.12), 0 4px 10px rgba(39, 48, 67, 0.08);
            cursor: pointer;
        }

        .cell:focus-visible {
            outline: 4px solid #273043;
            outline-offset: 2px;
        }

        .cell.selected {
            background: #fff7c2;
            box-shadow: inset 0 -5px 0 rgba(255, 163, 26, 0.24), 0 0 0 4px #fff, 0 0 0 8px #ffd166;
        }

        .cell.valid-copy::after,
        .cell.valid-jump::after,
        .cell.tutorial-origin::after {
            content: '';
            position: absolute;
            width: 38%;
            height: 38%;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.78);
            box-shadow: 0 0 0 4px rgba(39, 48, 67, 0.08);
            animation: pulse 1.1s ease-in-out infinite;
        }

        .cell.valid-jump::after {
            background: transparent;
            border: 4px dashed rgba(255, 255, 255, 0.92);
        }

        .cell.tutorial-origin {
            background: #fff7c2;
            box-shadow: inset 0 -5px 0 rgba(255, 163, 26, 0.24), 0 0 0 4px #fff, 0 0 0 8px rgba(255, 209, 102, 0.82);
        }

        .cell.tutorial-origin::after {
            width: 92%;
            height: 92%;
            background: transparent;
            border: 4px solid rgba(255, 209, 102, 0.92);
        }

        .cell.last-move {
            box-shadow: inset 0 -5px 0 rgba(53, 119, 91, 0.12), 0 0 0 5px rgba(255, 255, 255, 0.72), 0 8px 18px rgba(39, 48, 67, 0.12);
        }

        .computer-turn #game-board {
            pointer-events: none;
        }

        .slime-svg {
            width: 86%;
            height: 86%;
            filter: drop-shadow(0 7px 7px rgba(39, 48, 67, 0.22));
            transform-origin: 50% 100%;
            animation: breathe 2.4s ease-in-out infinite;
        }

        .slime-svg.player .corps {
            fill: #4cc9f0;
        }

        .slime-svg.opponent .corps {
            fill: #ff70a6;
        }

        .slime-svg .yeux {
            animation: blinkEyes 3s infinite ease-in-out;
            transform-origin: 62.5px 72px;
        }

        .score-chip {
            min-width: 118px;
            border: 3px solid rgba(255, 255, 255, 0.72);
        }

        .score-chip.active {
            transform: scale(1.04);
            box-shadow: 0 0 0 5px rgba(255, 209, 102, 0.38), var(--shadow);
            animation: turnPulse 1.05s ease-in-out infinite;
        }

        .tutorial-mode #run-stats {
            display: none;
        }

        .screen.tutorial-mode {
            justify-content: flex-start;
            padding-top: clamp(18px, 3vh, 30px);
        }

        .tutorial-finger {
            position: absolute;
            left: 50%;
            top: 68%;
            z-index: 8;
            display: block;
            font-size: clamp(34px, 6vw, 50px);
            line-height: 1;
            pointer-events: none;
            translate: -50% -50%;
            transform-origin: 50% 100%;
            text-shadow: 0 4px 10px rgba(39, 48, 67, 0.2);
            animation: fingerTap 0.82s ease-in-out infinite;
        }

        .cell.has-tutorial-finger {
            overflow: visible;
        }

        .primary-btn,
        .ghost-btn {
            min-height: 46px;
            border-radius: 999px;
            border: 0;
            padding: 10px 18px;
            font-size: clamp(15px, 2.4vw, 18px);
            color: #273043;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(39, 48, 67, 0.13);
        }

        .primary-btn {
            background: linear-gradient(135deg, var(--yellow), #ffb95c);
        }

        .ghost-btn {
            background: rgba(255, 255, 255, 0.72);
        }

        .result-status-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 138px;
            min-height: 58px;
            margin: 0 auto 12px;
            padding: 8px 22px;
            border-radius: 999px;
            background: linear-gradient(135deg, #ffd166, #ffb95c);
            color: #273043;
            font-size: clamp(34px, 7vw, 54px);
            line-height: 1;
            letter-spacing: 0;
            box-shadow: 0 12px 26px rgba(39, 48, 67, 0.18), inset 0 -4px 0 rgba(39, 48, 67, 0.1);
        }

        .result-status-badge.lose {
            background: linear-gradient(135deg, #dff8ff, #b8ecff);
        }

        .result-status-badge.draw {
            background: linear-gradient(135deg, #f3f4f6, #ffffff);
        }

        .result-scoreboard {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin: 18px 0 20px;
        }

        .result-character-card {
            border-radius: 22px;
            padding: 14px 10px 12px;
            background: rgba(255, 255, 255, 0.72);
            border: 3px solid rgba(39, 48, 67, 0.08);
            box-shadow: inset 0 -5px 0 rgba(39, 48, 67, 0.06), 0 8px 18px rgba(39, 48, 67, 0.1);
        }

        .result-character-card.winner {
            border-color: rgba(255, 209, 102, 0.95);
            background: #fff8d6;
            animation: resultWinnerPulse 1.05s ease-in-out infinite;
        }

        .result-character-card.loser {
            opacity: 0.78;
        }

        .result-character-icon {
            width: 76px;
            height: 76px;
            margin: 0 auto 6px;
        }

        .result-count {
            font-size: clamp(34px, 7vw, 48px);
            line-height: 1;
            color: #273043;
        }

        .run-stat,
        .result-stat {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 34px;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.72);
            box-shadow: inset 0 -3px 0 rgba(39, 48, 67, 0.06);
        }

        .run-stat strong,
        .result-stat strong {
            color: #273043;
        }

        .result-performance {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin: 12px 0 6px;
            color: #52606d;
            font-size: clamp(15px, 2.6vw, 18px);
        }

        @media (hover: hover) {
            .primary-btn:hover,
            .ghost-btn:hover {
                transform: translateY(-3px) scale(1.04);
                filter: brightness(1.04);
                box-shadow: 0 14px 28px rgba(39, 48, 67, 0.2), 0 0 0 4px rgba(255, 255, 255, 0.48);
            }

            .mode-card:hover {
                transform: translateY(-5px) scale(1.02);
                border-color: rgba(255, 209, 102, 0.62);
                box-shadow: 0 18px 34px rgba(39, 48, 67, 0.18), 0 0 0 5px rgba(255, 255, 255, 0.44);
            }

            .cell:hover {
                transform: translateY(-2px) scale(1.035);
                filter: brightness(1.04);
                box-shadow: inset 0 -5px 0 rgba(53, 119, 91, 0.12), 0 9px 16px rgba(39, 48, 67, 0.16);
            }
        }

        .primary-btn:active,
        .ghost-btn:active,
        .mode-card:active,
        .cell:active {
            transform: scale(0.96);
        }

        @keyframes breathe {
            0%,
            100% {
                transform: scaleX(1) scaleY(1);
            }

            50% {
                transform: scaleX(1.06) scaleY(0.94);
            }
        }

        @keyframes blinkEyes {
            0%,
            70%,
            90%,
            100% {
                transform: scaleY(1);
            }

            80% {
                transform: scaleY(0.2);
            }
        }

        @keyframes pulse {
            0%,
            100% {
                transform: scale(0.86);
                opacity: 0.55;
            }

            50% {
                transform: scale(1.08);
                opacity: 1;
            }
        }

        @keyframes pop {
            0% {
                transform: scale(0.8);
            }

            70% {
                transform: scale(1.07);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes turnPulse {
            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 4px rgba(255, 209, 102, 0.25), var(--shadow);
            }

            50% {
                transform: scale(1.11);
                box-shadow: 0 0 0 8px rgba(255, 209, 102, 0.52), 0 20px 46px rgba(39, 48, 67, 0.22);
            }
        }

        @keyframes resultWinnerPulse {
            0%,
            100% {
                transform: scale(1);
                box-shadow: inset 0 -5px 0 rgba(39, 48, 67, 0.06), 0 8px 18px rgba(39, 48, 67, 0.1);
            }

            50% {
                transform: scale(1.06);
                box-shadow: inset 0 -5px 0 rgba(39, 48, 67, 0.06), 0 16px 28px rgba(255, 177, 66, 0.28);
            }
        }

        @keyframes fingerTap {
            0%,
            100% {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(7px) scale(0.92);
            }
        }

        @media (max-width: 760px) {
            body {
                overflow-y: auto;
            }

            .screen {
                position: relative;
                min-height: 100dvh;
                overflow-y: auto;
            }

            #intro-screen {
                align-items: start;
                overflow-y: auto;
                padding: 14px 10px 24px;
            }

            .intro-card {
                padding: 18px 14px;
            }

            .intro-actions {
                flex-direction: column;
                align-items: stretch;
            }

            .intro-btn {
                width: 100%;
            }

            .intro-slime {
                width: 58px;
                height: 58px;
            }

            #game-screen {
                padding: 10px;
            }

            #game-board {
                width: min(94vw, calc(60vh * var(--board-ratio, 1.4)), 680px);
                gap: 5px;
                border-radius: 18px;
            }

            .cell {
                border-radius: 9px;
            }

            .score-chip {
                min-width: 92px;
            }

            .result-scoreboard {
                gap: 8px;
            }

            .result-character-icon {
                width: 62px;
                height: 62px;
            }
        }
    </style>
</head>

<body>
    <header id="gnb" class="kakao-header">
        <div class="kakao-title">
            <i data-lucide="palette" class="w-6 h-6"></i>
            컬러 슬라임 땅따먹기
        </div>
        <div class="kakao-actions">
            <button id="gnb-restart" class="kakao-btn" type="button">
                다시 시작 <i data-lucide="rotate-ccw" class="inline-block w-4 h-4 align-[-2px]"></i>
            </button>
            <button id="gnb-exit" class="kakao-btn exit" type="button">
                학습 종료 <i data-lucide="log-out" class="inline-block w-4 h-4 align-[-2px]"></i>
            </button>
        </div>
    </header>

    <section id="intro-screen" aria-label="학습 안내">
        <div class="intro-card soft-panel">
            <div class="intro-slimes" aria-hidden="true">
                <div id="intro-player-slime" class="intro-slime"></div>
                <div id="intro-opponent-slime" class="intro-slime"></div>
            </div>
            <h1 class="text-[clamp(38px,7vw,68px)] leading-none text-[#273043] mb-4">컬러 슬라임 땅따먹기</h1>
            <p class="text-[clamp(18px,3vw,25px)] text-[#52606d] leading-relaxed">파랑이를 움직여 땅을 넓히는 미술 보드게임이에요.</p>

            <div class="intro-actions">
                <button id="start-story" class="intro-btn story" type="button">
                    <i data-lucide="bot" class="w-7 h-7"></i>
                    1 vs 컴퓨터
                </button>

                <button id="start-duel" class="intro-btn duel" type="button">
                    <i data-lucide="users-round" class="w-7 h-7"></i>
                    1:1
                </button>

                <button id="btn-howto" class="intro-btn howto" type="button">
                    <i data-lucide="help-circle" class="w-7 h-7"></i>
                    사용방법
                </button>
            </div>
        </div>
    </section>

    <div id="modal-info" class="howto-modal hidden" role="dialog" aria-modal="true" aria-labelledby="howto-title">
        <div class="howto-panel">
            <button class="btn-close-modal howto-close-icon" type="button" aria-label="사용방법 닫기">
                <i data-lucide="x-circle" class="w-8 h-8"></i>
            </button>
            <h2 id="howto-title" class="text-3xl text-[#1888b8] mb-2 flex items-center gap-2">
                <i data-lucide="info" class="w-7 h-7"></i>
                사용방법
            </h2>
            <ul class="howto-list">
                <li>
                    <span class="howto-icon"><i data-lucide="hand-pointer" class="w-5 h-5"></i></span>
                    <div><strong>내 슬라임 선택</strong>노란 테두리로 표시된 파랑이를 먼저 눌러요.</div>
                </li>
                <li>
                    <span class="howto-icon"><i data-lucide="move" class="w-5 h-5"></i></span>
                    <div><strong>칸으로 이동</strong>반짝이는 칸을 누르면 슬라임이 복사되거나 점프해요.</div>
                </li>
                <li>
                    <span class="howto-icon"><i data-lucide="sparkles" class="w-5 h-5"></i></span>
                    <div><strong>많이 만들기</strong>옆에 있는 분홍이를 내 색으로 바꾸면 이겨요.</div>
                </li>
            </ul>
            <div class="text-center">
                <button class="btn-close-modal howto-ok" type="button">알겠어요!</button>
            </div>
        </div>
    </div>

    <div id="confirm-modal" class="howto-modal hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
        <div class="howto-panel text-center">
            <h2 id="confirm-title" class="text-3xl text-[#273043] mb-3">확인</h2>
            <p id="confirm-message" class="text-xl text-[#52606d] leading-relaxed">계속할까요?</p>
            <div class="confirm-actions">
                <button id="confirm-cancel" class="confirm-btn cancel" type="button">취소</button>
                <button id="confirm-ok" class="confirm-btn ok" type="button">확인</button>
            </div>
        </div>
    </div>

    <section id="game-screen" class="screen flex-col items-center justify-center gap-3 p-4">
        <main class="w-full max-w-[1180px] grid lg:grid-cols-[130px_minmax(0,1fr)_130px] items-center justify-items-center gap-3">
            <aside id="player-panel" class="score-chip active soft-panel rounded-[22px] p-3 text-center order-1 lg:order-none">
                <div class="mx-auto w-14 h-14" id="player-icon"></div>
                <div class="text-sm text-[#1888b8]">파랑이</div>
                <div id="player-score" class="text-4xl text-[#273043]">2</div>
            </aside>

            <div id="game-board" aria-label="컬러 슬라임 게임판"></div>

            <aside id="opponent-panel" class="score-chip soft-panel rounded-[22px] p-3 text-center order-2 lg:order-none">
                <div class="mx-auto w-14 h-14" id="opponent-icon"></div>
                <div id="opponent-name" class="text-sm text-[#d64072]">컴퓨터</div>
                <div id="opponent-score" class="text-4xl text-[#273043]">2</div>
            </aside>
        </main>

        <div id="run-stats" class="w-full max-w-4xl soft-panel rounded-[22px] px-4 py-3 flex flex-wrap items-center justify-center gap-3 text-[clamp(15px,2.4vw,19px)] text-[#52606d]">
            <span class="run-stat">시간 <strong id="timer-value">0.0초</strong></span>
            <span class="run-stat">최소 클릭 <strong id="click-value">0</strong></span>
            <span class="run-stat">점수 <strong id="score-value">0</strong></span>
        </div>
    </section>

    <div id="result-modal" class="hidden fixed inset-0 z-50 items-center justify-center p-4 bg-black/42">
        <div class="soft-panel rounded-[30px] p-6 w-full max-w-lg text-center">
            <div id="result-status" class="result-status-badge">WIN</div>
            <h2 id="result-title" class="text-4xl text-[#273043] mb-3">스테이지 결과</h2>
            <p id="result-message" class="text-xl text-[#52606d] mb-2">다음 스테이지로 가볼까요?</p>
            <div id="result-scoreboard" class="result-scoreboard" aria-label="결과 점수판">
                <div id="result-player-card" class="result-character-card">
                    <div id="result-player-icon" class="result-character-icon"></div>
                    <div class="text-sm text-[#1888b8]">파랑이</div>
                    <div id="result-player-count" class="result-count">0</div>
                </div>
                <div id="result-opponent-card" class="result-character-card">
                    <div id="result-opponent-icon" class="result-character-icon"></div>
                    <div id="result-opponent-name" class="text-sm text-[#d64072]">컴퓨터</div>
                    <div id="result-opponent-count" class="result-count">0</div>
                </div>
            </div>
            <div id="result-performance" class="result-performance" aria-label="플레이 기록">
                <span class="result-stat">점수 <strong id="result-score-value">0</strong></span>
                <span class="result-stat">시간 <strong id="result-time-value">0.0초</strong></span>
                <span class="result-stat">클릭 <strong id="result-click-value">0</strong></span>
            </div>
            <div class="flex justify-center">
                <button id="result-primary" class="primary-btn">계속하기</button>
            </div>
        </div>
    </div>

    <script>
        const {
            STAGE_COUNT,
            PLAYER,
            OPPONENT,
            createInitialBoard,
            createTutorialBoard,
            getTutorialMoves,
            getBoardSize,
            getLegalMoves,
            applyMove,
            calculateStageScore,
            chooseComputerMove,
            getStageBoardSize,
            getStageConfig,
            getScores,
            getWinner,
            isGameOver,
            otherPlayer,
        } = window.ColorSlimeCore;

        const dom = {
            introScreen: document.getElementById('intro-screen'),
            introPlayerSlime: document.getElementById('intro-player-slime'),
            introOpponentSlime: document.getElementById('intro-opponent-slime'),
            infoModal: document.getElementById('modal-info'),
            howtoButton: document.getElementById('btn-howto'),
            confirmModal: document.getElementById('confirm-modal'),
            confirmTitle: document.getElementById('confirm-title'),
            confirmMessage: document.getElementById('confirm-message'),
            confirmCancel: document.getElementById('confirm-cancel'),
            confirmOk: document.getElementById('confirm-ok'),
            gameScreen: document.getElementById('game-screen'),
            startStory: document.getElementById('start-story'),
            startDuel: document.getElementById('start-duel'),
            gnbRestart: document.getElementById('gnb-restart'),
            gnbExit: document.getElementById('gnb-exit'),
            board: document.getElementById('game-board'),
            timerValue: document.getElementById('timer-value'),
            clickValue: document.getElementById('click-value'),
            scoreValue: document.getElementById('score-value'),
            playerPanel: document.getElementById('player-panel'),
            opponentPanel: document.getElementById('opponent-panel'),
            playerScore: document.getElementById('player-score'),
            opponentScore: document.getElementById('opponent-score'),
            opponentName: document.getElementById('opponent-name'),
            playerIcon: document.getElementById('player-icon'),
            opponentIcon: document.getElementById('opponent-icon'),
            resultModal: document.getElementById('result-modal'),
            resultStatus: document.getElementById('result-status'),
            resultTitle: document.getElementById('result-title'),
            resultMessage: document.getElementById('result-message'),
            resultPlayerCard: document.getElementById('result-player-card'),
            resultOpponentCard: document.getElementById('result-opponent-card'),
            resultPlayerIcon: document.getElementById('result-player-icon'),
            resultOpponentIcon: document.getElementById('result-opponent-icon'),
            resultOpponentName: document.getElementById('result-opponent-name'),
            resultPlayerCount: document.getElementById('result-player-count'),
            resultOpponentCount: document.getElementById('result-opponent-count'),
            resultScoreValue: document.getElementById('result-score-value'),
            resultTimeValue: document.getElementById('result-time-value'),
            resultClickValue: document.getElementById('result-click-value'),
            resultPrimary: document.getElementById('result-primary'),
        };

        const state = {
            mode: 'story',
            stage: 1,
            board: createInitialBoard(),
            currentPlayer: PLAYER,
            selected: null,
            locked: false,
            lastMove: null,
            tutorialStep: 0,
            startedAt: 0,
            elapsedMs: 0,
            clickCount: 0,
            stageScore: { total: 0, baseScore: 0, speedBonus: 0, clickBonus: 0 },
            timerId: null,
            boardSize: { rows: 5, cols: 7 },
        };

        const moveSound = new Audio('../sound/button.mp3');
        moveSound.preload = 'auto';
        moveSound.volume = 0.75;
        let pendingConfirmAction = null;

        function openConfirmModal({ title, message, okText = '확인', onConfirm }) {
            pendingConfirmAction = onConfirm;
            dom.confirmTitle.textContent = title;
            dom.confirmMessage.textContent = message;
            dom.confirmOk.textContent = okText;
            dom.confirmModal.classList.remove('hidden');
        }

        function closeConfirmModal() {
            pendingConfirmAction = null;
            dom.confirmModal.classList.add('hidden');
        }

        function playMoveSound() {
            try {
                moveSound.currentTime = 0;
                moveSound.play().catch(() => { });
            } catch (error) {
                console.warn('Move sound could not be played.', error);
            }
        }

        function slimeSvg(player) {
            const className = player === PLAYER ? 'player' : 'opponent';
            return `
                <svg class="slime-svg ${className}" viewBox="0 0 126.75 103.25" xml:space="preserve" aria-hidden="true">
                    <g class="corps">
                        <path d="M126.153,71.798c0,35.275-30.128,31.452-65.403,31.452S0.411,107.073,0.411,71.798S34,0.927,63.282,0.927 C92,0.927,126.153,36.523,126.153,71.798z"/>
                    </g>
                    <g class="ombre">
                        <path opacity="0.1" d="M98.583,98.968c0,5.085-4.708,4.313-37.833,4.313c-29.563,0-32.769,0.771-32.769-4.313 c0-8.718,18.86-10.218,35.301-10.218C79.407,88.75,98.583,91.125,98.583,98.968z"/>
                    </g>
                    <g class="reflet">
                        <ellipse transform="matrix(0.5486 -0.8361 0.8361 0.5486 20.2905 77.5842)" opacity="0.5" fill="#FFFFFF" cx="82" cy="20" rx="7.75" ry="13.75"/>
                    </g>
                    <g class="yeux">
                        <g>
                            <path d="M36.833,66.583c-3.359,0-6.083,2.724-6.083,6.083c0,3.359,2.724,6.083,6.083,6.083c3.36,0,6.083-2.724,6.083-6.083 C42.917,69.307,40.193,66.583,36.833,66.583z M39.5,71.25c-0.874,0-1.583-0.709-1.583-1.583c0-0.875,0.709-1.583,1.583-1.583 c0.875,0,1.583,0.709,1.583,1.583C41.083,70.541,40.375,71.25,39.5,71.25z"/>
                            <circle fill="#FFFFFF" cx="39.5" cy="69.667" r="1.583"/>
                            <path d="M88.833,66.583c-3.359,0-6.083,2.724-6.083,6.083c0,3.359,2.724,6.083,6.083,6.083c3.36,0,6.083-2.724,6.083-6.083 C94.917,69.307,92.193,66.583,88.833,66.583z M91.5,71.25c-0.874,0-1.583-0.709-1.583-1.583c0-0.875,0.709-1.583,1.583-1.583 c0.875,0,1.583,0.709,1.583,1.583C93.083,70.541,92.375,71.25,91.5,71.25z"/>
                            <circle fill="#FFFFFF" cx="91.5" cy="69.667" r="1.583"/>
                        </g>
                    </g>
                    <g class="bouche">
                        <g>
                            <path fill="#A862A6">
                                <animate attributeName="d" dur="3s" repeatCount="indefinite" values="M49.9,78c0,3.151,1.885,5.435,4.528,7c3.228-1.911,7.589-2.749,11.072-2.749S73.344,83.089,76.572,85 c2.643-1.565,4.528-3.849,4.528-7H65.584H49.9z; M49.9,73c0,3.151,1.885,10.435,4.528,12c3.228-1.911,7.589-2.749,11.072-2.749S73.344,83.089,76.572,85 c2.643-1.565,4.528-8.849,4.528-12H65.584H49.9z; M49.9,78c0,3.151,1.885,5.435,4.528,7c3.228-1.911,7.589-2.749,11.072-2.749S73.344,83.089,76.572,85 c2.643-1.565,4.528-3.849,4.528-7H65.584H49.9z" />
                            </path>
                            <path fill="#E0B7E5" d="M52.678,84.25c7.116,3.558,15.028,3.558,22.144,0C68.463,80.485,59.037,80.485,52.678,84.25 C52.679,84.25,52.656,84.25,52.678,84.25z"/>
                        </g>
                    </g>
                </svg>`;
        }

        function showIntro() {
            if (state.timerId) {
                window.clearInterval(state.timerId);
                state.timerId = null;
            }
            dom.gameScreen.classList.remove('active');
            dom.introScreen.classList.remove('hidden');
        }

        function showGame() {
            dom.introScreen.classList.add('hidden');
            dom.gameScreen.classList.add('active');
        }

        function restartCurrentView() {
            showIntro();
        }

        function isTutorialStage(mode = state.mode, stage = state.stage) {
            return mode === 'story' && stage === 1;
        }

        function getCurrentTutorialMove() {
            if (!isTutorialStage()) return null;
            return getTutorialMoves()[state.tutorialStep] || null;
        }

        function getTutorialMessage() {
            const tutorialMove = getCurrentTutorialMove();
            if (!tutorialMove) return '튜토리얼 완료';
            if (tutorialMove.player === OPPONENT) return '컴퓨터도 한 번 해요.';
            return state.tutorialStep === 0 ? '손가락이 가리키는 곳을 눌러요.' : '마지막으로 표시된 칸을 눌러요.';
        }

        function formatElapsedTime(ms) {
            return `${(Math.max(0, ms) / 1000).toFixed(1)}초`;
        }

        function getElapsedMs() {
            if (!state.startedAt) return state.elapsedMs;
            return Date.now() - state.startedAt;
        }

        function getCurrentStageScore() {
            return calculateStageScore({
                winner: PLAYER,
                scores: getScores(state.board),
                elapsedMs: getElapsedMs(),
                clickCount: state.clickCount,
                stage: state.stage,
            });
        }

        function renderRunStats() {
            const score = getCurrentStageScore();
            dom.timerValue.textContent = formatElapsedTime(getElapsedMs());
            dom.clickValue.textContent = state.clickCount;
            dom.scoreValue.textContent = score.total.toLocaleString('ko-KR');
        }

        function startGame(mode, stage = 1) {
            if (state.timerId) window.clearInterval(state.timerId);
            const boardSize = mode === 'story' ? getStageBoardSize(stage) : { rows: 6, cols: 9 };
            state.mode = mode;
            state.stage = stage;
            state.boardSize = boardSize;
            state.board = isTutorialStage(mode, stage) ? createTutorialBoard() : createInitialBoard(boardSize);
            state.currentPlayer = PLAYER;
            state.selected = null;
            state.locked = false;
            state.lastMove = null;
            state.tutorialStep = 0;
            state.startedAt = Date.now();
            state.elapsedMs = 0;
            state.clickCount = 0;
            state.stageScore = { total: 0, baseScore: 0, speedBonus: 0, clickBonus: 0 };
            state.timerId = window.setInterval(renderRunStats, 250);
            dom.opponentName.textContent = mode === 'story' ? '컴퓨터' : '분홍이';
            showGame();
            render();
        }

        function getValidTargets() {
            if (state.selected === null) return new Map();
            const tutorialMove = getCurrentTutorialMove();
            if (tutorialMove) {
                return state.selected === tutorialMove.from ? new Map([[tutorialMove.to, tutorialMove]]) : new Map();
            }
            const moves = getLegalMoves(state.board, state.currentPlayer).filter((move) => move.from === state.selected);
            return new Map(moves.map((move) => [move.to, move]));
        }

        function renderBoard() {
            const validTargets = getValidTargets();
            const boardSize = getBoardSize(state.board);
            const blocksPlayerInput = state.locked || (state.mode === 'story' && state.currentPlayer === OPPONENT);
            dom.board.style.setProperty('--board-rows', boardSize.rows);
            dom.board.style.setProperty('--board-cols', boardSize.cols);
            dom.board.style.setProperty('--board-ratio', boardSize.cols / boardSize.rows);
            dom.board.innerHTML = '';
            state.board.forEach((cell, index) => {
                const button = document.createElement('button');
                const move = validTargets.get(index);
                const tutorialMove = getCurrentTutorialMove();
                button.type = 'button';
                button.className = 'cell';
                button.disabled = blocksPlayerInput;
                button.setAttribute('aria-label', `${Math.floor(index / boardSize.cols) + 1}행 ${(index % boardSize.cols) + 1}열`);
                if (index === state.selected) button.classList.add('selected');
                if (state.lastMove === index) button.classList.add('last-move');
                if (move) button.classList.add(move.distance === 1 ? 'valid-copy' : 'valid-jump');
                if (tutorialMove && state.selected === null && index === tutorialMove.from) button.classList.add('tutorial-origin');
                if (cell === PLAYER || cell === OPPONENT) button.innerHTML = slimeSvg(cell);
                const isTutorialFingerTarget = tutorialMove
                    && tutorialMove.player === PLAYER
                    && !state.locked
                    && ((state.selected === null && index === tutorialMove.from) || (state.selected !== null && index === tutorialMove.to));
                if (isTutorialFingerTarget) {
                    button.classList.add('has-tutorial-finger');
                    button.insertAdjacentHTML('beforeend', '<span class="tutorial-finger" aria-hidden="true">👆</span>');
                }
                button.addEventListener('click', () => handleCellClick(index));
                dom.board.appendChild(button);
            });
        }

        function renderHud() {
            const scores = getScores(state.board);
            const tutorialMode = isTutorialStage();
            dom.gameScreen.classList.toggle('tutorial-mode', tutorialMode);
            dom.gameScreen.classList.toggle('computer-turn', state.mode === 'story' && state.currentPlayer === OPPONENT);
            dom.playerScore.textContent = scores.player;
            dom.opponentScore.textContent = scores.opponent;
            dom.playerIcon.innerHTML = slimeSvg(PLAYER);
            dom.opponentIcon.innerHTML = slimeSvg(OPPONENT);
            dom.playerPanel.classList.toggle('active', state.currentPlayer === PLAYER);
            dom.opponentPanel.classList.toggle('active', state.currentPlayer === OPPONENT);
            renderRunStats();
        }

        function render() {
            renderBoard();
            renderHud();
            if (window.lucide) window.lucide.createIcons();
        }

        function handleCellClick(index) {
            if (state.locked || (state.mode === 'story' && state.currentPlayer === OPPONENT)) return;
            state.clickCount += 1;
            const tutorialMove = getCurrentTutorialMove();
            if (tutorialMove) {
                if (state.selected === null) {
                    if (index !== tutorialMove.from) {
                        return;
                    }
                    state.selected = index;
                    render();
                    return;
                }
                if (index !== tutorialMove.to) {
                    return;
                }
                playMove(tutorialMove);
                return;
            }
            const cell = state.board[index];
            if (cell === state.currentPlayer) {
                state.selected = state.selected === index ? null : index;
                render();
                return;
            }
            if (state.selected === null) return;
            const move = getValidTargets().get(index);
            if (!move) {
                return;
            }
            playMove(move);
        }

        function playMove(move) {
            playMoveSound();
            const result = applyMove(state.board, move);
            state.board = result.board;
            state.lastMove = move.to;
            state.selected = null;
            if (isTutorialStage()) state.tutorialStep += 1;
            state.currentPlayer = otherPlayer(state.currentPlayer);
            render();
            window.setTimeout(afterTurn, 260);
        }

        function afterTurn() {
            if (isGameOver(state.board)) {
                showGameResult();
                return;
            }

            if (!getLegalMoves(state.board, state.currentPlayer).length) {
                state.currentPlayer = otherPlayer(state.currentPlayer);
                if (isGameOver(state.board) || !getLegalMoves(state.board, state.currentPlayer).length) {
                    showGameResult();
                    return;
                }
            }

            render();
            if (isTutorialStage() && state.currentPlayer === OPPONENT) {
                runTutorialComputerTurn();
                return;
            }
            if (state.mode === 'story' && state.currentPlayer === OPPONENT) {
                runComputerTurn();
            }
        }

        function runTutorialComputerTurn() {
            const tutorialMove = getCurrentTutorialMove();
            if (!tutorialMove || tutorialMove.player !== OPPONENT) return;
            state.locked = true;
            render();
            window.setTimeout(() => {
                state.locked = false;
                playMove(tutorialMove);
            }, 520);
        }

        function runComputerTurn() {
            state.locked = true;
            render();
            const config = getStageConfig(state.stage);
            window.setTimeout(() => {
                const move = chooseComputerMove(state.board, OPPONENT, config);
                state.locked = false;
                if (move) {
                    playMove(move);
                } else {
                    state.currentPlayer = PLAYER;
                    render();
                }
            }, config.thinkingDelay);
        }

        function showGameResult() {
            const winner = getWinner(state.board);
            const scores = getScores(state.board);
            const isStoryWin = state.mode === 'story' && winner === PLAYER;
            const isFinalStoryWin = isStoryWin && state.stage >= STAGE_COUNT;
            const resultWord = winner === 0 ? 'DRAW' : winner === PLAYER ? 'WIN' : 'LOSE';
            state.elapsedMs = getElapsedMs();
            state.startedAt = 0;
            if (state.timerId) {
                window.clearInterval(state.timerId);
                state.timerId = null;
            }
            state.stageScore = calculateStageScore({
                winner,
                scores,
                elapsedMs: state.elapsedMs,
                clickCount: state.clickCount,
                stage: state.stage,
            });

            dom.resultStatus.textContent = isFinalStoryWin ? 'WIN' : resultWord;
            dom.resultStatus.className = `result-status-badge ${resultWord.toLowerCase()}`;
            dom.resultPlayerIcon.innerHTML = slimeSvg(PLAYER);
            dom.resultOpponentIcon.innerHTML = slimeSvg(OPPONENT);
            dom.resultOpponentName.textContent = state.mode === 'story' ? '컴퓨터' : '분홍이';
            dom.resultPlayerCount.textContent = scores.player;
            dom.resultOpponentCount.textContent = scores.opponent;
            dom.resultScoreValue.textContent = state.stageScore.total.toLocaleString('ko-KR');
            dom.resultTimeValue.textContent = formatElapsedTime(state.elapsedMs);
            dom.resultClickValue.textContent = state.clickCount;
            renderRunStats();
            dom.resultPlayerCard.className = `result-character-card${winner === PLAYER ? ' winner' : ''}${winner === OPPONENT ? ' loser' : ''}`;
            dom.resultOpponentCard.className = `result-character-card${winner === OPPONENT ? ' winner' : ''}${winner === PLAYER ? ' loser' : ''}`;
            dom.resultModal.classList.remove('hidden');
            dom.resultModal.classList.add('flex');

            if (state.mode === 'duel') {
                dom.resultTitle.textContent = winner === 0 ? '사이좋게 비겼어요!' : `${winner === PLAYER ? '파랑이' : '분홍이'} 승리!`;
                dom.resultMessage.textContent = `파랑이 ${scores.player}칸, 분홍이 ${scores.opponent}칸이에요.`;
                dom.resultPrimary.textContent = '한 판 더';
                dom.resultPrimary.onclick = () => hideResultAndStart(state.mode, state.stage);
                return;
            }

            if (isFinalStoryWin) {
                dom.resultTitle.textContent = '20스테이지 모두 성공!';
                dom.resultMessage.textContent = '컬러 슬라임 땅따먹기 왕이 되었어요.';
                dom.resultPrimary.textContent = '처음부터';
                dom.resultPrimary.onclick = () => hideResultAndStart('story', 1);
            } else if (isTutorialStage() && isStoryWin) {
                dom.resultTitle.textContent = '튜토리얼 완료';
                dom.resultMessage.textContent = '이제 2스테이지로 가요.';
                dom.resultPrimary.textContent = '2스테이지 시작';
                dom.resultPrimary.onclick = () => hideResultAndStart('story', 2);
            } else if (isStoryWin) {
                dom.resultTitle.textContent = `${state.stage}스테이지 성공!`;
                dom.resultMessage.textContent = `파랑이 ${scores.player}칸으로 이겼어요. 다음 스테이지로 가요.`;
                dom.resultPrimary.textContent = '다음 스테이지';
                dom.resultPrimary.onclick = () => hideResultAndStart('story', state.stage + 1);
            } else if (winner === 0) {
                dom.resultTitle.textContent = '아깝게 비겼어요!';
                dom.resultMessage.textContent = '조금만 더 넓히면 이길 수 있어요.';
                dom.resultPrimary.textContent = '다시 도전';
                dom.resultPrimary.onclick = () => hideResultAndStart('story', state.stage);
            } else {
                dom.resultTitle.textContent = '괜찮아요, 다시 해봐요!';
                dom.resultMessage.textContent = '가까운 칸 복제를 많이 쓰면 더 쉬워요.';
                dom.resultPrimary.textContent = '다시 도전';
                dom.resultPrimary.onclick = () => hideResultAndStart('story', state.stage);
            }
        }

        function hideResultAndStart(mode, stage) {
            dom.resultModal.classList.add('hidden');
            dom.resultModal.classList.remove('flex');
            startGame(mode, stage);
        }

        dom.startStory.addEventListener('click', () => startGame('story', 1));
        dom.startDuel.addEventListener('click', () => startGame('duel', 1));
        dom.howtoButton.addEventListener('click', () => dom.infoModal.classList.remove('hidden'));
        document.querySelectorAll('.btn-close-modal').forEach((button) => {
            button.addEventListener('click', () => dom.infoModal.classList.add('hidden'));
        });
        dom.infoModal.addEventListener('click', (event) => {
            if (event.target === dom.infoModal) dom.infoModal.classList.add('hidden');
        });
        dom.gnbRestart.addEventListener('click', () => openConfirmModal({
            title: '다시 시작할까요?',
            message: '현재 진행 상황을 멈추고 처음부터 다시 시작해요.',
            okText: '다시 시작',
            onConfirm: restartCurrentView,
        }));
        dom.gnbExit.addEventListener('click', () => openConfirmModal({
            title: '학습을 종료할까요?',
            message: '확인을 누르면 이전 페이지로 이동해요.',
            okText: '학습 종료',
            onConfirm: () => history.back(),
        }));
        dom.confirmCancel.addEventListener('click', closeConfirmModal);
        dom.confirmModal.addEventListener('click', (event) => {
            if (event.target === dom.confirmModal) closeConfirmModal();
        });
        dom.confirmOk.addEventListener('click', () => {
            const action = pendingConfirmAction;
            closeConfirmModal();
            if (action) action();
        });

        dom.introPlayerSlime.innerHTML = slimeSvg(PLAYER);
        dom.introOpponentSlime.innerHTML = slimeSvg(OPPONENT);
        render();
    </script>
    <script src="../../js/web-learning-game-shell.js" defer></script>

    <script src="../../js/web-learning-play-tracker.js?v=20260616-03" defer></script>
    <script src="../../js/web-learning-ranking.js?v=20260618-03" defer></script>
</body>

</html>
