<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>6색 공부하기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* [Core Reset & Safe Area] */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        :root {
            --gnb-height: 8vh;
            --app-bg: #f0f9ff;
        }

        body {
            font-family: 'Jua', sans-serif;
            background-color: var(--app-bg);
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            height: 100vh;
            width: 100vw;
        }

        /* [GNB Styles] */
        #gnb {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: var(--gnb-height);
            background-color: #FEE500;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4vw;
            box-shadow: 0 0.5vh 1vh rgba(0, 0, 0, 0.1);
        }

        /* [Game Container & Scaling] */
        #game-container {
            position: absolute;
            top: var(--gnb-height);
            left: 0;
            width: 100vw;
            height: calc(100vh - var(--gnb-height));
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: var(--app-bg);
            box-sizing: border-box;
        }

        #scalable-wrapper {
            width: 100vw;
            height: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        /* [Tablet Horizontal Optimization & VH/VW Constraints] */
        @media (min-width: 1024px) {

            #colors-container,
            #quiz-options {
                display: block !important;
                position: relative;
                width: 80vw !important;
                height: 60vh !important;
                max-width: none !important;
                margin: 0 auto;
            }

            .color-card {
                position: absolute !important;
                width: 24vw !important;
                height: 26vh !important;
                margin: 0 !important;
                transform-origin: center;
            }

            /* Row 1 */
            #colors-container>div:nth-child(1),
            #quiz-options>div:nth-child(1) {
                top: 5%;
                left: 0%;
                transform: none;
            }

            #colors-container>div:nth-child(2),
            #quiz-options>div:nth-child(2) {
                top: 5%;
                left: 50%;
                transform: translateX(-50%);
            }

            #colors-container>div:nth-child(3),
            #quiz-options>div:nth-child(3) {
                top: 5%;
                left: auto;
                right: 0%;
                transform: none;
            }

            /* Row 2 */
            #colors-container>div:nth-child(4),
            #quiz-options>div:nth-child(4) {
                top: 55%;
                left: 0%;
                transform: none;
            }

            #colors-container>div:nth-child(5),
            #quiz-options>div:nth-child(5) {
                top: 55%;
                left: 50%;
                transform: translateX(-50%);
            }

            #colors-container>div:nth-child(6),
            #quiz-options>div:nth-child(6) {
                top: 55%;
                left: auto;
                right: 0%;
                transform: none;
            }

            #colors-container>div:active,
            #quiz-options>div:active {
                transform: scale(0.95) !important;
            }

            #colors-container>div:nth-child(2):active,
            #quiz-options>div:nth-child(2):active,
            #colors-container>div:nth-child(5):active,
            #quiz-options>div:nth-child(5):active {
                transform: translateX(-50%) scale(0.95) !important;
            }
        }

        /* Mobile fallback responsive sizing */
        .text-7xl {
            font-size: 8vh !important;
        }

        .text-6xl {
            font-size: 7vh !important;
        }

        .text-4xl {
            font-size: 4vh !important;
        }

        .text-3xl {
            font-size: 3vh !important;
        }

        .text-2xl {
            font-size: 2.5vh !important;
        }

        .w-32 {
            width: 15vw !important;
        }

        .h-32 {
            height: 15vw !important;
            max-height: 20vh;
        }

        /* [Animations] */
        .bounce {
            animation: bounce 2s infinite;
        }

        @keyframes bounce {

            0%,
            20%,
            50%,
            80%,
            100% {
                transform: translateY(0);
            }

            40% {
                transform: translateY(-1.5vmin);
            }

            60% {
                transform: translateY(-0.75vmin);
            }
        }

        .shake {
            animation: shake 0.5s;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25%,
            75% {
                transform: translateX(-1vmin);
            }

            50% {
                transform: translateX(1vmin);
            }
        }

        .btn-press {
            transition: transform 0.1s;
        }

        .btn-press:active {
            transform: scale(0.95);
        }

        .modal-enter {
            animation: modalFadeIn 0.3s forwards;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* [Typography] */
        .text-scale-title {
            font-size: 5rem;
        }

        .text-scale-lg {
            font-size: 3rem;
        }

        .text-scale-md {
            font-size: 2rem;
        }

        .text-scale-sm {
            font-size: 1.5rem;
        }

        /* [Color Card Styles] */
        .color-card {
            transition: transform 0.1s ease-out, box-shadow 0.2s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .color-card:active {
            transform: scale(0.95);
        }

        /* Confetti */
        #confetti {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

    <!-- [1. GNB] -->
    <nav id="gnb">
        <div class="flex items-center gap-2">
            <h1
                class="text-xl md:text-2xl font-bold text-gray-800 whitespace-nowrap overflow-hidden text-ellipsis max-w-[50vw]">
                🎨 <span data-i18n="appTitle">6색 공부하기</span>
            </h1>
        </div>
        <div class="flex gap-2">
            <button id="btn-lang"
                class="bg-white border-2 border-gray-200 rounded-full px-4 py-1 text-sm font-bold shadow-sm hover:bg-gray-50 btn-press"
                data-i18n="langBtn">English</button>
            <button id="btn-restart"
                class="hidden bg-indigo-500 text-white rounded-full px-4 py-1 text-sm font-bold shadow-sm hover:bg-indigo-600 btn-press"
                data-i18n="restart">다시하기</button>
            <button id="btn-exit"
                class="bg-gray-600 text-white rounded-full px-4 py-1 text-sm font-bold shadow-sm hover:bg-gray-700 btn-press"
                data-i18n="exit">종료</button>
        </div>
    </nav>

    <!-- [2. Game Container] -->
    <div id="game-container">
        <div id="scalable-wrapper">

            <canvas id="confetti"></canvas>

            <!-- A. Intro Screen -->
            <div id="intro-screen" class="w-full h-full flex flex-col items-center justify-center z-20">
                <i data-lucide="palette" class="w-32 h-32 text-indigo-500 mb-6 bounce"></i>
                <h1 class="text-7xl font-bold text-indigo-600 drop-shadow-lg mb-4" data-i18n="appTitle">6색 공부하기</h1>
                <p class="text-2xl text-gray-500 mb-12" data-i18n="introDesc">6가지 색상을 배워봐요!</p>
                <div class="flex gap-4">
                    <button id="btn-howto"
                        class="bg-yellow-400 hover:bg-yellow-500 text-white text-3xl px-8 py-4 rounded-3xl shadow-lg btn-press flex items-center gap-2">
                        <i data-lucide="help-circle" class="w-8 h-8"></i>
                        <span data-i18n="howToPlay">설명 보기</span>
                    </button>
                    <button id="btn-start"
                        class="bg-indigo-500 hover:bg-indigo-600 text-white text-3xl px-12 py-4 rounded-3xl shadow-lg btn-press flex items-center gap-2">
                        <i data-lucide="play" class="w-8 h-8"></i>
                        <span data-i18n="start">시작하기</span>
                    </button>
                </div>
            </div>

            <!-- B. Main Game Content -->
            <main id="app-content"
                class="hidden w-[90%] h-[90%] bg-white rounded-3xl shadow-2xl p-6 flex flex-col relative border-b-8 border-gray-200">

                <div id="progress-container"
                    class="hidden w-full bg-gray-100 rounded-full h-4 mb-4 shrink-0 overflow-hidden">
                    <div id="progress-bar" class="bg-indigo-500 h-full rounded-full transition-all duration-500"
                        style="width: 0%"></div>
                </div>

                <!-- Learning Section -->
                <div id="learning-section" class="flex flex-col items-center w-full h-full">
                    <div class="text-center mb-4 shrink-0 h-16 flex items-center justify-center">
                        <h2 id="instruction-text" class="text-4xl text-gray-600 transition-all duration-300 font-bold"
                            data-i18n="instructionInit">
                            모든 색깔을 한 번씩 눌러보세요!</h2>
                    </div>

                    <div class="flex-grow w-full flex items-center justify-center pb-4 px-4">
                        <div id="colors-container"
                            class="grid grid-cols-2 grid-rows-3 md:grid-cols-3 md:grid-rows-2 gap-4 w-full h-full max-w-[900px]">
                            <!-- Cards injected by JS -->
                        </div>
                    </div>

                    <div class="mt-2 w-full flex justify-center h-20">
                        <button id="quiz-btn" disabled
                            class="bg-gray-300 text-white text-3xl px-8 py-3 rounded-2xl shadow-sm flex items-center gap-3 transition-all duration-300 cursor-not-allowed">
                            <span data-i18n="quizLocked">퀴즈 잠김</span> <i data-lucide="lock" class="w-8 h-8"></i>
                        </button>
                    </div>
                </div>

                <!-- Quiz Section -->
                <div id="quiz-section" class="hidden flex-col items-center w-full h-full justify-center">
                    <div class="text-center mb-4 shrink-0 h-32 flex flex-col justify-center items-center">
                        <div id="quiz-question-text"
                            class="text-6xl text-gray-800 mb-2 animate-pulse font-bold leading-tight"></div>
                    </div>

                    <div class="flex-grow w-full flex items-center justify-center pb-8 px-4">
                        <div id="quiz-options"
                            class="grid grid-cols-2 grid-rows-3 md:grid-cols-3 md:grid-rows-2 gap-4 w-full h-full max-w-[900px]">
                            <!-- Quiz Cards injected by JS -->
                        </div>
                    </div>

                    <div id="feedback-message"
                        class="h-16 text-4xl font-bold text-center transition-opacity duration-300 opacity-0 shrink-0">
                    </div>
                </div>

                <!-- End Section -->
                <div id="end-section" class="hidden flex-col items-center justify-center w-full h-full text-center">
                    <i data-lucide="trophy" class="w-32 h-32 text-yellow-400 mb-6 bounce"></i>
                    <h2 class="text-6xl text-gray-800 mb-2 font-bold" data-i18n="greatJob">멋져요!</h2>
                    <p class="text-3xl text-gray-500 mb-12" data-i18n="allLearned">모든 색깔을 배웠어요!</p>
                    <button id="btn-restart-inner"
                        class="bg-indigo-500 hover:bg-indigo-600 text-white text-3xl px-10 py-4 rounded-2xl shadow-md transform transition flex items-center gap-3">
                        <i data-lucide="rotate-ccw" class="w-8 h-8"></i> <span data-i18n="restart">다시하기</span>
                    </button>
                </div>
            </main>

        </div>
    </div>

    <!-- [3. Modals] -->

    <!-- Info Modal -->
    <div id="modal-info" class="hidden fixed inset-0 bg-black/50 z-[20000] flex items-center justify-center p-4">
        <div
            class="bg-white rounded-3xl p-6 w-[80%] max-w-md shadow-2xl relative modal-enter border-4 border-indigo-100">
            <button class="btn-close-modal absolute top-4 right-4 text-gray-400 hover:text-gray-600">
                <i data-lucide="x-circle" class="w-8 h-8"></i>
            </button>
            <h3 class="text-2xl font-bold text-indigo-600 mb-4 flex items-center gap-2">
                <i data-lucide="info" class="w-6 h-6"></i> <span data-i18n="howToPlay">설명 보기</span>
            </h3>
            <ul class="space-y-3 text-lg text-gray-700">
                <li class="flex items-start gap-2">
                    <span class="bg-red-100 p-2 rounded-full text-red-500"><i data-lucide="mouse-pointer"
                            class="w-5 h-5"></i></span>
                    <div><strong data-i18n="guide1Title">모든 색깔 누르기</strong><br>
                        <span class="text-base text-gray-500" data-i18n="guide1Desc">모든 색깔을 한 번씩 눌러보세요!</span>
                    </div>
                </li>
                <li class="flex items-start gap-2">
                    <span class="bg-green-100 p-2 rounded-full text-green-500"><i data-lucide="check-circle-2"
                            class="w-5 h-5"></i></span>
                    <div><strong data-i18n="guide2Title">퀴즈 풀기</strong><br>
                        <span class="text-base text-gray-500" data-i18n="guide2Desc">글자를 보고 정답을 찾아보세요.</span>
                    </div>
                </li>
            </ul>
            <div class="mt-6 text-center">
                <button
                    class="btn-close-modal bg-indigo-500 hover:bg-indigo-600 text-white text-lg px-6 py-2 rounded-full shadow-md transition"
                    data-i18n="ok">
                    알겠어요!
                </button>
            </div>
        </div>
    </div>

    <!-- Exit Confirm Modal -->
    <div id="modal-exit" class="hidden fixed inset-0 bg-black/50 z-[20000] flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 w-[80%] max-w-lg shadow-2xl relative modal-enter text-center">
            <h3 class="text-3xl font-bold text-gray-800 mb-4" data-i18n="exitConfirm">정말 종료할까요?</h3>
            <p class="text-xl text-gray-500 mb-8" data-i18n="exitDesc">진행 상황이 저장되지 않아요.</p>
            <div class="flex justify-center gap-4">
                <button id="btn-cancel-exit"
                    class="bg-gray-200 text-gray-700 text-xl px-6 py-3 rounded-full hover:bg-gray-300"
                    data-i18n="cancel">아니요</button>
                <button id="btn-confirm-exit"
                    class="bg-red-500 text-white text-xl px-6 py-3 rounded-full hover:bg-red-600" data-i18n="yes">네,
                    종료해요</button>
            </div>
        </div>
    </div>

    <!-- Restart Confirm Modal -->
    <div id="modal-restart" class="hidden fixed inset-0 bg-black/50 z-[20000] flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 w-[80%] max-w-lg shadow-2xl relative modal-enter text-center">
            <h3 class="text-3xl font-bold text-gray-800 mb-4" data-i18n="restartConfirm">다시 시작할까요?</h3>
            <p class="text-xl text-gray-500 mb-8" data-i18n="restartDesc">처음부터 다시 시작합니다.</p>
            <div class="flex justify-center gap-4">
                <button id="btn-cancel-restart"
                    class="bg-gray-200 text-gray-700 text-xl px-6 py-3 rounded-full hover:bg-gray-300"
                    data-i18n="cancel">아니요</button>
                <button id="btn-confirm-restart"
                    class="bg-indigo-500 text-white text-xl px-6 py-3 rounded-full hover:bg-indigo-600"
                    data-i18n="yesRestart">네, 다시 시작해요</button>
            </div>
        </div>
    </div>

    <script>
        // --- [1. Configuration & Data] ---
        const GOOGLE_API_KEY = "AIzaSyAE0nnpOYZRfLkfM09O3NQjpWnN1kUqR3E";

        const I18N_DATA = {
            ko: {
                langBtn: "English",
                appTitle: "6색 공부하기",
                introDesc: "6가지 색상을 배워봐요!",
                howToPlay: "설명 보기",
                start: "시작하기",
                restart: "다시하기",
                exit: "종료",
                quizLocked: "퀴즈 잠김",
                quizStart: "퀴즈 시작하기",
                instructionInit: "모든 색깔을 한 번씩 눌러보세요!",
                readyQuiz: "준비 완료! 퀴즈를 풀어보세요.",
                guide1Title: "모든 색깔 누르기",
                guide1Desc: "모든 색깔을 한 번씩 눌러보세요!",
                guide2Title: "퀴즈 풀기",
                guide2Desc: "글자를 보고 정답을 찾아보세요.",
                ok: "알겠어요!",
                greatJob: "멋져요!",
                allLearned: "모든 색깔을 배웠어요!",
                exitConfirm: "정말 종료할까요?",
                exitDesc: "진행 상황이 저장되지 않아요.",
                restartConfirm: "다시 시작할까요?",
                restartDesc: "처음부터 다시 시작합니다.",
                yes: "네, 종료해요",
                yesRestart: "네, 다시 시작해요",
                cancel: "아니요",
                findColor: "{color}색을 찾아보세요!",
                correct: "정답이에요!",
                wrong: "다시 찾아보세요!",
                guideText: "먼저 모든 색깔을 눌러서 공부해요. 그다음 퀴즈를 시작해서 색깔을 찾아보세요!"
            },
            en: {
                langBtn: "한국어",
                appTitle: "Learn 6 Colors",
                introDesc: "Let's learn six colors!",
                howToPlay: "How to Play",
                start: "Start",
                restart: "Restart",
                exit: "Exit",
                quizLocked: "Quiz Locked",
                quizStart: "Start Quiz",
                instructionInit: "Tap all colors!",
                readyQuiz: "Ready! Start the quiz.",
                guide1Title: "Tap All Colors",
                guide1Desc: "Tap each color to learn!",
                guide2Title: "Solve Quiz",
                guide2Desc: "Find the correct color!",
                ok: "Got it!",
                greatJob: "Great Job!",
                allLearned: "You learned all colors!",
                exitConfirm: "Really Exit?",
                exitDesc: "Progress will not be saved.",
                restartConfirm: "Restart?",
                restartDesc: "Start from the beginning.",
                yes: "Yes, Exit",
                yesRestart: "Yes, Restart",
                cancel: "No",
                findColor: "Find {color}!",
                correct: "Correct!",
                wrong: "Try again!",
                guideText: "First, tap all colors to learn. Then, start the quiz to find colors!"
            }
        };

        const COLORS_DATA = [
            { id: 'red', name: '빨강', eng: 'Red', hex: '#FF4D4D' },
            { id: 'yellow', name: '노랑', eng: 'Yellow', hex: '#FFD700' },
            { id: 'blue', name: '파랑', eng: 'Blue', hex: '#3B82F6' },
            { id: 'orange', name: '주황', eng: 'Orange', hex: '#FFA500' },
            { id: 'purple', name: '보라', eng: 'Purple', hex: '#9333EA' },
            { id: 'green', name: '초록', eng: 'Green', hex: '#22C55E' }
        ];

        // --- [2. Global State] ---
        let currentLang = 'ko';
        let ttsAudio = null;
        let playedColors = new Set();
        let isQuizMode = false;
        let quizQueue = [];
        let currentQuizIndex = 0;
        let confettiReqId = null;
        let googleTTSAvailable = true;

        // --- [Voice Loader] ---
        let availableVoices = [];
        function loadVoices() {
            availableVoices = window.speechSynthesis.getVoices();
        }
        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices();

        // --- [3. System Functions (TTS)] ---

        function stopTTS() {
            if (ttsAudio) {
                ttsAudio.pause();
                ttsAudio.currentTime = 0;
                ttsAudio = null;
            }
            window.speechSynthesis.cancel();
        }

        async function speak(keyOrText, isRaw = false) {
            stopTTS();

            const text = isRaw ? keyOrText : (I18N_DATA[currentLang][keyOrText] || keyOrText);
            if (!text) return;

            if (!googleTTSAvailable) {
                fallbackSpeak(text);
                return;
            }

            const langCode = currentLang === 'ko' ? 'ko-KR' : 'en-US';
            const voiceName = currentLang === 'ko' ? 'ko-KR-Standard-A' : 'en-US-Standard-E';

            try {
                const response = await fetch(`https://texttospeech.googleapis.com/v1/text:synthesize?key=${GOOGLE_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        input: { text: text },
                        voice: { languageCode: langCode, name: voiceName },
                        audioConfig: { audioEncoding: 'MP3' }
                    })
                });

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }

                const data = await response.json();
                if (data.audioContent) {
                    const audioBlob = await fetch(`data:audio/mp3;base64,${data.audioContent}`).then(res => res.blob());
                    const audioUrl = URL.createObjectURL(audioBlob);
                    ttsAudio = new Audio(audioUrl);
                    ttsAudio.play().catch(e => console.error("Audio Playback Error:", e));
                } else {
                    console.warn("Google TTS Error/Fallback: No content", data);
                    fallbackSpeak(text);
                }
            } catch (e) {
                console.warn("Google TTS failed (switching to offline mode):", e);
                googleTTSAvailable = false;
                fallbackSpeak(text);
            }
        }

        function fallbackSpeak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            const isEnglish = currentLang !== 'ko';
            utterance.lang = isEnglish ? 'en-US' : 'ko-KR';
            utterance.rate = 0.9;

            if (availableVoices.length === 0) {
                availableVoices = window.speechSynthesis.getVoices();
            }

            if (isEnglish) {
                const targetVoices = ["Google US English", "Samantha", "Microsoft Zira", "Karen", "Tessa"];
                let selectedVoice = availableVoices.find(v => targetVoices.some(target => v.name.includes(target)));
                if (!selectedVoice) {
                    selectedVoice = availableVoices.find(v => v.lang === 'en-US');
                }
                if (selectedVoice) {
                    utterance.voice = selectedVoice;
                }
            } else {
                const koVoice = availableVoices.find(v => v.name.includes('Google 한국어') || v.lang === 'ko-KR');
                if (koVoice) utterance.voice = koVoice;
            }

            window.speechSynthesis.speak(utterance);
        }

        // --- [4. Logic & Game Functions] ---

        function getColorName(id) {
            const color = COLORS_DATA.find(c => c.id === id);
            return currentLang === 'ko' ? color.name : color.eng;
        }

        function createColorCards(container, isQuiz = false) {
            container.innerHTML = '';
            COLORS_DATA.forEach(color => {
                const card = document.createElement('div');
                card.id = `color-${color.id}${isQuiz ? '-quiz' : ''}`;
                card.className = 'color-card rounded-[2vmin] p-[0.5vmin] shadow border border-transparent hover:border-blue-200 relative bg-white';

                const isLearned = !isQuiz && playedColors.has(color.id);
                const checkHTML = !isQuiz ?
                    `<div class="absolute top-[1vmin] right-[1vmin] ${isLearned ? 'bounce' : 'opacity-0'} transition-opacity duration-300 check-icon">
                        <i data-lucide="check-circle" class="w-[3vmin] h-[3vmin] text-green-500 fill-green-100"></i>
                     </div>` : '';

                card.innerHTML = `
                    ${checkHTML}
                    <div class="h-[55%] aspect-square rounded-full shadow-inner mb-[0.5vmin]" style="background-color: ${color.hex};"></div>
                    <div class="text-2xl font-bold text-gray-800 leading-tight">${color.name}</div>
                    <div class="text-lg text-gray-400 font-bold uppercase tracking-wider leading-tight">${color.eng}</div>
                `;

                card.onclick = () => {
                    if (isQuiz) {
                        checkQuizAnswer(color, card);
                    } else {
                        const text = currentLang === 'ko' ? color.name : color.eng;
                        speak(text, true);
                        card.style.transform = "scale(1.05)";
                        setTimeout(() => { card.style.transform = "scale(1)"; }, 200);

                        if (!playedColors.has(color.id)) {
                            playedColors.add(color.id);
                            const icon = card.querySelector('.check-icon');
                            if (icon) {
                                icon.classList.remove('opacity-0');
                                icon.classList.add('bounce');
                            }
                            updateLearningProgress();
                        }
                    }
                };
                container.appendChild(card);
            });
            lucide.createIcons();
        }

        function updateLearningProgress() {
            const current = playedColors.size;
            const total = COLORS_DATA.length;
            const instruction = document.getElementById('instruction-text');
            const quizBtn = document.getElementById('quiz-btn');

            if (current === total) {
                instruction.innerText = I18N_DATA[currentLang].readyQuiz;
                quizBtn.disabled = false;
                quizBtn.classList.remove('bg-gray-300', 'cursor-not-allowed');
                quizBtn.classList.add('bg-green-500', 'hover:bg-green-600', 'bounce');
                quizBtn.innerHTML = `<span>${I18N_DATA[currentLang].quizStart}</span> <i data-lucide="play-circle" class="w-8 h-8"></i>`;
                lucide.createIcons();
                speak('readyQuiz');
            }
        }

        function startQuiz() {
            stopTTS();
            isQuizMode = true;
            document.getElementById('learning-section').classList.add('hidden');
            document.getElementById('quiz-section').classList.remove('hidden');
            document.getElementById('quiz-section').classList.add('flex');
            document.getElementById('progress-container').classList.remove('hidden');

            quizQueue = [...COLORS_DATA].sort(() => Math.random() - 0.5);
            currentQuizIndex = 0;

            updateProgressBar();
            loadNextQuestion();
        }

        function loadNextQuestion() {
            if (currentQuizIndex >= quizQueue.length) {
                showEndScreen();
                return;
            }

            const feedback = document.getElementById('feedback-message');
            feedback.style.opacity = '0';

            createColorCards(document.getElementById('quiz-options'), true);

            const target = quizQueue[currentQuizIndex];
            const colorName = getColorName(target.id);
            const questionEl = document.getElementById('quiz-question-text');

            const rawText = I18N_DATA[currentLang].findColor.replace('{color}', colorName);
            questionEl.innerHTML = rawText.replace(colorName, `<span style="color:${target.hex}">${colorName}</span>`);

            speak(rawText, true);
        }

        function checkQuizAnswer(selected, element) {
            const target = quizQueue[currentQuizIndex];
            const feedback = document.getElementById('feedback-message');

            if (selected.id === target.id) {
                playSFX('correct');
                feedback.innerText = I18N_DATA[currentLang].correct;
                feedback.className = "h-16 text-4xl font-bold text-center text-green-500 transition-opacity duration-300 opacity-100 shrink-0";
                fireConfettiBurst();

                const colorName = currentLang === 'ko' ? (target.name + "색") : target.eng;
                speak(colorName + '!', true);

                setTimeout(() => {
                    currentQuizIndex++;
                    updateProgressBar();
                    loadNextQuestion();
                }, 2500);
            } else {
                playSFX('wrong');
                element.classList.add('shake');
                setTimeout(() => element.classList.remove('shake'), 500);

                feedback.innerText = I18N_DATA[currentLang].wrong;
                feedback.className = "h-16 text-4xl font-bold text-center text-orange-500 transition-opacity duration-300 opacity-100 shrink-0";
                speak('wrong');
            }
        }

        function updateProgressBar() {
            const pct = (currentQuizIndex / quizQueue.length) * 100;
            document.getElementById('progress-bar').style.width = `${pct}%`;
        }

        function showEndScreen() {
            stopTTS();
            document.getElementById('quiz-section').classList.add('hidden');
            document.getElementById('quiz-section').classList.remove('flex');
            document.getElementById('progress-container').classList.add('hidden');
            document.getElementById('end-section').classList.remove('hidden');
            document.getElementById('end-section').classList.add('flex');

            playSFX('victory');
            startConfettiLoop();
            setTimeout(stopConfettiLoop, 3000);

            speak('greatJob');
        }

        function resetGame() {
            stopTTS();
            playedColors.clear();
            isQuizMode = false;

            document.getElementById('intro-screen').classList.remove('hidden');
            document.getElementById('app-content').classList.add('hidden');
            document.getElementById('quiz-section').classList.add('hidden');
            document.getElementById('quiz-section').classList.remove('flex');
            document.getElementById('end-section').classList.add('hidden');
            document.getElementById('end-section').classList.remove('flex');
            document.getElementById('progress-container').classList.add('hidden');
            document.getElementById('learning-section').classList.remove('hidden');
            document.getElementById('btn-restart').classList.add('hidden');

            const quizBtn = document.getElementById('quiz-btn');
            quizBtn.disabled = true;
            quizBtn.classList.add('bg-gray-300', 'cursor-not-allowed');
            quizBtn.classList.remove('bg-green-500', 'hover:bg-green-600', 'bounce');
            quizBtn.innerHTML = `<span>${I18N_DATA[currentLang].quizLocked}</span> <i data-lucide="lock" class="w-8 h-8"></i>`;

            document.getElementById('instruction-text').innerText = I18N_DATA[currentLang].instructionInit;

            stopConfettiLoop();
            lucide.createIcons();
        }

        // --- [5. UI & Event Listeners] ---

        function updateTexts() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (I18N_DATA[currentLang][key]) {
                    el.innerText = I18N_DATA[currentLang][key];
                }
            });
            if (!isQuizMode) {
                createColorCards(document.getElementById('colors-container'), false);
                updateLearningProgress();
            }
        }

        function resizeGame() {
            // Replaced logic with pure CSS and vw/vh layout
            const canvas = document.getElementById("confetti");
            if (canvas) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
        }

        window.addEventListener('resize', resizeGame);

        document.getElementById('btn-lang').onclick = () => {
            currentLang = currentLang === 'ko' ? 'en' : 'ko';
            updateTexts();
            speak(currentLang === 'ko' ? '한국어' : 'English', true);
        };

        document.getElementById('btn-start').onclick = () => {
            stopTTS();
            document.getElementById('intro-screen').classList.add('hidden');
            document.getElementById('app-content').classList.remove('hidden');
            document.getElementById('app-content').classList.add('flex');
            document.getElementById('btn-restart').classList.remove('hidden');

            createColorCards(document.getElementById('colors-container'), false);
            speak('instructionInit');
        };

        document.getElementById('quiz-btn').onclick = startQuiz;

        document.getElementById('btn-restart').onclick = () => {
            stopTTS();
            document.getElementById('modal-restart').classList.remove('hidden');
            speak('restartConfirm');
        };

        document.getElementById('btn-restart-inner').onclick = () => {
            stopTTS();
            document.getElementById('modal-restart').classList.remove('hidden');
            speak('restartConfirm');
        };

        const infoModal = document.getElementById('modal-info');
        const exitModal = document.getElementById('modal-exit');
        const restartModal = document.getElementById('modal-restart');

        document.getElementById('btn-howto').onclick = () => {
            stopTTS();
            infoModal.classList.remove('hidden');
            speak('guideText');
        };

        document.querySelectorAll('.btn-close-modal').forEach(btn => {
            btn.onclick = () => {
                stopTTS();
                infoModal.classList.add('hidden');
            };
        });

        document.getElementById('btn-exit').onclick = () => {
            stopTTS();
            exitModal.classList.remove('hidden');
            speak('exitConfirm');
        };

        document.getElementById('btn-cancel-exit').onclick = () => {
            stopTTS();
            exitModal.classList.add('hidden');
        };

        document.getElementById('btn-confirm-exit').onclick = () => {
            stopTTS();
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.close();
            }
        };

        document.getElementById('btn-cancel-restart').onclick = () => {
            stopTTS();
            restartModal.classList.add('hidden');
        };

        document.getElementById('btn-confirm-restart').onclick = () => {
            stopTTS();
            restartModal.classList.add('hidden');
            resetGame();
        };

        // --- [6. SFX Functions] ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playSFX(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(660, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                osc.start();
                osc.stop(now + 0.5);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(100, now + 0.3);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                osc.start();
                osc.stop(now + 0.3);
            } else if (type === 'victory') {
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.type = 'triangle';
                    o.frequency.value = freq;
                    g.gain.setValueAtTime(0, now + i * 0.1);
                    g.gain.linearRampToValueAtTime(0.2, now + i * 0.1 + 0.05);
                    g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.5);
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.start(now + i * 0.1);
                    o.stop(now + i * 0.1 + 0.6);
                });
            }
        }

        // --- [7. Confetti Engine] ---
        const canvas = document.getElementById("confetti");
        const ctx = canvas.getContext("2d");
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function fireConfettiBurst() {
            const colors = ['#FF4D4D', '#FFD700', '#3B82F6', '#22C55E', '#9333EA', '#FFA500'];
            for (let i = 0; i < 30; i++) {
                particles.push({
                    x: window.innerWidth / 2,
                    y: window.innerHeight / 2,
                    w: Math.random() * 10 + 5,
                    h: Math.random() * 10 + 5,
                    dx: (Math.random() - 0.5) * 20,
                    dy: (Math.random() - 0.5) * 20,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    life: 100
                });
            }
            if (!confettiReqId) animateConfetti();
        }

        function startConfettiLoop() {
            const colors = ['#FF4D4D', '#FFD700', '#3B82F6', '#22C55E', '#9333EA', '#FFA500'];
            const interval = setInterval(() => {
                if (document.getElementById('end-section').classList.contains('hidden')) {
                    clearInterval(interval);
                    return;
                }
                for (let i = 0; i < 5; i++) {
                    particles.push({
                        x: Math.random() * window.innerWidth,
                        y: -20,
                        w: Math.random() * 10 + 5,
                        h: Math.random() * 10 + 5,
                        dx: (Math.random() - 0.5) * 5,
                        dy: Math.random() * 5 + 5,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        life: 150
                    });
                }
            }, 100);
            if (!confettiReqId) animateConfetti();
        }

        function stopConfettiLoop() {
            particles = [];
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (confettiReqId) {
                cancelAnimationFrame(confettiReqId);
                confettiReqId = null;
            }
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (particles.length === 0) {
                confettiReqId = null;
                return;
            }

            particles.forEach((p, index) => {
                p.x += p.dx;
                p.y += p.dy;
                p.dy += 0.2;
                p.life--;

                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.w, p.h);

                if (p.life <= 0) particles.splice(index, 1);
            });

            confettiReqId = requestAnimationFrame(animateConfetti);
        }

        // --- [8. Init] ---
        resizeCanvas();
        resizeGame();
        lucide.createIcons();
    </script>
