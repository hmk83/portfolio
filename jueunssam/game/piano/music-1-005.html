<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>재미있는 악기 놀이 친구들</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* [Core Reset & Safe Area] */
        :root {
            --gnb-height: 60px;
            --app-bg: linear-gradient(135deg, #FFF1EB 0%, #ACE0F9 100%);
        }

        body {
            font-family: 'Jua', sans-serif;
            background: var(--app-bg);
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            height: 100vh;
            width: 100vw;
        }

        /* Force Single Line Text on All Buttons */
        button {
            white-space: nowrap !important;
        }

        /* [GNB Styles] */
        #gnb {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--gnb-height);
            background-color: #FEE500;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* [Game Container & Scaling] */
        #game-container {
            position: absolute;
            top: var(--gnb-height);
            left: 0;
            width: 100%;
            height: calc(100vh - var(--gnb-height));
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #scalable-wrapper {
            width: 1280px;
            height: 720px;
            position: relative;
            transform-origin: center center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* --- Animations --- */
        .bounce-slow {
            animation: bounce-slow 2s infinite;
        }

        .sway {
            animation: sway 3s infinite ease-in-out;
        }

        .modal-fade {
            animation: fadeIn 0.3s ease-out;
        }

        .pop-in {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes bounce-slow {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes sway {

            0%,
            100% {
                transform: rotate(-3deg);
            }

            50% {
                transform: rotate(3deg);
            }
        }

        .sound-wave {
            animation: wave 1s infinite linear;
        }

        @keyframes wave {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }

        /* Instrument Card */
        .instrument-card {
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .instrument-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }

        .instrument-card:active {
            transform: scale(0.95);
        }

        .nav-btn {
            transition: transform 0.1s;
        }

        .nav-btn:active {
            transform: scale(0.9);
        }

        /* Scrollbar hide */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body>

    <!-- [1. GNB] -->
    <nav id="gnb">
        <div class="flex items-center gap-2">
            <h1

        </div>
        <div class="flex gap-2">

    </nav>

    <!-- [2. Game Container] -->

                <div class="bg-blue-100 p-8 rounded-full mb-8 sway border-8 border-blue-200 inline-block">
                    <i data-lucide="music" class="w-32 h-32 text-blue-500"></i>
                </div>

                    </button>
                </div>
            </div>

            <!-- B. Main Instrument Grid -->
            <div id="main-content" class="w-full h-full hidden flex-col p-6">

                <header class="flex items-center justify-between mb-4 shrink-0">

                    </div>
                    <button onclick="toggleHelp()"

                    </button>
                </header>

                <!-- Grid -->
                <div id="instrument-grid" class="grid grid-cols-5 gap-4 h-full pb-4">
                    <!-- Cards injected by JS -->
                </div>
            </div>

            <!-- C. Detail Modal (Inside Scalable Wrapper) -->

                        </div>

                    </div>

        </div>
    </div>

            class="bg-white rounded-3xl p-8 w-[70%] max-w-md shadow-2xl relative modal-fade border-[0.5vmin] border-red-200 text-center">

            <div class="flex justify-center gap-4">
                <button onclick="confirmRestart()"

                    data-i18n="cancel">아니요</button>
            </div>
        </div>
    </div>

                gridTitle: "악기 친구들을 눌러보세요!",
                btnPlaySound: "연주 듣기",
                btnReadDesc: "설명 듣기",
                help1: "마음에 드는 악기 카드를 눌러보세요.",
                help2: "연주 듣기 버튼으로 소리를 들어봐요.",
                help3: "설명 듣기 버튼으로 이야기를 들어요.",
                ok: "알겠어요!",
                restart: "다시하기", exit: "종료",
                restartConfirm: "처음부터 다시 할까요?", restartDesc: "인트로 화면으로 돌아가요.",
                exitConfirm: "정말 종료할까요?", exitDesc: "게임 진행 상황이 저장되지 않아요.",
                yes: "네", cancel: "아니요"
            }
        };

        // --- [2. Global State] ---
        let currentLang = 'ko';
        let currentAudio = null;
        let ttsAudio = null;
        let confettiReqId = null;
        let currentInstrument = null;

        // --- [New: Voice Loader & State] ---
        let availableVoices = [];
        let currentUtterance = null; // 가비지 컬렉션 방지

        function loadVoices() {
            availableVoices = window.speechSynthesis.getVoices();
        }
        if (window.speechSynthesis.onvoiceschanged !== undefined) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
        }
        loadVoices();

        // --- [3. System Functions: TTS & Audio] ---

        function stopAudio() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;
            }
            if (ttsAudio) {
                ttsAudio.pause();
                ttsAudio.currentTime = 0;
                ttsAudio = null;
            }
            window.speechSynthesis.cancel();
            currentUtterance = null; // Added GC prevention

            const soundEffect = document.getElementById('sound-effect');
            if (soundEffect) soundEffect.classList.add('hidden');
            const modalImg = document.getElementById('modal-img');
            if (modalImg) modalImg.classList.remove('scale-105');
        }

        async function speak(keyOrText, isRaw = false) {
            window.speechSynthesis.cancel();
            if (ttsAudio) { ttsAudio.pause(); ttsAudio = null; }

            // Ensure text exists (safeguard for potentially missing EN data in future)
            let text = isRaw ? keyOrText : (I18N_DATA[currentLang] && I18N_DATA[currentLang][keyOrText] ? I18N_DATA[currentLang][keyOrText] : keyOrText);
            if (!text) return;

            const cleanText = text.replace(/<[^>]*>/g, '');
            const langCode = currentLang === 'ko' ? 'ko-KR' : 'en-US';
            const voiceName = currentLang === 'ko' ? 'ko-KR-Standard-A' : 'en-US-Standard-E';

            try {
                // Try Google Cloud TTS
                const response = await fetch(`https://texttospeech.googleapis.com/v1/text:synthesize?key=${GOOGLE_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        input: { text: cleanText },
                        voice: { languageCode: langCode, name: voiceName },
                        audioConfig: { audioEncoding: 'MP3' }
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data.audioContent) {
                        const audioBlob = await fetch(`data:audio/mp3;base64,${data.audioContent}`).then(res => res.blob());
                        const audioUrl = URL.createObjectURL(audioBlob);
                        ttsAudio = new Audio(audioUrl);
                        ttsAudio.play();
                        return;
                    }
                }
                throw new Error("Google TTS Failed");
            } catch (e) {
                console.warn("Google TTS 실패, 브라우저 TTS로 전환합니다:", e);
                fallbackSpeak(cleanText);
            }
        }

        function fallbackSpeak(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            currentUtterance = utterance; // GC 방지

            const isEnglish = currentLang !== 'ko';
            utterance.lang = isEnglish ? 'en-US' : 'ko-KR';
            utterance.rate = 0.9;

            if (availableVoices.length === 0) availableVoices = window.speechSynthesis.getVoices();

            if (isEnglish) {
                const targetVoices = ["Google US English", "Samantha", "Microsoft Zira", "Karen", "Tessa"];
                let selectedVoice = availableVoices.find(v => targetVoices.some(target => v.name.includes(target)));

                if (!selectedVoice) selectedVoice = availableVoices.find(v => v.lang === 'en-US');
                if (selectedVoice) utterance.voice = selectedVoice;
            } else {
                const koVoice = availableVoices.find(v => v.name.includes('Google 한국어') || v.lang === 'ko-KR');
                if (koVoice) utterance.voice = koVoice;
            }

            utterance.onend = function () { currentUtterance = null; };
            window.speechSynthesis.speak(utterance);
        }

        // --- [4. Game Logic] ---
        function startGame() {
            window.speechSynthesis.cancel();
            document.getElementById('intro-screen').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
            document.getElementById('main-content').classList.add('flex');
            document.getElementById('btn-restart').classList.remove('hidden');

            lucide.createIcons();
            renderGrid();
            speak('gridTitle');
        }

        function renderGrid() {
            const container = document.getElementById('instrument-grid');
            container.innerHTML = instruments.map((inst, index) => `
                <div onclick="openDetailModal(${index})" class="instrument-card bg-white rounded-3xl shadow-md p-3 flex flex-col items-center border-2 border-transparent hover:border-blue-300 ${inst.color}">
                    <div class="w-full aspect-square mb-2 rounded-2xl overflow-hidden bg-white shadow-inner flex items-center justify-center relative">
                        <img src="${inst.image}" alt="${inst.name}" 
                             onerror="this.parentElement.innerHTML='<div class=\'flex flex-col items-center text-gray-400\'><i data-lucide=\'image-off\' class=\'w-10 h-10 mb-1\'></i></div>'"
                             class="w-full h-full object-cover">
                    </div>
                    <h3 class="text-2xl font-bold text-gray-700">${inst.name}</h3>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function openDetailModal(index) {
            stopAudio(); // Stop any previous sound
            currentInstrument = instruments[index];

            const modal = document.getElementById('detail-modal');
            const img = document.getElementById('modal-img');

            // Set Content
            document.getElementById('modal-title').innerText = currentInstrument.name;
            document.getElementById('modal-desc').innerText = currentInstrument.desc;
            document.getElementById('modal-tag').innerText = currentInstrument.category;
            img.src = currentInstrument.image;

            // Show Modal
            modal.classList.remove('hidden');

            // NOTE: Explicitly NOT calling speak() here as requested
        }

        function closeDetailModal() {
            stopAudio();
            document.getElementById('detail-modal').classList.add('hidden');
            window.speechSynthesis.cancel();
        }

        function playCurrentSound() {
            if (!currentInstrument) return;
            stopAudio();

            // Visual feedback
            document.getElementById('sound-effect').classList.remove('hidden');
            document.getElementById('modal-img').classList.add('scale-105');

            // Play Audio
            currentAudio = new Audio(currentInstrument.sound);
            currentAudio.play().catch(e => console.log("Audio play error:", e));

            currentAudio.onended = () => {
                document.getElementById('sound-effect').classList.add('hidden');
                document.getElementById('modal-img').classList.remove('scale-105');
            };
        }

        function readDescription() {
            stopAudio(); // Stop sound effects before speaking
            if (currentInstrument) {
                speak(currentInstrument.desc, true);
            }
        }

        // --- [5. UI & Scaling] ---
        function updateTexts() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (I18N_DATA[currentLang][key]) {
                    el.innerHTML = I18N_DATA[currentLang][key];
                }
            });
        }

        function resizeGame() {
            const container = document.getElementById('game-container');
            const wrapper = document.getElementById('scalable-wrapper');
            const cw = container.clientWidth;
            const ch = container.clientHeight;
            const baseW = 1280;
            const baseH = 720;
            const scale = Math.min(cw / baseW, ch / baseH);
            wrapper.style.transform = `scale(${scale})`;
        }
        window.addEventListener('resize', resizeGame);
        resizeGame();

        document.getElementById('btn-restart').onclick = () => {
            document.getElementById('restart-modal').classList.remove('hidden');
            speak('restartConfirm');
        };

        function confirmRestart() {
            document.getElementById('restart-modal').classList.add('hidden');
            closeDetailModal();

            document.getElementById('main-content').classList.add('hidden');
            document.getElementById('main-content').classList.remove('flex');
            document.getElementById('intro-screen').classList.remove('hidden');
            document.getElementById('btn-restart').classList.add('hidden');

            speak('introDesc');
        }

        document.getElementById('btn-exit').onclick = () => {
            document.getElementById('modal-exit').classList.remove('hidden');
            speak('exitConfirm');
        };

        function confirmExit() {
            if (window.history.length > 1) window.history.back();
            else window.close();
        }

        function toggleHelp() {
            const modal = document.getElementById('help-modal');
            const isHidden = modal.classList.contains('hidden');
            if (isHidden) {
                modal.classList.remove('hidden');
                // TTS: Read instructions but skip the button text
                const t = I18N_DATA[currentLang];
                const text = `${t.howToPlay}. ${t.help1}. ${t.help2}. ${t.help3}.`;
                speak(text, true);
            } else {
                modal.classList.add('hidden');
                window.speechSynthesis.cancel();
            }
        }

        // --- [6. Confetti Engine] ---
        const canvas = document.getElementById("confetti");
        const ctx = canvas.getContext("2d");
        let particles = [];

        function resizeCanvas() {
            canvas.width = 1280;
            canvas.height = 720;
        }
        resizeCanvas();

        function fireConfetti() {
            particles = [];
            for (let i = 0; i < 60; i++) {
                particles.push({
                    x: 640, y: 360,
                    dx: (Math.random() - 0.5) * 25,
                    dy: (Math.random() - 0.5) * 25,
                    size: Math.random() * 10 + 5,
                    color: ['#EF4444', '#3B82F6', '#22C55E', '#A855F7', '#EC4899', '#F97316'][Math.floor(Math.random() * 6)],
                    life: 120
                });
            }
            if (!confettiReqId) animateConfetti();
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (particles.length === 0) {
                confettiReqId = null;
                return;
            }
            particles.forEach((p, i) => {
                p.x += p.dx; p.y += p.dy; p.dy += 0.5; p.life--;
                ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size);
                if (p.life <= 0) particles.splice(i, 1);
            });
            confettiReqId = requestAnimationFrame(animateConfetti);
        }

        // Init
        lucide.createIcons();
        updateTexts();
        speak('introDesc'); // Speak intro on load
    </script>
    <script src="../../js/web-learning-game-shell.js" defer></script>

    <script src="../../js/web-learning-play-tracker.js?v=20260616-03" defer></script>
    <script src="../../js/web-learning-ranking.js?v=20260618-07" defer></script>
