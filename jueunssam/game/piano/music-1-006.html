<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>만화로 배우는 오선지 탐험</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* [Core Reset & Safe Area] */
        :root {
            --gnb-height: 60px;
            --app-bg: #fff7ed;
            /* Orange-50 */
        }

        body {
            font-family: 'Jua', sans-serif;
            background-color: var(--app-bg);
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            height: 100vh;
            width: 100vw;
        }

        /* [GNB Styles] */
        #gnb {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--gnb-height);
            background-color: #FEE500;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* [Game Container & Scaling] */
        #game-container {
            position: absolute;
            top: var(--gnb-height);
            left: 0;
            width: 100%;
            height: calc(100vh - var(--gnb-height));
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: var(--app-bg);
        }

        #scalable-wrapper {
            width: 1280px;
            height: 720px;
            position: relative;
            transform-origin: center center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* [Comic Style Components] */
        .comic-panel {
            border: 5px solid #334155;
            box-shadow: 10px 10px 0px #cbd5e1;
            background: white;
            position: relative;
        }

        .speech-bubble {
            position: relative;
            background: #ffffff;
            border: 3px solid #334155;
            border-radius: 20px;
            padding: 20px 30px;
            z-index: 10;
        }

        /* [Staff Styles] */
        .staff-wrapper {
            position: relative;
            width: 90%;
            height: 50%;
            background: #fdfcfb;
            border-radius: 20px;
            border: 4px solid #334155;
            box-shadow: 6px 6px 0px #cbd5e1;
            overflow: visible;
            /* Notes can pop out slightly */
            margin-top: 20px;
        }

        .staff-line-hitbox {
            position: absolute;
            left: 0;
            width: 100%;
            height: 12%;
            display: flex;
            align-items: center;
            cursor: pointer;
            z-index: 20;
            transition: all 0.2s;
        }

        .staff-line-visual {
            height: 6px;
            background-color: #475569;
            width: 100%;
            transition: all 0.2s;
            pointer-events: none;
            border-radius: 3px;
        }

        .staff-line-hitbox.active .staff-line-visual {
            background-color: var(--line-color);
            height: 16px;
            box-shadow: 0 0 15px var(--line-color);
        }

        .staff-space-hitbox {
            position: absolute;
            left: 0;
            width: 100%;
            height: 15%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            transition: all 0.2s;
        }

        .staff-space-hitbox.active {
            background-color: var(--space-color);
            opacity: 0.7;
            border: 2px dashed white;
        }

        /* Animations */
        @keyframes guide-blink {

            0%,
            100% {
                filter: brightness(1);
                transform: scale(1);
            }

            50% {
                filter: brightness(1.3);
                transform: scale(1.02);
                background-color: rgba(255, 251, 0, 0.4);
            }
        }

        .guide-blink {
            animation: guide-blink 0.8s infinite;
            border-radius: 8px;
            z-index: 40 !important;
        }

        .note-head {
            width: 60px;
            height: 48px;
            background: var(--bg-color, #f43f5e);
            border-radius: 50%;
            transform: rotate(-15deg);
            box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            font-weight: bold;
            pointer-events: none;
            z-index: 50;
            border: 3px solid white;
        }

        .pop-in {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% {
                transform: scale(0) rotate(-180deg);
                opacity: 0;
            }

            100% {
                transform: scale(1) rotate(-15deg);
                opacity: 1;
            }
        }

        .shake-screen {
            animation: shake 0.4s;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translate(0, 0);
            }

            25% {
                transform: translate(-10px, 0);
            }

            75% {
                transform: translate(10px, 0);
            }
        }

        /* Modal & UI Animation */
        .modal-enter {
            animation: modalFadeIn 0.3s forwards;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .btn-press {
            transition: transform 0.1s;
        }

        .btn-press:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>

    <!-- [1. GNB] -->
    <nav id="gnb">
        <div class="flex items-center gap-2">

    <!-- Quiz Intro Modal -->

                총 6문제를 준비했어!
                선생님이 내는 문제를 잘 맞춰봐!

            <button id="btn-start-quiz"
                class="w-full bg-pink-500 text-white py-5 rounded-2xl text-3xl font-bold shadow-[0_8px_0_#be185d] active:shadow-none active:translate-y-1 transition-all"
                data-i18n="quizStartBtn">퀴즈 시작!</button>
        </div>
    </div>

    <script>
        // --- [1. Configuration & Data] ---
        const GOOGLE_API_KEY = "AIzaSyAE0nnpOYZRfLkfM09O3NQjpWnN1kUqR3E";

        // Original Assets & Colors preserved
        const SOUND_CORRECT = "https://cdn.pixabay.com/audio/2025/04/23/audio_5a1eca1fdf.mp3";
        const SOUND_WRONG = "https://cdn.pixabay.com/audio/2021/08/09/audio_ec2624b77c.mp3";
        const LINE_COLORS = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFA07A'];
        const SPACE_COLORS = ['#FFD166', '#EF476F', '#118AB2', '#06D6A0'];

        const I18N_DATA = {
            ko: {
                appTitle: "오선지 탐험대",
                langBtn: "English",
                introDesc: "안녕! 나는 음표새야.\n반짝이는 줄과 칸을 찾아보자!",
                howToPlay: "도움말",
                manualText: "1. 아래에서부터 줄과 칸의 숫자를 세어보세요.\n2. 반짝이는 곳을 눌러서 오선지를 배워요.\n3. 퀴즈를 모두 맞추면 박사님이 됩니다!",
                start: "탐험 시작하기!",
                restart: "다시하기",
                exit: "종료",
                ok: "알겠어요!",
                exitConfirm: "정말 종료할까요?",
                exitDesc: "게임 진행 상황이 저장되지 않아요.",
                yes: "네, 종료해요",
                cancel: "아니요",
                nextBtn: "다음 단계로",
                endTitle: "오선지 정복 완료!",
                retryQuiz: "퀴즈 한 번 더 하기",
                quizTime: "퀴즈 타임!",
                quizDesc: "총 6문제를 준비했어!\n선생님이 내는 문제를 잘 맞춰봐!",
                quizStartBtn: "퀴즈 시작!",
                wellDone: "참 잘했어요! 최고야!",
                correct: "딩동댕! 정답이에요!",
                wrong: "앗! 다시 해보자!",
                findLine: "{n} 줄을 찾아봐!",
                findSpace: "{n} 칸을 찾아봐!",
                ordinals: ["첫 번째(1)", "두 번째(2)", "세 번째(3)", "네 번째(4)", "다섯 번째(5)"],
                line: "줄",
                space: "칸"
            },
            en: {
                appTitle: "Staff Explorer",
                langBtn: "한국어",
                introDesc: "Hi! I'm Note Bird.\nLet's find the sparkling lines and spaces!",
                howToPlay: "How to Play",
                manualText: "1. Count lines and spaces from the bottom.\n2. Click the sparkling area to learn.\n3. Complete the quiz to become a master!",
                start: "Start Exploring!",
                restart: "Restart",
                exit: "Exit",
                ok: "Got it!",
                exitConfirm: "Really Exit?",
                exitDesc: "Progress will not be saved.",
                yes: "Yes, Exit",
                cancel: "No",
                nextBtn: "Next Level",
                endTitle: "Staff Master!",
                retryQuiz: "Retry Quiz",
                quizTime: "Quiz Time!",
                quizDesc: "I have 6 questions for you!\nTry to answer them correctly!",
                quizStartBtn: "Start Quiz!",
                wellDone: "Great job! You are amazing!",
                correct: "Ding Dong Deng! Correct!",
                wrong: "Oops! Try again!",
                findLine: "Find the {n} Line!",
                findSpace: "Find the {n} Space!",
                ordinals: ["1st", "2nd", "3rd", "4th", "5th"],
                line: "Line",
                space: "Space"
            }
        };

        // --- [2. Global State] ---
        let currentLang = 'ko';
        let gameState = 'intro'; // intro, learn-lines, learn-spaces, quiz-ready, quiz, end
        let learnedCount = 0;
        let currentQuizIndex = 0;
        let quizList = [];
        let googleTTSAvailable = true;
        let availableVoices = [];
        let ttsAudio = null;
        let confettiReqId = null;
        let currentUtterance = null; // Prevent GC

        // --- [3. Audio & TTS System] ---
        function loadVoices() {
            availableVoices = window.speechSynthesis.getVoices();
        }
        if (window.speechSynthesis.onvoiceschanged !== undefined) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
        }
        loadVoices();

        function stopTTS() {
            if (ttsAudio) { ttsAudio.pause(); ttsAudio = null; }
            window.speechSynthesis.cancel();
            currentUtterance = null;
        }

        async function speak(textKey, dynamicParams = null, isRaw = false) {
            stopTTS();
            let text = isRaw ? textKey : I18N_DATA[currentLang][textKey];
            if (!text) return;

            // Replace dynamic params e.g. {n}
            if (dynamicParams) {
                Object.keys(dynamicParams).forEach(key => {
                    text = text.replace(`{${key}}`, dynamicParams[key]);
                });
            }

            // Google Cloud TTS
            if (googleTTSAvailable) {
                const langCode = currentLang === 'ko' ? 'ko-KR' : 'en-US';
                const voiceName = currentLang === 'ko' ? 'ko-KR-Standard-A' : 'en-US-Standard-E';
                try {
                    const response = await fetch(`https://texttospeech.googleapis.com/v1/text:synthesize?key=${GOOGLE_API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            input: { text: text },
                            voice: { languageCode: langCode, name: voiceName },
                            audioConfig: { audioEncoding: 'MP3' }
                        })
                    });
                    if (!response.ok) throw new Error('API Error');
                    const data = await response.json();
                    if (data.audioContent) {
                        const audioBlob = await fetch(`data:audio/mp3;base64,${data.audioContent}`).then(res => res.blob());
                        ttsAudio = new Audio(URL.createObjectURL(audioBlob));
                        ttsAudio.play();
                        return;
                    }
                } catch (e) {
                    console.warn("Google TTS Failed, switching to fallback", e);
                    googleTTSAvailable = false;
                }
            }

            // Fallback
            fallbackSpeak(text);
        }

        function fallbackSpeak(text) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            currentUtterance = u; // Prevent GC

            u.lang = currentLang === 'ko' ? 'ko-KR' : 'en-US';
            u.rate = 0.9;

            if (availableVoices.length === 0) availableVoices = window.speechSynthesis.getVoices();

            if (currentLang !== 'ko') {
                const preferred = ["Google US English", "Samantha", "Microsoft Zira", "Karen", "Tessa"];
                const voice = availableVoices.find(v => preferred.some(p => v.name.includes(p)));
                if (voice) u.voice = voice;
            } else {
                const koVoice = availableVoices.find(v => v.name.includes('Google 한국어') || v.lang === 'ko-KR');
                if (koVoice) u.voice = koVoice;
            }

            u.onend = () => { currentUtterance = null; };
            window.speechSynthesis.speak(u);
        }

        function playSound(url) {
            new Audio(url).play().catch(() => { });
        }

        // --- [4. Game Logic] ---

        function initLearningFlow() {
            gameState = 'learn-lines';
            document.getElementById('intro-section').classList.add('hidden');
            document.getElementById('game-section').classList.remove('hidden');
            document.getElementById('game-section').classList.add('flex');
            document.getElementById('btn-restart').classList.remove('hidden');

            learnedCount = 0;
            renderResponsiveStaff();
            updateGamePhase();
        }

        function renderResponsiveStaff() {
            const container = document.getElementById('staff-hitboxes');
            container.innerHTML = '';

            const linePositions = [82, 66, 50, 34, 18]; // % from top
            const spacePositions = [74, 58, 42, 26];    // % from top

            // Create Spaces (Behind lines visually but clickable)
            for (let i = 0; i < 4; i++) {
                const space = document.createElement('div');
                space.className = 'staff-space-hitbox';
                space.id = `space-hitbox-${i}`;
                space.style.top = `${spacePositions[i] - 7.5}%`;
                space.style.setProperty('--space-color', SPACE_COLORS[i]);
                if (gameState === 'learn-spaces' || gameState === 'quiz') space.style.zIndex = "35";
                space.onclick = (e) => handleStaffClick('space', i, space);
                container.appendChild(space);
            }

            // Create Lines
            for (let i = 0; i < 5; i++) {
                const hitbox = document.createElement('div');
                hitbox.className = 'staff-line-hitbox';
                hitbox.id = `line-hitbox-${i}`;
                hitbox.style.top = `${linePositions[i] - 6}%`;
                hitbox.style.setProperty('--line-color', LINE_COLORS[i]);
                if (gameState === 'learn-lines' || gameState === 'quiz') hitbox.style.zIndex = "35";

                const visual = document.createElement('div');
                visual.className = 'staff-line-visual';
                hitbox.appendChild(visual);

                hitbox.onclick = () => handleStaffClick('line', i, hitbox);
                container.appendChild(hitbox);
            }
        }

        function updateGamePhase() {
            renderResponsiveStaff();
            document.querySelectorAll('.guide-blink').forEach(el => el.classList.remove('guide-blink'));

            let text = "";
            let targetId = "";
            const ords = I18N_DATA[currentLang].ordinals;

            if (gameState === 'learn-lines') {
                text = I18N_DATA[currentLang].findLine.replace('{n}', ords[learnedCount]);
                targetId = `line-hitbox-${learnedCount}`;
            } else if (gameState === 'learn-spaces') {
                text = I18N_DATA[currentLang].findSpace.replace('{n}', ords[learnedCount]);
                targetId = `space-hitbox-${learnedCount}`;
            }

            if (gameState.includes('learn')) {
                document.getElementById('task-title').innerText = text;
                document.getElementById('task-icon').setAttribute('data-lucide', gameState === 'learn-lines' ? 'minus' : 'layout-grid');
                if (targetId) document.getElementById(targetId).classList.add('guide-blink');
                speak(text, null, true);
            }
            lucide.createIcons();
        }

        function handleStaffClick(type, idx, el) {
            if (gameState === 'quiz') {
                checkQuiz(type, idx, el);
                return;
            }

            // Learning Phase Logic
            if (gameState === 'learn-lines' && (type !== 'line' || idx !== learnedCount)) return;
            if (gameState === 'learn-spaces' && (type !== 'space' || idx !== learnedCount)) return;

            // Correct
            playSound(SOUND_CORRECT);
            showNoteVisual(el, type, idx);
            speak('correct');

            setTimeout(() => {
                learnedCount++;
                const max = gameState === 'learn-lines' ? 5 : 4;

                if (learnedCount >= max) {
                    showPhaseComplete();
                } else {
                    updateGamePhase();
                }
            }, 1000);
        }

        function showNoteVisual(el, type, idx) {
            el.classList.add('active');
            const note = document.createElement('div');
            const color = type === 'line' ? LINE_COLORS[idx] : SPACE_COLORS[idx];
            note.className = 'note-head pop-in';
            note.style.setProperty('--bg-color', color);
            note.innerText = (idx + 1);
            el.appendChild(note);

            setTimeout(() => {
                el.classList.remove('active');
                note.remove();
            }, 800);
        }

        function showPhaseComplete() {
            document.getElementById('task-title').innerText = I18N_DATA[currentLang].wellDone;
            speak('wellDone');

            const btn = document.getElementById('next-phase-btn');
            btn.classList.remove('hidden');
            btn.onclick = (e) => {
                e.stopPropagation();
                btn.classList.add('hidden');
                if (gameState === 'learn-lines') {
                    gameState = 'learn-spaces';
                    learnedCount = 0;
                    updateGamePhase();
                } else {
                    startQuizFlow();
                }
            };
        }

        function startQuizFlow() {
            gameState = 'quiz-ready';
            document.getElementById('end-section').classList.add('hidden');
            document.getElementById('end-section').classList.remove('flex');
            document.getElementById('game-section').classList.remove('hidden');
            document.getElementById('game-section').classList.add('flex');
            document.getElementById('staff-board').classList.add('hidden'); // Hide board during modal

            const modal = document.getElementById('modal-quiz');
            modal.classList.remove('hidden');
            speak('quizDesc'); // TTS the intro

            document.getElementById('btn-start-quiz').onclick = () => {
                modal.classList.add('hidden');
                document.getElementById('staff-board').classList.remove('hidden');
                document.getElementById('progress-container').classList.remove('hidden');
                gameState = 'quiz';
                initQuiz();
            }
        }

        function initQuiz() {
            // Mixed Quiz List
            quizList = [
                { type: 'line', idx: 0 },
                { type: 'space', idx: 0 },
                { type: 'line', idx: 2 },
                { type: 'space', idx: 2 },
                { type: 'line', idx: 4 },
                { type: 'space', idx: 1 }
            ];
            currentQuizIndex = 0;
            renderResponsiveStaff();
            loadQuizQuestion();
        }

        function loadQuizQuestion() {
            if (currentQuizIndex >= quizList.length) {
                showEndScreen();
                return;
            }

            const q = quizList[currentQuizIndex];
            const ords = I18N_DATA[currentLang].ordinals;

            let text = "";
            if (q.type === 'line') text = I18N_DATA[currentLang].findLine.replace('{n}', ords[q.idx]);
            else text = I18N_DATA[currentLang].findSpace.replace('{n}', ords[q.idx]);

            document.getElementById('task-title').innerText = text;
            document.getElementById('task-icon').setAttribute('data-lucide', 'help-circle');
            lucide.createIcons();

            updateProgressBar();
            speak(text, null, true);
        }

        function checkQuiz(type, idx, el) {
            const q = quizList[currentQuizIndex];

            if (q.type === type && q.idx === idx) {
                // Correct
                playSound(SOUND_CORRECT);
                fireConfettiBurst();
                showNoteVisual(el, type, idx);
                document.getElementById('task-title').innerText = I18N_DATA[currentLang].correct;
                document.getElementById('task-title').classList.add('text-green-600');
                speak('correct');

                setTimeout(() => {
                    document.getElementById('task-title').classList.remove('text-green-600');
                    currentQuizIndex++;
                    loadQuizQuestion();
                }, 1500);
            } else {
                // Wrong
                playSound(SOUND_WRONG);
                document.getElementById('game-container').classList.add('shake-screen');
                document.getElementById('task-title').innerText = I18N_DATA[currentLang].wrong;
                document.getElementById('task-title').classList.add('text-red-500');
                speak('wrong');

                setTimeout(() => {
                    document.getElementById('game-container').classList.remove('shake-screen');
                    document.getElementById('task-title').classList.remove('text-red-500');
                    // Repeat question
                    const q = quizList[currentQuizIndex];
                    const ords = I18N_DATA[currentLang].ordinals;
                    let text = q.type === 'line' ?
                        I18N_DATA[currentLang].findLine.replace('{n}', ords[q.idx]) :
                        I18N_DATA[currentLang].findSpace.replace('{n}', ords[q.idx]);
                    document.getElementById('task-title').innerText = text;
                }, 1000);
            }
        }

        function updateProgressBar() {
            const pct = (currentQuizIndex / quizList.length) * 100;
            document.getElementById('progress-bar').style.width = `${pct}%`;
        }

        function showEndScreen() {
            document.getElementById('game-section').classList.add('hidden');
            document.getElementById('game-section').classList.remove('flex');
            document.getElementById('progress-container').classList.add('hidden');

            document.getElementById('end-section').classList.remove('hidden');
            document.getElementById('end-section').classList.add('flex');

            fireConfettiLoop();
            setTimeout(stopConfettiLoop, 3000);
            speak('endTitle');
        }

        function resetGame() {
            location.reload();
        }

        // --- [5. UI Events & Scaling] ---
        function updateTexts() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (I18N_DATA[currentLang][key]) el.innerText = I18N_DATA[currentLang][key];
            });
        }

        document.getElementById('btn-lang').onclick = () => {
            currentLang = currentLang === 'ko' ? 'en' : 'ko';
            document.getElementById('btn-lang').innerText = currentLang === 'ko' ? 'English' : '한국어';
            updateTexts();
            // TTS
            const speakText = currentLang === 'ko' ? '한국어' : 'English';
            speak(speakText, null, true);
        };

        // Modal Logic
        const infoModal = document.getElementById('modal-info');
        const exitModal = document.getElementById('modal-exit');

        document.getElementById('btn-howto').onclick = () => {
            stopTTS();
            infoModal.classList.remove('hidden');
            speak('manualText');
        };

        document.querySelectorAll('.btn-close-modal').forEach(btn => {
            btn.onclick = () => { stopTTS(); infoModal.classList.add('hidden'); };
        });

        document.getElementById('btn-exit').onclick = () => {
            stopTTS();
            exitModal.classList.remove('hidden');
            speak('exitConfirm');
        };

        document.getElementById('btn-cancel-exit').onclick = () => exitModal.classList.add('hidden');
        document.getElementById('btn-confirm-exit').onclick = () => {
            if (window.history.length > 1) window.history.back();
            else window.close();
        };

        document.getElementById('btn-restart').onclick = resetGame;

        // Scaling logic
        function resizeGame() {
            const container = document.getElementById('game-container');
            const wrapper = document.getElementById('scalable-wrapper');
            const cw = container.clientWidth;
            const ch = container.clientHeight;
            const scale = Math.min(cw / 1280, ch / 720);
            wrapper.style.transform = `scale(${scale})`;
        }
        window.addEventListener('resize', resizeGame);
        resizeGame();

        // --- [6. Confetti] ---
        const canvas = document.getElementById("confetti");
        const ctx = canvas.getContext("2d");
        let particles = [];

        function fireConfettiBurst() {
            canvas.width = 1280; canvas.height = 720;
            for (let i = 0; i < 40; i++) {
                particles.push({
                    x: 640, y: 360,
                    w: Math.random() * 12 + 8, h: Math.random() * 12 + 8,
                    dx: (Math.random() - 0.5) * 20, dy: (Math.random() - 0.5) * 20,
                    color: `hsl(${Math.random() * 360}, 80%, 60%)`, life: 100
                });
            }
            if (!confettiReqId) animateConfetti();
        }

        function fireConfettiLoop() {
            canvas.width = 1280; canvas.height = 720;
            const interval = setInterval(() => {
                if (document.getElementById('end-section').classList.contains('hidden')) {
                    clearInterval(interval);
                    return;
                }
                for (let i = 0; i < 5; i++) {
                    particles.push({
                        x: Math.random() * 1280, y: -20,
                        w: Math.random() * 12 + 8, h: Math.random() * 12 + 8,
                        dx: (Math.random() - 0.5) * 5, dy: Math.random() * 5 + 5,
                        color: `hsl(${Math.random() * 360}, 80%, 60%)`, life: 150
                    });
                }
            }, 100);
            if (!confettiReqId) animateConfetti();
        }

        function stopConfettiLoop() {
            particles = [];
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (confettiReqId) {
                cancelAnimationFrame(confettiReqId);
                confettiReqId = null;
            }
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (particles.length === 0) {
                confettiReqId = null;
                return;
            }
            particles.forEach((p, i) => {
                p.x += p.dx; p.y += p.dy; p.dy += 0.5; p.life--;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.w, p.h);
                if (p.life <= 0) particles.splice(i, 1);
            });
            confettiReqId = requestAnimationFrame(animateConfetti);
        }

        // Init icons & speech
        lucide.createIcons();
        speak('introDesc');
    </script>
