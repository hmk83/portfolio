<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>철봉 피아노 순서 연주</title>
    <style>
        :root {
            --header-height: 58px;
            --safe-bottom-space: clamp(168px, 23dvh, 230px);
            --safe-top-space: clamp(46px, 7dvh, 76px);
            --safe-art-height: min(360px, calc(100dvh - var(--header-height) - var(--safe-top-space) - var(--safe-bottom-space)));
            --ink: #2d2438;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100dvh;
            margin: 0;
            overflow: hidden;
            background: #c9efe9;
            color: var(--ink);
            font-family: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        button {
            font: inherit;
        }

        .kakao-header {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 60;
            width: 100%;
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 0 16px;
            background: linear-gradient(135deg, #fee500 0%, #f9c51b 100%);
            border-bottom: 2px solid rgba(74, 47, 34, 0.22);
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.18);
            color: #3b1e1e;
        }

        .header-title {
            min-width: 0;
            font-size: clamp(16px, 3.3vw, 22px);
            font-weight: 900;
            white-space: nowrap;
        }

        .header-buttons {
            display: flex;
            gap: 8px;
        }

        .header-btn {
            min-height: 34px;
            padding: 6px 12px;
            border: 2px solid rgba(255, 255, 255, 0.72);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.52);
            color: #3b1e1e;
            font-size: clamp(12px, 2.4vw, 14px);
            font-weight: 900;
            cursor: pointer;
        }

        .game {
            position: relative;
            width: 100vw;
            height: calc(100dvh - var(--header-height));
            margin-top: var(--header-height);
            overflow: hidden;
            background-image: url('Images/pull-up-bar-bg.webp');
            background-size: cover;
            background-position: center;
        }

        .game-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .playfield {
            position: absolute;
            inset: 0;
            z-index: 1;
            display: grid;
            grid-template-rows: auto auto 1fr;
            justify-items: center;
            align-content: start;
            padding: var(--safe-top-space) clamp(18px, 3vw, 42px) var(--safe-bottom-space);
        }

        .progress-orbs {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 5px;
            min-width: min(25rem, 72vw);
            margin-bottom: clamp(12px, 2dvh, 18px);
            padding: 8px 12px;
            border: 3px solid rgba(255, 255, 255, 0.82);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.86);
            box-shadow: 0 8px 0 rgba(0, 0, 0, 0.08);
        }

        .progress-orb {
            width: clamp(16px, 2vw, 24px);
            aspect-ratio: 1;
            border: 2px solid rgba(57, 46, 37, 0.34);
            border-radius: 999px;
            background: #c9c9c9;
            box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.18);
        }

        .bar-wrap {
            position: relative;
            width: min(38vw, calc(var(--safe-art-height) * 431 / 432));
            max-height: var(--safe-art-height);
            aspect-ratio: 431 / 432;
        }

        .bar-img,
        .player-img {
            position: absolute;
            top: 0;
            left: 50%;
            width: auto;
            height: 100%;
            max-height: var(--safe-art-height);
            object-fit: contain;
            transform: translateX(-50%);
        }

        .bar-img {
            filter: drop-shadow(0 18px 18px rgba(0, 0, 0, 0.18));
        }

        .player-img {
            display: block;
            filter: grayscale(1);
            transform-origin: center top;
            transition: filter 0.28s ease;
        }

        .player-zone.connected .player-img {
            filter: grayscale(0);
        }

        .copy-mark {
            position: absolute;
            top: 3%;
            right: -8%;
            z-index: 6;
            width: clamp(84px, 14vw, 132px);
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 5px 5px rgba(0, 0, 0, 0.22));
            opacity: 0;
            pointer-events: none;
        }

        .copy-mark.visible {
            opacity: 1;
            animation: pop-copy 260ms ease-out;
        }

        @keyframes pop-copy {
            0% {
                transform: scale(0.3) rotate(-12deg);
            }
            100% {
                transform: scale(1) rotate(0deg);
            }
        }

        .connect-box {
            width: min(34vw, 390px);
            min-height: 52px;
            display: grid;
            place-items: center;
            margin-top: clamp(12px, 2dvh, 22px);
            padding: 10px 14px;
            border: 4px dotted rgba(53, 42, 28, 0.8);
            border-radius: 8px;
            background: #fff;
            color: #413225;
            font-size: clamp(18px, 2vw, 24px);
            font-weight: 900;
            text-align: center;
            box-shadow: 0 7px 0 rgba(86, 63, 42, 0.16);
        }

        .player-zone:not(.connected) .connect-box {
            color: rgba(65, 50, 37, 0.52);
            border-color: rgba(53, 42, 28, 0.34);
        }

        .connect-box {
            display: none;
        }

        .sequence-panel {
            position: absolute;
            left: 50%;
            bottom: clamp(118px, 17dvh, 170px);
            z-index: 5;
            display: grid;
            justify-items: center;
            gap: 8px;
            width: min(760px, 92vw);
            transform: translateX(-50%);
            pointer-events: none;
        }

        .sequence-label {
            display: grid;
            place-items: center;
            min-height: 38px;
            padding: 6px 16px;
            border: 4px dotted rgba(53, 42, 28, 0.8);
            border-radius: 8px;
            background: #fff;
            color: #3b2a20;
            font-size: clamp(18px, 2.6vw, 26px);
            font-weight: 900;
            text-align: center;
            box-shadow: 0 7px 0 rgba(86, 63, 42, 0.16);
        }

        .sequence-chips {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            min-height: 46px;
        }

        .note-chip {
            min-width: 56px;
            padding: 8px 10px;
            border: 3px solid rgba(46, 35, 25, 0.7);
            border-radius: 10px;
            background: #fff;
            color: #302319;
            font-size: clamp(16px, 2.2vw, 23px);
            font-weight: 900;
            text-align: center;
            box-shadow: inset 0 -5px 0 rgba(0, 0, 0, 0.12), 0 4px 0 rgba(0, 0, 0, 0.14);
        }

        .note-chip.done {
            color: #fff;
            background: var(--chip-color, #22c55e);
        }

        .note-chip.current {
            outline: 4px solid #fee500;
            outline-offset: 2px;
        }

        .keyboard {
            position: absolute;
            left: 50%;
            bottom: clamp(12px, 2dvh, 24px);
            z-index: 6;
            display: block;
            width: min(1040px, 96vw);
            height: clamp(108px, 17dvh, 150px);
            padding: 10px 12px 12px;
            border: 4px solid rgba(54, 40, 28, 0.84);
            border-radius: 12px;
            background: rgba(48, 37, 28, 0.82);
            box-shadow: 0 12px 0 rgba(0, 0, 0, 0.18);
            transform: translateX(-50%);
        }

        .white-keys {
            display: grid;
            grid-template-columns: repeat(15, minmax(34px, 1fr));
            gap: 4px;
            height: 100%;
        }

        .piano-key {
            min-width: 0;
            display: grid;
            place-items: end center;
            padding: 8px 3px;
            border: 2px solid rgba(41, 31, 23, 0.8);
            border-radius: 0 0 8px 8px;
            background: linear-gradient(#fff, #f1eee8);
            color: #34281e;
            font-size: clamp(14px, 1.5vw, 18px);
            font-weight: 900;
            cursor: pointer;
            box-shadow: inset 0 -8px 0 rgba(0, 0, 0, 0.12);
        }

        .black-key {
            position: absolute;
            top: 10px;
            left: calc(var(--black-left) * 1%);
            z-index: 2;
            width: clamp(24px, 4.4vw, 46px);
            height: 58%;
            padding: 0 2px 8px;
            border: 2px solid rgba(5, 5, 5, 0.92);
            border-radius: 0 0 7px 7px;
            background: #111;
            color: #fff;
            font-size: clamp(10px, 1vw, 13px);
            transform: translateX(-50%);
            box-shadow: inset 0 -8px 0 rgba(255, 255, 255, 0.08), 0 4px 0 rgba(0, 0, 0, 0.3);
        }

        .black-key small {
            color: rgba(255, 255, 255, 0.72);
            font-size: 0.7em;
        }

        .piano-key.active,
        .piano-key.expected {
            color: #fff;
            background: var(--key-color, #3b82f6);
            transform: translateY(4px);
            box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.16);
        }

        .piano-key.wrong {
            color: #fff;
            background: #ef4444;
            animation: key-shake 150ms linear 2;
        }

        .black-key.active {
            background: var(--key-color, #3b82f6);
            transform: translateX(-50%) translateY(4px);
        }

        .black-key.wrong {
            background: #ef4444;
            animation: black-key-shake 150ms linear 2;
        }

        @keyframes key-shake {
            0%,
            100% {
                transform: translateX(0);
            }
            50% {
                transform: translateX(-4px);
            }
        }

        @keyframes black-key-shake {
            0%,
            100% {
                transform: translateX(-50%);
            }
            50% {
                transform: translateX(calc(-50% - 4px));
            }
        }

        .overlay {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: grid;
            place-items: center;
            padding: 18px;
            background-image: url('Images/pull-up-bar-bg.webp');
            background-size: cover;
            background-position: center;
        }

        .overlay::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.14);
        }

        .overlay.hidden,
        .hidden {
            display: none !important;
        }

        .intro-panel,
        .howto-panel,
        .result-panel {
            position: relative;
            z-index: 1;
            width: min(620px, 92vw);
            display: grid;
            justify-items: center;
            gap: clamp(12px, 2.4dvh, 22px);
            text-align: center;
        }

        .title-img {
            width: min(560px, 84vw);
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 12px 0 rgba(0, 0, 0, 0.12));
        }

        .intro-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        .intro-guide-text {
            flex-basis: 100%;
            color: #3b1e1e;
            font-size: clamp(16px, 2.5vw, 22px);
            font-weight: 900;
            text-shadow: 0 2px 0 rgba(255, 255, 255, 0.74);
        }

        .pixel-loader-container {
            width: min(420px, 80vw);
            display: grid;
            gap: 10px;
            padding: 18px;
            border: 4px solid #000;
            background: rgba(31, 24, 74, 0.86);
            box-shadow: 6px 6px 0 #000;
        }

        .loader-text {
            color: #fee500;
            font-size: clamp(18px, 3vw, 24px);
            font-weight: 900;
            text-shadow: 2px 2px 0 #000;
            animation: blink 0.8s steps(2, start) infinite;
        }

        @keyframes blink {
            to {
                visibility: hidden;
            }
        }

        .loader-bar-outer {
            width: 100%;
            height: 28px;
            border: 4px solid #000;
            background: #251e54;
            padding: 2px;
            box-shadow: 4px 4px 0 #000;
        }

        .loader-bar-inner {
            height: 100%;
            width: 0%;
            background: #00ffcc;
            background-image: linear-gradient(90deg, rgba(0, 0, 0, 0.15) 25%, transparent 25%, transparent 50%, rgba(0, 0, 0, 0.15) 50%, rgba(0, 0, 0, 0.15) 75%, transparent 75%, transparent);
            background-size: 16px 100%;
            transition: width 0.08s linear;
        }

        .play-button,
        .howto-button,
        .result-button {
            min-width: 150px;
            min-height: 58px;
            border: 4px solid rgba(255, 255, 255, 0.88);
            border-radius: 10px;
            background: #fee500;
            color: #3b1e1e;
            font-size: clamp(22px, 4vw, 36px);
            font-weight: 900;
            box-shadow: 0 8px 0 rgba(74, 47, 34, 0.18);
            cursor: pointer;
        }

        .howto-button {
            background: #fff;
        }

        .midi-summary {
            min-height: 44px;
            padding: 8px 16px;
            border: 4px dotted rgba(74, 47, 34, 0.78);
            border-radius: 8px;
            background: #fff;
            color: #3b1e1e;
            font-size: clamp(17px, 2.8vw, 24px);
            font-weight: 900;
        }

        .howto-modal {
            z-index: 30;
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(4px);
        }

        .howto-panel,
        .result-panel {
            padding: clamp(18px, 4vw, 30px);
            border: 4px solid rgba(255, 255, 255, 0.92);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.94);
            box-shadow: 0 18px 34px rgba(0, 0, 0, 0.18);
        }

        .howto-title,
        .result-title {
            margin: 0;
            color: #33261d;
            font-size: clamp(30px, 7vw, 54px);
            line-height: 1;
        }

        .howto-list {
            display: grid;
            gap: 10px;
            width: 100%;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .howto-list li {
            display: grid;
            grid-template-columns: 42px minmax(0, 1fr);
            gap: 10px;
            align-items: center;
            padding: 12px;
            border-radius: 10px;
            background: #f5f1e8;
            color: #3f3023;
            font-size: clamp(17px, 3vw, 24px);
            font-weight: 800;
            text-align: left;
        }

        .howto-list b {
            display: grid;
            place-items: center;
            width: 42px;
            height: 42px;
            border-radius: 999px;
            background: #fff;
        }

        .result-score {
            display: grid;
            gap: 10px;
            width: 100%;
        }

        .result-score span {
            padding: 14px;
            border-radius: 10px;
            background: #f5f1e8;
            font-size: clamp(22px, 4vw, 36px);
            font-weight: 900;
        }

        .result-text {
            margin: 0;
            font-size: clamp(20px, 3.6vw, 30px);
            font-weight: 900;
        }

        @media (max-width: 860px), (max-height: 720px) {
            :root {
                --safe-art-height: min(286px, calc(100dvh - var(--header-height) - 238px));
                --safe-bottom-space: 170px;
                --safe-top-space: 34px;
            }

            .bar-wrap {
                width: min(54vw, calc(var(--safe-art-height) * 431 / 432));
            }

            .connect-box {
                width: min(72vw, 360px);
                min-height: 44px;
                font-size: 16px;
            }

            .sequence-panel {
                bottom: 112px;
            }

            .sequence-label {
                min-height: 34px;
                font-size: 16px;
            }

            .note-chip {
                min-width: 44px;
                padding: 6px 8px;
                font-size: 15px;
            }

            .keyboard {
                height: 102px;
                padding: 7px 8px 9px;
            }

            .white-keys {
                grid-template-columns: repeat(15, minmax(26px, 1fr));
                gap: 3px;
            }

            .piano-key {
                padding: 6px 1px;
                font-size: 13px;
            }

            .black-key {
                top: 7px;
                width: clamp(18px, 4vw, 32px);
                font-size: 10px;
            }
        }
    </style>
</head>

<body>
    <header class="kakao-header">
        <div class="header-title">철봉 피아노 순서 연주</div>
        <div class="header-buttons">
            <button class="header-btn" type="button" onclick="restartGameBtn()">다시시작</button>
            <button class="header-btn" type="button" onclick="exitGame()">학습종료</button>
        </div>
    </header>

    <main class="game">
        <img class="game-bg" src="Images/pull-up-bar-bg.webp" alt="" fetchpriority="high" decoding="async">
        <section class="playfield" aria-label="철봉 피아노 1인용">
            <article class="player-zone" id="player-zone">
                <div class="progress-orbs" id="orbs" aria-label="정답 구슬"></div>
                <div class="bar-wrap">
                    <img class="bar-img" src="Images/pull-up-bar.webp" alt="철봉" fetchpriority="high" decoding="async">
                    <img class="player-img" id="player-img" src="Images/1P-01.webp" alt="캐릭터" fetchpriority="high" decoding="async">
                    <img class="copy-mark" id="copy-mark" src="Images/pull-up-bar-copy.webp" alt="성공" decoding="async">
                </div>
            </article>
        </section>

        <img src="Images/1P-02.webp" alt="" hidden loading="lazy" decoding="async">
        <img src="Images/1P-03.webp" alt="" hidden loading="lazy" decoding="async">
        <img src="Images/1P-04.webp" alt="" hidden loading="lazy" decoding="async">
        <img src="Images/pull-up-bar-copy.webp" alt="" hidden loading="lazy" decoding="async">
        <img src="Images/pull-up-bar-copy-1.webp" alt="" hidden loading="lazy" decoding="async">

        <section class="sequence-panel" aria-label="연주 순서">
            <div class="sequence-label" id="sequence-label">피아노 연결 후 게임을 시작하세요.</div>
            <div class="sequence-chips" id="sequence-chips"></div>
        </section>

        <div class="keyboard" id="keyboard" aria-label="피아노 건반"></div>

        <section class="overlay" id="start-overlay">
            <div class="intro-panel">
                <img class="title-img" src="Images/pull-up-bar-piano.webp" alt="철봉 피아노" fetchpriority="high" decoding="async">
                <div class="pixel-loader-container" id="pixel-loader">
                    <div class="loader-text">NOW LOADING...</div>
                    <div class="loader-bar-outer">
                        <div class="loader-bar-inner" id="loader-bar-inner"></div>
                    </div>
                </div>
                <div class="intro-actions hidden" id="intro-actions">
                    <button class="play-button" id="btn-start" type="button">게임시작</button>
                    <button class="howto-button" id="btn-howto" type="button">게임방법</button>
                    <div class="intro-guide-text">MIDI 피아노로 먼저 들려주는 순서를 기억하세요.</div>
                </div>
                <div class="midi-summary" id="midi-summary">게임시작 후 MIDI 연결</div>
            </div>
        </section>

        <section class="overlay howto-modal hidden" id="howto-modal" aria-modal="true" role="dialog" aria-labelledby="howto-title">
            <div class="howto-panel">
                <h2 class="howto-title" id="howto-title">게임방법</h2>
                <ul class="howto-list">
                    <li><b>1</b><span>게임시작 후 피아노가 먼저 순서를 연주해요.</span></li>
                    <li><b>2</b><span>소리와 하이라이트를 기억한 뒤 MIDI 피아노로 따라 연주해요.</span></li>
                    <li><b>3</b><span>총 10문제이며 처음은 2개, 마지막은 5개 건반까지 나와요.</span></li>
                </ul>
                <button class="result-button" id="btn-howto-close" type="button">알겠어요</button>
            </div>
        </section>

        <section class="overlay hidden" id="result-overlay">
            <div class="result-panel">
                <h2 class="result-title">성공!</h2>
                <div class="result-score">
                    <span>턱걸이 <strong id="final-score">0</strong>개 완료</span>
                </div>
                <p class="result-text">순서 연주 10문제를 모두 맞혔어요.</p>
                <button class="result-button" id="btn-again" type="button">다시하기</button>
            </div>
        </section>
    </main>

    <script>
        const IMAGE_BASE = 'Images/';
        const TOTAL_ROUNDS = 10;
        const AUTO_NEXT_MS = 720;
        const COPY_VISIBLE_MS = 520;
        const WRONG_HOLD_MS = 800;
        const DEMO_NOTE_MS = 560;
        const DEMO_GAP_MS = 160;
        const MIDI_MIN_VELOCITY = 8;
        const SUCCESS_MARK_SRC = `${IMAGE_BASE}pull-up-bar-copy.webp`;
        const FAILURE_MARK_SRC = `${IMAGE_BASE}pull-up-bar-copy-1.webp`;
        const PIANO_SAMPLE_BASE = 'audio/salamander/';
        const SOUND_SOURCES = {
            bgm: 'ht' + 'tps://cdn.pixabay.com/audio/2022/12/13/audio_dba0111d9c.mp3',
            click: 'ht' + 'tps://cdn.pixabay.com/audio/2024/11/09/audio_cad57da7be.mp3',
            loop: 'ht' + 'tps://cdn.pixabay.com/audio/2024/03/08/audio_858ecbed3d.mp3'
        };
        const bgmAudio = new Audio();
        bgmAudio.loop = true;
        bgmAudio.volume = 0.06;
        let bgmPlaying = false;

        const clickAudio = new Audio();
        clickAudio.volume = 0.18;

        const gameLoopAudio = new Audio();
        gameLoopAudio.loop = true;
        gameLoopAudio.volume = 0.08;
        let gameLoopPlaying = false;
        const SALAMANDER_SAMPLE_MAP = [
            { center: 48, file: 'C3v10.flac' },
            { center: 51, file: 'D#3v10.flac' },
            { center: 54, file: 'F#3v10.flac' },
            { center: 57, file: 'A3v10.flac' },
            { center: 60, file: 'C4v10.flac' },
            { center: 63, file: 'D#4v10.flac' },
            { center: 66, file: 'F#4v10.flac' },
            { center: 69, file: 'A4v10.flac' },
            { center: 72, file: 'C5v10.flac' }
        ];
        const ROUND_LENGTHS = [2, 2, 3, 3, 4, 4, 4, 5, 5, 5];
        const PIANO_KEYS = [
            { midi: 48, toneNote: 'C3', name: '도', octave: 'C3', color: '#ef4444', key: 'KeyA' },
            { midi: 50, toneNote: 'D3', name: '레', octave: 'D3', color: '#f97316', key: 'KeyS' },
            { midi: 52, toneNote: 'E3', name: '미', octave: 'E3', color: '#eab308', key: 'KeyD' },
            { midi: 53, toneNote: 'F3', name: '파', octave: 'F3', color: '#84cc16', key: 'KeyF' },
            { midi: 55, toneNote: 'G3', name: '솔', octave: 'G3', color: '#22c55e', key: 'KeyG' },
            { midi: 57, toneNote: 'A3', name: '라', octave: 'A3', color: '#14b8a6', key: 'KeyH' },
            { midi: 59, toneNote: 'B3', name: '시', octave: 'B3', color: '#06b6d4', key: 'KeyJ' },
            { midi: 60, toneNote: 'C4', name: '도', octave: 'C4', color: '#3b82f6', key: 'KeyK' },
            { midi: 62, toneNote: 'D4', name: '레', octave: 'D4', color: '#6366f1', key: 'KeyL' },
            { midi: 64, toneNote: 'E4', name: '미', octave: 'E4', color: '#8b5cf6', key: 'Semicolon' },
            { midi: 65, toneNote: 'F4', name: '파', octave: 'F4', color: '#a855f7', key: 'KeyZ' },
            { midi: 67, toneNote: 'G4', name: '솔', octave: 'G4', color: '#d946ef', key: 'KeyX' },
            { midi: 69, toneNote: 'A4', name: '라', octave: 'A4', color: '#ec4899', key: 'KeyC' },
            { midi: 71, toneNote: 'B4', name: '시', octave: 'B4', color: '#f43f5e', key: 'KeyV' },
            { midi: 72, toneNote: 'C5', name: '도', octave: 'C5', color: '#fb7185', key: 'KeyB' }
        ];
        const BLACK_KEYS = [
            { midi: 49, name: '도#', octave: 'C#3', left: 100 / 15, color: '#ef4444' },
            { midi: 51, name: '레#', octave: 'D#3', left: 200 / 15, color: '#f97316' },
            { midi: 54, name: '파#', octave: 'F#3', left: 400 / 15, color: '#84cc16' },
            { midi: 56, name: '솔#', octave: 'G#3', left: 500 / 15, color: '#22c55e' },
            { midi: 58, name: '라#', octave: 'A#3', left: 600 / 15, color: '#14b8a6' },
            { midi: 61, name: '도#', octave: 'C#4', left: 800 / 15, color: '#3b82f6' },
            { midi: 63, name: '레#', octave: 'D#4', left: 900 / 15, color: '#6366f1' },
            { midi: 66, name: '파#', octave: 'F#4', left: 1100 / 15, color: '#a855f7' },
            { midi: 68, name: '솔#', octave: 'G#4', left: 1200 / 15, color: '#d946ef' },
            { midi: 70, name: '라#', octave: 'A#4', left: 1300 / 15, color: '#ec4899' }
        ];
        const MIDI_TO_KEY = new Map(PIANO_KEYS.map((key, index) => [key.midi, index]));
        const BLACK_MIDI_SET = new Set(BLACK_KEYS.map(key => key.midi));
        const WHITE_NOTE_INDEX = new Map([
            [0, 0],
            [2, 1],
            [4, 2],
            [5, 3],
            [7, 4],
            [9, 5],
            [11, 6]
        ]);

        const els = {
            startOverlay: document.getElementById('start-overlay'),
            resultOverlay: document.getElementById('result-overlay'),
            howtoModal: document.getElementById('howto-modal'),
            btnStart: document.getElementById('btn-start'),
            btnHowto: document.getElementById('btn-howto'),
            btnHowtoClose: document.getElementById('btn-howto-close'),
            btnAgain: document.getElementById('btn-again'),
            pixelLoader: document.getElementById('pixel-loader'),
            loaderBar: document.getElementById('loader-bar-inner'),
            introActions: document.getElementById('intro-actions'),
            playerZone: document.getElementById('player-zone'),
            playerImg: document.getElementById('player-img'),
            copyMark: document.getElementById('copy-mark'),
            midiSummary: document.getElementById('midi-summary'),
            orbs: document.getElementById('orbs'),
            keyboard: document.getElementById('keyboard'),
            sequenceLabel: document.getElementById('sequence-label'),
            sequenceChips: document.getElementById('sequence-chips'),
            finalScore: document.getElementById('final-score')
        };

        const state = {
            phase: 'intro',
            score: 0,
            answers: [],
            sequence: [],
            sequenceIndex: 0,
            nextRoundTimer: 0,
            copyTimer: 0,
            playerAnimationTimer: 0,
            keyFlashTimer: 0,
            demoTimers: [],
            midiInput: null,
            midiSetupStarted: false,
            connected: false,
            pianoSamplePlayers: new Map()
        };

        function padImageNumber(number) {
            return String(number).padStart(2, '0');
        }

        function playerSrc(frameNumber) {
            return `${IMAGE_BASE}1P-${padImageNumber(frameNumber)}.webp`;
        }

        function clearTimers() {
            clearTimeout(state.nextRoundTimer);
            clearTimeout(state.copyTimer);
            clearTimeout(state.playerAnimationTimer);
            clearTimeout(state.keyFlashTimer);
            state.demoTimers.forEach(timer => clearTimeout(timer));
            state.nextRoundTimer = 0;
            state.copyTimer = 0;
            state.playerAnimationTimer = 0;
            state.keyFlashTimer = 0;
            state.demoTimers = [];
        }

        function createKeyboard() {
            els.keyboard.innerHTML = '';
            const whiteRow = document.createElement('div');
            whiteRow.className = 'white-keys';
            PIANO_KEYS.forEach((key, index) => {
                const button = document.createElement('button');
                button.className = 'piano-key white-key';
                button.type = 'button';
                button.dataset.keyIndex = String(index);
                button.dataset.midi = String(key.midi);
                button.style.setProperty('--key-color', key.color);
                whiteRow.appendChild(button);
            });
            els.keyboard.appendChild(whiteRow);
            BLACK_KEYS.forEach(key => {
                const button = document.createElement('button');
                button.className = 'piano-key black-key';
                button.type = 'button';
                button.dataset.midi = String(key.midi);
                button.style.setProperty('--black-left', String(key.left));
                button.style.setProperty('--key-color', key.color);
                els.keyboard.appendChild(button);
            });
        }

        function startGame() {
            requestMidiOnDemand();
            preloadPianoSamples();
            startBgm();
            bgmAudio.volume = 0.03;
            startGameLoopAudio();
            clearTimers();
            hideCopyMark();
            state.phase = state.connected ? 'ready' : 'waiting-midi';
            state.score = 0;
            state.answers = [];
            state.sequence = [];
            state.sequenceIndex = 0;
            els.playerImg.src = playerSrc(1);
            els.startOverlay.classList.add('hidden');
            els.resultOverlay.classList.add('hidden');
            els.howtoModal.classList.add('hidden');
            renderProgress();
            renderSequence();
            if (state.connected) {
                state.nextRoundTimer = setTimeout(startRound, AUTO_NEXT_MS);
            } else {
                els.sequenceLabel.textContent = 'MIDI 피아노 연결 대기 중';
            }
        }

        function showIntro() {
            clearTimers();
            hideCopyMark();
            state.phase = 'intro';
            state.score = 0;
            state.answers = [];
            state.sequence = [];
            state.sequenceIndex = 0;
            els.playerImg.src = playerSrc(1);
            els.resultOverlay.classList.add('hidden');
            els.howtoModal.classList.add('hidden');
            els.startOverlay.classList.remove('hidden');
            els.sequenceLabel.textContent = 'MIDI 피아노 연결 후 게임을 시작하세요.';
            renderProgress();
            renderSequence();
            initIntroLoader();
        }

        function initIntroLoader() {
            let progress = 0;
            els.pixelLoader.classList.remove('hidden');
            els.introActions.classList.add('hidden');
            els.loaderBar.style.width = '0%';
            const loaderTimer = setInterval(() => {
                progress += 5;
                els.loaderBar.style.width = `${progress}%`;
                if (progress >= 100) {
                    clearInterval(loaderTimer);
                    els.pixelLoader.classList.add('hidden');
                    els.introActions.classList.remove('hidden');
                }
            }, 45);
        }

        function startRound() {
            if (!state.connected) {
                state.phase = 'waiting-midi';
                els.sequenceLabel.textContent = 'MIDI 피아노 연결 대기 중';
                return;
            }
            if (state.score >= TOTAL_ROUNDS) return;
            state.phase = 'demo';
            state.sequenceIndex = 0;
            state.sequence = makeSequence(ROUND_LENGTHS[state.score]);
            els.sequenceLabel.textContent = `${state.sequence.length}개 건반을 잘 듣고 기억하세요.`;
            renderSequence();
            playDemoSequence(0);
        }

        function makeSequence(length) {
            const sequence = [];
            let previous = -1;
            for (let i = 0; i < length; i += 1) {
                let next = Math.floor(Math.random() * PIANO_KEYS.length);
                if (PIANO_KEYS.length > 1) {
                    while (next === previous) next = Math.floor(Math.random() * PIANO_KEYS.length);
                }
                sequence.push(next);
                previous = next;
            }
            return sequence;
        }

        function handlePianoInput(keyIndex) {
            if (state.phase !== 'playing') return;
            const expected = state.sequence[state.sequenceIndex];
            playTone(keyIndex);
            flashKey(keyIndex, keyIndex === expected ? 'active' : 'wrong');
            if (keyIndex !== expected) {
                handleWrongInput();
                return;
            }
            state.sequenceIndex += 1;
            renderSequence();
            if (state.sequenceIndex >= state.sequence.length) {
                handleRoundSuccess();
                return;
            }
        }

        function handleRoundSuccess() {
            state.phase = 'ready';
            const color = PIANO_KEYS[state.sequence[state.sequence.length - 1]].color;
            state.score += 1;
            state.answers.push(color);
            els.sequenceLabel.textContent = '성공!';
            clearExpectedKeys();
            animatePlayerSuccess();
            showSuccessMark();
            renderProgress();
            if (state.score >= TOTAL_ROUNDS) {
                state.nextRoundTimer = setTimeout(finishGame, AUTO_NEXT_MS);
                return;
            }
            state.nextRoundTimer = setTimeout(startRound, AUTO_NEXT_MS);
        }

        function handleWrongInput() {
            state.phase = 'ready';
            state.sequenceIndex = 0;
            els.sequenceLabel.textContent = '틀렸어요. 다시 듣고 기억해요.';
            clearExpectedKeys();
            showFailureMark();
            animatePlayerWrong();
            state.nextRoundTimer = setTimeout(startRound, WRONG_HOLD_MS);
        }

        function renderSequence() {
            els.sequenceChips.innerHTML = '';
            state.sequence.forEach((keyIndex, index) => {
                const key = PIANO_KEYS[keyIndex];
                const chip = document.createElement('span');
                chip.className = 'note-chip';
                const octave = key.octave.replace(/[A-G]/, '');
                chip.textContent = state.phase === 'demo' && index === state.sequenceIndex
                    ? `${key.name}${octave}`
                    : '?';
                chip.style.setProperty('--chip-color', key.color);
                if (index < state.sequenceIndex) chip.classList.add('done');
                if (index === state.sequenceIndex && (state.phase === 'playing' || state.phase === 'demo')) chip.classList.add('current');
                els.sequenceChips.appendChild(chip);
            });
        }

        function playDemoSequence(index) {
            if (state.phase !== 'demo') return;
            clearExpectedKeys();
            if (index >= state.sequence.length) {
                state.sequenceIndex = 0;
                state.phase = 'playing';
                els.sequenceLabel.textContent = '기억한 순서대로 연주하세요.';
                renderSequence();
                return;
            }

            state.sequenceIndex = index;
            renderSequence();
            const keyIndex = state.sequence[index];
            playTone(keyIndex);
            flashKey(keyIndex, 'active', DEMO_NOTE_MS);

            const timer = setTimeout(() => {
                playDemoSequence(index + 1);
            }, DEMO_NOTE_MS + DEMO_GAP_MS);
            state.demoTimers.push(timer);
        }

        function renderProgress() {
            els.finalScore.textContent = state.score;
            els.orbs.innerHTML = '';
            for (let i = 0; i < TOTAL_ROUNDS; i += 1) {
                const orb = document.createElement('span');
                orb.className = 'progress-orb';
                if (state.answers[i]) orb.style.backgroundColor = state.answers[i];
                els.orbs.appendChild(orb);
            }
        }

        function clearExpectedKeys() {
            els.keyboard.querySelectorAll('.expected').forEach(key => key.classList.remove('expected'));
        }

        function markExpectedKey() {
            clearExpectedKeys();
            const expected = state.sequence[state.sequenceIndex];
            const key = els.keyboard.querySelector(`[data-key-index="${expected}"]`);
            if (key) key.classList.add('expected');
        }

        function flashKey(keyIndex, className, duration = 180) {
            const key = els.keyboard.querySelector(`[data-key-index="${keyIndex}"]`);
            flashKeyElement(key, className, duration);
        }

        function flashMidiKey(midi, className, duration = 180) {
            const key = els.keyboard.querySelector(`[data-midi="${midi}"]`);
            flashKeyElement(key, className, duration);
        }

        function flashKeyElement(key, className, duration = 180) {
            if (!key) return;
            key.classList.add(className);
            clearTimeout(state.keyFlashTimer);
            state.keyFlashTimer = setTimeout(() => key.classList.remove('active', 'wrong'), duration);
        }

        function animatePlayerSuccess() {
            const successFrames = [1, 2, 3, 2, 1];
            playPlayerFrames(successFrames, 90);
        }

        function animatePlayerWrong() {
            clearTimeout(state.playerAnimationTimer);
            els.playerImg.src = playerSrc(4);
            state.playerAnimationTimer = setTimeout(() => {
                els.playerImg.src = playerSrc(1);
                state.playerAnimationTimer = 0;
            }, WRONG_HOLD_MS);
        }

        function playPlayerFrames(frames, frameMs) {
            let index = 0;
            clearTimeout(state.playerAnimationTimer);
            const next = () => {
                els.playerImg.src = playerSrc(frames[index]);
                index += 1;
                if (index < frames.length) {
                    state.playerAnimationTimer = setTimeout(next, frameMs);
                } else {
                    state.playerAnimationTimer = 0;
                }
            };
            next();
        }

        function showSuccessMark() {
            els.copyMark.src = SUCCESS_MARK_SRC;
            els.copyMark.alt = '성공';
            showCopyMark();
        }

        function showFailureMark() {
            els.copyMark.src = FAILURE_MARK_SRC;
            els.copyMark.alt = '실패';
            showCopyMark();
        }

        function showCopyMark() {
            clearTimeout(state.copyTimer);
            els.copyMark.classList.add('visible');
            state.copyTimer = setTimeout(hideCopyMark, COPY_VISIBLE_MS);
        }

        function hideCopyMark() {
            clearTimeout(state.copyTimer);
            state.copyTimer = 0;
            els.copyMark.classList.remove('visible');
        }

        function finishGame() {
            state.phase = 'result';
            hideCopyMark();
            clearExpectedKeys();
            bgmAudio.volume = 0.06;
            stopGameLoopAudio();
            els.resultOverlay.classList.remove('hidden');
        }

        function startBgm() {
            if (bgmPlaying) return;
            prepareAudio(bgmAudio, SOUND_SOURCES.bgm);
            bgmAudio.play().then(() => {
                bgmPlaying = true;
            }).catch(err => console.log('BGM play blocked:', err));
        }

        function playClickSound() {
            prepareAudio(clickAudio, SOUND_SOURCES.click);
            clickAudio.currentTime = 0;
            clickAudio.play().catch(err => console.log('Click sound blocked:', err));
        }

        function startGameLoopAudio() {
            if (gameLoopPlaying) return;
            prepareAudio(gameLoopAudio, SOUND_SOURCES.loop);
            gameLoopAudio.currentTime = 0;
            gameLoopAudio.play().then(() => {
                gameLoopPlaying = true;
            }).catch(err => console.log('Game loop audio blocked:', err));
        }

        function stopGameLoopAudio() {
            if (!gameLoopPlaying) return;
            gameLoopAudio.pause();
            gameLoopAudio.currentTime = 0;
            gameLoopPlaying = false;
        }

        function prepareAudio(audio, src) {
            if (!audio.src) audio.src = src;
        }

        async function setupMidi() {
            state.midiSetupStarted = true;
            if (!navigator.requestMIDIAccess) {
                setConnection(false, '이 브라우저는 MIDI 연결을 지원하지 않습니다.');
                return;
            }
            try {
                const access = await navigator.requestMIDIAccess();
                const bindInput = () => {
                    const inputs = Array.from(access.inputs.values()).filter(input => input.state !== 'disconnected');
                    if (state.midiInput && !inputs.includes(state.midiInput)) {
                        state.midiInput.onmidimessage = null;
                        state.midiInput = null;
                    }
                    state.midiInput = inputs[0] || null;
                    if (state.midiInput) {
                        state.midiInput.onmidimessage = handleMidiMessage;
                        setConnection(true, 'MIDI 준비 완료');
                    } else {
                        setConnection(false, 'MIDI 피아노 연결 대기 중');
                    }
                };
                access.onstatechange = bindInput;
                bindInput();
            } catch (error) {
                setConnection(false, '피아노 권한을 허용해 주세요.');
            }
        }

        function requestMidiOnDemand() {
            if (state.midiSetupStarted) return;
            els.midiSummary.textContent = 'MIDI 연결 확인 중';
            setupMidi();
        }

        function setConnection(connected, text) {
            const wasConnected = state.connected;
            state.connected = connected;
            els.playerZone.classList.toggle('connected', connected);
            els.midiSummary.textContent = text;
            if (!connected && state.phase !== 'intro' && state.phase !== 'result') {
                state.phase = 'waiting-midi';
                clearExpectedKeys();
                els.sequenceLabel.textContent = 'MIDI 피아노 연결 대기 중';
            }
            if (connected && !wasConnected && state.phase === 'waiting-midi') {
                state.nextRoundTimer = setTimeout(startRound, AUTO_NEXT_MS);
            }
        }

        function handleMidiMessage(event) {
            const [status, note, velocity = 0] = event.data;
            const command = status & 0xf0;
            if (command !== 0x90 || velocity < MIDI_MIN_VELOCITY) return;
            const keyIndex = midiNoteToKeyIndex(note);
            if (state.phase !== 'playing') {
                playMidiTone(note);
                if (keyIndex === undefined) {
                    flashMidiKey(note, 'active');
                } else {
                    flashKey(keyIndex, 'active');
                }
                return;
            }
            if (keyIndex === undefined) {
                playMidiTone(note);
                flashMidiKey(note, BLACK_MIDI_SET.has(note) ? 'wrong' : 'active');
                handleWrongInput();
                return;
            }
            handlePianoInput(keyIndex);
        }

        function midiNoteToKeyIndex(note) {
            if (MIDI_TO_KEY.has(note)) return MIDI_TO_KEY.get(note);
            const pitchClass = ((note % 12) + 12) % 12;
            const whiteIndex = WHITE_NOTE_INDEX.get(pitchClass);
            if (whiteIndex === undefined) return undefined;
            const octave = Math.floor(note / 12) - 1;
            const c3BasedIndex = (octave - 3) * 7 + whiteIndex;
            if (c3BasedIndex >= 0 && c3BasedIndex < PIANO_KEYS.length) return c3BasedIndex;
            const wrappedIndex = ((c3BasedIndex % 7) + 7) % 7;
            const preferredOctaveOffset = c3BasedIndex < 0 ? 0 : 7;
            return Math.min(PIANO_KEYS.length - 1, preferredOctaveOffset + wrappedIndex);
        }

        function playTone(keyIndex) {
            playMidiTone(PIANO_KEYS[keyIndex].midi);
        }

        function playMidiTone(midi) {
            playSalamanderSample(midi);
        }

        function chooseSalamanderSample(midi) {
            return SALAMANDER_SAMPLE_MAP.reduce((best, sample) => {
                const bestDistance = Math.abs(midi - best.center);
                const sampleDistance = Math.abs(midi - sample.center);
                return sampleDistance < bestDistance ? sample : best;
            }, SALAMANDER_SAMPLE_MAP[0]);
        }

        function getPianoSamplePlayer(sample) {
            if (state.pianoSamplePlayers.has(sample.file)) {
                return state.pianoSamplePlayers.get(sample.file);
            }
            const sampleAudio = new Audio(`${PIANO_SAMPLE_BASE}${sample.file}`);
            sampleAudio.preload = 'auto';
            sampleAudio.volume = 0.74;
            sampleAudio.load();
            state.pianoSamplePlayers.set(sample.file, sampleAudio);
            return sampleAudio;
        }

        function preloadPianoSamples() {
            SALAMANDER_SAMPLE_MAP.forEach(sample => getPianoSamplePlayer(sample));
        }

        function playSalamanderSample(midi) {
            const sample = chooseSalamanderSample(midi);
            const basePlayer = getPianoSamplePlayer(sample);
            const player = basePlayer.cloneNode(true);
            player.volume = 0.74;
            player.playbackRate = Math.pow(2, (midi - sample.center) / 12);
            player.currentTime = 0;
            player.play().catch(error => console.log('Piano sample play blocked:', error));
        }

        function restartGameBtn() {
            playClickSound();
            stopGameLoopAudio();
            bgmAudio.volume = 0.06;
            showIntro();
        }

        function exitGame() {
            playClickSound();
            stopGameLoopAudio();
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'gameExit' }, '*');
            }
            history.back();
        }

        els.btnStart.addEventListener('click', () => {
            playClickSound();
            startGame();
        });
        els.btnAgain.addEventListener('click', () => {
            playClickSound();
            startGame();
        });
        els.btnHowto.addEventListener('click', () => {
            playClickSound();
            els.howtoModal.classList.remove('hidden');
        });
        els.btnHowtoClose.addEventListener('click', () => {
            playClickSound();
            els.howtoModal.classList.add('hidden');
        });
        els.howtoModal.addEventListener('click', event => {
            if (event.target === els.howtoModal) els.howtoModal.classList.add('hidden');
        });

        createKeyboard();
        showIntro();
    </script>

    <script src="../../js/web-learning-midi-status.js?v=20260618-04" data-instrument="piano" defer></script>
