<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>도레미 피아노 건반 놀이</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* [Core Reset & Safe Area] */
        :root {
            --gnb-height: 60px;
            --app-bg: #fff1f2;
        }

        body {
            font-family: 'Jua', sans-serif;
            background-color: var(--app-bg);
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            height: 100vh;
            width: 100vw;
        }

        /* [GNB Styles] */
        #gnb {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--gnb-height);
            background-color: #FEE500;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* [Game Container & Scaling] */
        #game-container {
            position: absolute;
            top: var(--gnb-height);
            left: 0;
            width: 100%;
            height: calc(100vh - var(--gnb-height));
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: var(--app-bg);
        }

        /* The scalable wrapper */
        #scalable-wrapper {
            width: 1280px;
            height: 720px;
            position: relative;
            transform-origin: center center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* [Piano Styles Adapted for Scaled Container] */
        .piano-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            background: #333;
            padding: 10px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .white-key {
            flex: 1;
            background: white;
            border: 1px solid #ccc;
            border-radius: 0 0 10px 10px;
            margin: 0 2px;
            height: 100%;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 20px;
            cursor: pointer;
            transition: background-color 0.1s, transform 0.1s;
            box-shadow: inset 0 -10px 20px rgba(0, 0, 0, 0.1);
            will-change: transform;
            /* Performance */
        }

        .white-key:active,
        .white-key.active {
            background: #f0f0f0;
            transform: scaleY(0.98);
            box-shadow: inset 0 -5px 10px rgba(0, 0, 0, 0.1);
        }

        .white-key.playing {
            background: linear-gradient(to top, var(--key-color) 0%, white 100%) !important;
            transform: scaleY(0.98);
        }

        .black-key {
            position: absolute;
            top: 0;
            width: 8%;
            height: 60%;
            background: linear-gradient(to bottom, #333 0%, #000 100%);
            border-radius: 0 0 10px 10px;
            z-index: 10;
            cursor: pointer;
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.4);
            transition: transform 0.1s;
            will-change: transform;
            /* Performance */
        }

        .black-key:active,
        .black-key.active {
            transform: scaleY(0.95);
            background: #222;
        }

        /* Black Key Positioning */
        .bk-0 {
            left: calc(12.5% - 4%);
        }

        .bk-1 {
            left: calc(25% - 4%);
        }

        .bk-2 {
            left: calc(50% - 4%);
        }

        .bk-3 {
            left: calc(62.5% - 4%);
        }

        .bk-4 {
            left: calc(75% - 4%);
        }

        /* Animations */
        .bounce {
            animation: bounce 2s infinite;
        }

        @keyframes bounce {

            0%,
            20%,
            50%,
            80%,
            100% {
                transform: translateY(0);
            }

            40% {
                transform: translateY(-15px);
            }

            60% {
                transform: translateY(-7px);
            }
        }

        .shake {
            animation: shake 0.5s;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25%,
            75% {
                transform: translateX(-10px);
            }

            50% {
                transform: translateX(10px);
            }
        }

        .modal-enter {
            animation: modalFadeIn 0.3s forwards;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* UI Components */
        .btn-press {
            transition: transform 0.1s;
        }

        .btn-press:active {
            transform: scale(0.95);
        }

        /* Typography adjustments for scaled container */
        .text-scale-title {
            font-size: 4.5rem;
        }

        .text-scale-lg {
            font-size: 2.5rem;
        }

        .text-scale-md {
            font-size: 1.8rem;
        }

        .text-scale-sm {
            font-size: 1.4rem;
        }
    </style>
</head>

        const whiteNotes = [
            { id: 'do', name: 'do', freq: 261.63, color: '#FF6B6B' },

            { id: 'res', freq: 311.13, posIndex: 1 },
            { id: 'fas', freq: 369.99, posIndex: 2 },

        // --- [2. Global State] ---
        let currentLang = 'ko';
        let audioCtx = null;
        let ttsAudio = null;
        let currentUtterance = null; // Prevent GC of utterance
        let playedNotes = new Set();
        let isQuizMode = false;

        let currentQuizIndex = 0;

        let googleTTSAvailable = true;

        // --- [Voice Loader] ---
        let availableVoices = [];
        function loadVoices() {
            availableVoices = window.speechSynthesis.getVoices();
        }
        if (window.speechSynthesis.onvoiceschanged !== undefined) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
        }
        loadVoices();

        // --- [3. System Functions (Audio, TTS, Scaling)] ---
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playNote(freq) {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.02);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.0);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 1.0);
        }

        function playSFX(type) {
            initAudio();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(660, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                osc.start();
                osc.stop(now + 0.5);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(100, now + 0.3);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                osc.start();
                osc.stop(now + 0.3);
            } else if (type === 'victory') {
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.type = 'triangle';
                    o.frequency.value = freq;
                    g.gain.setValueAtTime(0, now + i * 0.1);
                    g.gain.linearRampToValueAtTime(0.2, now + i * 0.1 + 0.05);
                    g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.5);
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.start(now + i * 0.1);
                    o.stop(now + i * 0.1 + 0.6);
                });
            }
        }

        function stopTTS() {
            if (ttsAudio) {
                ttsAudio.pause();
                ttsAudio.currentTime = 0;
                ttsAudio = null;
            }
            window.speechSynthesis.cancel();
            currentUtterance = null;
        }

        async function speak(keyOrText, isRaw = false) {
            stopTTS();
            const text = isRaw ? keyOrText : (I18N_DATA[currentLang][keyOrText] || keyOrText);
            if (!text) return;

            if (!googleTTSAvailable) {
                fallbackSpeak(text);
                return;
            }

            const langCode = currentLang === 'ko' ? 'ko-KR' : 'en-US';
            const voiceName = currentLang === 'ko' ? 'ko-KR-Standard-A' : 'en-US-Standard-E';
            console.log(`[TTS] Requesting Google Cloud TTS for: "${text}"`);

            try {
                const response = await fetch(`https://texttospeech.googleapis.com/v1/text:synthesize?key=${GOOGLE_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        input: { text: text },
                        voice: { languageCode: langCode, name: voiceName },
                        audioConfig: { audioEncoding: 'MP3' }
                    })
                });

                if (!response.ok) throw new Error(`API Error: ${response.status}`);

                const data = await response.json();
                if (data.audioContent) {
                    const audioBlob = await fetch(`data:audio/mp3;base64,${data.audioContent}`).then(res => res.blob());
                    const audioUrl = URL.createObjectURL(audioBlob);
                    ttsAudio = new Audio(audioUrl);
                    ttsAudio.play().catch(e => console.error("Audio Playback Error:", e));
                } else {
                    console.warn("Google TTS Error/Fallback: No content", data);
                    fallbackSpeak(text);
                }
            } catch (e) {
                console.warn("Google TTS failed (switching to offline mode):", e);
                googleTTSAvailable = false;
                fallbackSpeak(text);
            }
        }

        function fallbackSpeak(text) {
            // Ensure no overlap
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            currentUtterance = utterance; // Prevent GC

            const isEnglish = currentLang !== 'ko';
            utterance.lang = isEnglish ? 'en-US' : 'ko-KR';
            utterance.rate = 0.9;

            if (availableVoices.length === 0) availableVoices = window.speechSynthesis.getVoices();

            if (isEnglish) {
                const targetVoices = ["Google US English", "Samantha", "Microsoft Zira", "Karen", "Tessa"];
                let selectedVoice = availableVoices.find(v => targetVoices.some(target => v.name.includes(target)));
                if (!selectedVoice) selectedVoice = availableVoices.find(v => v.lang === 'en-US');
                if (selectedVoice) utterance.voice = selectedVoice;
            } else {
                const koVoice = availableVoices.find(v => v.name.includes('Google 한국어') || v.lang === 'ko-KR');
                if (koVoice) utterance.voice = koVoice;
            }

            utterance.onend = function () {
                currentUtterance = null;
            };
            utterance.onerror = function (e) {
                // Ignore interruption errors
                if (e.error === 'canceled' || e.error === 'interrupted') {
                    return;
                }
                console.error("Browser TTS Error:", e);
                currentUtterance = null;
            };

            window.speechSynthesis.speak(utterance);
        }

        // --- [4. Logic & Game Functions] ---
        function getNoteName(id) {
            const map = {
                'do': 'noteDo', 're': 'noteRe', 'mi': 'noteMi', 'fa': 'noteFa',
                'sol': 'noteSol', 'la': 'noteLa', 'si': 'noteSi', 'do2': 'noteDo2'
            };
            return I18N_DATA[currentLang][map[id]];
        }

        function renderPiano(container, isQuiz = false) {
            container.innerHTML = '';

            // White Keys
            whiteNotes.forEach((note) => {
                const key = document.createElement('div');
                key.className = 'white-key group';
                key.style.setProperty('--key-color', note.color);

                const noteName = getNoteName(note.id);
                const subText = (note.id === 'do2' && currentLang === 'ko') ? '높은' : (note.id === 'do2' && currentLang === 'en' ? 'High' : '');

                const labelOpacity = isQuiz ? 'opacity-0' : 'opacity-100';
                const isLearned = !isQuiz && playedNotes.has(note.id);
                const checkClass = isLearned ? 'scale-100 opacity-100' : 'scale-0 opacity-0';

                key.innerHTML = `
                    <div class="mb-[1vmin] transition-all duration-300 ${labelOpacity} flex flex-col items-center pointer-events-none">
                        ${subText ? `<span class="text-[1.5vmin] text-gray-500 font-bold">${subText}</span>` : ''}
                        <span class="text-[3vmin] font-bold text-gray-800" style="color:${note.color}">${noteName}</span>
                    </div>
                    ${!isQuiz ? `<div id="check-${note.id}" class="absolute bottom-[6vmin] text-green-500 transition-all duration-300 transform ${checkClass}">
                        <i data-lucide="check-circle" class="w-[4vmin] h-[4vmin]"></i>
                    </div>` : ''}
                `;

                key.onclick = () => {
                    playNote(note.freq);
                    key.classList.add('playing');
                    setTimeout(() => key.classList.remove('playing'), 200);

                    if (!isQuiz) {
                        handleLearningClick(note);
                    } else {
                        handleQuizAnswer(note, key);
                    }
                };
                container.appendChild(key);
            });

            // Black Keys
            blackNotes.forEach((note) => {
                const key = document.createElement('div');
                key.className = `black-key bk-${note.posIndex}`;
                key.onclick = (e) => {
                    e.stopPropagation();
                    playNote(note.freq);
                    key.classList.add('active');
                    setTimeout(() => key.classList.remove('active'), 200);
                };
                container.appendChild(key);
            });
            lucide.createIcons();
        }

        function handleLearningClick(note) {
            if (!playedNotes.has(note.id)) {
                playedNotes.add(note.id);
                const checkEl = document.getElementById(`check-${note.id}`);
                if (checkEl) {
                    checkEl.classList.remove('scale-0', 'opacity-0');
                    checkEl.classList.add('scale-100', 'opacity-100', 'bounce');
                }
                updateLearningUI();
            }
        }

        function updateLearningUI() {
            const playedCount = playedNotes.size;
            const totalCount = whiteNotes.length;
            const isComplete = playedCount === totalCount;
            const quizBtn = document.getElementById('quiz-btn');

            let instText = I18N_DATA[currentLang].instructionInit
                .replace('{current}', playedCount).replace('{total}', totalCount);

            if (isComplete) {
                instText = I18N_DATA[currentLang].readyQuiz;
                quizBtn.disabled = false;
                quizBtn.classList.remove('bg-gray-300', 'cursor-not-allowed');
                quizBtn.classList.add('bg-green-500', 'hover:bg-green-600', 'bounce');
                quizBtn.innerHTML = `<span>${I18N_DATA[currentLang].quizStart}</span> <i data-lucide="play-circle" class="w-8 h-8"></i>`;
                lucide.createIcons();
            } else {
                quizBtn.disabled = true;
                quizBtn.classList.add('bg-gray-300', 'cursor-not-allowed');
                quizBtn.classList.remove('bg-green-500', 'hover:bg-green-600', 'bounce');
                quizBtn.innerHTML = `<span>${I18N_DATA[currentLang].quizLocked}</span> <i data-lucide="lock" class="w-8 h-8"></i>`;
                lucide.createIcons();
            }
            document.getElementById('instruction-text').innerText = instText;
        }

        function startQuiz() {
            stopTTS();
            initAudio();
            isQuizMode = true;
            document.getElementById('learning-section').classList.add('hidden');
            document.getElementById('quiz-section').classList.remove('hidden');
            document.getElementById('quiz-section').classList.add('flex');
            document.getElementById('progress-container').classList.remove('hidden');

            renderPiano(document.getElementById('quiz-piano-board'), true);

            quizQueue = [...whiteNotes].sort(() => Math.random() - 0.5).slice(0, 5);
            currentQuizIndex = 0;
            updateProgressBar();
            loadNextQuestion();
        }

        function loadNextQuestion() {
            document.getElementById('feedback-message').style.opacity = '0';
            if (currentQuizIndex >= quizQueue.length) {
                showEndScreen();
                return;
            }

            const targetNote = quizQueue[currentQuizIndex];
            const qColor = targetNote.color;
            let displayName = getNoteName(targetNote.id);
            if (targetNote.id === 'do2') {
                displayName = (currentLang === 'ko' ? "높은 " : "High ") + displayName;
            }

            const qText = `<span style="color:${qColor}; text-shadow: 1px 1px 0 #00000020;">${displayName}</span>`;
            const rawText = I18N_DATA[currentLang].playNote.replace('{note}', displayName);
            const htmlText = I18N_DATA[currentLang].playNote.replace('{note}', qText);

            document.getElementById('quiz-question-text').innerHTML = htmlText;
            speak(rawText, true);
        }

        function handleQuizAnswer(selectedNote, element) {
            const targetNote = quizQueue[currentQuizIndex];
            const feedback = document.getElementById('feedback-message');

            if (selectedNote.id === targetNote.id) {
                playSFX('correct');
                feedback.innerText = I18N_DATA[currentLang].correct;
                feedback.className = "h-16 text-4xl font-bold text-center text-green-500 transition-opacity duration-300 opacity-100 shrink-0 drop-shadow-sm";
                fireConfettiBurst();
                // TTS Feedback
                speak(I18N_DATA[currentLang].correct, true);

                setTimeout(() => {
                    currentQuizIndex++;
                    updateProgressBar();
                    loadNextQuestion();
                }, 1500); // Increased slightly for TTS
            } else {
                playSFX('wrong');
                element.classList.add('shake');
                setTimeout(() => element.classList.remove('shake'), 500);
                feedback.innerText = I18N_DATA[currentLang].wrong;
                feedback.className = "h-16 text-4xl font-bold text-center text-orange-500 transition-opacity duration-300 opacity-100 shrink-0 drop-shadow-sm";
                // TTS Feedback
                speak(I18N_DATA[currentLang].wrong, true);
            }
        }

        function updateProgressBar() {
            const pct = (currentQuizIndex / quizQueue.length) * 100;
            document.getElementById('progress-bar').style.width = `${pct}%`;
        }

        function showEndScreen() {
            stopTTS();
            document.getElementById('quiz-section').classList.add('hidden');
            document.getElementById('quiz-section').classList.remove('flex');
            document.getElementById('progress-container').classList.add('hidden');
            document.getElementById('end-section').classList.remove('hidden');
            document.getElementById('end-section').classList.add('flex');
            playSFX('victory');
            startConfettiLoop();
            setTimeout(stopConfettiLoop, 3000);

            // TTS Result (Full Voice)
            const resultText = `${I18N_DATA[currentLang].greatJob} ${I18N_DATA[currentLang].allLearned}`;
            speak(resultText, true);
        }

        function resetGame() {
            stopTTS();
            playedNotes.clear();
            isQuizMode = false;

            document.getElementById('intro-screen').classList.remove('hidden');
            document.getElementById('app-content').classList.add('hidden');
            document.getElementById('quiz-section').classList.add('hidden');
            document.getElementById('quiz-section').classList.remove('flex');
            document.getElementById('end-section').classList.add('hidden');
            document.getElementById('end-section').classList.remove('flex');
            document.getElementById('progress-container').classList.add('hidden');
            document.getElementById('learning-section').classList.remove('hidden');
            document.getElementById('btn-restart').classList.add('hidden');

            const quizBtn = document.getElementById('quiz-btn');
            quizBtn.disabled = true;
            quizBtn.classList.add('bg-gray-300', 'cursor-not-allowed');
            quizBtn.classList.remove('bg-green-500', 'hover:bg-green-600', 'bounce');
            quizBtn.innerHTML = `<span>${I18N_DATA[currentLang].quizLocked}</span> <i data-lucide="lock" class="w-8 h-8"></i>`;

            stopConfettiLoop();
            lucide.createIcons();
        }

        // --- [5. UI & Event Listeners] ---
        function updateTexts() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (I18N_DATA[currentLang][key]) {
                    el.innerText = I18N_DATA[currentLang][key];
                }
            });
            if (!isQuizMode) {
                renderPiano(document.getElementById('piano-board'), false);
                updateLearningUI();
            }
        }

        function resizeGame() {
            const container = document.getElementById('game-container');
            const wrapper = document.getElementById('scalable-wrapper');
            const cw = container.clientWidth;
            const ch = container.clientHeight;
            const baseW = 1280;
            const baseH = 720;
            const scale = Math.min(cw / baseW, ch / baseH);
            wrapper.style.transform = `scale(${scale})`;
        }
        window.addEventListener('resize', resizeGame);

        document.getElementById('btn-lang').onclick = () => {
            currentLang = currentLang === 'ko' ? 'en' : 'ko';
            updateTexts();
            speak(currentLang === 'ko' ? '한국어' : 'English', true);
        };

        document.getElementById('btn-start').onclick = () => {
            stopTTS();
            initAudio();
            document.getElementById('intro-screen').classList.add('hidden');
            document.getElementById('app-content').classList.remove('hidden');
            document.getElementById('app-content').classList.add('flex');
            document.getElementById('btn-restart').classList.remove('hidden');
            renderPiano(document.getElementById('piano-board'), false);

            // TTS Instruction (Full Voice)
            speak('instructionInit');
        };

        document.getElementById('quiz-btn').onclick = startQuiz;
        document.getElementById('btn-restart').onclick = resetGame;
        document.getElementById('btn-restart-inner').onclick = resetGame;

        const infoModal = document.getElementById('modal-info');
        const exitModal = document.getElementById('modal-exit');

        document.getElementById('btn-howto').onclick = () => {
            stopTTS();
            infoModal.classList.remove('hidden');
            const i18n = I18N_DATA[currentLang];
            let fullText = "";
            if (currentLang === 'ko') {
                fullText = `${i18n.howToPlay}! 첫째, ${i18n.guide1Title}. ${i18n.guide1Desc}. 둘째, ${i18n.guide2Title}. ${i18n.guide2Desc}. 셋째, ${i18n.guide3Title}. ${i18n.guide3Desc}.`;
            } else {
                fullText = `${i18n.howToPlay}! First, ${i18n.guide1Title}. ${i18n.guide1Desc}. Second, ${i18n.guide2Title}. ${i18n.guide2Desc}. Third, ${i18n.guide3Title}. ${i18n.guide3Desc}.`;
            }
            speak(fullText, true);
        };

        document.querySelectorAll('.btn-close-modal').forEach(btn => {
            btn.onclick = () => {
                stopTTS();
                infoModal.classList.add('hidden');
            };
        });

        document.getElementById('btn-exit').onclick = () => {
            stopTTS();
            exitModal.classList.remove('hidden');
            speak('exitConfirm');
        };
        document.getElementById('btn-cancel-exit').onclick = () => {
            stopTTS();
            exitModal.classList.add('hidden');
        };
        document.getElementById('btn-confirm-exit').onclick = () => {
            stopTTS();
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.close();
            }
        };

        // --- [6. Confetti Engine] ---
        const canvas = document.getElementById("confetti");
        const ctx = canvas.getContext("2d");
        let particles = [];

        function resizeCanvas() {
            canvas.width = 1280;
            canvas.height = 720;
        }

        function fireConfettiBurst() {
            const colors = ['#FF6B6B', '#FECA57', '#54A0FF', '#48DBFB', '#9D65C9', '#FF9F43'];
            for (let i = 0; i < 30; i++) {
                particles.push({
                    x: 1280 / 2,
                    y: 720 / 2,
                    w: Math.random() * 10 + 5,
                    h: Math.random() * 10 + 5,
                    dx: (Math.random() - 0.5) * 20,
                    dy: (Math.random() - 0.5) * 20,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    life: 100
                });
            }
            if (!confettiReqId) animateConfetti();
        }

        function startConfettiLoop() {
            const colors = ['#FF6B6B', '#FECA57', '#54A0FF', '#48DBFB', '#9D65C9', '#FF9F43'];
            const interval = setInterval(() => {
                if (document.getElementById('end-section').classList.contains('hidden')) {
                    clearInterval(interval);
                    return;
                }
                for (let i = 0; i < 5; i++) {
                    particles.push({
                        x: Math.random() * 1280,
                        y: -20,
                        w: Math.random() * 10 + 5,
                        h: Math.random() * 10 + 5,
                        dx: (Math.random() - 0.5) * 5,
                        dy: Math.random() * 5 + 5,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        life: 150
                    });
                }
            }, 100);
            if (!confettiReqId) animateConfetti();
        }

        function stopConfettiLoop() {
            particles = [];
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (confettiReqId) {
                cancelAnimationFrame(confettiReqId);
                confettiReqId = null;
            }
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (particles.length === 0) {
                confettiReqId = null;
                return;
            }
            particles.forEach((p, index) => {
                p.x += p.dx;
                p.y += p.dy;
                p.dy += 0.2;
                p.life--;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.w, p.h);
                if (p.life <= 0) particles.splice(index, 1);
            });
            confettiReqId = requestAnimationFrame(animateConfetti);
        }

        // --- [7. Init] ---
        resizeCanvas();
        resizeGame();
        lucide.createIcons();
    </script>
