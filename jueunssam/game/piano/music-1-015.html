<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>일지 전쟁의 종말 - Text Music Video</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Montserrat:wght@800;900&display=swap");

    :root {
      --yellow: #ffde00;
      --pink: #ff3d81;
      --cyan: #36e8ff;
      --green: #76ff7a;
      --paper: #fff9d9;
      --ink: #111827;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: "Jua", "Apple SD Gothic Neo", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
    }

    .stage {
      position: relative;
      width: min(100vw, calc(100vh * 9 / 16));
      height: min(100vh, calc(100vw * 16 / 9));
      aspect-ratio: 9 / 16;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 18% 18%, rgba(255, 61, 129, 0.16), transparent 27%),
        radial-gradient(circle at 82% 16%, rgba(54, 232, 255, 0.12), transparent 25%),
        radial-gradient(circle at 50% 72%, rgba(255, 222, 0, 0.12), transparent 32%),
        linear-gradient(180deg, #050506 0%, #080812 44%, #000 100%);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12), 0 0 90px rgba(255, 222, 0, 0.16);
    }

    .stage::before,
    .stage::after {
      content: "";
      position: absolute;
      inset: -20%;
      z-index: -2;
      opacity: 0.62;
      transform: rotate(-10deg);
      background:
        linear-gradient(90deg, transparent 0 11%, rgba(255, 255, 255, 0.08) 11% 12%, transparent 12% 24%),
        linear-gradient(180deg, transparent 0 9%, rgba(255, 222, 0, 0.08) 9% 10%, transparent 10% 21%);
      background-size: 72px 72px;
      animation: gridRush 6s linear infinite;
    }

    .stage.is-video::before {
      opacity: 0.22;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.08) 0 1px, transparent 1px 7px),
        radial-gradient(circle at 50% 50%, rgba(255, 61, 129, 0.16), transparent 46%);
      animation: scanRush 1.9s linear infinite;
    }

    .stage::after {
      z-index: -1;
      opacity: 0.2;
      filter: blur(16px);
      animation-duration: 3.8s;
    }

    .topbar {
      position: absolute;
      top: max(14px, env(safe-area-inset-top));
      left: 16px;
      right: 16px;
      z-index: 10;
      display: grid;
      gap: 10px;
    }

    .stage.is-video .topbar,
    .stage.is-video .section-chip,
    .stage.is-video .caption {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 180ms ease, visibility 180ms ease;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      text-shadow: 0 3px 0 rgba(0, 0, 0, 0.48);
    }

    .brand {
      font-family: "Black Han Sans", sans-serif;
      font-size: clamp(18px, 5.2vw, 28px);
      letter-spacing: -0.03em;
      color: var(--yellow);
    }

    .time {
      min-width: 74px;
      padding: 8px 11px 7px;
      border: 2px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.36);
      color: #fff;
      font-family: "Montserrat", sans-serif;
      font-size: 13px;
      text-align: center;
      backdrop-filter: blur(10px);
    }

    .progress-track {
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.13);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--yellow), var(--pink), var(--cyan));
      box-shadow: 0 0 20px rgba(255, 222, 0, 0.55);
      transition: width 120ms linear;
    }

    .section-chip {
      position: absolute;
      top: 92px;
      left: 50%;
      z-index: 7;
      transform: translateX(-50%);
      padding: 8px 18px 7px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.34);
      color: var(--yellow);
      font-family: "Montserrat", sans-serif;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      backdrop-filter: blur(12px);
    }

    .visualizer {
      position: absolute;
      inset: auto 16px 102px;
      z-index: 5;
      display: flex;
      align-items: end;
      justify-content: center;
      height: 68px;
      gap: 4px;
      opacity: 0.72;
      pointer-events: none;
    }

    .bar {
      width: 7px;
      min-height: 8px;
      border-radius: 999px;
      transform-origin: bottom;
      background: linear-gradient(180deg, var(--cyan), var(--yellow), var(--pink));
      filter: drop-shadow(0 0 10px rgba(54, 232, 255, 0.38));
      transition: height 90ms linear;
    }

    .paper-field,
    .spark-field {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .stage.is-video .paper {
      opacity: 0.04;
      filter: grayscale(1);
    }

    .paper {
      position: absolute;
      width: 64px;
      height: 82px;
      border-radius: 10px;
      background:
        linear-gradient(#fff 0 18%, transparent 18%),
        repeating-linear-gradient(180deg, rgba(29, 78, 216, 0.18) 0 2px, transparent 2px 11px),
        var(--paper);
      opacity: 0.1;
      transform: rotate(var(--rot));
      animation: paperFloat var(--dur) linear infinite;
      animation-delay: var(--delay);
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.28);
    }

    .spark {
      position: absolute;
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      background: var(--color);
      opacity: 0;
      box-shadow: 0 0 18px var(--color);
      animation: sparkPop 1.8s ease-out infinite;
      animation-delay: var(--delay);
    }

    .lyrics-wrap {
      position: absolute;
      inset: 134px 22px 160px;
      z-index: 6;
      display: grid;
      place-items: center;
      text-align: center;
    }

    .stage.is-video .lyrics-wrap {
      inset: 44px 18px 44px;
    }

    .lyric-card {
      width: 100%;
      min-height: 52%;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 14px;
      padding: 20px 10px;
    }

    .line {
      margin: 0;
      color: #fff;
      font-family: "Black Han Sans", "Jua", sans-serif;
      font-size: clamp(31px, 8.8vw, 54px);
      line-height: 1.12;
      letter-spacing: -0.055em;
      text-wrap: balance;
      text-shadow:
        0 5px 0 rgba(0, 0, 0, 0.52),
        0 0 24px rgba(255, 255, 255, 0.28);
      transform: translateZ(0);
    }

    .stage.is-video .line {
      font-size: clamp(37px, 10.2vw, 68px);
      line-height: 1.03;
      text-transform: none;
      text-shadow:
        3px 3px 0 #000,
        -3px -3px 0 #000,
        0 8px 0 rgba(0, 0, 0, 0.84),
        0 0 32px rgba(255, 255, 255, 0.38);
      animation: lyricCamera 620ms cubic-bezier(0.19, 1, 0.22, 1) both;
    }

    .line .word {
      display: inline-block;
      margin: 0 0.06em;
      opacity: 0;
      transform: translateY(24px) scale(0.92) rotate(-2deg);
      animation: wordIn 520ms cubic-bezier(0.18, 1.4, 0.32, 1) forwards;
      animation-delay: calc(var(--i) * 44ms);
    }

    .stage.is-video .word.is-hot {
      color: var(--yellow);
      transform-origin: center;
      text-shadow:
        3px 3px 0 #000,
        0 0 30px rgba(255, 222, 0, 0.9),
        0 0 64px rgba(255, 61, 129, 0.65);
      animation-name: hotWordIn;
    }

    .stage.is-video .word.is-danger {
      color: #ff4868;
      text-shadow:
        3px 3px 0 #000,
        0 0 26px rgba(255, 61, 129, 0.85);
      animation-name: dangerWordIn;
    }

    .next-line {
      width: min(92%, 430px);
      margin: 0;
      padding: 12px 14px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.72);
      font-size: clamp(16px, 4.4vw, 23px);
      line-height: 1.26;
      text-wrap: balance;
      backdrop-filter: blur(10px);
    }

    .stage.is-video .next-line {
      width: min(94%, 480px);
      padding: 0;
      background: transparent;
      color: rgba(255, 255, 255, 0.42);
      font-size: clamp(14px, 3.5vw, 19px);
      line-height: 1.22;
      text-shadow: 0 3px 0 rgba(0, 0, 0, 0.76);
      backdrop-filter: none;
    }

    .caption {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 22px;
      z-index: 8;
      display: grid;
      gap: 12px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 24px;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(14px);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.35);
    }

    .play-button {
      width: 58px;
      height: 58px;
      border: 0;
      border-radius: 18px;
      background: linear-gradient(145deg, var(--yellow), #ff8a00);
      color: #240a00;
      font-family: "Montserrat", sans-serif;
      font-size: 22px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 0 #9f5300, 0 0 26px rgba(255, 222, 0, 0.36);
    }

    .range {
      flex: 1;
      accent-color: var(--yellow);
      cursor: pointer;
    }

    .hint {
      margin: 0;
      color: rgba(255, 255, 255, 0.72);
      font-size: 13px;
      text-align: center;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.5);
    }

    .start-overlay {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 28px;
      background:
        radial-gradient(circle at 50% 35%, rgba(255, 222, 0, 0.26), transparent 32%),
        linear-gradient(180deg, rgba(5, 7, 18, 0.78), rgba(0, 0, 0, 0.94));
      transition: opacity 260ms ease, visibility 260ms ease;
    }

    .start-overlay.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .start-panel {
      width: min(92%, 420px);
      padding: 28px 20px 24px;
      border: 2px solid rgba(255, 222, 0, 0.42);
      border-radius: 34px;
      background: rgba(6, 9, 22, 0.76);
      text-align: center;
      box-shadow: 0 0 70px rgba(255, 61, 129, 0.22), inset 0 0 32px rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(18px);
    }

    .start-panel h1 {
      margin: 0 0 12px;
      color: var(--yellow);
      font-family: "Black Han Sans", sans-serif;
      font-size: clamp(38px, 10vw, 62px);
      line-height: 0.95;
      letter-spacing: -0.05em;
      text-shadow: 0 5px 0 rgba(0, 0, 0, 0.55), 0 0 32px rgba(255, 222, 0, 0.28);
    }

    .start-panel p {
      margin: 0 0 22px;
      color: rgba(255, 255, 255, 0.78);
      font-size: 18px;
      line-height: 1.4;
    }

    .big-play {
      width: min(100%, 300px);
      height: 74px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, #fff56a, #ff3d81 48%, #36e8ff);
      color: #0b1020;
      font-family: "Montserrat", sans-serif;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.06em;
      cursor: pointer;
      box-shadow: 0 10px 0 rgba(0, 0, 0, 0.42), 0 0 44px rgba(255, 61, 129, 0.35);
    }

    .stage[data-section="Hook"] .line {
      color: var(--yellow);
      font-size: clamp(38px, 10.6vw, 68px);
      text-shadow:
        0 5px 0 #7d1b00,
        0 0 24px rgba(255, 222, 0, 0.76),
        0 0 52px rgba(255, 61, 129, 0.58);
      animation: hookPunch 600ms ease both;
    }

    .stage.is-video[data-section="Hook"] .line {
      color: #fff;
      font-size: clamp(42px, 11.2vw, 76px);
      text-shadow:
        4px 4px 0 #000,
        0 8px 0 #8a1900,
        0 0 34px rgba(255, 222, 0, 0.82),
        0 0 72px rgba(255, 61, 129, 0.72);
      animation: hookCamera 700ms ease both;
    }

    .stage.is-video .line[data-density="long"] {
      font-size: clamp(31px, 8.7vw, 58px);
      line-height: 1.08;
    }

    .stage.is-video .line[data-density="xlong"] {
      font-size: clamp(27px, 7.7vw, 50px);
      line-height: 1.12;
    }

    .stage[data-section="Verse 1"] .line,
    .stage[data-section="Verse 2"] .line {
      color: #f9fbff;
      filter: drop-shadow(0 0 14px rgba(54, 232, 255, 0.18));
    }

    .stage[data-section="Outro"] .line {
      color: #dbffef;
      text-shadow:
        0 5px 0 rgba(0, 65, 45, 0.74),
        0 0 24px rgba(118, 255, 122, 0.5);
    }

    .stage.is-playing {
      animation: subtlePulse 820ms ease-in-out infinite alternate;
    }

    .stage.is-video .visualizer {
      inset: auto 12px 18px;
      height: 44px;
      opacity: 0.26;
      mix-blend-mode: screen;
    }

    @keyframes gridRush {
      to { transform: translateY(72px) rotate(-10deg); }
    }

    @keyframes scanRush {
      to { transform: translateY(48px) rotate(0deg); }
    }

    @keyframes paperFloat {
      from { transform: translate3d(0, -120px, 0) rotate(var(--rot)); opacity: 0; }
      18% { opacity: 0.18; }
      100% { transform: translate3d(var(--drift), calc(100vh + 140px), 0) rotate(calc(var(--rot) + 90deg)); opacity: 0; }
    }

    @keyframes sparkPop {
      0% { transform: translate3d(0, 18px, 0) scale(0.4); opacity: 0; }
      22% { opacity: 0.86; }
      100% { transform: translate3d(var(--move-x), var(--move-y), 0) scale(1.4); opacity: 0; }
    }

    @keyframes wordIn {
      to { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
    }

    @keyframes hotWordIn {
      0% { opacity: 0; transform: translateY(30px) scale(0.72) rotate(-5deg); }
      70% { opacity: 1; transform: translateY(-3px) scale(1.18) rotate(2deg); }
      100% { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
    }

    @keyframes dangerWordIn {
      0% { opacity: 0; transform: translateX(-18px) scale(1.2) skewX(-8deg); }
      45% { opacity: 1; transform: translateX(10px) scale(1.06) skewX(6deg); }
      100% { opacity: 1; transform: translateX(0) scale(1) skewX(0); }
    }

    @keyframes lyricCamera {
      0% { opacity: 0; transform: scale(1.28) rotate(-1deg); filter: blur(8px); }
      58% { opacity: 1; transform: scale(0.96) rotate(0.5deg); filter: blur(0); }
      100% { opacity: 1; transform: scale(1) rotate(0); filter: blur(0); }
    }

    @keyframes hookCamera {
      0% { opacity: 0; transform: scale(0.55) rotate(-5deg); filter: blur(10px); }
      58% { opacity: 1; transform: scale(1.18) rotate(2deg); filter: blur(0); }
      100% { opacity: 1; transform: scale(1) rotate(0); filter: blur(0); }
    }

    @keyframes hookPunch {
      0% { transform: scale(0.86) rotate(-2deg); }
      62% { transform: scale(1.08) rotate(1deg); }
      100% { transform: scale(1) rotate(0); }
    }

    @keyframes subtlePulse {
      from { filter: saturate(1) brightness(1); }
      to { filter: saturate(1.18) brightness(1.06); }
    }

    @media (max-width: 420px) {
      .lyrics-wrap {
        inset-inline: 16px;
      }

      .line {
        font-size: clamp(28px, 8.2vw, 43px);
      }

      .section-chip {
        top: 88px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="stage" id="stage" data-section="Intro">
    <div class="paper-field" id="paperField" aria-hidden="true"></div>
    <div class="spark-field" id="sparkField" aria-hidden="true"></div>

    <div class="topbar">
      <div class="brand-row">
        <div class="brand">일지 전쟁의 종말</div>
        <div class="time" id="timeLabel">00:00</div>
      </div>
      <div class="progress-track" aria-hidden="true">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="section-chip" id="sectionChip">INTRO</div>

    <section class="lyrics-wrap" aria-live="polite">
      <div class="lyric-card">
        <p class="line" id="currentLine">PLAY REEL</p>
        <p class="next-line" id="nextLine">음악과 함께 텍스트 뮤직비디오가 시작돼요.</p>
      </div>
    </section>

    <div class="visualizer" id="visualizer" aria-hidden="true"></div>

    <div class="caption">
      <div class="controls">
        <button class="play-button" id="playButton" type="button" aria-label="재생">▶</button>
        <input class="range" id="seekBar" type="range" min="0" max="135" value="0" step="0.1" aria-label="재생 위치">
      </div>
      <p class="hint">인스타 릴스 9:16 비율로 제작된 텍스트 기반 뮤직비디오입니다.</p>
    </div>

    <div class="start-overlay" id="startOverlay">
      <div class="start-panel">
        <h1>TEXT<br>REEL</h1>
        <p>하하랩 일지 전쟁 스토리를<br>가사 타이밍에 맞춰 보여줄게요.</p>
        <button class="big-play" id="bigPlay" type="button">PLAY REEL</button>
      </div>
    </div>

    <audio id="audio" preload="auto" src="audio/ilji-war-end.mp3"></audio>
  </main>

  <script>
    const LYRICS = [
      { section: "Intro", start: 8, end: 11, text: "우린 이 센터를 지키는 어벤져스 매일이 전쟁 같지" },
      { section: "Intro", start: 11, end: 12, text: "언어치료 인지치료미술과 놀이 감각통합까지" },
      { section: "Intro", start: 12, end: 16, text: "오전부터 오후까지 시간마다 꽉 찬 스케줄" },
      { section: "Intro", start: 17, end: 20, text: "아이들 눈 맞추고 부모님 상담에 숨 돌릴 틈조차 없네" },
      { section: "Verse 1", start: 21, end: 24, text: "수업이 끝났다고 끝이 아냐 진짜 공포가 남았지" },
      { section: "Verse 1", start: 25, end: 28, text: "책상 위에 산더미처럼 쌓인 일지 작성" },
      { section: "Verse 1", start: 29, end: 32, text: "원칙은 매 수업 직후 작성인 거 나도 너무 잘 알아" },
      { section: "Verse 1", start: 33, end: 36, text: "근데 에너지는 방전됐고 손가락 하나 까딱하기 싫어" },
      { section: "Verse 2", start: 37, end: 41, text: "내일로 미루고 모레로 미루다 결국 주말에 몰아쓰는 비극" },
      { section: "Verse 2", start: 42, end: 45, text: "단말기 결제 시간 맞추느라 진땀 빼며 기억을 쥐어짜네" },
      { section: "Verse 2", start: 46, end: 49, text: "이 아이 반응이 어땠더라 저 아이 진전이 어땠더라" },
      { section: "Verse 2", start: 50, end: 53, text: "내가 치료사인지 서류 찍어내는 기계인지 헷갈려" },
      { section: "Verse 2", start: 54, end: 58, text: "매달 말일이 다가오면 일지 압박에 가슴이 답답해져" },
      { section: "Hook", start: 59, end: 64, text: "하지만 판이 바뀌었어 내 삶의 구원자 하하랩 등장" },
      { section: "Hook", start: 65, end: 69, text: "미뤘던 일지 몰아쓰는 고통 이제는 모두 다 안녕" },
      { section: "Hook", start: 70, end: 74, text: "하하랩이 내 두 손에 자유를 줬지 더 이상 두렵지 않아" },
      { section: "Hook", start: 75, end: 80, text: "서류 지옥에서 우릴 꺼내준 완벽한 솔루션 하하랩" },
      { section: "Verse 3", start: 81, end: 85, text: "매 수업 끝날 때마다 알아서 척척 만들어지는 리포트" },
      { section: "Verse 3", start: 86, end: 90, text: "내가 머리 쥐어뜯던 전문 소견까지 찰떡같이 요약해" },
      { section: "Verse 3", start: 91, end: 95, text: "한눈에 쏙 들어오는 그래프 성장 데이터는 기본 장착" },
      { section: "Verse 3", start: 96, end: 100, text: "나는 그저 화면 보고 참고해서 쓱싹 쉽게 쓰면 끝이야" },
      { section: "Verse 3", start: 101, end: 105, text: "막막했던 백지가 이제는 전문가의 퀄리티로 채워져" },
      { section: "Outro", start: 106, end: 110, text: "시간 낭비 제로 퇴근 시간 단축 내 스트레스 제로" },
      { section: "Outro", start: 111, end: 116, text: "일지 걱정 사라지니 우리 아이들 눈빛이 더 잘 보여" },
      { section: "Outro", start: 117, end: 122, text: "언어 음악 미술 놀이 행동치료사 모두 다 소리 질러" },
      { section: "Outro", start: 123, end: 128, text: "골치 아픈 서류는 하하랩에 맡겨 우린 치료에 집중할게" },
      { section: "Outro", start: 129, end: 135, text: "오늘도 가벼운 발걸음으로 칼퇴근해 땡큐 하하랩" }
    ];

    const stage = document.getElementById("stage");
    const audio = document.getElementById("audio");
    const currentLine = document.getElementById("currentLine");
    const nextLine = document.getElementById("nextLine");
    const sectionChip = document.getElementById("sectionChip");
    const timeLabel = document.getElementById("timeLabel");
    const progressFill = document.getElementById("progressFill");
    const seekBar = document.getElementById("seekBar");
    const playButton = document.getElementById("playButton");
    const bigPlay = document.getElementById("bigPlay");
    const startOverlay = document.getElementById("startOverlay");
    const visualizer = document.getElementById("visualizer");
    const paperField = document.getElementById("paperField");
    const sparkField = document.getElementById("sparkField");

    const TOTAL_SECONDS = 135;
    let audioCtx;
    let analyser;
    let sourceNode;
    let audioData;
    let activeIndex = -1;
    let rafId = 0;
    let hasStarted = false;

    const HOT_WORDS = [
      "하하랩",
      "구원자",
      "자유를",
      "완벽한",
      "솔루션",
      "제로",
      "칼퇴근해",
      "땡큐",
      "등장",
      "안녕"
    ];

    const DANGER_WORDS = [
      "전쟁",
      "공포가",
      "산더미처럼",
      "방전됐고",
      "비극",
      "진땀",
      "헷갈려",
      "압박에",
      "답답해져",
      "지옥에서"
    ];

    function formatTime(seconds) {
      const safeSeconds = Math.max(0, Math.floor(seconds || 0));
      const minutes = String(Math.floor(safeSeconds / 60)).padStart(2, "0");
      const rest = String(safeSeconds % 60).padStart(2, "0");
      return `${minutes}:${rest}`;
    }

    function findActiveIndex(time) {
      const exactIndex = LYRICS.findIndex((line) => time >= line.start && time < line.end);
      if (exactIndex >= 0) return exactIndex;
      for (let index = LYRICS.length - 1; index >= 0; index -= 1) {
        if (time >= LYRICS[index].end) return index;
      }
      return -1;
    }

    function renderLine(index) {
      if (index === activeIndex) return;
      activeIndex = index;

      if (index < 0) {
        stage.dataset.section = "Intro";
        sectionChip.textContent = "INTRO";
        currentLine.dataset.density = "short";
        currentLine.textContent = hasStarted ? "..." : "곧 시작합니다";
        nextLine.textContent = hasStarted ? "음악이 올라오는 중" : LYRICS[0].text;
        return;
      }

      const line = LYRICS[index];
      const next = LYRICS[index + 1];
      currentLine.dataset.density = line.text.length > 34 ? "xlong" : line.text.length > 25 ? "long" : "short";
      stage.dataset.section = line.section;
      sectionChip.textContent = line.section.toUpperCase();
      currentLine.innerHTML = line.text
        .split(" ")
        .map((word, wordIndex) => {
          const cleanWord = word.replace(/[^\uAC00-\uD7A3A-Za-z0-9]/g, "");
          const toneClass = HOT_WORDS.some((hot) => cleanWord.includes(hot))
            ? " is-hot"
            : DANGER_WORDS.some((danger) => cleanWord.includes(danger))
              ? " is-danger"
              : "";
          return `<span class="word${toneClass}" style="--i:${wordIndex}">${word}</span>`;
        })
        .join(" ");
      nextLine.textContent = next ? next.text : "끝까지 함께해줘서 고마워요.";
    }

    function updateProgress() {
      const duration = Number.isFinite(audio.duration) ? audio.duration : TOTAL_SECONDS;
      const current = Math.min(audio.currentTime, duration);
      timeLabel.textContent = formatTime(current);
      seekBar.max = String(duration);
      seekBar.value = String(current);
      progressFill.style.width = `${Math.min(100, (current / duration) * 100)}%`;
    }

    function updateVisualizer() {
      if (!analyser || !audioData) return;
      analyser.getByteFrequencyData(audioData);
      const bars = visualizer.children;
      const step = Math.max(1, Math.floor(audioData.length / bars.length));
      let energy = 0;

      for (let i = 0; i < bars.length; i += 1) {
        const value = audioData[i * step] || 0;
        energy += value;
        bars[i].style.height = `${8 + (value / 255) * 58}px`;
      }

      const average = energy / bars.length / 255;
      stage.style.setProperty("--beat", average.toFixed(2));
      stage.style.transform = `scale(${1 + average * 0.006})`;
    }

    function tick() {
      updateProgress();
      renderLine(findActiveIndex(audio.currentTime));
      updateVisualizer();
      rafId = requestAnimationFrame(tick);
    }

    function setupAudioGraph() {
      if (audioCtx) return;
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      audioCtx = new Ctx();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 128;
      sourceNode = audioCtx.createMediaElementSource(audio);
      sourceNode.connect(analyser);
      analyser.connect(audioCtx.destination);
      audioData = new Uint8Array(analyser.frequencyBinCount);
    }

    async function playReel() {
      setupAudioGraph();
      if (audioCtx && audioCtx.state === "suspended") {
        await audioCtx.resume();
      }
      startOverlay.classList.add("is-hidden");
      await audio.play();
      hasStarted = true;
      playButton.textContent = "Ⅱ";
      stage.classList.add("is-playing", "is-video");
      cancelAnimationFrame(rafId);
      tick();
    }

    function pauseReel() {
      audio.pause();
      playButton.textContent = "▶";
      stage.classList.remove("is-playing");
      cancelAnimationFrame(rafId);
      tick();
    }

    function makeDecorations() {
      for (let i = 0; i < 18; i += 1) {
        const paper = document.createElement("span");
        paper.className = "paper";
        paper.style.left = `${Math.random() * 96}%`;
        paper.style.setProperty("--rot", `${Math.random() * 70 - 35}deg`);
        paper.style.setProperty("--dur", `${8 + Math.random() * 7}s`);
        paper.style.setProperty("--delay", `${Math.random() * -10}s`);
        paper.style.setProperty("--drift", `${Math.random() * 120 - 60}px`);
        paperField.appendChild(paper);
      }

      const colors = ["#ffde00", "#ff3d81", "#36e8ff", "#76ff7a", "#ffffff"];
      for (let i = 0; i < 28; i += 1) {
        const spark = document.createElement("span");
        spark.className = "spark";
        spark.style.left = `${8 + Math.random() * 84}%`;
        spark.style.top = `${16 + Math.random() * 70}%`;
        spark.style.setProperty("--size", `${4 + Math.random() * 8}px`);
        spark.style.setProperty("--color", colors[i % colors.length]);
        spark.style.setProperty("--delay", `${Math.random() * 2.4}s`);
        spark.style.setProperty("--move-x", `${Math.random() * 160 - 80}px`);
        spark.style.setProperty("--move-y", `${Math.random() * -180 - 40}px`);
        sparkField.appendChild(spark);
      }

      for (let i = 0; i < 32; i += 1) {
        const bar = document.createElement("span");
        bar.className = "bar";
        bar.style.height = `${12 + (i % 7) * 6}px`;
        visualizer.appendChild(bar);
      }
    }

    bigPlay.addEventListener("click", playReel);
    playButton.addEventListener("click", () => {
      if (audio.paused) {
        playReel();
      } else {
        pauseReel();
      }
    });

    seekBar.addEventListener("input", () => {
      audio.currentTime = Number(seekBar.value);
      updateProgress();
      renderLine(findActiveIndex(audio.currentTime));
    });

    audio.addEventListener("loadedmetadata", () => {
      seekBar.max = String(Number.isFinite(audio.duration) ? audio.duration : TOTAL_SECONDS);
      updateProgress();
    });

    audio.addEventListener("ended", () => {
      playButton.textContent = "▶";
      stage.classList.remove("is-playing");
      cancelAnimationFrame(rafId);
      renderLine(LYRICS.length - 1);
      updateProgress();
    });

    makeDecorations();
    renderLine(-1);
    updateProgress();
  </script>

    <script src="../../js/web-learning-ranking.js?v=20260618-07" defer></script>
