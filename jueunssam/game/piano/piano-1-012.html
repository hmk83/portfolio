<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>얼룩말 피아노 건반 학습</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="https://surikov.github.io/webaudiofont/npm/dist/WebAudioFontPlayer.js"></script>
    <script src="https://surikov.github.io/webaudiofontdata/sound/0000_JCLive_sf2_file.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Jua', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #fdfbf7;
            touch-action: none;
            user-select: none;
            -webkit-touch-callout: none;
            height: 100vh;
            width: 100vw;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .game-header {
            background-color: rgba(255, 255, 255, 0.95);
            border-bottom: 2px solid rgba(0, 0, 0, 0.05);
            width: 100%;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 200;
            backdrop-filter: blur(10px);
        }

        #main-container {
            position: relative;
            z-index: 1;
            padding-top: 60px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            pointer-events: none;
        }

        .note-display-wrapper {
            flex: 0 0 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 1rem;
            pointer-events: auto;
        }

        .note-display {
            background: rgba(255, 255, 255, 0.9);
            border: 6px solid #f59e0b;
            border-radius: 3.5rem;
            padding: 0.8rem 3.5rem;
            font-size: 3rem;
            font-weight: bold;
            color: #d97706;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
            min-width: 300px;
            text-align: center;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .note-display.pop {
            transform: scale(1.1);
        }

        .zebra-stage {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0 1rem;
            gap: 1.5rem;
            pointer-events: auto;
        }

        .zebra-container {
            width: 48%;
            max-width: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.15));
        }

        .zebra-container svg {
            width: 100%;
            height: auto;
            max-height: 55vh;
            overflow: visible;
        }

        .zebra-box-left {
            transform: scaleX(-1);
        }

        .zebra-box-left .zebra-stripes-wrapper {
            transform: scaleX(-1);
            transform-origin: 189px 50%;
        }

        .zebra-stripe-key {
            cursor: pointer;
            pointer-events: auto;
            transition: fill 0.1s ease;
        }

        .piano-wrapper {
            height: 180px;
            background: #1a1a1a;
            padding: 8px 4px;
            display: flex;
            pointer-events: auto;
            position: relative;
            z-index: 10;
        }

        .key-slot {
            flex: 1;
            position: relative;
            height: 100%;
            display: flex;
        }

        .key {
            flex: 1;
            background: white;
            border: 1px solid #ddd;
            border-radius: 0 0 10px 10px;
            cursor: pointer;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 12px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: background 0.1s, transform 0.05s;
            box-shadow: inset 0 -2px 5px rgba(0, 0, 0, 0.1);
        }

        .key.active {
            transform: translateY(3px);
            background: #e2e8f0;
        }

        .key.black {
            position: absolute;
            background: #333;
            color: white;
            width: 60%;
            height: 60%;
            left: 70%;
            z-index: 2;
            border: 1px solid #000;
            border-radius: 0 0 6px 6px;
            padding-bottom: 8px;
            font-size: 0.85rem;
            box-shadow: inset 0 -2px 5px rgba(255, 255, 255, 0.1);
        }

        .key.black.active {
            background: #000;
            transform: translateY(2px);
        }

        .dancing {
            transform-origin: 50% 100%;
            animation: dance 0.4s ease-in-out;
        }

        @keyframes dance {

            0%,
            100% {
                transform: translateY(0) scaleY(1);
            }

            50% {
                transform: translateY(-20px) scaleY(0.95);
            }
        }

        .animate-pop-in {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% {
                transform: scale(0.9);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <canvas id="c"></canvas>

    <header class="game-header">
        <div class="flex items-center gap-2">
            <i data-lucide="graduation-cap" class="text-amber-600"></i>
            <h1 class="text-xl font-bold text-slate-800">얼룩말 건반 배우기</h1>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="location.reload()"
                class="bg-rose-500 text-white px-5 py-2 rounded-full text-sm font-bold shadow-md hover:bg-rose-600 transition">다시
                시작</button>
            <button onclick="history.back()"
                class="bg-slate-500 text-white px-5 py-2 rounded-full text-sm font-bold shadow-md hover:bg-slate-600 transition">종료</button>
        </div>
    </header>

    <section id="intro-screen" class="fixed inset-0 z-[150] flex flex-col items-center justify-center bg-[#fdfbf7]">
        <div class="text-center space-y-10 max-w-lg px-6 animate-pop-in">
            <h1 class="text-7xl font-bold text-slate-800 tracking-tighter">얼룩말 건반 학습</h1>
            <p class="text-2xl text-slate-600 font-bold leading-relaxed">
                가장 정교한 얼룩말 친구가 돌아왔어요!<br>
                화면 아래 건반이나 얼룩말 몸통의 무늬를 직접 눌러<br>자유롭게 연주해보세요.
            </p>
            <div id="midi-status"
                class="text-slate-400 font-bold text-sm bg-slate-100 py-3 px-8 rounded-full inline-block">피아노 장치 연결 확인
                중...</div>
            <button onclick="startGame()"
                class="w-full bg-amber-500 text-white py-6 rounded-full text-4xl font-bold shadow-2xl hover:bg-amber-400 transition-all transform hover:scale-105">학습
                시작하기</button>
        </div>
    </section>

    <div id="main-container">
        <div class="note-display-wrapper">
            <div id="note-display" class="note-display">건반을 눌러봐요!</div>
        </div>

        <div class="zebra-stage">
            <div class="zebra-container zebra-box-left" id="stage-left"></div>
            <div class="zebra-container" id="stage-right"></div>
        </div>

        <div class="piano-wrapper" id="piano-body"></div>
    </div>

        // 음역대 정보 설정
        const PIANO_CONFIG = [
            { m: 48, n: '도', en: 'C3', c: '#ef4444', isB: false, sid: 'c1' }, { m: 49, n: 'C#3', isB: true, sid: 'c1s' },
            { m: 50, n: '레', en: 'D3', c: '#f97316', isB: false, sid: 'd1' }, { m: 51, n: 'D#3', isB: true, sid: 'd1s' },
            { m: 52, n: '미', en: 'E3', c: '#eab308', isB: false, sid: 'e1' },
            { m: 53, n: '파', en: 'F3', c: '#22c55e', isB: false, sid: 'f1' }, { m: 54, n: 'F#3', isB: true, sid: 'f1s' },
            { m: 55, n: '솔', en: 'G3', c: '#0ea5e9', isB: false, sid: 'g1' }, { m: 56, n: 'G#3', isB: true, sid: 'g1s' },
            { m: 57, n: '라', en: 'A3', c: '#6366f1', isB: false, sid: 'a1' }, { m: 58, n: 'A#3', isB: true, sid: 'a1s' },
            { m: 59, n: '시', en: 'B3', c: '#a855f7', isB: false, sid: 'b1' },
            { m: 60, n: '도', en: 'C4', c: '#ef4444', isB: false, sid: 'c1' }, { m: 61, n: 'C#4', isB: true, sid: 'c1s' },
            { m: 62, n: '레', en: 'D4', c: '#f97316', isB: false, sid: 'd1' }, { m: 63, n: 'D#4', isB: true, sid: 'd1s' },
            { m: 64, n: '미', en: 'E4', c: '#eab308', isB: false, sid: 'e1' },
            { m: 65, n: '파', en: 'F4', c: '#22c55e', isB: false, sid: 'f1' }, { m: 66, n: 'F#4', isB: true, sid: 'f1s' },
            { m: 67, n: '솔', en: 'G4', c: '#0ea5e9', isB: false, sid: 'g1' }, { m: 68, n: 'G#4', isB: true, sid: 'g1s' },
            { m: 69, n: '라', en: 'A4', c: '#6366f1', isB: false, sid: 'a1' }, { m: 70, n: 'A#4', isB: true, sid: 'a1s' },
            { m: 71, n: '시', en: 'B4', c: '#a855f7', isB: false, sid: 'b1' },
            { m: 72, n: '도', en: 'C5', c: '#ec4899', isB: false, sid: 'c2' }
        ];

        const MIDI_MAP = {};
        PIANO_CONFIG.forEach(item => MIDI_MAP[item.m] = item);

        // 캔버스 효과 애니메이션
        const canvas = document.getElementById("c");
        const ctx_cv = canvas.getContext("2d");
        let cW, cH, bgColor = "#fdfbf7", animations = [];

        function Circle(opts) {
            Object.assign(this, opts);
            this.draw = () => {
                ctx_cv.globalAlpha = this.opacity || 1;
                ctx_cv.beginPath(); ctx_cv.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                ctx_cv.fillStyle = this.fill; ctx_cv.fill();
            };
        }

        function triggerInkEffect(x, y, color) {
            const targetR = Math.sqrt(cW * cW + cH * cH);
            const fill = new Circle({ x, y, r: 0, fill: color });
            const anim = anime({
                targets: fill, r: targetR, duration: 850, easing: "easeOutQuart",
                complete: () => { bgColor = color; animations = animations.filter(a => a !== anim); }
            });
            animations.push(anim);
            const pts = [];
            for (let i = 0; i < 20; i++) pts.push(new Circle({ x, y, fill: color, r: anime.random(10, 35) }));
            const ptAnim = anime({
                targets: pts, x: p => p.x + anime.random(-350, 350), y: p => p.y + anime.random(-350, 350),
                r: 0, easing: "easeOutExpo", duration: 1100,
                complete: () => animations = animations.filter(a => a !== ptAnim)
            });
            animations.push(ptAnim);
        }

        anime({
            duration: Infinity,
            update: () => {
                ctx_cv.fillStyle = bgColor; ctx_cv.fillRect(0, 0, cW, cH);
                animations.forEach(an => an.animatables.forEach(at => at.target.draw()));
            }
        });

        // 사운드 및 피아노 상호작용
        let audioCtx, player, isReady = false;
        function initAudio() {
            if (!audioCtx) {
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    player = new WebAudioFontPlayer();
                    player.loader.decodeAfterLoading(audioCtx, '_tone_0000_JCLive_sf2_file');
                    isReady = true;
                } catch (e) { }
            }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }

        window.startGame = function () {
            initAudio();
            const intro = document.getElementById('intro-screen');
            if (intro) intro.style.display = 'none';
            // 즉시 MIDI 초기화 재시도
            initMidi();
        };

        function handlePianoPlay(midi) {
            if (!isReady) return;
            const note = MIDI_MAP[midi];
            if (!note) return;

            player.queueWaveTable(audioCtx, audioCtx.destination, _tone_0000_JCLive_sf2_file, 0, midi, 1.5);

            // 상단 디스플레이
            const display = document.getElementById('note-display');
            if (display) {
                display.innerText = note.isB ? note.n : `${note.n} (${note.en})`;
                display.style.color = note.isB ? '#444' : note.c;
                display.style.borderColor = note.isB ? '#444' : note.c;
                display.classList.remove('pop');
                void display.offsetWidth;
                display.classList.add('pop');
            }

            const isRight = midi >= 60;
            const zebraContainerId = isRight ? 'stage-right' : 'stage-left';
            const zebraTarget = document.querySelector(`#${zebraContainerId} .zebra-target-group`);
            const startX = isRight ? cW * 0.75 : cW * 0.25;

            triggerInkEffect(startX, cH * 0.45, note.isB ? "#fdfbf7" : note.c);

            // 얼룩말 배 무늬(건반) 하이라이트
            if (note.sid) {
                const stripeId = `${note.sid}_${isRight ? 'right' : 'left'}`;
                const stripe = document.getElementById(stripeId);
                if (stripe) {
                    const defaultColor = note.isB ? '#4E4D49' : '#E8E8E1';
                    stripe.setAttribute('fill', note.isB ? '#000' : note.c);
                    setTimeout(() => stripe.setAttribute('fill', defaultColor), 250);
                }

                // C4(60) 연주 시 양쪽 자연스러운 연결
                if (midi === 60) {
                    const c2Left = document.getElementById('c2_left');
                    if (c2Left) {
                        c2Left.setAttribute('fill', note.c);
                        setTimeout(() => c2Left.setAttribute('fill', '#E8E8E1'), 250);
                    }
                }
            }

            if (zebraTarget) {
                zebraTarget.classList.add('dancing');
                setTimeout(() => zebraTarget.classList.remove('dancing'), 400);
            }

            const keyEl = document.querySelector(`[data-midi="${midi}"]`);
            if (keyEl) {
                keyEl.classList.add('active');
                setTimeout(() => keyEl.classList.remove('active'), 150);
            }
        }

        function createPiano() {
            const body = document.getElementById('piano-body');
            if (!body) return;
            PIANO_CONFIG.forEach(n => {
                if (!n.isB) {
                    const slot = document.createElement('div');
                    slot.className = 'key-slot';
                    const k = document.createElement('div');
                    k.className = 'key';
                    k.dataset.midi = n.m;
                    k.innerHTML = n.n;
                    k.style.color = n.c;
                    k.onmousedown = () => { initAudio(); handlePianoPlay(n.m); };
                    k.ontouchstart = (e) => { e.preventDefault(); initAudio(); handlePianoPlay(n.m); };
                    slot.appendChild(k);

                    const next = MIDI_MAP[n.m + 1];
                    if (next && next.isB) {
                        const bk = document.createElement('div');
                        bk.className = 'key black';
                        bk.dataset.midi = next.m;
                        bk.innerHTML = '♯';
                        bk.onmousedown = (e) => { e.stopPropagation(); initAudio(); handlePianoPlay(next.m); };
                        bk.ontouchstart = (e) => { e.preventDefault(); e.stopPropagation(); initAudio(); handlePianoPlay(next.m); };
                        slot.appendChild(bk);
                    }
                    body.appendChild(slot);
                }
            });
        }

        function bindZebraKeys() {
            document.querySelectorAll('.zebra-stripe-key').forEach(stripe => {
                const midiStr = stripe.getAttribute('data-midi');
                if (!midiStr) return;
                const midi = parseInt(midiStr);

                const playFn = (e) => {
                    e.preventDefault();
                    initAudio();
                    handlePianoPlay(midi);
                };

                stripe.addEventListener('mousedown', playFn);
                stripe.addEventListener('touchstart', playFn, { passive: false });
            });
        }

        // MIDI 실시간 연결 감지 및 초기화 함수
        async function initMidi() {
            const status = document.getElementById('midi-status');
            try {
                if (!navigator.requestMIDIAccess) throw new Error("지원하지 않는 브라우저");
                const midi = await navigator.requestMIDIAccess();

                const connectInputs = () => {
                    let isConnected = false;
                    for (let input of midi.inputs.values()) {
                        input.onmidimessage = (e) => {
                            const [s, n, v] = e.data;
                            if ((s & 0xf0) === 144 && v > 0) {
                                initAudio();
                                handlePianoPlay(n);
                            }
                        };
                        isConnected = true;
                    }
                    if (status) {
                        if (isConnected) {
                            status.innerText = "MIDI 피아노 연결 완료!";
                            status.style.color = "#10b981";
                        } else {
                            status.innerText = "장치를 기다리고 있습니다. 연결해주세요.";
                            status.style.color = "#f59e0b";
                        }
                    }
                };

                connectInputs();
                midi.onstatechange = connectInputs; // 핫플러깅 대응

            } catch (e) {
                if (status) status.innerText = "터치나 마우스로 연주할 수 있습니다.";
            }
        }

        const onResize = () => {
            cW = window.innerWidth; cH = window.innerHeight;
            if (canvas && ctx_cv) {
                canvas.width = cW * devicePixelRatio; canvas.height = cH * devicePixelRatio;
                ctx_cv.scale(devicePixelRatio, devicePixelRatio);
            }
        };

        window.onload = () => {
            if (window.lucide) lucide.createIcons();
            const stageLeft = document.getElementById('stage-left');
            const stageRight = document.getElementById('stage-right');
            if (stageLeft) stageLeft.innerHTML = getZebraSVG('left');
            if (stageRight) stageRight.innerHTML = getZebraSVG('right');

            createPiano();
            bindZebraKeys();
            onResize();
            window.addEventListener('resize', onResize);
            initMidi(); // 페이지 로드 시 1차 시도
        };
    </script>
