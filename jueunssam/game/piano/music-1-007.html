<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>피아노 손가락 번호</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* [Core Reset & Safe Area] */
        :root {
            --gnb-height: 60px;
            --app-bg: #fff1f2;
        }

        body {
            font-family: 'Jua', sans-serif;
            background-color: var(--app-bg);
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            height: 100vh;
            width: 100vw;
        }

        /* [GNB Styles] */
        #gnb {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--gnb-height);
            background-color: #FEE500;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* [Game Container & Scaling] */
        #game-container {
            position: absolute;
            top: var(--gnb-height);
            left: 0;
            width: 100%;
            height: calc(100vh - var(--gnb-height));
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: var(--app-bg);
        }

        #scalable-wrapper {
            width: 1280px;
            height: 720px;
            position: relative;
            transform-origin: center center;
            background-color: white;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border-radius: 24px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* [Game Internal Layout] */
        .instruction-bar {
            height: 80px;
            background-color: #f8fafc;
            border-bottom: 3px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-shrink: 0;
            z-index: 20;
        }

        .main-stage {
            flex-grow: 1;
            position: relative;
            display: flex;
            padding: 20px;
            gap: 20px;
            overflow: hidden;
        }

        /* Hand Card Styles */
        .hand-card {
            flex: 1;
            background: white;
            border: 4px solid #e2e8f0;
            border-radius: 24px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
        }

        .hand-stage {
            flex-grow: 1;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 0;
        }

        .hand-image-wrapper {
            position: relative;
            height: 95%;
            width: auto;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .hand-img {
            height: 100%;
            width: auto;
            pointer-events: none;
            display: block;
        }

        .hand-label {
            height: 100px;
            background: #f8fafc;
            border-top: 2px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-shrink: 0;
            z-index: 10;
        }

        /* Clef Image Box in Label */
        .clef-box {
            width: 60px;
            height: 60px;
            background: white;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .clef-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Hitboxes & Badges */
        .finger-hitbox {
            position: absolute;
            width: 60px;
            height: 60px;
            transform: translate(-50%, -50%);
            cursor: pointer;
            z-index: 30;
            border-radius: 50%;
        }

        .finger-badge {
            width: 44px;
            height: 44px;
            background: #e2e8f0;
            color: #64748b;
            border: 3px solid #cbd5e1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 24px;
            box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.1);
            pointer-events: none;
            transition: all 0.3s;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Learned/Filled State */
        .lh-theme .finger-hitbox.learned .finger-badge,
        .lh-theme .finger-hitbox.filled .finger-badge {
            background: #3b82f6;
            color: white;
            border-color: #1d4ed8;
            transform: translate(-50%, -50%) scale(1.1);
        }

        .rh-theme .finger-hitbox.learned .finger-badge,
        .rh-theme .finger-hitbox.filled .finger-badge {
            background: #f43f5e;
            color: white;
            border-color: #be123c;
            transform: translate(-50%, -50%) scale(1.1);
        }

        /* Guide Animation */
        .guide-pulse {
            animation: pulseOrange 1.2s infinite;
        }

        .guide-pulse .finger-badge {
            background: #fb923c !important;
            color: white !important;
            border-color: #c2410c !important;
            transform: translate(-50%, -50%) scale(1.2);
            box-shadow: 0 0 15px rgba(251, 146, 60, 0.6);
        }

        @keyframes pulseOrange {
            0% {
                box-shadow: 0 0 0 0 rgba(251, 146, 60, 0.7);
            }

            70% {
                box-shadow: 0 0 0 15px rgba(251, 146, 60, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(251, 146, 60, 0);
            }
        }

        /* Quiz Specifics */
        .mode-quiz .finger-badge {
            opacity: 0;
            transform: translate(-50%, -50%) scale(0);
        }

        .mode-quiz .filled .finger-badge {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .mode-quiz .finger-hitbox {
            border: 3px dashed #cbd5e1;
            background: rgba(255, 255, 255, 0.5);
        }

        .mode-quiz .finger-hitbox.filled {
            border: none;
            background: transparent;
        }

        /* Palm Zone */
        .palm-zone {
            position: absolute;
            width: 100px;
            height: 80px;
            top: 60%;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 12px;
            z-index: 5;
            display: none;
        }

        .mode-quiz .palm-zone {
            display: block;
            border: 3px dashed #cbd5e1;
            background: rgba(255, 255, 255, 0.5);
        }

        .mode-quiz .palm-zone.filled {
            border: none;
            background: transparent;
        }

        /* Quiz Dock */
        #quiz-dock {
            height: 120px;
            background: #f1f5f9;
            border-top: 4px solid #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 0 40px;
            z-index: 50;
            flex-shrink: 0;
        }

        .draggable-item {
            width: 80px;
            height: 80px;
            background: white;
            border: 4px solid #475569;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            cursor: grab;
            box-shadow: 0 4px 0 #94a3b8;
            touch-action: none;
            user-select: none;
        }

        .draggable-item:active {
            cursor: grabbing;
            transform: scale(0.95);
        }

        .draggable-item.clef-item {
            border-radius: 16px;
            width: 90px;
            height: 90px;
        }

        .draggable-item img {
            width: 70%;
            height: 70%;
            object-fit: contain;
            pointer-events: none;
        }

        /* Compare View (Phase 2) */
        #staff-view {
            display: none;
            width: 100%;
            height: 100%;
            padding: 40px;
            gap: 40px;
            justify-content: center;
            align-items: center;
        }

        .clef-card {
            flex: 1;
            height: 100%;
            border-radius: 32px;
            border: 6px solid;
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .clef-card:hover {
            transform: scale(1.02);
        }

        .clef-card:active {
            transform: scale(0.98);
        }

        /* Overlays */
        .overlay-screen {
            position: absolute;
            inset: 0;
            background: #fff1f2;
            /* Opaque background */
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        /* UI Helpers */
        .btn-press {
            transition: transform 0.1s;
        }

        .btn-press:active {
            transform: scale(0.95);
        }

        /* [Fixed] Removed custom .hidden class that used !important */
        /* .hidden { display: none !important; }  <-- Removed to allow class toggling */

        /* Coordinates */
        .lh-pos-5 {
            left: 14%;
            top: 12%;
        }

        .lh-pos-4 {
            left: 30%;
            top: 7%;
        }

        .lh-pos-3 {
            left: 55%;
            top: 5%;
        }

        .lh-pos-2 {
            left: 72%;
            top: 13%;
        }

        .lh-pos-1 {
            left: 92%;
            top: 37%;
        }

        .rh-pos-1 {
            left: 6%;
            top: 37%;
        }

        .rh-pos-2 {
            left: 27%;
            top: 14%;
        }

        .rh-pos-3 {
            left: 43%;
            top: 5%;
        }

        .rh-pos-4 {
            left: 67%;
            top: 7%;
        }

        .rh-pos-5 {
            left: 86%;
            top: 12%;
        }
    </style>
</head>

<body>

    <!-- [1. GNB] -->
    <nav id="gnb">
        <div class="flex items-center gap-3">
            <h1 class="text-2xl font-black text-slate-800 flex items-center gap-2">
                <i data-lucide="music-4" class="text-pink-600 w-8 h-8"></i>
                <span data-i18n="appTitle">피아노 손가락 번호</span>
            </h1>
        </div>
        <div class="flex gap-2">
            <!-- BGM Removed -->
            <button id="btn-lang" onclick="toggleLang()"
                class="bg-white border-2 border-slate-200 rounded-full px-3 py-1.5 text-base font-bold shadow-sm hover:bg-slate-50 btn-press text-slate-700">
                English
            </button>
            <!-- GNB Help Button Removed -->
            <button id="btn-restart" onclick="resetGame()"
                class="bg-indigo-500 text-white rounded-full px-3 py-1.5 text-base font-bold shadow-sm hover:bg-indigo-600 btn-press"
                data-i18n="restart">
                다시하기
            </button>
            <button id="btn-exit" onclick="showExitModal()"
                class="bg-slate-700 text-white rounded-full px-3 py-1.5 text-base font-bold shadow-sm hover:bg-slate-800 btn-press"
                data-i18n="exit">
                종료
            </button>
        </div>
    </nav>

    <!-- [2. Game Container] -->
    <div id="game-container">
        <div id="scalable-wrapper">
            <canvas id="confetti" class="absolute inset-0 pointer-events-none z-[100]"></canvas>

            <!-- Instruction Bar -->
            <div class="instruction-bar">
                <div id="mascot-icon"
                    class="w-12 h-12 rounded-full bg-yellow-400 border-4 border-slate-800 flex items-center justify-center shrink-0 shadow-md">
                    <i data-lucide="smile" class="text-white w-7 h-7"></i>
                </div>
                <p id="instruction-text" class="text-2xl font-bold text-slate-800">준비됐나요?</p>
            </div>

            <!-- Main Stage (Hands) -->
            <div id="hands-view" class="main-stage">
                <!-- Left Hand -->
                <div class="hand-card lh-theme">
                    <div class="hand-stage">
                        <div class="hand-image-wrapper">
                            <img src="https://jueunssam.com/wp-content/uploads/ssam/game/piano-svg/001.svg"
                                class="hand-img" alt="Left Hand">
                            <div id="lh-hit-5" class="finger-hitbox lh-pos-5" onclick="handleFingerClick('lh', 5)">
                                <div class="finger-badge">5</div>
                            </div>
                            <div id="lh-hit-4" class="finger-hitbox lh-pos-4" onclick="handleFingerClick('lh', 4)">
                                <div class="finger-badge">4</div>
                            </div>
                            <div id="lh-hit-3" class="finger-hitbox lh-pos-3" onclick="handleFingerClick('lh', 3)">
                                <div class="finger-badge">3</div>
                            </div>
                            <div id="lh-hit-2" class="finger-hitbox lh-pos-2" onclick="handleFingerClick('lh', 2)">
                                <div class="finger-badge">2</div>
                            </div>
                            <div id="lh-hit-1" class="finger-hitbox lh-pos-1" onclick="handleFingerClick('lh', 1)">
                                <div class="finger-badge">1</div>
                            </div>
                            <div id="lh-palm" class="palm-zone"></div>
                        </div>
                    </div>
                    <div class="hand-label">
                        <div class="clef-box">
                            <img src="https://jueunssam.com/wp-content/uploads/ssam/game/piano-svg/004.svg"
                                alt="Bass Clef">
                        </div>
                        <div class="flex flex-col">
                            <span class="text-2xl font-black text-blue-500" data-i18n="leftHand">왼손 (낮은음)</span>
                            <span class="text-lg font-bold text-slate-500" data-i18n="bassClef">낮은음자리표</span>
                        </div>
                    </div>
                </div>

                <!-- Right Hand -->
                <div class="hand-card rh-theme">
                    <div class="hand-stage">
                        <div class="hand-image-wrapper">
                            <img src="https://jueunssam.com/wp-content/uploads/ssam/game/piano-svg/002.svg"
                                class="hand-img" alt="Right Hand">
                            <div id="rh-hit-1" class="finger-hitbox rh-pos-1" onclick="handleFingerClick('rh', 1)">
                                <div class="finger-badge">1</div>
                            </div>
                            <div id="rh-hit-2" class="finger-hitbox rh-pos-2" onclick="handleFingerClick('rh', 2)">
                                <div class="finger-badge">2</div>
                            </div>
                            <div id="rh-hit-3" class="finger-hitbox rh-pos-3" onclick="handleFingerClick('rh', 3)">
                                <div class="finger-badge">3</div>
                            </div>
                            <div id="rh-hit-4" class="finger-hitbox rh-pos-4" onclick="handleFingerClick('rh', 4)">
                                <div class="finger-badge">4</div>
                            </div>
                            <div id="rh-hit-5" class="finger-hitbox rh-pos-5" onclick="handleFingerClick('rh', 5)">
                                <div class="finger-badge">5</div>
                            </div>
                            <div id="rh-palm" class="palm-zone"></div>
                        </div>
                    </div>
                    <div class="hand-label">
                        <div class="clef-box">
                            <img src="https://jueunssam.com/wp-content/uploads/ssam/game/piano-svg/003.svg"
                                alt="Treble Clef">
                        </div>
                        <div class="flex flex-col">
                            <span class="text-2xl font-black text-pink-500" data-i18n="rightHand">오른손 (높은음)</span>
                            <span class="text-lg font-bold text-slate-500" data-i18n="trebleClef">높은음자리표</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Compare View (Phase 2) -->
            <div id="staff-view">
                <div onclick="playTone('C3')" class="clef-card border-blue-200">
                    <img src="https://jueunssam.com/wp-content/uploads/ssam/game/piano-svg/004.svg"
                        class="w-48 h-48 object-contain mb-6">
                    <p class="text-4xl font-black text-blue-500 mb-2">낮은음</p>
                    <p class="text-2xl text-slate-600 font-bold">묵직한 곰돌이 목소리</p>
                </div>
                <div onclick="playTone('C4')" class="clef-card border-pink-200">
                    <img src="https://jueunssam.com/wp-content/uploads/ssam/game/piano-svg/003.svg"
                        class="w-48 h-48 object-contain mb-6">
                    <p class="text-4xl font-black text-pink-500 mb-2">높은음</p>
                    <p class="text-2xl text-slate-600 font-bold">예쁜 아기새 목소리</p>
                </div>
            </div>

            <!-- Quiz Dock -->
            <div id="quiz-dock" class="hidden"></div>

            <!-- Overlays -->
            <div id="intro-screen" class="overlay-screen">
                <div class="bg-yellow-100 p-8 rounded-full mb-8 animate-bounce border-4 border-slate-800">
                    <i data-lucide="music" class="w-20 h-20 text-yellow-600"></i>
                </div>
                <h1 class="text-5xl font-black text-slate-800 mb-6" data-i18n="appTitle">피아노 손가락 번호</h1>
                <p class="text-2xl text-slate-600 mb-10 text-center leading-relaxed" data-i18n="introDesc">
                    손가락 번호와 음자리표를 배워봐요!<br>
                    <span class="text-blue-500 font-bold">왼손</span>은 낮은음, <span
                        class="text-pink-500 font-bold">오른손</span>은 높은음이에요.
                </p>
                <div class="flex gap-4">
                    <button onclick="showManual()"
                        class="bg-white text-slate-700 border-4 border-slate-300 text-2xl px-8 py-4 rounded-2xl font-bold shadow-lg active:scale-95 transition flex items-center gap-2">
                        <i data-lucide="help-circle"></i> <span data-i18n="howToPlay">도움말</span>
                    </button>
                    <button onclick="startGame()"
                        class="bg-pink-500 text-white text-2xl px-12 py-4 rounded-2xl font-bold shadow-[0_6px_0_#be185d] border-4 border-pink-700 active:shadow-none active:translate-y-1.5 transition flex items-center gap-2">
                        <span data-i18n="start">시작하기!</span> <i data-lucide="rocket"></i>
                    </button>
                </div>
            </div>

            <div id="end-screen" class="overlay-screen hidden">
                <i data-lucide="trophy" class="w-32 h-32 text-yellow-400 mb-6 animate-bounce"></i>
                <h2 class="text-5xl font-black text-slate-800 mb-8" data-i18n="successTitle">모두 성공!</h2>
                <button onclick="resetGame()"
                    class="bg-indigo-500 text-white px-10 py-5 rounded-2xl text-2xl font-bold shadow-lg hover:bg-indigo-600 transition">
                    <span data-i18n="restart">다시 하기</span>
                </button>
            </div>

            <!-- Next Button (Floating - Top Right) -->
            <button id="next-btn" onclick="nextPhase()"
                class="hidden absolute top-28 right-8 z-50 bg-green-500 text-white px-8 py-4 rounded-2xl border-4 border-green-700 shadow-xl animate-bounce text-2xl font-bold flex items-center gap-2">
                <span data-i18n="next">다음 단계로</span> <i data-lucide="arrow-right"></i>
            </button>
        </div>
    </div>

    <!-- Modals -->
    <div id="manual-modal" class="fixed inset-0 bg-black/60 z-[20000] hidden items-center justify-center p-4"
        onclick="closeManual()">
        <div class="bg-white rounded-3xl p-8 max-w-lg w-full text-center shadow-2xl relative"
            onclick="event.stopPropagation()">
            <button class="absolute top-4 right-4 text-slate-400 hover:text-slate-600" onclick="closeManual()">
                <i data-lucide="x-circle" class="w-8 h-8"></i>
            </button>
            <div class="bg-pink-100 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6">
                <i data-lucide="sparkles" class="text-pink-500 w-10 h-10"></i>
            </div>
            <h3 class="text-3xl font-bold text-slate-800 mb-6" data-i18n="howToPlay">놀이 방법!</h3>
            <div class="text-xl text-slate-600 leading-loose text-left px-4 mb-8" data-i18n="manualText">
                1. 반짝이는 주황색 버튼을 순서대로 눌러보세요.<br>
                2. 소리를 들으며 손가락 번호를 배워요.<br>
                3. 나중에는 알맞은 그림을 네모 칸에 쏙쏙 넣어주세요!
            </div>
            <button onclick="closeManual()" class="bg-slate-800 text-white w-full py-4 rounded-xl text-xl font-bold"
                data-i18n="ok">알겠어요!</button>
        </div>
    </div>

    <div id="exit-modal" class="fixed inset-0 bg-black/60 z-[20000] hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full text-center shadow-2xl">
            <h3 class="text-2xl font-bold text-slate-800 mb-8" data-i18n="exitConfirm">정말 종료할까요?</h3>
            <div class="flex justify-center gap-4">
                <button onclick="closeExitModal()"
                    class="bg-slate-200 text-slate-700 px-6 py-3 rounded-xl text-lg font-bold"
                    data-i18n="cancel">아니요</button>
                <button onclick="confirmExit()" class="bg-red-500 text-white px-6 py-3 rounded-xl text-lg font-bold"
                    data-i18n="yes">네, 종료해요</button>
            </div>
        </div>
    </div>

    <script>

        const I18N_DATA = {

                next: "다음 단계로",
                successTitle: "모두 성공!",
                manualText: "1. 반짝이는 주황색 버튼을 순서대로 눌러보세요.<br>2. 소리를 들으며 손가락 번호를 배워요.<br>3. 나중에는 알맞은 그림을 네모 칸에 쏙쏙 넣어주세요!",
                ok: "알겠어요!",
                exitConfirm: "정말 종료할까요?",
                cancel: "아니요",
                yes: "네, 종료해요",
                inst1: "반짝이는 <span class='text-orange-600'>주황색 버튼</span>을 눌러보세요!",
                inst2: "오른손(높은음) 1번 엄지손가락을 눌러보세요!",
                inst3: "와우! 손가락 번호를 모두 익혔어요!",
                instFind: "{hand} <span class='{color}'>{num}번 손가락</span>은 어디일까요?",
                instCompare: "그림을 클릭해서 소리를 들어보고 비교해볼까요?",
                instDrag: "그림을 알맞은 <span class='text-red-500'>네모와 동그라미</span> 칸으로 옮겨주세요!",
                handL: "왼손", handR: "오른손"
            },
            en: {
                appTitle: "Piano Finger Numbers",
                introDesc: "Let's learn finger numbers and clefs!\nLeft is Low, Right is High.",
                howToPlay: "How to Play",
                start: "Start!",
                restart: "Restart",
                exit: "Exit",
                leftHand: "Left Hand (Low)",
                rightHand: "Right Hand (High)",
                bassClef: "Bass Clef",
                trebleClef: "Treble Clef",
                next: "Next Level",
                successTitle: "All Clear!",
                manualText: "1. Press flashing orange buttons in order.<br>2. Learn finger numbers with sounds.<br>3. Drag correct items to the boxes!",
                ok: "Got it!",
                exitConfirm: "Really Exit?",
                cancel: "No",
                yes: "Yes",
                inst1: "Press the flashing <span class='text-orange-600'>orange button</span>!",
                inst2: "Press Right Hand Thumb (Finger 1)!",
                inst3: "Wow! You learned all finger numbers!",
                instFind: "Where is {hand} <span class='{color}'>Finger {num}</span>?",
                instCompare: "Click pictures to listen and compare!",
                instDrag: "Drag items to the correct <span class='text-red-500'>boxes</span>!",
                handL: "Left", handR: "Right"
            }
        };

        const NOTE_FREQS = {
            'C3': 130.81, 'D3': 146.83, 'E3': 164.81, 'F3': 174.61, 'G3': 196.00,
            'C4': 261.63, 'D4': 293.66, 'E4': 329.63, 'F4': 349.23, 'G4': 392.00
        };

        // --- State ---
        let currentLang = 'ko';
        let phase = 'intro';
        let step = 0;
        let droppedCount = 0;
        const TOTAL_QUIZ_ITEMS = 12;
        let ttsAudio = null;
        let currentUtterance = null; // Chrome GC fix
        let googleTTSAvailable = true;
        let availableVoices = [];

        // --- TTS & Audio (BGM Removed) ---
        function loadVoices() {
            availableVoices = window.speechSynthesis.getVoices();
        }
        if (window.speechSynthesis.onvoiceschanged !== undefined) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
        }
        loadVoices();

        function stopTTS() {
            if (ttsAudio) { ttsAudio.pause(); ttsAudio = null; }
            window.speechSynthesis.cancel();
            currentUtterance = null;
        }

        async function speak(textKey, isRaw = false) {
            stopTTS();
            let text = isRaw ? textKey : I18N_DATA[currentLang][textKey];
            if (!text) return;

            // Simple HTML tag strip
            const cleanText = text.replace(/<[^>]*>/g, '');

            // Replace dynamic params e.g. {n} if needed (though not used much here)
            // ...

            if (googleTTSAvailable) {
                const langCode = currentLang === 'ko' ? 'ko-KR' : 'en-US';
                const voiceName = currentLang === 'ko' ? 'ko-KR-Standard-A' : 'en-US-Standard-E';
                try {
                    const response = await fetch(`https://texttospeech.googleapis.com/v1/text:synthesize?key=${GOOGLE_API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            input: { text: cleanText },
                            voice: { languageCode: langCode, name: voiceName },
                            audioConfig: { audioEncoding: 'MP3' }
                        })
                    });
                    if (!response.ok) throw new Error('API Error');
                    const data = await response.json();
                    if (data.audioContent) {
                        const audioBlob = await fetch(`data:audio/mp3;base64,${data.audioContent}`).then(res => res.blob());
                        ttsAudio = new Audio(URL.createObjectURL(audioBlob));
                        ttsAudio.play();
                        return;
                    }
                } catch (e) {
                    console.warn("Google TTS Failed, switching to fallback", e);
                    googleTTSAvailable = false;
                }
            }

            // Fallback
            fallbackSpeak(cleanText);
        }

        function fallbackSpeak(text) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            currentUtterance = u; // Prevent GC

            u.lang = currentLang === 'ko' ? 'ko-KR' : 'en-US';
            u.rate = 0.9;

            if (availableVoices.length === 0) availableVoices = window.speechSynthesis.getVoices();

            if (currentLang !== 'ko') {
                const preferred = ["Google US English", "Samantha", "Microsoft Zira", "Karen", "Tessa"];
                const voice = availableVoices.find(v => preferred.some(p => v.name.includes(p)));
                if (voice) u.voice = voice;
            } else {
                const koVoice = availableVoices.find(v => v.name.includes('Google 한국어') || v.lang === 'ko-KR');
                if (koVoice) u.voice = koVoice;
            }

            u.onend = () => { currentUtterance = null; };
            window.speechSynthesis.speak(u);
        }

        function playTone(note) {
            const freq = NOTE_FREQS[note];
            if (!freq) return;
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, ctx.currentTime);
            gain.gain.setValueAtTime(0.5, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.0);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 1.0);
        }

        // --- Game Logic ---
        function startGame() {
            document.getElementById('intro-screen').style.display = 'none';
            // Chrome Policy: Resume AudioContext on user interaction
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            if (ctx.state === 'suspended') ctx.resume();
            startPhase1();
        }

        function resetGame() {
            if (ttsAudio) { ttsAudio.pause(); ttsAudio = null; }
            window.speechSynthesis.cancel();

            // Reset Vars
            phase = 'intro';
            step = 0;
            droppedCount = 0;

            // UI Reset
            document.getElementById('intro-screen').style.display = 'flex';
            document.getElementById('end-screen').style.display = 'none';
            document.getElementById('quiz-dock').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('hands-view').style.display = 'flex';
            document.getElementById('staff-view').style.display = 'none';

            // Reset Elements
            document.querySelectorAll('.finger-hitbox').forEach(el => el.classList.remove('learned', 'filled'));
            document.querySelectorAll('.guide-pulse').forEach(el => el.classList.remove('guide-pulse'));
            document.querySelectorAll('.palm-zone').forEach(el => el.classList.remove('filled'));
            document.getElementById('quiz-dock').innerHTML = '';

            // Reset Instruction
            updateInstructionRaw(I18N_DATA[currentLang].manualText.split('<br>')[0], "smile"); // Show standard text

            // Re-draw icons
            lucide.createIcons();
        }

        // --- Modal Logic (Fixed) ---
        function showManual() {
            const el = document.getElementById('manual-modal');
            el.classList.remove('hidden');
            el.classList.add('flex');
            speak('manualText');
        }
        function closeManual() {
            const el = document.getElementById('manual-modal');
            el.classList.add('hidden');
            el.classList.remove('flex');
            stopTTS();
        }
        function showExitModal() {
            const el = document.getElementById('exit-modal');
            el.classList.remove('hidden');
            el.classList.add('flex');
            speak('exitConfirm');
        }
        function closeExitModal() {
            const el = document.getElementById('exit-modal');
            el.classList.add('hidden');
            el.classList.remove('flex');
            stopTTS();
        }

        function confirmExit() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.close();
            }
        }

        function startPhase1() {
            phase = 'learn-fingers';
            step = 1;
            document.body.className = 'mode-learn';
            updateInstruction('inst1', 'hand');
            speak('inst1');
            highlightFinger('lh', 1);
        }

        function highlightFinger(hand, num) {
            document.querySelectorAll('.guide-pulse').forEach(el => el.classList.remove('guide-pulse'));
            const el = document.getElementById(`${hand}-hit-${num}`);
            if (el) el.classList.add('guide-pulse');
        }

        function handleFingerClick(hand, num) {
            if (phase !== 'learn-fingers') return;
            const isLH = step <= 5;
            const currentHand = isLH ? 'lh' : 'rh';
            const currentNum = isLH ? step : (step - 5);

            if (hand === currentHand && num === currentNum) {
                const el = document.getElementById(`${hand}-hit-${num}`);
                el.classList.add('learned');

                if (hand === 'lh') {
                    const notes = { 5: 'C3', 4: 'D3', 3: 'E3', 2: 'F3', 1: 'G3' };
                    playTone(notes[num]);
                } else {
                    const notes = { 1: 'C4', 2: 'D4', 3: 'E4', 4: 'F4', 5: 'G4' };
                    playTone(notes[num]);
                }

                step++;
                if (step === 6) {
                    updateInstruction('inst2', 'thumbs-up');
                    speak('inst2');
                    highlightFinger('rh', 1);
                } else if (step === 11) {
                    updateInstruction('inst3', 'star');
                    speak('inst3');
                    document.querySelectorAll('.guide-pulse').forEach(el => el.classList.remove('guide-pulse'));
                    document.getElementById('next-btn').classList.remove('hidden');
                } else {
                    const i18n = I18N_DATA[currentLang];
                    const nextHand = step <= 5 ? i18n.handL : i18n.handR;
                    const nextColor = step <= 5 ? 'text-blue-500' : 'text-pink-500';
                    const nextNum = step <= 5 ? step : (step - 5);
                    const msg = i18n.instFind.replace('{hand}', nextHand).replace('{color}', nextColor).replace('{num}', nextNum);

                    updateInstructionRaw(msg, "help-circle");
                    speak(msg, true);
                    highlightFinger(step <= 5 ? 'lh' : 'rh', nextNum);
                }
            } else {
                new Audio("https://cdn.pixabay.com/audio/2022/03/24/audio_8780280277.mp3").play().catch(() => { });
                document.getElementById('scalable-wrapper').classList.add('animate-pulse');
                setTimeout(() => document.getElementById('scalable-wrapper').classList.remove('animate-pulse'), 300);
            }
        }

        function nextPhase() {
            document.getElementById('next-btn').classList.add('hidden');
            if (phase === 'learn-fingers') startPhase2();
            else if (phase === 'learn-staff') startPhase3();
        }

        function startPhase2() {
            phase = 'learn-staff';
            document.getElementById('hands-view').style.display = 'none';
            document.getElementById('staff-view').style.display = 'flex';
            updateInstruction('instCompare', 'music');
            speak('instCompare');
            setTimeout(() => document.getElementById('next-btn').classList.remove('hidden'), 2000);
        }

        function startPhase3() {
            phase = 'quiz';
            document.body.className = 'mode-quiz';
            document.getElementById('staff-view').style.display = 'none';
            document.getElementById('hands-view').style.display = 'flex';
            document.getElementById('quiz-dock').classList.remove('hidden');
            updateInstruction('instDrag', 'move');
            speak('instDrag');
            populateDock();
        }

        // --- Dock & Drag ---
        const quizItems = [
            { type: 'clef', subType: 'bass', img: 'https://jueunssam.com/wp-content/uploads/ssam/game/piano-svg/004.svg', targetHand: 'lh' },
            { type: 'clef', subType: 'treble', img: 'https://jueunssam.com/wp-content/uploads/ssam/game/piano-svg/003.svg', targetHand: 'rh' }
        ];
        for (let i = 1; i <= 5; i++) quizItems.push({ type: 'num', val: i, targetHand: 'lh', color: 'blue' });
        for (let i = 1; i <= 5; i++) quizItems.push({ type: 'num', val: i, targetHand: 'rh', color: 'pink' });

        function populateDock() {
            const dock = document.getElementById('quiz-dock');
            dock.innerHTML = '';
            quizItems.sort(() => Math.random() - 0.5);

            quizItems.forEach((item) => {
                const el = document.createElement('div');
                el.className = "draggable-item";
                if (item.type === 'clef') {
                    el.classList.add('clef-item');
                    const img = document.createElement('img');
                    img.src = item.img;
                    el.appendChild(img);
                    el.style.borderColor = item.targetHand === 'lh' ? '#0ea5e9' : '#f43f5e';
                    el.dataset.type = 'clef';
                    el.dataset.targetHand = item.targetHand;
                } else {
                    el.innerText = item.val;
                    el.dataset.type = 'num';
                    el.dataset.val = item.val;
                    el.dataset.targetHand = item.targetHand;
                    el.classList.add(item.color === 'blue' ? 'text-blue-500' : 'text-pink-500');
                    el.style.borderColor = item.color === 'blue' ? '#3b82f6' : '#f43f5e';
                }
                setupDrag(el);
                dock.appendChild(el);
            });
        }

        function setupDrag(el) {
            let startX, startY, initialLeft, initialTop;
            const start = (e) => {
                e.preventDefault();
                const touch = e.touches ? e.touches[0] : e;
                startX = touch.clientX; startY = touch.clientY;
                const rect = el.getBoundingClientRect();
                document.body.appendChild(el);
                el.style.position = 'fixed';
                el.style.left = rect.left + 'px'; el.style.top = rect.top + 'px';
                el.style.zIndex = 2000;
                initialLeft = rect.left; initialTop = rect.top;
                document.addEventListener('mousemove', move); document.addEventListener('touchmove', move, { passive: false });
                document.addEventListener('mouseup', end); document.addEventListener('touchend', end);
            };
            const move = (e) => {
                const touch = e.touches ? e.touches[0] : e;
                el.style.left = (initialLeft + (touch.clientX - startX)) + 'px';
                el.style.top = (initialTop + (touch.clientY - startY)) + 'px';
            };
            const end = () => {
                document.removeEventListener('mousemove', move); document.removeEventListener('touchmove', move);
                document.removeEventListener('mouseup', end); document.removeEventListener('touchend', end);
                checkDrop(el);
            };
            el.addEventListener('mousedown', start); el.addEventListener('touchstart', start, { passive: false });
        }

        function checkDrop(el) {
            el.style.visibility = 'hidden';
            const rect = el.getBoundingClientRect();
            const cx = rect.left + rect.width / 2; const cy = rect.top + rect.height / 2;
            const below = document.elementFromPoint(cx, cy);
            el.style.visibility = 'visible';

            let success = false;
            const type = el.dataset.type;
            const targetHand = el.dataset.targetHand;

            if (type === 'clef') {
                const palm = below?.closest(`#${targetHand}-palm`);
                if (palm && !palm.classList.contains('filled')) {
                    success = true;
                    palm.classList.add('filled');
                    palm.appendChild(el);
                    el.style.position = 'absolute'; el.style.left = '0'; el.style.top = '0';
                    el.style.width = '100%'; el.style.height = '100%';
                    el.style.border = 'none'; el.style.background = 'transparent'; el.style.boxShadow = 'none';
                    el.style.transform = 'none';
                }
            } else {
                const val = parseInt(el.dataset.val);
                const hit = below?.closest(`#${targetHand}-hit-${val}`);
                if (hit && !hit.classList.contains('filled')) {
                    success = true;
                    hit.classList.add('filled');
                    el.remove();
                }
            }

            if (success) {
                playSuccessSound(type, targetHand, el.dataset.val);
                fireConfetti();
                droppedCount++;
                if (droppedCount >= TOTAL_QUIZ_ITEMS) {
                    setTimeout(() => {
                        document.getElementById('end-screen').style.display = 'flex';
                        speak('successTitle');
                    }, 1000);
                }
            } else {
                new Audio("https://cdn.pixabay.com/audio/2022/03/24/audio_8780280277.mp3").play().catch(() => { });
                document.getElementById('quiz-dock').appendChild(el);
                el.style.position = 'relative'; el.style.left = ''; el.style.top = ''; el.style.zIndex = '';
            }
        }

        function playSuccessSound(type, hand, val) {
            if (type === 'num') {
                const v = parseInt(val);
                if (hand === 'lh') playTone({ 5: 'C3', 4: 'D3', 3: 'E3', 2: 'F3', 1: 'G3' }[v]);
                else playTone({ 1: 'C4', 2: 'D4', 3: 'E4', 4: 'F4', 5: 'G4' }[v]);
            } else {
                new Audio("https://cdn.pixabay.com/audio/2021/08/04/audio_12b2120d58.mp3").play().catch(() => { });
            }
        }

        // --- Utils ---
        function updateInstruction(key, icon) {
            const html = I18N_DATA[currentLang][key];
            updateInstructionRaw(html, icon);
        }

        function updateInstructionRaw(html, icon) {
            document.getElementById('instruction-text').innerHTML = html;
            document.getElementById('mascot-icon').innerHTML = `<i data-lucide="${icon}" class="text-white w-7 h-7"></i>`;
            lucide.createIcons();
        }

        function toggleLang() {
            currentLang = currentLang === 'ko' ? 'en' : 'ko';
            document.getElementById('btn-lang').innerText = currentLang === 'ko' ? 'English' : '한국어';
            updateAllTexts();
            // TTS
            const speakText = currentLang === 'ko' ? '한국어' : 'English';
            speak(speakText, true);
        }

        function updateAllTexts() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (I18N_DATA[currentLang][key]) el.innerHTML = I18N_DATA[currentLang][key];
            });
        }

        // --- Resizer ---
        function resizeGame() {
            const wrap = document.getElementById('scalable-wrapper');
            const cont = document.getElementById('game-container');
            const scale = Math.min(cont.clientWidth / 1280, cont.clientHeight / 720);
            wrap.style.transform = `scale(${scale})`;
        }
        window.addEventListener('resize', resizeGame);
        resizeGame();

        // --- Confetti ---
        const canvas = document.getElementById("confetti");
        const ctx = canvas.getContext("2d");
        let particles = [];
        function fireConfetti() {
            for (let i = 0; i < 30; i++) particles.push({
                x: 1280 / 2, y: 720 / 2,
                dx: (Math.random() - 0.5) * 20, dy: (Math.random() - 0.5) * 20,
                color: `hsl(${Math.random() * 360},80%,60%)`, life: 100
            });
            if (!particles.length) requestAnimationFrame(updateConfetti);
        }
        function updateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, i) => {
                p.x += p.dx; p.y += p.dy; p.life--;
                ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 8, 8);
                if (p.life <= 0) particles.splice(i, 1);
            });
            if (particles.length > 0) requestAnimationFrame(updateConfetti);
        }
        canvas.width = 1280; canvas.height = 720;

        // [Key Fix] Initialize icons immediately
        window.addEventListener('load', () => {
            resizeGame();
            lucide.createIcons();
        });

        // Ensure icons are created even if load already fired
        lucide.createIcons();
    </script>
