<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>셈여림표 배우기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* [Core Reset & Safe Area] */
        :root {
            --gnb-height: 60px;
            --app-bg: #f8fafc;
        }

        body {
            font-family: 'Jua', sans-serif;
            background-color: var(--app-bg);
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            height: 100vh;
            width: 100vw;
        }

        /* [GNB Styles] */
        #gnb {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--gnb-height);
            background-color: #FEE500;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* [Game Container & Scaling] */
        #game-container {
            position: absolute;
            top: var(--gnb-height);
            left: 0;
            width: 100%;
            height: calc(100vh - var(--gnb-height));
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: var(--app-bg);
        }

        #scalable-wrapper {
            width: 1280px;
            height: 720px;
            position: relative;
            transform-origin: center center;
            background-color: white;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border-radius: 24px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* [Game Internal Layout] */
        .instruction-bar {
            height: 70px;
            background-color: #f1f5f9;
            border-bottom: 3px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-shrink: 0;
            z-index: 20;
        }

        .main-stage {
            flex-grow: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 20px;
            overflow: hidden;
            background: linear-gradient(135deg, #fff0f5 0%, #f0f8ff 100%);
        }

        /* [Learning Guide Info] */
        .learning-guide {
            background-color: rgba(255, 255, 255, 0.85);
            border: 2px solid #e2e8f0;
            padding: 6px 20px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            color: #475569;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        /* [Dynamics Grid - 3 Rows Layout (4, 4, 5)] */
        .dynamics-wrapper {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            align-items: center;
            perspective: 1000px;
        }

        .dynamics-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            width: 100%;
        }

        /* [Dynamic Card Elements] */
        .dynamic-card {
            width: 105px;
            height: 105px;
            border-radius: 22px;
            cursor: pointer;
            z-index: 20;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-image: linear-gradient(180deg, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0) 100%);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1), inset 0 3px 0 rgba(255, 255, 255, 0.5);
            border: 3px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .dynamic-mark {
            font-family: "Times New Roman", Times, serif;
            font-style: italic;
            font-weight: bold;
            font-size: 38px;
            color: white;
            text-shadow: 2px 3px 5px rgba(0, 0, 0, 0.2);
            line-height: 1;
            margin-top: -8px;
        }

        .dynamic-name {
            font-family: 'Jua', sans-serif;
            font-size: 15px;
            color: white;
            margin-top: 4px;
            text-shadow: 1px 2px 2px rgba(0, 0, 0, 0.2);
            opacity: 0.95;
            z-index: 2;
        }

        /* 소리 크기 시각화 바 */
        .vol-bar-container {
            position: absolute;
            bottom: 6px;
            left: 12px;
            right: 12px;
            height: 14px;
            display: flex;
            align-items: flex-end;
            gap: 2px;
            opacity: 0.8;
            z-index: 1;
        }

        .vol-bar {
            background-color: white;
            flex: 1;
            border-radius: 2px 2px 0 0;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        /* 변화표/강조표 뱃지 */
        .type-badge {
            position: absolute;
            top: 6px;
            background: rgba(255, 255, 255, 0.35);
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 8px;
            font-weight: bold;
            text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.2);
        }

        .dynamic-card:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 10px 18px rgba(0, 0, 0, 0.15), inset 0 4px 0 rgba(255, 255, 255, 0.6);
        }

        /* Note States */
        .note-locked {
            opacity: 0.4;
            filter: grayscale(85%);
            pointer-events: none;
            background-color: #94a3b8 !important;
            box-shadow: inset 0 4px 0 rgba(255, 255, 255, 0.2);
        }

        .note-active {
            opacity: 1;
            transform: scale(1.1);
            z-index: 30;
            animation: pulseActive 1.2s infinite alternate;
        }

        .note-learned {
            opacity: 1;
            transform: scale(1);
        }

        @keyframes pulseActive {
            from {
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.8), inset 0 3px 0 rgba(255, 255, 255, 0.5);
            }

            to {
                box-shadow: 0 0 0 12px rgba(255, 255, 255, 0), inset 0 3px 0 rgba(255, 255, 255, 0.5);
            }
        }

        /* [Quiz UI] */
        #quiz-dock {
            width: 100%;
            margin-top: auto;
            padding: 15px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .quiz-btn {
            padding: 10px 20px;
            font-size: 22px;
            font-weight: 900;
            color: white;
            border-radius: 20px;
            background-image: linear-gradient(180deg, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0) 50%);
            box-shadow:
                0 5px 0 rgba(0, 0, 0, 0.15),
                inset 0 3px 0 rgba(255, 255, 255, 0.4),
                0 8px 12px rgba(0, 0, 0, 0.1);
            transition: all 0.15s ease;
            min-width: 140px;
            border: none;
            text-shadow: 1px 2px 2px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            font-family: 'Jua', sans-serif;
        }

        .quiz-btn:active {
            transform: translateY(5px);
            box-shadow:
                0 0 0 rgba(0, 0, 0, 0.15),
                inset 0 3px 0 rgba(255, 255, 255, 0.4),
                0 3px 6px rgba(0, 0, 0, 0.1);
        }

        .wrong-shake {
            animation: shake 0.4s cubic-bezier(.36, .07, .19, .97) both;
            background-color: #ef4444 !important;
        }

        @keyframes shake {

            10%,
            90% {
                transform: translate3d(-2px, 0, 0);
            }

            20%,
            80% {
                transform: translate3d(4px, 0, 0);
            }

            30%,
            50%,
            70% {
                transform: translate3d(-6px, 0, 0);
            }

            40%,
            60% {
                transform: translate3d(6px, 0, 0);
            }
        }

        /* 대형 텍스트 팝업 - 크기 고정 */
        #large-note-display {
            width: 400px;
            height: 140px;
            border-radius: 25px;
            box-shadow:
                0 8px 16px rgba(0, 0, 0, 0.1),
                inset 0 4px 0 rgba(255, 255, 255, 0.8);
            background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
            cursor: pointer;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            margin-top: 15px;
            flex-shrink: 0;
            /* 크기 변동 방지 */
        }

        #large-note-display:active {
            transform: scale(0.95);
        }

        .display-name {
            font-family: 'Jua', sans-serif;
            font-weight: bold;
            font-size: 38px;
            line-height: 1.1;
            text-align: center;
        }

        .display-meaning {
            font-family: 'Jua', sans-serif;
            font-size: 24px;
            color: #475569;
        }

        /* Overlays */
        .overlay-screen {
            position: absolute;
            inset: 0;
            background: #fff;
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        /* UI Helpers */
        .btn-press {
            transition: transform 0.1s;
        }

        .btn-press:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>

    <!-- [1. GNB] -->
    <nav id="gnb">
        <div class="flex items-center gap-3">
            <h1 class="text-2xl font-black text-slate-800 flex items-center gap-2">
                <i data-lucide="music-3" class="text-pink-600 w-8 h-8"></i>
                <span data-i18n="appTitle">셈여림표 배우기</span>
            </h1>
        </div>
        <div class="flex gap-2">
            <button id="btn-lang" onclick="toggleLang()"
                class="bg-white border-2 border-slate-200 rounded-full px-3 py-1.5 text-base font-bold shadow-sm hover:bg-slate-50 btn-press text-slate-700">
                English
            </button>
            <button id="btn-restart" onclick="resetGame()"
                class="bg-indigo-500 text-white rounded-full px-3 py-1.5 text-base font-bold shadow-sm hover:bg-indigo-600 btn-press"
                data-i18n="restart">
                다시하기
            </button>
            <button id="btn-exit" onclick="showExitModal()"
                class="bg-slate-700 text-white rounded-full px-3 py-1.5 text-base font-bold shadow-sm hover:bg-slate-800 btn-press"
                data-i18n="exit">
                종료
            </button>
        </div>
    </nav>

    <!-- [2. Game Container] -->
    <div id="game-container">
        <div id="scalable-wrapper">
            <canvas id="confetti" class="absolute inset-0 pointer-events-none z-[100]"></canvas>

            <!-- Instruction Bar -->
            <div class="instruction-bar">
                <div id="mascot-icon"
                    class="w-10 h-10 rounded-full bg-yellow-400 border-4 border-slate-800 flex items-center justify-center shrink-0 shadow-md">
                    <i data-lucide="smile" class="text-white w-6 h-6"></i>
                </div>
                <p id="instruction-text" class="text-2xl font-bold text-slate-800">준비됐나요?</p>
            </div>

            <!-- Main Stage -->
            <div id="main-stage" class="main-stage hidden">

                <!-- Learning Guide Info -->
                <div id="learning-guide" class="learning-guide hidden">
                    <i data-lucide="volume-2" class="w-5 h-5 text-indigo-500"></i>
                    <span data-i18n="guideText">순서대로 눌러보세요!</span>
                </div>

                <!-- Dynamics Grid (3 Rows: 4, 4, 5) -->
                <div id="dynamics-container" class="dynamics-wrapper">
                    <!-- Rows will be injected here -->
                </div>

                <!-- Large Note Display -->
                <div id="large-note-display" class="border-4 transition-transform duration-200 hidden">
                    <div id="display-name" class="display-name"></div>
                    <div id="display-meaning" class="display-meaning"></div>
                </div>

                <!-- 퀴즈 GO 버튼 (모든 학습 완료 시 등장) -->
                <button id="quiz-go-btn" onclick="startQuizPhase()"
                    class="hidden absolute bottom-10 right-10 bg-green-500 text-white px-8 py-4 rounded-full text-2xl font-black shadow-[0_6px_0_#166534] hover:bg-green-600 active:shadow-none active:translate-y-1.5 transition flex items-center gap-2 z-50 animate-bounce">
                    <span data-i18n="quizGo">퀴즈 GO!</span> <i data-lucide="play-circle"></i>
                </button>

                <!-- Quiz Dock -->
                <div id="quiz-dock" class="hidden">
                    <!-- Buttons will be injected here -->
                </div>
            </div>

            <!-- Overlays -->
            <div id="intro-screen" class="overlay-screen">
                <div class="bg-indigo-100 p-8 rounded-full mb-8 animate-bounce border-4 border-slate-800">
                    <i data-lucide="music" class="w-20 h-20 text-indigo-600"></i>
                </div>
                <h1 class="text-5xl font-black text-slate-800 mb-6" data-i18n="appTitle">셈여림표 배우기</h1>
                <p class="text-2xl text-slate-600 mb-10 text-center leading-relaxed" data-i18n="introDesc">
                    아주 여리게부터 아주 세게까지!<br>
                    다양한 셈여림 기호를 재미있게 배우고 퀴즈를 풀어봐요.
                </p>
                <div class="flex gap-4">
                    <button onclick="showManual()"
                        class="bg-white text-slate-700 border-4 border-slate-300 text-2xl px-8 py-4 rounded-2xl font-bold shadow-lg active:scale-95 transition flex items-center gap-2">
                        <i data-lucide="help-circle"></i> <span data-i18n="howToPlay">도움말</span>
                    </button>
                    <button id="start-btn" onclick="startGame()"
                        class="bg-pink-500 text-white text-2xl px-12 py-4 rounded-2xl font-bold shadow-[0_6px_0_#be185d] border-4 border-pink-700 active:shadow-none active:translate-y-1.5 transition flex items-center gap-2">
                        <span data-i18n="start">시작하기!</span> <i data-lucide="rocket"></i>
                    </button>
                </div>
            </div>

            <div id="end-screen" class="overlay-screen hidden bg-gradient-to-br from-indigo-50 to-pink-50">
                <div
                    class="bg-white p-12 rounded-[3rem] shadow-2xl border-8 border-yellow-300 flex flex-col items-center max-w-2xl w-full">
                    <div class="relative">
                        <i data-lucide="award" class="w-40 h-40 text-yellow-400 mb-2 animate-bounce"></i>
                        <i data-lucide="sparkles"
                            class="absolute top-0 right-0 w-12 h-12 text-pink-400 animate-pulse"></i>
                        <i data-lucide="sparkles"
                            class="absolute bottom-0 left-0 w-10 h-10 text-blue-400 animate-pulse"></i>
                    </div>
                    <h2 class="text-6xl font-black text-slate-800 mb-6" data-i18n="successTitle">학습 리포트</h2>
                    <div class="bg-slate-100 px-8 py-6 rounded-2xl mb-8 w-full text-center">

                        </p>
                    </div>
                    <button onclick="resetGame()"
                        class="bg-indigo-500 text-white px-12 py-6 rounded-full text-3xl font-black shadow-[0_8px_0_#3730a3] hover:bg-indigo-600 active:shadow-none active:translate-y-2 transition">
                        <span data-i18n="restart">다시 하기</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modals -->

        onclick="closeManual()">
        <div class="bg-white rounded-3xl p-8 max-w-lg w-full text-center shadow-2xl relative"
            onclick="event.stopPropagation()">
            <button class="absolute top-4 right-4 text-slate-400 hover:text-slate-600" onclick="closeManual()">
                <i data-lucide="x-circle" class="w-8 h-8"></i>
            </button>
            <div class="bg-pink-100 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6">
                <i data-lucide="sparkles" class="text-pink-500 w-10 h-10"></i>
            </div>
            <h3 class="text-3xl font-bold text-slate-800 mb-6" data-i18n="howToPlay">놀이 방법!</h3>
            <div class="text-xl text-slate-600 leading-loose text-left px-4 mb-8" data-i18n="manualText">
                1. 반짝이는 셈여림 기호를 눌러 소리의 크기와 뜻을 익혀보세요.<br>
                2. 2가지 유형의 재미있는 퀴즈가 기다리고 있어요!<br>
                3. 기호를 보고 알맞은 뜻을 찾거나, 뜻을 보고 올바른 기호를 찾아보세요.
            </div>
            <button onclick="closeManual()" class="bg-slate-800 text-white w-full py-4 rounded-xl text-xl font-bold"
                data-i18n="ok">알겠어요!</button>
        </div>
    </div>

    <div id="exit-modal" class="fixed inset-0 bg-black/60 z-[20000] hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full text-center shadow-2xl">
            <h3 class="text-2xl font-bold text-slate-800 mb-8" data-i18n="exitConfirm">정말 종료할까요?</h3>
            <div class="flex justify-center gap-4">
                <button onclick="closeExitModal()"
                    class="bg-slate-200 text-slate-700 px-6 py-3 rounded-xl text-lg font-bold"
                    data-i18n="cancel">아니요</button>
                <button onclick="confirmExit()" class="bg-red-500 text-white px-6 py-3 rounded-xl text-lg font-bold"
                    data-i18n="yes">네, 종료해요</button>
            </div>
        </div>
    </div>

            { id: 'mp', mark: 'mp', name_ko: '메조 피아노', meaning_ko: '조금 여리게', name_en: 'Mezzo Piano', meaning_en: 'Moderately soft', color: '#eccc68', vol: 0.4, step: 3, row: 1 },
            { id: 'mf', mark: 'mf', name_ko: '메조 포르테', meaning_ko: '조금 세게', name_en: 'Mezzo Forte', meaning_en: 'Moderately loud', color: '#2ed573', vol: 0.6, step: 4, row: 1 },

            // Row 2: 센음 및 강조표 (4개)
            { id: 'f', mark: 'f', name_ko: '포르테', meaning_ko: '세게', name_en: 'Forte', meaning_en: 'Loud', color: '#1e90ff', vol: 0.8, step: 5, row: 2 },
            { id: 'ff', mark: 'ff', name_ko: '포르티시모', meaning_ko: '아주 세게', name_en: 'Fortissimo', meaning_en: 'Very loud', color: '#5352ed', vol: 1.0, step: 6, row: 2 },
            { id: 'fp', mark: 'fp', name_ko: '포르테피아노', meaning_ko: '세게 곧 여리게', name_en: 'Fortepiano', meaning_en: 'Loud, then immediately soft', color: '#ff6b81', vol: 'fp', type: 'emphasis', row: 2 },
            { id: 'pf', mark: 'pf', name_ko: '피아노포르테', meaning_ko: '여리게 곧 세게', name_en: 'Pianoforte', meaning_en: 'Soft, then immediately loud', color: '#ff7f50', vol: 'pf', type: 'emphasis', row: 2 },

            // Row 3: 강조표 및 변화표 (5개)
            { id: 'sfz', mark: 'sfz', name_ko: '스포르찬도', meaning_ko: '특히 세게', name_en: 'Sforzando', meaning_en: 'Suddenly with force', color: '#e056fd', vol: 'sfz', type: 'emphasis', row: 3 },
            { id: 'accent', mark: '>', name_ko: '악센트', meaning_ko: '그 음만 특히 세게', name_en: 'Accent', meaning_en: 'Accentuate that note', color: '#f368e0', vol: 'sfz', type: 'emphasis', row: 3 },
            { id: 'cresc', mark: 'cresc.', name_ko: '크레센도', meaning_ko: '점점 세게', name_en: 'Crescendo', meaning_en: 'Gradually louder', color: '#00d2d3', vol: 'up', type: 'change', row: 3 },
            { id: 'decresc', mark: 'decresc.', name_ko: '데크레센도', meaning_ko: '점점 여리게', name_en: 'Decrescendo', meaning_en: 'Gradually softer', color: '#48dbfb', vol: 'down', type: 'change', row: 3 },
            { id: 'dim', mark: 'dim.', name_ko: '디미누엔도', meaning_ko: '점점 여리게', name_en: 'Diminuendo', meaning_en: 'Gradually softer', color: '#0abde3', vol: 'down', type: 'change', row: 3 }
        ];

        // --- State ---
        let currentLang = 'ko';
        let phase = 'intro';
        let learnIndex = 0;
        let isLearningWait = false;
        let quizQuestions = [];
        let currentQuizIndex = 0;
        let score = 0;
        const TOTAL_QUIZ = 13;

        let ttsAudio = null;
        let currentUtterance = null;
        let googleTTSAvailable = true;
        let availableVoices = [];

        // --- Audio System (Web Audio API & MP3 buffers) ---
        let audioCtx;
        const audioBuffers = {};
        const notesToLoad = ['C4', 'E4', 'G4'];

        async function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }

            for (let note of notesToLoad) {
                if (!audioBuffers[note]) {
                    try {
                        const response = await fetch(`https://raw.githubusercontent.com/fuhton/piano-mp3/master/piano-mp3/${note}.mp3`);
                        const arrayBuffer = await response.arrayBuffer();
                        const decodedData = await audioCtx.decodeAudioData(arrayBuffer);
                        audioBuffers[note] = decodedData;
                    } catch (e) {
                        console.error("Failed to load audio buffer for", note, e);
                    }
                }
            }
        }

        function playDynamicChord(volType) {
            if (!audioCtx) return;

            const now = audioCtx.currentTime;
            const duration = 2.0;

            notesToLoad.forEach(note => {
                const buffer = audioBuffers[note];
                if (!buffer) return;

                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                const gainNode = audioCtx.createGain();

                // 다양한 볼륨 변화 적용
                if (typeof volType === 'number') {
                    gainNode.gain.setValueAtTime(volType, now);
                    gainNode.gain.setTargetAtTime(0, now + duration - 0.5, 0.3);
                } else if (volType === 'up') {
                    gainNode.gain.setValueAtTime(0.01, now);
                    gainNode.gain.linearRampToValueAtTime(1.0, now + duration - 0.5);
                    gainNode.gain.setTargetAtTime(0, now + duration - 0.5, 0.3);
                } else if (volType === 'down') {
                    gainNode.gain.setValueAtTime(1.0, now);
                    gainNode.gain.linearRampToValueAtTime(0.01, now + duration - 0.5);
                    gainNode.gain.setTargetAtTime(0, now + duration - 0.5, 0.3);
                } else if (volType === 'fp') {
                    gainNode.gain.setValueAtTime(1.0, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.2, now + 0.3);
                    gainNode.gain.setTargetAtTime(0, now + duration - 0.5, 0.3);
                } else if (volType === 'pf') {
                    gainNode.gain.setValueAtTime(0.2, now);
                    gainNode.gain.exponentialRampToValueAtTime(1.0, now + 0.3);
                    gainNode.gain.setTargetAtTime(0, now + duration - 0.5, 0.3);
                } else if (volType === 'sfz') {
                    gainNode.gain.setValueAtTime(1.2, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.1, now + 0.5);
                    gainNode.gain.setTargetAtTime(0, now + duration - 0.5, 0.3);
                }

                source.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                source.start(now);
            });
        }

        function loadVoices() {
            availableVoices = window.speechSynthesis.getVoices();
        }
        if (window.speechSynthesis.onvoiceschanged !== undefined) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
        }
        loadVoices();

        function stopTTS() {
            if (ttsAudio) { ttsAudio.pause(); ttsAudio = null; }
            window.speechSynthesis.cancel();
            currentUtterance = null;
        }

        async function speak(textKey, isRaw = false) {
            stopTTS();
            let text = isRaw ? textKey : I18N_DATA[currentLang][textKey];
            if (!text) return;
            const cleanText = text.replace(/<[^>]*>/g, '');

            if (googleTTSAvailable) {
                const langCode = currentLang === 'ko' ? 'ko-KR' : 'en-US';
                const voiceName = currentLang === 'ko' ? 'ko-KR-Standard-A' : 'en-US-Standard-E';
                try {
                    const response = await fetch(`https://texttospeech.googleapis.com/v1/text:synthesize?key=${GOOGLE_API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            input: { text: cleanText },
                            voice: { languageCode: langCode, name: voiceName },
                            audioConfig: { audioEncoding: 'MP3' }
                        })
                    });
                    if (!response.ok) throw new Error('API Error');
                    const data = await response.json();
                    if (data.audioContent) {
                        const audioBlob = await fetch(`data:audio/mp3;base64,${data.audioContent}`).then(res => res.blob());
                        ttsAudio = new Audio(URL.createObjectURL(audioBlob));
                        ttsAudio.play();
                        return;
                    }
                } catch (e) {
                    googleTTSAvailable = false;
                }
            }
            fallbackSpeak(cleanText);
        }

        function fallbackSpeak(text) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            currentUtterance = u;
            u.lang = currentLang === 'ko' ? 'ko-KR' : 'en-US';
            u.rate = 0.9;
            if (availableVoices.length === 0) availableVoices = window.speechSynthesis.getVoices();
            if (currentLang !== 'ko') {
                const preferred = ["Google US English", "Samantha", "Microsoft Zira"];
                const voice = availableVoices.find(v => preferred.some(p => v.name.includes(p)));
                if (voice) u.voice = voice;
            } else {
                const koVoice = availableVoices.find(v => v.name.includes('Google 한국어') || v.lang === 'ko-KR');
                if (koVoice) u.voice = koVoice;
            }
            u.onend = () => { currentUtterance = null; };
            window.speechSynthesis.speak(u);
        }

        function playEffect(type) {
            if (type === 'success') new Audio("https://cdn.pixabay.com/audio/2021/08/04/audio_12b2120d58.mp3").play().catch(() => { });
            else if (type === 'wrong') new Audio("https://cdn.pixabay.com/audio/2022/03/24/audio_8780280277.mp3").play().catch(() => { });
        }

        // --- Helpers ---
        function getDynamicMeaning(dyn) {
            return currentLang === 'ko' ? dyn.meaning_ko : dyn.meaning_en;
        }
        function getDynamicName(dyn) {
            return currentLang === 'ko' ? dyn.name_ko : dyn.name_en;
        }

        // --- Game Logic ---
        async function startGame() {
            const startBtn = document.getElementById('start-btn');
            startBtn.classList.add('opacity-50', 'pointer-events-none');
            startBtn.innerHTML = `<span data-i18n="loading">로딩중...</span> <i data-lucide="loader" class="animate-spin"></i>`;
            lucide.createIcons();

            await initAudio();

            document.getElementById('intro-screen').classList.add('hidden');
            document.getElementById('main-stage').classList.remove('hidden');
            startLearnPhase();
        }

        function resetGame() {
            stopTTS();

            const startBtn = document.getElementById('start-btn');
            startBtn.classList.remove('opacity-50', 'pointer-events-none');
            startBtn.innerHTML = `<span data-i18n="start">시작하기!</span> <i data-lucide="rocket"></i>`;

            document.getElementById('intro-screen').classList.remove('hidden');
            document.getElementById('end-screen').classList.add('hidden');
            document.getElementById('main-stage').classList.add('hidden');
            document.getElementById('quiz-dock').classList.add('hidden');
            document.getElementById('quiz-go-btn').classList.add('hidden');
            document.getElementById('large-note-display').classList.add('hidden');
            document.getElementById('learning-guide').classList.add('hidden');

            phase = 'intro';
            learnIndex = 0;
            score = 0;
            isLearningWait = false;
            lucide.createIcons();
        }

        function updateLearningGuide() {
            const guide = document.getElementById('learning-guide');
            if (learnIndex < 6) {
                guide.innerHTML = `<i data-lucide="volume-2" class="w-5 h-5 text-indigo-500"></i><span data-i18n="guideText1">${I18N_DATA[currentLang].guideText1}</span>`;
            } else if (learnIndex < 10) {
                guide.innerHTML = `<i data-lucide="zap" class="w-5 h-5 text-fuchsia-500"></i><span data-i18n="guideText2">${I18N_DATA[currentLang].guideText2}</span>`;
            } else {
                guide.innerHTML = `<i data-lucide="sparkles" class="w-5 h-5 text-cyan-500"></i><span data-i18n="guideText3">${I18N_DATA[currentLang].guideText3}</span>`;
            }
            lucide.createIcons();
        }

        // --- Learn Phase ---
        function startLearnPhase() {
            phase = 'learn';
            learnIndex = 0;
            isLearningWait = false;
            document.getElementById('quiz-dock').classList.add('hidden');
            document.getElementById('quiz-go-btn').classList.add('hidden');
            document.getElementById('learning-guide').classList.remove('hidden');

            updateInstruction('instLearn', 'pointer');
            speak('instLearn');
            renderLearnGrid();
        }

        function renderLearnGrid() {
            const container = document.getElementById('dynamics-container');
            container.innerHTML = '';

            const largeDisplay = document.getElementById('large-note-display');
            const nameDisplay = document.getElementById('display-name');
            const meaningDisplay = document.getElementById('display-meaning');

            updateLearningGuide();

            // 신규 진도 상황이면 기본값인 물음표(?) 상태를 보여줌
            if (phase === 'learn' && learnIndex < DYNAMICS.length) {
                largeDisplay.classList.remove('hidden');
                nameDisplay.innerText = "?";
                nameDisplay.style.color = "#94a3b8";
                meaningDisplay.innerText = "";
                largeDisplay.style.borderColor = "#cbd5e1";
                largeDisplay.style.transform = 'scale(1)';
            } else if (learnIndex >= DYNAMICS.length) {
                // 이미 끝까지 배웠다면 물음표 대신 자유롭게 복습하도록 유지
            }

            // 3줄 구성을 위해 row별로 그룹화
            const rowGroups = { 1: [], 2: [], 3: [] };
            DYNAMICS.forEach((dyn, index) => {
                const el = document.createElement('div');
                el.className = `dynamic-card ${index === learnIndex ? 'note-active' : (index < learnIndex ? 'note-learned' : 'note-locked')}`;
                el.style.backgroundColor = dyn.color;

                const mark = document.createElement('div');
                mark.className = 'dynamic-mark';
                mark.innerText = dyn.mark;

                const name = document.createElement('div');
                name.className = 'dynamic-name';
                name.innerText = getDynamicName(dyn);

                el.appendChild(mark);
                el.appendChild(name);

                // 부가 학습 요소: 소리 크기 바
                if (dyn.step) {
                    const volContainer = document.createElement('div');
                    volContainer.className = 'vol-bar-container';
                    for (let i = 0; i < 6; i++) {
                        const bar = document.createElement('div');
                        bar.className = 'vol-bar';
                        bar.style.opacity = i < dyn.step ? '1' : '0.2';
                        bar.style.height = `${20 + (i * 16)}%`;
                        volContainer.appendChild(bar);
                    }
                    el.appendChild(volContainer);
                }

                // 부가 학습 요소: 강조표 및 변화표 뱃지
                if (dyn.type === 'emphasis' || dyn.type === 'change') {
                    const badge = document.createElement('div');
                    badge.className = 'type-badge';
                    const badgeKey = dyn.type === 'emphasis' ? 'typeEmphasis' : 'typeChange';
                    badge.innerText = I18N_DATA[currentLang][badgeKey];
                    el.appendChild(badge);
                }

                // [UPDATE] 배운 카드 혹은 현재 배워야 하는 카드일 경우 모두 클릭 가능하게 수정
                if (index <= learnIndex) {
                    el.onclick = () => handleLearnClick(index);
                }

                rowGroups[dyn.row].push(el);
            });

            // 각 Row 렌더링
            [1, 2, 3].forEach(rowNum => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'dynamics-row';
                rowGroups[rowNum].forEach(el => rowDiv.appendChild(el));
                container.appendChild(rowDiv);
            });
        }

        function handleLearnClick(index) {
            if (phase !== 'learn' || index > learnIndex || isLearningWait) return;
            isLearningWait = true;

            const dyn = DYNAMICS[index];
            const isNew = (index === learnIndex); // 새로 배우는 항목인지 체크

            playDynamicChord(dyn.vol);

            const speechText = `${getDynamicName(dyn)}, ${getDynamicMeaning(dyn)}`;
            speak(speechText, true);
            fireConfettiAt(1280 / 2, 720 / 2);

            const largeDisplay = document.getElementById('large-note-display');
            const nameDisplay = document.getElementById('display-name');
            const meaningDisplay = document.getElementById('display-meaning');

            // [UPDATE] 피아니시모(pp) 형태로 표시되도록 텍스트 포맷 변경
            nameDisplay.innerHTML = `${getDynamicName(dyn)}(<span style="font-family: 'Times New Roman', serif; font-style: italic; font-size: 1.1em;">${dyn.mark}</span>)`;
            nameDisplay.style.color = dyn.color;
            meaningDisplay.innerText = getDynamicMeaning(dyn);

            largeDisplay.style.borderColor = dyn.color;
            largeDisplay.style.transform = 'scale(1.05)';
            largeDisplay.classList.remove('hidden');

            setTimeout(() => {
                largeDisplay.style.transform = 'scale(1)';
            }, 200);

            if (isNew) {
                // 새로운 진도일 경우 다음으로 넘어감
                setTimeout(() => {
                    learnIndex++;
                    isLearningWait = false;

                    renderLearnGrid();

                    if (learnIndex >= DYNAMICS.length) {
                        document.getElementById('learning-guide').classList.add('hidden');
                        document.getElementById('quiz-go-btn').classList.remove('hidden');
                        updateInstruction('instAllLearned', 'star');
                        speak('instAllLearned');
                    }
                }, 2000);
            } else {
                // 이미 배운 항목을 복습 클릭한 경우
                setTimeout(() => {
                    isLearningWait = false;
                    // 학습이 모두 안 끝났다면 원래 물음표 상태로 되돌려놓음
                    if (learnIndex < DYNAMICS.length) {
                        renderLearnGrid();
                    }
                }, 1200);
            }
        }

        // --- Quiz Phase ---
        function startQuizPhase() {
            phase = 'quiz';
            score = 0;
            currentQuizIndex = 0;
            document.getElementById('quiz-go-btn').classList.add('hidden');
            document.getElementById('learning-guide').classList.add('hidden');

            quizQuestions = [];
            // 전체 13문항 출제
            let shuffledDynamics = [...DYNAMICS].sort(() => Math.random() - 0.5);

            for (let i = 0; i < TOTAL_QUIZ; i++) {
                const type = Math.random() > 0.5 ? 'guess-meaning' : 'guess-mark';
                const target = shuffledDynamics[i];
                let choices = [target];
                const numChoices = type === 'guess-meaning' ? 4 : 3;

                while (choices.length < numChoices) {
                    const randomDyn = DYNAMICS[Math.floor(Math.random() * DYNAMICS.length)];
                    if (!choices.includes(randomDyn)) choices.push(randomDyn);
                }
                choices.sort(() => Math.random() - 0.5);
                quizQuestions.push({ type, target, choices });
            }

            renderQuizStage();
        }

        function createQuizCard(dyn, color, isClickable, container) {
            const el = document.createElement('div');
            el.className = 'dynamic-card note-learned';
            el.style.backgroundColor = color;
            el.style.margin = '0 10px';

            const mark = document.createElement('div');
            mark.className = 'dynamic-mark';
            mark.innerText = dyn.mark;
            el.appendChild(mark);

            container.appendChild(el);
            return el;
        }

        function renderQuizStage() {
            const q = quizQuestions[currentQuizIndex];
            const container = document.getElementById('dynamics-container');
            const dock = document.getElementById('quiz-dock');
            const largeDisplay = document.getElementById('large-note-display');
            const nameDisplay = document.getElementById('display-name');
            const meaningDisplay = document.getElementById('display-meaning');

            // 퀴즈에서는 한 줄로 중앙 배치
            container.innerHTML = '<div class="dynamics-row" id="quiz-row"></div>';
            const quizRow = document.getElementById('quiz-row');
            dock.innerHTML = '';

            if (q.type === 'guess-meaning') {
                largeDisplay.classList.remove('hidden');
                dock.classList.remove('hidden');

                updateInstruction('instQuizName', 'help-circle');
                speak('instQuizName');

                // [UPDATE] 퀴즈 모드에서는 정답 스포일러 방지를 위해 기호만 크게 출력
                nameDisplay.innerHTML = `<span style="font-family: 'Times New Roman', serif; font-style: italic; font-size: 55px;">${q.target.mark}</span>`;
                nameDisplay.style.color = q.target.color;
                meaningDisplay.innerText = "";
                largeDisplay.style.borderColor = q.target.color;

                q.choices.forEach(choice => {
                    const btn = document.createElement('button');
                    btn.className = 'quiz-btn';
                    btn.style.backgroundColor = choice.color;
                    btn.innerText = getDynamicMeaning(choice);
                    btn.onclick = () => handleQuizAnswer(choice.id === q.target.id, btn, q.target);
                    dock.appendChild(btn);
                });
            } else {
                dock.classList.add('hidden');
                largeDisplay.classList.remove('hidden');

                const targetMeaning = getDynamicMeaning(q.target);
                // [UPDATE] 뜻을 보여주고 기호를 맞추는 문제
                nameDisplay.innerText = targetMeaning;
                nameDisplay.style.color = q.target.color;
                meaningDisplay.innerText = "";
                largeDisplay.style.borderColor = q.target.color;

                updateInstruction('instQuizNote', 'search');
                const speakText = currentLang === 'ko' ? `어느 기호가 '${targetMeaning}' 일까요?` : `Which is '${targetMeaning}'?`;
                speak(speakText, true);

                q.choices.forEach((choice) => {
                    const el = createQuizCard(choice, '#475569', true, quizRow);
                    el.onclick = () => handleQuizAnswer(choice.id === q.target.id, el, q.target);
                });
            }
        }

        function handleQuizAnswer(isCorrect, element, target) {
            if (isCorrect) {
                playDynamicChord(target.vol);
                playEffect('success');
                fireConfetti();
                score++;
                currentQuizIndex++;

                if (element.classList.contains('dynamic-card')) {
                    element.style.backgroundColor = target.color;
                }

                if (currentQuizIndex >= TOTAL_QUIZ) {
                    setTimeout(showEndScreen, 1200);
                } else {
                    setTimeout(renderQuizStage, 800);
                }
            } else {
                playEffect('wrong');
                element.classList.add('wrong-shake');
                setTimeout(() => element.classList.remove('wrong-shake'), 400);
            }
        }

        function showEndScreen() {
            document.getElementById('main-stage').classList.add('hidden');
            document.getElementById('end-screen').classList.remove('hidden');
            document.getElementById('end-screen').classList.add('flex');

            const scoreFmt = I18N_DATA[currentLang].scoreFmt.replace('{total}', TOTAL_QUIZ).replace('{score}', score);
            document.getElementById('score-text').innerText = scoreFmt;

            const msgEl = document.querySelector('[data-i18n="perfectMsg"]');
            if (score === TOTAL_QUIZ) {
                msgEl.innerText = I18N_DATA[currentLang].perfectMsg;
            } else if (score >= TOTAL_QUIZ * 0.7) {
                msgEl.innerText = currentLang === 'ko' ? "참 잘했어요! 조금만 더 연습해봐요!" : "Great job! Keep practicing!";
            } else {
                msgEl.innerText = currentLang === 'ko' ? "다시 한번 도전해볼까요? 할 수 있어요!" : "Let's try again! You can do it!";
            }

            speak('successTitle');
            fireConfetti();
            setTimeout(fireConfetti, 1000);
        }

        // --- Modals & Utils ---
        function showManual() {
            document.getElementById('manual-modal').classList.remove('hidden');
            document.getElementById('manual-modal').classList.add('flex');
            speak('manualText');
        }
        function closeManual() {
            document.getElementById('manual-modal').classList.add('hidden');
            document.getElementById('manual-modal').classList.remove('flex');
            stopTTS();
        }
        function showExitModal() {
            document.getElementById('exit-modal').classList.remove('hidden');
            document.getElementById('exit-modal').classList.add('flex');
            speak('exitConfirm');
        }
        function closeExitModal() {
            document.getElementById('exit-modal').classList.add('hidden');
            document.getElementById('exit-modal').classList.remove('flex');
            stopTTS();
        }
        function confirmExit() {
            if (document.referrer) {
                window.location.href = document.referrer;
            } else {
                window.history.back();
            }
        }

        function updateInstruction(key, icon) {
            document.getElementById('instruction-text').innerHTML = I18N_DATA[currentLang][key];
            document.getElementById('mascot-icon').innerHTML = `<i data-lucide="${icon}" class="text-white w-6 h-6"></i>`;
            lucide.createIcons();
        }

        function toggleLang() {
            currentLang = currentLang === 'ko' ? 'en' : 'ko';
            document.getElementById('btn-lang').innerText = currentLang === 'ko' ? 'English' : '한국어';

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (I18N_DATA[currentLang][key]) el.innerHTML = I18N_DATA[currentLang][key];
            });

            if (phase === 'learn') {
                if (learnIndex < DYNAMICS.length) {
                    updateLearningGuide();
                } else {
                    updateInstruction('instAllLearned', 'star');
                }
                renderLearnGrid();
            }
            if (phase === 'quiz') renderQuizStage();
            if (phase === 'intro') updateInstruction('instLearn', 'pointer');

            const speakText = currentLang === 'ko' ? '한국어' : 'English';
            speak(speakText, true);
        }

        // --- Scaling ---
        function resizeGame() {
            const wrap = document.getElementById('scalable-wrapper');
            const cont = document.getElementById('game-container');
            const scale = Math.min(cont.clientWidth / 1280, cont.clientHeight / 720);
            wrap.style.transform = `scale(${scale})`;
        }
        window.addEventListener('resize', resizeGame);

        // --- Confetti ---
        const canvas = document.getElementById("confetti");
        const ctx = canvas.getContext("2d");
        let particles = [];

        function fireConfetti() {
            fireConfettiAt(1280 / 2, 720 / 2);
        }

        function fireConfettiAt(cx, cy) {
            for (let i = 0; i < 40; i++) {
                particles.push({
                    x: cx, y: cy,
                    dx: (Math.random() - 0.5) * 25, dy: (Math.random() - 0.5) * 25,
                    color: `hsl(${Math.random() * 360},80%,60%)`, life: 100
                });
            }
            if (particles.length <= 40) requestAnimationFrame(updateConfetti);
        }

        function updateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, i) => {
                p.x += p.dx; p.y += p.dy; p.life--;
                ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, Math.PI * 2); ctx.fill();
                if (p.life <= 0) particles.splice(i, 1);
            });
            if (particles.length > 0) requestAnimationFrame(updateConfetti);
        }
        canvas.width = 1280; canvas.height = 720;

        window.addEventListener('load', () => {
            resizeGame();
            lucide.createIcons();
        });
        lucide.createIcons();
    </script>
