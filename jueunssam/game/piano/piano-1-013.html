<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>손으로 연주하는 무지개 피아노</title>

    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { corePlugins: { preflight: false } }</script>
    <script src="https://unpkg.com/lucide@latest" onerror="console.warn('Lucide icons failed to load');"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --header-height: 60px;
            --piano-height: clamp(300px, 58vh, 620px);
            --sun: #ffe45e;
            --ink: #162033;
            --blue: #2f80ed;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            position: fixed;
            inset: 0;
            font-family: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at 18% 22%, rgba(255, 228, 94, 0.72), transparent 28%),
                radial-gradient(circle at 86% 20%, rgba(47, 128, 237, 0.34), transparent 26%),
                linear-gradient(135deg, #fff7c2 0%, #f6fbff 45%, #dbeafe 100%);
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        .app-header {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 60;
            width: 100%;
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 0 18px;
            color: #3b1e1e;
            background: linear-gradient(135deg, #FEE500 0%, #FBC02D 100%);
            border-bottom: 2px solid rgba(123, 87, 0, 0.2);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.16);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            font-size: clamp(16px, 3vw, 23px);
            font-weight: 900;
            white-space: nowrap;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 36px;
            padding: 7px 14px;
            font-family: inherit;
            font-size: clamp(12px, 2.2vw, 14px);
            font-weight: 900;
            color: #3b1e1e;
            background: rgba(255, 255, 255, 0.54);
            border: 2px solid rgba(255, 255, 255, 0.78);
            border-radius: 999px;
            cursor: pointer;
        }

        #app {
            position: fixed;
            inset: var(--header-height) 0 0 0;
            overflow: hidden;
        }

        #camera-layer {
            position: absolute;
            inset: 0;
            overflow: hidden;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.45), rgba(219, 234, 254, 0.68));
        }

        #input-video,
        #hand-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #input-video {
            transform: scaleX(-1);
            opacity: 0.22;
            filter: saturate(1.08) contrast(1.04);
        }

        #hand-canvas {
            z-index: 24;
            pointer-events: none;
        }

        .soft-vignette {
            position: absolute;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            background:
                radial-gradient(circle at 50% 18%, rgba(255, 255, 255, 0.4), transparent 36%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.14), rgba(8, 21, 45, 0.34));
        }

        #color-ripples {
            position: absolute;
            inset: 0;
            z-index: 5;
            overflow: hidden;
            pointer-events: none;
        }

        .color-ripple {
            position: absolute;
            width: 34vmax;
            height: 34vmax;
            border-radius: 50%;
            background: var(--ripple-color, #3b82f6);
            filter: blur(18px);
            opacity: 0.42;
            mix-blend-mode: screen;
            transform: translate(-50%, -50%) scale(0.04);
            animation: colorBloom 1.05s ease-out forwards;
        }

        @keyframes colorBloom {
            0% {
                opacity: 0.58;
                transform: translate(-50%, -50%) scale(0.04);
            }

            72% {
                opacity: 0.24;
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1.95);
            }
        }

        .hero-panel {
            position: absolute;
            top: clamp(14px, 3vh, 28px);
            left: 50%;
            z-index: 10;
            width: min(92vw, 920px);
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
        }

        .hero-title {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 22px;
            color: #0f172a;
            font-size: clamp(24px, 5vw, 52px);
            line-height: 1.08;
            background: rgba(255, 255, 255, 0.8);
            border: 4px solid rgba(255, 255, 255, 0.95);
            border-radius: 999px;
            box-shadow: 0 16px 42px rgba(37, 99, 235, 0.18);
            backdrop-filter: blur(10px);
        }

        .status-row {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 8px 14px;
            color: #1e3a8a;
            font-size: clamp(13px, 2vw, 18px);
            background: rgba(255, 255, 255, 0.76);
            border: 2px solid rgba(59, 130, 246, 0.24);
            border-radius: 999px;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.1);
        }

        .control-dock {
            position: absolute;
            top: clamp(132px, 21vh, 190px);
            left: 50%;
            z-index: 14;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            width: min(94vw, 880px);
            transform: translateX(-50%);
        }

        .control-card {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            color: #0f172a;
            background: rgba(255, 255, 255, 0.82);
            border: 3px solid rgba(255, 255, 255, 0.92);
            border-radius: 18px;
            box-shadow: 0 10px 26px rgba(15, 23, 42, 0.12);
            backdrop-filter: blur(10px);
        }

        .control-card strong {
            color: #1d4ed8;
            font-size: clamp(15px, 2vw, 20px);
        }

        .mini-btn,
        .select-control {
            min-height: 34px;
            padding: 5px 11px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 900;
            color: #172554;
            background: #eff6ff;
            border: 2px solid #bfdbfe;
            border-radius: 12px;
        }

        .mini-btn {
            cursor: pointer;
        }

        .now-note {
            position: absolute;
            top: clamp(210px, 35vh, 330px);
            left: 50%;
            z-index: 12;
            min-width: clamp(150px, 24vw, 260px);
            padding: 12px 22px;
            color: #fff;
            font-size: clamp(26px, 6vw, 62px);
            line-height: 1;
            text-align: center;
            text-shadow: 0 4px 0 rgba(0, 0, 0, 0.18);
            background: linear-gradient(135deg, #2563eb, #7c3aed 52%, #ec4899);
            border: 5px solid rgba(255, 255, 255, 0.9);
            border-radius: 32px;
            box-shadow: 0 20px 45px rgba(37, 99, 235, 0.28);
            transform: translateX(-50%);
            transition: transform 0.16s ease;
        }

        .now-note.pop {
            transform: translateX(-50%) scale(1.08) rotate(-1deg);
        }

        #piano-stage {
            position: absolute;
            left: 50%;
            bottom: clamp(12px, 3vh, 30px);
            z-index: 18;
            width: min(98vw, 1540px);
            height: var(--piano-height);
            padding: clamp(14px, 2vw, 26px);
            overflow: hidden;
            transform: translateX(-50%);
            background:
                linear-gradient(135deg, rgba(23, 23, 23, 0.98), rgba(15, 23, 42, 0.96)),
                radial-gradient(circle at 18% 0%, rgba(255, 228, 94, 0.34), transparent 28%);
            border: 8px solid rgba(255, 255, 255, 0.72);
            border-radius: clamp(24px, 4vw, 46px);
            box-shadow: 0 28px 80px rgba(15, 23, 42, 0.34);
        }

        #keys {
            position: relative;
            display: flex;
            width: 100%;
            height: 100%;
            border-radius: 0 0 28px 28px;
        }

        .piano-key {
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            font-family: inherit;
            border: 0;
            cursor: pointer;
            transition: transform 0.06s ease, filter 0.1s ease, box-shadow 0.1s ease;
        }

        .piano-key.white {
            flex: 1 1 0;
            min-width: 0;
            height: 100%;
            padding-bottom: clamp(18px, 4vh, 42px);
            color: #334155;
            font-size: clamp(13px, 2vw, 24px);
            font-weight: 900;
            background:
                linear-gradient(180deg, #ffffff 0%, #f8fafc 62%, #e2e8f0 100%);
            border-right: 2px solid #cbd5e1;
            border-radius: 0 0 18px 18px;
            box-shadow: inset 0 -10px 24px rgba(15, 23, 42, 0.12);
        }

        .piano-key.white:last-child {
            border-right: 0;
        }

        .piano-key.black {
            position: absolute;
            top: 0;
            z-index: 4;
            width: calc(100% / var(--white-count) * 0.62);
            height: 62%;
            padding-bottom: clamp(10px, 2vh, 22px);
            color: #fff;
            font-size: clamp(10px, 1.4vw, 17px);
            font-weight: 900;
            background:
                linear-gradient(180deg, #111827 0%, #030712 82%, #1f2937 100%);
            border: 3px solid rgba(255, 255, 255, 0.08);
            border-radius: 0 0 14px 14px;
            box-shadow: 0 12px 22px rgba(0, 0, 0, 0.46), inset 0 -8px 16px rgba(255, 255, 255, 0.08);
            transform: translateX(-50%);
        }

        .piano-key.active {
            filter: brightness(1.08) saturate(1.18);
            transform: translateY(7px);
        }

        .piano-key.black.active {
            transform: translateX(-50%) translateY(6px);
        }

        .piano-key.detecting {
            box-shadow: inset 0 -10px 24px rgba(15, 23, 42, 0.12), 0 0 0 6px rgba(254, 229, 0, 0.6), 0 0 28px rgba(254, 229, 0, 0.72);
        }

        .key-label {
            pointer-events: none;
        }

        .finger-dot {
            position: absolute;
            z-index: 34;
            width: 28px;
            height: 28px;
            margin: -14px 0 0 -14px;
            pointer-events: none;
            border: 4px solid rgba(255, 255, 255, 0.88);
            border-radius: 50%;
            background: rgba(254, 229, 0, 0.94);
            box-shadow: 0 0 22px rgba(254, 229, 0, 0.92), 0 0 0 8px rgba(254, 229, 0, 0.2);
            transform: scale(0);
            transition: transform 0.08s ease;
        }

        .finger-dot.visible {
            transform: scale(1);
        }

        .toast {
            position: absolute;
            z-index: 44;
            left: 50%;
            bottom: calc(var(--piano-height) + 42px);
            padding: 10px 18px;
            color: #111827;
            font-size: clamp(14px, 2.5vw, 20px);
            background: var(--sun);
            border: 3px solid #fff;
            border-radius: 999px;
            box-shadow: 0 14px 24px rgba(15, 23, 42, 0.24);
            transform: translate(-50%, 80px);
            opacity: 0;
            transition: transform 0.22s ease, opacity 0.22s ease;
            pointer-events: none;
            white-space: nowrap;
        }

        .toast.show {
            transform: translate(-50%, 0);
            opacity: 1;
        }

        @media (max-width: 900px) {
            :root {
                --piano-height: clamp(260px, 56vh, 520px);
            }

            .control-dock {
                top: 112px;
            }

            .control-card {
                padding: 6px 9px;
            }

            .now-note {
                display: none;
            }

            .hero-title {
                font-size: clamp(20px, 4vw, 36px);
            }
        }

        @media (max-height: 620px) {
            :root {
                --piano-height: clamp(220px, 52vh, 360px);
            }

            .hero-panel {
                top: 8px;
            }

            .hero-title {
                padding: 7px 16px;
            }

            .status-row,
            .control-dock {
                display: none;
            }
        }
    </style>
</head>

<body>
    <header class="app-header">
        <div class="header-title">
            <i data-lucide="piano" class="w-6 h-6"></i>
            <span>손으로 연주하는 무지개 피아노</span>
        </div>
        <div class="header-actions">
            <button class="header-btn" id="btn-mute" type="button">
                <i data-lucide="volume-2" class="w-4 h-4"></i>
                <span class="label">소리 켜짐</span>
            </button>
            <button class="header-btn" id="btn-exit" type="button">
                <i data-lucide="log-out" class="w-4 h-4"></i>
                <span class="label">나가기</span>
            </button>
        </div>
    </header>

    <main id="app">
        <section id="camera-layer" aria-label="카메라 피아노 연주 영역">
            <video id="input-video" playsinline muted></video>
            <canvas id="hand-canvas"></canvas>
            <div id="color-ripples"></div>
            <div class="soft-vignette"></div>
        </section>

        <section class="hero-panel">
            <h1 class="hero-title"><i data-lucide="sparkles"></i> Rainbow Hand Piano</h1>
            <div class="status-row">
                <span class="status-pill" id="camera-status"><i data-lucide="camera"></i> 카메라 준비 중...</span>
                <span class="status-pill">검지와 중지로 건반을 연주해요</span>
            </div>
        </section>

        <section class="control-dock" aria-label="피아노 설정">
            <div class="control-card">
                <span>옥타브</span>
                <strong><span id="octave-min">4</span> - <span id="octave-max">5</span></strong>
                <button class="mini-btn" id="octave-down" type="button">-</button>
                <button class="mini-btn" id="octave-up" type="button">+</button>
            </div>
            <label class="control-card" for="waveform">
                <span>소리</span>
                <select class="select-control" id="waveform">
                    <option value="sine" selected>Sine</option>
                    <option value="triangle">Triangle</option>
                    <option value="sawtooth">Sawtooth</option>
                    <option value="square">Square</option>
                </select>
            </label>
        </section>

        <div class="now-note" id="now-note">READY</div>

        <section id="piano-stage" aria-label="피아노 건반">
            <div id="keys"></div>
        </section>

        <div class="finger-dot" id="finger-0"></div>
        <div class="finger-dot" id="finger-1"></div>
        <div class="finger-dot" id="finger-2"></div>
        <div class="finger-dot" id="finger-3"></div>
        <div class="toast" id="toast">카메라 권한을 허용하면 손으로 연주할 수 있어요.</div>
    </main>

    <script>
        const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        const WHITE_NOTES = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
        const BLACK_AFTER_WHITE = { C: 'C#', D: 'D#', F: 'F#', G: 'G#', A: 'A#' };
        const NOTE_COLORS = ['#ef4444', '#f97316', '#f59e0b', '#eab308', '#84cc16', '#22c55e', '#14b8a6', '#06b6d4', '#3b82f6', '#6366f1', '#a855f7', '#ec4899'];
        const TIP_POINTS = [8, 12];
        const HIT_COOLDOWN = 155;
        const REPEAT_COOLDOWN = 380;

        let audioCtx = null;
        let masterGain = null;
        let muted = false;
        let hands = null;
        let camera = null;
        let selectedOctaveMin = 4;
        let selectedOctaveMax = 5;
        let selectedWaveform = 'sine';
        let previousTips = new Map();
        let activeZones = new Map();
        let lastKeyHit = {};
        let hideToastTimer = null;
        let lastNoHandToastAt = 0;
        let cameraStarted = false;

        const video = document.getElementById('input-video');
        const canvas = document.getElementById('hand-canvas');
        const ctx = canvas.getContext('2d');
        const keysEl = document.getElementById('keys');
        const nowNoteEl = document.getElementById('now-note');
        const colorRipplesEl = document.getElementById('color-ripples');
        const cameraStatus = document.getElementById('camera-status');
        const toast = document.getElementById('toast');
        const octaveMinEl = document.getElementById('octave-min');
        const octaveMaxEl = document.getElementById('octave-max');
        const waveformEl = document.getElementById('waveform');
        const fingerDots = [
            document.getElementById('finger-0'),
            document.getElementById('finger-1'),
            document.getElementById('finger-2'),
            document.getElementById('finger-3')
        ];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 60;
            canvas.style.width = '100%';
            canvas.style.height = '100%';
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(hideToastTimer);
            hideToastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
        }

        function setCameraStatus(text) {
            cameraStatus.innerHTML = `<i data-lucide="camera"></i> ${text}`;
            if (window.lucide) lucide.createIcons();
        }

        function initAudio() {
            if (audioCtx) {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                return;
            }
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            masterGain = audioCtx.createGain();
            masterGain.gain.value = muted ? 0 : 0.75;
            masterGain.connect(audioCtx.destination);
        }

        function noteToFrequency(noteName, octave) {
            const semitone = NOTE_NAMES.indexOf(noteName);
            const midiNumber = (octave + 1) * 12 + semitone;
            return 440 * Math.pow(2, (midiNumber - 69) / 12);
        }

        function buildNotes() {
            const notes = [];
            for (let octave = selectedOctaveMin; octave <= selectedOctaveMax; octave++) {
                WHITE_NOTES.forEach((whiteName) => {
                    notes.push({ name: whiteName, octave, sharp: false, frequency: noteToFrequency(whiteName, octave) });
                    const blackName = BLACK_AFTER_WHITE[whiteName];
                    if (blackName) notes.push({ name: blackName, octave, sharp: true, frequency: noteToFrequency(blackName, octave) });
                });
            }
            return notes;
        }

        function drawKeys() {
            keysEl.innerHTML = '';
            previousTips.clear();
            activeZones.clear();
            lastKeyHit = {};

            const notes = buildNotes();
            const whites = notes.filter((note) => !note.sharp);
            keysEl.style.setProperty('--white-count', whites.length);
            octaveMinEl.textContent = selectedOctaveMin;
            octaveMaxEl.textContent = selectedOctaveMax;

            whites.forEach((note, whiteIndex) => {
                const key = document.createElement('button');
                key.type = 'button';
                key.className = 'piano-key white';
                key.dataset.noteId = `${note.name}${note.octave}`;
                key.dataset.note = note.name;
                key.dataset.octave = note.octave;
                key.dataset.frequency = note.frequency;
                key.dataset.color = NOTE_COLORS[NOTE_NAMES.indexOf(note.name)];
                key.innerHTML = `<span class="key-label">${note.name}${note.octave}</span>`;
                key.addEventListener('pointerdown', (event) => {
                    event.preventDefault();
                    hitKey(key, true);
                });
                keysEl.appendChild(key);

                const blackName = BLACK_AFTER_WHITE[note.name];
                if (blackName) {
                    const blackKey = document.createElement('button');
                    blackKey.type = 'button';
                    blackKey.className = 'piano-key black';
                    blackKey.dataset.noteId = `${blackName}${note.octave}`;
                    blackKey.dataset.note = blackName;
                    blackKey.dataset.octave = note.octave;
                    blackKey.dataset.frequency = noteToFrequency(blackName, note.octave);
                    blackKey.dataset.color = NOTE_COLORS[NOTE_NAMES.indexOf(blackName)];
                    blackKey.style.left = `${((whiteIndex + 1) / whites.length) * 100}%`;
                    blackKey.innerHTML = `<span class="key-label">${blackName}${note.octave}</span>`;
                    blackKey.addEventListener('pointerdown', (event) => {
                        event.preventDefault();
                        hitKey(blackKey, true);
                    });
                    keysEl.appendChild(blackKey);
                }
            });
        }

        function playSound(frequency) {
            initAudio();
            const now = audioCtx.currentTime;
            const oscillator = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            oscillator.type = selectedWaveform;
            oscillator.frequency.setValueAtTime(frequency, now);
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(selectedWaveform === 'square' ? 1800 : 3200, now);

            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.exponentialRampToValueAtTime(0.44, now + 0.018);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.12);

            oscillator.connect(filter);
            filter.connect(gain);
            gain.connect(masterGain);
            oscillator.start(now);
            oscillator.stop(now + 1.18);
        }

        function hitKey(key, force = false) {
            const now = performance.now();
            const noteId = key.dataset.noteId;
            if (!force && now - (lastKeyHit[noteId] || 0) < HIT_COOLDOWN) return;

            lastKeyHit[noteId] = now;
            playSound(Number(key.dataset.frequency));
            animateKey(key);
            updateNowNote(key);
            createColorRipple(key);
        }

        function animateKey(key) {
            key.classList.remove('active');
            void key.offsetWidth;
            key.classList.add('active');
            setTimeout(() => key.classList.remove('active'), 150);
        }

        function updateNowNote(key) {
            const noteText = key.dataset.noteId;
            nowNoteEl.textContent = noteText;
            nowNoteEl.style.background = `linear-gradient(135deg, ${key.dataset.color}, #2563eb)`;
            nowNoteEl.classList.remove('pop');
            void nowNoteEl.offsetWidth;
            nowNoteEl.classList.add('pop');
            setTimeout(() => nowNoteEl.classList.remove('pop'), 180);
        }

        function createColorRipple(key) {
            const rect = key.getBoundingClientRect();
            const appRect = document.getElementById('app').getBoundingClientRect();
            const ripple = document.createElement('span');
            ripple.className = 'color-ripple';
            ripple.style.setProperty('--ripple-color', key.dataset.color || '#3b82f6');
            ripple.style.left = `${rect.left + rect.width / 2 - appRect.left}px`;
            ripple.style.top = `${rect.top + rect.height * 0.55 - appRect.top}px`;
            colorRipplesEl.appendChild(ripple);
            setTimeout(() => ripple.remove(), 1150);
        }

        function findKeyAtPoint(x, y) {
            const blackKeys = Array.from(document.querySelectorAll('.piano-key.black'));
            const whiteKeys = Array.from(document.querySelectorAll('.piano-key.white'));
            const allKeys = [...blackKeys, ...whiteKeys];
            return allKeys.find((key) => {
                const rect = key.getBoundingClientRect();
                return x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
            }) || null;
        }

        function clearDetecting() {
            document.querySelectorAll('.piano-key.detecting').forEach((key) => key.classList.remove('detecting'));
        }

        function updateFingerDots(points) {
            fingerDots.forEach((dot, index) => {
                const point = points[index];
                if (!point) {
                    dot.classList.remove('visible');
                    return;
                }
                dot.style.left = `${point.x}px`;
                dot.style.top = `${point.y}px`;
                dot.classList.add('visible');
            });
        }

        function processTips(points) {
            const now = performance.now();
            const seenKeys = new Set();
            clearDetecting();

            points.forEach((point) => {
                seenKeys.add(point.key);
                const key = findKeyAtPoint(point.x, point.viewportY);
                const prevZone = activeZones.get(point.key);
                const prev = previousTips.get(point.key);
                const velocityY = prev ? point.y - prev.y : 0;
                previousTips.set(point.key, { x: point.x, y: point.y, t: now });

                if (!key) {
                    activeZones.delete(point.key);
                    return;
                }

                key.classList.add('detecting');
                const noteId = key.dataset.noteId;
                const lastFingerHit = previousTips.get(`${point.key}:hit`)?.t || 0;
                const isNewZone = prevZone !== noteId;
                const isTap = velocityY > 8 && now - lastFingerHit > REPEAT_COOLDOWN;

                if (isNewZone || isTap) {
                    hitKey(key);
                    previousTips.set(`${point.key}:hit`, { t: now });
                    activeZones.set(point.key, noteId);
                }
            });

            Array.from(activeZones.keys()).forEach((key) => {
                if (!seenKeys.has(key)) activeZones.delete(key);
            });
        }

        function drawHands(results) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const width = window.innerWidth;
            const height = window.innerHeight - 60;
            const points = [];

            if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
                updateFingerDots([]);
                clearDetecting();
                const now = performance.now();
                if (cameraStarted && now - lastNoHandToastAt > 3200) {
                    showToast('손이 보이지 않아요. 카메라 앞에서 손을 보여주세요.');
                    lastNoHandToastAt = now;
                }
                return;
            }

            results.multiHandLandmarks.forEach((landmarks, handIndex) => {
                if (typeof drawConnectors === 'function' && typeof HAND_CONNECTIONS !== 'undefined') {
                    const mirrored = landmarks.map((point) => ({ ...point, x: 1 - point.x }));
                    drawConnectors(ctx, mirrored, HAND_CONNECTIONS, { color: 'rgba(37, 99, 235, 0.58)', lineWidth: 4 });
                    drawLandmarks(ctx, mirrored, { color: '#ffffff', lineWidth: 1, radius: 3 });
                }

                TIP_POINTS.forEach((tipIndex) => {
                    const tip = landmarks[tipIndex];
                    if (!tip) return;
                    points.push({
                        key: `${handIndex}-${tipIndex}`,
                        x: (1 - tip.x) * width,
                        y: tip.y * height,
                        viewportY: tip.y * height + 60
                    });
                });
            });

            updateFingerDots(points.slice(0, fingerDots.length));
            processTips(points);
        }

        async function startCamera() {
            if (cameraStarted) return;
            cameraStarted = true;
            setCameraStatus('카메라 준비 중...');
            showToast('카메라 권한을 허용해주세요.');

            if (typeof Hands === 'undefined' || typeof Camera === 'undefined') {
                setCameraStatus('터치 모드');
                showToast('손 인식 스크립트를 불러오지 못했어요. 건반을 직접 눌러 연주하세요.');
                return;
            }

            try {
                hands = new Hands({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
                });
                hands.setOptions({
                    maxNumHands: 2,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.62,
                    minTrackingConfidence: 0.58
                });
                hands.onResults(drawHands);

                camera = new Camera(video, {
                    onFrame: async () => {
                        await hands.send({ image: video });
                    },
                    width: 1280,
                    height: 720
                });

                await camera.start();
                setCameraStatus('손 인식 중');
                showToast('검지나 중지를 건반 위로 가져가 보세요!');
            } catch (error) {
                console.error(error);
                cameraStarted = false;
                setCameraStatus('터치 모드');
                showToast('카메라를 사용할 수 없어 터치 연주 모드로 전환했어요.');
            }
        }

        function changeOctave(direction) {
            const nextMin = selectedOctaveMin + direction;
            const nextMax = selectedOctaveMax + direction;
            if (nextMin < 1 || nextMax > 7) return;
            selectedOctaveMin = nextMin;
            selectedOctaveMax = nextMax;
            drawKeys();
        }

        function toggleMute() {
            muted = !muted;
            if (masterGain) masterGain.gain.value = muted ? 0 : 0.75;
            const btn = document.getElementById('btn-mute');
            btn.innerHTML = muted
                ? '<i data-lucide="volume-x" class="w-4 h-4"></i><span class="label">소리 꺼짐</span>'
                : '<i data-lucide="volume-2" class="w-4 h-4"></i><span class="label">소리 켜짐</span>';
            if (window.lucide) lucide.createIcons();
        }

        function exitPage() {
            if (camera && typeof camera.stop === 'function') {
                try { camera.stop(); } catch (e) { }
            }
            if (window.history.length > 1) window.history.back();
            else window.location.href = 'https://jueunssam.com/web-study/';
        }

        document.getElementById('octave-down').addEventListener('click', () => changeOctave(-1));
        document.getElementById('octave-up').addEventListener('click', () => changeOctave(1));
        waveformEl.addEventListener('change', (event) => {
            selectedWaveform = event.target.value;
        });
        document.getElementById('btn-mute').addEventListener('click', toggleMute);
        document.getElementById('btn-exit').addEventListener('click', exitPage);
        window.addEventListener('resize', resizeCanvas);

        resizeCanvas();
        drawKeys();
        if (window.lucide) lucide.createIcons();
        startCamera();
    </script>
