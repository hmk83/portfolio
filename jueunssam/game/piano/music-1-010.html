<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>음표를 공부해요!</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --gnb-height: 60px;
            --app-bg: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: 'Jua', sans-serif;
            background: var(--app-bg);
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            min-height: 100dvh;
            height: 100dvh;
            width: 100vw;
        }

        button {
            white-space: nowrap !important;
        }

        #gnb {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--gnb-height);
            background-color: #FEE500;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        #game-container {
            position: fixed;
            top: var(--gnb-height);
            bottom: 0;
            left: 0;
            width: 100%;
            height: calc(100dvh - var(--gnb-height));
            min-height: calc(100dvh - var(--gnb-height));
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-sizing: border-box;
            padding: 18px 0 22px;
        }

        #scalable-wrapper {
            width: 1280px;
            height: 720px;
            position: relative;
            transform-origin: center center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Animations */
        .sway {
            animation: sway 3s infinite ease-in-out;
        }

        .pop-in {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .shake {
            animation: shake 0.5s;
        }

        .bounce-slow {
            animation: bounce-slow 1.5s infinite alternate;
        }

        .float {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes sway {

            0%,
            100% {
                transform: rotate(-3deg);
            }

            50% {
                transform: rotate(3deg);
            }
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25%,
            75% {
                transform: translateX(-10px);
            }

            50% {
                transform: translateX(10px);
            }
        }

        @keyframes bounce-slow {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(-10px);
            }
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-15px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        @keyframes feedbackPop {
            0% {
                transform: scale(0.2);
                opacity: 0;
            }

            30% {
                transform: scale(1.2);
                opacity: 1;
            }

            50% {
                transform: scale(1);
                opacity: 1;
            }

            80% {
                transform: scale(1);
                opacity: 1;
            }

            100% {
                transform: scale(1.2);
                opacity: 0;
            }
        }

        /* Game UI Styles */
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 4px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border-radius: 40px;
        }

        .btn-3d {
            transition: all 0.1s;
            box-shadow: 0 6px 0 0 rgba(0, 0, 0, 0.2);
        }

        .btn-3d:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 0 rgba(0, 0, 0, 0.2);
        }

        .nav-btn {
            transition: transform 0.1s;
        }

        .nav-btn:active {
            transform: scale(0.9);
        }

        /* Study Cards */
        .study-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
            border: 4px solid #E5E7EB;
            overflow: hidden;
            transition: all 0.2s;
        }

        .study-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.12);
            border-color: #93C5FD;
        }

        .hidden-content {
            filter: blur(12px);
            opacity: 0.6;
            pointer-events: none;
            transition: all 0.3s;
        }

        .peek {
            filter: blur(0px) !important;
            opacity: 1 !important;
        }

        /* Drag & Drop */
        .drag-item {
            cursor: grab;
            z-index: 20;
            touch-action: none;
        }

        .drag-item:active {
            cursor: grabbing;
        }

        .drag-item.dragging {
            opacity: 0;
            transform: scale(0.9);
        }

        .drop-zone {
            transition: all 0.2s;
            border: 4px dashed #CBD5E1;
        }

        .drop-zone.drag-over {
            background-color: #FEF08A;
            border-color: #EAB308;
            transform: scale(1.05);
        }

        .drop-zone.matched {
            border-style: solid;
            animation: popIn 0.5s;
        }

        .match-card {
            position: relative;
            min-height: 92px;
            width: 100%;
            border-radius: 22px;
            border: 4px solid #cbd5e1;
            background: #ffffff;
            box-shadow: 0 10px 20px rgba(15, 23, 42, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, background 0.18s ease, opacity 0.2s ease;
        }

        .match-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 28px rgba(15, 23, 42, 0.12);
        }

        .match-card.selected {
            border-color: #f59e0b;
            background: #eef9cf;
            box-shadow: 0 0 0 6px rgba(251, 191, 36, 0.24);
            transform: scale(1.02);
        }

        .match-card.wrong {
            border-color: #fb7185;
            background: #ffe4e6;
            animation: shake 0.45s;
        }

        .match-card.removing {
            opacity: 0;
            transform: scale(0.82);
            pointer-events: none;
        }

        .match-card.matched-slot {
            opacity: 0;
            pointer-events: none;
            cursor: default;
            transform: none;
            box-shadow: none;
            border-color: transparent;
            background: transparent;
        }

        .match-card.matched-slot:hover {
            transform: none;
            box-shadow: none;
        }

        .match-card-note img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            max-width: none;
            max-height: none;
        }

        .match-card-note .img-wrapper {
            padding: 0;
        }

        .match-card-name {
            font-size: 1.65rem;
            font-weight: 900;
            text-align: center;
            line-height: 1.15;
            word-break: keep-all;
        }

        #quiz-link-board {
            width: 100%;
            max-width: 100%;
            height: 100%;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .quiz-match-grid {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            grid-auto-rows: minmax(92px, 1fr);
            gap: 14px;
            width: min(100%, 1040px);
            align-content: start;
            margin: 0 auto;
        }

        @media (max-width: 920px) {
            .quiz-match-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 10px;
                grid-auto-rows: minmax(82px, 1fr);
            }

            .match-card {
                min-height: 82px;
                padding: 8px 10px;
            }

            .match-card-name {
                font-size: 1.1rem;
            }

            .match-card-note img {
                width: 30px;
                height: 30px;
            }
        }

        @media (max-width: 640px) {
            .quiz-match-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                grid-auto-rows: minmax(76px, 1fr);
                gap: 8px;
            }

            .match-card {
                min-height: 76px;
                border-width: 3px;
                border-radius: 18px;
                padding: 6px 8px;
            }

            .match-card-name {
                font-size: 0.95rem;
            }

            .match-card-note img {
                width: 26px;
                height: 26px;
            }
        }

        .feedback-anim {
            animation: feedbackPop 1s ease-out forwards;
        }

        /* 완벽한 이미지 중앙 정렬을 위한 래퍼 CSS */
        .img-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 0.5rem;
            pointer-events: none;
        }

        .img-wrapper img {
            max-width: 80%;
            max-height: 80%;
            width: auto;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(2px 4px 6px rgba(0, 0, 0, 0.15));
            pointer-events: none;
        }

        /* Caption Bubble */
        #caption-layer {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            pointer-events: none;
            width: min(920px, calc(100vw - 48px));
            display: flex;
            justify-content: center;
        }

        .caption-bubble {
            position: relative;
            max-width: 100%;
            background: rgba(17, 24, 39, 0.94);
            color: white;
            padding: 18px 28px;
            border-radius: 28px;
            font-size: 1.7rem;
            line-height: 1.45;
            font-weight: 700;
            text-align: left;
            box-shadow: 0 16px 35px rgba(0, 0, 0, 0.22);
            border: 3px solid rgba(255, 255, 255, 0.15);
            opacity: 0;
            transform: translateY(10px) scale(0.98);
            transition: opacity 0.2s ease, transform 0.2s ease;
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .caption-note-badge {
            flex: 0 0 auto;
        }

        .caption-note-circle {
            width: 84px;
            height: 84px;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            border: 4px solid rgba(255, 255, 255, 0.2);
            box-shadow: inset 0 4px 14px rgba(255, 255, 255, 0.35);
        }

        .caption-note-circle img {
            width: 58px;
            height: 58px;
            object-fit: contain;
            filter: drop-shadow(2px 4px 6px rgba(0, 0, 0, 0.2));
        }

        .caption-copy {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .caption-title-row {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 10px;
        }

        .caption-note-name {
            font-size: 1.9rem;
            font-weight: 900;
            line-height: 1.1;
        }

        .caption-note-desc {
            font-size: 1.28rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.84);
        }

        .caption-rhythm-line {
            font-size: 1.42rem;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.97);
        }

        .caption-rhythm-word {
            font-size: 1.58rem;
            font-weight: 900;
            letter-spacing: 0.03em;
            color: #FDE68A;
        }

        .caption-text-only {
            width: 100%;
            text-align: center;
        }

        .caption-bubble.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    </style>
</head>

<body>

    <nav id="gnb">
        <h1 class="text-2xl font-black text-gray-800 tracking-wide">
            음표를 공부해요! <span class="text-blue-500">카드 매칭 놀이</span>
        </h1>
        <div class="flex gap-3">
            <button id="btn-restart"
                class="hidden bg-indigo-500 text-white rounded-full px-5 py-2 font-bold shadow-md hover:bg-indigo-600 nav-btn border-b-4 border-indigo-700">다시하기</button>
            <button id="btn-exit"
                class="bg-gray-600 text-white rounded-full px-5 py-2 font-bold shadow-md hover:bg-gray-700 nav-btn border-b-4 border-gray-800">종료</button>
        </div>
    </nav>

    <div id="caption-layer">
        <div id="caption-bubble" class="caption-bubble hidden" aria-live="polite"></div>
    </div>

    <div id="game-container">
        <div id="scalable-wrapper">
            <canvas id="confetti" class="absolute inset-0 pointer-events-none z-[50000] w-full h-full"></canvas>

            <!-- 피드백 O/X 오버레이 -->
            <div id="feedback-overlay"
                class="absolute inset-0 pointer-events-none z-[80000] hidden flex items-center justify-center">
                <div id="feedback-icon"></div>
            </div>

            <!-- 드래그 고스트 -->
            <div id="drag-ghost"
                class="fixed pointer-events-none hidden z-[99999] opacity-95 transform -translate-x-1/2 -translate-y-1/2 drop-shadow-2xl flex items-center justify-center">
            </div>

            <!-- Intro Screen -->
            <div id="intro-screen" class="absolute inset-0 z-40 flex flex-col items-center justify-center px-6 py-6">
                <div
                    class="glass-panel w-[760px] max-w-full px-10 py-8 flex flex-col items-center text-center pop-in border-[8px] border-white">
                    <h1 class="text-7xl text-blue-600 mb-4 font-black leading-tight drop-shadow-sm">
                        음표를 공부해요!
                    </h1>
                    <p class="text-3xl text-gray-700 mb-6 font-bold bg-white/50 px-8 py-4 rounded-3xl leading-snug">
                        음표의 모양과 이름, 박자를 배우고<br>재미있는 퀴즈로 실력을 확인해보세요!
                    </p>
                    <div class="bg-white p-5 rounded-full mb-7 sway shadow-xl border-4 border-blue-200">
                        <i data-lucide="music" class="w-20 h-20 text-blue-500"></i>
                    </div>
                    <div class="flex gap-5 w-full px-6">
                        <button onclick="openStudy()"
                            class="flex-1 bg-green-500 text-white text-4xl px-8 py-5 rounded-[30px] btn-3d flex flex-col items-center justify-center gap-2 border-b-[8px] border-green-700">
                            <i data-lucide="book-open" class="w-11 h-11"></i> 카드 공부
                        </button>
                        <button onclick="openQuizConfig()"
                            class="flex-1 bg-blue-500 text-white text-4xl px-8 py-5 rounded-[30px] btn-3d flex flex-col items-center justify-center gap-2 border-b-[8px] border-blue-700">
                            <i data-lucide="gamepad-2" class="w-11 h-11"></i> 퀴즈 시작!
                        </button>
                    </div>
                </div>
            </div>

            <!-- Study Screen -->
            <div id="study-screen"
                class="hidden absolute inset-0 z-30 flex-col p-4 bg-white/40 backdrop-blur-md rounded-[40px] shadow-2xl border-4 border-white">
                <header
                    class="flex items-center justify-between mb-3 shrink-0 bg-white p-3 px-6 rounded-[25px] shadow-sm">
                    <h2 class="text-3xl font-black text-green-600 flex items-center gap-2">
                        <i data-lucide="book-open-check" class="w-8 h-8"></i> 음표 카드로 공부해요!
                    </h2>

                    <!-- Toggles -->
                    <div class="flex items-center gap-4">
                        <button onclick="toggleStudy('note')" id="toggle-note"
                            class="bg-indigo-100 text-indigo-700 text-xl font-bold px-4 py-2 rounded-xl shadow-sm border-2 border-indigo-300 nav-btn flex items-center gap-2">
                            <i data-lucide="eye" class="w-5 h-5"></i> 음표 모양
                        </button>
                        <button onclick="toggleStudy('name')" id="toggle-name"
                            class="bg-orange-100 text-orange-700 text-xl font-bold px-4 py-2 rounded-xl shadow-sm border-2 border-orange-300 nav-btn flex items-center gap-2">
                            <i data-lucide="eye" class="w-5 h-5"></i> 음표 이름
                        </button>
                        <button onclick="toggleStudy('beat')" id="toggle-beat"
                            class="bg-pink-100 text-pink-700 text-xl font-bold px-4 py-2 rounded-xl shadow-sm border-2 border-pink-300 nav-btn flex items-center gap-2">
                            <i data-lucide="eye" class="w-5 h-5"></i> 박자
                        </button>
                    </div>

                    <button onclick="openQuizConfig()"
                        class="bg-blue-500 text-white text-xl font-bold px-6 py-2 rounded-full btn-3d shadow-md border-b-4 border-blue-700 flex items-center gap-2">
                        공부 끝! 퀴즈 풀기 <i data-lucide="arrow-right" class="w-5 h-5"></i>
                    </button>
                </header>

                <div id="study-cards" class="grid grid-cols-4 grid-rows-2 gap-4 w-full flex-1 min-h-0 pb-1">
                    <!-- Cards injected by JS -->
                </div>
            </div>

            <!-- Quiz Config Screen -->
            <div id="quiz-config-screen" class="hidden absolute inset-0 z-40 flex flex-col items-center justify-center">
                <div
                    class="glass-panel p-10 flex flex-col items-center text-center w-[600px] pop-in border-[8px] border-blue-300">
                    <div class="bg-yellow-400 p-4 rounded-full mb-6 float border-4 border-yellow-200">
                        <i data-lucide="list-checks" class="w-20 h-20 text-white"></i>
                    </div>
                    <h2 class="text-5xl font-black text-gray-800 mb-8">몇 문제를 풀어볼까요?</h2>
                    <div class="flex flex-col gap-4 w-full px-8">
                        <button onclick="startQuiz(10)"
                            class="w-full bg-blue-500 text-white text-4xl px-6 py-5 rounded-[20px] btn-3d font-bold border-b-[6px] border-blue-700">10
                            문제 도전!</button>
                        <button onclick="startQuiz(20)"
                            class="w-full bg-indigo-500 text-white text-4xl px-6 py-5 rounded-[20px] btn-3d font-bold border-b-[6px] border-indigo-700">20
                            문제 도전!</button>
                        <button onclick="startQuiz(30)"
                            class="w-full bg-purple-500 text-white text-4xl px-6 py-5 rounded-[20px] btn-3d font-bold border-b-[6px] border-purple-700">30
                            문제 도전!</button>
                    </div>
                    <button onclick="openStudy()"
                        class="mt-8 text-2xl text-gray-500 hover:text-gray-700 underline font-bold">뒤로가기</button>
                </div>
            </div>

            <!-- Quiz Play Screen (해상도 및 태블릿 완벽 최적화) -->
            <div id="quiz-screen"
                class="hidden absolute inset-0 z-30 flex-col p-5 bg-white/40 backdrop-blur-md rounded-[40px] shadow-2xl border-4 border-white">
                <header
                    class="flex items-center justify-between w-full mb-4 bg-white p-3 px-5 rounded-3xl shadow-sm shrink-0">
                    <div
                        class="flex items-center gap-3 bg-yellow-100 px-5 py-2 rounded-full border-2 border-yellow-300">
                        <i data-lucide="target" class="w-7 h-7 text-yellow-600"></i>
                        <h2 class="text-2xl font-extrabold text-yellow-800">문제 <span id="q-current"
                                class="text-3xl text-red-500">1</span> / <span id="q-total">10</span></h2>
                    </div>

                    <div class="flex items-center gap-4">
                        <div
                            class="flex items-center gap-2 bg-green-100 px-5 py-2 rounded-full border-2 border-green-300">
                            <i data-lucide="check-circle" class="w-7 h-7 text-green-600"></i>
                            <span class="text-2xl font-extrabold text-green-800"><span
                                    id="score-display">0</span>점</span>
                        </div>
                        <div
                            class="flex items-center gap-2 bg-blue-100 px-5 py-2 rounded-full border-2 border-blue-300">
                            <i data-lucide="timer" class="w-7 h-7 text-blue-600 sway"></i>
                            <span id="timer-display"
                                class="text-2xl font-extrabold text-blue-800 w-20 text-center tracking-wider">00:00</span>
                        </div>
                    </div>
                </header>

                <!-- 요소들이 벗어나지 않도록 min-h-0 과 flex-grow 를 조합 -->
                <div class="flex-grow flex flex-col items-center justify-center w-full min-h-0 pb-2">

                    <!-- Question / Target Area -->
                    <div id="quiz-question-card"
                        class="relative w-full max-w-[900px] bg-white rounded-[30px] p-6 shadow-lg border-[6px] border-indigo-200 flex flex-col items-center gap-4 shrink-0">
                        <button id="quiz-speaker-btn" onclick="readCurrentQuizQuestion()"
                            class="absolute top-5 right-5 w-16 h-16 rounded-full bg-yellow-400 text-white shadow-lg border-b-4 border-yellow-600 flex items-center justify-center btn-3d z-10"
                            aria-label="문제 읽기">
                            <i data-lucide="volume-2" class="w-8 h-8"></i>
                        </button>
                        <div id="quiz-prompt-row" class="flex items-center justify-center w-full">
                            <h3 id="quiz-prompt"
                                class="text-3xl md:text-4xl font-black text-indigo-700 bg-indigo-50 px-8 py-3 rounded-full border-2 border-indigo-100 text-center">
                                다음 중 알맞은 것을 끌어다 넣으세요!</h3>
                        </div>

                        <div id="quiz-standard-area" class="flex items-center justify-center gap-8 w-full mt-2">
                            <!-- 문제 제시 -->
                            <div id="quiz-source"
                                class="w-[150px] h-[150px] bg-gray-50 rounded-[24px] shadow-inner border-4 border-gray-200 flex flex-col items-center justify-center p-3">
                                <!-- JS Injected -->
                            </div>

                            <i data-lucide="arrow-right" class="w-12 h-12 text-indigo-300 shrink-0"></i>

                            <!-- 정답 드롭 존 -->
                            <div id="quiz-target-zone"
                                class="drop-zone w-[150px] h-[150px] bg-gray-100 rounded-[24px] flex items-center justify-center text-center p-3">
                                <span class="text-2xl font-bold text-gray-400 pointer-events-none">이곳에<br>드래그!</span>
                            </div>
                        </div>

        const GOOGLE_API_KEY = "AIzaSyAE0nnpOYZRfLkfM09O3NQjpWnN1kUqR3E";

        let currentSpeechToken = 0;
        let browserSpeechTimers = [];

        let quizSpeechText = '다음 문제를 읽어드릴게요.';

        // 실제 서버에 올라간 SVG 이미지 URL 지정

            { id: 'n4', name: '점4분음표', beat: '1반박', beats: 1.5, rhythmUnits: 2, spokenBeat: '한박 반', rhythm: '따은', accent: '#22c55e', color: 'text-green-500', bg: 'bg-green-50', border: 'border-green-400', img: BASE_URL + 'Dotted-Quarter-Note.svg' },
            { id: 'n5', name: '4분음표', beat: '1박', beats: 1, rhythmUnits: 1, spokenBeat: '한박', rhythm: '딴', accent: '#3b82f6', color: 'text-blue-500', bg: 'bg-blue-50', border: 'border-blue-400', img: BASE_URL + 'Quarter-note.svg' },
            { id: 'n6', name: '점8분음표', beat: '반박반', beats: 0.75, rhythmUnits: 1, spokenBeat: '반박 반', rhythm: '땃', accent: '#6366f1', color: 'text-indigo-500', bg: 'bg-indigo-50', border: 'border-indigo-400', img: BASE_URL + 'Dotted-Eighth-Note.svg' },
            { id: 'n7', name: '8분음표', beat: '반박', beats: 0.5, rhythmUnits: 1, spokenBeat: '반박', rhythm: '따', accent: '#a855f7', color: 'text-purple-500', bg: 'bg-purple-50', border: 'border-purple-400', img: BASE_URL + '8th-note.svg' },
            { id: 'n8', name: '16분음표', beat: '반의반박', beats: 0.25, rhythmUnits: 1, spokenBeat: '반의 반박', rhythm: '띠', accent: '#ec4899', color: 'text-pink-500', bg: 'bg-pink-50', border: 'border-pink-400', img: BASE_URL + '16th-note.svg' },
        ];

        let studyState = { note: true, name: true, beat: true };
        let game = {
            currentQ: 1,
            totalQ: 10,
            score: 0,
            seconds: 0,
            timer: null,
            isPlaying: false,
            currentTarget: null,
            currentMode: 'standard',
            previousQuestionKey: null,
            matchState: null,
            questionHadMistake: false
        };

        // DOM Ready
        window.onload = () => {
            lucide.createIcons();
            speak('음표를 공부해요! 음표의 모양과 이름, 박자를 배우고 재미있는 퀴즈로 실력을 확인해보세요!');
        };

        // --- Audio & TTS ---
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function clearBrowserSpeechTimers() {
            browserSpeechTimers.forEach(({ timerId, resolve }) => {
                clearTimeout(timerId);
                resolve();
            });
            browserSpeechTimers = [];
        }

        function stopSpeech() {
            currentSpeechToken += 1;
            clearBrowserSpeechTimers();
            hideCaptionBubble();

            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
            }

            if (ttsAudio) {
                ttsAudio.pause();
                ttsAudio.src = '';
                ttsAudio = null;
            }

            if (ttsAudioUrl) {
                URL.revokeObjectURL(ttsAudioUrl);
                ttsAudioUrl = null;
            }

            return currentSpeechToken;
        }

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function hideCaptionBubble() {
            if (captionTimer) {
                clearTimeout(captionTimer);
                captionTimer = null;
            }

            captionDismissOnPointer = false;

            const bubble = document.getElementById('caption-bubble');
            bubble.classList.remove('show');
            bubble.classList.add('hidden');
            bubble.innerHTML = '';
        }

        function buildCaptionMarkup(content) {
            if (content && content.note) {
                return `
                    <div class="caption-note-badge">
                        <div class="caption-note-circle" style="border-color: ${content.note.accent};">
                            <img src="${content.note.img}" alt="${escapeHtml(content.note.name)}">
                        </div>
                    </div>
                    <div class="caption-copy">
                        <div class="caption-title-row">
                            <span class="caption-note-name" style="color: ${content.note.accent};">${escapeHtml(content.note.name)}</span>
                            <span class="caption-note-desc">는 ${escapeHtml(content.beatText)}이며</span>
                        </div>
                        <div class="caption-rhythm-line">
                            <span class="caption-rhythm-word">${escapeHtml(content.rhythmText)}</span>이라고 읽어요.
                        </div>
                    </div>
                `;
            }

            return `<div class="caption-text-only">${escapeHtml(content?.text || '')}</div>`;
        }

        function showCaptionBubble(content, options = {}) {
            if (!content) return;

            const bubble = document.getElementById('caption-bubble');
            captionDismissOnPointer = options.dismissOnPointer === true;
            bubble.innerHTML = buildCaptionMarkup(content);
            bubble.classList.remove('hidden');

            requestAnimationFrame(() => {
                bubble.classList.add('show');
            });
        }

        function scheduleCaptionHide(token, delayMs = 220) {
            if (token !== currentSpeechToken) return;

            if (captionTimer) {
                clearTimeout(captionTimer);
                captionTimer = null;
            }

            const bubble = document.getElementById('caption-bubble');
            captionTimer = setTimeout(() => {
                if (token !== currentSpeechToken) return;
                bubble.classList.remove('show');
                captionTimer = setTimeout(() => {
                    if (token !== currentSpeechToken) return;
                    bubble.classList.add('hidden');
                    bubble.innerHTML = '';
                    captionTimer = null;
                }, 220);
            }, delayMs);
        }

        function escapeSsml(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&apos;');
        }

        function delay(ms) {
            return new Promise(resolve => {
                const entry = {
                    timerId: null,
                    resolve: () => resolve()
                };

                entry.timerId = setTimeout(() => {
                    browserSpeechTimers = browserSpeechTimers.filter(item => item !== entry);
                    resolve();
                }, ms);

                browserSpeechTimers.push(entry);
            });
        }

        function getRhythmRate(note, engine = 'google') {
            const baseRate = engine === 'google' ? 0.9 : 0.94;
            const maxRate = engine === 'google' ? 3.2 : 3.4;
            const computedRate = baseRate * (note.rhythmUnits / note.beats);
            return Math.min(maxRate, Math.max(0.85, Number(computedRate.toFixed(2))));
        }

        function speakWithBrowserSegments(segments, token) {
            return new Promise(resolve => {
                if (!window.speechSynthesis || token !== currentSpeechToken) {
                    resolve(false);
                    return;
                }

                const playNext = async (index) => {
                    if (token !== currentSpeechToken || index >= segments.length) {
                        resolve(true);
                        return;
                    }

                    const segment = segments[index];
                    if (!segment.text) {
                        await delay(segment.pauseAfter || 0);
                        playNext(index + 1);
                        return;
                    }

                    const utterance = new SpeechSynthesisUtterance(segment.text);
                    utterance.lang = 'ko-KR';
                    utterance.rate = segment.rate || 1;
                    utterance.pitch = 1;

                    utterance.onend = async () => {
                        if (segment.pauseAfter) {
                            await delay(segment.pauseAfter);
                        }
                        playNext(index + 1);
                    };
                    utterance.onerror = () => playNext(index + 1);

                    window.speechSynthesis.speak(utterance);
                };

                playNext(0);
            });
        }

        function waitForAudioPlayback(audio, token) {
            return new Promise(resolve => {
                if (!audio) {
                    resolve();
                    return;
                }

                let settled = false;
                let pauseHandler = null;

                const finish = () => {
                    if (settled) return;
                    settled = true;
                    audio.removeEventListener('ended', finish);
                    audio.removeEventListener('error', finish);
                    if (pauseHandler) {
                        audio.removeEventListener('pause', pauseHandler);
                    }
                    resolve();
                };

                pauseHandler = () => {
                    if (token !== currentSpeechToken) finish();
                };

                audio.addEventListener('ended', finish, { once: true });
                audio.addEventListener('error', finish, { once: true });
                audio.addEventListener('pause', pauseHandler, { once: true });
            });
        }

        async function speak(text, options = {}) {
            if (!text) return;

            const token = stopSpeech();
            if (options.showCaption === true) {
                const captionContent = options.captionData || { text: options.captionText || text };
                showCaptionBubble(captionContent, {
                    dismissOnPointer: options.captionDismissOnPointer === true
                });
            }
            const payload = {
                voice: { languageCode: 'ko-KR', name: 'ko-KR-Standard-A' },
                audioConfig: { audioEncoding: 'MP3', speakingRate: options.googleSpeakingRate || 1 }
            };

            if (options.ssml) {
                payload.input = { ssml: options.ssml };
            } else {
                payload.input = { text: text };
            }

            try {
                const response = await fetch(`https://texttospeech.googleapis.com/v1/text:synthesize?key=${GOOGLE_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`Google TTS failed: ${response.status}`);
                }

                const data = await response.json();
                if (!data.audioContent || token !== currentSpeechToken) {
                    throw new Error('Google TTS returned no audio.');
                }

                const audioBlob = await fetch(`data:audio/mp3;base64,${data.audioContent}`).then(res => res.blob());
                if (token !== currentSpeechToken) return;

                ttsAudioUrl = URL.createObjectURL(audioBlob);
                ttsAudio = new Audio(ttsAudioUrl);
                await ttsAudio.play();
                await waitForAudioPlayback(ttsAudio, token);
                if (options.showCaption === true) {
                    scheduleCaptionHide(token, options.captionHoldMs ?? 220);
                }
                return;
            } catch (e) {
                const browserSegments = options.browserSegments || [{ text, rate: options.browserRate || 1 }];
                await speakWithBrowserSegments(browserSegments, token);
                if (options.showCaption === true) {
                    scheduleCaptionHide(token, options.captionHoldMs ?? 220);
                }
            }
        }

        function speakStudyNote(note) {
            const introText = `${note.name}는 ${note.spokenBeat}이며`;
            const outroText = '이라고 읽어요.';
            const fullText = `${introText} ${note.rhythm}${outroText}`;
            const googleRhythmRate = `${Math.round(getRhythmRate(note, 'google') * 100)}%`;
            const browserRhythmRate = getRhythmRate(note, 'browser');
            const ssml = `<speak>${escapeSsml(introText)}<break time="180ms"/><prosody rate="${googleRhythmRate}">${escapeSsml(note.rhythm)}</prosody><break time="120ms"/>${escapeSsml(outroText)}</speak>`;

            speak(fullText, {
                ssml,
                showCaption: true,
                captionData: {
                    note,
                    beatText: note.spokenBeat,
                    rhythmText: note.rhythm
                },
                browserSegments: [
                    { text: introText, rate: 1, pauseAfter: 160 },
                    { text: note.rhythm, rate: browserRhythmRate, pauseAfter: 120 },
                    { text: outroText, rate: 1 }
                ]
            });
        }

        function readCurrentQuizQuestion() {
            speak(quizSpeechText);
        }

        function playSound(type) {
            initAudio(); const t = audioCtx.currentTime; const osc = audioCtx.createOscillator(); const gainNode = audioCtx.createGain();
            osc.connect(gainNode); gainNode.connect(audioCtx.destination);
            if (type === 'success') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, t); osc.frequency.setValueAtTime(659.25, t + 0.1); osc.frequency.setValueAtTime(783.99, t + 0.2);
                gainNode.gain.setValueAtTime(0, t); gainNode.gain.linearRampToValueAtTime(0.3, t + 0.05); gainNode.gain.exponentialRampToValueAtTime(0.01, t + 0.4);
                osc.start(t); osc.stop(t + 0.5);
            } else if (type === 'error') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(300, t); osc.frequency.linearRampToValueAtTime(200, t + 0.3);
                gainNode.gain.setValueAtTime(0, t); gainNode.gain.linearRampToValueAtTime(0.3, t + 0.05); gainNode.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
                osc.start(t); osc.stop(t + 0.4);
            } else if (type === 'bonus') {
                osc.type = 'square'; osc.frequency.setValueAtTime(440, t); osc.frequency.setValueAtTime(554.37, t + 0.1); osc.frequency.setValueAtTime(659.25, t + 0.2); osc.frequency.setValueAtTime(880, t + 0.3);
                gainNode.gain.setValueAtTime(0, t); gainNode.gain.linearRampToValueAtTime(0.2, t + 0.05); gainNode.gain.exponentialRampToValueAtTime(0.01, t + 0.6);
                osc.start(t); osc.stop(t + 0.7);
            }
        }

        // --- Screen Navigation ---
        function hideAllScreens() {
            document.querySelectorAll('#game-container > div > div[id$="-screen"]').forEach(el => el.classList.add('hidden'));

        // --- Study Mode Logic ---
        function toggleStudy(type) {
            studyState[type] = !studyState[type];

        function updateStudyToggles() {
            const btnNote = document.getElementById('toggle-note');
            const btnName = document.getElementById('toggle-name');

            const setStyle = (btn, isVis, baseColor) => {

                } else {
                    btn.className = `bg-gray-200 text-gray-500 text-xl font-bold px-4 py-2 rounded-xl shadow-inner border-2 border-gray-300 nav-btn flex items-center gap-2`;
                    btn.innerHTML = `<i data-lucide="eye-off" class="w-5 h-5"></i> ${btn.innerText}`;
                }
            };

            setStyle(btnNote, studyState.note, 'indigo');
            setStyle(btnName, studyState.name, 'orange');
            setStyle(btnBeat, studyState.beat, 'pink');
            lucide.createIcons();
        }

        function renderStudyCards() {
            const container = document.getElementById('study-cards');
            container.innerHTML = '';

            NOTES.forEach(note => {
                const card = document.createElement('div');
                card.className = 'study-card flex flex-col items-center justify-between p-3 cursor-pointer relative bg-white';

                const noteClass = studyState.note ? '' : 'hidden-content';
                const nameClass = studyState.name ? '' : 'hidden-content';
                const beatClass = studyState.beat ? '' : 'hidden-content';

                card.innerHTML = `
                    <div class="w-full flex-1 min-h-0 flex items-center justify-center p-2 rounded-2xl bg-white border-2 border-gray-100 shadow-inner toggle-area-note transition-all ${noteClass}">
                        <div class="img-wrapper pointer-events-none">
                            <img src="${note.img}" alt="${note.name}" draggable="false">
                        </div>
                    </div>
                    <div class="w-full shrink-0 flex flex-col items-center gap-1.5 mt-2">
                        <div class="toggle-area-name w-full text-center py-1.5 rounded-xl bg-gray-50 transition-all ${nameClass}">
                            <h3 class="text-[1.5rem] font-black text-gray-800">${note.name}</h3>
                        </div>
                        <div class="toggle-area-beat w-full flex justify-center py-1.5 rounded-xl bg-gray-50 transition-all ${beatClass}">
                            <p class="text-xl font-bold text-gray-700 bg-gray-100 border-2 border-gray-200 px-4 py-1 rounded-full shadow-sm">${note.beat}</p>
                        </div>
                    </div>
                `;

                // 클릭하면 가려진 정보 보여주고 소리 재생
                card.onclick = () => {
                    initAudio();
                    const noteEl = card.querySelector('.toggle-area-note');
                    const nameEl = card.querySelector('.toggle-area-name');
                    const beatEl = card.querySelector('.toggle-area-beat');

                    if (!studyState.note) { noteEl.classList.add('peek'); setTimeout(() => noteEl.classList.remove('peek'), 2000); }
                    if (!studyState.name) { nameEl.classList.add('peek'); setTimeout(() => nameEl.classList.remove('peek'), 2000); }
                    if (!studyState.beat) { beatEl.classList.add('peek'); setTimeout(() => beatEl.classList.remove('peek'), 2000); }

                    speakStudyNote(note);
                };

                container.appendChild(card);
            });
        }

        // --- Quiz Mode Logic ---
        function startQuiz(count) {
            hideAllScreens();
            document.getElementById('quiz-screen').classList.remove('hidden');
            document.getElementById('quiz-screen').classList.add('flex');

            game = {
                currentQ: 1,
                totalQ: count,
                score: 0,
                seconds: 0,
                timer: null,
                isPlaying: true,
                currentTarget: null,
                currentMode: 'standard',
                previousQuestionKey: null,
                matchState: null,
                questionHadMistake: false
            };
            updateQuizUI();
            startTimer();
            nextQuestion();
        }

        function startTimer() {
            clearInterval(game.timer);
            game.timer = setInterval(() => {
                if (game.isPlaying) {
                    game.seconds++;
                    const m = Math.floor(game.seconds / 60).toString().padStart(2, '0');
                    const s = (game.seconds % 60).toString().padStart(2, '0');
                    document.getElementById('timer-display').innerText = `${m}:${s}`;
                }
            }, 1000);
        }

        function updateQuizUI() {
            document.getElementById('q-current').innerText = game.currentQ;
            document.getElementById('q-total').innerText = game.totalQ;
            document.getElementById('score-display').innerText = game.score;
        }

        function shuffleArray(items) {
            const copy = [...items];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function buildOptionContent(opt, qType) {
            if (qType === 'note2name') {
                return `<h3 class="text-3xl font-black text-gray-800 pointer-events-none text-center">${opt.name}</h3>`;
            }
            if (qType === 'note2beat') {
                return `<p class="text-3xl font-bold text-gray-700 pointer-events-none text-center">${opt.beat}</p>`;
            }
            return `<div class="img-wrapper pointer-events-none"><img src="${opt.img}" alt="note" draggable="false"></div>`;
        }

        function buildStandardQuestionDefinition() {
            const types = ['note2name', 'note2beat', 'name2note', 'beat2note'];
            let targetNote = NOTES[0];
            let qType = types[0];
            let key = '';

            for (let attempt = 0; attempt < 30; attempt++) {
                targetNote = NOTES[Math.floor(Math.random() * NOTES.length)];
                qType = types[Math.floor(Math.random() * types.length)];
                key = `${qType}:${targetNote.id}`;
                if (key !== game.previousQuestionKey || attempt === 29) break;
            }

            let promptText = "";
            let promptSpeechText = "";
            let sourceHTML = '';

            if (qType === 'note2name') {
                promptText = "이 음표의 이름은 무엇일까요?";
                promptSpeechText = `${promptText} 알맞은 답을 드래그해서 넣어 보세요.`;
                sourceHTML = `<div class="img-wrapper pointer-events-none"><img src="${targetNote.img}" alt="note" draggable="false"></div>`;
            } else if (qType === 'note2beat') {
                promptText = "이 음표의 박자는 무엇일까요?";
                promptSpeechText = `${promptText} 알맞은 답을 드래그해서 넣어 보세요.`;
                sourceHTML = `<div class="img-wrapper pointer-events-none"><img src="${targetNote.img}" alt="note" draggable="false"></div>`;
            } else if (qType === 'name2note') {
                promptText = `'${targetNote.name}'은(는) 어떻게 생겼을까요?`;
                promptSpeechText = `${targetNote.name}은 어떻게 생겼을까요? 알맞은 답을 드래그해서 넣어 보세요.`;
                sourceHTML = `<h3 class="text-3xl font-black text-gray-800 text-center">${targetNote.name}</h3>`;
            } else if (qType === 'beat2note') {
                promptText = `${targetNote.beat} 길이를 가진 음표는?`;
                promptSpeechText = `${targetNote.spokenBeat} 길이를 가진 음표는 무엇일까요? 알맞은 답을 드래그해서 넣어 보세요.`;
                sourceHTML = `<p class="text-3xl font-bold text-gray-700 text-center">${targetNote.beat}</p>`;
            }

            let options = [targetNote];
            while (options.length < 4) {
                const rand = NOTES[Math.floor(Math.random() * NOTES.length)];
                if (!options.includes(rand)) options.push(rand);
            }

            return {
                key,
                qType,
                targetNote,
                promptText,
                promptSpeechText,
                sourceHTML,
                options: shuffleArray(options)
            };
        }

        function showStandardQuizLayout() {
            const questionCard = document.getElementById('quiz-question-card');
            const promptRow = document.getElementById('quiz-prompt-row');
            const speakerBtn = document.getElementById('quiz-speaker-btn');
            const linkArea = document.getElementById('quiz-link-area');
            const linkBoard = document.getElementById('quiz-link-board');

            questionCard.style.maxWidth = '900px';
            questionCard.style.flex = '';
            questionCard.style.alignSelf = 'center';
            questionCard.style.minHeight = '';
            promptRow.classList.remove('hidden');
            speakerBtn.classList.remove('hidden');
            document.getElementById('quiz-standard-area').classList.remove('hidden');
            linkArea.classList.add('hidden');
            linkArea.style.display = '';
            linkArea.style.flex = '';
            linkArea.style.width = '';
            linkArea.style.height = '';
            linkArea.style.minHeight = '';
            linkBoard.style.maxWidth = '';
            linkBoard.style.height = '';
            document.getElementById('quiz-options').classList.remove('hidden');
            document.getElementById('quiz-match-grid').innerHTML = '';
        }

        function showLinkQuizLayout() {
            const questionCard = document.getElementById('quiz-question-card');
            const promptRow = document.getElementById('quiz-prompt-row');
            const speakerBtn = document.getElementById('quiz-speaker-btn');
            const linkArea = document.getElementById('quiz-link-area');
            const linkBoard = document.getElementById('quiz-link-board');

            questionCard.style.maxWidth = '1160px';
            questionCard.style.flex = '1 1 auto';
            questionCard.style.alignSelf = 'stretch';
            questionCard.style.minHeight = '0';
            promptRow.classList.add('hidden');
            speakerBtn.classList.add('hidden');
            document.getElementById('quiz-standard-area').classList.add('hidden');
            linkArea.classList.remove('hidden');
            linkArea.style.display = 'block';
            linkArea.style.flex = '1 1 auto';
            linkArea.style.width = '100%';
            linkArea.style.height = '100%';
            linkArea.style.minHeight = '0';
            linkBoard.style.maxWidth = '100%';
            linkBoard.style.height = '100%';
            document.getElementById('quiz-options').classList.add('hidden');
            document.getElementById('quiz-options').innerHTML = '';
        }

        function renderMatchCards() {
            const grid = document.getElementById('quiz-match-grid');
            if (!game.matchState) {
                grid.innerHTML = '';
                return;
            }

            grid.innerHTML = game.matchState.cards.map(card => {
                if (game.matchState.matchedCardIds.has(card.cardId)) {
                    return `<div class="match-card matched-slot" aria-hidden="true"></div>`;
                }

                const selectedClass = game.matchState.selectedCardId === card.cardId ? ' selected' : '';
                const wrongClass = game.matchState.wrongCardIds.has(card.cardId) ? ' wrong' : '';
                const removingClass = game.matchState.removingCardIds.has(card.cardId) ? ' removing' : '';

                if (card.type === 'note') {
                    return `
                        <button type="button" class="match-card match-card-note${selectedClass}${wrongClass}${removingClass}"
                            data-card-id="${card.cardId}" aria-label="${card.note.name}">
                            <div class="img-wrapper pointer-events-none">
                                <img src="${card.note.img}" alt="${card.note.name}" draggable="false">
                            </div>
                        </button>
                    `;
                }

                return `
                    <button type="button" class="match-card match-card-name${selectedClass}${wrongClass}${removingClass}"
                        data-card-id="${card.cardId}" style="color:${card.note.accent};" aria-label="${card.note.name}">
                        ${card.note.name}
                    </button>
                `;
            }).join('');

            grid.querySelectorAll('.match-card').forEach(card => {
                card.addEventListener('click', () => handleMatchCardSelection(card.dataset.cardId));
            });
        }

        function completeCurrentQuestion(delayMs = 1200) {
            stopSpeech();
            game.score += game.questionHadMistake ? 0 : 10;
            updateQuizUI();
            game.isPlaying = false;

            setTimeout(() => {
                if (game.currentQ < game.totalQ) {
                    game.currentQ++;
                    game.isPlaying = true;
                    nextQuestion();
                } else {
                    endQuiz();
                }
            }, delayMs);
        }

        function handleMatchCardSelection(cardId) {
            if (!game.isPlaying || game.currentMode !== 'link' || !game.matchState || game.matchState.locked) return;

            const currentCard = game.matchState.cards.find(card => card.cardId === cardId);
            if (!currentCard || game.matchState.matchedCardIds.has(cardId) || game.matchState.removingCardIds.has(cardId)) return;

            if (!game.matchState.selectedCardId) {
                game.matchState.selectedCardId = cardId;
                game.matchState.wrongCardIds.clear();
                renderMatchCards();
                return;
            }

            if (game.matchState.selectedCardId === cardId) {
                game.matchState.selectedCardId = null;
                game.matchState.wrongCardIds.clear();
                renderMatchCards();
                return;
            }

            const firstCard = game.matchState.cards.find(card => card.cardId === game.matchState.selectedCardId);
            if (!firstCard) {
                game.matchState.selectedCardId = cardId;
                renderMatchCards();
                return;
            }

            if (firstCard.type === currentCard.type) {
                game.matchState.selectedCardId = cardId;
                game.matchState.wrongCardIds.clear();
                renderMatchCards();
                return;
            }

            if (firstCard.matchId === currentCard.matchId) {
                const matchedIds = [firstCard.cardId, currentCard.cardId];
                game.matchState.locked = true;
                game.matchState.selectedCardId = null;
                game.matchState.wrongCardIds.clear();
                matchedIds.forEach(id => game.matchState.removingCardIds.add(id));
                renderMatchCards();
                playSound('success');

                setTimeout(() => {
                    if (!game.matchState || game.currentMode !== 'link') return;

                    matchedIds.forEach(id => {
                        game.matchState.removingCardIds.delete(id);
                        game.matchState.matchedCardIds.add(id);
                    });
                    game.matchState.locked = false;
                    renderMatchCards();

                    if (game.matchState.matchedCardIds.size === game.matchState.cards.length) {
                        showFeedback(game.questionHadMistake ? 'retry-correct' : 'correct');
                        completeCurrentQuestion(800);
                    }
                }, 260);
                return;
            }

            game.matchState.locked = true;
            game.questionHadMistake = true;
            game.matchState.wrongCardIds = new Set([firstCard.cardId, currentCard.cardId]);
            game.matchState.selectedCardId = null;
            renderMatchCards();
            playSound('error');
            showFeedback('wrong');

            setTimeout(() => {
                if (!game.matchState || game.currentMode !== 'link') return;
                game.matchState.wrongCardIds.clear();
                game.matchState.locked = false;
                renderMatchCards();
            }, 420);
        }

        function renderLinkQuestion() {
            game.currentMode = 'link';
            game.currentTarget = null;
            const selectedNotes = shuffleArray(NOTES).slice(0, 6);
            const noteCards = selectedNotes.map(note => ({
                cardId: `note-${note.id}`,
                matchId: note.id,
                type: 'note',
                note
            }));
            const nameCards = selectedNotes.map(note => ({
                cardId: `name-${note.id}`,
                matchId: note.id,
                type: 'name',
                note
            }));

            game.matchState = {
                cards: shuffleArray([...noteCards, ...nameCards]),
                matchedCardIds: new Set(),
                removingCardIds: new Set(),
                wrongCardIds: new Set(),
                selectedCardId: null,
                locked: false
            };

            showLinkQuizLayout();

            document.getElementById('quiz-prompt').innerText = '같은 짝의 카드를 찾아 눌러 보세요!';
            quizSpeechText = '같은 걸 골라보세요.';
            renderMatchCards();
            speak('같은 걸 골라보세요.', {
                showCaption: true,
                captionText: '같은 걸 골라보세요.',
                captionHoldMs: 2000,
                captionDismissOnPointer: true
            });
        }

        function nextQuestion() {
            updateQuizUI();
            game.questionHadMistake = false;
            const sourceBox = document.getElementById('quiz-source');
            const targetZone = document.getElementById('quiz-target-zone');
            const optionsBox = document.getElementById('quiz-options');

            if (game.currentQ === game.totalQ) {
                renderLinkQuestion();
                return;
            }

            showStandardQuizLayout();

            // 크기 감소에 맞춘 타겟 존 스타일 변경
            targetZone.className = 'drop-zone w-[150px] h-[150px] bg-gray-100 rounded-[24px] flex items-center justify-center text-center p-3 border-4 border-dashed border-gray-300';
            targetZone.innerHTML = '<span class="text-2xl font-bold text-gray-400 pointer-events-none">이곳에<br>드래그!</span>';
            const question = buildStandardQuestionDefinition();
            game.currentMode = 'standard';
            game.matchState = null;
            game.currentTarget = question.targetNote;
            game.previousQuestionKey = question.key;
            targetZone.setAttribute('data-id', question.targetNote.id);
            sourceBox.innerHTML = question.sourceHTML;
            document.getElementById('quiz-prompt').innerText = question.promptText;
            quizSpeechText = question.promptSpeechText || question.promptText;

            optionsBox.innerHTML = '';
            question.options.forEach((opt) => {
                const div = document.createElement('div');
                // 옵션 아이템의 크기를 줄이고(170px), 테두리를 얇게(border-[5px]) 조절
                div.className = `drag-item w-[170px] h-[170px] bg-white rounded-[24px] border-[5px] ${opt.border} shadow-lg flex items-center justify-center p-3 hover:-translate-y-2 transition-transform`;
                div.setAttribute('data-id', opt.id);
                div.innerHTML = buildOptionContent(opt, question.qType);
                div.onpointerdown = (e) => startDrag(e, opt);
                optionsBox.appendChild(div);
            });
        }

        // --- Drag and Drop Logic ---
        let isDragging = false;
        let dragSrcEl = null;
        let draggingData = null;
        let currentHoverZone = null;
        const ghostEl = document.getElementById('drag-ghost');

        function showFeedback(type) {
            const overlay = document.getElementById('feedback-overlay');
            const iconContainer = document.getElementById('feedback-icon');
            const mode = type === true ? 'correct' : type === false ? 'wrong' : type;
            overlay.classList.remove('hidden');

            if (mode === 'retry-correct') {
                // 한 번 틀린 뒤 정답을 맞혔을 때는 세모 표시
                iconContainer.innerHTML = `<svg viewBox="0 0 24 24" class="w-64 h-64 md:w-80 md:h-80 text-amber-500 drop-shadow-[0_10px_30px_rgba(245,158,11,0.55)]" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4L20 19H4L12 4Z"></path></svg>`;
            } else if (mode === 'correct') {
                // 커다란 초록색 O
                iconContainer.innerHTML = `<svg viewBox="0 0 24 24" class="w-64 h-64 md:w-80 md:h-80 text-green-500 drop-shadow-[0_10px_30px_rgba(34,197,94,0.6)]" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle></svg>`;
            } else {
                // 커다란 빨간색 X
                iconContainer.innerHTML = `<svg viewBox="0 0 24 24" class="w-64 h-64 md:w-80 md:h-80 text-red-500 drop-shadow-[0_10px_30px_rgba(239,68,68,0.6)]" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>`;
            }

            iconContainer.classList.remove('feedback-anim');
            void iconContainer.offsetWidth; // 애니메이션 리셋
            iconContainer.classList.add('feedback-anim');

            setTimeout(() => { overlay.classList.add('hidden'); }, 1000);
        }

        function startDrag(e, noteData) {
            if (!game.isPlaying) return;
            initAudio();
            isDragging = true;
            dragSrcEl = e.currentTarget;
            draggingData = noteData;

            dragSrcEl.classList.add('dragging');

            // 고스트 요소의 크기도 선택지 크기에 맞게 170px 로 수정
            ghostEl.innerHTML = `<div class="w-[170px] h-[170px] bg-white rounded-[24px] border-[5px] border-yellow-400 shadow-2xl flex items-center justify-center p-3">${dragSrcEl.innerHTML}</div>`;
            ghostEl.classList.remove('hidden');
            ghostEl.style.left = e.clientX + 'px';
            ghostEl.style.top = e.clientY + 'px';

            e.preventDefault();
        }

        function dragMove(e) {
            if (!isDragging) return;
            e.preventDefault();
            ghostEl.style.left = e.clientX + 'px';
            ghostEl.style.top = e.clientY + 'px';

            let target = document.elementFromPoint(e.clientX, e.clientY);
            let zone = target ? target.closest('.drop-zone') : null;

            if (currentHoverZone !== zone) {
                if (currentHoverZone) currentHoverZone.classList.remove('drag-over');
                if (zone && !zone.classList.contains('matched')) zone.classList.add('drag-over');
                currentHoverZone = zone;
            }
        }

        function endDrag(e) {
            if (!isDragging) return;
            isDragging = false;
            ghostEl.classList.add('hidden');
            if (currentHoverZone) currentHoverZone.classList.remove('drag-over');

            let target = document.elementFromPoint(e.clientX, e.clientY);
            let zone = target ? target.closest('.drop-zone') : null;

            if (zone && !zone.classList.contains('matched')) {
                const targetId = zone.getAttribute('data-id');
                if (targetId === draggingData.id) {
                    // Correct!
                    playSound('success');
                    showFeedback(game.questionHadMistake ? 'retry-correct' : 'correct');
                    zone.classList.add('matched');
                    zone.classList.remove('border-dashed', 'bg-gray-100');
                    zone.classList.add(draggingData.bg, draggingData.border);
                    zone.innerHTML = dragSrcEl.innerHTML;

                    dragSrcEl.style.visibility = 'hidden';
                    completeCurrentQuestion();

                } else {
                    // Wrong!
                    game.questionHadMistake = true;
                    playSound('error');
                    showFeedback('wrong');
                    zone.classList.add('shake');
                    setTimeout(() => zone.classList.remove('shake'), 500);
                    dragSrcEl.classList.remove('dragging');
                }
            } else {
                dragSrcEl.classList.remove('dragging');
            }

            draggingData = null; currentHoverZone = null; dragSrcEl = null;
        }

        document.addEventListener('pointermove', dragMove, { passive: false });
        document.addEventListener('pointerdown', () => {
            const bubble = document.getElementById('caption-bubble');
            if (!captionDismissOnPointer || bubble.classList.contains('hidden')) return;
            hideCaptionBubble();
        }, true);
        document.addEventListener('pointerup', endDrag);
        document.addEventListener('pointercancel', () => {
            isDragging = false; ghostEl.classList.add('hidden');
            if (dragSrcEl) dragSrcEl.classList.remove('dragging');
            if (currentHoverZone) currentHoverZone.classList.remove('drag-over');
        });
        document.addEventListener('click', (e) => {
            const button = e.target.closest('button');
            if (!button) return;
            stopSpeech();
        }, true);

        // --- End Game ---
        function endQuiz() {
            stopSpeech();
            clearInterval(game.timer);
            game.isPlaying = false;
            playSound('bonus');
            fireConfetti(true);

            document.getElementById('result-score').innerText = game.currentQ;
            document.getElementById('result-total').innerText = game.totalQ;

            const m = Math.floor(game.seconds / 60);
            const s = game.seconds % 60;
            document.getElementById('result-time').innerText = m > 0 ? `${m}분 ${s}초` : `${s}초`;

            let msg = "정말 잘했어요! 최고예요!";
            if (game.score < game.totalQ * 5) msg = "수고했어요! 조금 더 연습해볼까요?";
            document.getElementById('result-message').innerText = msg;

            document.getElementById('result-modal').classList.remove('hidden');
        }

        // --- Common Modals & Resize ---
        document.getElementById('btn-restart').onclick = () => { document.getElementById('restart-modal').classList.remove('hidden'); speak('처음으로 갈까요?'); };
        function confirmRestart() {
            clearInterval(game.timer);
            document.getElementById('restart-modal').classList.add('hidden');
            hideAllScreens();
            document.getElementById('intro-screen').classList.remove('hidden');
            document.getElementById('btn-restart').classList.add('hidden');
            speak('음표 짝꿍 찾기! 카드 매칭 놀이');
        }

        document.getElementById('btn-exit').onclick = () => { document.getElementById('modal-exit').classList.remove('hidden'); speak('정말 종료할까요?'); };
        function confirmExit() {
            if (window.history.length > 1) window.history.back(); else window.close();
        }

        function resizeGame() {
            const container = document.getElementById('game-container');
            const wrapper = document.getElementById('scalable-wrapper');
            const styles = window.getComputedStyle(container);
            const availableWidth = container.clientWidth - parseFloat(styles.paddingLeft) - parseFloat(styles.paddingRight);
            const availableHeight = container.clientHeight - parseFloat(styles.paddingTop) - parseFloat(styles.paddingBottom);
            const scale = Math.min(availableWidth / 1280, availableHeight / 720);
            wrapper.style.transform = `scale(${scale})`;
        }
        window.addEventListener('resize', resizeGame); resizeGame();

        // Confetti
        const canvas = document.getElementById("confetti"); const ctx = canvas.getContext("2d");
        let particles = []; let confettiReqId = null;
        function resizeCanvas() { canvas.width = 1280; canvas.height = 720; } resizeCanvas();
        function fireConfetti(isGrandClear = false) {
            particles = []; let particleCount = isGrandClear ? 250 : 120;
            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: canvas.width / 2, y: canvas.height / 2,
                    dx: (Math.random() - 0.5) * 45, dy: (Math.random() - 0.5) * 45,
                    size: Math.random() * 15 + 8,
                    color: ['#EF4444', '#3B82F6', '#22C55E', '#A855F7', '#EC4899', '#F97316', '#FBBF24'][Math.floor(Math.random() * 7)],
                    life: isGrandClear ? 300 : 180
                });
            }
            if (!confettiReqId) animateConfetti();
        }
        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (particles.length === 0) { confettiReqId = null; return; }
            particles.forEach((p, i) => {
                p.x += p.dx; p.y += p.dy; p.dy += 0.5; p.life--;
                ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size);
                if (p.life <= 0) particles.splice(i, 1);
            });
            confettiReqId = requestAnimationFrame(animateConfetti);
        }
    </script>
