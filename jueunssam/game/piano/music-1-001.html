<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>도레미 음계 공부하기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* [Core Reset & Safe Area] */
        :root {
            --gnb-height: 60px;
            --app-bg: #f0f9ff;
        }

        body {
            font-family: 'Jua', sans-serif;
            background-color: var(--app-bg);
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            /* Prevent Pull-to-refresh & Zoom */
            height: 100vh;
            width: 100vw;
        }

        /* [GNB Styles] */
        #gnb {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--gnb-height);
            background-color: #FEE500;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* [Game Container & Scaling] */
        #game-container {
            position: absolute;
            top: var(--gnb-height);
            left: 0;
            width: 100%;
            height: calc(100vh - var(--gnb-height));
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: var(--app-bg);
        }

        /* The scalable wrapper for original content */
        #scalable-wrapper {
            width: 1280px;
            /* Logical Base Width */
            height: 720px;
            /* Logical Base Height */
            position: relative;
            transform-origin: center center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* Debug border: border: 1px solid red; */
        }

        /* [Original Game Styles Preservation] */
        .note-bar {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            transform-origin: bottom center;
            will-change: transform, filter;
            /* GPU Hint */
        }

        .note-bar:active {
            transform: scaleY(0.95);
            filter: brightness(0.9);
        }

        .note-bar:hover {
            filter: brightness(1.1);
            box-shadow: 0 -1vmin 2vmin rgba(0, 0, 0, 0.1);
        }

        .note-playing {
            transform: scaleY(1.05);
            filter: brightness(1.2) saturate(1.2);
            box-shadow: 0 0 3vmin rgba(255, 255, 255, 0.8);
        }

        .bounce {
            animation: bounce 2s infinite;
        }

        @keyframes bounce {

            0%,
            20%,
            50%,
            80%,
            100% {
                transform: translateY(0);
            }

            40% {
                transform: translateY(-1.5vmin);
            }

            60% {
                transform: translateY(-0.75vmin);
            }
        }

        .shake {
            animation: shake 0.5s;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25%,
            75% {
                transform: translateX(-1vmin);
            }

            50% {
                transform: translateX(1vmin);
            }
        }

        /* [UI Components] */
        .btn-press {
            transition: transform 0.1s;
        }

        .btn-press:active {
            transform: scale(0.95);
        }

        /* Modal Animation */
        .modal-enter {
            animation: modalFadeIn 0.3s forwards;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Typography Scaling Support */
        .text-scale-title {
            font-size: 5rem;
        }

        .text-scale-lg {
            font-size: 3rem;
        }

        .text-scale-md {
            font-size: 2rem;
        }

        .text-scale-sm {
            font-size: 1.5rem;
        }
    </style>
</head>

                guide3Desc: "Guess where 'Sol' is.",

                allLearned: "You learned all the scales!",
                exitConfirm: "Really Exit?",
                exitDesc: "Progress will not be saved.",
                yes: "Yes, Exit",
                cancel: "No",
                playNote: "Play {note}!",

                wrong: "Try again!",
                noteDo: "Do", noteRe: "Re", noteMi: "Mi", noteFa: "Fa",
                noteSol: "Sol", noteLa: "La", noteSi: "Si", noteDo2: "High Do"
            }
        };

        const NOTES_DATA = [
            { id: 'do', freq: 261.63, color: '#FF4D4D', height: '40%' },
            { id: 're', freq: 293.66, color: '#FFA500', height: '48%' },
            { id: 'mi', freq: 329.63, color: '#FFD700', height: '56%' },
            { id: 'fa', freq: 349.23, color: '#22C55E', height: '64%' },
            { id: 'sol', freq: 392.00, color: '#3B82F6', height: '72%' },
            { id: 'la', freq: 440.00, color: '#4B0082', height: '80%' },
            { id: 'si', freq: 493.88, color: '#9333EA', height: '88%' },
            { id: 'do2', freq: 523.25, color: '#FF4D4D', height: '96%' }
        ];

        // --- [2. Global State] ---
        let currentLang = 'ko';
        let audioCtx = null;
        let ttsAudio = null; // Store current TTS audio object
        let playedNotes = new Set();
        let isQuizMode = false;
        let quizQueue = [];
        let currentQuizIndex = 0;
        let confettiReqId = null;
        let googleTTSAvailable = true; // Flag to track API status

        // --- [Voice Loader] ---
        let availableVoices = [];
        function loadVoices() {
            availableVoices = window.speechSynthesis.getVoices();
        }
        window.speechSynthesis.onvoiceschanged = loadVoices;
        // Try loading immediately as well
        loadVoices();

        // --- [3. System Functions (Audio, TTS, Scaling)] ---

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playNote(freq) {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.02);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 1.5);
        }

        function playSFX(type) {
            initAudio();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(660, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                osc.start();
                osc.stop(now + 0.5);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(100, now + 0.3);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                osc.start();
                osc.stop(now + 0.3);
            } else if (type === 'victory') {
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.type = 'triangle';
                    o.frequency.value = freq;
                    g.gain.setValueAtTime(0, now + i * 0.1);
                    g.gain.linearRampToValueAtTime(0.2, now + i * 0.1 + 0.05);
                    g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.5);
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.start(now + i * 0.1);
                    o.stop(now + i * 0.1 + 0.6);
                });
            }
        }

        // Stop any currently playing TTS
        function stopTTS() {
            if (ttsAudio) {
                ttsAudio.pause();
                ttsAudio.currentTime = 0;
                ttsAudio = null;
            }
            window.speechSynthesis.cancel();
        }

        // GOOGLE TTS IMPLEMENTATION with Smart Fallback
        async function speak(keyOrText, isRaw = false) {
            stopTTS(); // Stop previous audio

            // Get the actual text
            const text = isRaw ? keyOrText : (I18N_DATA[currentLang][keyOrText] || keyOrText);
            if (!text) return;

            // 1. Check if Google TTS is marked as failed/unavailable
            if (!googleTTSAvailable) {
                fallbackSpeak(text);
                return;
            }

            // Configure Google Cloud TTS
            const langCode = currentLang === 'ko' ? 'ko-KR' : 'en-US';
            const voiceName = currentLang === 'ko' ? 'ko-KR-Standard-A' : 'en-US-Standard-E';

            // Explicit Log for Debugging
            console.log(`[TTS] Requesting Google Cloud TTS for: "${text}"`);

            try {
                const response = await fetch(`https://texttospeech.googleapis.com/v1/text:synthesize?key=${GOOGLE_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        input: { text: text },
                        voice: { languageCode: langCode, name: voiceName },
                        audioConfig: { audioEncoding: 'MP3' }
                    })
                });

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }

                const data = await response.json();
                if (data.audioContent) {
                    // Convert base64 to audio blob
                    // console.log("[TTS] Audio content received. Playing...");
                    const audioBlob = await fetch(`data:audio/mp3;base64,${data.audioContent}`).then(res => res.blob());
                    const audioUrl = URL.createObjectURL(audioBlob);
                    ttsAudio = new Audio(audioUrl);
                    ttsAudio.play().catch(e => console.error("Audio Playback Error:", e));
                } else {
                    console.warn("Google TTS Error/Fallback: No content", data);
                    fallbackSpeak(text);
                }
            } catch (e) {
                // 2. Catch Error and Switch to Fallback Mode Permanently for this session
                console.warn("Google TTS failed (switching to offline mode):", e);
                googleTTSAvailable = false; // Mark as unavailable to prevent future API calls
                fallbackSpeak(text);
            }
        }

        function fallbackSpeak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            const isEnglish = currentLang !== 'ko';
            utterance.lang = isEnglish ? 'en-US' : 'ko-KR';
            utterance.rate = 0.9;

            // Ensure voices are loaded
            if (availableVoices.length === 0) {
                availableVoices = window.speechSynthesis.getVoices();
            }

            if (isEnglish) {
                // Priority list for natural female English voices
                const targetVoices = [
                    "Google US English", // Chrome
                    "Samantha",          // macOS/iOS
                    "Microsoft Zira",    // Windows
                    "Karen",             // macOS/iOS (AU Female)
                    "Tessa"              // macOS/iOS (ZA Female)
                ];

                let selectedVoice = availableVoices.find(v => targetVoices.some(target => v.name.includes(target)));

                // Fallback 2: Any English voice that isn't specifically male (hard to tell, so default to en-US)
                if (!selectedVoice) {
                    selectedVoice = availableVoices.find(v => v.lang === 'en-US');
                }

                if (selectedVoice) {
                    utterance.voice = selectedVoice;
                }
            } else {
                // Korean: Prioritize Google Korean
                const koVoice = availableVoices.find(v => v.name.includes('Google 한국어') || v.lang === 'ko-KR');
                if (koVoice) utterance.voice = koVoice;
            }

            window.speechSynthesis.speak(utterance);
        }

        // --- [4. Logic & Game Functions] ---

        function getNoteName(id) {
            const map = {
                'do': 'noteDo', 're': 'noteRe', 'mi': 'noteMi', 'fa': 'noteFa',
                'sol': 'noteSol', 'la': 'noteLa', 'si': 'noteSi', 'do2': 'noteDo2'
            };
            return I18N_DATA[currentLang][map[id]];
        }

        function createPianoKeys(container, isQuiz = false) {
            container.innerHTML = '';
            NOTES_DATA.forEach(note => {
                const bar = document.createElement('div');
                bar.id = `note-${note.id}${isQuiz ? '-quiz' : ''}`;
                bar.className = 'note-bar rounded-t-[2vmin] rounded-b-[1vmin] flex flex-col justify-end items-center pb-[2vmin] shadow-md border-x border-t border-white/50 relative overflow-hidden group';
                bar.style.height = note.height;
                bar.style.backgroundColor = note.color;
                bar.style.flex = '1';

                const name = getNoteName(note.id);
                const isLearned = !isQuiz && playedNotes.has(note.id);
                const checkHTML = !isQuiz ?
                    `<div class="absolute top-[2vmin] text-white/80 ${isLearned ? 'animate-bounce' : 'hidden'} check-icon">
                        <i data-lucide="check" class="w-[3vmin] h-[3vmin]"></i>
                     </div>` : '';

                bar.innerHTML = `
                    <div class="absolute inset-0 bg-gradient-to-r from-white/30 to-transparent pointer-events-none"></div>
                    ${checkHTML}
                    <div class="z-10 text-white text-scale-sm font-bold drop-shadow-md flex flex-col items-center">
                        <span>${name}</span>
                    </div>
                `;

                bar.onclick = () => {
                    playNote(note.freq);
                    bar.classList.add('note-playing');
                    setTimeout(() => bar.classList.remove('note-playing'), 200);

                    if (isQuiz) {
                        checkQuizAnswer(note, bar);
                    } else {
                        if (!playedNotes.has(note.id)) {
                            playedNotes.add(note.id);
                            const icon = bar.querySelector('.check-icon');
                            if (icon) {
                                icon.classList.remove('hidden');
                                icon.classList.add('animate-bounce');
                            }
                            updateLearningProgress();
                        }
                    }
                };
                container.appendChild(bar);
            });
            lucide.createIcons();
        }

        function updateLearningProgress() {
            const current = playedNotes.size;
            const total = NOTES_DATA.length;
            const instruction = document.getElementById('instruction-text');
            const quizBtn = document.getElementById('quiz-btn');

            if (current === total) {
                instruction.innerText = I18N_DATA[currentLang].readyQuiz;
                quizBtn.disabled = false;
                quizBtn.classList.remove('bg-gray-300', 'cursor-not-allowed');
                quizBtn.classList.add('bg-green-500', 'hover:bg-green-600', 'bounce');
                quizBtn.innerHTML = `<span>${I18N_DATA[currentLang].quizStart}</span> <i data-lucide="play-circle" class="w-8 h-8"></i>`;
                lucide.createIcons();
            } else {
                instruction.innerText = I18N_DATA[currentLang].instructionProgress
                    .replace('{current}', current).replace('{total}', total);
            }
        }

        function startQuiz() {
            stopTTS();
            isQuizMode = true;
            document.getElementById('learning-section').classList.add('hidden');
            document.getElementById('quiz-section').classList.remove('hidden');
            document.getElementById('quiz-section').classList.add('flex');
            document.getElementById('progress-container').classList.remove('hidden');

            quizQueue = [...NOTES_DATA].sort(() => Math.random() - 0.5).slice(0, 5);
            currentQuizIndex = 0;

            updateProgressBar();
            loadNextQuestion();
        }

        function loadNextQuestion() {
            if (currentQuizIndex >= quizQueue.length) {
                showEndScreen();
                return;
            }

            const feedback = document.getElementById('feedback-message');
            feedback.style.opacity = '0';

            createPianoKeys(document.getElementById('quiz-options'), true);

            const target = quizQueue[currentQuizIndex];
            const qText = getNoteName(target.id);
            const questionEl = document.getElementById('quiz-question-text');

            const rawText = I18N_DATA[currentLang].playNote.replace('{note}', qText);
            questionEl.innerHTML = I18N_DATA[currentLang].playNote.replace('{note}', `<span style="color:${target.color}">${qText}</span>`);

            speak(rawText, true);
        }

        function checkQuizAnswer(selected, element) {
            const target = quizQueue[currentQuizIndex];
            const feedback = document.getElementById('feedback-message');

            if (selected.id === target.id) {
                playSFX('correct');
                feedback.innerText = I18N_DATA[currentLang].correct;
                feedback.className = "h-16 text-4xl font-bold text-center text-green-500 transition-opacity duration-300 opacity-100 shrink-0";
                fireConfettiBurst();

                setTimeout(() => {
                    currentQuizIndex++;
                    updateProgressBar();
                    loadNextQuestion();
                }, 1200);
            } else {
                playSFX('wrong');
                element.classList.add('shake');
                setTimeout(() => element.classList.remove('shake'), 500);

                feedback.innerText = I18N_DATA[currentLang].wrong;
                feedback.className = "h-16 text-4xl font-bold text-center text-orange-500 transition-opacity duration-300 opacity-100 shrink-0";
            }
        }

        function updateProgressBar() {
            const pct = (currentQuizIndex / quizQueue.length) * 100;
            document.getElementById('progress-bar').style.width = `${pct}%`;
        }

        function showEndScreen() {
            stopTTS();
            document.getElementById('quiz-section').classList.add('hidden');
            document.getElementById('quiz-section').classList.remove('flex');
            document.getElementById('progress-container').classList.add('hidden');
            document.getElementById('end-section').classList.remove('hidden');
            document.getElementById('end-section').classList.add('flex');

            playSFX('victory');
            startConfettiLoop();
            setTimeout(stopConfettiLoop, 3000);

            speak('greatJob');
        }

        function resetGame() {
            stopTTS();
            playedNotes.clear();
            isQuizMode = false;

            document.getElementById('intro-screen').classList.remove('hidden');
            document.getElementById('app-content').classList.add('hidden');
            document.getElementById('quiz-section').classList.add('hidden');
            document.getElementById('quiz-section').classList.remove('flex');
            document.getElementById('end-section').classList.add('hidden');
            document.getElementById('end-section').classList.remove('flex');
            document.getElementById('progress-container').classList.add('hidden');
            document.getElementById('learning-section').classList.remove('hidden');
            document.getElementById('btn-restart').classList.add('hidden');

            const quizBtn = document.getElementById('quiz-btn');
            quizBtn.disabled = true;
            quizBtn.classList.add('bg-gray-300', 'cursor-not-allowed');
            quizBtn.classList.remove('bg-green-500', 'hover:bg-green-600', 'bounce');
            quizBtn.innerHTML = `<span>${I18N_DATA[currentLang].quizLocked}</span> <i data-lucide="lock" class="w-8 h-8"></i>`;

            document.getElementById('instruction-text').innerText = I18N_DATA[currentLang].instructionInit;

            stopConfettiLoop();
            lucide.createIcons();
        }

        // --- [5. UI & Event Listeners] ---

        function updateTexts() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (I18N_DATA[currentLang][key]) {
                    el.innerText = I18N_DATA[currentLang][key];
                }
            });
            if (!isQuizMode) {
                createPianoKeys(document.getElementById('piano-container'), false);
                updateLearningProgress();
            }
        }

        function resizeGame() {
            const container = document.getElementById('game-container');
            const wrapper = document.getElementById('scalable-wrapper');
            const cw = container.clientWidth;
            const ch = container.clientHeight;
            const baseW = 1280;
            const baseH = 720;
            const scale = Math.min(cw / baseW, ch / baseH);
            wrapper.style.transform = `scale(${scale})`;
        }

        window.addEventListener('resize', resizeGame);

        document.getElementById('btn-lang').onclick = () => {
            currentLang = currentLang === 'ko' ? 'en' : 'ko';
            updateTexts();
            speak(currentLang === 'ko' ? '한국어' : 'English', true);
        };

        document.getElementById('btn-start').onclick = () => {
            stopTTS();
            initAudio();
            document.getElementById('intro-screen').classList.add('hidden');
            document.getElementById('app-content').classList.remove('hidden');
            document.getElementById('app-content').classList.add('flex');
            document.getElementById('btn-restart').classList.remove('hidden');

            createPianoKeys(document.getElementById('piano-container'), false);
            speak('instructionInit');
        };

        document.getElementById('quiz-btn').onclick = startQuiz;
        document.getElementById('btn-restart').onclick = resetGame;
        document.getElementById('btn-restart-inner').onclick = resetGame;

        const infoModal = document.getElementById('modal-info');
        const exitModal = document.getElementById('modal-exit');

        // UPDATED: Read full instructions
        document.getElementById('btn-howto').onclick = () => {
            stopTTS();
            infoModal.classList.remove('hidden');

            // Construct full explanation text
            const i18n = I18N_DATA[currentLang];
            let fullText = "";
            if (currentLang === 'ko') {
                fullText = `${i18n.howToPlay}! 첫째, ${i18n.guide1Title}. ${i18n.guide1Desc}. 둘째, ${i18n.guide2Title}. ${i18n.guide2Desc}. 셋째, ${i18n.guide3Title}. ${i18n.guide3Desc}.`;
            } else {
                fullText = `${i18n.howToPlay}! First, ${i18n.guide1Title}. ${i18n.guide1Desc}. Second, ${i18n.guide2Title}. ${i18n.guide2Desc}. Third, ${i18n.guide3Title}. ${i18n.guide3Desc}.`;
            }
            speak(fullText, true);
        };

        document.querySelectorAll('.btn-close-modal').forEach(btn => {
            btn.onclick = () => {
                stopTTS();
                infoModal.classList.add('hidden');
            };
        });

        document.getElementById('btn-exit').onclick = () => {
            stopTTS();
            exitModal.classList.remove('hidden');
            speak('exitConfirm');
        };
        document.getElementById('btn-cancel-exit').onclick = () => {
            stopTTS();
            exitModal.classList.add('hidden');
        };
        document.getElementById('btn-confirm-exit').onclick = () => {
            stopTTS();
            // Try to go back
            if (window.history.length > 1) {
                window.history.back();
            } else {
                // If no history, try closing (often works for popups)
                window.close();
            }
        };

        // --- [6. Confetti Engine] ---
        const canvas = document.getElementById("confetti");
        const ctx = canvas.getContext("2d");
        let particles = [];

        function resizeCanvas() {
            canvas.width = 1280;
            canvas.height = 720;
        }

        function fireConfettiBurst() {
            const colors = ['#FF4D4D', '#FFD700', '#3B82F6', '#22C55E', '#9333EA', '#FFA500'];
            for (let i = 0; i < 30; i++) {
                particles.push({
                    x: 1280 / 2,
                    y: 720 / 2,
                    w: Math.random() * 10 + 5,
                    h: Math.random() * 10 + 5,
                    dx: (Math.random() - 0.5) * 20,
                    dy: (Math.random() - 0.5) * 20,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    life: 100
                });
            }
            if (!confettiReqId) animateConfetti();
        }

        function startConfettiLoop() {
            const colors = ['#FF4D4D', '#FFD700', '#3B82F6', '#22C55E', '#9333EA', '#FFA500'];
            const interval = setInterval(() => {
                if (document.getElementById('end-section').classList.contains('hidden')) {
                    clearInterval(interval);
                    return;
                }
                for (let i = 0; i < 5; i++) {
                    particles.push({
                        x: Math.random() * 1280,
                        y: -20,
                        w: Math.random() * 10 + 5,
                        h: Math.random() * 10 + 5,
                        dx: (Math.random() - 0.5) * 5,
                        dy: Math.random() * 5 + 5,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        life: 150
                    });
                }
            }, 100);
            if (!confettiReqId) animateConfetti();
        }

        function stopConfettiLoop() {
            particles = [];
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (confettiReqId) {
                cancelAnimationFrame(confettiReqId);
                confettiReqId = null;
            }
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (particles.length === 0) {
                confettiReqId = null;
                return;
            }

            particles.forEach((p, index) => {
                p.x += p.dx;
                p.y += p.dy;
                p.dy += 0.2;
                p.life--;

                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.w, p.h);

                if (p.life <= 0) particles.splice(index, 1);
            });

            confettiReqId = requestAnimationFrame(animateConfetti);
        }

        // --- [7. Init] ---
        resizeCanvas();
        resizeGame();
        lucide.createIcons();
    </script>
