<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>드럼 큐브 브레이커 - MIDI Professional</title>

    <!-- 필수 라이브러리 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">

    <style>
        @font-face {
            font-family: 'Sacheonhanggong';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2506-1@1.0/SacheonHangGong-Regular.woff2') format('woff2');
            font-weight: normal;
            font-display: swap;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #f3f4f6;
            font-family: 'Jua', sans-serif;
            /* 기본 UI 폰트 */
            user-select: none;
            touch-action: none;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
        }

        /* --- UI Components (Drum-1-001 Style) --- */
        .kakao-header {
            background-color: #FEE500;
            color: #3b1e1e;
            width: 100%;
            height: 8vmin;
            min-height: 50px;
            max-height: 65px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 3vmin;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            flex-shrink: 0;
            position: relative;
        }

        .main-content-area {
            flex-grow: 1;
            width: 100%;
            height: calc(100vh - 8vmin);
            position: relative;
            overflow: hidden;
            background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%);
        }

        /* 3D Canvas Container */
        #game-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* --- Modals & Overlays --- */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            backdrop-filter: blur(8px);
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            transition: opacity 0.3s;
        }

        .hidden {
            display: none !important;
            opacity: 0;
            pointer-events: none;
        }

        /* Loading Screen */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #87CEEB;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s;
        }

        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #FFDC00;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Buttons */
        .btn-start {
            background: #FF4136;
            color: white;
            padding: 15px 40px;
            font-size: clamp(20px, 4vw, 28px);
            border-radius: 50px;
            cursor: pointer;
            border: none;
            box-shadow: 0 6px 0 #b02d26;
            transition: transform 0.1s;
            font-family: 'Jua', sans-serif;
        }

        .btn-start:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #b02d26;
        }

        /* MIDI Status Box */
        .midi-status-box {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            padding: 10px 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 20px;
            margin-bottom: 30px;
            font-size: 18px;
            color: #ccc;
            transition: all 0.3s;
        }

        .midi-status-box.connected {
            border-color: #2ECC40;
            color: #fff;
            background: rgba(46, 204, 64, 0.2);
            box-shadow: 0 0 15px rgba(46, 204, 64, 0.4);
        }

        .status-led {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #FF4136;
            box-shadow: 0 0 5px #FF4136;
            transition: all 0.3s;
        }

        .midi-status-box.connected .status-led {
            background: #2ECC40;
            box-shadow: 0 0 10px #2ECC40;
        }

        /* In-Game HUD */
        #ui-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            color: #1e293b;
            border-radius: 20px;
            padding: 15px 25px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        /* Floating Text Effects */
        .float-text {
            position: absolute;
            font-family: 'Sacheonhanggong', sans-serif;
            font-weight: 900;
            font-size: clamp(3rem, 10vw, 6rem);
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            animation: popUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            pointer-events: none;
            z-index: 50;
        }

        .combo-text {
            color: #f59e0b;
            text-shadow: 2px 2px 0 #fff;
        }

        .miss-text {
            color: #ef4444;
            text-shadow: 2px 2px 0 #fff;
        }

        @keyframes popUp {
            0% {
                transform: scale(0.5) translate(-50%, -50%);
                opacity: 0;
            }

            50% {
                transform: scale(1.2) translate(-50%, -50%);
                opacity: 1;
            }

            100% {
                transform: scale(1) translate(-50%, -100%);
                opacity: 0;
            }
        }

        .countdown-num {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 15rem;
            font-weight: 900;
            color: #4f46e5;
            text-shadow: 4px 4px 0px white, 0 0 20px rgba(79, 70, 229, 0.5);
            animation: countAnim 0.8s ease-in-out forwards;
            z-index: 60;
            font-family: 'Jua', sans-serif;
        }

        @keyframes countAnim {
            0% {
                transform: translate(-50%, -50%) scale(0.2);
                opacity: 0;
            }

            50% {
                transform: translate(-50%, -50%) scale(1.1);
                opacity: 1;
            }

            100% {
                transform: translate(-50%, -50%) scale(1.8);
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <!-- 로딩 화면 -->
    <div id="loading-screen">
        <div class="loader"></div>
        <p class="mt-4 text-white text-xl font-bold">리소스를 불러오는 중...</p>
        <p class="text-white/70 text-sm mt-2">잠시만 기다려주세요</p>
    </div>

    <!-- 카카오 스타일 헤더 -->
    <header class="kakao-header">
        <div class="flex items-center gap-[1vmin]">
            <i data-lucide="music" class="w-[3.5vmin] h-[3.5vmin] min-w-[18px] min-h-[18px] text-[#3b1e1e]"></i>
            <h1
                class="text-[clamp(18px,3vmin,26px)] font-bold tracking-tight text-[#3b1e1e] whitespace-nowrap overflow-hidden text-ellipsis">
                드럼 큐브 브레이커
            </h1>
        </div>
        <div class="flex gap-2">
            <button onclick="game.resetToIntro()"
                class="bg-[#fff] text-[#3b1e1e] px-[2vmin] py-[0.8vmin] rounded-[1vmin] text-[clamp(12px,2vmin,16px)] hover:opacity-80 transition font-bold shadow-sm flex items-center gap-[0.5vmin] shrink-0 border border-[#3b1e1e]/20">
                다시 시작 <i data-lucide="rotate-ccw" class="w-[2vmin] h-[2vmin] min-w-[12px] min-h-[12px]"></i>
            </button>
            <button onclick="game.quitApp()"
                class="bg-[#3b1e1e] text-[#FEE500] px-[2vmin] py-[0.8vmin] rounded-[1vmin] text-[clamp(12px,2vmin,16px)] hover:opacity-80 transition font-bold shadow-sm flex items-center gap-[0.5vmin] shrink-0">
                학습 종료 <i data-lucide="log-out" class="w-[2vmin] h-[2vmin] min-w-[12px] min-h-[12px]"></i>
            </button>
        </div>
    </header>

    <!-- 메인 컨텐츠 영역 -->
    <div class="main-content-area relative" id="main-content">
        <!-- 3D 게임 캔버스 -->
        <div id="game-wrapper"></div>

        <!-- 게임 HUD -->
        <div id="ui-layer" class="hidden">
            <div class="flex justify-between items-start w-full">
                <div class="glass-panel">
                    <div class="text-xs text-gray-500 font-bold uppercase tracking-widest">SCORE</div>
                    <div id="score-display" class="text-3xl font-black text-indigo-600 font-[Sacheonhanggong]">0</div>
                </div>

                <div id="timer-box" class="glass-panel text-center min-w-[100px]">
                    <div class="text-xs text-gray-500 font-bold uppercase tracking-widest">TIME</div>
                    <div id="timer-display" class="text-3xl font-black text-rose-500 font-[Sacheonhanggong]">60</div>
                </div>

                <div class="glass-panel text-right">
                    <div class="text-xs text-gray-500 font-bold uppercase tracking-widest">COMBO</div>
                    <div id="combo-display" class="text-3xl font-black text-amber-500 font-[Sacheonhanggong]">0</div>
                </div>
            </div>
        </div>

        <!-- 효과 및 카운트다운 레이어 -->
        <div id="effect-layer" class="absolute inset-0 pointer-events-none z-50 flex justify-center items-center"></div>

        <!-- INTRO: 시작 화면 -->
        <div id="intro-screen" class="modal-overlay">
            <h1
                class="text-[clamp(40px,8vw,70px)] text-white font-bold mb-2 leading-tight drop-shadow-md animate-bounce text-center">
                드럼 큐브<br><span class="text-yellow-300">브레이커</span>
            </h1>
            <p class="text-white/90 text-xl font-bold mb-8">박자에 맞춰 드럼을 연주해 큐브를 격파하세요! 🥁</p>

            <div id="midi-status-box" class="midi-status-box">
                <div class="status-led"></div>
                <span id="midi-status-text">드럼 연결 확인 중...</span>
            </div>

            <button onclick="game.tryStartGame()" class="btn-start animate-pulse">
                GAME START
            </button>

            <p class="text-white/50 text-sm mt-8">MIDI 전자드럼 연결 필수</p>
        </div>

        <!-- MIDI 경고 팝업 -->
        <div id="midi-warning-modal" class="modal-overlay hidden" style="z-index: 3000;">
            <div class="bg-white p-8 rounded-[30px] text-center shadow-2xl max-w-sm w-[90%] border-4 border-yellow-400">
                <i data-lucide="plug-zap" class="w-16 h-16 mx-auto text-red-500 mb-4"></i>
                <h2 class="text-2xl font-bold text-gray-800 mb-2">드럼 미연결</h2>
                <p class="text-gray-600 mb-6 text-lg break-keep leading-snug">
                    드럼이 연결되지 않아<br>정상적인 플레이가 불가능합니다.
                </p>
                <div class="flex flex-col gap-3">
                    <button onclick="game.startAutoPlay()"
                        class="w-full py-4 bg-purple-600 text-white rounded-xl font-bold hover:bg-purple-700 transition shadow-lg text-lg animate-pulse">
                        <i data-lucide="bot" class="inline-block w-6 h-6 mr-2"></i>자동 연주 (봇) 구경하기
                    </button>
                    <p class="text-sm text-gray-400 mt-2">화면 터치 및 키보드 입력은 제한됩니다.</p>
                </div>
            </div>
        </div>

        <!-- 결과 화면 -->
        <div id="result-screen" class="modal-overlay hidden">
            <h1 class="text-5xl text-yellow-300 font-black mb-4">GAME OVER</h1>
            <div class="bg-white/10 p-8 rounded-3xl backdrop-blur-md border border-white/20 mb-8 w-full max-w-md">
                <div class="text-white/70 text-lg font-bold mb-2">최종 점수</div>
                <div id="final-score" class="text-6xl text-white font-black mb-6">0</div>
                <div class="flex justify-around text-white">
                    <div class="text-center">
                        <div class="text-sm opacity-70">MAX COMBO</div>
                        <div id="final-combo" class="text-2xl font-bold text-amber-400">0</div>
                    </div>
                    <div class="text-center">
                        <div class="text-sm opacity-70">HIT RATE</div>
                        <div id="final-accuracy" class="text-2xl font-bold text-green-400">0%</div>
                    </div>
                </div>
            </div>
            <div class="flex gap-4">
                <button onclick="game.resetToIntro()"
                    class="bg-gray-500 text-white px-6 py-3 rounded-full font-bold hover:bg-gray-600 transition">처음으로</button>
                <button onclick="game.restartInstant()"
                    class="bg-indigo-600 text-white px-8 py-3 rounded-full font-bold text-xl hover:bg-indigo-700 shadow-lg transition">다시
                    하기</button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        const apiKey = "";

        try {
            window.history.replaceState(null, null, "/");
            window.onpopstate = function () {
                window.history.replaceState(null, null, "/");
            };
        } catch (e) { console.log("History API restricted"); }

        // MIDI 맵핑 데이터 (킥 제거됨)
        const MIDI_MAP = {
            'snare': [38, 40],
            'tom1': [48, 50],
            'tom2': [45, 47],
            'floor': [41, 43],
            'hh': [42, 44, 46],
            'crash': [49, 52, 55, 57],
            'ride': [51, 59]
        };

        // 색상 업데이트 (선명한 색상, 킥 제거)
        const DRUM_DATA = [
            { id: 'crash', label: '크래쉬', en: 'Crash', abbr: 'C', color: '#dc2626', key: 'Q' }, // 레드
            { id: 'tom1', label: '탐 1', en: 'Tom One', abbr: 'T.1', color: '#ea580c', key: 'W' }, // 주황
            { id: 'tom2', label: '탐 2', en: 'Tom Two', abbr: 'T.2', color: '#d97706', key: 'E' }, // 노랑 (진한)
            { id: 'ride', label: '라이드', en: 'Ride', abbr: 'R', color: '#15803d', key: 'R' }, // 그린
            { id: 'snare', label: '스네어', en: 'Snare', abbr: 'S', color: '#1d4ed8', key: 'A' }, // 파랑
            { id: 'hh', label: '하이햇', en: 'Hi Hat', abbr: 'H', color: '#db2777', key: 'S' }, // 핑크
            { id: 'floor', label: '플로어탐', en: 'Floor Tom', abbr: 'F', color: '#7e22ce', key: 'D' } // 보라
        ];

        const SOUND_URLS = {
            'snare': 'https://cdn.jsdelivr.net/gh/wesbos/JavaScript30@master/01%20-%20JavaScript%20Drum%20Kit/sounds/snare.wav',
            'hh': 'https://cdn.jsdelivr.net/gh/wesbos/JavaScript30@master/01%20-%20JavaScript%20Drum%20Kit/sounds/hihat.wav',
            'tom': 'https://cdn.jsdelivr.net/gh/wesbos/JavaScript30@master/01%20-%20JavaScript%20Drum%20Kit/sounds/tom.wav',
            'ride': 'https://cdn.jsdelivr.net/gh/wesbos/JavaScript30@master/01%20-%20JavaScript%20Drum%20Kit/sounds/ride.wav',
            'bgm': 'https://cdn.pixabay.com/audio/2024/09/27/audio_b337e62249.mp3'
        };

        class DrumGame {
            constructor() {
                this.score = 0;
                this.combo = 0;
                this.maxCombo = 0;
                this.timeLeft = 60;
                this.hits = 0;
                this.attempts = 0;
                this.isActive = false;
                this.isPaused = false;

                this.blocks = [];
                this.particles = [];
                this.decoBlocks = [];

                this.audioCtx = null;
                this.buffers = {};
                this.bgmNode = null;
                this.isMidiConnected = false;
                this.inputLocked = false;
                this.isAutoPlay = false;

                this.init();
            }

            async init() {
                this.initAudioContext();
                this.init3D();
                await this.preloadAssets();
                this.initMIDI();
                this.createDecoBlocks();
                this.bindKeyboard();
                this.animate();
            }

            initAudioContext() {
                this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            async preloadAssets() {
                const cache = await caches.open('drum-game-assets-v1');
                const promises = Object.entries(SOUND_URLS).map(async ([key, url]) => {
                    let response = await cache.match(url);
                    if (!response) {
                        try {
                            response = await fetch(url);
                            if (response.ok) cache.put(url, response.clone());
                        } catch (e) { console.warn(`Failed to fetch ${key}`); return; }
                    }
                    if (response) {
                        const arrayBuffer = await response.arrayBuffer();
                        this.buffers[key] = await this.audioCtx.decodeAudioData(arrayBuffer);
                    }
                });

                await Promise.all(promises);

                const loader = document.getElementById('loading-screen');
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 500);
            }

            init3D() {
                const container = document.getElementById('game-wrapper');
                const width = container.clientWidth;
                const height = container.clientHeight;

                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0xf8fafc);
                this.scene.fog = new THREE.Fog(0xf8fafc, 10, 40);

                this.camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 1000);
                this.camera.position.set(0, 4.5, 8);
                this.camera.lookAt(0, 1.5, -5);

                this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
                this.renderer.setSize(width, height);
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                container.appendChild(this.renderer.domElement);

                const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
                this.scene.add(ambientLight);

                const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
                dirLight.position.set(5, 10, 5);
                dirLight.castShadow = true;
                dirLight.shadow.mapSize.width = 1024;
                dirLight.shadow.mapSize.height = 1024;
                this.scene.add(dirLight);

                const floorGeo = new THREE.PlaneGeometry(20, 100);
                const floorMat = new THREE.MeshPhongMaterial({ color: 0xe2e8f0 });
                const floor = new THREE.Mesh(floorGeo, floorMat);
                floor.rotation.x = -Math.PI / 2;
                floor.position.y = 0;
                floor.receiveShadow = true;
                this.scene.add(floor);

                window.addEventListener('resize', () => {
                    const w = container.clientWidth;
                    const h = container.clientHeight;
                    this.camera.aspect = w / h;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(w, h);
                });
            }

            createRoundedBox(w, h, d, radius, smoothness) {
                const shape = new THREE.Shape();
                const r = radius - 0.0001;
                shape.absarc(0.0001, 0.0001, 0.0001, -Math.PI / 2, -Math.PI, true);
                shape.absarc(0.0001, h - r * 2, 0.0001, Math.PI, Math.PI / 2, true);
                shape.absarc(w - r * 2, h - r * 2, 0.0001, Math.PI / 2, 0, true);
                shape.absarc(w - r * 2, 0.0001, 0.0001, 0, -Math.PI / 2, true);
                const geometry = new THREE.ExtrudeGeometry(shape, {
                    depth: d - radius * 2, bevelEnabled: true, bevelSegments: smoothness,
                    steps: 1, bevelSize: r, bevelThickness: radius, curveSegments: smoothness
                });
                geometry.center();
                return geometry;
            }

            createBlockTexture(color, text) {
                const canvas = document.createElement('canvas');
                canvas.width = 256; canvas.height = 256;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = color; ctx.fillRect(0, 0, 256, 256);

                ctx.lineWidth = 15;
                ctx.strokeStyle = "rgba(0,0,0,0.2)";
                ctx.strokeRect(0, 0, 256, 256);

                ctx.fillStyle = 'white';
                ctx.font = 'bold 120px sans-serif';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 15;
                ctx.shadowOffsetX = 4;
                ctx.shadowOffsetY = 4;
                ctx.fillText(text, 128, 128);
                return new THREE.CanvasTexture(canvas);
            }

            createBlock(index = 0) {
                const drum = DRUM_DATA[Math.floor(Math.random() * DRUM_DATA.length)];
                const geometry = this.createRoundedBox(2.8, 2.8, 2.8, 0.4, 4);
                const texture = this.createBlockTexture(drum.color, drum.abbr);

                // 재질 개선: StandardMaterial로 변경하고 발광 효과를 주어 색상 강조
                const material = new THREE.MeshStandardMaterial({
                    map: texture,
                    roughness: 0.4,
                    metalness: 0.1,
                    emissive: drum.color,
                    emissiveIntensity: 0.2
                });
                const mesh = new THREE.Mesh(geometry, material);
                mesh.castShadow = true;

                const zGap = 8.0;
                const ySlope = 0.5;
                // 높이 보정: 2.2로 올려서 바닥 겹침 해결 (박스 높이 2.8의 절반 1.4 + 여유 0.8)
                mesh.position.y = 3.3 + (index * ySlope);
                mesh.position.z = -10 - (index * zGap);

                mesh.userData = { drumId: drum.id, color: drum.color, index: index, enName: drum.en };
                this.scene.add(mesh);
                this.blocks.push(mesh);
            }

            createDecoBlocks() {
                this.decoBlocks.forEach(b => this.scene.remove(b));
                this.decoBlocks = [];
                for (let i = 0; i < 10; i++) {
                    const drum = DRUM_DATA[i % DRUM_DATA.length];
                    const geo = new THREE.BoxGeometry(1, 1, 1);
                    const mat = new THREE.MeshLambertMaterial({ color: drum.color, transparent: true, opacity: 0.3 });
                    const mesh = new THREE.Mesh(geo, mat);
                    mesh.position.set((Math.random() - 0.5) * 20, 2 + Math.random() * 10, -10 - Math.random() * 30);
                    mesh.rotation.set(Math.random(), Math.random(), Math.random());
                    this.scene.add(mesh);
                    this.decoBlocks.push(mesh);
                }
            }

            initMIDI() {
                if (!navigator.requestMIDIAccess) {
                    this.updateMidiUI(false);
                    return;
                }
                navigator.requestMIDIAccess().then(access => {
                    const check = () => {
                        this.isMidiConnected = access.inputs.size > 0;
                        this.updateMidiUI(this.isMidiConnected);
                    };
                    check();
                    access.onstatechange = check;
                    for (let input of access.inputs.values()) {
                        input.onmidimessage = (e) => this.handleMIDIMessage(e);
                    }
                }).catch(() => this.updateMidiUI(false));
            }

            updateMidiUI(connected) {
                const box = document.getElementById('midi-status-box');
                const text = document.getElementById('midi-status-text');
                if (connected) {
                    box.classList.add('connected');
                    text.innerText = "드럼 연결됨!";
                } else {
                    box.classList.remove('connected');
                    text.innerText = "드럼 연결 대기중...";
                }
            }

            handleMIDIMessage(event) {
                const [status, note, velocity] = event.data;
                if (status >= 144 && status <= 159 && velocity > 0) {
                    if (!this.isActive && !document.getElementById('intro-screen').classList.contains('hidden')) return;

                    let drumId = null;
                    for (const [id, notes] of Object.entries(MIDI_MAP)) {
                        if (notes.includes(note)) {
                            drumId = id;
                            break;
                        }
                    }
                    if (drumId) this.handleInput(drumId);
                }
            }

            bindKeyboard() {
                window.addEventListener('keydown', (e) => {
                    if (this.inputLocked) return;
                    const key = e.key.toUpperCase();
                    const drum = DRUM_DATA.find(d => d.key === key);
                    if (drum) this.handleInput(drum.id);
                });
            }

            handleInput(drumId) {
                if (!this.isActive || this.isPaused || this.inputLocked) return;

                this.playSample(drumId);

                this.attempts++;
                if (this.blocks.length > 0) {
                    const targetBlock = this.blocks[0];
                    if (targetBlock.position.z > -2 && targetBlock.position.z < 6) {
                        if (targetBlock.userData.drumId === drumId) {
                            this.hitBlock(targetBlock);
                        } else {
                            this.miss();
                        }
                    }
                }
            }

            playSample(type) {
                if (this.audioCtx.state === 'suspended') this.audioCtx.resume();

                let key = type;
                if (type.includes('tom') || type === 'floor') key = 'tom';

                const buffer = this.buffers[key];
                if (buffer) {
                    const source = this.audioCtx.createBufferSource();
                    source.buffer = buffer;
                    source.connect(this.audioCtx.destination);
                    source.start(0);
                } else {
                    this.playSynth(type);
                }
            }

            playSynth(type) {
                const t = this.audioCtx.currentTime;
                const osc = this.audioCtx.createOscillator();
                const gain = this.audioCtx.createGain();
                osc.connect(gain);
                gain.connect(this.audioCtx.destination);

                osc.type = 'square';
                osc.frequency.setValueAtTime(200, t);
                osc.frequency.exponentialRampToValueAtTime(0.01, t + 0.1);
                gain.gain.setValueAtTime(0.3, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);

                osc.start(t);
                osc.stop(t + 0.1);
            }

            hitBlock(block) {
                const addedScore = 100 + (this.combo * 10);
                this.score += addedScore;
                this.combo++;
                this.hits++;
                if (this.combo > this.maxCombo) this.maxCombo = this.combo;

                this.showEffectText(`${this.combo} COMBO!`, 'combo-text');
                this.createExplosion(block.position, block.userData.color);

                this.scene.remove(block);
                this.blocks.shift();
                this.createBlock(this.blocks.length);

                this.updateUI();

                if (this.combo % 10 === 0 && this.combo > 0) {
                    this.speakTTS("Excellent!");
                }
            }

            miss() {
                this.combo = 0;
                this.showEffectText("MISS", "miss-text");
                this.updateUI();
            }

            createExplosion(pos, color) {
                for (let i = 0; i < 15; i++) {
                    const geo = new THREE.BoxGeometry(0.3, 0.3, 0.3);
                    const mat = new THREE.MeshBasicMaterial({ color: color });
                    const p = new THREE.Mesh(geo, mat);
                    p.position.copy(pos);
                    p.userData.velocity = new THREE.Vector3(
                        (Math.random() - 0.5) * 0.5,
                        (Math.random() - 0.5) * 0.5 + 0.2,
                        (Math.random() - 0.5) * 0.5
                    );
                    p.userData.life = 1.0;
                    this.scene.add(p);
                    this.particles.push(p);
                }
            }

            showEffectText(text, className) {
                const container = document.getElementById('effect-layer');
                const el = document.createElement('div');
                el.className = `float-text ${className}`;
                el.innerText = text;
                el.style.left = '50%';
                el.style.top = '40%';
                el.style.transform = 'translate(-50%, -50%)';
                container.appendChild(el);
                setTimeout(() => el.remove(), 600);
            }

            async speakTTS(text) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: text }] }],
                            generationConfig: {
                                responseModalities: ["AUDIO"],
                                speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Puck" } } }
                            }
                        })
                    });
                    const result = await response.json();
                    const audioData = result.candidates[0].content.parts[0].inlineData.data;
                    const binary = atob(audioData);
                    const len = binary.length;
                    const bytes = new Uint8Array(len);
                    for (let i = 0; i < len; i++) bytes[i] = binary.charCodeAt(i);
                    const audioBuffer = await this.audioCtx.decodeAudioData(bytes.buffer);
                    const source = this.audioCtx.createBufferSource();
                    source.buffer = audioBuffer;
                    source.connect(this.audioCtx.destination);
                    source.start(0);
                } catch (e) { /* TTS Error ignore */ }
            }

            // --- 게임 로직 ---

            tryStartGame() {
                if (this.audioCtx.state === 'suspended') this.audioCtx.resume();

                if (this.isMidiConnected) {
                    this.startGameSequence();
                } else {
                    document.getElementById('midi-warning-modal').classList.remove('hidden');
                }
            }

            forceStart() {
                document.getElementById('midi-warning-modal').classList.add('hidden');
                this.inputLocked = true;
                this.isAutoPlay = false;
                this.startGameSequence();
            }

            startAutoPlay() {
                document.getElementById('midi-warning-modal').classList.add('hidden');
                this.inputLocked = true;
                this.isAutoPlay = true;
                this.startGameSequence();
            }

            startGameSequence() {
                // 인트로를 즉시 숨겨서 게임 화면 노출
                document.getElementById('intro-screen').classList.add('hidden');
                document.getElementById('result-screen').classList.add('hidden');
                document.getElementById('ui-layer').classList.remove('hidden');

                // 리셋 및 초기 블록 생성
                this.resetGameState();
                this.blocks.forEach(b => this.scene.remove(b));
                this.blocks = [];
                for (let i = 0; i < 6; i++) this.createBlock(i);

                // 강제 렌더링 (블록 즉시 표시)
                this.renderer.render(this.scene, this.camera);

                // 카운트다운
                const effectLayer = document.getElementById('effect-layer');
                let count = 3;

                const tick = () => {
                    if (count > 0) {
                        effectLayer.innerHTML = `<div class="countdown-num">${count}</div>`;
                        this.playSynth('count');
                        count--;
                        setTimeout(tick, 1000);
                    } else {
                        effectLayer.innerHTML = `<div class="countdown-num" style="color:#2ECC40;">GO!</div>`;
                        this.playSynth('go');
                        setTimeout(() => {
                            effectLayer.innerHTML = '';
                            this.isActive = true;
                            this.playBGM();
                            this.runTimer();
                        }, 1000);
                    }
                };
                tick();
            }

            resetGameState() {
                this.score = 0;
                this.combo = 0;
                this.maxCombo = 0;
                this.hits = 0;
                this.attempts = 0;
                this.timeLeft = 60;
                this.updateUI();
            }

            playBGM() {
                if (this.buffers['bgm']) {
                    this.bgmNode = this.audioCtx.createBufferSource();
                    this.bgmNode.buffer = this.buffers['bgm'];
                    this.bgmNode.loop = true;
                    const gainNode = this.audioCtx.createGain();
                    gainNode.gain.value = 0.3;
                    this.bgmNode.connect(gainNode);
                    gainNode.connect(this.audioCtx.destination);
                    this.bgmNode.start(0);
                }
            }

            stopBGM() {
                if (this.bgmNode) {
                    try { this.bgmNode.stop(); } catch (e) { }
                    this.bgmNode = null;
                }
            }

            runTimer() {
                if (this.gameInterval) clearInterval(this.gameInterval);
                this.gameInterval = setInterval(() => {
                    if (this.isPaused) return;
                    this.timeLeft--;
                    this.updateUI();

                    if (this.timeLeft <= 0) {
                        this.gameOver();
                    }
                }, 1000);
            }

            updateUI() {
                document.getElementById('score-display').innerText = this.score;
                document.getElementById('combo-display').innerText = this.combo;
                document.getElementById('timer-display').innerText = this.timeLeft;
            }

            gameOver() {
                this.isActive = false;
                clearInterval(this.gameInterval);
                this.stopBGM();

                document.getElementById('ui-layer').classList.add('hidden');
                document.getElementById('result-screen').classList.remove('hidden');

                document.getElementById('final-score').innerText = this.score;
                document.getElementById('final-combo').innerText = this.maxCombo;
                const acc = this.attempts > 0 ? Math.round((this.hits / this.attempts) * 100) : 0;
                document.getElementById('final-accuracy').innerText = acc + "%";
            }

            animate() {
                requestAnimationFrame(() => this.animate());

                this.decoBlocks.forEach(b => {
                    b.rotation.x += 0.01;
                    b.rotation.y += 0.01;
                });

                if (!this.isActive) return;

                if (this.isAutoPlay && this.blocks.length > 0) {
                    const now = Date.now();
                    if (!this.lastAutoPlayTime) this.lastAutoPlayTime = now - 1500;
                    if (now - this.lastAutoPlayTime >= 1500) {
                        const targetBlock = this.blocks[0];
                        this.inputLocked = false;
                        this.handleInput(targetBlock.userData.drumId);
                        this.inputLocked = true;
                        this.lastAutoPlayTime = now;
                    }
                }

                // 큐브 이동 로직
                const speed = 0.15;
                const zGap = 8.0;
                const ySlope = 0.5;

                this.blocks.forEach((b, idx) => {
                    const targetZ = 3 - (idx * zGap);
                    const targetY = 0.5 + (idx * ySlope);

                    b.position.z += (targetZ - b.position.z) * 0.1;
                    b.position.y += (targetY - b.position.y) * 0.1;

                    b.rotation.x += 0.02;
                    b.rotation.y += 0.02;
                });

                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.position.add(p.userData.velocity);
                    p.userData.velocity.y -= 0.01;
                    p.userData.life -= 0.02;
                    p.scale.setScalar(p.userData.life);
                    if (p.userData.life <= 0) {
                        this.scene.remove(p);
                        this.particles.splice(i, 1);
                    }
                }

                this.renderer.render(this.scene, this.camera);
            }

            resetToIntro() {
                this.stopBGM();
                this.isActive = false;
                if (this.gameInterval) clearInterval(this.gameInterval);
                document.getElementById('result-screen').classList.add('hidden');
                document.getElementById('ui-layer').classList.add('hidden');
                document.getElementById('intro-screen').classList.remove('hidden');
                this.inputLocked = false;
            }

            restartInstant() {
                this.tryStartGame();
            }

            quitApp() {
                window.history.back();
            }
        }

        const game = new DrumGame();

    </script>
