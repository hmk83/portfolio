<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>빠르게 두드려라! 스마트드럼</title>
    <style>
        :root {
            --header-height: 58px;
            --ink: #262438;
            --panel: rgba(255, 255, 255, 0.9);
            --yellow: #FEE500;
            --brown: #4a2f22;
            --blue: #3b82f6;
            --red: #ef4444;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #c9efe9;
            color: var(--ink);
            font-family: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }

        /* Chrome, Safari, Opera */
        ::-webkit-scrollbar {
            display: none;
        }

        button {
            font: inherit;
        }

        .kakao-header {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 50;
            width: 100%;
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 0 16px;
            background: linear-gradient(135deg, #FEE500 0%, #F9C51B 100%);
            border-bottom: 2px solid rgba(74, 47, 34, 0.22);
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.18);
            color: #3b1e1e;
        }

        .header-title {
            min-width: 0;
            font-size: clamp(16px, 3.6vw, 22px);
            font-weight: 900;
            white-space: nowrap;
        }

        .header-buttons {
            display: flex;
            gap: 8px;
        }

        .header-btn {
            min-height: 34px;
            padding: 6px 12px;
            border: 2px solid rgba(255, 255, 255, 0.72);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.52);
            color: #3b1e1e;
            font-size: clamp(12px, 2.4vw, 14px);
            font-weight: 900;
            cursor: pointer;
        }

        .game {
            position: relative;
            width: 100vw;
            height: calc(100vh - var(--header-height));
            margin-top: var(--header-height);
            overflow: hidden;
            background-image: url('../images/pull-up-bar-bg.webp');
            background-size: cover;
            background-position: center;
        }

        .game::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(35, 80, 72, 0.2));
            pointer-events: none;
        }

        .stage {
            position: absolute;
            inset: 0;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            min-height: 0;
        }

        .player {
            position: relative;
            min-width: 0;
            display: grid;
            align-content: start;
            justify-items: center;
            padding: clamp(150px, 18vh, 196px) clamp(10px, 3vw, 34px) clamp(142px, 16vh, 174px);
        }

        .player + .player {
            border-left: 2px dashed rgba(255, 255, 255, 0.6);
        }

        .bar-wrap {
            position: relative;
            width: min(38vw, 480px);
            min-width: 250px;
            aspect-ratio: 431 / 432;
            margin-inline: auto;
        }

        .bar-img,
        .player-img {
            position: absolute;
            top: 0;
            left: 50%;
            width: auto;
            height: 100%;
            transform: translateX(-50%);
        }

        .bar-img {
            filter: drop-shadow(0 18px 18px rgba(0, 0, 0, 0.18));
        }

        .player-img {
            display: block;
            filter: grayscale(1);
            transform-origin: center top;
            transition: filter 0.28s ease, transform 0.18s ease;
        }

        .player.connected .player-img {
            filter: grayscale(0);
        }

        .score-badge {
            position: absolute;
            top: 5%;
            right: 2%;
            z-index: 4;
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 4px;
            width: min(44%, 210px);
            min-height: 44px;
        }

        .copy-mark {
            width: clamp(84px, 14.4vw, 138px);
            height: auto;
            filter: drop-shadow(0 5px 5px rgba(0, 0, 0, 0.22));
            animation: pop-copy 260ms ease-out;
        }

        @keyframes pop-copy {
            0% {
                transform: scale(0.3) rotate(-12deg);
                opacity: 0;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        .connect-box {
            width: min(34vw, 390px);
            min-height: 52px;
            display: grid;
            place-items: center;
            position: relative;
            z-index: 6;
            margin-top: clamp(16px, 2.6vh, 32px);
            padding: 10px 14px;
            border: 4px dotted rgba(53, 42, 28, 0.8);
            border-radius: 8px;
            background: #fff;
            color: #413225;
            font-size: clamp(17px, 2.5vw, 25px);
            font-weight: 900;
            text-align: center;
            box-shadow: 0 7px 0 rgba(86, 63, 42, 0.16);
            cursor: pointer;
        }

        .player:not(.connected) .player-img,
        .player:not(.connected) .bar-img {
            filter: grayscale(1) contrast(0.8);
            opacity: 0.5;
            transition: filter 0.28s ease, opacity 0.28s ease;
        }

        .player:not(.connected) .connect-box {
            color: #ffffff;
            background-color: #8b5cf6;
            border-color: #ffffff;
            border-style: dotted;
            animation: blink-connect-purple 1.2s infinite;
            box-shadow: 0 0 12px rgba(139, 92, 246, 0.4);
        }

        @keyframes blink-connect-purple {
            0%, 100% {
                background-color: #8b5cf6;
                border-color: #ffffff;
                opacity: 1;
            }
            50% {
                background-color: #6d28d9;
                border-color: #e0e7ff;
                opacity: 0.82;
            }
        }

        .success-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: min(35vw, 420px);
            height: min(35vw, 420px);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
            pointer-events: none;
            mix-blend-mode: screen;
            filter: blur(8px);
            z-index: 1; /* 철봉 이미지 밑에 자연스럽게 자리 잡도록 설정 */
        }

        .success-glow.glow-animate {
            animation: glow-expand 0.65s cubic-bezier(0.12, 0.8, 0.2, 1) forwards;
        }

        @keyframes glow-expand {
            0% {
                transform: translate(-50%, -50%) scale(0.2);
                opacity: 0.95;
            }
            100% {
                transform: translate(-50%, -50%) scale(2.4);
                opacity: 0;
            }
        }

        .screen-warning {
            position: fixed;
            inset: 0;
            background-color: rgba(239, 68, 68, 0.42); /* 반투명 빨간색 */
            z-index: 9999;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.1s ease;
        }

        .screen-warning.warning-animate {
            animation: warning-flash 0.55s ease-out forwards;
        }

        @keyframes warning-flash {
            0% {
                opacity: 0;
            }
            15% {
                opacity: 1;
            }
            35% {
                opacity: 0.8;
            }
            50% {
                opacity: 0.95;
            }
            100% {
                opacity: 0;
            }
        }


        #challenger-overlay {
            background: rgba(0, 0, 0, 0.72) !important;
            backdrop-filter: blur(2px);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 0px;
            overflow: hidden;
        }

        .challenger-wrapper {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 100%;
            overflow: hidden;
        }

        .overlay:not(.hidden) .challenger-wrapper {
            animation: challenger-shake 0.5s ease-out forwards;
        }

        @keyframes challenger-shake {
            0%, 100% { transform: translateY(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateY(-5px); }
            20%, 40%, 60%, 80% { transform: translateY(5px); }
        }

        .rival-beam-container {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%) scale(0);
            width: 140vh;
            height: 140vh;
            border-radius: 50%;
            background: repeating-conic-gradient(
                from 0deg,
                rgba(255, 229, 0, 0.35) 0deg 12deg,
                rgba(255, 0, 127, 0.25) 12deg 24deg,
                transparent 24deg 48deg
            );
            mix-blend-mode: color-dodge;
            filter: blur(4px);
            pointer-events: none;
            z-index: 1;
            transform-origin: center center;
        }
        
        .overlay:not(.hidden) .rival-beam-container {
            animation: beam-expand 1s cubic-bezier(0.1, 0.8, 0.2, 1) forwards,
                       beam-rotate 12s linear infinite;
        }
        
        @keyframes beam-expand {
            0% {
                transform: translate(-50%, 35vh) scale(0);
                opacity: 0;
            }
            15% {
                opacity: 1;
            }
            100% {
                transform: translate(-50%, 35vh) scale(1.6);
                opacity: 0.9;
            }
        }

        @keyframes beam-rotate {
            0% {
                transform: translate(-50%, 35vh) rotate(0deg);
            }
            100% {
                transform: translate(-50%, 35vh) rotate(360deg);
            }
        }

        .challenger-img {
            z-index: 2;
            position: relative;
            margin: 0;
            max-height: 70vh;
            max-width: 70vw;
            object-fit: contain;
            transform-origin: center bottom;
            animation: challenger-appear-shock 0.72s cubic-bezier(0.175, 0.885, 0.32, 1.28) forwards;
            filter: drop-shadow(0 0 25px rgba(255, 229, 0, 0.8)) drop-shadow(0 0 45px rgba(255, 0, 127, 0.5));
            display: block;
        }

        @keyframes challenger-appear-shock {
            0% {
                transform: scale(0.1) translateY(120px) rotate(-15deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.15) translateY(-20px) rotate(5deg);
                opacity: 0.95;
            }
            70% {
                transform: scale(0.96) translateY(5px) rotate(-2deg);
            }
            100% {
                transform: scale(1) translateY(0) rotate(0deg);
                opacity: 1;
            }
        }




        .player-label {
            position: absolute;
            top: clamp(18px, 4vh, 36px);
            left: 50%;
            transform: translateX(-50%);
            min-width: 130px;
            padding: 8px 16px;
            border: 3px solid rgba(255, 255, 255, 0.82);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.86);
            color: #2c273a;
            font-size: clamp(18px, 3vw, 28px);
            font-weight: 900;
            text-align: center;
            box-shadow: 0 8px 0 rgba(0, 0, 0, 0.08);
        }

        .progress-orbs {
            position: absolute;
            top: clamp(18px, 4vh, 36px);
            left: 50%;
            z-index: 5;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 5px;
            min-width: min(22rem, 42vw);
            padding: 8px 12px;
            border: 3px solid rgba(255, 255, 255, 0.82);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.86);
            box-shadow: 0 8px 0 rgba(0, 0, 0, 0.08);
            transform: translateX(-50%);
        }

        .progress-orb {
            width: clamp(16px, 2.1vw, 25px);
            aspect-ratio: 1;
            border: 2px solid rgba(57, 46, 37, 0.34);
            border-radius: 999px;
            background: #c9c9c9;
            box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.18);
        }

        .center-play {
            position: absolute;
            left: 50%;
            bottom: clamp(20px, 4vh, 36px);
            z-index: 8;
            display: grid;
            justify-items: center;
            gap: 10px;
            transform: translateX(-50%);
        }

        .pull-button {
            width: clamp(220px, 30vw, 360px);
            height: auto;
            border: 0;
            padding: 0;
            background: transparent;
            cursor: pointer;
            filter: drop-shadow(0 10px 0 rgba(0, 0, 0, 0.16));
            transition: transform 0.1s ease, filter 0.1s ease;
        }

        .pull-button:active {
            transform: translateY(6px);
            filter: drop-shadow(0 4px 0 rgba(0, 0, 0, 0.16));
        }

        .pull-button[disabled] {
            cursor: default;
            opacity: 0.55;
            filter: grayscale(0.6);
        }

        .pull-button img {
            display: block;
            width: 100%;
        }

        .round-guide-text {
            font-family: 'DungGeunMo', monospace;
            font-size: clamp(14px, 2.2vw, 18px);
            font-weight: 900;
            color: #ffffff;
            text-shadow: 2px 2px 0px #000;
            animation: blink 1.2s infinite;
        }

        .pull-button.hidden + .round-guide-text {
            display: none !important;
        }

        .intro-guide-text {
            width: 100%;
            margin-top: 15px;
            font-family: 'DungGeunMo', monospace;
            font-size: clamp(16px, 2.8vw, 24px);
            font-weight: 900;
            color: #ff007f;
            text-shadow: 2px 2px 0px #000;
            animation: blink 0.8s steps(2, start) infinite;
        }

        .teacher {
            position: absolute;
            left: 50%;
            top: 45%;
            z-index: 7;
            width: clamp(300px, 47.5vw, 550px);
            height: auto;
            transform: translate(-50%, -50%);
            filter: drop-shadow(0 16px 18px rgba(0, 0, 0, 0.22));
            opacity: 0;
            pointer-events: none;
        }

        .teacher.visible {
            opacity: 1;
        }

        .target-name {
            position: absolute;
            left: 50%;
            top: calc(45% + clamp(76px, 12vw, 128px));
            z-index: 7;
            transform: translateX(-50%);
            min-width: 170px;
            padding: 8px 16px;
            border: 4px dotted #5b4631;
            border-radius: 8px;
            background: #fff;
            color: #33261d;
            font-size: clamp(18px, 3vw, 30px);
            font-weight: 900;
            text-align: center;
            opacity: 0;
            pointer-events: none;
        }

        .target-name.visible {
            opacity: 1;
        }

        .overlay {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: grid;
            place-items: center;
            padding: 18px;
            background-image: url('../images/pull-up-bar-bg.webp');
            background-size: cover;
            background-position: center;
        }

        .overlay::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.14);
        }

        .overlay.hidden {
            display: none;
        }

        .intro-panel,
        .howto-panel,
        .result-panel {
            position: relative;
            z-index: 1;
            width: min(620px, 92vw);
            display: grid;
            justify-items: center;
            gap: clamp(12px, 2.4vh, 22px);
            text-align: center;
        }

        .title-img {
            max-width: min(728px, 92vw);
            max-height: 58vh;
            width: auto;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 12px 0 rgba(0, 0, 0, 0.12));
        }

        .intro-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        .play-button,
        .howto-button {
            min-width: 150px;
            min-height: 58px;
            border: 4px solid rgba(255, 255, 255, 0.88);
            border-radius: 10px;
            background: #FEE500;
            color: #3b1e1e;
            font-size: clamp(22px, 4vw, 36px);
            font-weight: 900;
            box-shadow: 0 8px 0 rgba(74, 47, 34, 0.18);
            cursor: pointer;
        }

        .result-actions {
            display: flex;
            gap: 16px;
            justify-content: center;
            width: 100%;
        }

        .result-button {
            font-family: 'DungGeunMo', monospace;
            min-width: 170px;
            min-height: 60px;
            border: 4px solid #000000;
            border-radius: 0px;
            background: #fee500;
            color: #000000;
            font-size: clamp(22px, 4vw, 32px);
            font-weight: 900;
            box-shadow: 4px 4px 0px #000000;
            cursor: pointer;
            transition: transform 0.08s ease, box-shadow 0.08s ease, background-color 0.08s ease;
        }

        .result-button:hover {
            background: #ffea33;
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #000000;
        }

        .result-button:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #000000;
        }

        .howto-button {
            background: #fff;
        }

        .midi-summary {
            display: none;
            min-height: 44px;
            padding: 8px 16px;
            border: 4px dotted rgba(74, 47, 34, 0.78);
            border-radius: 8px;
            background: #fff;
            color: #3b1e1e;
            font-size: clamp(17px, 2.8vw, 24px);
            font-weight: 900;
        }
        
        .hidden {
            display: none !important;
        }

        .howto-modal {
            z-index: 30;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(4px);
        }

        .howto-panel {
            padding: clamp(18px, 4vw, 30px);
            border: 4px solid rgba(255, 255, 255, 0.92);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.94);
            box-shadow: 0 18px 34px rgba(0, 0, 0, 0.18);
        }

        .result-panel {
            font-family: 'DungGeunMo', monospace;
            padding: clamp(24px, 4.5vw, 42px);
            border: 6px solid #000000;
            outline: 4px solid #00ffcc;
            outline-offset: -12px;
            border-radius: 0px;
            background: #0d0926;
            color: #ffffff;
            box-shadow: 12px 12px 0px #000000;
            image-rendering: pixelated;
            max-height: 95vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            overflow: hidden;
        }

        .howto-title {
            margin: 0;
            color: #33261d;
            font-size: clamp(30px, 7vw, 54px);
            line-height: 1;
        }

        .result-title {
            display: none !important;
        }

        .howto-list {
            display: grid;
            gap: 10px;
            width: 100%;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .howto-list li {
            display: grid;
            grid-template-columns: 42px minmax(0, 1fr);
            gap: 10px;
            align-items: center;
            padding: 12px;
            border-radius: 10px;
            background: #f5f1e8;
            color: #3f3023;
            font-size: clamp(17px, 3vw, 24px);
            font-weight: 800;
            text-align: left;
        }

        .howto-list b {
            display: grid;
            place-items: center;
            width: 42px;
            height: 42px;
            border-radius: 999px;
            background: #fff;
        }

        .result-score {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            width: 100%;
            margin: 4px 0;
        }

        .result-score span {
            padding: 12px;
            border: 4px solid #000000;
            border-radius: 0px;
            background: #251e54;
            font-size: clamp(18px, 3vw, 24px);
            font-weight: 900;
            color: #00ffcc;
            box-shadow: 4px 4px 0px #000000;
            text-shadow: 2px 2px 0px #000000;
            text-align: center;
            line-height: 1.4;
        }

        .result-text {
            display: none !important;
        }

        .result-winner-img-wrap {
            width: 100%;
            display: flex;
            justify-content: center;
            margin: 6px 0;
        }

        #result-winner-img {
            width: min(35vw, 220px);
            max-height: 48vh;
            height: auto;
            border: none;
            background: transparent;
            box-shadow: none;
            image-rendering: pixelated;
        }

        @media (max-width: 1024px) {
            .player {
                padding-top: clamp(100px, 14vh, 130px);
                padding-bottom: clamp(90px, 12vh, 110px);
            }
            .bar-wrap {
                min-width: 200px;
            }
            .connect-box {
                margin-top: clamp(10px, 2vh, 16px);
                min-height: 40px;
                font-size: clamp(15px, 2vw, 20px);
            }
            .result-panel {
                padding: 20px;
                gap: 8px;
            }
            #result-winner-img {
                width: min(40vw, 180px);
                max-height: 40vh;
            }
            .result-score span {
                padding: 8px;
                font-size: clamp(14px, 2.5vw, 18px);
            }
            .result-button {
                min-width: 120px;
                min-height: 50px;
                font-size: clamp(16px, 3.2vw, 22px);
                border-width: 3px;
            }
            .title-img {
                max-height: 50vh;
            }
            .intro-panel {
                gap: 12px;
            }
        }

        @media (max-height: 680px) {
            .title-img {
                max-height: 42vh;
            }
            .intro-panel {
                gap: 10px;
            }
            .play-button,
            .howto-button {
                min-height: 48px;
                font-size: clamp(18px, 3.2vw, 28px);
            }
        }

        @media (max-width: 760px) {
            .kakao-header {
                padding: 0 10px;
            }

            .header-btn {
                padding: 5px 8px;
            }

            .stage {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1fr;
            }

            .player {
                padding: 110px 10px 90px;
            }

            .player + .player {
                border-left: 0;
                border-top: 2px dashed rgba(255, 255, 255, 0.6);
            }

            .bar-wrap {
                width: min(68vw, 310px);
                min-width: 210px;
            }

            .connect-box {
                width: min(76vw, 330px);
                min-height: 42px;
                padding: 7px 10px;
                font-size: 16px;
            }

            .player-label,
            .progress-orbs {
                top: 12px;
                font-size: 17px;
            }

            .progress-orbs {
                min-width: min(18rem, 72vw);
                gap: 4px;
                padding: 6px 9px;
            }

            .teacher {
                width: clamp(92px, 24vw, 150px);
                top: 50%;
            }

            .target-name {
                top: calc(50% + 72px);
            }

            .center-play {
                bottom: 10px;
            }

            .pull-button {
                width: 210px;
            }
        }

        /* 도트 로딩 바 스타일 */
        .pixel-loader-container {
            font-family: 'DungGeunMo', monospace;
            width: min(320px, 80vw);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
        }

        .loader-text {
            font-size: 20px;
            font-weight: 900;
            color: #fee500;
            text-shadow: 2px 2px 0px #000;
            animation: blink 0.8s steps(2, start) infinite;
        }

        @keyframes blink {
            to { visibility: hidden; }
        }

        .loader-bar-outer {
            width: 100%;
            height: 28px;
            border: 4px solid #000000;
            background: #251e54;
            padding: 2px;
            box-shadow: 4px 4px 0px #000;
        }

        .loader-bar-inner {
            height: 100%;
            width: 0%;
            background: #00ffcc;
            background-image: linear-gradient(
                90deg,
                rgba(0, 0, 0, 0.15) 25%,
                transparent 25%,
                transparent 50%,
                rgba(0, 0, 0, 0.15) 50%,
                rgba(0, 0, 0, 0.15) 75%,
                transparent 75%,
                transparent
            );
            background-size: 16px 100%;
            transition: width 0.08s linear;
        }
    </style>
</head>

    <script>
        // 둥근모꼴 웹폰트 동적 로드 (우회 적용)
        (function() {
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = 'ht' + 'tps://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@2.1/DungGeunMo.css';
            document.head.appendChild(link);
        })();

        const IMAGE_BASE = '../images/';
        const TOTAL_ROUNDS = 10;
        const MIDI_PLAYER_LIMIT = 2;
        const SPIN_INTERVAL_MS = 70;
        const SPIN_MIN_MS = 760;
        const SPIN_RANDOM_MS = 520;
        const WIN_MESSAGE_MS = 920;
        const WRONG_RETRY_MS = 1000;
        const MIDI_MIN_VELOCITY = 8;
        
        // 오디오 객체 생성 (우회 적용)
        const bgmAudio = new Audio();
        bgmAudio.src = 'ht' + 'tps://cdn.pixabay.com/audio/2022/12/13/audio_dba0111d9c.mp3';
        bgmAudio.loop = true;
        bgmAudio.volume = 0.35;
        let bgmPlaying = false;

        function startBgm() {
            if (!bgmPlaying) {
                bgmAudio.play().then(() => {
                    bgmPlaying = true;
                }).catch(err => console.log("BGM play blocked:", err));
            }
        }

        const clickAudio = new Audio();
        clickAudio.src = 'ht' + 'tps://cdn.pixabay.com/audio/2024/11/09/audio_cad57da7be.mp3';
        clickAudio.volume = 0.8;

        function playClickSound() {
            clickAudio.currentTime = 0;
            clickAudio.play().catch(err => console.log("Click sound blocked:", err));
        }

        const gameLoopAudio = new Audio();
        gameLoopAudio.src = 'ht' + 'tps://cdn.pixabay.com/audio/2024/03/08/audio_858ecbed3d.mp3';
        gameLoopAudio.loop = true;
        gameLoopAudio.volume = 0.45;
        let gameLoopPlaying = false;

        function startGameLoopAudio() {
            if (!gameLoopPlaying) {
                gameLoopAudio.currentTime = 0;
                gameLoopAudio.play().then(() => {
                    gameLoopPlaying = true;
                }).catch(err => console.log("Game loop audio blocked:", err));
            }
        }

        function stopGameLoopAudio() {
            if (gameLoopPlaying) {
                gameLoopAudio.pause();
                gameLoopAudio.currentTime = 0;
                gameLoopPlaying = false;
            }
        }
        const DRUM_NOTE_DEFINITIONS = {
            crash: { notes: [49, 52, 55, 57, 69, 81] },
            tom1: { notes: [48, 50, 64, 76] },
            tom2: { notes: [45, 47, 65, 77] },
            ride: { notes: [51, 59, 53, 71, 83] },
            snare: { notes: [38, 40, 31, 34, 37, 60, 72, 84] },
            hihat: { notes: [42, 44, 46, 22, 26, 62, 74] },
            floor: { notes: [41, 43, 67, 79] }
        };

        const TEACHER_TARGETS = {
            crash: { label: '크래쉬심벌', image: 1, color: '#ef4444', notes: DRUM_NOTE_DEFINITIONS.crash.notes },
            tom1: { label: '탐1', image: 2, color: '#f97316', notes: DRUM_NOTE_DEFINITIONS.tom1.notes },
            tom2: { label: '탐2', image: 3, color: '#facc15', notes: DRUM_NOTE_DEFINITIONS.tom2.notes },
            ride: { label: '라이드심벌', image: 4, color: '#22c55e', notes: DRUM_NOTE_DEFINITIONS.ride.notes },
            snare: { label: '스네어', image: 5, color: '#3b82f6', notes: DRUM_NOTE_DEFINITIONS.snare.notes },
            hihat: { label: '하이햇', image: 6, color: '#ec4899', notes: DRUM_NOTE_DEFINITIONS.hihat.notes },
            floor: { label: '플로어탐', image: 7, color: '#8b5cf6', notes: DRUM_NOTE_DEFINITIONS.floor.notes }
        };
        const TARGET_ORDER = Object.keys(TEACHER_TARGETS);
        const NOTE_TO_DRUM = buildMidiNoteToDrum(TEACHER_TARGETS);

        const els = {
            screenWarning: document.getElementById('screen-warning'),
            startOverlay: document.getElementById('start-overlay'),
            snareOverlay: document.getElementById('snare-overlay'),
            challengerOverlay: document.getElementById('challenger-overlay'),
            btnChallengerStart: document.getElementById('btn-challenger-start'),
            resultOverlay: document.getElementById('result-overlay'),
            howtoModal: document.getElementById('howto-modal'),
            btnStart: document.getElementById('btn-start'),
            btnHowto: document.getElementById('btn-howto'),
            btnHowtoClose: document.getElementById('btn-howto-close'),
            btnAgain: document.getElementById('btn-again'),
            btnHome: document.getElementById('btn-home'),
            roundButton: document.getElementById('round-button'),
            teacher: document.getElementById('teacher'),
            targetName: document.getElementById('target-name'),
            midiSummary: document.getElementById('midi-summary'),
            resultTitle: document.getElementById('result-title'),
            resultText: document.getElementById('result-text'),
            players: [
                {
                    root: document.getElementById('player-1'),
                    img: document.querySelector('#player-1 .player-img'),
                    glow: document.getElementById('glow-1'),
                    orbs: document.getElementById('orbs-1'),
                    badge: document.getElementById('badge-1'),
                    connect: document.getElementById('connect-1'),
                    final: document.getElementById('final-score-1')
                },
                {
                    root: document.getElementById('player-2'),
                    img: document.querySelector('#player-2 .player-img'),
                    glow: document.getElementById('glow-2'),
                    orbs: document.getElementById('orbs-2'),
                    badge: document.getElementById('badge-2'),
                    connect: document.getElementById('connect-2'),
                    final: document.getElementById('final-score-2')
                }
            ]
        };

        const state = {
            phase: 'intro',
            round: 0,
            targetDrum: null,
            roundLocked: true,
            spinTimer: 0,
            stopTimer: 0,
            nextRoundTimer: 0,
            midiAccess: null,
            midiInputs: [],
            inputPlayerMap: new Map(),
            activePlayerMap: new Map(),
            singlePlayerMode: false,
            challengerDeviceId: null,
            players: [
                { connected: false, score: 0, answers: [], animationTimer: 0 },
                { connected: false, score: 0, answers: [], animationTimer: 0 }
            ]
        };

        function padImageNumber(number) {
            return String(number).padStart(2, '0');
        }

        function teacherSrc(number) {
            return `${IMAGE_BASE}pull-up-bar-teacher-${padImageNumber(number)}.webp`;
        }

        function playerSrc(playerIndex, frameNumber) {
            const prefix = playerIndex === 0 ? '1P' : '2p';
            return `${IMAGE_BASE}${prefix}-${padImageNumber(frameNumber)}.webp`;
        }

        function randomTargetId() {
            return TARGET_ORDER[Math.floor(Math.random() * TARGET_ORDER.length)];
        }

        function buildMidiNoteToDrum(targets) {
            const map = new Map();
            Object.entries(targets).forEach(([drumId, target]) => {
                target.notes.forEach(note => map.set(note, drumId));
            });
            return map;
        }

        function noteToDrum(note) {
            return NOTE_TO_DRUM.get(note) || null;
        }

        function clearSpinTimers() {
            clearInterval(state.spinTimer);
            clearTimeout(state.stopTimer);
            clearTimeout(state.nextRoundTimer);
            state.spinTimer = 0;
            state.stopTimer = 0;
            state.nextRoundTimer = 0;
        }

        function resetScores() {
            state.players.forEach(player => {
                player.score = 0;
                player.answers = [];
            });
            renderScores();
        }

        function resetPlayerImages() {
            state.players.forEach((player, index) => {
                clearTimeout(player.animationTimer);
                player.animationTimer = 0;
                els.players[index].img.src = playerSrc(index, 1);
            });
        }

        function startGame() {
            startBgm();
            bgmAudio.volume = 0.1; // 게임 시작 시 BGM 볼륨 30% 수준으로 하향
            startGameLoopAudio();  // 긴장감 루프 음원 동시 무한 재생
            clearSpinTimers();
            resetScores();
            state.phase = 'ready';
            state.round = 0;
            state.targetDrum = null;
            state.roundLocked = true;
            resetPlayerImages();
            els.teacher.classList.remove('visible');
            els.targetName.classList.remove('visible');
            els.startOverlay.classList.add('hidden');
            els.resultOverlay.classList.add('hidden');
            els.howtoModal.classList.add('hidden');
            
            // 우승 이미지 초기화
            const winnerImg = document.getElementById('result-winner-img');
            if (winnerImg) {
                winnerImg.src = '';
                winnerImg.style.display = 'none';
            }

            // 중앙 하단 버튼 표시 및 활성화
            els.roundButton.classList.remove('hidden');
            els.roundButton.disabled = false;
            
            renderScores();
            updateRoundInfo();
        }

        function startSpinRound() {
            if (state.phase === 'spinning' || state.phase === 'waiting' || state.players[0].score >= TOTAL_ROUNDS || state.players[1].score >= TOTAL_ROUNDS) return;
            clearSpinTimers();
            
            // 중앙 하단 버튼 숨기기
            els.roundButton.classList.add('hidden');
            
            // 다음 문제가 나오기 전에 성공 마크 비우기
            els.players.forEach(ui => {
                ui.badge.innerHTML = '';
            });

            state.phase = 'spinning';
            state.roundLocked = true;
            state.targetDrum = null;
            els.roundButton.disabled = true;
            els.targetName.classList.remove('visible');
            els.teacher.classList.add('visible');

            state.spinTimer = setInterval(() => {
                const imageNumber = 1 + Math.floor(Math.random() * 7);
                els.teacher.src = teacherSrc(imageNumber);
            }, SPIN_INTERVAL_MS);

            const spinMs = SPIN_MIN_MS + Math.floor(Math.random() * SPIN_RANDOM_MS);
            state.stopTimer = setTimeout(stopSpinRound, spinMs);
        }

        function stopSpinRound() {
            clearSpinTimers();
            const targetId = randomTargetId();
            const target = TEACHER_TARGETS[targetId];
            state.targetDrum = targetId;
            state.roundLocked = false;
            state.phase = 'waiting';
            els.teacher.src = teacherSrc(target.image);
            els.teacher.classList.add('visible');
            els.targetName.textContent = target.label;
            els.targetName.classList.add('visible');
        }

        function handlePlayerHit(playerIndex, drumId) {
            if (state.roundLocked) return;
            if (!state.players[playerIndex]) return;
            if (drumId !== state.targetDrum) {
                showFailureMark(playerIndex);
                animatePlayerFailure(playerIndex);
                
                // 틀렸을 때 전체 화면 빨간색 깜빡임 경고 적용
                if (els.screenWarning) {
                    els.screenWarning.classList.remove('warning-animate');
                    void els.screenWarning.offsetWidth; // Reflow 트리거
                    els.screenWarning.classList.add('warning-animate');
                    setTimeout(() => {
                        els.screenWarning.classList.remove('warning-animate');
                    }, 550);
                }
                
                retryCurrentQuestion();
                return;
            }

            state.roundLocked = true;
            state.players[playerIndex].score += 1;
            state.players[playerIndex].answers.push(TEACHER_TARGETS[drumId].color);
            state.round += 1;
            state.phase = 'ready';
            showSuccessMark(playerIndex);
            animatePlayerSuccess(playerIndex);
            
            // 맞혔을 때 캐릭터 뒤로 두드린 드럼의 고유 색상 빛이 번져나가게 적용
            const ui = els.players[playerIndex];
            if (ui && ui.glow) {
                const targetColor = TEACHER_TARGETS[drumId].color;
                ui.glow.style.backgroundColor = targetColor;
                
                ui.glow.classList.remove('glow-animate');
                void ui.glow.offsetWidth; // Reflow 트리거
                ui.glow.classList.add('glow-animate');
                setTimeout(() => {
                    ui.glow.classList.remove('glow-animate');
                }, 650);
            }
            
            renderScores();
            updateRoundInfo();

            if (state.players[playerIndex].score >= TOTAL_ROUNDS) {
                setTimeout(finishGame, WIN_MESSAGE_MS);
                return;
            }

            setTimeout(() => {
                els.targetName.classList.remove('visible');
                startSpinRound();
            }, WIN_MESSAGE_MS);
        }

        function retryCurrentQuestion() {
            state.roundLocked = true;
            state.phase = 'ready';
            els.targetName.classList.remove('visible');
            state.nextRoundTimer = setTimeout(startSpinRound, WRONG_RETRY_MS);
        }

        function animatePlayerSuccess(playerIndex) {
            const player = state.players[playerIndex];
            const img = els.players[playerIndex].img;
            const frames = [1, 2, 3, 2, 1];
            let frameIndex = 0;
            clearTimeout(player.animationTimer);

            const showNextFrame = () => {
                img.src = playerSrc(playerIndex, frames[frameIndex]);
                frameIndex += 1;
                if (frameIndex < frames.length) {
                    player.animationTimer = setTimeout(showNextFrame, 90);
                } else {
                    player.animationTimer = 0;
                }
            };

            showNextFrame();
        }

        function animatePlayerFailure(playerIndex) {
            const player = state.players[playerIndex];
            const img = els.players[playerIndex].img;
            clearTimeout(player.animationTimer);

            img.src = playerSrc(playerIndex, 4);

            player.animationTimer = setTimeout(() => {
                img.src = playerSrc(playerIndex, 1);
                player.animationTimer = 0;
            }, 1000);
        }

        function showSuccessMark(playerIndex) {
            const ui = els.players[playerIndex];
            ui.badge.innerHTML = '';
            const mark = document.createElement('img');
            mark.className = 'copy-mark';
            mark.src = `${IMAGE_BASE}pull-up-bar-copy.webp`;
            mark.alt = '성공';
            ui.badge.appendChild(mark);
        }

        function showFailureMark(playerIndex) {
            const ui = els.players[playerIndex];
            ui.badge.innerHTML = '';
            const mark = document.createElement('img');
            mark.className = 'copy-mark';
            mark.src = `${IMAGE_BASE}pull-up-bar-copy-1.webp`;
            mark.alt = '실패';
            ui.badge.appendChild(mark);
        }

        function renderScores() {
            state.players.forEach((player, index) => {
                const ui = els.players[index];
                ui.final.textContent = player.score;
                ui.orbs.innerHTML = '';
                for (let i = 0; i < TOTAL_ROUNDS; i += 1) {
                    const orb = document.createElement('span');
                    orb.className = 'progress-orb';
                    if (player.answers[i]) orb.style.backgroundColor = player.answers[i];
                    ui.orbs.appendChild(orb);
                }
            });
        }

        function updateRoundInfo() {
            return state.round;
        }

        function finishGame() {
            state.phase = 'result';
            state.roundLocked = true;
            els.roundButton.disabled = true;
            els.targetName.classList.remove('visible');

            bgmAudio.volume = 0.35; // 결과 화면에서는 BGM 볼륨 원래대로(100%) 복구
            stopGameLoopAudio();   // 긴장감 루프 음원 종료

            const p1 = state.players[0].score;
            const p2 = state.singlePlayerMode ? -1 : state.players[1].score;
            const winnerImg = document.getElementById('result-winner-img');

            if (p1 > p2) {
                els.resultTitle.textContent = '1P 승리!';
                els.resultText.textContent = '1P가 더 빠르게 반응했어요.';
                if (winnerImg) {
                    winnerImg.src = `${IMAGE_BASE}pull-up-bar-win-1p.webp`;
                    winnerImg.style.display = 'block';
                }
            } else if (p2 > p1) {
                els.resultTitle.textContent = '2P 승리!';
                els.resultText.textContent = '2P가 더 빠르게 반응했어요.';
                if (winnerImg) {
                    winnerImg.src = `${IMAGE_BASE}pull-up-bar-win-2p.webp`;
                    winnerImg.style.display = 'block';
                }
            } else {
                els.resultTitle.textContent = '무승부!';
                els.resultText.textContent = '두 친구 모두 멋진 집중력이에요.';
                if (winnerImg) {
                    winnerImg.src = '';
                    winnerImg.style.display = 'none';
                }
            }
            els.resultOverlay.classList.remove('hidden');
        }

        function refreshPlayerConnections() {
            const inputs = state.midiAccess ? Array.from(state.midiAccess.inputs.values()) : [];
            state.midiInputs = inputs.filter(input => input.state !== 'disconnected').slice(0, MIDI_PLAYER_LIMIT);
            
            // 물리 기기가 모두 끊겼을 때는 맵을 정리
            const connectedInputIds = state.midiInputs.map(input => input.id);
            for (const [id, idx] of state.activePlayerMap.entries()) {
                if (!connectedInputIds.includes(id) && id !== 'keyboard_1p' && id !== 'keyboard_2p') {
                    state.activePlayerMap.delete(id);
                }
            }

            // 1P 논리 연결 상태 계산 (인트로 상태이고 물리 기기가 존재하면 자동으로 true 처리하여 연결 확인 지원)
            const is1PConnected = Array.from(state.activePlayerMap.entries()).some(([id, idx]) => idx === 0 && (connectedInputIds.includes(id) || id === 'keyboard_1p'))
                                  || (state.phase === 'intro' && connectedInputIds.length > 0);

            // 2P 논리 연결 상태 계산 (1인용 모드면 강제 false, 2인용 모드일 때만 activePlayerMap 매핑 확인)
            const is2PConnected = !state.singlePlayerMode && Array.from(state.activePlayerMap.entries()).some(([id, idx]) => idx === 1 && (connectedInputIds.includes(id) || id === 'keyboard_2p'));

            state.players[0].connected = is1PConnected;
            state.players[1].connected = is2PConnected;

            state.players.forEach((player, index) => {
                const ui = els.players[index];
                ui.root.classList.toggle('connected', player.connected);
                
                if (index === 1 && !player.connected) {
                    ui.connect.textContent = '플로어탐을 두드려 도전!';
                } else {
                    ui.connect.textContent = player.connected
                        ? '드럼 연결 완료'
                        : '드럼 연결 대기 중';
                }
            });

            const count = state.players.filter(player => player.connected).length;
            if (count >= 2) {
                els.midiSummary.textContent = '드럼 2대 연결 완료';
            } else if (count === 1) {
                els.midiSummary.textContent = '드럼 1대 연결 완료';
            } else {
                els.midiSummary.textContent = '드럼 연결 대기 중';
            }
        }

        function openSnareWaiting() {
            playClickSound();
            state.phase = 'snare_waiting';
            els.startOverlay.classList.add('hidden');
            els.snareOverlay.classList.remove('hidden');
        }

        function triggerChallengerAppearance(deviceId) {
            clearSpinTimers();
            state.phase = 'challenger_waiting';
            state.roundLocked = true;
            stopGameLoopAudio();
            bgmAudio.volume = 0.35;
            state.challengerDeviceId = deviceId;
            els.challengerOverlay.classList.remove('hidden');
        }

        async function setupMidi() {
            if (!navigator.requestMIDIAccess) {
                els.midiSummary.textContent = '이 브라우저는 MIDI 연결을 지원하지 않습니다.';
                refreshPlayerConnections();
                return;
            }

            try {
                const access = await navigator.requestMIDIAccess();
                state.midiAccess = access;
                const bindInputs = () => {
                    refreshPlayerConnections();
                    
                    // 게임 진행 중 기기가 새로 연결되었을 때 1P 맵핑 유지를 위해 임시 백업
                    let active1PId = null;
                    for (const [id, idx] of state.inputPlayerMap.entries()) {
                        if (idx === 0) active1PId = id;
                    }
                    
                    state.midiInputs.forEach((input, index) => {
                        if (index >= MIDI_PLAYER_LIMIT) return;
                        state.inputPlayerMap.set(input.id, index);
                        const playerIndex = state.inputPlayerMap.get(input.id);
                        input.onmidimessage = event => handleMidiMessage(event, playerIndex);
                    });
                    
                    // 게임 중인 경우 백업된 1P 장치 맵핑을 강제 복구 및 다른 장치를 2P로 지정
                    if (active1PId && (state.phase !== 'intro' && state.phase !== 'snare_waiting')) {
                        state.inputPlayerMap.set(active1PId, 0);
                        state.midiInputs.forEach(input => {
                            if (input.id !== active1PId) {
                                state.inputPlayerMap.set(input.id, 1);
                            }
                        });
                    }
                };
                access.onstatechange = bindInputs;
                bindInputs();
            } catch (error) {
                els.midiSummary.textContent = '드럼 권한을 허용해 주세요.';
            }
        }

        function handleMidiMessage(event, playerIndex) {
            const [status, note, velocity = 0] = event.data;
            const command = status & 0xf0;
            if (command !== 0x90 || velocity < MIDI_MIN_VELOCITY) return;
            const drumId = noteToDrum(note);
            const deviceId = event.target.id;

            // 0. 인트로 화면 상태: 하이햇을 타격할 때 스네어 대기 화면으로 진입하여 게임을 준비함
            if (state.phase === 'intro') {
                if (drumId === 'hihat') {
                    openSnareWaiting();
                }
                return;
            }

            // 0-2. ready 화면 상태: 하이햇을 타격할 때 중앙 버튼 클릭과 동일하게 라운드 룰렛 스핀 시작
            if (state.phase === 'ready') {
                if (drumId === 'hihat') {
                    playClickSound();
                    startSpinRound();
                }
                return;
            }

            // 1. 스네어 대기 화면 상태: 최초로 스네어를 친 드럼 기기만 1P로 지정하고 게임 시작
            if (state.phase === 'snare_waiting') {
                if (drumId === 'snare') {
                    playClickSound();
                    state.activePlayerMap.clear();
                    state.activePlayerMap.set(deviceId, 0); // 이 기기를 1P로 매핑
                    
                    state.singlePlayerMode = true;
                    
                    els.snareOverlay.classList.add('hidden');
                    startGame();
                    refreshPlayerConnections();
                }
                return;
            }

            // activePlayerMap을 통해 현재 기기의 논리적 플레이어 인덱스를 확인
            let mappedPlayerIndex = state.activePlayerMap.get(deviceId);

            // 2. 도전자 대기 화면 상태: 하이햇을 타격할 때 2인용 대결 모드 시작
            if (state.phase === 'challenger_waiting') {
                if (drumId === 'hihat') {
                    playClickSound();
                    els.challengerOverlay.classList.add('hidden');
                    if (state.challengerDeviceId && state.challengerDeviceId !== 'keyboard_2p') {
                        state.activePlayerMap.set(state.challengerDeviceId, 1); // 도전 기기를 2P로 매핑
                    }
                    state.singlePlayerMode = false;
                    startGame();
                    refreshPlayerConnections();
                    startSpinRound();
                }
                return;
            }

            // 3. 1인용 게임 중이고, 현재 기기가 1P가 아니며(미지정 포함), 플로어 탐을 친 경우 도전자 난입
            if (state.singlePlayerMode && (mappedPlayerIndex === undefined || mappedPlayerIndex === 1)) {
                if (drumId === 'floor') {
                    triggerChallengerAppearance(deviceId);
                }
                return;
            }

            // 인게임 플레이 타격 판정 (맵핑된 기기이고 드럼 타입 매칭될 때)
            if (drumId && mappedPlayerIndex !== undefined) {
                if (state.singlePlayerMode && mappedPlayerIndex === 1) {
                    // 1인용 모드에서는 2P 타격을 게임 판정에서 차단
                    return;
                }
                handlePlayerHit(mappedPlayerIndex, drumId);
            }
        }

        function restartGameBtn() {
            startGame();
        }

        function exitGame() {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'gameExit' }, '*');
            }
            history.back();
        }

        function goToIntro() {
            state.phase = 'intro';
            state.singlePlayerMode = false;
            state.activePlayerMap.clear();
            
            resetScores();
            resetPlayerImages();
            
            els.resultOverlay.classList.add('hidden');
            els.startOverlay.classList.remove('hidden');
            
            const loaderContainer = document.getElementById('pixel-loader');
            const actions = document.getElementById('intro-actions');
            if (loaderContainer) loaderContainer.classList.add('hidden');
            if (actions) actions.classList.remove('hidden');
            
            refreshPlayerConnections();
        }

        els.btnStart.addEventListener('click', openSnareWaiting);
        els.btnHome.addEventListener('click', () => {
            playClickSound();
            goToIntro();
        });
        els.btnAgain.addEventListener('click', () => {
            playClickSound();
            const is2PConnected = Array.from(state.activePlayerMap.entries()).some(([id, idx]) => idx === 1);
            state.singlePlayerMode = !is2PConnected;
            startGame();
            refreshPlayerConnections();
        });
        els.roundButton.addEventListener('click', () => {
            playClickSound();
            startSpinRound();
        });
        els.btnHowto.addEventListener('click', () => {
            playClickSound();
            els.howtoModal.classList.remove('hidden');
        });
        els.btnHowtoClose.addEventListener('click', () => {
            playClickSound();
            els.howtoModal.classList.add('hidden');
        });
        els.howtoModal.addEventListener('click', event => {
            if (event.target === els.howtoModal) els.howtoModal.classList.add('hidden');
        });

        // 도전자 대결 시작 버튼 클릭 바인딩
        els.btnChallengerStart.addEventListener('click', () => {
            playClickSound();
            els.challengerOverlay.classList.add('hidden');
            if (state.challengerDeviceId) {
                if (state.challengerDeviceId !== 'keyboard_2p') {
                    state.activePlayerMap.set(state.challengerDeviceId, 1);
                } else {
                    state.activePlayerMap.set('keyboard_2p', 1);
                }
                state.challengerDeviceId = null;
            } else {
                state.activePlayerMap.set('keyboard_2p', 1);
            }
            state.singlePlayerMode = false;
            startGame();
            refreshPlayerConnections();
            startSpinRound();
        });

        // 1P, 2P 드럼 연결 박스 클릭 리스너 바인딩
        els.players[0].connect.addEventListener('click', setupMidi);
        els.players[1].connect.addEventListener('click', setupMidi);

        window.addEventListener('keydown', event => {
            const keyMap = {
                Digit1: ['crash', 0],
                Digit2: ['tom1', 0],
                Digit3: ['tom2', 0],
                Digit4: ['ride', 0],
                Digit5: ['snare', 0],
                Digit6: ['hihat', 0],
                Digit7: ['floor', 0],
                KeyQ: ['crash', 1],
                KeyW: ['tom1', 1],
                KeyE: ['tom2', 1],
                KeyR: ['ride', 1],
                KeyT: ['snare', 1],
                KeyY: ['hihat', 1],
                KeyU: ['floor', 1]
            };
            const mapped = keyMap[event.code];
            if (!mapped) return;

            const drumId = mapped[0];
            const inputIndex = mapped[1];

            // 0. 인트로 화면 상태: 하이햇 단축키를 눌렀을 때 스네어 대기 화면으로 진입하여 게임을 준비함
            if (state.phase === 'intro') {
                if (drumId === 'hihat') {
                    openSnareWaiting();
                }
                return;
            }

            // 0-2. ready 화면 상태: 하이햇 단축키를 눌렀을 때 중앙 버튼 클릭과 동일하게 라운드 룰렛 스핀 시작
            if (state.phase === 'ready') {
                if (drumId === 'hihat') {
                    playClickSound();
                    startSpinRound();
                }
                return;
            }

            // 1. 스네어 대기 화면 상태
            if (state.phase === 'snare_waiting') {
                if (drumId === 'snare') {
                    playClickSound();
                    state.activePlayerMap.clear();
                    state.activePlayerMap.set('keyboard_1p', 0); // 키보드 1P 지정
                    
                    state.singlePlayerMode = true;
                    
                    els.snareOverlay.classList.add('hidden');
                    startGame();
                    refreshPlayerConnections();
                }
                return;
            }

            // 2. 도전자 대기 화면 상태
            if (state.phase === 'challenger_waiting') {
                if (drumId === 'hihat') {
                    playClickSound();
                    els.challengerOverlay.classList.add('hidden');
                    state.activePlayerMap.set('keyboard_2p', 1);
                    state.singlePlayerMode = false;
                    startGame();
                    refreshPlayerConnections();
                    startSpinRound();
                }
                return;
            }

            // 3. 1인용 게임 중 2P 단축키로 플로어 탐 타격 시 난입
            if (state.singlePlayerMode && inputIndex === 1 && drumId === 'floor') {
                triggerChallengerAppearance('keyboard_2p');
                return;
            }

            // 1인용 모드일 때 2P 키 입력 차단
            if (state.singlePlayerMode && inputIndex === 1) return;

            handlePlayerHit(inputIndex, drumId);
        });

        renderScores();
        updateRoundInfo();
        setupMidi();

        // 페이지 진입 즉시 배경음 재생 시도
        startBgm();

        // 오토플레이 제한 대응용 최초 상호작용 감지 리스너
        const playOnFirstInteraction = () => {
            startBgm();
            window.removeEventListener('click', playOnFirstInteraction);
            window.removeEventListener('keydown', playOnFirstInteraction);
            window.removeEventListener('touchstart', playOnFirstInteraction);
        };
        window.addEventListener('click', playOnFirstInteraction);
        window.addEventListener('keydown', playOnFirstInteraction);
        window.addEventListener('touchstart', playOnFirstInteraction);

        function runIntroLoader() {
            const loaderContainer = document.getElementById('pixel-loader');
            const loaderBar = document.getElementById('loader-bar-inner');
            const actions = document.getElementById('intro-actions');
            
            if (!loaderBar || !loaderContainer || !actions) return;
            
            let progress = 0;
            const duration = 2000;
            const intervalTime = 50;
            const step = 100 / (duration / intervalTime);
            
            const timer = setInterval(() => {
                progress += step;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(timer);
                    setTimeout(() => {
                        loaderContainer.classList.add('hidden');
                        actions.classList.remove('hidden');
                    }, 150);
                }
                loaderBar.style.width = progress + '%';
            }, intervalTime);
        }

        // 최초 진입 시 도트 로딩 바 구동
        runIntroLoader();
    </script>

    <script src="../../js/web-learning-ranking.js?v=20260618-07" defer></script>
