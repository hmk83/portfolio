<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>빠르게 두드려라! 스마트드럼 1인용</title>
    <style>
        :root {
            --header-height: 58px;
            --safe-bottom-space: clamp(104px, 15dvh, 150px);
            --safe-top-space: clamp(58px, 9dvh, 92px);
            --safe-art-height: min(432px, calc(100dvh - var(--header-height) - var(--safe-top-space) - var(--safe-bottom-space)));
            --ink: #2d2438;
            --panel: rgba(255, 255, 255, 0.9);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100dvh;
            margin: 0;
            overflow: hidden;
            background: #c9efe9;
            color: var(--ink);
            font-family: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        button {
            font: inherit;
        }

        .kakao-header {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 50;
            width: 100%;
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 0 16px;
            background: linear-gradient(135deg, #fee500 0%, #f9c51b 100%);
            border-bottom: 2px solid rgba(74, 47, 34, 0.22);
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.18);
            color: #3b1e1e;
        }

        .header-title {
            min-width: 0;
            font-size: clamp(16px, 3.4vw, 22px);
            font-weight: 900;
            white-space: nowrap;
        }

        .header-buttons {
            display: flex;
            gap: 8px;
        }

        .header-btn {
            min-height: 34px;
            padding: 6px 12px;
            border: 2px solid rgba(255, 255, 255, 0.72);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.52);
            color: #3b1e1e;
            font-size: clamp(12px, 2.4vw, 14px);
            font-weight: 900;
            cursor: pointer;
        }

        .game {
            position: relative;
            width: 100vw;
            height: calc(100dvh - var(--header-height));
            margin-top: var(--header-height);
            overflow: hidden;
            background-image: url('../images/pull-up-bar-bg.webp');
            background-size: cover;
            background-position: center;
        }

        .game-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .playfield {
            position: absolute;
            inset: 0;
            z-index: 1;
            display: grid;
            grid-template-columns: minmax(300px, 420px) minmax(260px, 360px);
            justify-content: center;
            column-gap: clamp(48px, 7vw, 110px);
            align-items: start;
            min-width: 0;
            padding: var(--safe-top-space) clamp(18px, 3vw, 42px) var(--safe-bottom-space);
        }

        .player-zone,
        .question-zone {
            position: relative;
            min-width: 0;
            display: grid;
            justify-items: center;
            align-content: start;
            height: 100%;
        }

        .player-zone {
            grid-template-rows: auto auto auto;
            padding-right: 0;
        }

        .question-zone {
            grid-template-rows: var(--safe-art-height) auto;
            padding-left: 0;
            padding-top: calc(clamp(12px, 2dvh, 20px) + clamp(16px, 2.1vw, 25px) + 16px);
        }

        .bar-wrap {
            position: relative;
            width: min(100%, calc(var(--safe-art-height) * 431 / 432));
            max-height: var(--safe-art-height);
            aspect-ratio: 431 / 432;
        }

        .bar-img,
        .player-img {
            position: absolute;
            top: 0;
            left: 50%;
            width: auto;
            height: 100%;
            max-height: var(--safe-art-height);
            object-fit: contain;
            transform: translateX(-50%);
        }

        .bar-img {
            filter: drop-shadow(0 18px 18px rgba(0, 0, 0, 0.18));
        }

        .player-img {
            display: block;
            filter: grayscale(1);
            transform-origin: center top;
            transition: filter 0.28s ease;
        }

        .player-zone.connected .player-img {
            filter: grayscale(0);
        }

        .copy-mark {
            position: absolute;
            top: 3%;
            right: -8%;
            z-index: 6;
            width: clamp(84px, 14.4vw, 138px);
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 5px 5px rgba(0, 0, 0, 0.22));
            opacity: 0;
            pointer-events: none;
        }

        .copy-mark.visible {
            opacity: 1;
            animation: pop-copy 260ms ease-out;
        }

        @keyframes pop-copy {
            0% {
                transform: scale(0.3) rotate(-12deg);
            }
            100% {
                transform: scale(1) rotate(0deg);
            }
        }

        .connect-box {
            width: min(100%, 390px);
            min-height: 52px;
            display: grid;
            place-items: center;
            margin-top: clamp(16px, 2.4dvh, 30px);
            padding: 10px 14px;
            border: 4px dotted rgba(53, 42, 28, 0.8);
            border-radius: 8px;
            background: #fff;
            color: #413225;
            font-size: clamp(20px, 2.1vw, 24px);
            font-weight: 900;
            text-align: center;
            box-shadow: 0 7px 0 rgba(86, 63, 42, 0.16);
        }

        .player-zone:not(.connected) .connect-box {
            color: rgba(65, 50, 37, 0.52);
            border-color: rgba(53, 42, 28, 0.34);
        }

        .progress-orbs {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 5px;
            min-width: min(22rem, 42vw);
            margin-bottom: clamp(12px, 2dvh, 20px);
            padding: 8px 12px;
            border: 3px solid rgba(255, 255, 255, 0.82);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.86);
            box-shadow: 0 8px 0 rgba(0, 0, 0, 0.08);
        }

        .progress-orb {
            width: clamp(16px, 2.1vw, 25px);
            aspect-ratio: 1;
            border: 2px solid rgba(57, 46, 37, 0.34);
            border-radius: 999px;
            background: #c9c9c9;
            box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.18);
        }

        .teacher {
            align-self: start;
            width: min(100%, calc(var(--safe-art-height) * 470 / 470));
            max-height: var(--safe-art-height);
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 16px 18px rgba(0, 0, 0, 0.22));
            opacity: 0;
        }

        .teacher.visible {
            opacity: 1;
        }

        .teacher.visible.loading {
            opacity: 0;
        }

        .target-name {
            align-self: start;
            width: min(100%, 390px);
            min-height: 52px;
            display: grid;
            place-items: center;
            margin-top: clamp(12px, 2dvh, 22px);
            padding: 10px 14px;
            border: 4px dotted #5b4631;
            border-radius: 8px;
            background: #fff;
            color: #33261d;
            font-size: clamp(20px, 2.1vw, 24px);
            font-weight: 900;
            text-align: center;
            opacity: 0;
            pointer-events: none;
        }

        .target-name.visible {
            opacity: 1;
        }

        .center-play {
            position: absolute;
            left: 50%;
            bottom: clamp(18px, 3.5dvh, 34px);
            z-index: 8;
            display: grid;
            justify-items: center;
            transform: translateX(-50%);
        }

        .pull-button {
            width: clamp(220px, 30vw, 360px);
            height: auto;
            border: 0;
            padding: 0;
            background: transparent;
            cursor: pointer;
            filter: drop-shadow(0 10px 0 rgba(0, 0, 0, 0.16));
            transition: transform 0.1s ease, filter 0.1s ease;
        }

        .pull-button.hidden {
            display: none;
        }

        .pull-button:active {
            transform: translateY(6px);
            filter: drop-shadow(0 4px 0 rgba(0, 0, 0, 0.16));
        }

        .pull-button[disabled] {
            cursor: default;
            opacity: 0.55;
            filter: grayscale(0.6);
        }

        .pull-button img {
            display: block;
            width: 100%;
            object-fit: contain;
        }

        .overlay {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: grid;
            place-items: center;
            padding: 18px;
            background-image: url('../images/pull-up-bar-bg.webp');
            background-size: cover;
            background-position: center;
        }

        .overlay::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.14);
        }

        .overlay.hidden {
            display: none;
        }

        .hidden {
            display: none !important;
        }

        .intro-panel,
        .howto-panel,
        .result-panel {
            position: relative;
            z-index: 1;
            width: min(620px, 92vw);
            display: grid;
            justify-items: center;
            gap: clamp(12px, 2.4dvh, 22px);
            text-align: center;
        }

        .title-img {
            width: min(560px, 84vw);
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 12px 0 rgba(0, 0, 0, 0.12));
        }

        .intro-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        .intro-guide-text {
            flex-basis: 100%;
            color: #3b1e1e;
            font-size: clamp(16px, 2.5vw, 22px);
            font-weight: 900;
            text-shadow: 0 2px 0 rgba(255, 255, 255, 0.74);
        }

        .pixel-loader-container {
            width: min(420px, 80vw);
            display: grid;
            gap: 10px;
            padding: 18px;
            border: 4px solid #000;
            background: rgba(31, 24, 74, 0.86);
            box-shadow: 6px 6px 0 #000;
        }

        .loader-text {
            color: #fee500;
            font-size: clamp(18px, 3vw, 24px);
            font-weight: 900;
            text-shadow: 2px 2px 0 #000;
            animation: blink 0.8s steps(2, start) infinite;
        }

        @keyframes blink {
            to {
                visibility: hidden;
            }
        }

        .loader-bar-outer {
            width: 100%;
            height: 28px;
            border: 4px solid #000;
            background: #251e54;
            padding: 2px;
            box-shadow: 4px 4px 0 #000;
        }

        .loader-bar-inner {
            height: 100%;
            width: 0%;
            background: #00ffcc;
            background-image: linear-gradient(
                90deg,
                rgba(0, 0, 0, 0.15) 25%,
                transparent 25%,
                transparent 50%,
                rgba(0, 0, 0, 0.15) 50%,
                rgba(0, 0, 0, 0.15) 75%,
                transparent 75%,
                transparent
            );
            background-size: 16px 100%;
            transition: width 0.08s linear;
        }

        .play-button,
        .howto-button,
        .result-button {
            min-width: 150px;
            min-height: 58px;
            border: 4px solid rgba(255, 255, 255, 0.88);
            border-radius: 10px;
            background: #fee500;
            color: #3b1e1e;
            font-size: clamp(22px, 4vw, 36px);
            font-weight: 900;
            box-shadow: 0 8px 0 rgba(74, 47, 34, 0.18);
            cursor: pointer;
        }

        .howto-button {
            background: #fff;
        }

        .midi-summary {
            min-height: 44px;
            padding: 8px 16px;
            border: 4px dotted rgba(74, 47, 34, 0.78);
            border-radius: 8px;
            background: #fff;
            color: #3b1e1e;
            font-size: clamp(17px, 2.8vw, 24px);
            font-weight: 900;
        }

        .howto-modal {
            z-index: 30;
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(4px);
        }

        .howto-panel,
        .result-panel {
            padding: clamp(18px, 4vw, 30px);
            border: 4px solid rgba(255, 255, 255, 0.92);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.94);
            box-shadow: 0 18px 34px rgba(0, 0, 0, 0.18);
        }

        .howto-title,
        .result-title {
            margin: 0;
            color: #33261d;
            font-size: clamp(30px, 7vw, 54px);
            line-height: 1;
        }

        .howto-list {
            display: grid;
            gap: 10px;
            width: 100%;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .howto-list li {
            display: grid;
            grid-template-columns: 42px minmax(0, 1fr);
            gap: 10px;
            align-items: center;
            padding: 12px;
            border-radius: 10px;
            background: #f5f1e8;
            color: #3f3023;
            font-size: clamp(17px, 3vw, 24px);
            font-weight: 800;
            text-align: left;
        }

        .howto-list b {
            display: grid;
            place-items: center;
            width: 42px;
            height: 42px;
            border-radius: 999px;
            background: #fff;
        }

        .result-score {
            display: grid;
            gap: 10px;
            width: 100%;
        }

        .result-score span {
            padding: 14px;
            border-radius: 10px;
            background: #f5f1e8;
            font-size: clamp(22px, 4vw, 36px);
            font-weight: 900;
        }

        .result-text {
            margin: 0;
            font-size: clamp(20px, 3.6vw, 30px);
            font-weight: 900;
        }

        @media (max-width: 760px) {
            .playfield {
                min-width: 0;
                grid-template-columns: 1fr;
                grid-template-rows: auto auto;
                gap: 10px;
                padding-top: clamp(18px, 4dvh, 38px);
            }

            .player-zone,
            .question-zone {
                padding: 0;
            }

            .bar-wrap {
                width: min(68vw, calc(var(--safe-art-height) * 431 / 432));
            }

            .teacher {
                width: min(56vw, calc(var(--safe-art-height) * 0.8));
            }

            .connect-box {
                width: min(76vw, 330px);
                min-height: 42px;
                padding: 7px 10px;
                font-size: 16px;
            }

            .progress-orbs {
                min-width: min(18rem, 72vw);
                gap: 4px;
                padding: 6px 9px;
            }

            .pull-button {
                width: 210px;
            }
        }
    </style>
</head>

<body>
    <header class="kakao-header">
        <div class="header-title">빠르게 두드려라! 스마트드럼</div>
        <div class="header-buttons">
            <button class="header-btn" type="button" onclick="restartGameBtn()">다시시작</button>
            <button class="header-btn" type="button" onclick="exitGame()">학습종료</button>
        </div>
    </header>

    <main class="game">
        <img class="game-bg" src="../images/pull-up-bar-bg.webp" alt="" fetchpriority="high" decoding="async">
        <section class="playfield" aria-label="철봉 드럼 1인용">
            <article class="player-zone" id="player-zone">
                <div class="progress-orbs" id="orbs" aria-label="정답 구슬"></div>
                <div class="bar-wrap">
                    <img class="bar-img" src="../images/pull-up-bar.webp" alt="철봉" fetchpriority="high" decoding="async">
                    <img class="player-img" id="player-img" src="../images/1P-01.webp" alt="캐릭터" fetchpriority="high" decoding="async">
                    <img class="copy-mark" id="copy-mark" src="../images/pull-up-bar-copy.webp" alt="성공" decoding="async">
                </div>
                <div class="connect-box" id="connect-box">드럼 연결 대기 중</div>
            </article>

            <article class="question-zone" aria-label="문제 이미지">
                <img class="teacher" id="teacher" src="../images/pull-up-bar-teacher-01.webp" alt="선생님 문제" fetchpriority="high" decoding="async">
                <div class="target-name" id="target-name">크래쉬심벌</div>
            </article>
        </section>

        <img src="../images/pull-up-bar-teacher-02.webp" alt="" hidden loading="lazy" decoding="async">
        <img src="../images/pull-up-bar-teacher-03.webp" alt="" hidden loading="lazy" decoding="async">
        <img src="../images/pull-up-bar-teacher-04.webp" alt="" hidden loading="lazy" decoding="async">
        <img src="../images/pull-up-bar-teacher-05.webp" alt="" hidden loading="lazy" decoding="async">
        <img src="../images/pull-up-bar-teacher-06.webp" alt="" hidden loading="lazy" decoding="async">
        <img src="../images/pull-up-bar-teacher-07.webp" alt="" hidden loading="lazy" decoding="async">
        <img src="../images/1P-02.webp" alt="" hidden loading="lazy" decoding="async">
        <img src="../images/1P-03.webp" alt="" hidden loading="lazy" decoding="async">
        <img src="../images/1P-04.webp" alt="" hidden loading="lazy" decoding="async">
        <img src="../images/pull-up-bar-copy-1.webp" alt="" hidden loading="lazy" decoding="async">

        <div class="center-play">
            <button class="pull-button" id="round-button" type="button" aria-label="라운드 시작">
                <img src="../images/pull-up-bar-button.webp" alt="시작">
            </button>
        </div>

        <section class="overlay" id="start-overlay">
            <div class="intro-panel">
                <img class="title-img" src="../images/pull-up-bar-drum.webp" alt="빠르게 두드려라 스마트드럼" fetchpriority="high" decoding="async">
                <div class="pixel-loader-container" id="pixel-loader">
                    <div class="loader-text">NOW LOADING...</div>
                    <div class="loader-bar-outer">
                        <div class="loader-bar-inner" id="loader-bar-inner"></div>
                    </div>
                </div>
                <div class="intro-actions hidden" id="intro-actions">
                    <button class="play-button" id="btn-start" type="button">게임시작</button>
                    <button class="howto-button" id="btn-howto" type="button">게임방법</button>
                    <div class="intro-guide-text">하이햇을 두드려 게임을 시작하세요.</div>
                </div>
                <div class="midi-summary" id="midi-summary">게임시작 후 드럼 연결</div>
            </div>
        </section>

        <section class="overlay howto-modal hidden" id="howto-modal" aria-modal="true" role="dialog" aria-labelledby="howto-title">
            <div class="howto-panel">
                <h2 class="howto-title" id="howto-title">게임방법</h2>
                <ul class="howto-list">
                    <li><b>1</b><span>게임시작 후 문제가 자동으로 이어져요.</span></li>
                    <li><b>2</b><span>오른쪽 선생님 이미지를 보고 같은 드럼을 두드려요.</span></li>
                    <li><b>3</b><span>틀리면 다시 섞이고, 정답 9개를 맞히면 성공이에요.</span></li>
                </ul>
                <button class="result-button" id="btn-howto-close" type="button">알겠어요</button>
            </div>
        </section>

        <section class="overlay hidden" id="result-overlay">
            <div class="result-panel">
                <h2 class="result-title" id="result-title">성공!</h2>
                <div class="result-score">
                    <span>턱걸이 <strong id="final-score">0</strong>개 완료</span>
                </div>
                <p class="result-text" id="result-text">정답 9개를 모두 맞혔어요.</p>
                <button class="result-button" id="btn-again" type="button">다시하기</button>
            </div>
        </section>
    </main>

    <script>
        const IMAGE_BASE = '../images/';
        const TOTAL_ROUNDS = 9;
        const SPIN_INTERVAL_MS = 70;
        const SPIN_MIN_MS = 760;
        const SPIN_RANDOM_MS = 520;
        const AUTO_NEXT_MS = 680;
        const COPY_VISIBLE_MS = 520;
        const WRONG_HOLD_MS = 1000;
        const MIDI_MIN_VELOCITY = 8;
        const SUCCESS_MARK_SRC = `${IMAGE_BASE}pull-up-bar-copy.webp`;
        const FAILURE_MARK_SRC = `${IMAGE_BASE}pull-up-bar-copy-1.webp`;
        const SOUND_SOURCES = {
            bgm: 'ht' + 'tps://cdn.pixabay.com/audio/2022/12/13/audio_dba0111d9c.mp3',
            click: 'ht' + 'tps://cdn.pixabay.com/audio/2024/11/09/audio_cad57da7be.mp3',
            loop: 'ht' + 'tps://cdn.pixabay.com/audio/2024/03/08/audio_858ecbed3d.mp3'
        };
        const bgmAudio = new Audio();
        bgmAudio.loop = true;
        bgmAudio.volume = 0.35;
        let bgmPlaying = false;

        const clickAudio = new Audio();
        clickAudio.volume = 0.8;

        const gameLoopAudio = new Audio();
        gameLoopAudio.loop = true;
        gameLoopAudio.volume = 0.45;
        let gameLoopPlaying = false;
        const DRUM_NOTE_DEFINITIONS = {
            crash: { notes: [49, 52, 55, 57] },
            tom1: { notes: [48, 50] },
            tom2: { notes: [45, 47] },
            ride: { notes: [51, 59, 53] },
            snare: { notes: [38, 40, 31, 34, 37] },
            hihat: { notes: [42, 44, 46, 22, 26] },
            floor: { notes: [41, 43] }
        };
        const TEACHER_TARGETS = {
            crash: { label: '크래쉬심벌', image: 1, color: '#ef4444', notes: DRUM_NOTE_DEFINITIONS.crash.notes },
            tom1: { label: '탐1', image: 2, color: '#f97316', notes: DRUM_NOTE_DEFINITIONS.tom1.notes },
            tom2: { label: '탐2', image: 3, color: '#facc15', notes: DRUM_NOTE_DEFINITIONS.tom2.notes },
            ride: { label: '라이드심벌', image: 4, color: '#22c55e', notes: DRUM_NOTE_DEFINITIONS.ride.notes },
            snare: { label: '스네어', image: 5, color: '#3b82f6', notes: DRUM_NOTE_DEFINITIONS.snare.notes },
            hihat: { label: '하이햇', image: 6, color: '#ec4899', notes: DRUM_NOTE_DEFINITIONS.hihat.notes },
            floor: { label: '플로어탐', image: 7, color: '#8b5cf6', notes: DRUM_NOTE_DEFINITIONS.floor.notes }
        };
        const TARGET_ORDER = Object.keys(TEACHER_TARGETS);
        const NOTE_TO_DRUM = buildMidiNoteToDrum(TEACHER_TARGETS);

        const els = {
            startOverlay: document.getElementById('start-overlay'),
            resultOverlay: document.getElementById('result-overlay'),
            howtoModal: document.getElementById('howto-modal'),
            btnStart: document.getElementById('btn-start'),
            btnHowto: document.getElementById('btn-howto'),
            btnHowtoClose: document.getElementById('btn-howto-close'),
            btnAgain: document.getElementById('btn-again'),
            pixelLoader: document.getElementById('pixel-loader'),
            loaderBar: document.getElementById('loader-bar-inner'),
            introActions: document.getElementById('intro-actions'),
            roundButton: document.getElementById('round-button'),
            playerZone: document.getElementById('player-zone'),
            playerImg: document.getElementById('player-img'),
            copyMark: document.getElementById('copy-mark'),
            teacher: document.getElementById('teacher'),
            targetName: document.getElementById('target-name'),
            connectBox: document.getElementById('connect-box'),
            midiSummary: document.getElementById('midi-summary'),
            orbs: document.getElementById('orbs'),
            finalScore: document.getElementById('final-score')
        };

        const state = {
            phase: 'intro',
            score: 0,
            answers: [],
            targetDrum: null,
            roundLocked: true,
            spinTimer: 0,
            stopTimer: 0,
            nextRoundTimer: 0,
            copyTimer: 0,
            playerAnimationTimer: 0,
            midiPulseTimer: 0,
            teacherQuestionToken: 0,
            midiInput: null,
            midiSetupStarted: false,
            connected: false
        };

        function padImageNumber(number) {
            return String(number).padStart(2, '0');
        }

        function teacherSrc(number) {
            return `${IMAGE_BASE}pull-up-bar-teacher-${padImageNumber(number)}.webp`;
        }

        function playerSrc(frameNumber) {
            return `${IMAGE_BASE}1P-${padImageNumber(frameNumber)}.webp`;
        }

        function randomTargetId() {
            return TARGET_ORDER[Math.floor(Math.random() * TARGET_ORDER.length)];
        }

        function buildMidiNoteToDrum(targets) {
            const map = new Map();
            Object.entries(targets).forEach(([drumId, target]) => {
                target.notes.forEach(note => map.set(note, drumId));
            });
            return map;
        }

        function noteToDrum(note) {
            return NOTE_TO_DRUM.get(note) || null;
        }

        function clearTimers() {
            clearInterval(state.spinTimer);
            clearTimeout(state.stopTimer);
            clearTimeout(state.nextRoundTimer);
            clearTimeout(state.copyTimer);
            clearTimeout(state.playerAnimationTimer);
            clearTimeout(state.midiPulseTimer);
            state.spinTimer = 0;
            state.stopTimer = 0;
            state.nextRoundTimer = 0;
            state.copyTimer = 0;
            state.playerAnimationTimer = 0;
            state.midiPulseTimer = 0;
        }

        function startBgm() {
            if (bgmPlaying) return;
            prepareAudio(bgmAudio, SOUND_SOURCES.bgm);
            bgmAudio.play().then(() => {
                bgmPlaying = true;
            }).catch(err => console.log('BGM play blocked:', err));
        }

        function playClickSound() {
            prepareAudio(clickAudio, SOUND_SOURCES.click);
            clickAudio.currentTime = 0;
            clickAudio.play().catch(err => console.log('Click sound blocked:', err));
        }

        function startGameLoopAudio() {
            if (gameLoopPlaying) return;
            prepareAudio(gameLoopAudio, SOUND_SOURCES.loop);
            gameLoopAudio.currentTime = 0;
            gameLoopAudio.play().then(() => {
                gameLoopPlaying = true;
            }).catch(err => console.log('Game loop audio blocked:', err));
        }

        function stopGameLoopAudio() {
            if (!gameLoopPlaying) return;
            gameLoopAudio.pause();
            gameLoopAudio.currentTime = 0;
            gameLoopPlaying = false;
        }

        function prepareAudio(audio, src) {
            if (!audio.src) audio.src = src;
        }

        function startGame() {
            requestMidiOnDemand();
            startBgm();
            bgmAudio.volume = 0.1;
            startGameLoopAudio();
            clearTimers();
            hideCopyMark();
            state.phase = state.connected ? 'ready' : 'waiting-midi';
            state.score = 0;
            state.answers = [];
            state.targetDrum = null;
            state.roundLocked = true;
            els.playerImg.src = playerSrc(1);
            els.teacher.classList.remove('visible');
            els.targetName.classList.remove('visible');
            els.startOverlay.classList.add('hidden');
            els.resultOverlay.classList.add('hidden');
            els.howtoModal.classList.add('hidden');
            els.roundButton.disabled = true;
            els.roundButton.classList.add('hidden');
            renderProgress();
            if (state.connected) {
                state.nextRoundTimer = setTimeout(startSpinRound, AUTO_NEXT_MS);
            }
        }

        function showIntro() {
            clearTimers();
            hideCopyMark();
            state.phase = 'intro';
            state.score = 0;
            state.answers = [];
            state.targetDrum = null;
            state.roundLocked = true;
            els.playerImg.src = playerSrc(1);
            els.teacher.classList.remove('visible');
            els.targetName.classList.remove('visible');
            els.resultOverlay.classList.add('hidden');
            els.howtoModal.classList.add('hidden');
            els.startOverlay.classList.remove('hidden');
            els.roundButton.disabled = false;
            els.roundButton.classList.remove('hidden');
            renderProgress();
            initIntroLoader();
        }

        function initIntroLoader() {
            let progress = 0;
            els.pixelLoader.classList.remove('hidden');
            els.introActions.classList.add('hidden');
            els.loaderBar.style.width = '0%';
            const loaderTimer = setInterval(() => {
                progress += 5;
                els.loaderBar.style.width = `${progress}%`;
                if (progress >= 100) {
                    clearInterval(loaderTimer);
                    els.pixelLoader.classList.add('hidden');
                    els.introActions.classList.remove('hidden');
                }
            }, 45);
        }

        function startSpinRound() {
            if (!state.connected) {
                state.phase = 'waiting-midi';
                state.roundLocked = true;
                return;
            }
            if (state.phase === 'spinning' || state.phase === 'waiting' || state.score >= TOTAL_ROUNDS) return;
            clearInterval(state.spinTimer);
            clearTimeout(state.stopTimer);
            hideCopyMark();
            state.phase = 'spinning';
            state.roundLocked = true;
            state.targetDrum = null;
            els.targetName.textContent = '?';
            els.targetName.classList.add('visible');
            els.teacher.classList.remove('loading');
            els.teacher.classList.add('visible');

            state.spinTimer = setInterval(() => {
                const imageNumber = 1 + Math.floor(Math.random() * 7);
                els.teacher.src = teacherSrc(imageNumber);
            }, SPIN_INTERVAL_MS);

            const spinMs = SPIN_MIN_MS + Math.floor(Math.random() * SPIN_RANDOM_MS);
            state.stopTimer = setTimeout(stopSpinRound, spinMs);
        }

        function stopSpinRound() {
            clearInterval(state.spinTimer);
            clearTimeout(state.stopTimer);
            state.spinTimer = 0;
            state.stopTimer = 0;
            const targetId = randomTargetId();
            const target = TEACHER_TARGETS[targetId];
            state.targetDrum = targetId;
            state.roundLocked = false;
            state.phase = 'waiting';
            showTargetAfterImageReady(target);
        }

        function showTargetAfterImageReady(target) {
            state.teacherQuestionToken += 1;
            const token = state.teacherQuestionToken;
            const targetSrc = teacherSrc(target.image);
            els.targetName.textContent = '?';
            els.targetName.classList.add('visible');
            els.teacher.classList.add('loading');
            els.teacher.classList.add('visible');
            els.teacher.src = targetSrc;

            const revealTarget = () => {
                if (token !== state.teacherQuestionToken || state.phase !== 'waiting') return;
                els.teacher.classList.remove('loading');
                els.targetName.textContent = target.label;
                els.targetName.classList.add('visible');
            };

            if (els.teacher.decode) {
                els.teacher.decode().then(revealTarget).catch(revealTarget);
                return;
            }
            if (els.teacher.complete) {
                revealTarget();
                return;
            }
            els.teacher.addEventListener('load', revealTarget, { once: true });
        }

        function handlePlayerHit(drumId) {
            if (state.roundLocked || state.phase !== 'waiting') return;
            if (drumId !== state.targetDrum) {
                retryCurrentQuestion();
                return;
            }

            state.roundLocked = true;
            state.score += 1;
            state.answers.push(TEACHER_TARGETS[drumId].color);
            state.phase = 'ready';
            animatePlayerSuccess();
            showSuccessMark();
            renderProgress();

            if (state.score >= TOTAL_ROUNDS) {
                state.nextRoundTimer = setTimeout(finishGame, AUTO_NEXT_MS);
                return;
            }

            state.nextRoundTimer = setTimeout(startSpinRound, AUTO_NEXT_MS);
        }

        function showMidiPulse(text) {
            if (!state.connected || state.phase === 'intro' || state.phase === 'result') return;
            clearTimeout(state.midiPulseTimer);
            els.connectBox.textContent = text;
            state.midiPulseTimer = setTimeout(() => {
                els.connectBox.textContent = '드럼 연결 완료';
                state.midiPulseTimer = 0;
            }, 360);
        }

        function retryCurrentQuestion() {
            state.roundLocked = true;
            state.phase = 'ready';
            els.targetName.classList.remove('visible');
            showFailureMark();
            animatePlayerWrong();
            state.nextRoundTimer = setTimeout(startSpinRound, WRONG_HOLD_MS + 220);
        }

        function animatePlayerSuccess() {
            const successFrames = [1, 2, 3, 2, 1];
            playPlayerFrames(successFrames, 90);
        }

        function animatePlayerWrong() {
            clearTimeout(state.playerAnimationTimer);
            els.playerImg.src = playerSrc(4);
            state.playerAnimationTimer = setTimeout(() => {
                els.playerImg.src = playerSrc(1);
                state.playerAnimationTimer = 0;
            }, WRONG_HOLD_MS);
        }

        function playPlayerFrames(frames, frameMs) {
            let index = 0;
            clearTimeout(state.playerAnimationTimer);
            const next = () => {
                els.playerImg.src = playerSrc(frames[index]);
                index += 1;
                if (index < frames.length) {
                    state.playerAnimationTimer = setTimeout(next, frameMs);
                } else {
                    state.playerAnimationTimer = 0;
                }
            };
            next();
        }

        function showSuccessMark() {
            els.copyMark.src = SUCCESS_MARK_SRC;
            els.copyMark.alt = '성공';
            showCopyMark();
        }

        function showFailureMark() {
            els.copyMark.src = FAILURE_MARK_SRC;
            els.copyMark.alt = '실패';
            showCopyMark();
        }

        function showCopyMark() {
            clearTimeout(state.copyTimer);
            els.copyMark.classList.add('visible');
            state.copyTimer = setTimeout(hideCopyMark, COPY_VISIBLE_MS);
        }

        function hideCopyMark() {
            clearTimeout(state.copyTimer);
            state.copyTimer = 0;
            els.copyMark.classList.remove('visible');
        }

        function renderProgress() {
            els.finalScore.textContent = state.score;
            els.orbs.innerHTML = '';
            for (let i = 0; i < TOTAL_ROUNDS; i += 1) {
                const orb = document.createElement('span');
                orb.className = 'progress-orb';
                if (state.answers[i]) orb.style.backgroundColor = state.answers[i];
                els.orbs.appendChild(orb);
            }
        }

        function finishGame() {
            state.phase = 'result';
            state.roundLocked = true;
            hideCopyMark();
            els.targetName.classList.remove('visible');
            bgmAudio.volume = 0.35;
            stopGameLoopAudio();
            els.resultOverlay.classList.remove('hidden');
        }

        async function setupMidi() {
            state.midiSetupStarted = true;
            if (!navigator.requestMIDIAccess) {
                setConnection(false, '이 브라우저는 MIDI 연결을 지원하지 않습니다.');
                return;
            }

            try {
                const access = await navigator.requestMIDIAccess();
                const bindInput = () => {
                    const inputs = Array.from(access.inputs.values()).filter(input => input.state !== 'disconnected');
                    if (state.midiInput && !inputs.includes(state.midiInput)) {
                        state.midiInput.onmidimessage = null;
                        state.midiInput = null;
                    }
                    state.midiInput = inputs[0] || null;
                    if (state.midiInput) {
                        state.midiInput.onmidimessage = handleMidiMessage;
                        setConnection(true, '드럼 연결 완료');
                    } else {
                        setConnection(false, '드럼 연결 대기 중');
                    }
                };
                access.onstatechange = bindInput;
                bindInput();
            } catch (error) {
                setConnection(false, '드럼 권한을 허용해 주세요.');
            }
        }

        function requestMidiOnDemand() {
            if (state.midiSetupStarted) return;
            els.connectBox.textContent = '드럼 연결 확인 중';
            els.midiSummary.textContent = '드럼 연결 확인 중';
            setupMidi();
        }

        function setConnection(connected, text) {
            const wasConnected = state.connected;
            state.connected = connected;
            els.playerZone.classList.toggle('connected', connected);
            els.connectBox.textContent = connected ? '드럼 연결 완료' : '드럼 연결 대기 중';
            els.midiSummary.textContent = text;
            if (!connected && state.phase !== 'intro' && state.phase !== 'result') {
                clearInterval(state.spinTimer);
                clearTimeout(state.stopTimer);
                state.spinTimer = 0;
                state.stopTimer = 0;
                state.phase = 'waiting-midi';
                state.roundLocked = true;
                els.targetName.classList.remove('visible');
            }
            if (connected && !wasConnected && state.phase === 'waiting-midi') {
                state.nextRoundTimer = setTimeout(startSpinRound, AUTO_NEXT_MS);
            }
        }

        function handleMidiMessage(event) {
            const [status, note, velocity = 0] = event.data;
            const command = status & 0xf0;
            if (command !== 0x90 || velocity < MIDI_MIN_VELOCITY) return;
            const drumId = noteToDrum(note);
            if (!drumId) {
                showMidiPulse(`MIDI 신호 감지 ${note}`);
                return;
            }
            showMidiPulse(`${TEACHER_TARGETS[drumId].label} 입력`);
            if (state.phase === 'ready') {
                playClickSound();
                startSpinRound();
                return;
            }
            handlePlayerHit(drumId);
        }

        function restartGameBtn() {
            playClickSound();
            stopGameLoopAudio();
            bgmAudio.volume = 0.35;
            showIntro();
        }

        function exitGame() {
            playClickSound();
            stopGameLoopAudio();
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'gameExit' }, '*');
            }
            history.back();
        }

        els.btnStart.addEventListener('click', () => {
            playClickSound();
            startGame();
        });
        els.btnAgain.addEventListener('click', () => {
            playClickSound();
            startGame();
        });
        els.roundButton.addEventListener('click', () => {
            playClickSound();
            startSpinRound();
        });
        els.btnHowto.addEventListener('click', () => {
            playClickSound();
            els.howtoModal.classList.remove('hidden');
        });
        els.btnHowtoClose.addEventListener('click', () => {
            playClickSound();
            els.howtoModal.classList.add('hidden');
        });
        els.howtoModal.addEventListener('click', event => {
            if (event.target === els.howtoModal) els.howtoModal.classList.add('hidden');
        });

        window.addEventListener('keydown', event => {
            const keyMap = {
                Digit1: 'crash',
                Digit2: 'tom1',
                Digit3: 'tom2',
                Digit4: 'ride',
                Digit5: 'snare',
                Digit6: 'hihat',
                Digit7: 'floor'
            };
            const drumId = keyMap[event.code];
            if (!drumId) return;
            if (state.phase === 'ready') {
                playClickSound();
                startSpinRound();
                return;
            }
            handlePlayerHit(drumId);
        });

        showIntro();
    </script>
