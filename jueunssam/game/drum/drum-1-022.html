<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>드럼 컬러 점프</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        :root {
            --header-height: 60px;
            --crash: #FF0000;
            --tom1: #FF9F1C;
            --tom2: #FEE500;
            --ride: #2ECC71;
            --snare: #2563EB;
            --hihat: #FF1493;
            --floor: #7E22CE;
            --line: #B9C1F6;
            --line-soft: #DCE1FF;
            --ink: #3F4674;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #fff;
            color: var(--ink);
            font-family: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        .game {
            position: relative;
            width: 100vw;
            height: calc(100vh - var(--header-height));
            margin-top: var(--header-height);
            overflow: hidden;
            background: #fff;
        }

        .bg-flash {
            position: absolute;
            inset: -18%;
            z-index: 0;
            border-radius: 50%;
            background: var(--hit-bg, rgba(255, 255, 255, 0));
            filter: blur(42px);
            opacity: 0;
            transform: translateZ(0) scale(0.72);
            pointer-events: none;
            will-change: opacity, transform;
        }

        .bg-flash.active {
            animation: drum-bg-flash 360ms ease-out;
        }

        @keyframes drum-bg-flash {
            0% {
                opacity: 0.42;
                transform: translateZ(0) scale(0.72);
            }
            55% {
                opacity: 0.24;
                transform: translateZ(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateZ(0) scale(1.16);
            }
        }

        .kakao-header {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
            width: 100%;
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 0 18px;
            color: #3b1e1e;
            background: linear-gradient(135deg, #FEE500 0%, #FBC02D 100%);
            border-bottom: 2px solid rgba(123, 87, 0, 0.22);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.16);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            font-size: clamp(15px, 3.4vw, 22px);
            font-weight: 900;
            white-space: nowrap;
        }

        .header-buttons {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-btn {
            min-height: 36px;
            padding: 7px 14px;
            border: 2px solid rgba(255, 255, 255, 0.72);
            border-radius: 999px;
            color: #3b1e1e;
            background: rgba(255, 255, 255, 0.48);
            font: inherit;
            font-size: clamp(12px, 2.5vw, 14px);
            font-weight: 900;
            cursor: pointer;
        }

        canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .hud {
            position: absolute;
            z-index: 5;
            top: clamp(0.75rem, 1.8vw, 1.15rem);
            left: 50%;
            display: grid;
            grid-template-columns: auto auto auto;
            align-items: center;
            gap: 0.45rem;
            padding: 0.4rem;
            border: 3px solid rgba(255, 255, 255, 0.82);
            border-radius: 1rem;
            background: rgba(255, 255, 255, 0.88);
            box-shadow: 0 0.55rem 1.45rem rgba(63, 70, 116, 0.14);
            transform: translateX(-50%);
            pointer-events: none;
        }

        .hud-card {
            display: grid;
            place-items: center;
            min-width: 5.5rem;
            min-height: 3.1rem;
            padding: 0.35rem 0.75rem;
            border-radius: 0.75rem;
            background: #f4f7ff;
            color: var(--ink);
        }

        .hud-card.score-card {
            min-width: clamp(7.2rem, 16vw, 10rem);
            background: linear-gradient(135deg, var(--hihat), var(--floor));
            color: #fff;
            box-shadow: inset 0 -0.28rem 0 rgba(63, 70, 116, 0.14);
        }

        .hud-label {
            font-size: clamp(0.74rem, 1.4vw, 0.92rem);
            line-height: 1;
            opacity: 0.82;
        }

        .score {
            display: block;
            font-size: clamp(2.05rem, 4.6vw, 3.6rem);
            line-height: 0.95;
        }

        .hud-value {
            display: block;
            font-size: clamp(1.05rem, 2.2vw, 1.55rem);
            line-height: 1.05;
        }

        .target-chip {
            position: absolute;
            z-index: 6;
            left: 50%;
            top: clamp(6.8rem, 11vw, 8.1rem);
            display: flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.55rem 0.9rem;
            border: 2px solid rgba(185, 193, 246, 0.55);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.86);
            color: rgba(63, 70, 116, 0.86);
            font-size: clamp(0.9rem, 1.8vw, 1.2rem);
            transform: translateX(-50%);
            pointer-events: none;
            white-space: nowrap;
        }

        .target-dot {
            width: 1rem;
            height: 1rem;
            border-radius: 0.18rem;
            background: var(--crash);
            box-shadow: 0 0.22rem 0.45rem rgba(63, 70, 116, 0.18);
        }

        .speed-pop {
            position: absolute;
            z-index: 8;
            left: 50%;
            top: 38%;
            min-width: 12rem;
            padding: 0.45rem 1.2rem 0.65rem;
            border: 4px solid rgba(255, 255, 255, 0.92);
            border-radius: 0.85rem;
            background: linear-gradient(135deg, var(--tom2), var(--hihat) 46%, var(--floor));
            color: #fff;
            font-size: clamp(2.7rem, 8vw, 6.2rem);
            font-weight: 900;
            line-height: 0.95;
            text-align: center;
            text-shadow: 0.12rem 0.12rem 0 rgba(63, 70, 116, 0.26);
            transform: translate(-50%, -50%) skew(-10deg) scale(0.72);
            opacity: 0;
            pointer-events: none;
            white-space: nowrap;
        }

        .speed-pop.active {
            animation: speed-pop 880ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes speed-pop {
            0% {
                opacity: 0;
                transform: translate(-50%, -42%) skew(-10deg) scale(0.56) rotate(-5deg);
            }
            16% {
                opacity: 1;
                transform: translate(-50%, -52%) skew(-10deg) scale(1.12) rotate(2deg);
            }
            58% {
                opacity: 1;
                transform: translate(-50%, -50%) skew(-10deg) scale(1) rotate(-1deg);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -66%) skew(-10deg) scale(0.86) rotate(4deg);
            }
        }

        .drum-controls {
            position: absolute;
            z-index: 7;
            left: 50%;
            bottom: clamp(0.35rem, 1.2vw, 0.75rem);
            width: min(54rem, calc(100vw - 1.2rem));
            display: grid;
            grid-template-columns: repeat(8, minmax(0, 1fr));
            gap: 0.42rem;
            transform: translateX(-50%);
            opacity: 0.86;
        }

        .drum-controls button {
            min-width: 0;
            min-height: 2.55rem;
            border: 0;
            border-radius: 0.45rem;
            color: #fff;
            font: inherit;
            font-size: clamp(0.8rem, 1.2vw, 1.03rem);
            box-shadow: 0 0.3rem 0 rgba(63, 70, 116, 0.18);
            cursor: pointer;
            transition: background-color 0.18s ease, color 0.18s ease, transform 0.1s ease, box-shadow 0.1s ease;
        }

        .drum-controls button[data-drum="tom2"] {
            color: #3b1e1e;
        }

        .drum-controls button.is-muted {
            color: rgba(255, 255, 255, 0.72) !important;
            background: #b8bcc9 !important;
        }

        .drum-controls button.is-target {
            outline: 4px solid rgba(63, 70, 116, 0.16);
            outline-offset: 2px;
        }

        .drum-controls button.hit,
        .drum-controls button:active {
            transform: translateY(0.22rem);
            box-shadow: 0 0.08rem 0 rgba(63, 70, 116, 0.18);
        }

        .overlay {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: grid;
            place-items: center;
            padding: 1.2rem;
            background: rgba(255, 255, 255, 0.7);
        }

        .overlay.hidden {
            display: none;
        }

        .panel {
            width: min(39rem, 92vw);
            text-align: center;
        }

        .gameover-overlay {
            background:
                radial-gradient(circle at 20% 18%, rgba(255, 20, 147, 0.2), transparent 24rem),
                radial-gradient(circle at 80% 24%, rgba(254, 229, 0, 0.22), transparent 22rem),
                rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(3px);
        }

        .gameover-panel {
            position: relative;
            width: min(42rem, 92vw);
            padding: clamp(1.25rem, 4vw, 2.2rem);
            border: 4px solid rgba(255, 255, 255, 0.9);
            border-radius: 1.6rem;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 1.3rem 3rem rgba(63, 70, 116, 0.2);
            text-align: center;
            overflow: hidden;
        }

        .gameover-panel::before,
        .gameover-panel::after {
            content: "";
            position: absolute;
            width: 3.2rem;
            height: 3.2rem;
            border-radius: 0.45rem;
            opacity: 0.18;
            transform: rotate(18deg);
        }

        .gameover-panel::before {
            top: 1rem;
            left: 1.2rem;
            background: var(--tom2);
        }

        .gameover-panel::after {
            right: 1.5rem;
            bottom: 1.4rem;
            background: var(--floor);
            transform: rotate(-14deg);
        }

        .gameover-kicker {
            position: relative;
            margin: 0 0 0.35rem;
            color: rgba(63, 70, 116, 0.68);
            font-size: clamp(1rem, 2.3vw, 1.25rem);
            letter-spacing: 0;
        }

        .gameover-logo {
            margin-bottom: 0.5rem;
        }

        .final-score-card {
            position: relative;
            width: min(23rem, 100%);
            margin: 0 auto 1rem;
            padding: 0.85rem 1rem 0.7rem;
            border-radius: 1rem;
            background: linear-gradient(135deg, rgba(255, 20, 147, 0.92), rgba(126, 34, 206, 0.92));
            color: #fff;
            box-shadow: 0 0.55rem 0 rgba(63, 70, 116, 0.14);
        }

        .final-score-label {
            display: block;
            font-size: clamp(0.95rem, 2vw, 1.15rem);
        }

        .final-score {
            display: block;
            font-size: clamp(3rem, 8vw, 5.6rem);
            line-height: 0.95;
        }

        .gameover-stats {
            position: relative;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 0.5rem;
            margin: 0 auto 0.9rem;
        }

        .gameover-stats span {
            min-width: 0;
            padding: 0.6rem 0.35rem;
            border-radius: 0.8rem;
            background: #f4f7ff;
            color: var(--ink);
        }

        .gameover-stats b,
        .gameover-stats small {
            display: block;
        }

        .gameover-stats b {
            font-size: clamp(1.25rem, 3vw, 2rem);
            line-height: 1.05;
        }

        .gameover-stats small {
            margin-top: 0.1rem;
            font-size: clamp(0.78rem, 1.8vw, 0.95rem);
            color: rgba(63, 70, 116, 0.72);
        }

        .gameover-summary {
            position: relative;
            margin-bottom: 1rem;
        }

        .logo {
            margin: 0 0 1.1rem;
            display: flex;
            justify-content: center;
            gap: 0.03em;
            font-size: clamp(3.4rem, 8.8vw, 7rem);
            line-height: 0.92;
        }

        .logo span:nth-child(7n+1) { color: var(--crash); }
        .logo span:nth-child(7n+2) { color: var(--tom1); }
        .logo span:nth-child(7n+3) { color: var(--tom2); }
        .logo span:nth-child(7n+4) { color: var(--ride); }
        .logo span:nth-child(7n+5) { color: var(--snare); }
        .logo span:nth-child(7n+6) { color: var(--hihat); }
        .logo span:nth-child(7n) { color: var(--floor); }

        .play-button {
            min-width: 10rem;
            min-height: 3.8rem;
            border: 0;
            border-radius: 0.55rem;
            background: var(--hihat);
            color: #fff;
            font: inherit;
            font-size: clamp(1.6rem, 4vw, 2.7rem);
            box-shadow: 0 0.45rem 0 rgba(63, 70, 116, 0.16);
            cursor: pointer;
        }

        .intro-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.8rem;
        }

        .midi-status {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            margin-top: 1rem;
            min-height: 2.45rem;
            padding: 0.45rem 0.85rem;
            border: 2px solid rgba(63, 70, 116, 0.12);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.88);
            color: rgba(63, 70, 116, 0.78);
            font-size: clamp(0.95rem, 2.2vw, 1.15rem);
            box-shadow: 0 0.25rem 0 rgba(63, 70, 116, 0.08);
        }

        .midi-status::before {
            content: "";
            width: 0.8rem;
            height: 0.8rem;
            border-radius: 999px;
            background: #b8bcc9;
            box-shadow: 0 0 0 0.28rem rgba(184, 188, 201, 0.2);
        }

        .midi-status[data-status="connected"] {
            color: #1f7a45;
        }

        .midi-status[data-status="connected"]::before {
            background: var(--ride);
            box-shadow: 0 0 0 0.28rem rgba(46, 204, 113, 0.18);
        }

        .midi-status[data-status="missing"],
        .midi-status[data-status="blocked"] {
            color: #9b2f55;
        }

        .midi-status[data-status="missing"]::before,
        .midi-status[data-status="blocked"]::before {
            background: var(--hihat);
            box-shadow: 0 0 0 0.28rem rgba(255, 20, 147, 0.14);
        }

        .howto-button {
            min-width: 10rem;
            min-height: 3.8rem;
            border: 3px solid rgba(63, 70, 116, 0.15);
            border-radius: 0.55rem;
            background: rgba(255, 255, 255, 0.92);
            color: var(--ink);
            font: inherit;
            font-size: clamp(1.25rem, 3vw, 2rem);
            box-shadow: 0 0.45rem 0 rgba(63, 70, 116, 0.12);
            cursor: pointer;
        }

        .hint {
            margin: 1rem auto 0;
            color: rgba(63, 70, 116, 0.82);
            font-size: clamp(0.98rem, 2vw, 1.35rem);
            line-height: 1.45;
        }

        .howto-modal {
            z-index: 30;
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(4px);
        }

        .howto-panel {
            width: min(42rem, 92vw);
            padding: clamp(1.25rem, 4vw, 2rem);
            border: 4px solid rgba(255, 255, 255, 0.88);
            border-radius: 1.6rem;
            background: rgba(255, 255, 255, 0.96);
            box-shadow: 0 1.2rem 3rem rgba(63, 70, 116, 0.18);
            text-align: center;
        }

        .howto-title {
            margin: 0 0 0.9rem;
            color: var(--ink);
            font-size: clamp(2rem, 6vw, 3.6rem);
            line-height: 1;
        }

        .howto-steps {
            display: grid;
            gap: 0.65rem;
            margin: 1rem 0;
            text-align: left;
        }

        .howto-step {
            display: grid;
            grid-template-columns: 3rem minmax(0, 1fr);
            gap: 0.8rem;
            align-items: center;
            padding: 0.85rem;
            border-radius: 1rem;
            background: #f4f7ff;
            color: rgba(63, 70, 116, 0.92);
            font-size: clamp(1.05rem, 2.6vw, 1.45rem);
            line-height: 1.25;
        }

        .howto-icon {
            display: grid;
            place-items: center;
            width: 3rem;
            height: 3rem;
            border-radius: 999px;
            background: #fff;
            box-shadow: inset 0 -0.2rem 0 rgba(63, 70, 116, 0.08);
            font-size: 1.6rem;
        }

        .howto-colors {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.45rem;
            margin: 1rem 0 1.2rem;
        }

        .howto-color {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            min-height: 2.1rem;
            padding: 0.35rem 0.65rem;
            border-radius: 999px;
            background: #f4f7ff;
            color: var(--ink);
            font-size: clamp(0.9rem, 2.2vw, 1.05rem);
        }

        .howto-swatch {
            width: 0.95rem;
            height: 0.95rem;
            border-radius: 0.2rem;
            box-shadow: 0 0.12rem 0.28rem rgba(63, 70, 116, 0.18);
        }

        .howto-close {
            min-width: 9rem;
            min-height: 3.1rem;
            border: 0;
            border-radius: 999px;
            background: var(--hihat);
            color: #fff;
            font: inherit;
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            box-shadow: 0 0.35rem 0 rgba(63, 70, 116, 0.15);
            cursor: pointer;
        }

        @media (max-width: 720px) {
            .target-chip {
                top: 9.1rem;
                max-width: calc(100vw - 1rem);
                white-space: normal;
                justify-content: center;
                text-align: center;
            }

            .hud {
                grid-template-columns: 1fr 1fr;
                width: min(23rem, calc(100vw - 1rem));
                gap: 0.32rem;
            }

            .hud-card.score-card {
                grid-column: 1 / -1;
            }

            .drum-controls {
                gap: 0.3rem;
            }

            .intro-actions {
                gap: 0.55rem;
            }

            .play-button,
            .howto-button {
                min-height: 3.2rem;
            }

            .gameover-stats {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
    </style>
</head>

<body>
    <header class="kakao-header">
        <div class="header-title">🎚️ 드럼 컬러 점프</div>
        <div class="header-buttons">
            <button class="header-btn" type="button" onclick="restartGameBtn()">🔄 다시시작</button>
            <button class="header-btn" type="button" onclick="exitGame()">❌ 학습종료</button>
        </div>
    </header>

    <main class="game">
        <div class="bg-flash" id="bg-flash"></div>
        <canvas id="game-canvas"></canvas>

        <section class="hud">
            <div class="hud-card score-card">
                <span class="hud-label">Score</span>
                <strong class="score" id="score">0</strong>
            </div>
            <div class="hud-card">
                <span class="hud-label">Combo</span>
                <strong class="hud-value" id="combo">0</strong>
            </div>
            <div class="hud-card">
                <span class="hud-label">Speed</span>
                <strong class="hud-value" id="speed-readout">0.7x</strong>
            </div>
        </section>

        <div class="target-chip" id="target-chip">
            <span class="target-dot" id="target-dot"></span>
            <span id="target-label">크래쉬 심벌을 두드리세요</span>
        </div>
        <div class="speed-pop" id="speed-pop" aria-live="polite"></div>

        <div class="drum-controls" id="drum-controls"></div>

        <section class="overlay" id="start-overlay">
            <div class="panel">
                <p class="logo">
                    <span>J</span><span>u</span><span>m</span><span>p</span>
                </p>
                <div class="intro-actions">
                    <button class="play-button" id="btn-start" type="button">Play</button>
                    <button class="howto-button" id="btn-howto" type="button">게임방법</button>
                </div>
                <div class="midi-status" id="midi-status" data-status="checking">드럼 연결 확인 중</div>
            </div>
        </section>

        <section class="overlay howto-modal hidden" id="howto-modal" aria-modal="true" role="dialog" aria-labelledby="howto-title">
            <div class="howto-panel">
                <h2 class="howto-title" id="howto-title">게임방법</h2>
                <div class="howto-steps">
                    <div class="howto-step">
                        <span class="howto-icon">1</span>
                        <span>블럭이 앞으로 점프해요.</span>
                    </div>
                    <div class="howto-step">
                        <span class="howto-icon">2</span>
                        <span>다음 블럭 색을 보고, 같은 색 드럼을 쳐요.</span>
                    </div>
                    <div class="howto-step">
                        <span class="howto-icon">3</span>
                        <span>색이 같으면 앞으로 폴짝! 틀리면 떨어져요.</span>
                    </div>
                </div>
                <div class="howto-colors" aria-label="드럼 색상">
                    <span class="howto-color"><span class="howto-swatch" style="background:#FF0000"></span>크래쉬</span>
                    <span class="howto-color"><span class="howto-swatch" style="background:#FF9F1C"></span>탐1</span>
                    <span class="howto-color"><span class="howto-swatch" style="background:#FEE500"></span>탐2</span>
                    <span class="howto-color"><span class="howto-swatch" style="background:#2ECC71"></span>라이드</span>
                    <span class="howto-color"><span class="howto-swatch" style="background:#2563EB"></span>스네어</span>
                    <span class="howto-color"><span class="howto-swatch" style="background:#FF1493"></span>하이햇</span>
                    <span class="howto-color"><span class="howto-swatch" style="background:#7E22CE"></span>플로어탐</span>
                </div>
                <button class="howto-close" id="btn-howto-close" type="button">알겠어요</button>
            </div>
        </section>

        <section class="overlay hidden gameover-overlay" id="stop-overlay">
            <div class="gameover-panel">
                <p class="gameover-kicker">GAME OVER</p>
                <p class="logo gameover-logo"><span>G</span><span>a</span><span>m</span><span>e</span></p>
                <div class="final-score-card">
                    <span class="final-score-label">Score</span>
                    <strong class="final-score" id="final-score">0</strong>
                </div>
                <div class="gameover-stats" aria-label="게임 결과">
                    <span><b id="final-rounds">0</b><small>라운드</small></span>
                    <span><b id="final-combo">0</b><small>최고 콤보</small></span>
                    <span><b id="final-speed">1.0x</b><small>마지막 속도</small></span>
                    <span><b id="final-bonus">0</b><small>색상 보너스</small></span>
                </div>
                <p class="hint gameover-summary" id="final-text">0번 버텼어요.</p>
                <button class="play-button" id="btn-again" type="button">Again</button>
            </div>
        </section>
    </main>

    <script>
        const COLOR_ORDER = ['crash', 'tom1', 'tom2', 'ride', 'snare', 'hihat', 'floor'];
        const DRUM_NOTE_DEFINITIONS = {
            crash: { notes: [49, 52, 55, 57] },
            tom1: { notes: [48, 50] },
            tom2: { notes: [45, 47] },
            ride: { notes: [51, 59, 53] },
            snare: { notes: [38, 40, 31, 34, 37] },
            hihat: { notes: [42, 44, 46, 22, 26] },
            floor: { notes: [41, 43] }
        };
        const DRUMS = {
            crash: { label: '크래쉬 심벌', color: '#FF0000', notes: DRUM_NOTE_DEFINITIONS.crash.notes, key: 'Q' },
            tom1: { label: '탐1', color: '#FF9F1C', notes: DRUM_NOTE_DEFINITIONS.tom1.notes, key: 'W' },
            tom2: { label: '탐2', color: '#FEE500', notes: DRUM_NOTE_DEFINITIONS.tom2.notes, key: 'E', text: '#3b1e1e' },
            ride: { label: '라이드 심벌', color: '#2ECC71', notes: DRUM_NOTE_DEFINITIONS.ride.notes, key: 'R' },
            snare: { label: '스네어', color: '#2563EB', notes: DRUM_NOTE_DEFINITIONS.snare.notes, key: 'A' },
            hihat: { label: '하이햇', color: '#FF1493', notes: DRUM_NOTE_DEFINITIONS.hihat.notes, key: 'S' },
            floor: { label: '플로어탐', color: '#7E22CE', notes: DRUM_NOTE_DEFINITIONS.floor.notes, key: 'D' }
        };
        const MIDI_MAP = buildMidiMap(DRUM_NOTE_DEFINITIONS);
        const MIDI_NOTE_TO_DRUM = buildMidiNoteToDrum(MIDI_MAP);
        const MIDI_MIN_VELOCITY = 8;
        const MIDI_BURST_WINDOW_MS = 45;
        const MIDI_AFTER_HIT_LOCK_MS = 180;
        const MIDI_GHOST_VELOCITY_GAP = 24;
        const MIDI_PRIORITY = ['crash', 'ride', 'hihat', 'snare', 'floor', 'tom1', 'tom2'];
        const RIGHT_HEAVY_ANGLE = 0.18;
        const RIGHT_REST_ANGLE = 0.12;
        const LEFT_IMPACT_ANGLE = -0.32;
        const IMPACT_HOLD_MS = 760;
        const BASE_GRAVITY = 320;
        const LAUNCH_SAFE_TOP = 36;
        const LAUNCH_APEX_BASE_MAX = 320;
        const LAUNCH_APEX_SCALE = 1.5;
        const LAUNCH_APEX_MAX = 480;
        const INPUT_MEMORY_MS = 2200;
        const CONTROL_FULL_COLOR_ROUND = 8;
        const SPEED_PER_ROUND = 0.045;
        const SPEED_MILESTONE_ROUND = 5;
        const SPEED_MILESTONE_BONUS = 0.08;
        const MAX_SPEED = 2.35;
        const SCORE_CONFIG = {
            roundBase: 100,
            comboStep: 15,
            speedStep: 25,
            perfectColorBonus: 35
        };

        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const bgFlashEl = document.getElementById('bg-flash');
        const scoreEl = document.getElementById('score');
        const comboEl = document.getElementById('combo');
        const speedReadoutEl = document.getElementById('speed-readout');
        const targetDotEl = document.getElementById('target-dot');
        const targetLabelEl = document.getElementById('target-label');
        const speedPopEl = document.getElementById('speed-pop');
        const controlsEl = document.getElementById('drum-controls');
        const startOverlay = document.getElementById('start-overlay');
        const stopOverlay = document.getElementById('stop-overlay');
        const finalText = document.getElementById('final-text');
        const howtoModal = document.getElementById('howto-modal');
        const btnHowto = document.getElementById('btn-howto');
        const btnHowtoClose = document.getElementById('btn-howto-close');
        const midiStatusEl = document.getElementById('midi-status');
        const finalScoreEl = document.getElementById('final-score');
        const finalRoundsEl = document.getElementById('final-rounds');
        const finalComboEl = document.getElementById('final-combo');
        const finalSpeedEl = document.getElementById('final-speed');
        const finalBonusEl = document.getElementById('final-bonus');

        const state = {
            running: false,
            phase: 'intro',
            roundReady: false,
            score: 0,
            combo: 0,
            bestCombo: 0,
            rounds: 0,
            scoreBreakdown: {
                base: 0,
                combo: 0,
                speed: 0,
                bonus: 0
            },
            speed: speedForRound(0),
            selectedColor: null,
            targetBlock: null,
            incoming: null,
            launched: [],
            currentSeesaw: 0,
            transitionToken: 0,
            transitionTimer: 0,
            landingGraceUntil: 0,
            roundStartedAt: 0,
            lastInputDrumId: null,
            lastInputAt: 0,
            midiBuffer: [],
            midiTimer: 0,
            midiLockUntil: 0,
            cameraX: 0,
            targetCameraX: 0,
            seesawAngle: 0,
            targetAngle: 0,
            impactPulse: 0,
            lastTime: 0,
            raf: 0,
            audio: null,
            speedPopTimer: 0,
            bgHitTimer: 0,
            metrics: {
                width: 0,
                height: 0,
                dpr: 1,
                baseCenterX: 0,
                centerY: 0,
                seesawSpacing: 0,
                seesawLength: 0,
                blockSize: 0
            }
        };

        function clamp(value, min, max) {
            return Math.max(min, Math.min(max, value));
        }

        function randomColor(except) {
            let color = COLOR_ORDER[Math.floor(Math.random() * COLOR_ORDER.length)];
            while (color === except) color = COLOR_ORDER[Math.floor(Math.random() * COLOR_ORDER.length)];
            return color;
        }

        function resizeCanvas() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const width = window.innerWidth;
            const height = window.innerHeight;
            canvas.width = Math.round(width * dpr);
            canvas.height = Math.round(height * dpr);
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            const seesawLength = clamp(width * 0.48, 250, 520);
            const blockSize = clamp(width * 0.045, 28, 48);
            const baseCenterX = width * 0.33;
            const seesawSpacing = clamp(width * 0.45, seesawLength * 0.92, seesawLength * 1.2);
            const centerY = clamp(height * 0.72, height * 0.55, height - 247);
            state.metrics = { width, height, dpr, baseCenterX, centerY, seesawSpacing, seesawLength, blockSize };
            state.cameraX = state.currentSeesaw * seesawSpacing;
            state.targetCameraX = state.currentSeesaw * seesawSpacing;
        }

        function sideSign(side) {
            return side === 'left' ? -1 : 1;
        }

        function getSeesawCenter(index = state.currentSeesaw) {
            return state.metrics.baseCenterX + index * state.metrics.seesawSpacing;
        }

        function getEndPoint(side, angle = state.seesawAngle, centerX = getSeesawCenter()) {
            const { centerY, seesawLength } = state.metrics;
            const half = seesawLength / 2;
            const sign = sideSign(side);
            return {
                x: centerX + Math.cos(angle) * half * sign,
                y: centerY + Math.sin(angle) * half * sign
            };
        }

        function getBlockOnSeesaw(side, seesawIndex = state.currentSeesaw, angle = state.seesawAngle) {
            const point = getEndPoint(side, angle, getSeesawCenter(seesawIndex));
            return {
                x: point.x,
                y: point.y - state.metrics.blockSize * 0.52,
                angle
            };
        }

        function spawnIncomingFromLeft(colorId, seesawIndex = state.currentSeesaw) {
            const point = getEndPoint('left', state.targetAngle, getSeesawCenter(seesawIndex));
            const startOffset = state.metrics.height * 0.82;
            state.incoming = {
                side: 'left',
                colorId,
                seesawIndex,
                x: point.x - state.metrics.seesawLength * 0.12,
                y: point.y - startOffset,
                vx: 18,
                vy: 0,
                angle: -0.25,
                va: -2.15,
                landed: false
            };
        }

        function makeNextTargetColor(incomingColor) {
            return randomColor(incomingColor);
        }

        function multiplierFor(combo) {
            return 1 + Math.min(2.5, combo * 0.08);
        }

        function speedForRound(rounds) {
            const gradualBoost = rounds * SPEED_PER_ROUND;
            const milestoneBoost = Math.floor(rounds / SPEED_MILESTONE_ROUND) * SPEED_MILESTONE_BONUS;
            return Math.min(MAX_SPEED, Number((0.72 + gradualBoost + milestoneBoost).toFixed(2)));
        }

        function getProjectileFlightTime(startY, targetY, vy, gravity) {
            const deltaY = startY - targetY;
            const discriminant = Math.max(0, vy * vy - 2 * gravity * deltaY);
            return Math.max(0.8, (-vy + Math.sqrt(discriminant)) / gravity);
        }

        function gravityForSpeed(speed) {
            return BASE_GRAVITY * speed * speed;
        }

        function getLaunchApexHeight(startY) {
            const safeTop = Math.max(LAUNCH_SAFE_TOP, state.metrics.height * 0.11);
            const availableHeight = startY - safeTop - state.metrics.blockSize * 0.7;
            const baseApexHeight = Math.max(state.metrics.blockSize * 2.2, Math.min(LAUNCH_APEX_BASE_MAX, availableHeight));
            return Math.max(state.metrics.blockSize * 2.2, Math.min(LAUNCH_APEX_MAX, baseApexHeight * LAUNCH_APEX_SCALE, availableHeight));
        }

        function getLaunchVelocity(startY, speed) {
            return -Math.sqrt(2 * gravityForSpeed(speed) * getLaunchApexHeight(startY));
        }

        function showSpeedPop(speed) {
            speedPopEl.textContent = `SPEED x${speed.toFixed(1)}!`;
            speedPopEl.classList.remove('active');
            void speedPopEl.offsetWidth;
            speedPopEl.classList.add('active');
            clearTimeout(state.speedPopTimer);
            state.speedPopTimer = window.setTimeout(() => {
                speedPopEl.classList.remove('active');
                state.speedPopTimer = 0;
            }, 900);
        }

        function hexToRgb(hex) {
            const value = hex.replace('#', '');
            const number = parseInt(value, 16);
            return {
                r: (number >> 16) & 255,
                g: (number >> 8) & 255,
                b: number & 255
            };
        }

        function flashGameBackground(drumId) {
            const drum = DRUMS[drumId];
            if (!drum) return;
            const { r, g, b } = hexToRgb(drum.color);
            bgFlashEl.style.setProperty('--hit-bg', `rgba(${r}, ${g}, ${b}, 0.5)`);
            bgFlashEl.classList.remove('active');
            void bgFlashEl.offsetWidth;
            bgFlashEl.classList.add('active');
            clearTimeout(state.bgHitTimer);
            state.bgHitTimer = window.setTimeout(() => {
                bgFlashEl.classList.remove('active');
                state.bgHitTimer = 0;
            }, 380);
        }

        function awardLandingScore() {
            const base = SCORE_CONFIG.roundBase;
            const comboBonus = Math.round(state.combo * SCORE_CONFIG.comboStep * multiplierFor(state.combo));
            const speedBonus = Math.round((state.speed - 1) * SCORE_CONFIG.speedStep);
            const bonus = state.selectedColor === state.targetBlock?.colorId ? SCORE_CONFIG.perfectColorBonus : 0;
            state.scoreBreakdown.base += base;
            state.scoreBreakdown.combo += comboBonus;
            state.scoreBreakdown.speed += speedBonus;
            state.scoreBreakdown.bonus += bonus;
            state.score += base + comboBonus + speedBonus + bonus;
        }

        function clearTransitionTimer() {
            if (state.transitionTimer) {
                clearTimeout(state.transitionTimer);
                state.transitionTimer = 0;
            }
        }

        function clearMidiInput() {
            if (state.midiTimer) {
                clearTimeout(state.midiTimer);
                state.midiTimer = 0;
            }
            state.midiBuffer = [];
            state.midiLockUntil = 0;
        }

        function updateHud() {
            scoreEl.textContent = state.score.toLocaleString();
            comboEl.textContent = state.combo;
            speedReadoutEl.textContent = `${state.speed.toFixed(1)}x`;
            if (state.targetBlock) {
                const drum = DRUMS[state.targetBlock.colorId];
                targetDotEl.style.backgroundColor = drum.color;
                targetLabelEl.textContent = `${drum.label}을 두드리세요`;
            }
            updateControlHints();
        }

        function startGame() {
            ensureAudio();
            resizeCanvas();
            state.running = true;
            state.phase = 'playing';
            state.roundReady = true;
            state.score = 0;
            state.combo = 0;
            state.bestCombo = 0;
            state.rounds = 0;
            state.scoreBreakdown = { base: 0, combo: 0, speed: 0, bonus: 0 };
            state.speed = speedForRound(0);
            state.selectedColor = null;
            state.launched = [];
            clearTimeout(state.speedPopTimer);
            state.speedPopTimer = 0;
            clearTimeout(state.bgHitTimer);
            state.bgHitTimer = 0;
            bgFlashEl.classList.remove('active');
            speedPopEl.classList.remove('active');
            clearMidiInput();
            clearTransitionTimer();
            state.transitionToken += 1;
            state.currentSeesaw = 0;
            state.cameraX = 0;
            state.targetCameraX = 0;
            state.landingGraceUntil = 0;
            state.roundStartedAt = performance.now();
            state.lastInputDrumId = null;
            state.lastInputAt = 0;
            state.seesawAngle = RIGHT_HEAVY_ANGLE;
            state.targetAngle = RIGHT_HEAVY_ANGLE;
            state.impactPulse = 0;
            state.targetBlock = { side: 'right', colorId: 'crash', seesawIndex: state.currentSeesaw };
            spawnIncomingFromLeft(randomColor(state.targetBlock.colorId));
            updateHud();
            startOverlay.classList.add('hidden');
            stopOverlay.classList.add('hidden');
            howtoModal.classList.add('hidden');
            cancelAnimationFrame(state.raf);
            state.lastTime = performance.now();
            state.raf = requestAnimationFrame(loop);
        }

        function stopGame() {
            state.running = false;
            state.phase = 'gameover';
            state.roundReady = false;
            state.landingGraceUntil = 0;
            clearMidiInput();
            clearTransitionTimer();
            cancelAnimationFrame(state.raf);
            playTone('bad');
            finalScoreEl.textContent = state.score.toLocaleString();
            finalRoundsEl.textContent = state.rounds;
            finalComboEl.textContent = state.bestCombo;
            finalSpeedEl.textContent = `${state.speed.toFixed(1)}x`;
            finalBonusEl.textContent = state.scoreBreakdown.bonus.toLocaleString();
            finalText.textContent = `${state.rounds}번 버텼어요. 다시 하면 더 멀리 갈 수 있어요.`;
            stopOverlay.classList.remove('hidden');
        }

        function rememberInput(drumId) {
            state.lastInputDrumId = drumId;
            state.lastInputAt = performance.now();
        }

        function hasRecentTargetInput(now = performance.now()) {
            return Boolean(
                state.targetBlock &&
                state.lastInputDrumId === state.targetBlock.colorId &&
                state.lastInputAt >= state.roundStartedAt &&
                now - state.lastInputAt <= INPUT_MEMORY_MS
            );
        }

        function isLandingMatched(now = performance.now()) {
            return Boolean(
                state.incoming?.colorId === state.targetBlock?.colorId ||
                state.selectedColor === state.targetBlock?.colorId ||
                hasRecentTargetInput(now)
            );
        }

        function chooseDrum(drumId) {
            if (!state.running) startGame();
            rememberInput(drumId);
            flashButton(drumId);
            flashGameBackground(drumId);
            playTone(drumId);
            const canRecolor = state.phase === 'playing' && state.roundReady && state.targetBlock && state.incoming && !state.incoming.landed;
            if (!canRecolor) return;
            state.selectedColor = drumId;
            state.incoming.colorId = drumId;
            updateControlHints();
        }

        function resolveLanding() {
            if (!state.incoming || state.incoming.landed || !state.targetBlock) return;
            state.incoming.landed = true;

            const matchedColor = isLandingMatched();
            if (!matchedColor) {
                stopGame();
                return;
            }
            state.incoming.colorId = state.targetBlock.colorId;

            const oldIndex = state.currentSeesaw;
            const nextIndex = oldIndex + 1;
            const oldTarget = getBlockOnSeesaw('right', oldIndex);
            const nextLeft = getBlockOnSeesaw('left', nextIndex, RIGHT_REST_ANGLE);
            state.combo += 1;
            state.rounds += 1;
            state.bestCombo = Math.max(state.bestCombo, state.combo);
            awardLandingScore();
            const previousSpeedLabel = state.speed.toFixed(1);
            state.speed = speedForRound(state.rounds);
            if (state.speed.toFixed(1) !== previousSpeedLabel) showSpeedPop(state.speed);
            state.impactPulse = 1;
            state.phase = 'impact';
            state.roundReady = false;
            state.transitionToken += 1;
            const transitionToken = state.transitionToken;
            const carriedColor = state.targetBlock.colorId;
            state.selectedColor = null;
            state.landingGraceUntil = 0;
            state.targetBlock = null;
            state.targetAngle = LEFT_IMPACT_ANGLE;
            const gravity = gravityForSpeed(state.speed);
            const launchVy = getLaunchVelocity(oldTarget.y, state.speed);
            const flightTime = getProjectileFlightTime(oldTarget.y, nextLeft.y, launchVy, gravity);
            state.incoming = {
                side: 'left',
                colorId: carriedColor,
                seesawIndex: nextIndex,
                x: oldTarget.x,
                y: oldTarget.y,
                vx: (nextLeft.x - oldTarget.x) / flightTime,
                vy: launchVy,
                angle: state.seesawAngle,
                va: 5.4,
                landed: false,
                carried: true
            };
            clearTransitionTimer();
            state.transitionTimer = setTimeout(() => {
                if (!state.running || state.transitionToken !== transitionToken) return;
                state.currentSeesaw = nextIndex;
                state.targetCameraX = state.currentSeesaw * state.metrics.seesawSpacing;
                state.targetBlock = { side: 'right', colorId: makeNextTargetColor(carriedColor), seesawIndex: state.currentSeesaw };
                state.seesawAngle = RIGHT_REST_ANGLE;
                state.targetAngle = RIGHT_HEAVY_ANGLE;
                state.phase = 'playing';
                state.roundReady = true;
                state.roundStartedAt = performance.now();
                state.lastInputDrumId = null;
                state.lastInputAt = 0;
                state.transitionTimer = 0;
                updateHud();
            }, IMPACT_HOLD_MS);
            playTone('good');
            updateHud();
        }

        function updatePhysics(dt) {
            const incoming = state.incoming;
            const gravity = gravityForSpeed(state.speed);
            const landingPoint = incoming ? getEndPoint('left', state.seesawAngle, getSeesawCenter(incoming.seesawIndex)) : null;

            state.seesawAngle += (state.targetAngle - state.seesawAngle) * Math.min(1, dt * 8);
            state.cameraX += (state.targetCameraX - state.cameraX) * Math.min(1, dt * 3.2);
            state.impactPulse = Math.max(0, state.impactPulse - dt * 4.8);

            if (incoming && !incoming.landed) {
                incoming.vy += gravity * dt;
                incoming.x += incoming.vx * dt;
                incoming.y += incoming.vy * dt;
                incoming.angle += incoming.va * dt;

                if (state.phase === 'playing' && state.roundReady && incoming.y > state.metrics.height + state.metrics.blockSize * 1.5) {
                    stopGame();
                    return;
                }

                const blockHalf = state.metrics.blockSize / 2;
                const hitY = landingPoint.y - blockHalf;
                const closeX = Math.abs(incoming.x - landingPoint.x) < state.metrics.blockSize * 1.35;
                if (state.phase === 'playing' && state.roundReady && state.targetBlock && incoming.y >= hitY && closeX && incoming.vy > 0) {
                    incoming.x = landingPoint.x;
                    incoming.y = hitY;
                    incoming.angle = state.seesawAngle - 0.08;
                    incoming.vx = 0;
                    incoming.vy = 0;
                    incoming.va = 0;
                    const matchedColor = isLandingMatched();
                    if (!matchedColor) {
                        stopGame();
                        return;
                    }
                    state.targetAngle = LEFT_IMPACT_ANGLE;
                    resolveLanding();
                }
            }

            state.launched = state.launched.filter(block => {
                block.vy += gravity * 0.8 * dt;
                block.x += block.vx * dt;
                block.y += block.vy * dt;
                block.angle += block.va * dt;
                block.life -= dt * 0.55;
                return block.life > 0 && block.y < state.metrics.height + 120;
            });
        }

        function drawRoundedBlock(x, y, size, angle, color, alpha = 1) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(x, y);
            ctx.rotate(angle);
            const radius = size * 0.11;
            const half = size / 2;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.roundRect(-half, -half, size, size, radius);
            ctx.fill();
            ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
            ctx.fillRect(-half + size * 0.18, -half + size * 0.1, size * 0.12, size * 0.56);
            ctx.restore();
        }

        function drawSeesaw() {
            const { centerY, seesawLength, blockSize } = state.metrics;
            const pulse = state.impactPulse;

            [state.currentSeesaw - 1, state.currentSeesaw, state.currentSeesaw + 1]
                .filter(seesawIndex => seesawIndex >= 0)
                .forEach(seesawIndex => {
                const centerX = getSeesawCenter(seesawIndex);
                const isActive = seesawIndex === state.currentSeesaw;
                ctx.save();
                ctx.globalAlpha = isActive ? 1 : 0.36;
                ctx.translate(centerX, centerY);
                ctx.rotate(isActive ? state.seesawAngle + Math.sin(pulse * Math.PI) * 0.035 : RIGHT_REST_ANGLE);
                ctx.strokeStyle = '#B9C1F6';
                ctx.lineWidth = clamp(blockSize * 0.13, 4, 7);
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(-seesawLength / 2, 0);
                ctx.lineTo(seesawLength / 2, 0);
                ctx.stroke();
                ctx.restore();

                ctx.save();
                ctx.globalAlpha = isActive ? 1 : 0.3;
                ctx.strokeStyle = '#DCE1FF';
                ctx.lineWidth = clamp(blockSize * 0.12, 4, 6);
                ctx.lineJoin = 'round';
                ctx.beginPath();
                ctx.moveTo(centerX, centerY + blockSize * 0.08);
                ctx.lineTo(centerX - blockSize * 0.36, centerY + blockSize * 0.78);
                ctx.lineTo(centerX + blockSize * 0.36, centerY + blockSize * 0.78);
                ctx.closePath();
                ctx.stroke();
                ctx.restore();
            });
        }

        function render() {
            const { width, height, blockSize } = state.metrics;
            ctx.clearRect(0, 0, width, height);

            ctx.save();
            ctx.translate(-state.cameraX, 0);
            drawSeesaw();

            if (state.targetBlock) {
                const pos = getBlockOnSeesaw('right', state.targetBlock.seesawIndex);
                const color = DRUMS[state.targetBlock.colorId].color;
                const selected = state.selectedColor === state.targetBlock.colorId;
                if (selected) {
                    ctx.save();
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 4;
                    ctx.globalAlpha = 0.22 + Math.sin(performance.now() / 80) * 0.08;
                    ctx.beginPath();
                    ctx.roundRect(pos.x - blockSize * 0.68, pos.y - blockSize * 0.68, blockSize * 1.36, blockSize * 1.36, blockSize * 0.18);
                    ctx.stroke();
                    ctx.restore();
                }
                drawRoundedBlock(pos.x, pos.y, blockSize, pos.angle, color);
            }

            if (state.incoming && !state.incoming.landed) {
                drawRoundedBlock(
                    state.incoming.x,
                    state.incoming.y,
                    blockSize,
                    state.incoming.angle,
                    DRUMS[state.incoming.colorId].color
                );
            }

            state.launched.forEach(block => {
                drawRoundedBlock(block.x, block.y, blockSize, block.angle, DRUMS[block.colorId].color, clamp(block.life, 0, 1));
            });
            ctx.restore();
        }

        function loop(now) {
            const dt = Math.min(0.033, (now - state.lastTime) / 1000 || 0.016);
            state.lastTime = now;
            updatePhysics(dt);
            render();
            if (state.running) state.raf = requestAnimationFrame(loop);
        }

        function ensureAudio() {
            if (!state.audio) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) state.audio = new AudioContext();
            }
            if (state.audio && state.audio.state === 'suspended') state.audio.resume();
        }

        function playTone(kind) {
            ensureAudio();
            if (!state.audio) return;
            const freqMap = { good: 760, crash: 740, tom1: 360, tom2: 420, ride: 620, snare: 280, hihat: 980, floor: 190, bad: 110 };
            const now = state.audio.currentTime;
            const osc = state.audio.createOscillator();
            const gain = state.audio.createGain();
            osc.type = kind === 'hihat' || kind === 'crash' || kind === 'ride' ? 'square' : 'sine';
            osc.frequency.setValueAtTime(freqMap[kind] || 440, now);
            gain.gain.setValueAtTime(kind === 'bad' ? 0.16 : 0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
            osc.connect(gain).connect(state.audio.destination);
            osc.start(now);
            osc.stop(now + 0.17);
        }

        function buildControls() {
            controlsEl.innerHTML = '';
            COLOR_ORDER.forEach(drumId => {
                const drum = DRUMS[drumId];
                const button = document.createElement('button');
                button.type = 'button';
                button.dataset.drum = drumId;
                button.textContent = drum.label;
                button.addEventListener('pointerdown', event => {
                    event.preventDefault();
                    chooseDrum(drumId);
                });
                button.addEventListener('click', () => chooseDrum(drumId));
                controlsEl.appendChild(button);
            });
            layoutControls();
            updateControlHints();
        }

        function layoutControls() {
            const placements = {
                crash: '1 / span 2',
                tom1: '3 / span 2',
                tom2: '5 / span 2',
                ride: '7 / span 2',
                snare: '2 / span 2',
                hihat: '4 / span 2',
                floor: '6 / span 2'
            };
            Object.entries(placements).forEach(([drumId, column]) => {
                const button = controlsEl.querySelector(`[data-drum="${drumId}"]`);
                if (!button) return;
                button.style.gridColumn = column;
                button.style.gridRow = COLOR_ORDER.indexOf(drumId) < 4 ? '1' : '2';
            });
        }

        function updateControlHints() {
            const fullColor = state.rounds >= CONTROL_FULL_COLOR_ROUND;
            const targetId = state.targetBlock?.colorId || null;
            COLOR_ORDER.forEach(drumId => {
                const drum = DRUMS[drumId];
                const button = controlsEl.querySelector(`[data-drum="${drumId}"]`);
                if (!button) return;
                const shouldColor = fullColor || drumId === targetId || drumId === state.selectedColor;
                button.classList.toggle('is-muted', !shouldColor);
                button.classList.toggle('is-target', drumId === targetId && !fullColor);
                button.style.backgroundColor = shouldColor ? drum.color : '#b8bcc9';
                button.style.color = shouldColor && drum.text ? drum.text : '#fff';
            });
        }

        function flashButton(drumId) {
            const button = controlsEl.querySelector(`[data-drum="${drumId}"]`);
            if (!button) return;
            button.classList.add('hit');
            setTimeout(() => button.classList.remove('hit'), 120);
        }

        function buildMidiMap(definitions) {
            return Object.fromEntries(Object.entries(definitions).map(([drumId, item]) => [drumId, item.notes]));
        }

        function buildMidiNoteToDrum(midiMap) {
            const noteToDrumMap = new Map();
            Object.entries(midiMap).forEach(([drumId, notes]) => {
                notes.forEach(note => {
                    if (noteToDrumMap.has(note)) {
                        console.warn(`Duplicated MIDI note ${note}: ${noteToDrumMap.get(note)} / ${drumId}`);
                    }
                    noteToDrumMap.set(note, drumId);
                });
            });
            return noteToDrumMap;
        }

        function noteToDrum(note) {
            return MIDI_NOTE_TO_DRUM.get(note) || null;
        }

        function resolveMidiBurst(buffer) {
            if (!buffer.length) return null;
            const strongestVelocity = Math.max(...buffer.map(hit => hit.velocity));
            return buffer
                .filter(hit => hit.velocity >= strongestVelocity - MIDI_GHOST_VELOCITY_GAP)
                .sort((a, b) => MIDI_PRIORITY.indexOf(a.drumId) - MIDI_PRIORITY.indexOf(b.drumId))[0]?.drumId || null;
        }

        function flushMidiBuffer() {
            if (!state.midiBuffer.length) return;
            state.midiTimer = 0;
            const chosen = resolveMidiBurst(state.midiBuffer);
            state.midiBuffer = [];
            if (!chosen) return;
            state.midiLockUntil = performance.now() + MIDI_AFTER_HIT_LOCK_MS;
            chooseDrum(chosen);
        }

        function handleMidi(note, velocity) {
            if (!velocity || velocity < MIDI_MIN_VELOCITY) return;
            const now = performance.now();
            if (now < state.midiLockUntil) return;
            const drumId = noteToDrum(note);
            if (!drumId) return;
            state.midiBuffer.push({ drumId, velocity });
            if (!state.midiTimer) {
                state.midiTimer = window.setTimeout(flushMidiBuffer, MIDI_BURST_WINDOW_MS);
            }
        }

        function updateMidiStatus(status, text) {
            midiStatusEl.dataset.status = status;
            midiStatusEl.textContent = text;
        }

        async function initMidi() {
            if (!navigator.requestMIDIAccess) {
                updateMidiStatus('blocked', '이 브라우저는 드럼 연결을 지원하지 않아요');
                return;
            }
            try {
                const access = await navigator.requestMIDIAccess();
                const bind = () => {
                    let connectedCount = 0;
                    access.inputs.forEach(input => {
                        connectedCount += 1;
                        input.onmidimessage = event => {
                            const [command, note, velocity] = event.data;
                            if ((command & 0xf0) === 0x90) handleMidi(note, velocity);
                        };
                    });
                    updateMidiStatus(
                        connectedCount > 0 ? 'connected' : 'missing',
                        connectedCount > 0 ? `드럼 연결됨 ${connectedCount}개` : '드럼을 연결해 주세요'
                    );
                };
                bind();
                access.onstatechange = bind;
            } catch (error) {
                updateMidiStatus('blocked', '드럼 권한을 허용해 주세요');
                console.warn('MIDI unavailable', error);
            }
        }

        document.getElementById('btn-start').addEventListener('click', startGame);
        document.getElementById('btn-again').addEventListener('click', startGame);
        btnHowto.addEventListener('click', () => {
            howtoModal.classList.remove('hidden');
        });
        btnHowtoClose.addEventListener('click', () => {
            howtoModal.classList.add('hidden');
        });
        howtoModal.addEventListener('click', event => {
            if (event.target === howtoModal) howtoModal.classList.add('hidden');
        });

        function restartGameBtn() {
            startGame();
        }

        function exitGame() {
            if (confirm('정말 학습을 종료하시겠습니까?')) {
                if (window.history.length > 1) window.history.back();
                else window.location.href = 'https://jueunssam.com/web-study/';
            }
        }

        document.addEventListener('keydown', event => {
            if (event.code === 'Enter' || event.code === 'Space') {
                event.preventDefault();
            }
        });

        window.addEventListener('resize', () => {
            resizeCanvas();
            render();
        });

        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function roundRect(x, y, w, h, r) {
                const radius = Math.min(r, w / 2, h / 2);
                this.moveTo(x + radius, y);
                this.arcTo(x + w, y, x + w, y + h, radius);
                this.arcTo(x + w, y + h, x, y + h, radius);
                this.arcTo(x, y + h, x, y, radius);
                this.arcTo(x, y, x + w, y, radius);
                this.closePath();
            };
        }

        buildControls();
        resizeCanvas();
        state.targetBlock = { side: 'right', colorId: 'crash', seesawIndex: 0 };
        state.targetAngle = RIGHT_HEAVY_ANGLE;
        state.seesawAngle = RIGHT_HEAVY_ANGLE;
        spawnIncomingFromLeft('hihat');
        updateHud();
        render();
        initMidi();
    </script>
