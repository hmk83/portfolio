<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>스마트 드럼 음표/쉼표 찾기</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Music&display=swap" rel="stylesheet">

    <style>
        :root {
            --ui-bg: #1e1e2f;
            --ui-panel: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            margin: 0;
            overflow: hidden;
            background-color: #1a1a2e;
            color: white;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            height: 100vh;
            width: 100vw;
            position: fixed;
            display: flex;
            flex-direction: column;
        }

        .kakao-header {
            background-color: #FEE500;
            color: #3b1e1e;
            width: 100%;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            z-index: 500;
            flex-shrink: 0;
            border-bottom: 2px solid #FBC02D;
        }

        #main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background: linear-gradient(135deg, #1e1e2f 0%, #2d2b42 100%);
            overflow: hidden;
            width: 100%;
            height: 100%;
            transform-origin: center;
        }

        .glow-bg {
            position: absolute;
            width: 60vw;
            height: 60vw;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            z-index: 0;
            animation: pulse-bg 10s infinite alternate;
        }

        .glow-1 {
            top: -20%;
            left: -10%;
            background: #ff0055;
        }

        .glow-2 {
            bottom: -20%;
            right: -10%;
            background: #00ddff;
        }

        @keyframes pulse-bg {
            0% {
                transform: scale(1);
                opacity: 0.1;
            }

            100% {
                transform: scale(1.1);
                opacity: 0.2;
            }
        }

        #status-bar {
            width: 100%;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(5px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .timer-box {
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 1.3rem;
            color: #00e676;
            font-family: monospace;
            font-weight: bold;
            border: 2px solid #00e676;
            box-shadow: 0 0 10px rgba(0, 230, 118, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .progress-box {
            font-size: 1.2rem;
            color: #ff9f1c;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        #question-area {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 5px 20px;
            z-index: 10;
            min-height: 18vh;
        }

        .speech-bubble {
            position: relative;
            background: #fff;
            color: #333;
            padding: 15px 30px;
            border-radius: 20px;
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            border: 4px solid #FEE500;
            animation: float 3s ease-in-out infinite;
            max-width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 15px 15px 0;
            border-style: solid;
            border-color: #FEE500 transparent transparent transparent;
            display: block;
            width: 0;
        }

        .bubble-subtitle {
            font-size: 1.1rem;
            color: #666;
            background: #f0f0f0;
            padding: 4px 15px;
            border-radius: 15px;
            margin-top: 5px;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        /* 드럼 패드 영역 */
        #drum-area {
            position: relative;
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 2vh;
            z-index: 10;
            padding: 1vh 2vw 3vh 2vw;
        }

        .drum-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2vw;
            width: 100%;
        }

        /* 크기가 넉넉한 드럼 패드 */
        .drum-pad {
            position: relative;
            width: 18vh;
            height: 18vh;
            max-width: 23vw;
            max-height: 23vw;
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.1s;
            background-color: #262626;
            border: 1.2vh solid var(--pad-color);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.6);
            -webkit-tap-highlight-color: transparent;
        }

        .drum-pad::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 88%;
            height: 88%;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.05);
            z-index: 1;
        }

        .drum-pad.active {
            transform: scale(0.92);
            border-color: white;
            background-color: #444;
        }

        .drum-pad.wrong {
            border-color: #ff3333 !important;
            background-color: #660000 !important;
            animation: shake-pad 0.4s ease-in-out;
        }

        .drum-pad.correct {
            border-color: #00ff00 !important;
            background-color: #004400 !important;
            box-shadow: 0 0 30px #00ff00;
        }

        .drum-pad::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid var(--pad-color);
            transform: translate(-50%, -50%) scale(1);
            opacity: 0;
            z-index: 0;
            pointer-events: none;
        }

        .drum-pad.active::after {
            animation: ripple-ring 0.3s ease-out;
        }

        @keyframes ripple-ring {
            0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.8;
                border-width: 6px;
            }

            100% {
                transform: translate(-50%, -50%) scale(1.5);
                opacity: 0;
                border-width: 0px;
            }
        }

        .drum-content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            overflow: hidden;
            padding: 10%;
        }

        /* 텍스트 줄바꿈 및 크기 방지 */
        .drum-option-text {
            font-size: clamp(14px, 3.5vw, 24px);
            font-weight: 800;
            color: white;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
            text-align: center;
            word-break: keep-all;
            line-height: 1.1;
        }

        .music-text {
            font-family: 'Noto Music', 'Apple Symbols', 'Segoe UI Symbol', sans-serif;
            line-height: 1;
            display: inline-block;
            font-weight: normal;
        }

        /* 개별 드럼 색상 */
        .pad-crash {
            --pad-color: #ff2e63;
        }

        .pad-tom1 {
            --pad-color: #ff9f1c;
        }

        .pad-tom2 {
            --pad-color: #ffd700;
        }

        .pad-ride {
            --pad-color: #00e676;
        }

        .pad-snare {
            --pad-color: #2979ff;
        }

        .pad-hh {
            --pad-color: #f50057;
        }

        .pad-floor {
            --pad-color: #d500f9;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(5px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: opacity 0.3s;
        }

        .hidden {
            display: none !important;
            opacity: 0;
            pointer-events: none;
        }

        .btn-game-mode {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 1.2rem 2rem;
            border-radius: 20px;
            font-size: 1.6rem;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 250px;
        }

        .btn-game-mode:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-5px);
            border-color: #FEE500;
        }

        .btn-game-mode:active {
            transform: scale(0.95);
        }

        .btn-primary {
            background: linear-gradient(135deg, #FEE500, #FBC02D);
            color: #3b1e1e;
            padding: 1rem 3rem;
            border-radius: 50px;
            font-size: 1.5rem;
            font-weight: bold;
            border: none;
            box-shadow: 0 5px 15px rgba(254, 229, 0, 0.4);
            transition: all 0.2s;
            cursor: pointer;
        }

        .btn-primary:active {
            transform: scale(0.95);
        }

        .flash-red {
            animation: flash-bg 0.4s ease-out;
        }

        @keyframes flash-bg {
            0% {
                background-color: rgba(255, 0, 0, 0.4);
            }

            100% {
                background-color: transparent;
            }
        }

        @keyframes shake-pad {

            0%,
            100% {
                transform: translateX(0);
            }

            20%,
            60% {
                transform: translateX(-8px);
            }

            40%,
            80% {
                transform: translateX(8px);
            }
        }

        .screen-shake {
            animation: shake-screen 0.4s cubic-bezier(.36, .07, .19, .97) both;
        }

        @keyframes shake-screen {

            0%,
            100% {
                transform: translateX(0);
            }

            15% {
                transform: translateX(-6px) rotate(-1deg);
            }

            30% {
                transform: translateX(5px) rotate(1deg);
            }

            45% {
                transform: translateX(-4px) rotate(0deg);
            }

            60% {
                transform: translateX(3px);
            }

            75% {
                transform: translateX(-2px);
            }
        }

        #feedback-effect {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 8rem;
            font-weight: black;
            color: #00ff00;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.8), 0 0 40px #00ff00;
            z-index: 200;
            pointer-events: none;
            opacity: 0;
            transition: all 0.2s;
        }

        #feedback-effect.show-correct {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
            animation: pop-fade 0.6s ease-out forwards;
        }

        @keyframes pop-fade {
            0% {
                transform: translate(-50%, -50%) scale(0.5);
                opacity: 1;
            }

            50% {
                transform: translate(-50%, -50%) scale(1.2);
                opacity: 1;
            }

            100% {
                transform: translate(-50%, -50%) scale(1.5);
                opacity: 0;
            }
        }

        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 90;
        }
    </style>
</head>

<body>
    <canvas id="confetti-canvas"></canvas>

    <div id="red-flash-overlay" class="absolute inset-0 z-50 pointer-events-none transition-colors duration-100"></div>

    <header class="kakao-header">
        <div class="flex items-center gap-2">
            <i data-lucide="music-4" class="text-[#3b1e1e] w-6 h-6"></i>
            <h1 class="text-xl font-bold tracking-tight text-[#3b1e1e]">스마트 드럼: 기호 찾기</h1>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="game.goToHome()"
                class="bg-white text-[#3b1e1e] px-3 py-1.5 rounded-xl text-sm font-bold shadow-sm border border-gray-200 hover:bg-gray-50 transition">
                처음으로
            </button>
            <button onclick="game.showExitModal()"
                class="bg-[#3b1e1e] text-[#FEE500] px-3 py-1.5 rounded-xl text-sm font-bold shadow-sm hover:opacity-90 transition">
                종료하기
            </button>
        </div>
    </header>

    <div id="main-container">
        <div class="glow-bg glow-1"></div>
        <div class="glow-bg glow-2"></div>

        <div id="status-bar" class="hidden">
            <div class="progress-box">
                <i data-lucide="target" class="w-6 h-6"></i>
                <span id="progress-text">1 / 20</span>
            </div>
            <div class="timer-box">
                <i data-lucide="timer" class="w-6 h-6"></i>
                <span id="timer-text">00.00</span>
            </div>
        </div>

        <div id="question-area" class="hidden">
            <div class="speech-bubble" id="speech-bubble">
                <div id="question-text">음표를 찾아보세요!</div>
                <div class="bubble-subtitle" id="question-sub">보기에서 정답을 치세요</div>
            </div>
        </div>

        <div id="feedback-effect">정답!</div>

        <!-- 커진 드럼 패드 영역 -->
        <div id="drum-area" class="hidden">
            <div class="drum-row">
                <div class="drum-pad pad-crash" id="drum-crash" onclick="game.handleInput('crash')">
                    <div class="drum-content" id="content-crash"></div>
                </div>
                <div class="drum-pad pad-tom1" id="drum-tom1" onclick="game.handleInput('tom1')">
                    <div class="drum-content" id="content-tom1"></div>
                </div>
                <div class="drum-pad pad-tom2" id="drum-tom2" onclick="game.handleInput('tom2')">
                    <div class="drum-content" id="content-tom2"></div>
                </div>
                <div class="drum-pad pad-ride" id="drum-ride" onclick="game.handleInput('ride')">
                    <div class="drum-content" id="content-ride"></div>
                </div>
            </div>
            <div class="drum-row">
                <div class="drum-pad pad-snare" id="drum-snare" onclick="game.handleInput('snare')">
                    <div class="drum-content" id="content-snare"></div>
                </div>
                <div class="drum-pad pad-hh" id="drum-hh" onclick="game.handleInput('hh')">
                    <div class="drum-content" id="content-hh"></div>
                </div>
                <div class="drum-pad pad-floor" id="drum-floor" onclick="game.handleInput('floor')">
                    <div class="drum-content" id="content-floor"></div>
                </div>
            </div>
        </div>

        <div id="screen-intro" class="overlay">
            <h1
                class="text-5xl md:text-6xl font-black mb-3 text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-green-300 to-blue-300 drop-shadow-lg tracking-tight text-center leading-tight">
                기호 찾기 타임어택!
            </h1>
            <p class="text-gray-300 font-medium mb-8 text-lg text-center">
                질문에 맞는 드럼을 빠르게 찾아 두드리세요!<br>
                <span class="text-sm text-gray-500 mt-2 block">* 터치 또는 MIDI 드럼 연동 가능</span>
            </p>

            <div id="midi-status"
                class="flex items-center gap-2 bg-white/10 px-5 py-2 rounded-full mb-8 text-gray-300 font-bold text-sm border border-white/10 backdrop-blur">
                <i data-lucide="cable"></i> <span>MIDI 드럼 연결 대기중...</span>
            </div>

            <div class="w-full max-w-4xl flex flex-col md:flex-row justify-center items-center gap-4 px-4">
                <button onclick="game.startGame('note')" class="btn-game-mode hover:shadow-blue-500/30">
                    <span class="text-5xl music-text text-white drop-shadow-md mb-2">𝅘𝅥</span>
                    <span class="text-blue-200">음표 찾기</span>
                </button>
                <button onclick="game.startGame('rest')" class="btn-game-mode hover:shadow-rose-500/30">
                    <span class="text-5xl music-text text-white drop-shadow-md mb-2">𝄽</span>
                    <span class="text-rose-200">쉼표 찾기</span>
                </button>
                <button onclick="game.startGame('mix')" class="btn-game-mode hover:shadow-yellow-500/30">
                    <div class="flex gap-2 mb-2">
                        <span class="text-5xl music-text text-white drop-shadow-md">𝅘𝅥</span>
                        <span class="text-5xl music-text text-white drop-shadow-md">𝄽</span>
                    </div>
                    <span class="text-yellow-200">음표 + 쉼표</span>
                </button>
            </div>
        </div>

        <div id="screen-gameover" class="overlay hidden">
            <h1 class="text-6xl font-black text-white mb-6 drop-shadow-[0_0_15px_rgba(255,215,0,0.8)]">MISSION CLEAR!
            </h1>

            <div
                class="bg-white/10 p-8 rounded-3xl border border-white/20 backdrop-blur-md text-center mb-10 w-full max-w-md">
                <p class="text-gray-300 text-xl mb-2 font-bold">20문제를 모두 맞혔습니다!</p>
                <div class="text-2xl font-medium text-gray-100 mt-4 flex flex-col items-center gap-2">
                    <span>최종 기록</span>
                    <span id="final-time"
                        class="text-yellow-400 text-6xl font-black font-monospace drop-shadow-md">00.00</span>
                    <span class="text-yellow-400 text-xl font-bold">초</span>
                </div>
            </div>

            <button onclick="game.goToHome()" class="btn-primary">다시 도전하기</button>
        </div>

        <!-- 종료 확인 모달 -->
        <div id="modal-exit"
            class="hidden fixed inset-0 z-[9999] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
            <div class="bg-gray-900 rounded-[2rem] p-8 max-w-sm w-full text-center shadow-2xl border border-gray-700">
                <div
                    class="w-16 h-16 mx-auto bg-red-500/20 text-red-500 rounded-full flex items-center justify-center mb-4">
                    <i data-lucide="log-out" class="w-8 h-8"></i>
                </div>
                <h3 class="text-2xl font-bold text-white mb-2">학습 종료</h3>
                <p class="text-gray-300 mb-8 font-sans">정말로 학습을 종료하시겠습니까?</p>
                <div class="flex gap-3 justify-center">
                    <button onclick="game.hideExitModal()"
                        class="flex-1 bg-gray-700 text-white px-4 py-3 rounded-xl font-bold text-lg hover:bg-gray-600 transition-colors">취소</button>
                    <button onclick="game.exitGame()"
                        class="flex-1 bg-red-600 text-white px-4 py-3 rounded-xl font-bold text-lg hover:bg-red-500 transition-colors">종료</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_API_KEY = "AIzaSyAE0nnpOYZRfLkfM09O3NQjpWnN1kUqR3E";

        const DRUM_KEYS = ['crash', 'tom1', 'tom2', 'ride', 'snare', 'hh', 'floor'];
        const DRUMS = {
            'crash': { note: [49, 52, 55, 57], color: '#ff2e63', freq: 880 },
            'tom1': { note: [48, 50], color: '#ff9f1c', freq: 392.00 },
            'tom2': { note: [45, 47], color: '#ffd700', freq: 329.63 },
            'ride': { note: [51, 59], color: '#00e676', freq: 523.25 },
            'snare': { note: [38, 40], color: '#2979ff', freq: 261.63 },
            'hh': { note: [42, 44, 46], color: '#f50057', freq: 987.77 },
            'floor': { note: [41, 43], color: '#d500f9', freq: 196.00 }
        };

        const MUSIC_DATA = [
            // 음표
            { name: "온음표", symbol: "𝅝", type: "note" },
            { name: "점2분음표", symbol: "𝅗𝅥.", type: "note" },
            { name: "2분음표", symbol: "𝅗𝅥", type: "note" },
            { name: "점4분음표", symbol: "𝅘𝅥.", type: "note" },
            { name: "4분음표", symbol: "𝅘𝅥", type: "note" },
            { name: "점8분음표", symbol: "𝅘𝅥𝅮.", type: "note" },
            { name: "8분음표", symbol: "𝅘𝅥𝅮", type: "note" },
            { name: "16분음표", symbol: "𝅘𝅥𝅯", type: "note" },
            // 쉼표
            { name: "온쉼표", symbol: "𝄻", type: "rest" },
            { name: "점2분쉼표", symbol: "𝄼.", type: "rest" },
            { name: "2분쉼표", symbol: "𝄼", type: "rest" },
            { name: "점4분쉼표", symbol: "𝄽.", type: "rest" },
            { name: "4분쉼표", symbol: "𝄽", type: "rest" },
            { name: "점8분쉼표", symbol: "𝄾.", type: "rest" },
            { name: "8분쉼표", symbol: "𝄾", type: "rest" },
            { name: "16분쉼표", symbol: "𝄿", type: "rest" }
        ];

        class SymbolFinderGame {
            constructor() {
                this.mode = '';
                this.totalQuestions = 20;
                this.currentQuestionIndex = 0;

                this.questionQueue = []; // 미리 생성된 문제 큐 추가

                this.startTime = 0;
                this.timerInterval = null;
                this.isGameRunning = false;
                this.isProcessingInput = false;

                this.currentAnswer = null;
                this.currentQuestionType = '';

                this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                this.currentTTS = null;
                this.midiAccess = null;

                this.cCanvas = document.getElementById('confetti-canvas');
                this.cCtx = this.cCanvas.getContext('2d');
                this.cParticles = [];

                this.initMIDI();
                lucide.createIcons();
                this.initConfetti();
            }

            async speak(text) {
                if (!GOOGLE_API_KEY) return;
                if (this.currentTTS) {
                    this.currentTTS.pause();
                    this.currentTTS = null;
                }
                try {
                    const response = await fetch('https://texttospeech.googleapis.com/v1/text:synthesize?key=' + GOOGLE_API_KEY, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            input: { text: text },
                            voice: { languageCode: 'ko-KR', name: 'ko-KR-Neural2-A', ssmlGender: 'FEMALE' },
                            audioConfig: { audioEncoding: 'MP3' }
                        })
                    });
                    if (!response.ok) return;
                    const data = await response.json();
                    const audio = new Audio('data:audio/mp3;base64,' + data.audioContent);
                    this.currentTTS = audio;
                    audio.play();
                } catch (e) {
                    console.error("TTS Error", e);
                }
            }

            playTone(freq, type = 'sine', duration = 0.3) {
                if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
                const osc = this.audioCtx.createOscillator();
                const gain = this.audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.audioCtx.currentTime);
                gain.gain.setValueAtTime(0.3, this.audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.audioCtx.destination);
                osc.start();
                osc.stop(this.audioCtx.currentTime + duration);
            }

            playDrumSound(drumId) {
                const drum = DRUMS[drumId];
                if (!drum) return;
                let type = 'sine';
                if (drumId === 'crash' || drumId === 'ride' || drumId === 'hh') type = 'square';
                if (drumId === 'snare') type = 'triangle';
                this.playTone(drum.freq, type);
            }

            playWrongSound() {
                this.playTone(150, 'sawtooth', 0.2);
                setTimeout(() => this.playTone(100, 'sawtooth', 0.3), 100);
            }

            goToHome() {
                this.isGameRunning = false;
                clearInterval(this.timerInterval);
                document.getElementById('screen-gameover').classList.add('hidden');
                document.getElementById('status-bar').classList.add('hidden');
                document.getElementById('question-area').classList.add('hidden');
                document.getElementById('drum-area').classList.add('hidden');
                document.getElementById('screen-intro').classList.remove('hidden');
            }

            // 종료 모달 표시
            showExitModal() {
                document.getElementById('modal-exit').classList.remove('hidden');
            }

            // 종료 모달 숨김
            hideExitModal() {
                document.getElementById('modal-exit').classList.add('hidden');
            }

            // 실제 학습 종료 (이전 페이지 이동)
            exitGame() {
                this.isGameRunning = false;
                if (this.timerInterval) clearInterval(this.timerInterval);
                window.history.back();
            }

            // 문제 큐 생성 함수
            generateQuestionQueue(mode) {
                this.questionQueue = [];
                const notes = MUSIC_DATA.filter(d => d.type === 'note');
                const rests = MUSIC_DATA.filter(d => d.type === 'rest');

                // 랜덤 아이템 추출 헬퍼 함수
                const getRandomItem = (arr) => arr[Math.floor(Math.random() * arr.length)];

                if (mode === 'note') {
                    for (let i = 0; i < this.totalQuestions; i++) {
                        this.questionQueue.push(getRandomItem(notes));
                    }
                } else if (mode === 'rest') {
                    for (let i = 0; i < this.totalQuestions; i++) {
                        this.questionQueue.push(getRandomItem(rests));
                    }
                } else if (mode === 'mix') {
                    // 쉼표 13문제 추가
                    for (let i = 0; i < 13; i++) {
                        this.questionQueue.push(getRandomItem(rests));
                    }
                    // 음표 7문제 추가
                    for (let i = 0; i < 7; i++) {
                        this.questionQueue.push(getRandomItem(notes));
                    }
                    // 20개의 문제를 섞음
                    this.questionQueue = this.shuffleArray(this.questionQueue);
                }
            }

            startGame(mode) {
                if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
                this.mode = mode;
                this.currentQuestionIndex = 1;
                this.isGameRunning = true;
                this.isProcessingInput = false;

                // 게임 시작 전 문제 큐 세팅
                this.generateQuestionQueue(mode);

                document.getElementById('screen-intro').classList.add('hidden');
                document.getElementById('status-bar').classList.remove('hidden');
                document.getElementById('question-area').classList.remove('hidden');
                document.getElementById('drum-area').classList.remove('hidden');
                document.getElementById('screen-gameover').classList.add('hidden');

                this.startTime = Date.now();
                if (this.timerInterval) clearInterval(this.timerInterval);
                this.timerInterval = setInterval(() => this.updateTimer(), 50);

                this.nextQuestion();
            }

            updateTimer() {
                if (!this.isGameRunning) return;
                const elapsed = (Date.now() - this.startTime) / 1000;
                document.getElementById('timer-text').innerText = elapsed.toFixed(2);
            }

            getFilteredData() {
                if (this.mode === 'note') return MUSIC_DATA.filter(d => d.type === 'note');
                if (this.mode === 'rest') return MUSIC_DATA.filter(d => d.type === 'rest');
                return MUSIC_DATA;
            }

            shuffleArray(array) {
                const arr = [...array];
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            nextQuestion() {
                this.isProcessingInput = false;

                document.getElementById('progress-text').innerText = `${this.currentQuestionIndex} / ${this.totalQuestions}`;

                // 미리 만들어둔 큐에서 문제를 꺼냄
                this.currentAnswer = this.questionQueue[this.currentQuestionIndex - 1];

                const typeRand = Math.random();
                if (typeRand < 0.5) {
                    this.currentQuestionType = 'name_to_symbol';
                } else {
                    this.currentQuestionType = 'symbol_to_name';
                }

                const qText = document.getElementById('question-text');
                const qSub = document.getElementById('question-sub');
                let speakText = "";

                if (this.currentQuestionType === 'name_to_symbol') {
                    qText.innerHTML = `<span class="text-blue-600">${this.currentAnswer.name}</span> 찾아보세요!`;
                    qSub.style.display = 'none';
                    speakText = `${this.currentAnswer.name} 찾아보세요.`;
                } else {
                    qText.innerHTML = `
                        <div class="flex flex-col items-center justify-center w-full">
                            <span class="music-text text-rose-500 mb-2" style="font-size: 4.5rem; text-shadow: 0 4px 10px rgba(0,0,0,0.2);">${this.currentAnswer.symbol}</span>
                            <span style="font-size: 1.8rem;">무엇일까요?</span>
                        </div>
                    `;
                    qSub.style.display = 'none';
                    speakText = `이 기호의 이름은 무엇일까요?`;
                }

                this.speak(speakText);

                // 오답 보기용 풀(전체에서 정답 제외)
                const optionsPool = this.getFilteredData();
                let others = optionsPool.filter(d => d.name !== this.currentAnswer.name);
                others = this.shuffleArray(others).slice(0, 6);

                let options = [this.currentAnswer, ...others];
                options = this.shuffleArray(options);

                for (let i = 0; i < 7; i++) {
                    const drumKey = DRUM_KEYS[i];
                    const contentDiv = document.getElementById(`content-${drumKey}`);
                    const drumPad = document.getElementById(`drum-${drumKey}`);

                    drumPad.classList.remove('correct', 'wrong', 'active');
                    drumPad.dataset.answerName = options[i].name;

                    if (this.currentQuestionType === 'name_to_symbol') {
                        contentDiv.innerHTML = `<span class="music-text" style="font-size: clamp(3.5rem, 7vw, 5.5rem); color: white; text-shadow: 0 4px 10px rgba(0,0,0,0.8);">${options[i].symbol}</span>`;
                    } else {
                        contentDiv.innerHTML = `<span class="drum-option-text">${options[i].name}</span>`;
                    }
                }
            }

            handleInput(drumId) {
                if (!this.isGameRunning || this.isProcessingInput) return;

                const pad = document.getElementById(`drum-${drumId}`);
                if (!pad) return;

                const selectedName = pad.dataset.answerName;

                pad.classList.add('active');
                this.playDrumSound(drumId);
                setTimeout(() => pad.classList.remove('active'), 150);

                if (selectedName === this.currentAnswer.name) {
                    this.isProcessingInput = true;
                    pad.classList.add('correct');
                    this.showCorrectFeedback();

                    if (this.currentQuestionIndex >= this.totalQuestions) {
                        setTimeout(() => this.gameOver(), 600);
                    } else {
                        this.currentQuestionIndex++;
                        setTimeout(() => this.nextQuestion(), 600);
                    }
                } else {
                    this.handleMistake(pad);
                }
            }

            showCorrectFeedback() {
                const fb = document.getElementById('feedback-effect');
                fb.classList.add('show-correct');
                setTimeout(() => fb.classList.remove('show-correct'), 600);
            }

            handleMistake(pad) {
                this.isProcessingInput = true;
                this.playWrongSound();

                pad.classList.add('wrong');
                setTimeout(() => pad.classList.remove('wrong'), 400);

                const container = document.getElementById('main-container');
                const overlay = document.getElementById('red-flash-overlay');

                container.classList.add('screen-shake');
                overlay.classList.add('bg-red-500/30');

                setTimeout(() => {
                    container.classList.remove('screen-shake');
                    overlay.classList.remove('bg-red-500/30');
                    this.isProcessingInput = false;
                }, 400);
            }

            gameOver() {
                this.isGameRunning = false;
                clearInterval(this.timerInterval);

                const finalTime = ((Date.now() - this.startTime) / 1000).toFixed(2);
                document.getElementById('final-time').innerText = finalTime;

                this.speak(`축하합니다! ${finalTime}초 만에 모두 맞혔습니다.`);
                this.fireConfetti(true);

                document.getElementById('screen-gameover').classList.remove('hidden');
            }

            async initMIDI() {
                if (!navigator.requestMIDIAccess) return;
                try {
                    this.midiAccess = await navigator.requestMIDIAccess();
                    this.bindMidi(this.midiAccess);
                    this.midiAccess.onstatechange = (e) => this.bindMidi(e.target);
                } catch (e) { console.warn("MIDI Fail", e); }
            }

            bindMidi(midiAccess) {
                let connected = false;
                for (let input of midiAccess.inputs.values()) {
                    input.onmidimessage = (e) => this.onMidiMessage(e);
                    if (input.state === 'connected') connected = true;
                }
                const el = document.getElementById('midi-status');
                if (connected) {
                    el.className = "flex items-center gap-2 bg-green-500/20 text-green-400 px-4 py-2 rounded-full mb-8 font-bold text-sm border border-green-500/30";
                    el.innerHTML = `<i data-lucide="check-circle"></i> <span>MIDI 드럼 연결 완료! 두드려보세요.</span>`;
                } else {
                    el.className = "flex items-center gap-2 bg-white/10 px-4 py-2 rounded-full mb-8 text-gray-400 font-bold text-sm border border-white/10";
                    el.innerHTML = `<i data-lucide="cable"></i> <span>MIDI 드럼 연결 대기중... (화면 터치 가능)</span>`;
                }
                lucide.createIcons();
            }

            onMidiMessage(e) {
                const [status, note, velocity] = e.data;
                if (status >= 144 && status <= 159 && velocity > 0) {
                    let hitDrum = null;
                    for (const [id, drum] of Object.entries(DRUMS)) {
                        if (drum.note.includes(note)) { hitDrum = id; break; }
                    }
                    if (hitDrum) this.handleInput(hitDrum);
                }
            }

            initConfetti() {
                window.addEventListener('resize', () => {
                    this.cCanvas.width = window.innerWidth;
                    this.cCanvas.height = window.innerHeight;
                });
                this.cCanvas.width = window.innerWidth;
                this.cCanvas.height = window.innerHeight;
                this.animateConfetti();
            }

            fireConfetti(isMassive = false) {
                const colors = ['#ff2e63', '#ff9f1c', '#ffd700', '#00e676', '#2979ff', '#f50057', '#d500f9'];
                const count = isMassive ? 150 : 30;
                for (let i = 0; i < count; i++) {
                    this.cParticles.push({
                        x: window.innerWidth / 2, y: isMassive ? window.innerHeight : window.innerHeight / 2,
                        w: Math.random() * 10 + 5, h: Math.random() * 10 + 5,
                        dx: (Math.random() - 0.5) * (isMassive ? 30 : 15),
                        dy: (Math.random() - 1) * (isMassive ? 30 : 15),
                        color: colors[Math.floor(Math.random() * colors.length)],
                        life: isMassive ? 150 : 80
                    });
                }
            }

            animateConfetti() {
                this.cCtx.clearRect(0, 0, this.cCanvas.width, this.cCanvas.height);
                this.cParticles.forEach((p, i) => {
                    p.x += p.dx; p.y += p.dy; p.dy += 0.8;
                    p.life--;
                    this.cCtx.fillStyle = p.color;
                    this.cCtx.fillRect(p.x, p.y, p.w, p.h);
                    if (p.life <= 0) this.cParticles.splice(i, 1);
                });
                requestAnimationFrame(() => this.animateConfetti());
            }
        }

        window.game = new SymbolFinderGame();
    </script>
