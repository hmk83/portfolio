<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>주은쌤 웹학습</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://unpkg.com">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="./js/web-learning-inventory.js?v=20260602-02"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="./css/jueun-loading.css?v=20260617-01">
    <style>
        :root {
            color-scheme: light;
            --ink: #111827;
            --muted: #64748b;
            --line: #e5e7eb;
            --panel: rgba(255, 255, 255, 0.82);
            --yellow: #ffd600;
            --blue: #2563eb;
            --green: #059669;
            --violet: #7c3aed;
            --rose: #e11d48;
            --shadow: 0 22px 70px rgba(15, 23, 42, 0.11);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--ink);
            background: #f8fafc;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .page {
            width: min(1180px, calc(100% - 32px));
            margin: 0 auto;
            padding: 28px 0 32px;
        }

        .workspace {
            display: block;
            margin-top: 0;
            text-align: left;
        }

        .side {
            border: 1px solid rgba(226, 232, 240, 0.92);
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(18px);
            box-shadow: 0 8px 26px rgba(15, 23, 42, 0.06);
        }

        .side {
            position: sticky;
            top: 0;
            z-index: 30;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            align-items: center;
            gap: 3px;
            width: 100%;
            margin-bottom: 10px;
            padding: 4px;
            overflow: hidden;
            border-radius: 18px;
        }

        .tab {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            width: 100%;
            min-width: 0;
            min-height: 44px;
            padding: 0 10px;
            border: 0;
            border-radius: 14px;
            background: transparent;
            color: #475569;
            text-align: center;
            font-size: 13px;
            font-weight: 900;
            transition: background 0.18s ease, color 0.18s ease, transform 0.18s ease;
        }

        .tab:hover {
            background: rgba(241, 245, 249, 0.9);
            color: var(--ink);
        }

        .tab[aria-selected="true"] {
            background: #111827;
            color: #fff;
            box-shadow: 0 14px 28px rgba(15, 23, 42, 0.16);
        }

        .tab:active {
            transform: scale(0.98);
        }

        .tab .icon {
            display: inline-grid;
            place-items: center;
            width: 24px;
            height: 24px;
            border-radius: 9px;
            background: #f8fafc;
            color: var(--ink);
            flex: 0 0 auto;
        }

        .tab[aria-selected="true"] .icon {
            background: var(--yellow);
        }

        .tab.is-disabled {
            opacity: 0.42;
            cursor: not-allowed;
        }

        .content {
            min-height: 640px;
            padding: 0;
            text-align: left;
        }

        .toolbar {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            margin-bottom: 8px;
            padding: 12px;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            background: #fff;
        }

        .toolbar-main,
        .toolbar-filters {
            display: flex;
            align-items: center;
            width: 100%;
        }

        .toolbar-main {
            gap: 12px;
        }

        .toolbar-filters {
            gap: 8px;
            flex-wrap: wrap;
        }

        .search,
        .select,
        .hashtag-filter-button,
        .ranking-switch {
            position: relative;
            height: 40px;
        }

        .search,
        .select {
            display: block;
        }

        .search {
            flex: 1 1 420px;
            min-width: 260px;
        }

        .search i,
        .search svg,
        .select i,
        .select svg {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            pointer-events: none;
            z-index: 2;
        }

        .search i,
        .search svg {
            left: 14px;
        }

        .select i,
        .select svg {
            right: 12px;
        }

        .search input,
        .select select {
            width: 100%;
            height: 40px;
            border: 1px solid #dbe3ee;
            border-radius: 12px;
            background: #fff;
            color: #1f2937;
            outline: 0;
            font-size: 14px;
            font-weight: 700;
        }

        .search input {
            padding: 0 14px 0 42px;
        }

        .select select {
            min-width: 112px;
            padding: 0 38px 0 14px;
            appearance: none;
        }

        .sort-select select {
            min-width: 104px;
        }

        .hashtag-filter-button {
            display: inline-flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            width: 148px;
            border: 1px solid #dbe3ee;
            border-radius: 12px;
            background: #fff;
            padding: 0 12px 0 14px;
            color: #1f2937;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
        }

        .hashtag-filter-button:hover {
            border-color: #94a3b8;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
        }

        .hashtag-filter-button span {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .ranking-control {
            display: none;
            align-items: center;
            gap: 6px;
            width: 112px;
            height: 40px;
        }

        .sort-select {
            width: 112px;
        }

        .content-type-filter {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            width: 156px;
            height: 40px;
            padding: 4px;
            border: 1px solid #dbe3ee;
            border-radius: 12px;
            background: #fff;
        }

        .content-type-filter label {
            position: relative;
            cursor: pointer;
            user-select: none;
        }

        .content-type-filter input {
            position: absolute;
            inline-size: 1px;
            block-size: 1px;
            opacity: 0;
        }

        .content-type-filter span {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            width: 100%;
            height: 30px;
            border-radius: 9px;
            color: #64748b;
            font-size: 13px;
            font-weight: 950;
            transition: background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
        }

        .content-type-filter svg {
            width: 14px;
            height: 14px;
            stroke-width: 2.6;
        }

        .content-type-filter input:checked + span {
            background: #111827;
            color: #fff;
            box-shadow: 0 8px 16px rgba(15, 23, 42, 0.12);
        }

        .ranking-switch {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex: 1 1 auto;
            min-width: 0;
            height: 40px;
            width: 100%;
            border: 1px solid #dbe3ee;
            border-radius: 12px;
            background: #fff;
            padding: 0 11px;
            color: #334155;
            font-size: 13px;
            font-weight: 900;
            cursor: pointer;
            user-select: none;
        }

        .ranking-switch .ranking-label {
            white-space: nowrap;
        }

        .ranking-tooltip {
            position: absolute;
            left: 50%;
            bottom: calc(100% + 10px);
            z-index: 30;
            width: max-content;
            max-width: 270px;
            padding: 10px 12px;
            border-radius: 12px;
            background: #111827;
            color: #fff;
            box-shadow: 0 16px 30px rgba(15, 23, 42, 0.22);
            font-size: 12px;
            font-weight: 850;
            line-height: 1.5;
            text-align: left;
            white-space: normal;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: translate(-50%, 6px);
            transition: opacity 0.16s ease, transform 0.16s ease, visibility 0.16s ease;
        }

        .ranking-tooltip::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 100%;
            width: 10px;
            height: 10px;
            background: #111827;
            transform: translate(-50%, -5px) rotate(45deg);
        }

        .ranking-switch:hover .ranking-tooltip,
        .ranking-switch:focus-within .ranking-tooltip {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, 0);
        }

        .ranking-switch input {
            position: absolute;
            inline-size: 1px;
            block-size: 1px;
            opacity: 0;
        }

        .switch-track {
            position: relative;
            width: 34px;
            height: 20px;
            border-radius: 999px;
            background: #cbd5e1;
            transition: background 0.16s ease;
        }

        .switch-track::after {
            content: "";
            position: absolute;
            top: 3px;
            left: 3px;
            width: 14px;
            height: 14px;
            border-radius: 999px;
            background: #fff;
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.22);
            transition: transform 0.16s ease;
        }

        .ranking-switch input:checked + .switch-track {
            background: #111827;
        }

        .ranking-switch input:checked + .switch-track::after {
            transform: translateX(14px);
        }

        .view-toggle {
            display: inline-grid;
            grid-template-columns: 1fr 1fr;
            justify-self: end;
            flex: 0 0 auto;
            height: 40px;
            padding: 3px;
            border: 1px solid #dbe3ee;
            border-radius: 13px;
            background: #f8fafc;
        }

        .view-toggle button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-width: 76px;
            height: 32px;
            padding: 0 10px;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: #64748b;
            font-size: 13px;
            font-weight: 900;
            white-space: nowrap;
        }

        .view-toggle button[aria-pressed="true"] {
            background: #111827;
            color: #fff;
            box-shadow: 0 8px 16px rgba(15, 23, 42, 0.12);
        }

        .summary {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 16px;
            margin-bottom: 8px;
            padding: 2px 2px 8px;
            background: transparent;
            border: 0;
        }

        .summary h2 {
            display: none;
        }

        .summary p {
            display: none;
        }

        .count {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 30px;
            padding: 0 10px;
            border-radius: 999px;
            background: #f8fafc;
            color: #334155;
            font-size: 12px;
            font-weight: 900;
            white-space: nowrap;
        }

        .filters {
            display: none;
        }

        .filter {
            min-height: 34px;
            padding: 0 12px;
            border: 1px solid #dbe3ee;
            border-radius: 999px;
            background: #fff;
            color: #475569;
            font-size: 13px;
            font-weight: 800;
        }

        .filter.active {
            border-color: #111827;
            background: #111827;
            color: #fff;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
        }

        .list-view {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .card {
            position: relative;
            overflow: hidden;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            background: #fff;
            box-shadow: none;
            cursor: pointer;
            transition: border-color 0.16s ease, box-shadow 0.16s ease, transform 0.16s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: #94a3b8;
            box-shadow: 0 14px 30px rgba(15, 23, 42, 0.12);
        }

        .list-view .card {
            display: grid;
            grid-template-columns: 138px minmax(0, 1fr);
            align-items: stretch;
            min-height: 92px;
            border-radius: 14px;
        }

        .list-view .card:hover {
            transform: translateY(-1px);
        }

        .thumb {
            position: relative;
            aspect-ratio: 16 / 9;
            width: 100%;
            overflow: hidden;
            background: #e2e8f0;
        }

        .list-view .thumb {
            aspect-ratio: auto;
            height: 100%;
            min-height: 92px;
        }

        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.35s ease;
        }

        .play {
            position: absolute;
            right: 10px;
            bottom: 10px;
            display: inline-grid;
            place-items: center;
            width: 38px;
            height: 38px;
            border-radius: 999px;
            border: 0;
            background: var(--yellow);
            color: #111827;
            box-shadow: 0 12px 22px rgba(0, 0, 0, 0.18);
        }

        .play.is-locked {
            border: 1px solid #b91c1c;
            border-radius: 10px;
            background: #ef4444;
            color: #fff;
            box-shadow: 0 10px 20px rgba(185, 28, 28, 0.24);
        }

        .list-view .play {
            right: 12px;
            top: 50%;
            bottom: auto;
            transform: translateY(-50%);
            width: 34px;
            height: 34px;
            box-shadow: 0 8px 16px rgba(15, 23, 42, 0.16);
        }

        .crown-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 12;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.92);
            background: #020617;
            color: #facc15;
            box-shadow: 0 12px 24px rgba(2, 6, 23, 0.34), 0 0 0 3px rgba(250, 204, 21, 0.2);
        }

        .crown-badge svg {
            width: 21px;
            height: 21px;
            stroke-width: 2.7;
            fill: #facc15;
            filter: drop-shadow(0 1px 0 rgba(0, 0, 0, 0.35));
        }

        .card-body {
            min-width: 0;
            padding: 12px 13px 14px;
        }

        .list-view .card-body {
            display: grid;
            align-content: center;
            min-height: 92px;
            padding: 12px 58px 12px 16px;
        }

        .card h3 {
            margin: 0;
            color: #111827;
            font-size: 15px;
            line-height: 1.35;
            letter-spacing: 0;
            word-break: keep-all;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card p {
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin: 5px 0 0;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.55;
            word-break: keep-all;
        }

        .list-view .card p {
            max-width: 100%;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 10px;
        }

        .list-view .tags {
            margin-top: 7px;
        }

        .tag {
            padding: 4px 7px;
            border-radius: 999px;
            background: #f1f5f9;
            color: #475569;
            font-size: 11px;
            font-weight: 800;
        }

        .empty,
        .loading {
            display: grid;
            place-items: center;
            min-height: 360px;
            text-align: center;
            color: var(--muted);
        }

        .empty h3,
        .loading h3 {
            margin: 14px 0 6px;
            color: #111827;
            font-size: 22px;
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(15, 23, 42, 0.46);
            backdrop-filter: blur(8px);
        }

        .modal-backdrop.open {
            display: flex;
        }

        .modal {
            width: min(460px, 100%);
            border-radius: 24px;
            background: #fff;
            box-shadow: 0 28px 90px rgba(15, 23, 42, 0.28);
            overflow: hidden;
            transition: background 0.18s ease, color 0.18s ease;
        }

        .modal.is-request {
            background: #111827;
            color: #fff;
        }

        .modal-head {
            padding: 22px 22px 0;
        }

        .modal-bear {
            display: block;
            width: 118px;
            max-width: 42vw;
            margin: 0 auto 14px;
        }

        .modal-icon {
            display: grid;
            place-items: center;
            width: 48px;
            height: 48px;
            border-radius: 16px;
            background: #fff7cc;
            color: #111827;
        }

        .modal h2 {
            margin: 16px 0 8px;
            font-size: 23px;
            letter-spacing: 0;
            text-align: center;
        }

        .modal p {
            margin: 0;
            color: #475569;
            font-size: 15px;
            line-height: 1.65;
            word-break: keep-all;
            white-space: pre-line;
            text-align: center;
        }

        .modal.is-request p {
            color: #dbe5f1;
        }

        .modal-highlight {
            display: inline-block;
            margin: 2px 0;
            padding: 2px 8px;
            border-radius: 999px;
            background: #fff2a8;
            color: #111827;
            font-weight: 900;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            justify-content: center;
            padding: 18px 22px 22px;
        }

        .modal-actions button,
        .modal-actions a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 0 15px;
            border: 0;
            border-radius: 12px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 900;
        }

        .btn-muted {
            background: #f1f5f9;
            color: #334155;
        }

        .btn-primary {
            background: #111827;
            color: #fff;
        }

        .modal.is-request .btn-muted {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        .modal.is-request .btn-primary {
            background: #ffd91f;
            color: #111827;
        }

        .hashtag-modal {
            width: min(520px, 100%);
            max-height: min(620px, calc(100vh - 48px));
            overflow: hidden;
            border-radius: 24px;
            background: #fff;
            box-shadow: 0 28px 90px rgba(15, 23, 42, 0.28);
        }

        .hashtag-modal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 20px 20px 14px;
            border-bottom: 1px solid #eef2f7;
        }

        .hashtag-modal-head h2 {
            margin: 0;
            color: #111827;
            font-size: 19px;
            letter-spacing: 0;
        }

        .hashtag-close {
            display: inline-grid;
            place-items: center;
            width: 38px;
            height: 38px;
            border: 0;
            border-radius: 12px;
            background: #f8fafc;
            color: #64748b;
            cursor: pointer;
        }

        .hashtag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-height: 420px;
            overflow-y: auto;
            padding: 18px 20px 20px;
        }

        .hashtag-option {
            min-height: 38px;
            border: 1px solid #dbe3ee;
            border-radius: 999px;
            background: #fff;
            padding: 0 14px;
            color: #334155;
            font-size: 13px;
            font-weight: 900;
            cursor: pointer;
            transition: border-color 0.16s ease, background 0.16s ease, color 0.16s ease;
        }

        .hashtag-option:hover,
        .hashtag-option.is-active {
            border-color: #111827;
            background: #111827;
            color: #fff;
        }

        .is-hidden {
            display: none !important;
        }

        .web-learning-loading {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            background: #fff8dc;
            transition: opacity 0.22s ease, visibility 0.22s ease;
        }

        .web-learning-loading.is-hidden {
            pointer-events: none;
            visibility: hidden;
            opacity: 0;
        }

        .web-learning-loading .circle {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 75px;
            animation: rotating 1s ease-in-out infinite;
        }

        @keyframes rotating {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .web-learning-loading .circle::before,
        .web-learning-loading .circle::after {
            position: absolute;
            display: block;
            width: 40px;
            height: 40px;
            content: '';
            border-radius: 50%;
            animation: center 2s ease-in-out infinite;
        }

        @keyframes center {
            50% {
                top: calc(50% - (40px / 2));
                left: calc(50% - (40px / 2));
                background-color: rgba(241, 196, 15, 0.5);
                box-shadow: 0 0 0 rgba(241, 196, 15, 0.5);
            }
        }

        .web-learning-loading .circle::before {
            top: 0;
            left: 0;
            background-color: rgba(210, 105, 30, 0.7);
            color: rgba(241, 196, 15, 0.5);
            box-shadow: 60px 60px 0;
        }

        .web-learning-loading .circle::after {
            top: 0;
            left: calc(100% - 40px);
            background-color: rgba(128, 128, 0, 0.5);
            color: rgba(231, 76, 60, 0.5);
            box-shadow: -60px 60px 0;
        }

        .learner-float {
            position: fixed;
            right: max(18px, env(safe-area-inset-right));
            bottom: max(18px, env(safe-area-inset-bottom));
            z-index: 80;
            display: inline-flex;

        function icon(name, size = 18) {
            return `<i data-lucide="${name}" width="${size}" height="${size}"></i>`;
        }

        function objectParticle(word) {
            if (!word) return '를';
            const last = word.charCodeAt(word.length - 1);
            if (last < 0xac00 || last > 0xd7a3) return '를';
            return ((last - 0xac00) % 28) === 0 ? '를' : '을';
        }

        function programCodeForTab(tabId) {
            return { piano: 'smart_piano', drum: 'smart_drum', art: 'smart_art_talktalk' }[tabId] || '';
        }

        function formatRequestDate(value) {
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return '-';
            return `${date.getFullYear()}.${date.getMonth() + 1}.${date.getDate()} ${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
        }

        function showAccessToast(message, options = {}) {
            let toast = document.getElementById('accessRequestToast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'accessRequestToast';
                toast.setAttribute('role', 'status');
                toast.style.cssText = 'position:fixed;left:50%;bottom:32px;z-index:130;transform:translateX(-50%);max-width:min(520px,calc(100% - 32px));width:max-content;border-radius:22px;background:#dc2626;color:#fff;padding:18px 22px;font-size:16px;font-weight:800;line-height:1.6;text-align:center;box-shadow:0 24px 70px rgba(185,28,28,.35);white-space:pre-line;';
                document.body.appendChild(toast);
            }
            toast.textContent = message;
            toast.hidden = false;
            window.clearTimeout(showAccessToast.timer);
            if (!options.persistent) {
                showAccessToast.timer = window.setTimeout(() => {
                    toast.hidden = true;
                }, 4200);
            }
        }

        function showNoLearningAccessToast() {
            showAccessToast('현재 이 학습을 이용할 권한이 없습니다.\n도입 권한이 승인되면 학습을 시작할 수 있습니다.', { persistent: true });
        }

        function getDb() {
            if (STANDALONE_MODE) return null;
            if (db) return db;
            if (!window.supabase || typeof window.supabase.createClient !== 'function') return null;
            db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            return db;
        }

        function readShadowAuth() {
            try {
                return JSON.parse(localStorage.getItem(SHADOW_AUTH_KEY) || 'null');
            } catch (error) {
                return null;
            }
        }

        async function ensureLearnerAuth(client) {
            const { data: sessionData } = await client.auth.getSession();
            if (sessionData?.session?.user) return sessionData.session.user;

            const shadowAuth = readShadowAuth();
            if (!shadowAuth?.email || !shadowAuth?.password) return null;

            const { data, error } = await client.auth.signInWithPassword({
                email: shadowAuth.email,
                password: shadowAuth.password
            });
            if (error) {
                console.warn('Learner auth unavailable:', error);
                return null;
            }
            return data?.user || null;
        }

        async function resolveLearnerProfileId(client, currentSession) {
            const { data: authData } = await client.auth.getSession();
            const authUser = authData?.session?.user;
            if (authUser?.id) {
                const { data, error } = await client
                    .from('member_profiles')
                    .select('id,name,email,member_type,academy_name,organization_name,academy_region,academy_city,account_status,suspended_until,suspension_reason_code,suspension_reason')
                    .eq('auth_user_id', authUser.id)
                    .maybeSingle();
                if (!error && data?.id) {
                    if (window.JueunMockAuth?.loginMockUser && currentSession?.loggedIn) {
                        window.JueunMockAuth.loginMockUser({
                            ...currentSession,
                            profileId: data.id,
                            displayName: data.name || currentSession.displayName,
                            email: data.email || currentSession.email || '',
                            memberType: data.member_type || currentSession.memberType,
                            academyName: data.academy_name || '',
                            organizationName: data.organization_name || '',
                            academyRegion: data.academy_region || '미지역',
                            academyCity: data.academy_city || '미등록',
                            accountStatus: data.account_status || 'active',
                            suspendedUntil: data.suspended_until || null,
                            suspensionReasonCode: data.suspension_reason_code || '',
                            suspensionReason: data.suspension_reason || ''
                        });
                    }
                    return data.id;
                }
            }

            if (currentSession?.profileId) return currentSession.profileId;

            if (currentSession?.email) {
                const { data, error } = await client
                    .from('member_profiles')
                    .select('id')
                    .eq('email', currentSession.email)
                    .maybeSingle();
                if (!error && data?.id) return data.id;
            }

            return '';
        }

        function sessionAcademySnapshot(currentSession) {
            const sessionData = currentSession || session() || {};
            const memberType = sessionData.memberType || sessionData.member_type || '';
            const academyName = memberType === 'organization'
                ? (sessionData.organizationName || sessionData.organization_name || sessionData.academyName || sessionData.academy_name || '')
                : (sessionData.academyName || sessionData.academy_name || sessionData.organizationName || sessionData.organization_name || '');
            return {
                academyName,
                academyRegion: sessionData.academyRegion || sessionData.academy_region || '미지역',
                academyCity: sessionData.academyCity || sessionData.academy_city || '미등록'
            };
        }

        async function profileAcademySnapshot(client, profileId) {
            if (!client || !profileId) return null;
            const { data, error } = await client
                .from('member_profiles')
                .select('member_type,academy_name,organization_name,academy_region,academy_city')
                .eq('id', profileId)
                .maybeSingle();
            if (error || !data) return null;
            const academyName = data.member_type === 'organization'
                ? (data.organization_name || data.academy_name || '')
                : (data.academy_name || data.organization_name || '');
            return {
                academyName,
                academyRegion: data.academy_region || '미지역',
                academyCity: data.academy_city || '미등록'
            };
        }

        function mergeAcademySnapshot(primary, fallback) {
            return {
                academyName: primary?.academyName || fallback?.academyName || '',
                academyRegion: primary?.academyRegion || fallback?.academyRegion || '미지역',
                academyCity: primary?.academyCity || fallback?.academyCity || '미등록'
            };
        }

        function readSelectedLearner() {
            const stored = safeJson(localStorage.getItem(LEARNER_KEY), null);
            if (stored && typeof stored === 'object') return stored;
            return { mode: 'trial', name: '이름 없이 학습중' };
        }

        function saveSelectedLearner(learner) {
            selectedLearner = learner || { mode: 'trial', name: '이름 없이 학습중' };
            localStorage.setItem(LEARNER_KEY, JSON.stringify(selectedLearner));
        }

        function learnerLabel(learner = selectedLearner) {
            if (!learner || learner.mode === 'trial') return '이름 없이 학습중';
            return learner.name || '학생';
        }

        function readActivePlayLog() {
            return safeJson(localStorage.getItem(ACTIVE_PLAY_LOG_KEY), null);
        }

        function durationFromStartedAt(startedAt) {
            const started = new Date(startedAt).getTime();
            if (!Number.isFinite(started)) return 0;
            return Math.max(0, Math.round((Date.now() - started) / 1000));
        }

        function wait(ms) {
            return new Promise((resolve) => window.setTimeout(resolve, ms));
        }

        async function finalizeActivePlayLog() {
            const activeLog = readActivePlayLog();
            if (!activeLog?.id || !activeLog?.startedAt) return;
            const client = getDb();
            if (!client) return;
            try {
                await ensureLearnerAuth(client);
                const endedAt = new Date().toISOString();
                await client
                    .from('web_learning_play_logs')
                    .update({
                        ended_at: endedAt,
                        last_seen_at: endedAt,
                        duration_seconds: durationFromStartedAt(activeLog.startedAt)
                    })
                    .eq('id', activeLog.id);
            } catch (error) {
                console.warn('Previous play log finalize skipped:', error);
            } finally {
                localStorage.removeItem(ACTIVE_PLAY_LOG_KEY);
            }
        }

        async function beginPlayLog(item) {
            const client = getDb();
            if (!client || !item) return null;
            try {
                await finalizeActivePlayLog();
                const current = session();
                await ensureLearnerAuth(client);
                const profileId = await resolveLearnerProfileId(client, current);
                if (!profileId) return null;
                const academySnapshot = mergeAcademySnapshot(
                    await profileAcademySnapshot(client, profileId),
                    sessionAcademySnapshot(window.JueunMockAuth?.getSession?.() || current)
                );
                const learner = selectedLearner || readSelectedLearner();
                const isTrial = !learner || learner.mode === 'trial';
                const startedAt = new Date().toISOString();
                const payload = {
                    member_profile_id: profileId,
                    student_id: isTrial ? null : learner.id || null,
                    student_name: isTrial ? '이름 없이 학습중' : learner.name || '학생',
                    student_age: isTrial ? null : Number(learner.age || 0) || null,
                    student_gender: isTrial ? null : learner.gender || null,
                    academy_name: academySnapshot.academyName,
                    academy_region: academySnapshot.academyRegion,
                    academy_city: academySnapshot.academyCity,
                    learner_mode: isTrial ? 'trial' : 'student',
                    content_id: String(item.id || ''),
                    content_title: item.title || '제목 없음',
                    category1: item.category1 || '',
                    category2: item.category2 || '',
                    content_url: item.content_url || '',
                    started_at: startedAt,
                    last_seen_at: startedAt,
                    duration_seconds: 0
                };
                const { data, error } = await client
                    .from('web_learning_play_logs')
                    .insert(payload)
                    .select('id,started_at')
                    .single();
                if (error) throw error;
                const activeLog = {
                    id: data.id,
                    startedAt: data.started_at || startedAt,
                    memberProfileId: profileId,
                    studentId: payload.student_id,
                    studentName: payload.student_name,
                    studentGender: payload.student_gender,
                    academyName: payload.academy_name,
                    academyRegion: payload.academy_region,
                    academyCity: payload.academy_city,
                    learnerMode: payload.learner_mode,
                    contentId: payload.content_id,
                    contentTitle: payload.content_title
                };
                localStorage.setItem(ACTIVE_PLAY_LOG_KEY, JSON.stringify(activeLog));
                return activeLog;
            } catch (error) {
                console.warn('Play log start skipped:', error);
                return null;
            }
        }

        function genderLabel(gender) {
            return gender === 'female' ? '여' : '남';
        }

        async function loadLearnerStudents() {
            const current = session();
            const client = getDb();
            if (!client) {
                learnerStudents = [];
                return learnerStudents;
            }
            try {
                await ensureLearnerAuth(client);
                const profileId = await resolveLearnerProfileId(client, current);
                if (!profileId) {
                    learnerStudents = [];
                    return learnerStudents;
                }
                const { data, error } = await client
                    .from('member_students')
                    .select('id,name,age,gender')
                    .eq('member_profile_id', profileId)
                    .order('created_at', { ascending: false });
                if (error) throw error;
                learnerStudents = data || [];
            } catch (error) {
                console.warn('Student list unavailable:', error);
                learnerStudents = [];
            }
            return learnerStudents;
        }

        function inferContentType(raw = {}) {
            const isGameValue = raw?.is_game ?? raw?.isGame;
            if (isGameValue === true || isGameValue === 'true' || isGameValue === 1 || isGameValue === '1') return 'game';
            if (isGameValue === false || isGameValue === 'false' || isGameValue === 0 || isGameValue === '0') return 'learning';
            const text = [
                raw.content_kind,
                raw.content_type,
                raw.type,
                raw.title,
                raw.description,
                raw.category2
            ].filter(Boolean).join(' ').toLowerCase();
            return /(게임|game|레이싱|racing|테트리스|tetris|ufo|rush|퍼즐|puzzle|두더지|스페이스|space|플라이|fly|브레이커|breaker|점프|jump)/i.test(text)
                ? 'game'
                : 'learning';
        }

        function normalizeItem(raw) {
            const isRankedValue = raw?.is_ranked ?? raw?.isRanked ?? raw?.ranked;
            const isHiddenValue = raw?.is_hidden ?? raw?.isHidden ?? raw?.hidden;
            const contentType = inferContentType(raw);
            return {
                id: String(raw?.id || raw?.registeredId || `id_${Math.random().toString(36).slice(2)}`),
                title: String(raw?.title || '제목 없는 학습'),
                description: String(raw?.description || ''),
                category1: String(raw?.category1 || '').trim(),
                category2: String(raw?.category2 || '').trim(),
                content_url: String(raw?.content_url || raw?.contentUrl || raw?.localPath || '#').trim(),
                thumbnail_url: String(raw?.thumbnail_url || raw?.thumbnailUrl || '').trim(),
                created_at: raw?.created_at || raw?.registeredAt || new Date().toISOString(),
                scheduled_at: raw?.scheduled_at || null,
                view_count: Number(raw?.view_count || 0),
                is_popular: raw?.is_popular === true,
                is_ranked: isRankedValue === true || isRankedValue === 'true' || isRankedValue === 1 || isRankedValue === '1',
                is_hidden: isHiddenValue === true || isHiddenValue === 'true' || isHiddenValue === 1 || isHiddenValue === '1',
                is_game: contentType === 'game',
                content_type: contentType,
                midi_required: raw?.midi_required === true || ['스마트피아노', '스마트드럼'].includes(String(raw?.category1 || '').trim())
            };
        }

        function isReleased(item) {
            if (!item.scheduled_at) return true;
            const time = new Date(item.scheduled_at).getTime();
            return !Number.isFinite(time) || time <= Date.now();
        }

            document.getElementById('accessModalCard').classList.add('is-request');
            document.getElementById('accessTitle').textContent = '권한 신청 접수 안내';
            document.getElementById('accessMessage').textContent = `${tab.label} 도입 여부 확인 후 권한 반영까지\n영업일 기준 1-2일 정도 소요될 수 있습니다.\n빠른 권한 처리가 필요하신 경우 고객센터로 문의해 주시면\n확인 후 안내드리겠습니다.`;
            document.getElementById('adoptionConfirm').classList.add('is-hidden');
            document.getElementById('accessContact').classList.remove('is-hidden');
        }

        async function submitAdoptionRequest() {
            const db = getDb();
            const current = session();
            const tab = TABS.find((item) => item.id === requestedAccessTab) || TABS[0];
            const programCode = programCodeForTab(tab.id);

            if (!current.loggedIn) {
                openShellLoginModal();
                return;
            }

            if (!db || !current.loggedIn || !current.profileId || !programCode) {
                showAccessToast('로그인 정보가 확인되지 않습니다.\n다시 로그인 후 권한 신청을 진행해 주세요.');
                return;
            }

            try {
                const result = await db.rpc('submit_program_access_request', {
                    p_member_profile_id: current.profileId,
                    p_program_code: programCode
                });

                if (result.error) throw result.error;

                const request = Array.isArray(result.data) ? result.data[0] : result.data;
                if (request?.already_exists) {
                    showAccessToast(`${formatRequestDate(request.requested_at)}에 신청하였습니다.\n관리자가 확인 중에 있습니다.`);
                    return;
                }

                showAdoptionRequestInfo();
            } catch (error) {
                console.error(error);
                showAccessToast('권한 신청을 저장하지 못했습니다.\n잠시 후 다시 시도하거나 고객센터로 문의해 주세요.');
            }
        }

        function setTab(tabId) {
            currentTab = tabId;
            categoryFilter = 'all';
            rankingFilter = 'all';
            try {
                const url = new URL(window.location.href);
                url.searchParams.set('tab', tabId);
                history.replaceState(null, '', url.toString());
            } catch (error) {}
            render();

        function getFreeItems() {
            if (freeSelection.ids && freeSelection.ids.length > 0) {
                const selected = allData.filter((item) => freeSelection.ids.includes(item.id));
                if (selected.length > 0) return selected;
            }
            const picks = [];
            ['스마트피아노', '스마트드럼', '스마트아트톡톡'].forEach((category) => {
                allData
                    .filter((item) => item.category1 === category && isReleased(item))
                    .slice(0, 3)
                    .forEach((item) => picks.push(item));
            });
            return picks;
        }

        function currentItems() {
            let items = currentTab === 'free' && rankingFilter === 'ranked'
                ? allData
                : currentTab === 'free'
                ? getFreeItems()
                : allData.filter((item) => item.category1 === (TABS.find((tab) => tab.id === currentTab) || {}).category);

            items = items.filter((item) => !item.is_hidden);
            items = items.filter(isReleased);

            if (categoryFilter !== 'all') {
                items = items.filter((item) => item.category2.split(',').map((tag) => tag.trim()).includes(categoryFilter));
            }

            if (contentTypeFilters.size < 2) {
                items = items.filter((item) => contentTypeFilters.has(item.content_type || 'learning'));
            }

            if (rankingFilter === 'ranked') {
                items = items.filter((item) => item.is_ranked === true);
            }

            if (query) {
                const needle = query.toLowerCase();
                items = items.filter((item) => (
                    item.title.toLowerCase().includes(needle) ||
                    item.category1.toLowerCase().includes(needle) ||
                    item.category2.toLowerCase().includes(needle)
                ));
            }

            return [...items].sort((a, b) => {
                if (sortBy === 'popular') return (b.view_count || 0) - (a.view_count || 0);
                if (sortBy === 'oldest') return new Date(a.created_at || 0) - new Date(b.created_at || 0);
                return new Date(b.created_at || 0) - new Date(a.created_at || 0);
            });
        }

        function renderSummary(items) {
            const tab = TABS.find((item) => item.id === currentTab) || TABS[0];
            const title = currentTab === 'free' ? '체험' : tab.label;
            document.getElementById('summary').innerHTML = `<div>
                <h2>${title}</h2>
                <p>${tab.description}</p>
            </div>
            <span class="count">${icon('layers-3', 16)} ${items.length}개 콘텐츠</span>`;
        }

        function renderCategorySelect() {
            const label = document.getElementById('hashtagFilterLabel');
            const list = document.getElementById('hashtagList');
            const items = currentTab === 'free' ? getFreeItems() : allData.filter((item) => item.category1 === (TABS.find((tab) => tab.id === currentTab) || {}).category);
            const tags = new Set();
            items.forEach((item) => {
                item.category2.split(',').map((tag) => tag.trim()).filter(Boolean).forEach((tag) => tags.add(tag));
            });
            const sortedTags = [...tags].sort();
            if (categoryFilter !== 'all' && !tags.has(categoryFilter)) {
                categoryFilter = 'all';
            }
            if (label) {
                label.textContent = categoryFilter === 'all' ? '#해시태그' : `#${categoryFilter}`;
            }
            if (list) {
                list.innerHTML = [
                    `<button type="button" class="hashtag-option ${categoryFilter === 'all' ? 'is-active' : ''}" data-hashtag="all">전체</button>`,
                    ...sortedTags.map((tag) => `<button type="button" class="hashtag-option ${categoryFilter === tag ? 'is-active' : ''}" data-hashtag="${escapeHtml(tag)}">#${escapeHtml(tag)}</button>`)
                ].join('');
            }
        }

        function renderFilters() {
            const wrap = document.getElementById('filters');
            wrap.innerHTML = '';
        }

        function renderRankingSelect() {
            const input = document.getElementById('rankingFilter');
            if (!input) return;
            input.checked = rankingFilter === 'ranked';
        }

        function renderContentTypeFilters() {
            const learningInput = document.getElementById('learningTypeFilter');
            const gameInput = document.getElementById('gameTypeFilter');

            if (gameInput) gameInput.checked = contentTypeFilters.has('game');

        function setLearningMode(mode) {
            categoryFilter = 'all';
            rankingFilter = 'all';
            contentTypeFilters = new Set(mode === 'game' ? ['game'] : ['learning']);
            render();
            showAccessToast(mode === 'game' ? 'E-게임 콘텐츠를 표시합니다.' : 'E-플레이 콘텐츠를 표시합니다.');
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, (char) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            }[char]));
        }

        function imageFor(item) {
            return item.thumbnail_url || FALLBACK_IMAGES[item.category1] || './images/index_001.webp';
        }

        function itemTags(item) {
            return item.category2.split(',').map((tag) => tag.trim()).filter(Boolean).slice(0, 1);
        }

        function card(item, index) {
            const categoryLabel = item.category1 === '스마트아트톡톡' ? '아트톡톡' : item.category1;
            const noAccess = !canAccessCategory(item.category1);
            return `<article class="card">
                <div class="thumb">
                    <img src="${escapeHtml(imageFor(item))}" alt="${escapeHtml(item.title)}" loading="lazy" decoding="async" onerror="this.src='${FALLBACK_IMAGES[item.category1] || './images/index_001.webp'}'">
                    ${item.is_ranked ? `<div class="crown-badge" aria-label="랭킹 학습" title="랭킹 학습"><i data-lucide="crown"></i></div>` : ''}
                    <button class="play${noAccess ? ' is-locked' : ''}" type="button" aria-label="${escapeHtml(item.title)} ${noAccess ? '권한 필요' : '재생'}" data-index="${index}">
                        ${icon(noAccess ? 'lock' : 'play', 18)}
                    </button>
                </div>
                <div class="card-body">
                    <h3>${escapeHtml(item.title)}</h3>
                    <p>${escapeHtml(item.description || `${categoryLabel} 웹 학습 콘텐츠입니다.`)}</p>
                    <div class="tags">
                        <span class="tag">${escapeHtml(categoryLabel || '학습')}</span>
                        ${itemTags(item).map((tag) => `<span class="tag">#${escapeHtml(tag)}</span>`).join('')}
                    </div>
                </div>
            </article>`;
        }

        function renderResults(items) {
            const wrap = document.getElementById('results');
            if (items.length === 0) {
                wrap.className = 'empty';
                wrap.innerHTML = `<div>${icon('search-x', 38)}<h3>표시할 콘텐츠가 없습니다</h3><p>검색어를 바꾸거나 다른 탭을 선택해 주세요.</p></div>`;
                lucide.createIcons();
                return;
            }
            wrap.className = viewMode === 'list' ? 'list-view' : 'grid';
            wrap.innerHTML = items.map(card).join('');
            wrap.querySelectorAll('[data-index]').forEach((button) => {
                button.addEventListener('click', () => openItem(items[Number(button.dataset.index)]));
            });
            wrap.querySelectorAll('.card').forEach((el, index) => {
                el.addEventListener('click', (event) => {
                    if (event.target.closest('button')) return;
                    openItem(items[index]);
                });
            });
            lucide.createIcons();
        }

        function renderViewToggle() {
            const listButton = document.getElementById('listViewButton');
            const cardButton = document.getElementById('cardViewButton');
            if (!listButton || !cardButton) return;
            listButton.setAttribute('aria-pressed', String(viewMode === 'list'));
            cardButton.setAttribute('aria-pressed', String(viewMode === 'card'));
        }

        function render() {
            renderTabs();
            renderCategorySelect();
            renderRankingSelect();
            renderContentTypeFilters();
            renderFilters();
            const items = currentItems();
            renderSummary(items);
            renderViewToggle();
            renderResults(items);
        }

        async function openItem(item) {
            if (!item) return;
            if (STANDALONE_MODE) {
                await startItem(item);
                return;
            }
            if (window.JueunMockAuth?.isAccountRestricted?.(session())) {
                showAccountRestrictionModal();
                return;
            }
            if (!canAccessCategory(item.category1)) {
                showAccessModal(CATEGORY_CODES[item.category1] || currentTab);
                return;
            }
            await startItem(item);
        }

        function buildPlayUrl(item) {
            if (!item.content_url || item.content_url === '#') return;
            const url = new URL(item.content_url, window.location.href);
            return url.toString();
        }

        function isWebLearningPlayableViewport() {
            const width = Math.min(window.innerWidth || 0, window.screen?.width || window.innerWidth || 0);
            const isPortrait = (window.matchMedia && window.matchMedia('(orientation: portrait)').matches)
                || (window.innerHeight || 0) > (window.innerWidth || 0);
            return width >= 1024 && !isPortrait;
        }

        function showWebLearningPlayableModal() {
            document.getElementById('webLearningPlayableModal')?.remove();
            const modal = document.createElement('div');
            modal.id = 'webLearningPlayableModal';
            modal.style.cssText = 'position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(15,23,42,.58);backdrop-filter:blur(10px);';
            modal.innerHTML = `
                <section style="width:min(420px,100%);border:1px solid #e2e8f0;border-radius:28px;background:#fff;padding:28px 24px;text-align:center;box-shadow:0 28px 80px rgba(15,23,42,.22);" role="dialog" aria-modal="true" aria-labelledby="webLearningPlayableTitle">
                    <div style="display:flex;width:56px;height:56px;margin:0 auto;align-items:center;justify-content:center;border-radius:18px;background:#111827;color:#fff;">
                        <i data-lucide="monitor" style="width:28px;height:28px;"></i>
                    </div>
                    <h2 id="webLearningPlayableTitle" style="margin:20px 0 0;color:#0f172a;font-size:21px;font-weight:900;letter-spacing:0;">웹학습 실행 안내</h2>
                    <p style="margin:12px 0 0;color:#475569;font-size:15px;font-weight:800;line-height:1.65;">실행가능 기기<br>태블릿, 노트북, 데스크탑</p>
                    <button type="button" data-web-learning-playable-close style="width:100%;height:46px;margin-top:24px;border:0;border-radius:18px;background:#111827;color:#fff;font-size:14px;font-weight:900;cursor:pointer;">확인</button>
                </section>
            `;
            modal.querySelector('[data-web-learning-playable-close]')?.addEventListener('click', () => modal.remove());
            document.body.appendChild(modal);
            window.lucide?.createIcons?.();
        }

        function ensureWebLearningPlayableViewport() {
            if (isWebLearningPlayableViewport()) return true;
            showWebLearningPlayableModal();
            return false;
        }

        async function startItem(item) {
            if (!ensureWebLearningPlayableViewport()) return;
            item.view_count = (item.view_count || 0) + 1;
            if (!STANDALONE_MODE) persistView(item);
            const url = buildPlayUrl(item);
            if (!url) return;
            if (!STANDALONE_MODE && isLoggedInSession()) {
                const playLogTask = beginPlayLog(item);
                await Promise.race([playLogTask, wait(PLAY_LOG_NAVIGATION_WAIT_MS)]);
                playLogTask.catch((error) => console.warn('Play log background task skipped:', error));
            }
            window.location.href = url;
        }

        async function persistView(item) {
            const client = getDb();
            if (!client) return;
            try {
                await client
                    .from(CONTENTS_TABLE)
                    .update({ view_count: item.view_count })
                    .eq('id', item.id);
                await client.from(VIEW_LOGS_TABLE).insert([{ content_id: item.id, title: item.title, category1: item.category1, viewed_at: new Date().toISOString() }]);
            } catch (error) {
                console.warn('View persistence skipped:', error);
            }
        }

        async function fetchLegacyJson(filename) {
            const response = await fetch(`./load.php?filename=${encodeURIComponent(filename)}&v=${Date.now()}`);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const result = await response.json();
            return result && result.success ? result.data : result;
        }

        function loadInventoryData() {
            const local = Array.isArray(window.WEB_LEARNING_LOCAL_INVENTORY) ? window.WEB_LEARNING_LOCAL_INVENTORY : [];
            return local.map(normalizeItem);
        }

        async function loadContents() {
            if (STANDALONE_MODE) return loadInventoryData();
            const client = getDb();
            if (client) {
                try {
                    const { data, error } = await client
                        .from(CONTENTS_TABLE)
                        .select('id,title,description,category1,category2,content_url,thumbnail_url,scheduled_at,created_at,is_popular,view_count,midi_required,is_ranked,is_game,is_hidden')
                        .order('created_at', { ascending: false });
                    if (error) throw error;
                    if (Array.isArray(data) && data.length > 0) return data.map(normalizeItem);
                } catch (error) {
                    console.warn('Supabase contents unavailable:', error);
                }
            }
            try {
                const legacy = await fetchLegacyJson('contents.json');
                if (Array.isArray(legacy) && legacy.length > 0) return legacy.map(normalizeItem);
            } catch (error) {
                console.warn('Legacy contents unavailable:', error);
            }
            return loadInventoryData();
        }

        async function loadFreeSelection() {
            if (STANDALONE_MODE) return { month: '', ids: [] };
            const client = getDb();
            if (client) {
                try {
                    const { data, error } = await client
                        .from(FREE_SELECTION_TABLE)
                        .select('month,ids')
                        .eq('id', 'default')
                        .maybeSingle();
                    if (error) throw error;
                    if (data && Array.isArray(data.ids)) return { month: data.month || '', ids: data.ids.map(String) };
                } catch (error) {
                    console.warn('Supabase free selection unavailable:', error);
                }
            }
            try {
                const legacy = await fetchLegacyJson('free_selection.json');
                if (legacy && Array.isArray(legacy.ids)) return { month: legacy.month || '', ids: legacy.ids.map(String) };
            } catch (error) {
                console.warn('Legacy free selection unavailable:', error);
            }
            return { month: '', ids: [] };
        }

        function requestedTab() {
            try {
                const tab = new URLSearchParams(window.location.search).get('tab');
                if (TABS.some((item) => item.id === tab)) return tab;
            } catch (error) {}
            return 'free';
        }

        function shouldOpenRankingView() {
            try {
                return new URLSearchParams(window.location.search).get('ranking') === '1';
            } catch (error) {
                return false;
            }
        }

        function redirectToLearnerSelectByInactivity() {
            if (STANDALONE_MODE) return;
            sessionStorage.setItem(INACTIVITY_TOAST_KEY, '10분 동안 반응이 없어 학생 선택 페이지로 이동했습니다.');
            window.location.href = './web-learning-select.html';
        }

        function resetInactivityTimer() {
            window.clearTimeout(inactivityTimer);
            inactivityTimer = window.setTimeout(redirectToLearnerSelectByInactivity, INACTIVITY_LIMIT_MS);
        }

        function startInactivityWatcher() {
            ['click', 'keydown', 'pointerdown', 'mousemove', 'touchstart', 'scroll'].forEach((eventName) => {
                window.addEventListener(eventName, resetInactivityTimer, { passive: true });
            });
            resetInactivityTimer();
        }

        function hideWebLearningLoading() {
            const loader = document.getElementById('webLearningLoading');
            if (!loader) return;
            loader.classList.add('is-hidden');
            window.setTimeout(() => loader.remove(), 260);
        }

        async function init() {
            selectedLearner = readSelectedLearner();
            if (!STANDALONE_MODE) {
                finalizeActivePlayLog();
                startInactivityWatcher();
            }
            document.getElementById('searchInput').addEventListener('input', (event) => {
                query = event.target.value.trim();
                render();
            });
            document.getElementById('hashtagFilterButton').addEventListener('click', openHashtagModal);
            document.getElementById('hashtagModalClose').addEventListener('click', closeHashtagModal);
            document.getElementById('hashtagModal').addEventListener('click', (event) => {
                if (event.target.id === 'hashtagModal') closeHashtagModal();
                const button = event.target.closest('[data-hashtag]');
                if (!button) return;
                categoryFilter = button.dataset.hashtag || 'all';
                closeHashtagModal();
                render();
            });
            document.getElementById('rankingFilter').addEventListener('change', (event) => {
                rankingFilter = event.target.checked ? 'ranked' : 'all';
                render();
                showAccessToast(event.target.checked ? '랭킹 학습만 표시합니다.' : '전체 학습을 표시합니다.');
            });
            document.querySelectorAll('#learningTypeFilter, #gameTypeFilter').forEach((input) => {
                input.addEventListener('change', (event) => {
                    const type = event.target.value;
                    if (event.target.checked) {
                        contentTypeFilters.add(type);
                    } else if (contentTypeFilters.size > 1) {
                        contentTypeFilters.delete(type);
                    } else {
                        event.target.checked = true;
                        showAccessToast('학습 또는 게임 중 하나는 선택되어야 합니다.');
                        return;
                    }
                    render();
                    const labels = [];
                    if (contentTypeFilters.has('learning')) labels.push('학습');
                    if (contentTypeFilters.has('game')) labels.push('게임');
                    showAccessToast(`${labels.join(', ')} 콘텐츠를 표시합니다.`);
                });
            });
            document.getElementById('sortSelect').addEventListener('change', (event) => {
                sortBy = event.target.value;
                render();
            });
            document.getElementById('listViewButton').addEventListener('click', () => {
                viewMode = 'list';
                render();
            });
            document.getElementById('cardViewButton').addEventListener('click', () => {
                viewMode = 'card';
                render();
            });
            document.getElementById('modalClose').addEventListener('click', closeAccessModal);
            document.getElementById('adoptionConfirm').addEventListener('click', submitAdoptionRequest);
            document.getElementById('accessModal').addEventListener('click', (event) => {
                if (event.target.id === 'accessModal') closeAccessModal();
            });
            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape') {
                    closeAccessModal();
                    closeLearnerModal();
                    closeHashtagModal();
                    if (typeof closeRankingInfoModal === 'function') closeRankingInfoModal();
                }
            });
            document.addEventListener('jueun-web-learning-mode-change', (event) => {
                setLearningMode(event.detail?.mode);
            });

            allData = (await loadContents()).filter((item) => item.category1 && !item.is_hidden);
            freeSelection = await loadFreeSelection();
            const tab = requestedTab();
            currentTab = tab;
            if (shouldOpenRankingView()) {
                rankingFilter = 'ranked';
                contentTypeFilters = new Set(['learning', 'game']);
            }
            render();
            if (!STANDALONE_MODE && window.JueunMockAuth?.isAccountRestricted?.(session())) {
                showAccountRestrictionModal();
            } else if (!STANDALONE_MODE && !canAccessTab(currentTab)) {
                showNoLearningAccessToast();
            }
            if (STANDALONE_MODE || document.querySelector('.service-learner-name')) {
                hideWebLearningLoading();
            }
        }

        document.addEventListener('jueun-service-shell-ready', hideWebLearningLoading);

        document.addEventListener('DOMContentLoaded', () => {
            init().catch((error) => {
                console.error(error);
                allData = loadInventoryData();
                render();
                hideWebLearningLoading();
            });
        });
    </script>
</body>

</html>
